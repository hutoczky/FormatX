<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>FormatX Suite Pro</title>
  <style>
    body{margin:0;padding:40px;color:#dceeff;background:#030711;font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    a{color:#58eeff}
  </style>
</head>
<body>
  <h1>FormatX Suite Pro</h1>
  <p>A kért oldal nem található. Visszairányítás a főoldalra.</p>
  <p>The requested page was not found. Redirecting to the home page.</p>
  <p><a href="/?lang=hu">Magyar oldal</a> · <a href="/?lang=en">English site</a></p>
  <script>
    (function () {
      var source = new URL(window.location.href);
      var language = source.searchParams.get('lang');
      if (language !== 'hu' && language !== 'en') {
        try { language = localStorage.getItem('formatx-language'); } catch (_) {}
      }
      if (language !== 'hu' && language !== 'en') {
        language = String(navigator.language || '').toLowerCase().indexOf('hu') === 0 ? 'hu' : 'en';
      }
      var target = new URL('/', window.location.href);
      target.searchParams.set('lang', language);
      window.location.replace(target.href);
    }());
  </script>
</body>
</html>
