<!doctype html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#01040b">
  <title>FormatX — A MAG születése | Live preview</title>
  <link rel="icon" type="image/png" href="./assets/images/formatx-icon-80.png">
  <link rel="stylesheet" href="./styles/formatx-mag-birth-preview-r532.css?v=20260919-r532">
  <script defer src="./scripts/formatx-mag-birth-preview-r532.js?v=20260919-r532"></script>
</head>
<body>
  <main class="fx-birth" data-phase="0" aria-label="FormatX MAG születése előnézet">
    <canvas id="fx-birth-particles" class="fx-birth-particles" aria-hidden="true"></canvas>
    <div class="fx-birth-grid" aria-hidden="true"></div>
    <div class="fx-birth-halo fx-birth-halo--outer" aria-hidden="true"></div>
    <div class="fx-birth-halo fx-birth-halo--inner" aria-hidden="true"></div>
    <div class="fx-birth-axis fx-birth-axis--h" aria-hidden="true"></div>
    <div class="fx-birth-axis fx-birth-axis--v" aria-hidden="true"></div>

    <section class="fx-birth-core" aria-hidden="true">
      <span class="fx-birth-shard fx-birth-shard--n"></span>
      <span class="fx-birth-shard fx-birth-shard--e"></span>
      <span class="fx-birth-shard fx-birth-shard--s"></span>
      <span class="fx-birth-shard fx-birth-shard--w"></span>
      <span class="fx-birth-facet fx-birth-facet--nw"></span>
      <span class="fx-birth-facet fx-birth-facet--ne"></span>
      <span class="fx-birth-facet fx-birth-facet--se"></span>
      <span class="fx-birth-facet fx-birth-facet--sw"></span>
      <i class="fx-birth-nucleus"></i>
      <b class="fx-birth-heart"></b>
    </section>

    <div class="fx-birth-flash" aria-hidden="true"></div>

    <header class="fx-birth-copy">
      <p class="fx-birth-kicker">FORMATX / MAG GENESIS</p>
      <h1>A MAG SZÜLETÉSE</h1>
      <p class="fx-birth-subtitle">Az élő rendszer első impulzusa.</p>
    </header>

    <div class="fx-birth-telemetry" aria-live="polite">
      <output id="fx-birth-percent">000</output>
      <div class="fx-birth-progress" aria-hidden="true"><i id="fx-birth-progress-bar"></i></div>
      <span id="fx-birth-status">ENERGIAMEZŐ ÉBRESZTÉSE</span>
    </div>

    <nav class="fx-birth-actions" aria-label="Előnézet vezérlők">
      <button id="fx-birth-replay" type="button">ÚJRA</button>
      <a href="/">VISSZA A FORMATX-HEZ</a>
    </nav>
  </main>  <!-- production-deploy-marker-r599: MAG birth cinematic intro -->
</body>
</html>
