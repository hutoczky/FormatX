# FormatX cinematic instanced PBR Genome regression
name: Validate FormatX WebGPU and Three.js website

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/scripts/validate-reality-fork.cjs'
      - '.github/scripts/validate-interaction-genome-webgl.cjs'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/scripts/validate-reality-fork.cjs'
      - '.github/scripts/validate-interaction-genome-webgl.cjs'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-webgpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate WebGPU TSL source architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-webgpu-source.py

      - name: Upload WebGPU source architecture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-webgpu-source-architecture-report
          path: webgpu-source-architecture-report.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Validate JavaScript and cinematic Genome source
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-apex.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-transcend-bridge.js
          node --check docs/scifi-ui/scripts/formatx-three-host.js
          node --check docs/scifi-ui/scripts/formatx-three-frame-bootstrap.js
          node --check docs/scifi-ui/scripts/formatx-nextgen-controls.js
          node --check docs/scifi-ui/scripts/formatx-infinite-loop-fix.js
          node --check docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js
          node --check docs/scifi-ui/scripts/experience-entry.js
          node --check docs/scifi-ui/scripts/Experience.js
          node --check docs/scifi-ui/scripts/ExperienceWebGPU.js
          node --check docs/scifi-ui/scripts/WebXRDirector.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js
          node --check docs/scifi-ui/scripts/formatx-category-positioning.js
          node --check docs/scifi-ui/scripts/formatx-origin-proof.js
          node --check docs/scifi-ui/scripts/project-simulator.js
          node --check docs/scifi-ui/scripts/operational-twin-dom-bridge.js
          node --check docs/scifi-ui/scripts/reality-fork-capsule.js
          node --check docs/scifi-ui/scripts/interaction-genome.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          node --check .github/scripts/validate-three-site.cjs
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          node --check .github/scripts/validate-reality-fork.cjs
          node --check .github/scripts/validate-interaction-genome-webgl.cjs
          grep -Fq 'authoritative-wheel-v2' docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js
          grep -Fq 'formatx-infinite-loop-controller-v2.js?v=20260728-loop-v2' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq "getContext('webgl2'" docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq 'drawElementsInstanced' docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq 'interaction-genome-webgl-adapter.js?v=20260728-cinematic-v3' docs/scifi-ui/scripts/living-architecture.js
          grep -Fq 'cinematic-adaptive-v3' docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          grep -Fq 'rgba8-bloom-aces-vignette' docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq 'FormatX 4K Polish' docs/scifi-ui/styles/formatx-4k-polish.css
          ! grep -Fq 'formatx-infinite-loop-fix.js?v=20260727-loop-1' docs/scifi-ui/scripts/igloo-parity.js

      - name: Test Worker and production bundle
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-webgpu-validation

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          python3 -m http.server 4192 --directory docs > "$RUNNER_TEMP/formatx-reality-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4192/scifi-ui/project-simulator.html >/dev/null \
              && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          cat "$RUNNER_TEMP/formatx-reality-http.log"
          exit 1

      - name: Test WebGPU, WebGL2 fallback, Firefox, mobile, reduced motion and two loops
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-three-site.cjs 2>&1 | tee webgpu-browser-report.txt

      - name: Test continuous laptop wheel and touchpad looping
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-laptop-continuous-loop.cjs 2>&1 | tee laptop-continuous-loop-report.txt

      - name: Validate Reality Fork counterfactual replay and capsule proof
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-reality-fork.cjs 2>&1 | tee reality-fork-report.txt

      - name: Validate cinematic 4K Interaction Genome PBR rendering
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-interaction-genome-webgl.cjs 2>&1 | tee interaction-genome-webgl-report.txt

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-webgpu-browser-report
          path: |
            webgpu-browser-report.txt
            laptop-continuous-loop-report.txt
            interaction-genome-webgl-report.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Upload Reality Fork report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-reality-fork-report
          path: reality-fork-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish validation status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='WebGPU, cinematic 4K PBR, laptop loop and Reality Fork passed'
          else
            state='failure'
            description='FormatX production or cinematic 4K validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX WebGPU evolution validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"