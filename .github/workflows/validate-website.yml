name: Validate FormatX product status, Living Core and website

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/scripts/validate-three-site-v4.cjs'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/scripts/validate-reality-fork.cjs'
      - '.github/scripts/validate-interaction-genome-webgl.cjs'
      - '.github/scripts/validate-organism-voice-browser.cjs'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/scripts/validate-three-site-v4.cjs'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/scripts/validate-reality-fork.cjs'
      - '.github/scripts/validate-interaction-genome-webgl.cjs'
      - '.github/scripts/validate-organism-voice-browser.cjs'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read

concurrency:
  group: formatx-product-status-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate canonical product architecture
        run: python3 .github/scripts/validate-webgpu-source.py

      - name: Validate JavaScript and safe startup source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/production-entry.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/platform-status.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-apex.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node --check docs/scifi-ui/scripts/formatx-copy-polish.js
          node --check docs/scifi-ui/scripts/formatx-license-links.js
          node --check docs/scifi-ui/scripts/license-page.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/organism-core-controller.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-voice-foreground.js
          node --check docs/scifi-ui/scripts/organism-core-interaction.js
          node --check docs/scifi-ui/scripts/formatx-three-host-safe.js
          node --check docs/scifi-ui/scripts/formatx-render-visibility.js
          node --check docs/scifi-ui/scripts/formatx-mobile-recovery.js
          node --check docs/scifi-ui/scripts/mobile-webgl-entry.js
          node --check docs/scifi-ui/scripts/mobile-core-engine-v2.js
          node --check docs/scifi-ui/scripts/interaction-genome.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          node --check .github/scripts/validate-three-site.cjs
          node --check .github/scripts/validate-three-site-v4.cjs
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          node --check .github/scripts/validate-reality-fork.cjs
          node --check .github/scripts/validate-interaction-genome-webgl.cjs
          node --check .github/scripts/validate-organism-voice-browser.cjs

          grep -Fq 'safe-ready-v20' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'organism-voice-dock.css?v=20260730-organism-dock-2' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'min-aspect-ratio: 21/9' docs/scifi-ui/styles/organism-voice-dock.css
          grep -Fq 'right: 440px !important' docs/scifi-ui/styles/organism-voice-dock.css
          grep -Fq 'platform-status.js?v=20260730-platform-status-1' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'const HARD_DEADLINE = 700' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'formatx-intro-seen-v1' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'formatx-mobile-unified.js?v=20260730-mobile-unified-1' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'formatx-infinite-scroll.js?v=20260730-infinite-boundary-v4' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'boundary-v4' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'clonedContent: false' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'reinitialisedRenderer: false' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'document.body.appendChild(shell)' docs/scifi-ui/scripts/organism-voice-foreground.js
          grep -Fq 'data-fx-mobile-core-visible="false"' docs/scifi-ui/styles/formatx-mobile-readability.css
          grep -Fq 'fxMobileCoreVisible' docs/scifi-ui/scripts/formatx-render-visibility.js
          grep -Fq -- '--fx-mobile-dock-height: 54px' docs/scifi-ui/styles/formatx-mobile-unified.css
          grep -Fq '/scifi-ui/data/platform-status.json' billing-worker/src/production-entry.js
          grep -Fq '/scifi-ui/test-matrix.html' billing-worker/src/production-entry.js
          grep -Fq '/scifi-ui/data/platform-status.json' worker.js
          grep -Fq '/scifi-ui/test-matrix.html' worker.js
          grep -Fq '/scifi-ui/license.html' billing-worker/src/production-entry.js
          grep -Fq '/scifi-ui/three-stage-mobile.html' billing-worker/src/production-entry.js
          grep -Fq "headers.set('X-Frame-Options', 'SAMEORIGIN')" billing-worker/src/production-entry.js
          ! grep -Fq 'cloneNode' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'data-fx-loop-bridge' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'fetch(' docs/scifi-ui/scripts/organism-voice.js
          ! grep -Fq 'formatx:introcomplete' docs/scifi-ui/scripts/organism-voice.js

      - name: Test Worker and production bundle
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-living-core-validation

      - name: Install Playwright browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        run: |
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          python3 -m http.server 4192 --directory docs > "$RUNNER_TEMP/formatx-reality-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/license.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/downloads/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/test-matrix.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/data/platform-status.json >/dev/null \
              && curl -fsS http://127.0.0.1:4192/scifi-ui/project-simulator.html >/dev/null \
              && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          cat "$RUNNER_TEMP/formatx-reality-http.log"
          exit 1

      - name: Test Living Core, mobile and two loops
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        run: node .github/scripts/validate-three-site-v4.cjs

      - name: Test mobile, desktop and ultrawide Organism dialogue
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-organism-voice-browser.cjs

      - name: Test continuous laptop wheel and touchpad looping
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        run: node .github/scripts/validate-laptop-continuous-loop.cjs

      - name: Validate Reality Fork
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        run: node .github/scripts/validate-reality-fork.cjs

      - name: Validate cinematic Interaction Genome rendering
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-interaction-genome-webgl.cjs
