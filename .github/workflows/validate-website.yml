name: Validate FormatX website

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-igloo-site.cjs'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-igloo-site.cjs'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate source architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('docs/scifi-ui/index.html').read_text(encoding='utf-8')
          igloo_css = Path('docs/scifi-ui/styles/formatx-igloo.css').read_text(encoding='utf-8')
          igloo_js = Path('docs/scifi-ui/scripts/formatx-igloo.js').read_text(encoding='utf-8')
          intro_js = Path('docs/scifi-ui/scripts/formatx-event-horizon.js').read_text(encoding='utf-8')

          required = [
              'docs/scifi-ui/styles/formatx-igloo.css',
              'docs/scifi-ui/scripts/formatx-igloo.js',
              '.github/scripts/validate-igloo-site.cjs',
          ]
          for path in required:
              assert Path(path).is_file(), path

          assert home.count('formatx-igloo.css?v=20260726-igloo-1') == 1
          assert home.count('formatx-igloo.js?v=20260726-igloo-1') == 1
          assert 'id="fx-hero-canvas"' in home
          assert 'class="fx-story"' in home
          assert '15 900 Ft / hó' in home
          assert '29 900 Ft / hó' in home
          assert 'FAILSAFE_DEADLINE' in intro_js
          assert 'prefers-reduced-motion: reduce' in igloo_css
          assert 'ResizeObserver' in igloo_js
          assert 'IntersectionObserver' in igloo_js
          assert 'visibilitychange' in igloo_js
          assert 'devicePixelRatio' in igloo_js
          assert 'fx-chapter-rail' in igloo_js

          obsolete_tokens = (
              'site-ambient-background', 'site-quantum-aurora', 'site-premium-finish',
              'site-art-direction', 'site-contrast-guard', 'commerce-readability',
              'future-5000', 'causal-memory', 'quantum-twin', 'project-hub',
          )
          for token in obsolete_tokens:
              assert token not in home, token

          obsolete_files = [
              'docs/scifi-ui/styles/site-ambient-background.css',
              'docs/scifi-ui/styles/site-quantum-aurora.css',
              'docs/scifi-ui/styles/site-premium-finish.css',
              'docs/scifi-ui/styles/site-art-direction.css',
              'docs/scifi-ui/styles/site-contrast-guard.css',
              'docs/scifi-ui/styles/commerce-readability.css',
              'docs/scifi-ui/scripts/site-ambient-background.js',
              'docs/scifi-ui/scripts/site-art-direction.js',
              'billing-worker/src/production-entry.js',
              '.github/audit/quantum-aurora-status.json',
              '.github/workflows/validate-intro-animation.yml',
          ]
          for path in obsolete_files:
              assert not Path(path).exists(), path

          styles = re.findall(r'<link[^>]+href="([^"]+\.css[^\"]*)"', home)
          scripts = re.findall(r'<script[^>]+src="([^"]+\.js[^\"]*)"', home)
          assert len(styles) == len(set(styles)), styles
          assert len(scripts) == len(set(scripts)), scripts

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-igloo.js
          node --check docs/scifi-ui/scripts/landing.js
          node --check docs/scifi-ui/scripts/pricing-sync.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js
          node --check .github/scripts/validate-igloo-site.cjs

      - name: Test Worker and production bundle
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-site-validation

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          exit 1

      - name: Test Chromium, Firefox, mobile and reduced motion
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        run: node .github/scripts/validate-igloo-site.cjs

      - name: Publish validation status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Igloo experience, Worker and cross-browser validation passed'
          else
            state='failure'
            description='FormatX website validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX unified website validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
