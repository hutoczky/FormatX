name: Validate FormatX APEX website

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-apex-site.cjs'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-apex-site.cjs'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-apex-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate APEX source architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('docs/scifi-ui/index.html').read_text(encoding='utf-8')
          css = Path('docs/scifi-ui/styles/formatx-apex.css').read_text(encoding='utf-8')
          js = Path('docs/scifi-ui/scripts/formatx-apex.js').read_text(encoding='utf-8')
          intro = Path('docs/scifi-ui/scripts/formatx-event-horizon.js').read_text(encoding='utf-8')

          assert home.count('formatx-apex.css?v=20260726-apex-2') == 1
          assert home.count('formatx-apex.js?v=20260726-apex-2') == 1
          assert 'id="fx-apex-canvas"' in home
          assert 'id="fx-particle-canvas"' in home
          assert 'data-flow="3"' in home
          assert '15 900 Ft / hó' in home and '29 900 Ft / hó' in home
          assert 'FAILSAFE_DEADLINE' in intro
          for token in ('webgl2','createRenderer','particles','infinite','data.fxInfinite','formatx:loop'):
              assert token in js, token
          for token in ('prefers-reduced-motion:reduce','scene-loop-clone','loop-toggle'):
              assert token in css, token

          obsolete_tokens = (
              'formatx-igloo','reference-commerce','reference-performance',
              'project-accessibility','professional-sections','pricing-sync',
              'site-ambient-background','site-quantum-aurora','site-premium-finish',
              'site-art-direction','site-contrast-guard','commerce-readability',
              'future-5000','causal-memory','quantum-twin','project-hub',
          )
          for token in obsolete_tokens:
              assert token not in home, token

          obsolete_files = [
              'docs/scifi-ui/styles/formatx-igloo.css',
              'docs/scifi-ui/scripts/formatx-igloo.js',
              'docs/scifi-ui/styles/reference-commerce.css',
              'docs/scifi-ui/styles/reference-performance.css',
              'docs/scifi-ui/styles/project-accessibility.css',
              'docs/scifi-ui/styles/professional-sections.css',
              'docs/scifi-ui/scripts/professional-sections.js',
              'docs/scifi-ui/sections/professional-sections.html',
              'docs/scifi-ui/scripts/landing.js',
              'docs/scifi-ui/scripts/pricing-sync.js',
              '.github/scripts/validate-igloo-site.cjs',
          ]
          for path in obsolete_files:
              assert not Path(path).exists(), path

          styles = re.findall(r'<link[^>]+href="([^"]+\.css[^\"]*)"', home)
          scripts = re.findall(r'<script[^>]+src="([^"]+\.js[^\"]*)"', home)
          assert len(styles) == 2 and len(styles) == len(set(styles)), styles
          assert len(scripts) == 2 and len(scripts) == len(set(scripts)), scripts

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-apex.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js
          node --check .github/scripts/validate-apex-site.cjs

      - name: Test Worker and production bundle
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-apex-validation

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          exit 1

      - name: Test Chromium, Firefox, mobile, reduced motion and two scroll loops
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        run: node .github/scripts/validate-apex-site.cjs

      - name: Publish validation status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='APEX WebGL, infinite scroll and cross-browser validation passed'
          else
            state='failure'
            description='FormatX APEX website validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX APEX website validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
