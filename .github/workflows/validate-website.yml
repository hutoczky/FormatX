name: Validate FormatX canonical content, evidence and visual contracts

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'worker.js'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-content-standard.py'
      - '.github/scripts/validate-content-standard-v2.py'
      - '.github/scripts/validate-public-release-integration.py'
      - '.github/scripts/validate-content-visuals.cjs'
      - '.github/scripts/validate-public-pages-browser.cjs'
      - '.github/scripts/validate-thought-disclosure-browser.cjs'
      - '.github/scripts/validate-real3d-core-v20.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/scripts/production-preflight.cjs'
      - '.github/workflows/sync-current-release.yml'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'worker.js'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-content-standard.py'
      - '.github/scripts/validate-content-standard-v2.py'
      - '.github/scripts/validate-public-release-integration.py'
      - '.github/scripts/validate-content-visuals.cjs'
      - '.github/scripts/validate-public-pages-browser.cjs'
      - '.github/scripts/validate-thought-disclosure-browser.cjs'
      - '.github/scripts/validate-real3d-core-v20.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/scripts/production-preflight.cjs'
      - '.github/workflows/sync-current-release.yml'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read

concurrency:
  group: formatx-canonical-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate canonical data, public pages, release sync and Worker ownership
        run: |
          python3 .github/scripts/validate-content-standard-v2.py
          python3 .github/scripts/validate-public-release-integration.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check content-preview-entry.js
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/production-entry.js
          node --check billing-worker/src/production-content-entry.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/release-metadata.js
          node --check docs/scifi-ui/scripts/formatx-public-shell.js
          node --check docs/scifi-ui/scripts/formatx-content-standard.js
          node --check docs/scifi-ui/scripts/formatx-content-finalizer.js
          node --check docs/scifi-ui/scripts/formatx-platform-surface-finalizer.js
          node --check docs/scifi-ui/scripts/formatx-organism-trust.js
          node --check docs/scifi-ui/scripts/formatx-organism-semantic-state.js
          node --check docs/scifi-ui/scripts/public-evidence-pages.js
          node --check docs/scifi-ui/scripts/formatx-seo.js
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/organism-core-controller.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node --check docs/scifi-ui/scripts/synaptic-thought-disclosure.js
          node --check docs/scifi-ui/scripts/mobile-core-engine-v3.js
          node --check .github/scripts/validate-content-visuals.cjs
          node --check .github/scripts/validate-public-pages-browser.cjs
          node --check .github/scripts/validate-thought-disclosure-browser.cjs
          node --check .github/scripts/validate-real3d-core-v20.cjs
          node --check .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node --check .github/scripts/production-preflight.cjs

      - name: Validate billing Worker and production bundle
        working-directory: billing-worker
        run: |
          set -euo pipefail
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-content-validation

      - name: Install Playwright browser
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start static website
        run: |
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/downloads/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/verification.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/test-matrix.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/known-issues.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/security.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/support.html >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/data/current-release.json >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/data/platform-status.json >/dev/null \
              && curl -fsS http://127.0.0.1:4178/scifi-ui/data/scroll-policy.json >/dev/null \
              && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          exit 1

      - name: Capture and validate visual contracts
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_VISUAL_DIR: artifacts/content-visuals
        run: node .github/scripts/validate-content-visuals.cjs

      - name: Validate every public page and known-issues interaction
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_PUBLIC_ORIGIN: http://127.0.0.1:4178
        run: node .github/scripts/validate-public-pages-browser.cjs

      - name: Validate current production MAG and thought contracts
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node .github/scripts/validate-thought-genome.cjs
          node .github/scripts/validate-thought-disclosure-browser.cjs

      - name: Generate production readiness report
        run: node .github/scripts/production-preflight.cjs

      - name: Verify synchronized download URL when available
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.ok == true and ((.channels.multiplatform // .channels.windows).available == true)' docs/scifi-ui/data/current-release.json >/dev/null; then
            url="$(jq -r '(.channels.multiplatform // .channels.windows).download_url' docs/scifi-ui/data/current-release.json)"
            curl --fail --location --silent --show-error --range 0-0 --max-time 45 "$url" >/dev/null
          else
            echo 'No synchronized official package; versionless fallback is the expected state.'
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formatx-content-and-production-readiness
          path: |
            artifacts/content-visuals
            artifacts/production-readiness.json
          if-no-files-found: warn
          retention-days: 14
