name: Validate FormatX WebGPU and Three.js website

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/workflows/validate-website.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/**'
      - '.github/scripts/validate-three-site.cjs'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-webgpu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate WebGPU TSL source architecture
        shell: python
        run: |
          from pathlib import Path

          home = Path('docs/scifi-ui/index.html').read_text(encoding='utf-8')
          apex = Path('docs/scifi-ui/scripts/formatx-apex.js').read_text(encoding='utf-8')
          loader = Path('docs/scifi-ui/scripts/igloo-parity.js').read_text(encoding='utf-8')
          host = Path('docs/scifi-ui/scripts/formatx-three-host.js').read_text(encoding='utf-8')
          bootstrap = Path('docs/scifi-ui/scripts/formatx-three-frame-bootstrap.js').read_text(encoding='utf-8')
          webgl_engine = Path('docs/scifi-ui/scripts/Experience.js').read_text(encoding='utf-8')
          webgpu_engine = Path('docs/scifi-ui/scripts/ExperienceWebGPU.js').read_text(encoding='utf-8')
          xr = Path('docs/scifi-ui/scripts/WebXRDirector.js').read_text(encoding='utf-8')
          controls = Path('docs/scifi-ui/scripts/formatx-nextgen-controls.js').read_text(encoding='utf-8')
          entry = Path('docs/scifi-ui/scripts/experience-entry.js').read_text(encoding='utf-8')
          stage = Path('docs/scifi-ui/three-stage.html').read_text(encoding='utf-8')
          css = Path('docs/scifi-ui/styles/formatx-three-host.css').read_text(encoding='utf-8')
          nextgen_css = Path('docs/scifi-ui/styles/formatx-nextgen-controls.css').read_text(encoding='utf-8')
          intro = Path('docs/scifi-ui/scripts/formatx-event-horizon.js').read_text(encoding='utf-8')
          static_headers = Path('docs/scifi-ui/_headers').read_text(encoding='utf-8')
          worker = Path('billing-worker/src/production-with-license.js').read_text(encoding='utf-8')

          assert home.count('formatx-apex.css?v=20260726-apex-2') == 1
          assert home.count('formatx-apex.js?v=20260726-apex-2') == 1
          assert 'id="fx-apex-canvas"' in home
          assert 'id="fx-particle-canvas"' in home
          assert 'data-flow="3"' in home
          assert '15 900 Ft / hó' in home and '29 900 Ft / hó' in home
          assert 'FAILSAFE_DEADLINE' in intro

          for token in ('formatx-three-host.js', 'formatx-nextgen-controls.js', 'formatx-three-frame-bootstrap.js', 'formatx-transcend-bridge.js'):
              assert token in loader, token
          for token in ('THREE.WebGLRenderer', 'THREE.PerspectiveCamera', 'CatmullRomCurve3', 'QualityGovernor'):
              assert token in webgl_engine, token
          for token in ('THREE.WebGPURenderer', 'MeshBasicNodeMaterial', 'instancedArray', 'renderer.compute', '500000', 'fragmentNode', 'WebXRDirector', 'setAnimationLoop'):
              assert token in webgpu_engine, token
          for token in ('renderer.xr.enabled = true', 'requestSession(mode', 'immersive-ar', 'immersive-vr', 'renderer.xr.setSession'):
              assert token in xr, token
          for token in ('AudioContext', 'OscillatorNode', 'BiquadFilterNode', 'scheduleBeat', 'scrollVelocity', 'formatx:xrstate'):
              if token == 'OscillatorNode':
                  assert 'createOscillator' in controls
              elif token == 'BiquadFilterNode':
                  assert 'createBiquadFilter' in controls
              elif token == 'scrollVelocity':
                  assert 'VELOCITY' in controls
              else:
                  assert token in controls, token
          for token in ('Float32Array', '__FORMATX_3D_STATE__', 'fx-three-loop-bridge', 'formatx:loop'):
              assert token in host, token
          for token in ('three-stage.html', '20260727-webgpu-1', 'THREE / FRAME ERROR', 'formatx:threeready'):
              assert token in bootstrap, token
          for token in ('experience-entry.js', '20260727-webgpu-1'):
              assert token in stage, token
          for token in ('ExperienceWebGPU.js', "'gpu' in navigator", 'startWebGLExperience', 'fxWebgpu'):
              assert token in entry, token
          for token in ('fx-three-stage-shell', 'fx-three-sound', 'fx-three-loop-bridge'):
              assert token in css, token
          for token in ('fx-nextgen-xr', 'data-fx-webgpu'):
              assert token in nextgen_css, token

          assert 'createRenderer' not in apex
          assert "getContext('webgl2'" not in apex
          assert 'formatx-transcend-lite.js' not in loader
          assert 'worldstage-enhancements.js' not in loader
          assert 'X-Frame-Options' not in static_headers
          assert 'THREE_STAGE_CONTENT_SECURITY_POLICY' in worker
          assert "isThreeStage ? 'SAMEORIGIN' : 'DENY'" in worker
          assert 'https://cdn.jsdelivr.net' in worker and 'https://unpkg.com' in worker
          assert '"frame-ancestors \'self\'"' in worker

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-apex.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-transcend-bridge.js
          node --check docs/scifi-ui/scripts/formatx-three-host.js
          node --check docs/scifi-ui/scripts/formatx-three-frame-bootstrap.js
          node --check docs/scifi-ui/scripts/formatx-nextgen-controls.js
          node --check docs/scifi-ui/scripts/experience-entry.js
          node --check docs/scifi-ui/scripts/Experience.js
          node --check docs/scifi-ui/scripts/ExperienceWebGPU.js
          node --check docs/scifi-ui/scripts/WebXRDirector.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js
          node --check .github/scripts/validate-three-site.cjs

      - name: Test Worker and production bundle
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-webgpu-validation

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-http.log"
          exit 1

      - name: Test WebGPU, WebGL2 fallback, Firefox, mobile, reduced motion and two loops
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-browser/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-three-site.cjs 2>&1 | tee webgpu-browser-report.txt

      - name: Upload WebGPU browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-webgpu-browser-report
          path: webgpu-browser-report.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Publish validation status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='WebGPU TSL, compute, XR and WebGL2 fallback validation passed'
          else
            state='failure'
            description='FormatX WebGPU evolution validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX WebGPU evolution validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
