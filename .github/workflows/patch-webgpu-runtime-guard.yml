name: Patch WebGPU first-frame guard

on:
  push:
    branches:
      - agent/webgpu-tsl-evolution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Apply one deterministic runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/scripts/ExperienceWebGPU.js')
          source = path.read_text(encoding='utf-8')

          if 'this.readySignalled = false;' not in source:
              source = source.replace(
                  '    this.disposed = false;\n    this.quality = 0.72;',
                  '    this.disposed = false;\n    this.readySignalled = false;\n    this.quality = 0.72;',
                  1,
              )

          source = source.replace(
              "    this.resize();\n    this.signalReady();\n    addEventListener('resize', this.onResize, { passive: true });",
              "    this.resize();\n    addEventListener('resize', this.onResize, { passive: true });",
              1,
          )

          if "--fx-experience-engine', 'webgpu-tsl'" not in source:
              source = source.replace(
                  "      root.dataset.fxWebgpu = 'ready';\n      window.parent.dispatchEvent(new CustomEvent('formatx:threeready'));",
                  "      root.dataset.fxWebgpu = 'ready';\n      root.style.setProperty('--fx-experience-engine', 'webgpu-tsl');\n      window.parent.dispatchEvent(new CustomEvent('formatx:threeready'));",
                  1,
              )

          old_block = '''    this.core.update(seconds, this.sceneValue, this.pointerX, this.pointerY, this.quality);
    this.particles.update(
      seconds,
      this.sceneValue,
      this.pointerX,
      this.pointerY,
      this.pointerVX,
      this.pointerVY,
      runtimeState[INDEX.VELOCITY] || 0
    );
    this.volume.mesh.rotation.y = seconds * -0.035;
    this.grid.position.z = -this.scrollValue * 4.2;
    this.renderer.render(this.scene, this.camera);
    this.governor.sample(delta);'''

          new_block = '''    this.core.update(seconds, this.sceneValue, this.pointerX, this.pointerY, this.quality);
    try {
      this.particles.update(
        seconds,
        this.sceneValue,
        this.pointerX,
        this.pointerY,
        this.pointerVX,
        this.pointerVY,
        runtimeState[INDEX.VELOCITY] || 0
      );
      this.volume.mesh.rotation.y = seconds * -0.035;
      this.grid.position.z = -this.scrollValue * 4.2;
      this.renderer.render(this.scene, this.camera);
      if (!this.readySignalled) {
        this.readySignalled = true;
        this.signalReady();
      }
      this.governor.sample(delta);
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      this.dispose();
      dispatchEvent(new CustomEvent('formatx:webgpufatal', { detail: { message } }));
    }'''

          if old_block in source:
              source = source.replace(old_block, new_block, 1)
          elif "formatx:webgpufatal" not in source:
              raise SystemExit('The expected WebGPU frame block is missing')

          required = [
              'this.readySignalled = false;',
              "--fx-experience-engine', 'webgpu-tsl'",
              "formatx:webgpufatal",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'Runtime patch incomplete: {missing}')
          path.write_text(source, encoding='utf-8')

          for workflow_name in [
              '.github/workflows/debug-webgpu-stage.yml',
              '.github/workflows/validate-website.yml',
          ]:
              workflow = Path(workflow_name)
              content = workflow.read_text(encoding='utf-8')
              content = content.replace('playwright@1.55.0', 'playwright@1.62.0')
              content = content.replace('playwright@1.61.1', 'playwright@1.62.0')
              workflow.write_text(content, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/ExperienceWebGPU.js

          if git diff --quiet; then
            echo 'WebGPU runtime guard already applied.'
            exit 0
          fi
          git config user.name 'FormatX WebGPU Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/ExperienceWebGPU.js \
                  .github/workflows/debug-webgpu-stage.yml \
                  .github/workflows/validate-website.yml
          git commit -m 'Guard WebGPU first render and update Chromium validation'
          git push origin HEAD:agent/webgpu-tsl-evolution
