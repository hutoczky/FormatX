name: Patch WebGPU first-frame guard

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Delay readiness until a successful frame and guard runtime failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('docs/scifi-ui/scripts/ExperienceWebGPU.js')
          engine = engine_path.read_text(encoding='utf-8')

          pairs = [
              ("    this.disposed = false;\n    this.quality = 0.72;",
               "    this.disposed = false;\n    this.readySignalled = false;\n    this.quality = 0.72;"),
              ("    this.resize();\n    this.signalReady();\n    addEventListener('resize', this.onResize, { passive: true });",
               "    this.resize();\n    addEventListener('resize', this.onResize, { passive: true });"),
              ("      root.dataset.fxWebgpu = 'ready';\n      window.parent.dispatchEvent(new CustomEvent('formatx:threeready'));",
               "      root.dataset.fxWebgpu = 'ready';\n      root.style.setProperty('--fx-experience-engine', 'webgpu-tsl');\n      window.parent.dispatchEvent(new CustomEvent('formatx:threeready'));"),
              ("    this.particles.update(\n      seconds,",
               "    try {\n      this.particles.update(\n      seconds,"),
              ("    this.renderer.render(this.scene, this.camera);\n    this.governor.sample(delta);",
               "      this.renderer.render(this.scene, this.camera);\n      if (!this.readySignalled) {\n        this.readySignalled = true;\n        this.signalReady();\n      }\n      this.governor.sample(delta);\n    } catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      this.dispose();\n      dispatchEvent(new CustomEvent('formatx:webgpufatal', { detail: { message } }));\n    }"),
          ]
          original = engine
          for old, new in pairs:
              if old in engine:
                  engine = engine.replace(old, new, 1)
              elif new not in engine:
                  raise SystemExit(f'Missing WebGPU runtime marker: {old[:80]}')
          if engine != original:
              engine_path.write_text(engine, encoding='utf-8')

          entry_path = Path('docs/scifi-ui/scripts/experience-entry.js')
          entry = entry_path.read_text(encoding='utf-8')
          entry_pairs = [
              ("const FALLBACK_THREE_URL = 'https://unpkg.com/three@0.185.1/build/three.module.js?module';\n",
               "const FALLBACK_THREE_URL = 'https://unpkg.com/three@0.185.1/build/three.module.js?module';\nlet webGpuFatalFallbackStarted = false;\n"),
              ("      updateParentWebGpuState('ready');\n      return;",
               "      updateParentWebGpuState('initialised');\n      return;"),
              ("startExperience().catch(error => {",
               "addEventListener('formatx:webgpufatal', event => {\n  if (webGpuFatalFallbackStarted) return;\n  webGpuFatalFallbackStarted = true;\n  const message = event.detail && event.detail.message ? event.detail.message : 'webgpu-runtime-failure';\n  updateParentWebGpuState('fallback', message);\n  void startWebGLExperience().catch(error => reportFatal(error));\n});\n\nfunction reportFatal(error) {\n  const message = error instanceof Error ? error.message : String(error);\n  console.error('FormatX Three engine bootstrap failed:', error);\n  try {\n    const parentDocument = window.parent.document;\n    const root = parentDocument.documentElement;\n    root.dataset.fxThree = 'error';\n    root.dataset.fxThreeError = message.slice(0, 180);\n    const telemetry = parentDocument.querySelector('[data-fx-three-telemetry]');\n    if (telemetry) telemetry.textContent = 'THREE / LOAD ERROR';\n    window.parent.dispatchEvent(new CustomEvent('formatx:threeerror', { detail: { message } }));\n  } catch (_) {}\n}\n\nstartExperience().catch(error => {"),
              ("  const message = error instanceof Error ? error.message : String(error);\n  console.error('FormatX Three engine bootstrap failed:', error);\n  try {\n    const parentDocument = window.parent.document;\n    const root = parentDocument.documentElement;\n    root.dataset.fxThree = 'error';\n    root.dataset.fxThreeError = message.slice(0, 180);\n    const telemetry = parentDocument.querySelector('[data-fx-three-telemetry]');\n    if (telemetry) telemetry.textContent = 'THREE / LOAD ERROR';\n    window.parent.dispatchEvent(new CustomEvent('formatx:threeerror', {\n      detail: { message }\n    }));\n  } catch (_) {}\n});",
               "  reportFatal(error);\n});"),
          ]
          original_entry = entry
          for old, new in entry_pairs:
              if old in entry:
                  entry = entry.replace(old, new, 1)
              elif new not in entry:
                  raise SystemExit(f'Missing WebGPU entry marker: {old[:80]}')
          if entry != original_entry:
              entry_path.write_text(entry, encoding='utf-8')

          for workflow_name in [
              '.github/workflows/debug-webgpu-stage.yml',
              '.github/workflows/validate-website.yml',
          ]:
              path = Path(workflow_name)
              source = path.read_text(encoding='utf-8')
              source = source.replace('playwright@1.55.0', 'playwright@1.62.0')
              path.write_text(source, encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'FormatX WebGPU Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/ExperienceWebGPU.js \
                  docs/scifi-ui/scripts/experience-entry.js \
                  .github/workflows/debug-webgpu-stage.yml \
                  .github/workflows/validate-website.yml
          git commit -m 'Guard WebGPU readiness and runtime fallback'
          git push origin HEAD:agent/webgpu-tsl-evolution
