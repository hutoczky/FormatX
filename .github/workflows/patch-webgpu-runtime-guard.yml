name: Patch WebGPU first-frame guard

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Delay readiness until a successful frame and guard runtime failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/scifi-ui/scripts/ExperienceWebGPU.js')
          source = path.read_text(encoding='utf-8')

          if 'this.readySignalled = false;' not in source:
              source = source.replace(
                  '    this.disposed = false;\n',
                  '    this.disposed = false;\n    this.readySignalled = false;\n',
                  1,
              )

          source = source.replace('    this.signalReady();\n', '', 1)

          if "--fx-experience-engine', 'webgpu-tsl'" not in source:
              source = source.replace(
                  "      root.dataset.fxWebgpu = 'ready';\n",
                  "      root.dataset.fxWebgpu = 'ready';\n      root.style.setProperty('--fx-experience-engine', 'webgpu-tsl');\n",
                  1,
              )

          if "formatx:webgpufatal" not in source:
              start = source.index('    this.particles.update(')
              end_marker = '    this.governor.sample(delta);'
              end = source.index(end_marker, start) + len(end_marker)
              block = source[start:end]
              guarded = (
                  '    try {\n'
                  + ''.join('  ' + line + '\n' for line in block.splitlines())
                  + "      if (!this.readySignalled) {\n"
                  + "        this.readySignalled = true;\n"
                  + "        this.signalReady();\n"
                  + "      }\n"
                  + "    } catch (error) {\n"
                  + "      const message = error instanceof Error ? error.message : String(error);\n"
                  + "      this.dispose();\n"
                  + "      dispatchEvent(new CustomEvent('formatx:webgpufatal', { detail: { message } }));\n"
                  + "    }"
              )
              source = source[:start] + guarded + source[end:]

          required = [
              'this.readySignalled = false;',
              "--fx-experience-engine', 'webgpu-tsl'",
              "formatx:webgpufatal",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'WebGPU runtime guard incomplete: {missing}')
          path.write_text(source, encoding='utf-8')

          for workflow_name in [
              '.github/workflows/debug-webgpu-stage.yml',
              '.github/workflows/validate-website.yml',
          ]:
              workflow = Path(workflow_name)
              content = workflow.read_text(encoding='utf-8')
              content = re.sub(r'playwright@1\.(?:55|61)\.\d+', 'playwright@1.62.0', content)
              workflow.write_text(content, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/ExperienceWebGPU.js

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'FormatX WebGPU Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/ExperienceWebGPU.js \
                  .github/workflows/debug-webgpu-stage.yml \
                  .github/workflows/validate-website.yml
          git commit -m 'Guard WebGPU first render and update Chromium validation'
          git push origin HEAD:agent/webgpu-tsl-evolution
