name: One-shot r151 mobile hero stability
on:
  push:
    paths:
      - '.github/workflows/one-shot-r151-mobile-hero-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply r151 mobile hero stability
        run: |
          python3 .github/scripts/patch-r151-mobile-hero.py
          grep -q 'r151-mobile-hero-stability' docs/scifi-ui/index.html
          grep -q 'MOBILE_HERO_STABILITY_STYLE' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -q 'addMobileHeroStability' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          test -f docs/scifi-ui/scripts/formatx-mobile-hero-stability-r151.js
          test -f docs/scifi-ui/styles/formatx-mobile-hero-stability-r151.css
      - name: Publish r151 repair
        run: |
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          git diff --cached --check
          git commit -m '[deploy-production] fix(mobile): stabilize hero and restore downloads r151'
          git push origin HEAD:master
