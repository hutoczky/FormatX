name: Preview mobile reference-lock v57
on:
  push:
    branches: [work/reference-lock-v57]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-v57.js'
      - 'docs/scifi-ui/styles/formatx-core-mobile-v55.css'
      - '.github/workflows/reference-lock-v57-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-v57.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v57-preview"
          cd "$RUNNER_TEMP/v57-preview"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Capture real mobile WebGL2 reference-lock render
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/v57-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/v57-preview"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&reference_lock=v57',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileV57==='ready-v57',null,{timeout:60000});
            await page.waitForTimeout(1400);
            const state=await page.evaluate(()=>{const r=document.documentElement,c=document.querySelector('#hero .hero-space > .fx-core-mobile-v55-stage > .fx-core-mobile-v55-canvas'),b=c?.getBoundingClientRect();return{renderer:r.dataset.fxCoreRenderer,geometry:r.dataset.fxCoreReferenceGeometry,material:r.dataset.fxCoreReferenceMaterial,reactor:r.dataset.fxCoreInternalReactor,v55:r.dataset.fxCoreMobileV55,v57:r.dataset.fxCoreMobileV57,canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,gl:Boolean(c?.getContext('webgl2')),width:b?.width||0,height:b?.height||0,vw:innerWidth,vh:innerHeight};});
            assert.equal(state.renderer,'single-webgl2-mobile-reference-lock-v57');
            assert.equal(state.geometry,'reference-locked-four-point-crystal-v57');
            assert.equal(state.material,'high-luminance-faceted-glass-v57');
            assert.equal(state.reactor,'white-cyan-reactor-layered-rings-v57');
            assert.equal(state.v55,'ready-v55');assert.equal(state.v57,'ready-v57');assert.equal(state.canvases,1);assert.equal(state.gl,true);assert.ok(state.width<=state.vw+1&&state.height<=state.vh+1,JSON.stringify(state));
            await page.screenshot({path:'mobile-reference-v57.png',fullPage:false});
            await context.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload v57 preview
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reference-lock-v57-${{ github.sha }}
          path: ${{ runner.temp }}/v57-preview/mobile-reference-v57.png
          retention-days: 3
