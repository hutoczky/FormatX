name: Verify FormatX apex shell live

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'billing-worker/src/production-content-entry.js'
      - 'docs/scifi-ui/styles/formatx-critical-shell-v56.css'
      - 'docs/scifi-ui/index.html'
      - '.github/workflows/verify-apex-shell-live.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v5

      - name: Derive current production first-frame contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import pathlib,re
          source=pathlib.Path('billing-worker/src/production-content-entry.js').read_text(encoding='utf-8')
          def one(pattern,label):
              m=re.search(pattern,source)
              assert m, f'missing {label} in production source'
              return m.group(1)
          print('FX_EXPECTED_STARTUP_REVISION='+one(r"const STARTUP_REVISION = '([^']+)'",'STARTUP_REVISION'))
          print('FX_EXPECTED_FIRST_FRAME_ATTR='+one(r'data-fx-first-frame-stability-([A-Za-z0-9_-]+)="true"','first-frame stability marker'))
          print('FX_EXPECTED_P0_FIRST_PAINT_ATTR='+one(r'data-fx-p0-first-paint-([A-Za-z0-9_-]+)="true"','P0 first-paint marker'))
          print('FX_EXPECTED_CSS_SCHEDULER='+one(r"headers\.set\('X-FormatX-CSS-Scheduler', '([^']+)'\)",'CSS scheduler owner'))
          print('FX_EXPECTED_MOTION_SCHEDULER='+one(r"headers\.set\('X-FormatX-Motion-Scheduler', '([^']+)'\)",'motion scheduler owner'))
          PY

      - name: Wait for and verify current apex shell contract
        shell: bash
        run: |
          set -euo pipefail
          APEX='https://formatxsuite.com'
          WWW='https://www.formatxsuite.com'
          ok=false
          for attempt in $(seq 1 36); do
            echo "FormatX shell probe $attempt/36"
            tmp="$(mktemp -d)"
            home_code="$(curl -sS --max-time 25 --max-redirs 0 -H 'Cache-Control: no-cache' -D "$tmp/home.headers" -o "$tmp/home.html" -w '%{http_code}' "$APEX/?apex_shell=${GITHUB_RUN_ID}-${attempt}" || true)"
            www_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/www.headers" -o /dev/null -w '%{http_code}' "$WWW/" || true)"
            design_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/design.headers" -o "$tmp/design.css" -w '%{http_code}' "$APEX/scifi-ui/styles/formatx-design-system.css?v=shell-${GITHUB_RUN_ID}" || true)"
            mobile_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/mobile.headers" -o "$tmp/mobile.css" -w '%{http_code}' "$APEX/scifi-ui/styles/formatx-mobile-recovery.css?v=shell-${GITHUB_RUN_ID}" || true)"
            critical_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/critical.headers" -o "$tmp/critical.css" -w '%{http_code}' "$APEX/scifi-ui/styles/formatx-critical-shell-v56.css?v=shell-${GITHUB_RUN_ID}" || true)"
            js_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/core.headers" -o "$tmp/core.js" -w '%{http_code}' "$APEX/scifi-ui/scripts/formatx-core-real3d-v20.js?v=shell-${GITHUB_RUN_ID}" || true)"
            icon_code="$(curl -sS --max-time 25 --max-redirs 0 -D "$tmp/icon.headers" -o "$tmp/icon.bin" -w '%{http_code}' "$APEX/scifi-ui/assets/images/formatx-icon.png?v=shell-${GITHUB_RUN_ID}" || true)"
            marker_code="$(curl -sS --max-time 25 --max-redirs 0 -H 'Cache-Control: no-cache' -o "$tmp/p0-marker.txt" -w '%{http_code}' "$APEX/p0-validation-version.txt?apex_shell=${GITHUB_RUN_ID}-${attempt}" || true)"

            if [[ "$home_code" == 200 && "$www_code" == 302 && "$design_code" == 200 && "$mobile_code" == 200 && "$critical_code" == 200 && "$js_code" == 200 && "$icon_code" == 200 && "$marker_code" == 200 ]]; then
              if python3 - "$tmp" <<'PY'
          import os,pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          def h(name): return (root/name).read_text(errors='replace').replace('\r\n','\n').lower()
          home=(root/'home.html').read_text(errors='replace')
          hh=h('home.headers')
          assert 'content-type: text/html' in hh
          assert re.search(r'content-type:\s*text/css',h('design.headers'))
          assert re.search(r'content-type:\s*text/css',h('mobile.headers'))
          assert re.search(r'content-type:\s*text/css',h('critical.headers'))
          assert 'content-type: application/javascript' in h('core.headers') or 'content-type: text/javascript' in h('core.headers')
          assert 'content-type: image/png' in h('icon.headers')
          assert f'data-fx-first-frame-stability-{os.environ["FX_EXPECTED_FIRST_FRAME_ATTR"]}="true"' in home
          assert f'data-fx-p0-first-paint-{os.environ["FX_EXPECTED_P0_FIRST_PAINT_ATTR"]}="true"' in home
          assert os.environ['FX_EXPECTED_STARTUP_REVISION'].lower() in hh
          assert os.environ['FX_EXPECTED_CSS_SCHEDULER'].lower() in hh
          assert os.environ['FX_EXPECTED_MOTION_SCHEDULER'].lower() in hh
          assert '<base href="/">' in home
          assert 'href="/scifi-ui/styles/formatx-design-system.css' in home
          assert 'href="/scifi-ui/styles/formatx-critical-shell-v56.css' in home
          assert 'src="/scifi-ui/scripts/formatx-core-real3d-v20.js' in home
          assert 'src="/scifi-ui/assets/images/formatx-icon.png' in home
          assert 'location:' not in hh
          wh=h('www.headers')
          assert 'location: https://formatxsuite.com/?_fx_redirect_recovery=1' in wh
          assert 'cache-control: no-store' in wh
          print('PASS: source-derived first-frame and edge/scheduler contract is live with correct MIME types.')
          PY
              then
                if cmp -s docs/p0-validation-version.txt "$tmp/p0-marker.txt"; then
                  ok=true
                  rm -rf "$tmp"
                  break
                fi
                echo 'Functional shell is live; waiting only for the current P0 revision marker.'
              fi
            fi
            echo "home=$home_code www=$www_code design=$design_code mobile=$mobile_code critical=$critical_code js=$js_code icon=$icon_code marker=$marker_code"
            rm -rf "$tmp"
            sleep 10
          done
          [[ "$ok" == true ]]

      - name: Publish live shell status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Current apex first-frame, edge/scheduler contract and typed assets are live'
          else
            state=failure
            description='Apex shell or current first-frame contract verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX apex shell integrity' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
