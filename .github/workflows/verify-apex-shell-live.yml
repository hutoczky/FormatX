name: Verify FormatX apex shell live
run-name: Apex shell live for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-apex-shell-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDITED_SHA }}

      - name: Wait for exact production marker propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://formatxsuite.com/p0-validation-version.txt?apex=${GITHUB_RUN_ID}-$attempt" \
              -o "$RUNNER_TEMP/live-p0.txt" \
              && cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
              echo 'Exact production marker is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production marker did not converge.' >&2
          exit 1

      - name: Verify top-level Worker and apex shell contract
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/verify-apex-shell-r500.cjs
          node .github/scripts/verify-apex-shell-r500.cjs

      - name: Publish live shell status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Top-level Worker, first-frame and apex shell contract are live'
          else
            state=failure
            description='Apex shell or top-level Worker contract verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" \
            -f context='FormatX apex shell integrity' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
