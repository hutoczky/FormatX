name: Native Android compiler diagnostics

on:
  pull_request:
    branches: [master]
    paths:
      - "android-mobile/**"
      - ".github/workflows/native-android-pr-diagnostics.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile native Android and capture output
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --warning-mode all --project-dir android-mobile \
            :app:compileDebugJavaWithJavac :app:lintDebug 2>&1 | tee /tmp/native-android-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Persist compiler diagnostics
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "FormatX Native Android compiler diagnostics"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            grep -E '(^|: )(error:|FAILURE:|Caused by:|What went wrong:)|^e: |^[[:space:]]*symbol:|^[[:space:]]*location:' /tmp/native-android-build.log | tail -n 120 || true
          } > android-mobile/NATIVE_BUILD_ERRORS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-mobile/NATIVE_BUILD_ERRORS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record native Android compiler diagnostics"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Remove stale compiler diagnostics after success
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f android-mobile/NATIVE_BUILD_ERRORS.txt ]]; then
            rm android-mobile/NATIVE_BUILD_ERRORS.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A android-mobile/NATIVE_BUILD_ERRORS.txt
            git commit -m "Clear native Android compiler diagnostics"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Comment compiler diagnostics
        if: steps.compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '## FormatX Native Android fordítási hiba'
            echo
            echo '```text'
            grep -E '(^|: )(error:|FAILURE:|Caused by:|What went wrong:)|^e: |^[[:space:]]*symbol:|^[[:space:]]*location:' /tmp/native-android-build.log | tail -n 80 || true
            echo '```'
            echo
            echo "Teljes futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-comment.md

      - name: Fail when compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
