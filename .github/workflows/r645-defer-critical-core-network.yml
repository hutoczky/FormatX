name: R645 defer critical-core network until first contentful paint

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r645-defer-critical-core-network.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Defer critical-core href until FCP
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r645.py
          python3 -m py_compile /tmp/r645.py
          python3 /tmp/r645.py
          git diff --check
          grep -Fq 'data-fx-r637-href="./styles/formatx-critical-core-r227.css?v=20260819-r227"' docs/scifi-ui/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/index.html
          git commit -m "R645 defer critical-core network until FCP"
          git push origin HEAD:fix/r533-p0-intro-lcp
