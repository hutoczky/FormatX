name: One-shot align r175 real3d validator
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r175-align-real3d-validator.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Align legacy r174 cache assertion with r175 RAF runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/validate-real3d-core.cjs')
          s=p.read_text()
          old='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r174-idempotent-seam-style'
          new='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r175-raf-throttled'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('expected r168 cache assertion not found')
          p.write_text(s)
          PY
          node .github/scripts/validate-real3d-core.cjs
          node .github/scripts/validate-award-narrative-r175.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'already aligned'; exit 0; fi
          git commit -m 'ci(mag): align real3d cache contract with r175 RAF runtime'
          git push origin HEAD:master
