name: Validate unified FormatX mobile and production architecture

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'worker.js'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - 'billing-worker/wrangler.jsonc'
      - 'billing-worker/src/production-entry.js'
      - 'billing-worker/src/production-content-entry.js'
      - 'docs/scifi-ui/**'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-mobile-intro-recovery.yml'
  pull_request:
    branches: [master]
    paths:
      - 'worker.js'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - 'billing-worker/wrangler.jsonc'
      - 'billing-worker/src/production-entry.js'
      - 'billing-worker/src/production-content-entry.js'
      - 'docs/scifi-ui/**'
      - '.github/scripts/validate-webgpu-source.py'
      - '.github/workflows/validate-mobile-intro-recovery.yml'

permissions:
  contents: read

concurrency:
  group: formatx-unified-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate central architecture contract
        run: python3 .github/scripts/validate-webgpu-source.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check content-preview-entry.js
          node --input-type=module --check < billing-worker/src/production-entry.js
          node --input-type=module --check < billing-worker/src/production-content-entry.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/formatx-return-state-recovery.js
          node --check docs/scifi-ui/scripts/formatx-intro-skip-guard.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-voice-stability.js
          node --check docs/scifi-ui/scripts/organism-master-sync.js
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node --check docs/scifi-ui/scripts/synaptic-thought-disclosure.js

      - name: Validate mobile seamless-scroll contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'platform-scroll-v2' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'mobile-seamless-loading-v1' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "fxAutomaticLoop = mobile ? 'pending-mobile'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'native-momentum-loop-v1' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'scrollend-or-idle-v1' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'formatx-mobile-seamless-loop.css' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'scrollTo(' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'scrollIntoView(' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'cloneNode(' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq 'preventDefault' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'formatx-mobile-production-r5.css' docs/scifi-ui/scripts/formatx-mobile-unified.js
          grep -Fq 'formatx-return-state-recovery.js?v=20260812-return-state-v2' docs/scifi-ui/scripts/formatx-mobile-unified.js
          grep -Fq "const VERSION = 'return-state-v2'" docs/scifi-ui/scripts/formatx-return-state-recovery.js
          grep -Fq 'bfcache-return-recovered' docs/scifi-ui/scripts/formatx-return-state-recovery.js
          grep -Fq 'history-return-recovered' docs/scifi-ui/scripts/formatx-return-state-recovery.js
          grep -Fq 'native-momentum-loop-v1' docs/scifi-ui/scripts/formatx-return-state-recovery.js
          grep -Fq '.fx-award-proof__grid' docs/scifi-ui/styles/formatx-mobile-production-r5.css
          grep -Fq '.fx-plan-qr-card:not(.is-qr-ready)' docs/scifi-ui/styles/formatx-mobile-production-r5.css

      - name: Validate shared seamless runtime and return handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const VERSION = 'seamless-v7'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "formatx-infinite-scroll-desktop-v7.js" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'cloneNode(true)' docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq 'window.scrollTo(' docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq 'scheduleMobileTransfer' docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "addEventListener('scrollend'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          ! grep -Fq "addEventListener('wheel'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          ! grep -Fq "addEventListener('touchmove'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js

      - name: Validate current loader and production delivery
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'safe-ready-v28' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'organism-voice-stability.js?v=20260808-mobile-visual-viewport-1' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq '20260811-mobile-intro-direct-r1' docs/scifi-ui/index.html
          grep -Fq '20260811-mobile-intro-direct-r1' billing-worker/src/production-content-entry.js
          grep -Fq 'data-fx-seamless-scroll-runtime' billing-worker/src/production-entry.js
          grep -Fq '/scifi-ui/scripts/formatx-infinite-scroll.js' billing-worker/src/production-entry.js
          grep -Fq '"status": "full_release"' docs/scifi-ui/data/platform-status.json
          grep -Fq '"trial_days": 5' docs/scifi-ui/data/platform-status.json
