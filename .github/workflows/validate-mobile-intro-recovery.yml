name: Validate deterministic intro, navigation and living organism

on:
  push:
    branches: [master]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/three-stage-mobile.html'
      - 'docs/scifi-ui/styles/formatx-mobile-recovery.css'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/scripts/living-architecture.js'
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - 'docs/scifi-ui/scripts/formatx-three-host-safe.js'
      - 'docs/scifi-ui/scripts/mobile-webgl-entry.js'
      - 'docs/scifi-ui/scripts/mobile-core-engine-v2.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-recovery.js'
      - 'docs/scifi-ui/scripts/organism-interface.js'
      - 'docs/scifi-ui/scripts/organism-menu-controller.js'
      - '.github/workflows/validate-mobile-intro-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-navigation-living-core
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-mobile-recovery.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-three-host-safe.js
          node --check docs/scifi-ui/scripts/organism-interface.js
          node --check docs/scifi-ui/scripts/organism-menu-controller.js
          node --input-type=module --check < docs/scifi-ui/scripts/mobile-webgl-entry.js
          node --input-type=module --check < docs/scifi-ui/scripts/mobile-core-engine-v2.js
          node --input-type=module --check < billing-worker/src/production-entry.js
          node --input-type=module --check < worker.js

      - name: Validate Wrangler routing
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const first = config.assets?.run_worker_first || [];
          const required = [
            '/scifi-ui/',
            '/scifi-ui/index.html',
            '/scifi-ui/styles/formatx-mobile-recovery.css',
            '/scifi-ui/scripts/formatx-mobile-recovery.js',
            '/scifi-ui/scripts/living-architecture.js',
            '/scifi-ui/scripts/mobile-webgl-entry.js',
            '/scifi-ui/scripts/mobile-core-engine-v2.js',
            '/scifi-ui/scripts/organism-interface.js',
            '/scifi-ui/scripts/organism-menu-controller.js',
          ];
          for (const path of required) {
            if (!first.includes(path)) throw new Error(`Missing run_worker_first path: ${path}`);
          }
          if (first.some(path => path.includes('organism-panel-startup-guard'))) {
            throw new Error('Deleted panel startup guard is still routed');
          }
          NODE

      - name: Validate navigation and living organism contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const intro = fs.readFileSync('docs/scifi-ui/scripts/formatx-event-horizon.js', 'utf8');
          const gate = fs.readFileSync('docs/scifi-ui/scripts/formatx-mobile-recovery.js', 'utf8');
          const living = fs.readFileSync('docs/scifi-ui/scripts/living-architecture.js', 'utf8');
          const loader = fs.readFileSync('docs/scifi-ui/scripts/igloo-parity.js', 'utf8');
          const host = fs.readFileSync('docs/scifi-ui/scripts/formatx-three-host-safe.js', 'utf8');
          const entry = fs.readFileSync('docs/scifi-ui/scripts/mobile-webgl-entry.js', 'utf8');
          const engine = fs.readFileSync('docs/scifi-ui/scripts/mobile-core-engine-v2.js', 'utf8');
          const stage = fs.readFileSync('docs/scifi-ui/three-stage-mobile.html', 'utf8');
          const css = fs.readFileSync('docs/scifi-ui/styles/formatx-mobile-recovery.css', 'utf8');
          const organism = fs.readFileSync('docs/scifi-ui/scripts/organism-interface.js', 'utf8');
          const menu = fs.readFileSync('docs/scifi-ui/scripts/organism-menu-controller.js', 'utf8');
          const rootWorker = fs.readFileSync('worker.js', 'utf8');
          const productionEntry = fs.readFileSync('billing-worker/src/production-entry.js', 'utf8');

          const queue = loader.split('const queue =', 2)[1]?.split('];', 1)[0] || '';
          const assertions = [
            [intro.includes('TIMELINE_DURATION'), 'deterministic intro timeline missing'],
            [intro.includes('HARD_DEADLINE'), 'intro hard deadline missing'],
            [!intro.includes('loadOrDeadline'), 'intro must not wait for window load'],
            [gate.includes("root.dataset.fxSafeThreeGate = 'ready-v2'"), 'living core v2 gate marker missing'],
            [gate.includes("return introComplete && started && !failed ? stageUrl.href : 'about:blank'"), 'blank-before-intro contract missing'],
            [living.includes('scheduleThreeExperience()'), '3D loader scheduling missing'],
            [living.includes('organism-interface.js'), 'organism interface is not loaded'],
            [living.includes('organism-menu-controller.js'), 'organism menu controller is not loaded'],
            [loader.includes('formatx-three-host-safe.js'), 'safe host missing from loader'],
            [!queue.includes('interaction-genome-webgl-adapter.js'), 'secondary WebGL still starts eagerly'],
            [host.includes("frame.src = 'about:blank'"), 'safe host must create blank frame'],
            [!host.includes('preventDefault()'), 'safe host must not block native scrolling'],
            [entry.includes('mobile-core-engine-v2.js?v=20260729-living-core-v2'), 'living core v2 engine entry missing'],
            [engine.includes('class LivingCoreEngine'), 'living core v2 class missing'],
            [engine.includes('SphereGeometry(1.28, 96, 72)'), 'smooth high-resolution membrane missing'],
            [engine.includes('const count = 220'), 'reduced particle budget missing'],
            [stage.includes('20260729-living-entry-v2'), 'living stage entry cache version missing'],
            [css.includes('data-fx-safe-three-gate="ready-v2"'), 'v2 layer selector missing'],
            [css.includes('z-index: 120 !important'), 'desktop living-core layer is not visible'],
            [css.includes('.fx-three-telemetry') && css.includes('display: none !important'), 'production telemetry overlap protection missing'],
            [organism.includes('function buildConsole()'), 'working organism console missing'],
            [organism.includes('function openPanel(id, source)'), 'organism panel opening missing'],
            [organism.includes("'data-organism-open': spec.id"), 'organism panel triggers missing'],
            [organism.includes("history.replaceState({}, '', location.pathname + location.search + '#hero')"), 'stale startup hash reset missing'],
            [!organism.includes('removeFullscreenOrganismUi'), 'organism interface is still disabled'],
            [!organism.includes('openHashPanel()'), 'stale hash still auto-opens a panel'],
            [menu.includes('function setOpen(toggle, nav, open)'), 'responsive menu state controller missing'],
            [menu.includes("toggle.addEventListener('click'"), 'menu click handler missing'],
            [menu.includes("ROOT.dataset.fxOrganismMenu = 'ready'"), 'menu ready state missing'],
            [!menu.includes('forceClosed'), 'menu is still permanently forced closed'],
            [rootWorker.includes('20260729-living-core-css-v3'), 'root Worker CSS v3 cache version missing'],
            [!rootWorker.includes('organism-panel-startup-guard'), 'root Worker still injects deleted guard'],
            [productionEntry.includes('/scifi-ui/three-stage-mobile.html'), 'mobile stage framing route missing'],
            [productionEntry.includes("headers.set('X-Frame-Options', 'SAMEORIGIN')"), 'same-origin framing header missing'],
            [!productionEntry.includes('organism-panel-startup-guard'), 'production Worker still injects deleted guard'],
          ];

          for (const [ok, message] of assertions) {
            if (!ok) throw new Error(message);
          }
          NODE
