name: Verify FormatX live hotfix
run-name: Verify live rounded core v50 from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/verify-formatx-live-hotfix.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify both production domains
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://formatxsuite.com https://www.formatxsuite.com; do
            success=false
            for attempt in $(seq 1 30); do
              core_js="$(mktemp)"
              runtime_js="$(mktemp)"
              core_css="$(mktemp)"
              home="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_SHA}-${attempt}" > "$core_js" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/scripts/formatx-core-v50.js?v=${GITHUB_SHA}-${attempt}" > "$runtime_js" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/styles/formatx-core-v50.css?v=${GITHUB_SHA}-${attempt}" > "$core_css" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/?v=${GITHUB_SHA}-${attempt}" > "$home" \
                && grep -Fq 'rounded-living-core-v50' "$core_js" \
                && grep -Fq "const VERSION = 'v50-rounded-living-core'" "$runtime_js" \
                && grep -Fq 'rounded-organic-glass-orb-v50' "$runtime_js" \
                && grep -Fq 'moving-internal-nucleus-spectral-orbits-v50' "$runtime_js" \
                && grep -Fq -- '--fx-core-x: 50%' "$core_css" \
                && ! grep -Fq 'clip-path: polygon' "$core_css" \
                && grep -Fq 'FormatX Suite Pro' "$home"
              then
                success=true
                rm -f "$core_js" "$runtime_js" "$core_css" "$home"
                break
              fi
              rm -f "$core_js" "$runtime_js" "$core_css" "$home"
              sleep 10
            done
            if [[ "$success" != true ]]; then
              echo "Live rounded core v50 verification failed for $origin" >&2
              exit 1
            fi
          done

      - name: Publish live verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live rounded core v50 verified on both production domains'; else state=failure; description='Live rounded core v50 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live rounded core v50' -f description="$description" -f target_url="$TARGET_URL"
