name: Verify FormatX live hotfix
run-name: Verify live mobile hero + MAG v34 from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/verify-formatx-live-hotfix.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify both production domains
        id: live
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://formatxsuite.com https://www.formatxsuite.com; do
            success=false
            for attempt in $(seq 1 24); do
              hero_css="$(mktemp)"
              recovery_css="$(mktemp)"
              mag33_css="$(mktemp)"
              mag33_js="$(mktemp)"
              mag34_css="$(mktemp)"
              mag34_js="$(mktemp)"
              core_js="$(mktemp)"
              home="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/styles/formatx-mobile-hero-flow.css?v=${GITHUB_SHA}-${attempt}" > "$hero_css" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/styles/formatx-mobile-recovery.css?v=${GITHUB_SHA}-${attempt}" > "$recovery_css" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/styles/formatx-mobile-mag-v33.css?v=${GITHUB_SHA}-${attempt}" > "$mag33_css" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/scripts/formatx-mobile-mag-v33.js?v=${GITHUB_SHA}-${attempt}" > "$mag33_js" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/styles/formatx-mag-reference-v34.css?v=${GITHUB_SHA}-${attempt}" > "$mag34_css" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/scripts/formatx-mag-reference-v34.js?v=${GITHUB_SHA}-${attempt}" > "$mag34_js" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_SHA}-${attempt}" > "$core_js" \
                && curl --fail --silent --show-error --location --max-time 30 \
                   "$origin/scifi-ui/?v=${GITHUB_SHA}-${attempt}" > "$home" \
                && grep -Fq 'mobile hero overflow fix' "$hero_css" \
                && grep -Fq 'white-space: normal !important;' "$hero_css" \
                && grep -Fq 'padding-bottom: max(104px' "$hero_css" \
                && grep -Fq 'The Interaction Genome is a separate feature' "$recovery_css" \
                && grep -Fq 'FormatX MAG v33' "$mag33_css" \
                && grep -Fq 'data-fx-mobile-text-guard="text"' "$mag33_css" \
                && grep -Fq 'fxMobileMagTextGuard' "$mag33_js" \
                && grep -Fq 'FormatX MAG reference v34' "$mag34_css" \
                && grep -Fq 'fx-v34-reactor' "$mag34_css" \
                && grep -Fq 'fxMagReferenceV34' "$mag34_js" \
                && grep -Fq 'formatx-mag-reference-v34.css?v=20260810-mag-reference-v34-1' "$core_js" \
                && grep -Fq 'formatx-mag-reference-v34.js?v=20260810-mag-reference-v34-1' "$core_js" \
                && grep -Fq 'FormatX Suite Pro' "$home"
              then
                success=true
                rm -f "$hero_css" "$recovery_css" "$mag33_css" "$mag33_js" "$mag34_css" "$mag34_js" "$core_js" "$home"
                break
              fi
              rm -f "$hero_css" "$recovery_css" "$mag33_css" "$mag33_js" "$mag34_css" "$mag34_js" "$core_js" "$home"
              sleep 10
            done
            if [[ "$success" != true ]]; then
              echo "Live mobile hero / MAG v34 verification failed for $origin" >&2
              exit 1
            fi
          done

      - name: Publish live verification status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                state,
                context: 'FormatX live mobile hero verification',
                description: 'Both custom domains serve the mobile text guard and MAG v34 assets',
                target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              }),
            }
          );
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE
