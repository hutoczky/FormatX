name: r238 hashed inline critical CSS

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: formatx-r238-inline-critical
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Inline reduced critical CSS with synchronized CSP hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          css_path = Path('docs/scifi-ui/styles/formatx-critical-first-paint-r232.css')
          index_path = Path('docs/scifi-ui/index.html')
          entry_path = Path('billing-worker/src/production-entry.js')

          css = css_path.read_text(encoding='utf-8')
          digest = base64.b64encode(hashlib.sha256(css.encode('utf-8')).digest()).decode('ascii')
          token = f"'sha256-{digest}'"

          html = index_path.read_text(encoding='utf-8')
          style = '<style data-fx-first-paint-r232="true" data-fx-inline-critical-r238="true" media="(prefers-reduced-motion: reduce)">' + css + '</style>'

          inline_re = re.compile(
              r'<style data-fx-first-paint-r232="true" data-fx-inline-critical-r238="true" media="\(prefers-reduced-motion: reduce\)">[\s\S]*?</style>'
          )
          link_re = re.compile(
              r'^\s*<link rel="stylesheet" data-fx-first-paint-r232="true"[^>]*>\s*$',
              re.M,
          )

          if inline_re.search(html):
              html = inline_re.sub(style, html, count=1)
          elif link_re.search(html):
              html = link_re.sub(style, html, count=1)
          else:
              raise SystemExit('Neither the external nor inline r232 first-paint style was found')

          csp_re = re.compile(r"style-src 'self'(?: 'sha256-[^']+')?;")
          if not csp_re.search(html):
              raise SystemExit('index CSP style-src directive not found')
          html = csp_re.sub(f"style-src 'self' {token};", html, count=1)
          index_path.write_text(html, encoding='utf-8')

          entry = entry_path.read_text(encoding='utf-8')
          hash_re = re.compile(r'^const INLINE_CRITICAL_STYLE_HASH = ".*?";$', re.M)
          replacement = f'const INLINE_CRITICAL_STYLE_HASH = "{token}";'
          if hash_re.search(entry):
              entry = hash_re.sub(replacement, entry, count=1)
          else:
              anchor = "const LEGACY_WWW_ORIGIN = 'https://www.formatxsuite.com';\n"
              if anchor not in entry:
                  raise SystemExit('production-entry hash insertion anchor not found')
              entry = entry.replace(anchor, anchor + replacement + '\n', 1)
          entry_path.write_text(entry, encoding='utf-8')

          # Contract validation: the style text itself, the meta CSP, and the
          # production HTTP CSP all use the exact same SHA-256 token.
          final_html = index_path.read_text(encoding='utf-8')
          match = inline_re.search(final_html)
          if not match:
              raise SystemExit('r238 inline critical style missing after patch')
          style_text = match.group(0).split('>', 1)[1].rsplit('</style>', 1)[0]
          actual = base64.b64encode(hashlib.sha256(style_text.encode('utf-8')).digest()).decode('ascii')
          actual_token = f"'sha256-{actual}'"
          if actual_token != token:
              raise SystemExit(f'inline style hash mismatch: {actual_token} != {token}')
          if f"style-src 'self' {token};" not in final_html:
              raise SystemExit('index CSP hash mismatch')
          if replacement not in entry_path.read_text(encoding='utf-8'):
              raise SystemExit('production HTTP CSP hash mismatch')
          if 'href="./styles/formatx-critical-first-paint-r232.css' in final_html:
              raise SystemExit('external r232 critical stylesheet request still present')

          print('PASS: r238 inline critical CSS is hash-synchronized:', token)
          PY

          if git diff --quiet -- docs/scifi-ui/index.html billing-worker/src/production-entry.js; then
            echo 'r238 already synchronized; no commit required.'
            exit 0
          fi

          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html billing-worker/src/production-entry.js
          git commit -m 'r238 eliminate final critical CSS network round trip'
          git push
