name: Publish FormatX Mobile Android release

on:
  push:
    branches: [master]
    paths:
      - "docs/scifi-ui/downloads/FormatX-Mobile-Android.apk"
      - "docs/scifi-ui/downloads/android-mobile-update.json"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: formatx-mobile-android-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish FormatX Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify package and metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          APK="docs/scifi-ui/downloads/FormatX-Mobile-Android.apk"
          MANIFEST="docs/scifi-ui/downloads/android-mobile-update.json"
          test -s "$APK"
          test -s "$MANIFEST"
          unzip -t "$APK" >/dev/null

          python3 - <<'PY' > /tmp/mobile-release.env
          import hashlib
          import json
          from pathlib import Path

          apk = Path('docs/scifi-ui/downloads/FormatX-Mobile-Android.apk')
          manifest = json.loads(Path('docs/scifi-ui/downloads/android-mobile-update.json').read_text(encoding='utf-8'))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = str(manifest['sha256']).lower()
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: manifest={expected} apk={digest}')
          version = str(manifest['versionName']).strip()
          version_code = int(manifest['versionCode'])
          apk_url = str(manifest['apkUrl']).strip()
          if version_code < 1 or not version or apk_url != 'https://www.formatxsuite.com/scifi-ui/downloads/FormatX-Mobile-Android.apk':
              raise SystemExit('Invalid FormatX Mobile release metadata')
          print(f'VERSION={version}')
          print(f'VERSION_CODE={version_code}')
          print(f'SHA256={digest}')
          print(f'APK_URL={apk_url}')
          PY

          cat /tmp/mobile-release.env >> "$GITHUB_ENV"
          source /tmp/mobile-release.env
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=android-mobile-v${VERSION}-beta.2" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          mkdir -p dist
          cp docs/scifi-ui/downloads/FormatX-Mobile-Android.apk dist/FormatX-Mobile-Android.apk
          printf '%s  %s\n' "$SHA256" "FormatX-Mobile-Android.apk" > dist/FormatX-Mobile-Android.apk.sha256

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          ## FormatX Mobile Android ${VERSION} Beta 2

          Külön telepíthető, Androidra optimalizált FormatX mobilközpont.

          - külön alkalmazásazonosító: hu.formatx.mobile;
          - mobilra tervezett kezelőfelület;
          - projekt-, kiadás-, támogatási és licencközpont;
          - csak HTTPS-kapcsolat;
          - korlátozott, biztonságos WebView;
          - külön SHA-256 ellenőrzőösszeg;
          - verziókód: ${VERSION_CODE}.

          Ez a mobilkiadás nem hajt végre asztali meghajtóműveleteket és nem színlel Androidon nem támogatott funkciókat.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/FormatX-Mobile-Android.apk \
              dist/FormatX-Mobile-Android.apk.sha256 \
              --clobber
            gh release edit "$TAG" \
              --title "FormatX Mobile Android ${VERSION} Beta 2" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$TAG" \
              dist/FormatX-Mobile-Android.apk \
              dist/FormatX-Mobile-Android.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "FormatX Mobile Android ${VERSION} Beta 2" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Publish download summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## FormatX Mobile Android download"
            echo
            echo "Website: $APK_URL"
            echo
            echo "GitHub: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/FormatX-Mobile-Android.apk"
            echo
            echo "SHA256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful release publication
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "✅ **PASS — FormatX Mobile GitHub béta-kiadás közzétéve**

          - Tag: \`${TAG}\`
          - APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/FormatX-Mobile-Android.apk
          - SHA-256: \`${SHA256}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed release publication
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "❌ **FAILED — FormatX Mobile GitHub kiadás közzététele**

          - Forrás commit: \`${GITHUB_SHA}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
