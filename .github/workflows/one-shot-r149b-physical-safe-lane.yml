name: One-shot r149b physical safe lane
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r149b-physical-safe-lane.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply r149b patch
        run: python3 .github/scripts/patch-r149b.py
      - name: Publish patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-core-live-motion-r147.js docs/scifi-ui/styles/formatx-live-motion-r147.css docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html
          if git diff --cached --quiet; then
            echo 'r149b patch already applied.'
            exit 0
          fi
          git commit -m '[deploy-production] fix(mag): r149b physical clearance and hidden legacy copy'
          git push origin HEAD:master
