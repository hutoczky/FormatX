name: Verify FormatX rounded core v50 live

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v50.js'
      - 'docs/scifi-ui/styles/formatx-core-v50.css'
      - '.github/workflows/verify-formatx-mag-v46-live.yml'
  pull_request:
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v50.js'
      - 'docs/scifi-ui/styles/formatx-core-v50.css'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate v50 bootstrap and responsive core
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-v50.js
          grep -Fq 'rounded-living-core-v50' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq 'formatx-core-v50.js?v=20260810-rounded-living-core-v50-1' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq 'single-webgl2-rounded-living-core-v50' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq "const VERSION = 'v50-rounded-living-core'" docs/scifi-ui/scripts/formatx-core-v50.js
          grep -Fq 'rounded-organic-glass-orb-v50' docs/scifi-ui/scripts/formatx-core-v50.js
          grep -Fq 'moving-internal-nucleus-spectral-orbits-v50' docs/scifi-ui/scripts/formatx-core-v50.js
          grep -Fq -- '--fx-core-x: 50%' docs/scifi-ui/styles/formatx-core-v50.css
          ! grep -Fq 'clip-path: polygon' docs/scifi-ui/styles/formatx-core-v50.css
          ! grep -Fq 'scale(.78,1.04)' docs/scifi-ui/styles/formatx-core-v50.css

      - name: Verify production deployment after master push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://formatxsuite.com https://www.formatxsuite.com; do
            success=false
            for attempt in $(seq 1 30); do
              core="$(mktemp)"
              runtime="$(mktemp)"
              style="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_SHA}-${attempt}" > "$core" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/formatx-core-v50.js?v=${GITHUB_SHA}-${attempt}" > "$runtime" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/styles/formatx-core-v50.css?v=${GITHUB_SHA}-${attempt}" > "$style" \
                && grep -Fq 'rounded-living-core-v50' "$core" \
                && grep -Fq "const VERSION = 'v50-rounded-living-core'" "$runtime" \
                && grep -Fq 'rounded-organic-glass-orb-v50' "$runtime" \
                && grep -Fq -- '--fx-core-x: 50%' "$style" \
                && ! grep -Fq 'clip-path: polygon' "$style"
              then
                success=true
                rm -f "$core" "$runtime" "$style"
                break
              fi
              rm -f "$core" "$runtime" "$style"
              sleep 10
            done
            if [[ "$success" != true ]]; then
              echo "Rounded core v50 production verification failed for $origin" >&2
              exit 1
            fi
          done

      - name: Publish v50 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Rounded living core v50 verified'; else state=failure; description='Rounded living core v50 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX rounded core v50 live' -f description="$description" -f target_url="$TARGET_URL"
