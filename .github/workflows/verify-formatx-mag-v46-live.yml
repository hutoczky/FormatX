name: Verify FormatX reference crystal v51 live

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v51.js'
      - 'docs/scifi-ui/styles/formatx-core-v51.css'
      - '.github/workflows/verify-formatx-mag-v46-live.yml'
  pull_request:
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v51.js'
      - 'docs/scifi-ui/styles/formatx-core-v51.css'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate v51 bootstrap and responsive reference crystal
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-v51.js
          grep -Fq 'reference-crystal-core-v51' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq 'formatx-core-v51.js?v=20260810-reference-crystal-v51-1' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq 'single-webgl2-reference-crystal-v51' docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq "const VERSION = 'v51-reference-crystal-core'" docs/scifi-ui/scripts/formatx-core-v51.js
          grep -Fq 'sharp-four-tip-concave-crystal-v51' docs/scifi-ui/scripts/formatx-core-v51.js
          grep -Fq 'layered-faceted-refractive-glass-v51' docs/scifi-ui/scripts/formatx-core-v51.js
          grep -Fq 'moving-white-nucleus-concentric-spectral-rings-v51' docs/scifi-ui/scripts/formatx-core-v51.js
          grep -Fq -- '--fx-core-x: 50%' docs/scifi-ui/styles/formatx-core-v51.css
          ! grep -Fq 'clip-path: polygon' docs/scifi-ui/styles/formatx-core-v51.css

      - name: Verify production deployment after master push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://formatxsuite.com https://www.formatxsuite.com; do
            success=false
            for attempt in $(seq 1 36); do
              core="$(mktemp)"
              runtime="$(mktemp)"
              style="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_SHA}-${attempt}" > "$core" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/formatx-core-v51.js?v=${GITHUB_SHA}-${attempt}" > "$runtime" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/styles/formatx-core-v51.css?v=${GITHUB_SHA}-${attempt}" > "$style" \
                && grep -Fq 'reference-crystal-core-v51' "$core" \
                && grep -Fq "const VERSION = 'v51-reference-crystal-core'" "$runtime" \
                && grep -Fq 'sharp-four-tip-concave-crystal-v51' "$runtime" \
                && grep -Fq 'moving-white-nucleus-concentric-spectral-rings-v51' "$runtime" \
                && grep -Fq -- '--fx-core-x: 50%' "$style" \
                && ! grep -Fq 'clip-path: polygon' "$style"
              then
                success=true
                rm -f "$core" "$runtime" "$style"
                break
              fi
              rm -f "$core" "$runtime" "$style"
              sleep 10
            done
            if [[ "$success" != true ]]; then
              echo "Reference crystal v51 production verification failed for $origin" >&2
              exit 1
            fi
          done

      - name: Publish v51 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Reference crystal v51 verified'; else state=failure; description='Reference crystal v51 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX reference crystal v51 live' -f description="$description" -f target_url="$TARGET_URL"
