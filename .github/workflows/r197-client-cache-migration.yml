name: One-shot r197 client cache migration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r197-client-cache-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[r197-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Apply r197 cache migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('billing-worker/src/production-content-entry.js')
          worker = worker_path.read_text(encoding='utf-8')

          const_anchor = "const CRITICAL_SHELL_LINK = '<link rel=\"stylesheet\" data-fx-critical-shell=\"v56\" href=\"/scifi-ui/styles/formatx-critical-shell-v56.css?v=20260812-first-paint-r4\">';\n"
          const_insert = const_anchor + "const CLIENT_CACHE_REVISION_R197 = '20260817-r197-cache-migration';\nconst CLIENT_CACHE_RECOVERY_R197 = '<script data-fx-client-cache-recovery-r197=\"true\" src=\"/scifi-ui/scripts/formatx-client-cache-recovery-r197.js?v=20260817-r197-cache-migration\"></script>';\n"
          if 'CLIENT_CACHE_REVISION_R197' not in worker:
              if const_anchor not in worker:
                  raise SystemExit('r197: constant anchor not found')
              worker = worker.replace(const_anchor, const_insert, 1)

          header_anchor = "  headers.set('Vary', mergeVary(headers.get('Vary'), 'Host'));\n\n  if (homepage) {\n"
          header_insert = "  headers.set('Vary', mergeVary(headers.get('Vary'), 'Host'));\n\n  if (homepage) {\n    const cookie = request.headers.get('Cookie') || '';\n    const migrated = /(?:^|;\\s*)fx_client_cache_r197=1(?:;|$)/.test(cookie);\n    headers.set('X-FormatX-Client-Revision', 'r197-cache-migration');\n    if (!migrated) {\n      headers.set('Clear-Site-Data', '\"cache\"');\n      headers.append('Set-Cookie', 'fx_client_cache_r197=1; Path=/; Max-Age=31536000; SameSite=Lax; Secure; HttpOnly');\n      headers.set('X-FormatX-Cache-Migration', 'r197-cleared');\n    }\n"
          if 'fx_client_cache_r197=1' not in worker:
              if header_anchor not in worker:
                  raise SystemExit('r197: header anchor not found')
              worker = worker.replace(header_anchor, header_insert, 1)

          html_anchor = "  if (homepage) {\n    html = normaliseHomepageDocumentPaths(html);\n  }\n"
          html_insert = "  if (homepage) {\n    html = normaliseHomepageDocumentPaths(html);\n    html = cacheBustHomepageAssetsR197(html);\n    html = injectClientCacheRecoveryR197(html);\n  }\n"
          if 'html = cacheBustHomepageAssetsR197(html);' not in worker:
              if html_anchor not in worker:
                  raise SystemExit('r197: homepage html anchor not found')
              worker = worker.replace(html_anchor, html_insert, 1)

          helper_anchor = "function mergeVary(existing, value) {\n"
          helpers = r'''function cacheBustHomepageAssetsR197(html) {
            return String(html || '').replace(
              /((?:src|href)=["'])(\/scifi-ui\/(?:scripts|styles)\/[^"']+)(["'])/gi,
              (match, prefix, assetUrl, suffix) => {
                if (/([?&])fxrev=20260817-r197-cache-migration(?:&|$)/.test(assetUrl)) return match;
                const separator = assetUrl.includes('?') ? '&' : '?';
                return `${prefix}${assetUrl}${separator}fxrev=${CLIENT_CACHE_REVISION_R197}${suffix}`;
              },
            );
          }

          function injectClientCacheRecoveryR197(html) {
            let output = String(html || '');
            if (output.includes('data-fx-client-cache-recovery-r197')) return output;
            const cspMeta = /(<meta\b[^>]*http-equiv=["']Content-Security-Policy["'][^>]*>)/i;
            if (cspMeta.test(output)) {
              return output.replace(cspMeta, `$1\n  ${CLIENT_CACHE_RECOVERY_R197}`);
            }
            return output.replace('<head>', `<head>\n  ${CLIENT_CACHE_RECOVERY_R197}`);
          }

          '''
          if 'function cacheBustHomepageAssetsR197' not in worker:
              if helper_anchor not in worker:
                  raise SystemExit('r197: helper anchor not found')
              worker = worker.replace(helper_anchor, helpers + helper_anchor, 1)

          worker_path.write_text(worker, encoding='utf-8')

          recovery = r'''(function () {
            'use strict';

            const root = document.documentElement;
            const VERSION = 'r197';
            const MARKER = 'formatx:client-cache-recovery';
            const RELOAD_GUARD = 'formatx:r197-controller-reload';

            if (root.dataset.fxClientCacheRecovery === VERSION) return;
            root.dataset.fxClientCacheRecovery = 'checking-r197';

            let alreadyMigrated = false;
            try { alreadyMigrated = localStorage.getItem(MARKER) === VERSION; } catch (_) {}
            if (alreadyMigrated) {
              root.dataset.fxClientCacheRecovery = VERSION;
              return;
            }

            // This key only controls the cinematic intro; it is safe to reset during
            // the one-time recovery and prevents a stale returning-session state.
            try { localStorage.removeItem('formatx:intro-seen-v1'); } catch (_) {}

            const hadController = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
            const tasks = [];

            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker.getRegistrations()
                  .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
                  .catch(() => []),
              );
            }

            if ('caches' in window) {
              tasks.push(
                caches.keys()
                  .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
                  .catch(() => []),
              );
            }

            Promise.allSettled(tasks).finally(() => {
              try { localStorage.setItem(MARKER, VERSION); } catch (_) {}
              root.dataset.fxClientCacheRecovery = VERSION;

              if (!hadController) return;
              try {
                if (sessionStorage.getItem(RELOAD_GUARD) === '1') return;
                sessionStorage.setItem(RELOAD_GUARD, '1');
                const target = new URL(location.href);
                target.searchParams.set('_fx_client_recovery', VERSION);
                target.searchParams.set('_fxcb', String(Date.now()));
                location.replace(target.toString());
              } catch (_) {}
            });
          }());
          '''
          Path('docs/scifi-ui/scripts/formatx-client-cache-recovery-r197.js').write_text(recovery, encoding='utf-8')
          PY

      - name: Validate syntax and migration contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-client-cache-recovery-r197.js
          node --input-type=module --check < billing-worker/src/production-content-entry.js
          grep -q "fx_client_cache_r197=1" billing-worker/src/production-content-entry.js
          grep -q "Clear-Site-Data.*cache" billing-worker/src/production-content-entry.js
          grep -q "cacheBustHomepageAssetsR197" billing-worker/src/production-content-entry.js
          grep -q "formatx-client-cache-recovery-r197.js" billing-worker/src/production-content-entry.js

      - name: Commit production fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          rm -f .github/workflows/r197-client-cache-migration.yml
          git add billing-worker/src/production-content-entry.js docs/scifi-ui/scripts/formatx-client-cache-recovery-r197.js .github/workflows/r197-client-cache-migration.yml
          git commit -m "[deploy-production] [r197-applied] fix(cache): migrate stale browser client state"
          git push
