name: Verify live crawler copy polish

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-copy-polish-20260812.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical live HTML bypassing cache
        shell: bash
        run: |
          set -euo pipefail
          url="https://formatxsuite.com/?copy_audit=${GITHUB_RUN_ID}"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url" -o live.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          raw = Path('live.html').read_text(encoding='utf-8', errors='replace')
          assert 'A mag érzékel.</span> <em' in raw
          assert 'Hat specializált szerv.</span> <em' in raw
          assert 'A látvány a bőr.</span> <em' in raw
          assert 'hivatalos kiadási csatorna csatornáján' not in raw
          assert 'hivatalos kiadási csatorna csatornája' not in raw
          assert 'formatx-seo.js?v=20260812-final-polish-r1' in raw
          # Simulate basic crawler text extraction and assert sentence boundaries survive.
          plain = re.sub(r'<[^>]+>', '', raw)
          plain = html.unescape(plain)
          plain = re.sub(r'\s+', ' ', plain)
          assert 'A mag érzékel. A gerinc döntési utat épít.' in plain
          assert 'Hat specializált szerv. Egyetlen élő rendszer.' in plain
          assert 'A látvány a bőr. Az ellenőrizhetőség a váz.' in plain
          print('PASS: live canonical HTML serves corrected crawler-visible copy and fresh SEO runtime.')
          PY
