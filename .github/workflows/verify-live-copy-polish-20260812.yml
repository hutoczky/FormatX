name: Patch final live release wording

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-copy-polish-20260812.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Remove final release-channel duplication at source and Worker transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace(
              'A hivatalos teljes kiadások és kiadási információk a FormatX GitHub Releases csatornáján jelennek meg.',
              'A hivatalos teljes kiadások és kiadási információk a FormatX hivatalos kiadási felületén jelennek meg.'
          )
          text = text.replace(
              'Official full releases and release information are published through FormatX GitHub Releases.',
              'Official full releases and release information are published on the FormatX release page.'
          )
          index.write_text(text, encoding='utf-8')

          worker = Path('billing-worker/src/production-with-license.js')
          value = worker.read_text(encoding='utf-8')
          marker = ".replace(/\\bGitHub Releases\\b/gi, 'hivatalos kiadási csatorna')"
          guarded = ".replace(/\\bGitHub Releases csatornáján\\b/gi, 'hivatalos kiadási csatornán')\n    .replace(/\\bGitHub Releases csatornája\\b/gi, 'hivatalos kiadási csatorna')\n    " + marker
          if guarded not in value:
              assert marker in value
              value = value.replace(marker, guarded)
          worker.write_text(value, encoding='utf-8')

          assert 'GitHub Releases csatornáján' not in index.read_text(encoding='utf-8')
          assert "GitHub Releases csatornáján\\b/gi, 'hivatalos kiadási csatornán'" in worker.read_text(encoding='utf-8')
          PY

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html billing-worker/src/production-with-license.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix(public): remove duplicated release-channel wording at source'
            git push origin HEAD:master
          fi
