name: Verify current live MAG semantic contract
run-name: Legacy R482 semantic MAG verification for ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - 'docs/scifi-ui/data/r481-mag-living-balance.json'
      - '.github/workflows/verify-r481-live-mag.yml'
      - 'docs/p0-validation-version.txt'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r482-live-mag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-r482-mag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v5

      - name: Wait for exact deployed P0 marker
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://formatxsuite.com'
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$origin/p0-validation-version.txt?r482_wait=${GITHUB_RUN_ID}_${attempt}" -o "$RUNNER_TEMP/live-p0.txt"; then
              if cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
                echo 'Exact source P0 marker is live; semantic R482 verification is applicable.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact source SHA marker never reached production; refusing stale live verification.' >&2
          exit 1

      - name: Install runner Chrome verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Verify live mobile and desktop MAG semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');

          function snapshot(){
            const root=document.documentElement;
            const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
            const style=canvas?getComputedStyle(canvas):null;
            const rect=canvas?.getBoundingClientRect();
            const link=document.querySelector('link[data-fx-mag-living-balance-r481]');
            const header=document.querySelector('.topbar .fx-reference-mag-button');
            const headerStyle=header?getComputedStyle(header):null;
            const headerRect=header?.getBoundingClientRect();
            const mini=document.querySelector('.fx-mini-mag-glyph-r459');
            const miniStyle=mini?getComputedStyle(mini):null;
            return {
              crystal:root.dataset.fxCrystalOrganismR326||'',
              sync:root.dataset.fxMagShapeSyncR476||'',
              life:root.dataset.fxPrimaryMagLifeR482||'',
              contract:root.dataset.fxPrimaryMagLifeContractR482||'',
              optics:root.dataset.fxPrimaryMagOpticsR482||'',
              renderer:root.dataset.fxCoreRenderer||'',
              scheduler:root.dataset.fxCoreScheduler||'',
              idle:root.dataset.fxCoreIdleRenderR441||'',
              balanceHref:link?.href||'',
              canvasCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length,
              canvas:{exists:Boolean(canvas),width:rect?.width||0,height:rect?.height||0,display:style?.display||'',visibility:style?.visibility||'',opacity:Number(style?.opacity||0),animationName:style?.animationName||'',filter:style?.filter||'',scale:style?.scale||''},
              header:{exists:Boolean(header),visible:Boolean(headerStyle&&headerRect&&headerStyle.display!=='none'&&headerStyle.visibility!=='hidden'&&Number(headerStyle.opacity)>.2&&headerRect.width>=40&&headerRect.height>=40),boxShadow:headerStyle?.boxShadow||'',life:header?.dataset.fxMagLife||''},
              mini:mini?{background:miniStyle?.backgroundImage||'',boxShadow:miniStyle?.boxShadow||'',life:mini.dataset.fxMagLife||''}:null,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            };
          }

          function semanticallyReady(s){
            return s.crystal==='ready'
              && /^ready-r\d+$/.test(s.sync)
              && ['breath','pulse'].includes(s.life)
              && s.contract==='large-mini-header-spectrum-breath-zero-webgl-idle'
              && s.optics==='restrained-soft-spectrum-mobile-edge'
              && s.renderer==='single-webgl-crystal-organism-r326'
              && s.scheduler==='interaction-bursts-idle-zero-frame-r441'
              && s.idle==='zero-frame'
              && /formatx-mag-living-balance-r481\.css/.test(s.balanceHref)
              && s.canvasCount===1
              && s.canvas.exists && s.canvas.width>120 && s.canvas.height>180
              && s.canvas.display!=='none' && s.canvas.visibility!=='hidden' && s.canvas.opacity>.2;
          }

          async function verify(browser,name,viewport,mobile){
            const context=await browser.newContext({viewport,deviceScaleFactor:mobile?2:1,isMobile:mobile,hasTouch:mobile,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{const t=m.text();if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(t))errors.push(t);});
            await page.goto(`https://formatxsuite.com/?verify=r482-semantic-${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});

            let state=null;
            for(let elapsed=0;elapsed<=20000;elapsed+=1000){
              state=await page.evaluate(snapshot);
              console.log('R482_CONDITION_DUMP',name,elapsed,JSON.stringify(state));
              if(semanticallyReady(state)) break;
              await page.waitForTimeout(1000);
            }
            assert.ok(semanticallyReady(state),`${name}: MAG semantic readiness timeout: ${JSON.stringify(state)}`);
            await page.waitForTimeout(700);
            state=await page.evaluate(snapshot);

            assert.equal(state.canvasCount,1,JSON.stringify(state));
            assert.ok(state.header.exists&&state.header.visible,JSON.stringify(state.header));
            assert.notEqual(state.header.boxShadow,'none');
            assert.ok(['breath','pulse'].includes(state.header.life),JSON.stringify(state.header));
            if(state.mini){
              assert.notEqual(state.mini.background,'none');
              assert.notEqual(state.mini.boxShadow,'none');
              assert.ok(['breath','pulse'].includes(state.mini.life),JSON.stringify(state.mini));
            }
            assert.ok(state.overflow<=2,JSON.stringify(state));
            assert.match(state.canvas.filter,/brightness\(/);
            assert.match(state.canvas.filter,/contrast\(/);
            assert.match(state.canvas.filter,/saturate\(/);
            if(mobile) assert.match(state.canvas.animationName,/fx-primary-mag-mobile-heart-r\d+/);
            else assert.match(state.canvas.animationName,/fx-primary-mag-living-desktop-r\d+/);

            const samples=[];
            for(let i=0;i<4;i++){
              samples.push(await page.evaluate(()=>{const s=getComputedStyle(document.querySelector('#hero .fx-crystal-organism-r326-canvas'));return{opacity:Number(s.opacity),scale:Number.parseFloat(s.scale)||1};}));
              await page.waitForTimeout(620);
            }
            const opacitySpan=Math.max(...samples.map(s=>s.opacity))-Math.min(...samples.map(s=>s.opacity));
            const scaleSpan=Math.max(...samples.map(s=>s.scale))-Math.min(...samples.map(s=>s.scale));
            assert.ok(opacitySpan>.004||scaleSpan>.002,JSON.stringify({name,samples,opacitySpan,scaleSpan}));
            assert.equal(errors.length,0,errors.join(' | '));
            console.log(`PASS ${name}`,JSON.stringify({state,samples,opacitySpan,scaleSpan},null,2));
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              await verify(browser,'mobile-390x844',{width:390,height:844},true);
              await verify(browser,'desktop-1440x900',{width:1440,height:900},false);
            }finally{await browser.close();}
            console.log('PASS: legacy R482 gate modernized to the current semantic MAG contract.');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Publish R482 semantic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Current semantic mobile + desktop MAG contract passed'
          else
            state=failure
            description='Current semantic MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R482 live MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
