name: Verify R482 live MAG spectrum
run-name: R482 live mobile + desktop MAG verification for ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - 'docs/scifi-ui/data/r481-mag-living-balance.json'
      - '.github/workflows/verify-r481-live-mag.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r482-live-mag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-r482-mag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r482-live"
          cd "$RUNNER_TEMP/r482-live"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify live mobile and desktop R482 MAG
        env:
          NODE_PATH: ${{ runner.temp }}/r482-live/node_modules
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');

          async function verify(browser,name,viewport,mobile){
            const context=await browser.newContext({
              viewport,
              deviceScaleFactor:mobile?2:1,
              isMobile:mobile,
              hasTouch:mobile,
              locale:'hu-HU',
              reducedMotion:'no-preference',
              colorScheme:'dark'
            });
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            page.on('console',message=>{
              const text=message.text();
              if(message.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(text))errors.push(text);
            });
            await page.goto(`https://formatxsuite.com/?verify=r482-${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{
              const root=document.documentElement;
              const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              const link=document.querySelector('link[data-fx-mag-living-balance-r481]');
              const style=canvas?getComputedStyle(canvas):null;
              const box=canvas?.getBoundingClientRect();
              return root.dataset.fxCrystalOrganismR326==='ready'
                && root.dataset.fxMagShapeSyncR476==='ready-r482'
                && root.dataset.fxPrimaryMagLifeContractR482==='large-mini-header-spectrum-breath-zero-webgl-idle'
                && root.dataset.fxPrimaryMagOpticsR482==='restrained-soft-spectrum-mobile-edge'
                && link instanceof HTMLLinkElement
                && link.href.includes('r482-spectrum-soft-edge')
                && canvas && style && box && box.width>120 && box.height>180
                && style.display!=='none' && style.visibility!=='hidden' && Number(style.opacity)>.2;
            },null,{timeout:120000});
            await page.waitForTimeout(700);

            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              const style=getComputedStyle(canvas);
              const rect=canvas.getBoundingClientRect();
              const header=document.querySelector('.topbar .fx-reference-mag-button');
              const headerStyle=header?getComputedStyle(header):null;
              const headerRect=header?.getBoundingClientRect();
              const mini=document.querySelector('.fx-mini-mag-glyph-r459');
              const miniStyle=mini?getComputedStyle(mini):null;
              return{
                renderer:root.dataset.fxCoreRenderer,
                sync:root.dataset.fxMagShapeSyncR476,
                life:root.dataset.fxPrimaryMagLifeR482,
                contract:root.dataset.fxPrimaryMagLifeContractR482,
                optics:root.dataset.fxPrimaryMagOpticsR482,
                scheduler:root.dataset.fxCoreScheduler,
                idle:root.dataset.fxCoreIdleRenderR441,
                animationName:style.animationName,
                filter:style.filter,
                opacity:Number(style.opacity),
                scale:style.scale,
                rect:{width:rect.width,height:rect.height,left:rect.left,right:rect.right},
                balanceHref:document.querySelector('link[data-fx-mag-living-balance-r481]')?.href||'',
                header:{
                  exists:Boolean(header),
                  visible:Boolean(headerStyle&&headerRect&&headerStyle.display!=='none'&&headerStyle.visibility!=='hidden'&&Number(headerStyle.opacity)>.2&&headerRect.width>=40&&headerRect.height>=40),
                  boxShadow:headerStyle?.boxShadow||'',
                  life:header?.dataset.fxMagLife||''
                },
                mini:mini?{
                  background:miniStyle?.backgroundImage||'',
                  boxShadow:miniStyle?.boxShadow||'',
                  life:mini.dataset.fxMagLife||''
                }:null,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });

            assert.equal(state.renderer,'single-webgl-crystal-organism-r326');
            assert.equal(state.sync,'ready-r482');
            assert.ok(['breath','pulse'].includes(state.life),JSON.stringify(state));
            assert.equal(state.contract,'large-mini-header-spectrum-breath-zero-webgl-idle');
            assert.equal(state.optics,'restrained-soft-spectrum-mobile-edge');
            assert.equal(state.scheduler,'interaction-bursts-idle-zero-frame-r441');
            assert.equal(state.idle,'zero-frame');
            assert.match(state.balanceHref,/formatx-mag-living-balance-r481\.css\?v=20260831-r482-spectrum-soft-edge/);
            assert.ok(state.header.exists&&state.header.visible,JSON.stringify(state.header));
            assert.notEqual(state.header.boxShadow,'none');
            assert.ok(['breath','pulse'].includes(state.header.life),JSON.stringify(state.header));
            if(state.mini){
              assert.notEqual(state.mini.background,'none');
              assert.notEqual(state.mini.boxShadow,'none');
              assert.ok(['breath','pulse'].includes(state.mini.life),JSON.stringify(state.mini));
            }
            assert.ok(state.overflow<=2,JSON.stringify(state));

            if(mobile){
              assert.ok(state.animationName.includes('fx-primary-mag-living-mobile-r482'),state.animationName);
              assert.match(state.filter,/brightness\(0\.66\)/);
              assert.match(state.filter,/contrast\(0\.61\)/);
              assert.match(state.filter,/saturate\(1\.45\)/);
              assert.match(state.filter,/hue-rotate\(-5deg\)/);
              assert.match(state.filter,/blur\(1\.28px\)/);
            }else{
              assert.ok(state.animationName.includes('fx-primary-mag-living-desktop-r482'),state.animationName);
            }

            const samples=[];
            for(let i=0;i<4;i++){
              samples.push(await page.evaluate(()=>{
                const s=getComputedStyle(document.querySelector('#hero .fx-crystal-organism-r326-canvas'));
                return{opacity:Number(s.opacity),scale:Number.parseFloat(s.scale)||1};
              }));
              await page.waitForTimeout(620);
            }
            const opacitySpan=Math.max(...samples.map(s=>s.opacity))-Math.min(...samples.map(s=>s.opacity));
            const scaleSpan=Math.max(...samples.map(s=>s.scale))-Math.min(...samples.map(s=>s.scale));
            assert.ok(opacitySpan>.004||scaleSpan>.002,JSON.stringify({name,samples,opacitySpan,scaleSpan}));
            assert.equal(errors.length,0,errors.join(' | '));
            console.log(`PASS ${name}`,JSON.stringify({state,samples,opacitySpan,scaleSpan},null,2));
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            await verify(browser,'mobile-390x844',{width:390,height:844},true);
            await verify(browser,'desktop-1440x900',{width:1440,height:900},false);
            await browser.close();
            console.log('PASS: live R482 MAG family has restrained spectrum optics, visible breathing and zero-idle WebGL on mobile and desktop.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Publish R482 live MAG status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='R482 live mobile + desktop MAG spectrum passed'
          else
            state=failure
            description='R482 live MAG spectrum verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R482 live MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
