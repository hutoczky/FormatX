name: Verify current semantic live MAG (legacy R482 gate)
run-name: Current semantic mobile + desktop MAG for ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
      - '.github/scripts/validate-live-mag-functional.cjs'
      - '.github/workflows/verify-r481-live-mag.yml'
      - 'docs/p0-validation-version.txt'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r482-semantic-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-r482-mag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Wait for exact deployed P0 marker
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://formatxsuite.com/p0-validation-version.txt?r482=${GITHUB_RUN_ID}_${i}" -o "$RUNNER_TEMP/live-marker" \
              && cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-marker"; then
              echo 'Exact audited revision is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Exact audited revision did not reach production.' >&2
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install lightweight runner Chrome driver
        run: |
          set -Eeuo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.62.0
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Verify canonical renderer, PAUSE, RESUME, ASK, fallback and reduced motion
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          FORMATX_TEST_URL: https://formatxsuite.com/
          FORMATX_MAG_EVIDENCE_DIR: artifacts/r482-semantic-live
          AUDITED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$FORMATX_MAG_EVIDENCE_DIR"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/scripts/validate-live-mag-functional.cjs').read_text(encoding='utf-8')
          src=src.replace("const { chromium } = require('playwright');","const { chromium } = require('playwright-core');",1)
          src=src.replace('const browser = await chromium.launch({','const browser = await chromium.launch({\n    executablePath:process.env.CHROME_PATH,',1)
          Path('.r482-canonical.cjs').write_text(src,encoding='utf-8')
          PY
          node .r482-canonical.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r482-semantic-${{ github.sha }}
          path: artifacts/r482-semantic-live
          if-no-files-found: warn
          retention-days: 30

      - name: Publish R482 live MAG status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Canonical semantic MAG, PAUSE/RESUME, ASK and fallbacks passed'
          else
            state=failure
            description='Canonical semantic MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R482 live MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
