name: V100 pricing and QR validation

on:
  pull_request:
    paths:
      - 'billing-worker/src/pricing-v100-api.js'
      - 'billing-worker/src/production-with-license.js'
      - 'docs/scifi-ui/scripts/checkout-v100.js'
      - 'docs/scifi-ui/scripts/checkout-language-v100.js'
      - 'docs/scifi-ui/scripts/start-sale.js'
      - 'docs/scifi-ui/styles/pricing-v100.css'
      - 'android-app/app/src/main/java/hu/formatx/suite/PriceCatalog.java'
      - '.github/workflows/v100-pricing-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'billing-worker/src/pricing-v100-api.js'
      - 'billing-worker/src/production-with-license.js'
      - 'docs/scifi-ui/scripts/checkout-v100.js'
      - 'docs/scifi-ui/scripts/checkout-language-v100.js'
      - 'docs/scifi-ui/scripts/start-sale.js'
      - 'docs/scifi-ui/styles/pricing-v100.css'
      - 'android-app/app/src/main/java/hu/formatx/suite/PriceCatalog.java'
      - '.github/workflows/v100-pricing-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Check JavaScript syntax
        run: |
          node --check billing-worker/src/pricing-v100-api.js
          node --check billing-worker/src/production-with-license.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js
          node --check docs/scifi-ui/scripts/start-sale.js

      - name: Verify unified price catalogue and QR routes
        shell: python
        run: |
          from pathlib import Path

          api = Path('billing-worker/src/pricing-v100-api.js').read_text(encoding='utf-8')
          checkout = Path('docs/scifi-ui/scripts/checkout-v100.js').read_text(encoding='utf-8')
          language = Path('docs/scifi-ui/scripts/checkout-language-v100.js').read_text(encoding='utf-8')
          sale = Path('docs/scifi-ui/scripts/start-sale.js').read_text(encoding='utf-8')
          android = Path('android-app/app/src/main/java/hu/formatx/suite/PriceCatalog.java').read_text(encoding='utf-8')
          worker = Path('billing-worker/src/production-with-license.js').read_text(encoding='utf-8')
          css = Path('docs/scifi-ui/styles/pricing-v100.css').read_text(encoding='utf-8')

          huf_prices = [7900, 79000, 15900, 159000, 29900, 299000]
          eur_prices = [22, 220, 44, 440, 83, 830]
          for price in huf_prices + eur_prices:
              token = str(price)
              assert token in api, ('api', price)
              assert token in checkout, ('checkout', price)
              assert token in language, ('language', price)
              assert token in sale, ('sale', price)
              assert token in android, ('android', price)

          assert "'/api/checkout-qr'" in api
          assert 'quickchart.io/qr' in api
          assert "pricing_version: 'v100-market-2026-07'" in api
          assert "result.pricing_version !== 'v100-market-2026-07'" in checkout
          assert 'checkout-v100.js' in worker
          assert 'checkout-language-v100.js' in worker
          assert 'pricing-v100.css' in worker
          assert css.count('{') == css.count('}')
          assert '@media (prefers-reduced-motion: reduce)' in css
          assert '@media (prefers-contrast: more)' in css
          print('V100 pricing, checkout and QR configuration is consistent.')

      - name: Install Worker dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Run licence tests and Worker dry run
        working-directory: billing-worker
        run: |
          npm run test:license
          npx wrangler deploy --dry-run --outdir ../.wrangler-v100-pricing-ci
