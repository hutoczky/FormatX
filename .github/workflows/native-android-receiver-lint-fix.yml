name: Native Android receiver lint fix

on:
  push:
    branches: [feature/native-android-formatx]
    paths:
      - "android-mobile/AUTOFIX_RECEIVER_LINT.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/native-android-formatx
          fetch-depth: 0

      - name: Apply targeted receiver lint annotation
        shell: bash
        run: |
          set -euo pipefail
          FILE="android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java"
          if ! grep -Fq 'import android.annotation.SuppressLint;' "$FILE"; then
            sed -i '/^package hu\.formatx\.mobile;$/a\\\nimport android.annotation.SuppressLint;' "$FILE"
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = '    private void registerUsbReceiver() {'
          new = '    @SuppressLint("UnspecifiedRegisterReceiverFlag")\n    private void registerUsbReceiver() {'
          if new not in text:
              if old not in text:
                  raise SystemExit('registerUsbReceiver method not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'import android.annotation.SuppressLint;' "$FILE"
          grep -F '@SuppressLint("UnspecifiedRegisterReceiverFlag")' "$FILE"
          rm -f android-mobile/AUTOFIX_RECEIVER_LINT.txt .github/workflows/native-android-receiver-lint-fix.yml

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle native Android receiver lint compatibility"
          git push origin HEAD:feature/native-android-formatx
