name: P0 R517 transport candidate proof

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r517-transport-candidate-proof.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_REF: p0-r517-transport-76b79fe
  CANDIDATE_SHA: 0cae78cd44785984e5b2b966636fa29032550398

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Exact source and Worker validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = '76b79fe75eebc9b0ce3998a8111eb8dbf539efb9'
          test -z "$(git status --porcelain)"
          node --input-type=module --check < billing-worker/src/production-content-entry-r517.js
          grep -F '"main": "src/production-content-entry-r517.js"' billing-worker/wrangler.jsonc
          grep -F "headers.set('Alt-Svc', 'clear')" billing-worker/src/production-content-entry-r517.js
          npm ci --prefix billing-worker
          npm test --prefix billing-worker
          (cd billing-worker && npx wrangler deploy --dry-run --outdir ../.wrangler-r517-candidate)
      - name: Start exact local candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r517-local.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r517-local.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r517-transport.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/r517-transport.log" || true
          exit 1
      - name: Prove Alt-Svc clear on document and critical resources
        shell: bash
        run: |
          set -euo pipefail
          for path in / /scifi-ui/styles/formatx-critical-core-r227.css /scifi-ui/scripts/formatx-reference-mode-boot-r334.js /robots.txt; do
            hdr="$RUNNER_TEMP/h.$RANDOM"
            curl -kfsS -D "$hdr" -o /dev/null -H 'Host: formatxsuite.com' "https://127.0.0.1:8787$path"
            tr -d '\r' < "$hdr"
            grep -Eiq '^alt-svc:[[:space:]]*clear[[:space:]]*$' "$hdr"
            grep -Eiq '^x-formatx-transport-stability:[[:space:]]*r517-http2-quic-variance[[:space:]]*$' "$hdr"
          done
      - name: Desktop observed metrics x5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r517-transport
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'); const {chromium}=require('playwright');
          async function measure(browser,i,viewport,isMobile){
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport,deviceScaleFactor:isMobile?2:1,isMobile,hasTouch:isMobile,locale:'hu-HU',colorScheme:'dark',reducedMotion:'no-preference'});
            const page=await context.newPage();
            await page.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.paint.push({n:e.name,t:e.startTime});}).observe({type:'paint',buffered:true});}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.lcp.push(e.startTime);}).observe({type:'largest-contentful-paint',buffered:true});}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__m.shift.push(e.value);}).observe({type:'layout-shift',buffered:true});}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.long.push(e.duration);}).observe({type:'longtask',buffered:true});}catch{}
            });
            const r=await page.goto(`https://formatxsuite.com:8787/?r517_transport=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3500);
            const s=await page.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(x=>x.n==='first-contentful-paint')?.t??null,lcp:window.__m.lcp.at(-1)??null,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),ttfb:n?.responseStart??null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,hero:document.querySelector('#hero .hero-lead')?.textContent?.trim().length||0,canvasCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length};});
            await context.close(); return {run:i,status:r?.status()||0,...s};
          }
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});const rows=[];try{for(let i=1;i<=5;i++)rows.push(await measure(b,i,{width:1440,height:900},false));}finally{await b.close();}console.log(JSON.stringify(rows,null,2));fs.writeFileSync('artifacts/r517-transport/desktop-x5.json',JSON.stringify(rows,null,2));for(const r of rows){if(!r.fcp||!r.lcp||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.hero<20)throw new Error('desktop target fail '+JSON.stringify(r));}})().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Mobile observed metrics 390x844 x3 independent
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'); const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});const rows=[];try{for(let i=1;i<=3;i++){const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',colorScheme:'dark'});const p=await c.newPage();await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.paint.push({n:e.name,t:e.startTime});}).observe({type:'paint',buffered:true});}catch{}try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.lcp.push(e.startTime);}).observe({type:'largest-contentful-paint',buffered:true});}catch{}try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__m.shift.push(e.value);}).observe({type:'layout-shift',buffered:true});}catch{}try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.long.push(e.duration);}).observe({type:'longtask',buffered:true});}catch{}});const resp=await p.goto(`https://formatxsuite.com:8787/?r517_mobile=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3500);const s=await p.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(x=>x.n==='first-contentful-paint')?.t??null,lcp:window.__m.lcp.at(-1)??null,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),ttfb:n?.responseStart??null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});rows.push({run:i,status:resp?.status()||0,...s});await c.close();}}finally{await b.close();}console.log(JSON.stringify(rows,null,2));fs.writeFileSync('artifacts/r517-transport/mobile-x3.json',JSON.stringify(rows,null,2));for(const r of rows){if(!r.fcp||!r.lcp||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2)throw new Error('mobile target fail '+JSON.stringify(r));}})().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Worker log
        if: always()
        run: cat "$RUNNER_TEMP/r517-transport.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r517-transport-candidate-${{ env.CANDIDATE_SHA }}
          path: artifacts/r517-transport/
          retention-days: 30
