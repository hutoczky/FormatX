name: Audit r179 SOTY visual chapters
on:
  push:
    branches: [master]
    paths: ['.github/workflows/audit-r179-soty-visual.yml']
permissions:
  contents: read
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture all six live chapters on desktop and mobile
        run: |
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('node:fs');
          const origin='https://formatxsuite.com';const chapters=['hero','experience','capabilities','pricing','system','resources'];
          async function ready(p){await p.waitForFunction(()=>document.documentElement.dataset.fxSotyContinuityR179==='ready'&&document.documentElement.dataset.fxSotyVersionR179==='r179-soty-organ-field-continuity',{timeout:60000})}
          async function focus(p,id,factor){await p.evaluate(({id,factor})=>{const e=document.getElementById(id);document.documentElement.style.scrollBehavior='auto';window.scrollTo(0,Math.max(0,window.scrollY+e.getBoundingClientRect().top-innerHeight*factor));},{id,factor});await p.waitForTimeout(420)}
          async function run(browser,name,opts,factor){const c=await browser.newContext(opts),p=await c.newPage();p.setDefaultTimeout(60000);await p.goto(`${origin}/?audit_r179_${name}=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});await ready(p);for(const id of chapters){await focus(p,id,factor);const state=await p.evaluate(()=>({active:document.documentElement.dataset.fxSotyActiveOrganR179,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));console.log(name,id,state);await p.screenshot({path:`shots/${name}-${id}.png`,fullPage:false,animations:'disabled',timeout:120000});}await c.close()}
          (async()=>{fs.mkdirSync('shots',{recursive:true});const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await run(b,'desktop',{viewport:{width:1600,height:1000},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference'},.14);await run(b,'mobile',{viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'},.10)}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r179-six-chapter-visual-${{ github.run_id }}
          path: shots/*.png
          if-no-files-found: error
          retention-days: 3
