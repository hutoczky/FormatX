name: Verify canonical MAG runtime
run-name: Canonical MAG runtime for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  push:
    branches: [master, agent/r484-periodic-surface-energy]
    paths:
      - 'docs/scifi-ui/**'
      - '.github/scripts/validate-mag-surface-energy-r484.cjs'
      - '.github/scripts/validate-mag-pause-owner-r485.cjs'
      - '.github/scripts/validate-live-mag-functional.cjs'
      - '.github/workflows/verify-mag-surface-energy-r484.yml'
  workflow_run:
    workflows: ['Prepare or deploy FormatX production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: canonical-mag-runtime-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  native-surface-energy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      FORMATX_VERIFY_LIVE: ${{ github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[verify-live-mag]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDITED_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source contracts
        run: |
          node .github/scripts/validate-living-core-r425-source.cjs
          node .github/scripts/validate-mag-pause-owner-r485.cjs
          node --check .github/scripts/validate-live-mag-functional.cjs

      - name: Wait for exact audited production revision
        if: env.FORMATX_VERIFY_LIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://formatxsuite.com/p0-validation-version.txt?wait=${GITHUB_RUN_ID}-${attempt}" \
              -o "$RUNNER_TEMP/live-p0.txt" && cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
              echo 'Exact production revision is live.'
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Install browser verifier
        run: |
          mkdir -p "$RUNNER_TEMP/mag-browser"
          cd "$RUNNER_TEMP/mag-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Verify exact commit locally
        if: env.FORMATX_VERIFY_LIVE != 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/mag-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4173/scifi-ui/
        run: |
          python3 -m http.server 4173 --directory docs > "$RUNNER_TEMP/mag-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          xvfb-run -a node .github/scripts/validate-mag-surface-energy-r484.cjs

      - name: Verify canonical deployed MAG behavior
        if: env.FORMATX_VERIFY_LIVE == 'true'
        env:
          NODE_PATH: ${{ runner.temp }}/mag-browser/node_modules
          FORMATX_TEST_URL: https://formatxsuite.com/
          FORMATX_MAG_EVIDENCE_DIR: artifacts/live-mag-functional
        run: node .github/scripts/validate-live-mag-functional.cjs

      - name: Upload measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mag-runtime-${{ env.AUDITED_SHA }}-${{ github.event_name }}
          path: |
            artifacts/r484-surface-energy
            artifacts/live-mag-functional
          if-no-files-found: warn
          retention-days: 30

      - name: Publish measured result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          description='Canonical MAG runtime verification failed'
          context='FormatX canonical MAG runtime'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='Renderer, motion, pause/resume, ASK and fallback passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" -f context="$context" -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
