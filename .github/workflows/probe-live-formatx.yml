name: Probe live FormatX production website

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-mag-chapters-r2200.js'
      - 'docs/scifi-ui/styles/formatx-mag-chapters-r2200.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-net-speed-r1800.js'
      - 'billing-worker/src/production-content-entry.js'
      - '.github/workflows/probe-live-formatx.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-live-production-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout current source of truth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify the deployed MAG aperture and actual assets
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p live-probe
          BASE='https://formatxsuite.com'
          SOURCE='docs/scifi-ui/index.html'
          JS='docs/scifi-ui/scripts/formatx-mag-chapters-r2200.js'
          CSS='docs/scifi-ui/styles/formatx-mag-chapters-r2200.css'
          JS_REF="$(grep -oE '/scifi-ui/scripts/formatx-mag-chapters-r2200.js\\?v=[^"]+' "$SOURCE" | head -n1)"
          CSS_REF="$(grep -oE '/scifi-ui/styles/formatx-mag-chapters-r2200.css\\?v=[^"]+' "$SOURCE" | head -n1)"
          test -n "$JS_REF"
          test -n "$CSS_REF"
          printf 'Expected production assets: %s and %s\\n' "$JS_REF" "$CSS_REF"
          verified=0
          for attempt in $(seq 1 25); do
            printf 'Live deployment check %s/25\\n' "$attempt"
            rm -f live-probe/home.html live-probe/chapter.js live-probe/chapter.css live-probe/net-ping.json
            if curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' -o live-probe/home.html "$BASE/scifi-ui/?magprobe=$GITHUB_SHA-$attempt" \\
              && curl -fsSL --connect-timeout 8 --max-time 25 -o live-probe/chapter.js "$BASE$JS_REF" \\
              && curl -fsSL --connect-timeout 8 --max-time 25 -o live-probe/chapter.css "$BASE$CSS_REF" \\
              && curl -fsSL --connect-timeout 8 --max-time 25 -o live-probe/net-ping.json "$BASE/api/net/ping?r=$GITHUB_SHA-$attempt" \\
              && grep -Fq "$JS_REF" live-probe/home.html \\
              && grep -Fq "$CSS_REF" live-probe/home.html \\
              && grep -Fq 'data-fx-mag-chapters-style="true"' live-probe/home.html \\
              && cmp -s "$JS" live-probe/chapter.js \\
              && cmp -s "$CSS" live-probe/chapter.css \\
              && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' live-probe/net-ping.json; then
              verified=1
              break
            fi
            sleep 10
          done
          echo "mag_aperture_live_verified=$verified" | tee live-probe/result.txt
          echo "new_build=$verified" >> "$GITHUB_OUTPUT"
          if [[ "$verified" != '1' ]]; then
            echo 'The live homepage and served MAG assets do not match the current repository revision.' >&2
            exit 1
          fi

      - name: Upload independent live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-live-production-probe
          path: live-probe
          retention-days: 3
          if-no-files-found: warn

      - name: Publish verified production status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BUILD: ${{ steps.probe.outputs.new_build }}
        shell: bash
        run: |
          if [ "$NEW_BUILD" = '1' ]; then
            state='success'
            description='Live MAG chapter HTML, JS and CSS match current Git revision'
          else
            state='failure'
            description='Live MAG chapter deployment is missing or mismatched'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \\
            -f state="$state" \\
            -f context='FormatX live production probe' \\
            -f description="$description" \\
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
