name: Probe live FormatX APEX website

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/styles/formatx-p0-first-paint-r490.css'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/styles/formatx-living-habitat-r1530.css'
      - 'docs/scifi-ui/scripts/formatx-site-sensory-r1755.js'
      - '.github/workflows/probe-live-formatx.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-live-apex-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Wait for Cloudflare Git deployment and verify APEX assets
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p live-probe
          found_new=0
          for attempt in $(seq 1 48); do
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/home.html 'https://formatxsuite.com/scifi-ui/?lang=hu'
            home_status=$?
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/p0.css 'https://formatxsuite.com/scifi-ui/styles/formatx-p0-first-paint-r490.css?v=20260927-r1759-visible-through-intro'
            css_status=$?
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/mag-birth.js 'https://formatxsuite.com/scifi-ui/scripts/formatx-mag-birth-live-r533.js?v=20260928-r1776-photoreal-visual-upgrade'
            js_status=$?
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/site-sensory.js 'https://formatxsuite.com/scifi-ui/scripts/formatx-site-sensory-r1755.js?v=20260927-r1756-zero-first-paint'
            sensory_status=$?
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/current-mag.js 'https://formatxsuite.com/scifi-ui/scripts/formatx-current-mag-loader-r422.js?v=20260928-r1779-mobile-obsidian-proof'
            current_mag_status=$?
            curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o live-probe/crystal-organism.js 'https://formatxsuite.com/scifi-ui/scripts/formatx-crystal-organism-r326.js?v=20260928-r1779-mobile-obsidian-proof'
            renderer_status=$?
            if [ "$home_status" = '0' ] \
               && [ "$css_status" = '0' ] \
               && [ "$js_status" = '0' ] \
               && [ "$sensory_status" = '0' ] \
               && [ "$current_mag_status" = '0' ] \
               && [ "$renderer_status" = '0' ] \
               && grep -Fq 'formatx-p0-first-paint-r490.css?v=20260927-r1759-visible-through-intro' live-probe/home.html \
               && grep -Fq 'formatx-p0-motion-scheduler-r490.js?v=20260928-r1779-mobile-obsidian-proof' live-probe/home.html \
               && grep -Fq 'formatx-mag-birth-live-r533.js?v=20260928-r1776-photoreal-visual-upgrade' live-probe/home.html \
               && grep -Fq 'formatx-site-sensory-r1755.js?v=20260927-r1756-zero-first-paint' live-probe/home.html \
               && grep -Fq 'production-r1759-proxy-visible-through-intro-until-webgl' live-probe/p0.css \
               && grep -Fq 'retired-no-runtime-text-lcp-candidate' live-probe/mag-birth.js \
               && grep -Fq 'lazy-intent-single-coalesced-raf-zero-idle' live-probe/site-sensory.js \
               && grep -Fq 'formatx-crystal-organism-r326.js?v=20260928-r1779-mobile-obsidian-proof' live-probe/current-mag.js \
               && grep -Fq "fxNativeMagVisualR1779='mobile-obsidian-bioglass-monolith-broad-facets-no-tendrils'" live-probe/crystal-organism.js \
               && grep -Fq "fxNativeMagMobileR1779='zero-tendrils-zero-flower-low-overdraw-proof-target'" live-probe/crystal-organism.js \
               && ! grep -Eq 'formatx-igloo|reference-commerce|professional-sections|pricing-sync' live-probe/home.html; then
              found_new=1
              break
            fi
            sleep 10
          done
          {
            echo "home_curl_status=$home_status"
            echo "css_curl_status=$css_status"
            echo "js_curl_status=$js_status"
            echo "sensory_curl_status=$sensory_status"
            echo "current_mag_curl_status=$current_mag_status"
            echo "renderer_curl_status=$renderer_status"
            echo "new_build=$found_new"
          } | tee live-probe/result.txt
          echo "new_build=$found_new" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload live probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-live-apex-probe
          path: live-probe
          retention-days: 3

      - name: Publish probe status
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BUILD: ${{ steps.probe.outputs.new_build }}
        shell: bash
        run: |
          if [ "$NEW_BUILD" = '1' ]; then
            state='success'
            description='Live domain serves the current R1779 mobile obsidian MAG proof'
          else
            state='failure'
            description='Live domain is not yet serving the current R1779 mobile obsidian MAG proof'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX live APEX probe' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
