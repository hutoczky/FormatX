name: Probe live FormatX production website

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/production-revision.txt'
      - 'docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
      - 'docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
      - 'docs/scifi-ui/styles/formatx-p0-first-paint-r490.css'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/styles/formatx-living-habitat-r1530.css'
      - 'docs/scifi-ui/scripts/formatx-site-sensory-r1755.js'
      - 'docs/scifi-ui/scripts/formatx-net-speed-r1800.js'
      - 'docs/scifi-ui/styles/formatx-net-speed-r1800.css'
      - 'billing-worker/src/production-content-entry.js'
      - '.github/workflows/probe-live-formatx.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-live-production-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out the exact release sources
        uses: actions/checkout@v5

      - name: Verify current production revision, MAG and NET on both domains
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p live-probe
          found_new=0
          expected_revision='docs/production-revision.txt'
          expected_archive='docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
          expected_css='docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
          for attempt in $(seq 1 48); do
            ok=1
            echo "Current revision / living MAG probe $attempt/48"
            for domain in https://formatxsuite.com https://www.formatxsuite.com; do
              suffix=origin
              if [[ "$domain" == https://www.formatxsuite.com ]]; then suffix=www; fi
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "$domain/production-revision.txt?release=$GITHUB_RUN_ID-$attempt" \
                -o "live-probe/$suffix-revision.txt"; then ok=0; continue; fi
              if ! cmp -s "$expected_revision" "live-probe/$suffix-revision.txt"; then
                echo "$suffix revision mismatch"; ok=0; continue
              fi
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "$domain/scifi-ui/?lang=hu&release=$GITHUB_RUN_ID-$attempt" \
                -o "live-probe/$suffix-home.html"; then ok=0; continue; fi
              if ! grep -Fq 'formatx-cinematic-archive-r1987.js' "live-probe/$suffix-home.html" \
                || ! grep -Fq 'formatx-net-speed-r1800.js' "live-probe/$suffix-home.html" \
                || ! grep -Fq 'data-fx-award-proof' "live-probe/$suffix-home.html"; then
                echo "$suffix missing live MAG, NET or original evidence"; ok=0; continue
              fi
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "$domain/scifi-ui/scripts/formatx-cinematic-archive-r1987.js?release=$GITHUB_RUN_ID-$attempt" \
                -o "live-probe/$suffix-archive.js" \
                || ! cmp -s "$expected_archive" "live-probe/$suffix-archive.js"; then
                echo "$suffix archive source differs from verified commit"; ok=0; continue
              fi
              if ! curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "$domain/scifi-ui/styles/formatx-cinematic-archive-r1987.css?release=$GITHUB_RUN_ID-$attempt" \
                -o "live-probe/$suffix-archive.css" \
                || ! cmp -s "$expected_css" "live-probe/$suffix-archive.css"; then
                echo "$suffix archive CSS differs from verified commit"; ok=0; continue
              fi
            done
            if [[ "$ok" = 1 ]] && curl -fsSL --max-time 20 \
              "https://formatxsuite.com/api/net/ping?release=$GITHUB_RUN_ID-$attempt" \
              -o live-probe/net-ping.json \
              && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' live-probe/net-ping.json; then
              found_new=1
              break
            fi
            sleep 5
          done
          {
            echo "expected_revision=$(head -n 2 "$expected_revision" | tail -n 1)"
            echo "revision_and_archive_match=$found_new"
            echo "all_domains=formatxsuite.com,www.formatxsuite.com"
          } | tee live-probe/result.txt
          echo "new_build=$found_new" >> "$GITHUB_OUTPUT"
          if [[ "$found_new" != 1 ]]; then
            echo 'Exact current MAG and original NET production files are not serving on both domains.' >&2
          fi

      - name: Upload live probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-live-production-probe
          path: live-probe
          retention-days: 3

      - name: Publish probe status
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_BUILD: ${{ steps.probe.outputs.new_build }}
        shell: bash
        run: |
          if [ "$NEW_BUILD" = '1' ]; then
            state='success'
            description='Both domains serve exact current MAG archive and NET release'
          else
            state='failure'
            description='Exact current MAG archive or revision not yet live on both domains'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX live production probe' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
