name: P0 R519 exact desktop and pricing proof
on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r517-owner-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CANDIDATE_REF: p0-r519-apex-price
  CANDIDATE_SHA: 9272f47f4167485f26906172fe626aef13909f55
jobs:
  desktop-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.CANDIDATE_REF }}', fetch-depth: 2}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm, cache-dependency-path: billing-worker/package-lock.json}
      - name: Verify exact R519 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "0c983b25cbabecbdd73c8df760638c0c7554663b"
          test -z "$(git status --porcelain)"
          node --check docs/scifi-ui/scripts/formatx-apex.js
          test "$(git diff --name-only HEAD^ HEAD)" = "docs/scifi-ui/scripts/formatx-apex.js"
          grep -q "if (persist || shellLanguage !== language) updatePrice();" docs/scifi-ui/scripts/formatx-apex.js
      - name: Start exact R519 local Worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r519-proof.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts >/dev/null
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r519-proof.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r519-proof.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r519-proof.log" || true; exit 1
      - name: Existing organism commerce functional regression
        shell: bash
        env:
          FORMATX_TEST_URL: https://formatxsuite.com:8787/
        run: |
          set -euo pipefail
          node .github/scripts/validate-organism-main.cjs
      - name: Five fresh desktop Chrome measurements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r519-desktop
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),{chromium}=require('playwright');
          async function one(i){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'}),p=await c.newPage();
            await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.paint.push({n:e.name,t:e.startTime}))).observe({type:'paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.lcp.push(e.startTime))).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)window.__m.shift.push(e.value)})).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.long.push(e.duration))).observe({type:'longtask',buffered:true})}catch{}});
            const r=await p.goto(`https://formatxsuite.com:8787/?r519_desktop=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3500);
            const x=await p.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(e=>e.n==='first-contentful-paint')?.t??0,lcp:window.__m.lcp.at(-1)??0,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),longtasks:window.__m.long,ttfb:n?.responseStart??0,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||'',renderer:document.documentElement.dataset.fxRenderer||''}});
            await c.close();await b.close();return{run:i,status:r?.status()||0,...x};
          }
          (async()=>{const rows=[];for(let i=1;i<=5;i++)rows.push(await one(i));console.log('R519_DESKTOP_X5',JSON.stringify(rows,null,2));fs.writeFileSync('artifacts/r519-desktop/results.json',JSON.stringify(rows,null,2));const fail=rows.filter(r=>r.status!==200||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.apex!=='controller-performance-v2');if(fail.length)throw new Error('R519 desktop target failures '+JSON.stringify(fail));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: p0-r519-desktop-pricing-proof, path: 'artifacts/r519-desktop/\norganism-main-report.json\norganism-main-desktop.png\norganism-main-mobile.png', retention-days: 30}
