name: One-shot P0 R495 critical path repair

on:
  push:
    branches: [p0-vip-awwwards-gate]
    paths:
      - '.github/workflows/one-shot-p0-r495-critical-path.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Repair first paint, MAG preview and canonical ASK activation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          index_path = Path('docs/scifi-ui/index.html')
          quality_path = Path('docs/scifi-ui/styles/formatx-quality-r461.css')
          motion_path = Path('docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js')

          index = index_path.read_text(encoding='utf-8')
          quality = quality_path.read_text(encoding='utf-8')
          motion = motion_path.read_text(encoding='utf-8')

          # R495: load the small settled-geometry owner directly. This removes the
          # event-horizon -> @import -> stability serial discovery chain.
          stability = '  <link rel="stylesheet" fetchpriority="high" data-fx-p0-first-frame-r495="true" href="./styles/formatx-first-frame-stability-r283.css?v=20260823-r320-render-blocking" media="(prefers-reduced-motion: no-preference) and (min-width: 901px)">\n'
          if 'data-fx-p0-first-frame-r495=' not in index:
              anchor = '  <link rel="stylesheet" href="./styles/formatx-event-horizon.css?v=20260819-r224-desktop-intro" fetchpriority="high" media="(prefers-reduced-motion: no-preference) and (min-width: 901px)">\n'
              if anchor not in index:
                  raise SystemExit('R495: R494 event-horizon link not found')
              index = index.replace(anchor, stability + '  <link rel="stylesheet" href="./styles/formatx-event-horizon.css?v=20260819-r224-desktop-intro" media="(prefers-reduced-motion: no-preference) and (min-width: 901px) and (pointer: fine)">\n', 1)

          # R495: restore the tiny global reset that was previously inherited from
          # the large legacy critical bundle. This fixes the observed UA x=8 first
          # frame and the resulting 2-4 px mobile/zoom overflow without re-enabling
          # the 27.8 KB bundle on the critical path.
          marker = '/* R495 P0 critical reset + filter-free MAG first frame. */'
          if marker not in quality:
              preview = ''
              quality = quality.rstrip() + f'''\n\n{marker}\nhtml,\nbody {{\n  margin: 0 !important;\n  padding: 0 !important;\n  max-width: 100% !important;\n  overflow-x: clip !important;\n}}\nbody.living-architecture {{\n  margin: 0 !important;\n}}\nhtml body.living-architecture #hero .hero-space {{\n  --fx-mag-first-frame: url("data:image/svg+xml;base64,{preview}");\n}}\nhtml body.living-architecture #hero .hero-space::before {{\n  filter: none !important;\n  transform: none !important;\n  will-change: auto !important;\n}}\nhtml body.living-architecture #hero .hero-space::after {{\n  box-shadow: none !important;\n  filter: none !important;\n}}\n/* deploy-r495-filter-free-first-frame */\n'''

          # R495: canonical ASK must activate the full organism runtime even when
          # the voice API has already arrived. Previously this early return opened
          # the dialogue through another listener but prevented immersiveactivate,
          # so organism-interface.js was never requested.
          old = '''function activateCanonicalAsk(event){\n  const target=event.target instanceof Element?event.target.closest('#hero .fx-reference-controls-r204 .fx-reference-ask'):null;\n  if(!(target instanceof HTMLButtonElement))return;\n  if(typeof window.FormatXOrganismVoice?.open==='function')return;\n  askActivationPending=true;\n  root.dataset.fxCanonicalAskActivationR477='loading-deferred-organism';\n  if(root.dataset.fxImmersive!=='active')root.dataset.fxImmersive='active';\n  root.dataset.fxImmersiveSource='canonical-ask-r477';\n  dispatchEvent(new CustomEvent('formatx:immersiveactivate',{detail:{source:'canonical-ask-r477'}}));\n  queueMicrotask(openPendingCanonicalAsk);\n}'''
          new = '''function activateCanonicalAsk(event){\n  const target=event.target instanceof Element?event.target.closest('#hero .fx-reference-controls-r204 .fx-reference-ask'):null;\n  if(!(target instanceof HTMLButtonElement))return;\n  const voiceReady=typeof window.FormatXOrganismVoice?.open==='function';\n  if(root.dataset.fxImmersive!=='active')root.dataset.fxImmersive='active';\n  root.dataset.fxImmersiveSource='canonical-ask-r477';\n  dispatchEvent(new CustomEvent('formatx:immersiveactivate',{detail:{source:'canonical-ask-r477'}}));\n  if(voiceReady){\n    root.dataset.fxCanonicalAskActivationR477='runtime-activated-existing-dialogue';\n    return;\n  }\n  askActivationPending=true;\n  root.dataset.fxCanonicalAskActivationR477='loading-deferred-organism';\n  queueMicrotask(openPendingCanonicalAsk);\n}'''
          if old not in motion:
              raise SystemExit('R495: canonical ASK source block not found')
          motion = motion.replace(old, new, 1)

          index_path.write_text(index, encoding='utf-8')
          quality_path.write_text(quality, encoding='utf-8')
          motion_path.write_text(motion, encoding='utf-8')

          # Structural contracts: no threshold relaxation, no audit-only path.
          assert 'data-fx-p0-first-frame-r495="true"' in index
          assert 'data-fx-critical-core-r227="true"' in index and 'media="not all"' in index
          assert marker in quality and 'deploy-r495-filter-free-first-frame' in quality
          assert '<feGaussianBlur' not in quality.split(marker,1)[1]
          assert "const voiceReady=typeof window.FormatXOrganismVoice?.open==='function';" in motion
          assert "dispatchEvent(new CustomEvent('formatx:immersiveactivate'" in motion
          print('PASS R495: direct stable CSS, global reset, filter-free MAG preview and canonical ASK runtime activation installed.')
          PY

          node --check docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js
          git diff --check
          git diff --stat

      - name: Commit R495 production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/formatx-quality-r461.css docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js
          if git diff --cached --quiet; then
            echo 'No R495 changes required.'
            exit 0
          fi
          git commit -m 'R495 repair P0 critical path and organism activation'
          git push origin HEAD:p0-vip-awwwards-gate
