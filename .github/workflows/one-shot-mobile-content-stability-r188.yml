name: One-shot mobile content stability r188

on:
  push:
    paths:
      - .github/workflows/one-shot-mobile-content-stability-r188.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/r188_mobile_content_stability.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js docs/scifi-ui/scripts/formatx-mobile-hero-stability-r151.js
          git commit -m "fix(mobile): canonical proof and download content r188"
          git push origin HEAD:master
