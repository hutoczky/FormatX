name: Prepare or deploy FormatX production
run-name: FormatX production from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated candidate to the production custom domains'
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/validate-content-standard.py'
      - '.github/scripts/validate-content-standard-v2.py'
      - '.github/scripts/validate-public-release-integration.py'
      - '.github/scripts/production-preflight.cjs'
      - '.github/scripts/validate-pricing-qr.cjs'
      - '.github/scripts/validate-user-requested-site-features.cjs'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
  push:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/validate-content-standard.py'
      - '.github/scripts/validate-content-standard-v2.py'
      - '.github/scripts/validate-public-release-integration.py'
      - '.github/scripts/production-preflight.cjs'
      - '.github/scripts/validate-pricing-qr.cjs'
      - '.github/scripts/validate-user-requested-site-features.cjs'
      - '.github/workflows/deploy-formatx-custom-domain.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate public, release and every requested website feature
        run: |
          python3 .github/scripts/validate-content-standard-v2.py
          python3 .github/scripts/validate-public-release-integration.py
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-pricing-qr.cjs
          node .github/scripts/validate-user-requested-site-features.cjs

      - name: Validate production JavaScript syntax
        run: |
          node --check content-preview-entry.js
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/production-entry.js
          node --check billing-worker/src/production-content-entry.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/scifi-ui/scripts/release-metadata.js
          node --check docs/scifi-ui/scripts/formatx-public-shell.js
          node --check docs/scifi-ui/scripts/public-evidence-pages.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node --check docs/scifi-ui/scripts/formatx-license-links.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/organism-menu-controller.js
          node --check docs/scifi-ui/scripts/organism-console-state.js
          node --check docs/scifi-ui/scripts/organism-core-controller.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-voice-stability.js
          node --check docs/scifi-ui/scripts/organism-master-sync.js
          node --check docs/scifi-ui/scripts/organism-core-interaction.js
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node --check docs/scifi-ui/scripts/synaptic-thought-disclosure.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/mobile-core-engine-v3.js
          node --check .github/scripts/validate-pricing-qr.cjs
          node --check .github/scripts/validate-user-requested-site-features.cjs

      - name: Install dependencies and run Worker tests
        working-directory: billing-worker
        run: |
          npm ci
          npm test

      - name: Build production Worker without deploying
        working-directory: billing-worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-production-candidate

      - name: Upload production candidate and readiness report
        uses: actions/upload-artifact@v4
        with:
          name: formatx-production-candidate-${{ github.sha }}
          path: |
            .wrangler-production-candidate
            artifacts/production-readiness.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish production validation status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_CONTEXT: FormatX production validation
          STATUS_DESCRIPTION: Requested features and Worker candidate validation
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              state,
              context: process.env.STATUS_CONTEXT,
              description: process.env.STATUS_DESCRIPTION.slice(0, 140),
              target_url: process.env.STATUS_URL,
            }),
          });
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE

  deploy:
    name: Deploy to FormatX custom domains
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.formatxsuite.com/scifi-ui/
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Install locked Worker dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Deploy the validated production Worker
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.FORMATX_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'ffd7d28ea7c6a510549dc9363619c8c5' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy

      - name: Smoke-test both custom domains and requested features
        run: |
          set -euo pipefail
          expected_loader_marker="$(grep -Eo 'safe-ready-v[0-9]+' docs/scifi-ui/scripts/igloo-parity.js | head -n 1)"
          expected_release_version="$(node -p "require('./docs/scifi-ui/data/current-release.json').version")"
          expected_release_schema="$(node -p "require('./docs/scifi-ui/data/current-release.json').schema_version")"
          expected_release_digest="$(node -p "require('./docs/scifi-ui/data/current-release.json').channels?.windows?.digest || ''")"
          test -n "$expected_loader_marker"
          test -n "$expected_release_version"
          test -n "$expected_release_schema"

          for origin in https://formatxsuite.com https://www.formatxsuite.com; do
            success=false
            for attempt in $(seq 1 12); do
              tmp="$(mktemp -d)"
              if curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/" > "$tmp/home.html" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/license.html" > "$tmp/license.html" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/igloo-parity.js?v=20260802-live-audit-1" > "$tmp/loader.js" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/organism-voice.js?v=20260802-live-audit-1" > "$tmp/voice.js" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/organism-master-sync.js?v=20260802-live-audit-1" > "$tmp/master.js" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/styles/organism-master-sync.css?v=20260802-live-audit-1" > "$tmp/master.css" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/formatx-infinite-scroll.js?v=20260802-live-audit-1" > "$tmp/infinite.js" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/scripts/single-language-toggle.js?v=20260802-live-audit-1" > "$tmp/language.js" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/styles/formatx-mobile-unified.css?v=20260802-live-audit-1" > "$tmp/mobile.css" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/assets/qr/business_lite-huf.svg?v=20260802-live-audit-1" > "$tmp/qr.svg" \
                && curl --fail --silent --show-error --location --max-time 30 "$origin/scifi-ui/data/current-release.json" > "$tmp/release.json" \
                && grep -Fq "$expected_loader_marker" "$tmp/loader.js" \
                && grep -Fq 'organism-voice.js?v=20260730-organism-voice-4' "$tmp/loader.js" \
                && grep -Fq 'organism-master-sync.js?v=20260802-master-sync-1' "$tmp/loader.js" \
                && grep -Fq 'SpeechSynthesisUtterance' "$tmp/voice.js" \
                && grep -Fq 'fx-organism-master-toggle' "$tmp/voice.js" \
                && grep -Fq 'data-fx-organism-dialogue-enabled' "$tmp/master.js" \
                && grep -Fq 'fx-organism-master-disabled' "$tmp/master.js" \
                && grep -Fq 'html.fx-organism-master-disabled .fx-thought-genome-layer' "$tmp/master.css" \
                && grep -Fq 'html.fx-organism-master-disabled .fx-thought-genome-disclosure' "$tmp/master.css" \
                && grep -Fq 'boundary-v4' "$tmp/infinite.js" \
                && grep -Fq "toggle.className = 'fx-language-toggle'" "$tmp/language.js" \
                && grep -Fq 'Részletes licencfeltételek' "$tmp/license.html" \
                && grep -Fq 'Detailed licence terms' "$tmp/license.html" \
                && grep -Fq 'no text overlap' "$tmp/mobile.css" \
                && grep -Fq '<svg' "$tmp/qr.svg" \
                && node - "$tmp/release.json" "$expected_release_version" "$expected_release_schema" "$expected_release_digest" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedVersion, expectedSchema, expectedDigest] = process.argv.slice(2);
          const live = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (live.ok !== true) process.exit(1);
          if (live.version !== expectedVersion) process.exit(1);
          if (String(live.schema_version) !== expectedSchema) process.exit(1);
          if (expectedDigest && live.channels?.windows?.digest !== expectedDigest) process.exit(1);
          NODE
              then
                success=true
                rm -rf "$tmp"
                break
              fi
              rm -rf "$tmp"
              sleep 10
            done
            if [[ "$success" != true ]]; then
              echo "Production requested-feature smoke test failed for $origin" >&2
              exit 1
            fi
          done

      - name: Publish production deployment status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_CONTEXT: FormatX production deployment
          STATUS_DESCRIPTION: Cloudflare deploy and live requested-feature smoke test
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              state,
              context: process.env.STATUS_CONTEXT,
              description: process.env.STATUS_DESCRIPTION.slice(0, 140),
              target_url: process.env.STATUS_URL,
            }),
          });
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE
