name: FormatX production deploy
run-name: FormatX production deploy from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: formatx-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate production configuration
        id: validate_config
        shell: python
        run: |
          import json
          from pathlib import Path

          config = Path("billing-worker/wrangler.jsonc")
          data = json.loads(config.read_text(encoding="utf-8"))
          assert data["name"] == "formatx"
          assert data["main"] == "src/production-with-license.js"
          assert data["assets"]["directory"] == "../docs"
          assert data["assets"]["run_worker_first"] is True
          expected = {
              ("formatxsuite.com", True),
              ("www.formatxsuite.com", True),
          }
          actual = {
              (route.get("pattern"), route.get("custom_domain"))
              for route in data.get("routes", [])
          }
          assert expected.issubset(actual)
          required_files = [
              "billing-worker/src/license-center.js",
              "billing-worker/src/signed-license-api.js",
              "billing-worker/src/pricing-v100-api.js",
              "billing-worker/license-migrations/0001_license_center.sql",
              "billing-worker/license-migrations/0002_signed_client_api.sql",
              "billing-worker/public-keys/license-api-issuer-public-key.pem",
              "docs/fx-owner-license/index.html",
              "docs/scifi-ui/scripts/start-sale.js",
              "docs/scifi-ui/scripts/checkout-v100.js",
              "docs/scifi-ui/scripts/checkout-language-v100.js",
              "docs/scifi-ui/scripts/future-5000.js",
              "docs/scifi-ui/scripts/future-5000-effects.js",
              "docs/scifi-ui/scripts/causal-memory-field.js",
              "docs/scifi-ui/scripts/causal-memory-hover.js",
              "docs/scifi-ui/scripts/causal-memory-boot.js",
              "docs/scifi-ui/styles/start-sale.css",
              "docs/scifi-ui/styles/pricing-v100.css",
              "docs/scifi-ui/styles/future-5000.css",
              "docs/scifi-ui/styles/future-5000-effects.css",
              "docs/scifi-ui/styles/future-5000-readability.css",
              "docs/scifi-ui/styles/causal-memory-field.css",
              "docs/scifi-ui/styles/causal-memory-hover.css",
              "docs/scifi-ui/styles/causal-memory-boot.css",
          ]
          for file_name in required_files:
              assert Path(file_name).is_file(), file_name

          start_sale = Path("docs/scifi-ui/scripts/start-sale.js").read_text(encoding="utf-8")
          future_script = Path("docs/scifi-ui/scripts/future-5000.js").read_text(encoding="utf-8")
          future_styles = Path("docs/scifi-ui/styles/future-5000.css").read_text(encoding="utf-8")
          boot_script = Path("docs/scifi-ui/scripts/causal-memory-boot.js").read_text(encoding="utf-8")
          boot_styles = Path("docs/scifi-ui/styles/causal-memory-boot.css").read_text(encoding="utf-8")
          worker = Path("billing-worker/src/production-with-license.js").read_text(encoding="utf-8")
          assert "formatx-plan-qr-dock" in start_sale
          assert "cards.insertAdjacentElement('afterend', dock)" in start_sale
          assert "formatx-future-5000" in future_script
          assert ".fx-plan-qr-grid" in future_styles
          assert "prefers-reduced-motion: reduce" in future_styles
          assert "window.addEventListener('pageshow'" in boot_script
          assert "performance.getEntriesByType('navigation')" in boot_script
          assert "event.persisted" in boot_script
          assert "function resetBoot(root)" in boot_script
          assert "const mobileViewport" in boot_script
          assert "function rootIsVisible(root)" in boot_script
          assert "new IntersectionObserver" in boot_script
          assert "visible-entry" in boot_script
          assert "fx-causal-boot-mobile" in boot_script
          assert "fx-causal-boot-minimal" in boot_script
          assert ".fx5k-stage" in boot_styles
          assert ".fx5k-principles" in boot_styles
          assert "(pointer: coarse)" in boot_styles
          assert "@keyframes fx-causal-root-energize-mobile" in boot_styles
          assert "@keyframes fx-causal-root-minimal" in boot_styles
          assert "CAUSAL_BOOT_VERSION = '20260726-causal-boot-3'" in worker
          print("Production website, mobile viewport boot animation, QR row and license center are valid.")

      - name: Require Cloudflare API token
        id: require_token
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '\r\n')"
          TOKEN="${TOKEN#Authorization: Bearer }"
          TOKEN="${TOKEN#Bearer }"
          TOKEN="$(printf '%s' "$TOKEN" | xargs)"
          if [ "${#TOKEN}" -lt 20 ]; then
            echo "The CLOUDFLARE_API_TOKEN repository secret is required." >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Install Worker dependencies
        id: install_dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Deploy website, D1 license database and Access protection
        id: live_deploy
        working-directory: billing-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ffd7d28ea7c6a510549dc9363619c8c5
          FORMATX_ADMIN_EMAIL: hutoczky@gmail.com
        shell: bash
        run: |
          set -uo pipefail

          run_deploy_attempt() {
            local attempt="$1"
            local log_file status stage
            log_file="$(mktemp)"
            echo "Production deployment attempt ${attempt}/2"

            bash scripts/deploy-license-center-live.sh 2>&1 | tee "$log_file"
            status="${PIPESTATUS[0]}"

            if [ "$status" -eq 0 ]; then
              rm -f "$log_file"
              return 0
            fi

            stage="$(grep -E '^[0-9]+/10' "$log_file" | tail -n 1 | tr -d '\r' || true)"
            stage="${stage:-a telepítő indulása előtt}"
            echo "FORMATX_DEPLOY_STAGE=$stage" >> "$GITHUB_ENV"
            echo "Deployment attempt ${attempt} failed at: $stage" >&2
            rm -f "$log_file"
            return "$status"
          }

          if run_deploy_attempt 1; then
            exit 0
          fi

          echo "The first deployment attempt failed; retrying once after 20 seconds." >&2
          sleep 20

          if run_deploy_attempt 2; then
            exit 0
          fi

          echo "Both production deployment attempts failed." >&2
          exit 1

      - name: Verify public website, mobile animation, QR row and license API
        id: verify_production
        shell: bash
        run: |
          set -euo pipefail

          verify_site() {
            local url="$1"
            local origin="${url%/}"
            for attempt in $(seq 1 36); do
              local headers body boot_js boot_css status
              headers="$(mktemp)"
              body="$(mktemp)"
              boot_js="$(mktemp)"
              boot_css="$(mktemp)"
              status="$(curl -sS --connect-timeout 10 --max-time 30 \
                -D "$headers" -o "$body" -w '%{http_code}' \
                -H 'Cache-Control: no-cache' "$url" || true)"

              curl -fsSL --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$origin/scifi-ui/scripts/causal-memory-boot.js?v=20260726-causal-boot-3" \
                -o "$boot_js" || true
              curl -fsSL --connect-timeout 10 --max-time 30 \
                -H 'Cache-Control: no-cache' \
                "$origin/scifi-ui/styles/causal-memory-boot.css?v=20260726-causal-boot-3" \
                -o "$boot_css" || true

              if [ "$status" = "200" ] \
                 && grep -Fq 'FormatX Suite Pro' "$body" \
                 && grep -Fq '/scifi-ui/styles/start-sale.css' "$body" \
                 && grep -Fq '/scifi-ui/styles/pricing-v100.css' "$body" \
                 && grep -Fq '/scifi-ui/styles/future-5000.css' "$body" \
                 && grep -Fq '/scifi-ui/styles/causal-memory-field.css' "$body" \
                 && grep -Fq '/scifi-ui/styles/causal-memory-hover.css' "$body" \
                 && grep -Fq '/scifi-ui/styles/causal-memory-boot.css?v=20260726-causal-boot-3' "$body" \
                 && grep -Fq '/scifi-ui/scripts/start-sale.js' "$body" \
                 && grep -Fq '/scifi-ui/scripts/future-5000.js' "$body" \
                 && grep -Fq '/scifi-ui/scripts/causal-memory-field.js' "$body" \
                 && grep -Fq '/scifi-ui/scripts/causal-memory-hover.js' "$body" \
                 && grep -Fq '/scifi-ui/scripts/causal-memory-boot.js?v=20260726-causal-boot-3' "$body" \
                 && grep -Fq "window.addEventListener('pageshow'" "$boot_js" \
                 && grep -Fq "performance.getEntriesByType('navigation')" "$boot_js" \
                 && grep -Fq 'event.persisted' "$boot_js" \
                 && grep -Fq 'function resetBoot(root)' "$boot_js" \
                 && grep -Fq 'const mobileViewport' "$boot_js" \
                 && grep -Fq 'function rootIsVisible(root)' "$boot_js" \
                 && grep -Fq 'new IntersectionObserver' "$boot_js" \
                 && grep -Fq 'visible-entry' "$boot_js" \
                 && grep -Fq '@keyframes fx-causal-root-energize-mobile' "$boot_css" \
                 && grep -Fq '@keyframes fx-causal-root-minimal' "$boot_css" \
                 && grep -iq '^strict-transport-security:' "$headers" \
                 && grep -iq '^content-security-policy:' "$headers" \
                 && grep -iq '^x-content-type-options: nosniff' "$headers" \
                 && ! grep -iq '^location:' "$headers"; then
                echo "Verified $url with mobile viewport boot animation, separate QR and Year 5000 assets"
                rm -f "$headers" "$body" "$boot_js" "$boot_css"
                return 0
              fi

              rm -f "$headers" "$body" "$boot_js" "$boot_css"
              sleep 10
            done
            echo "Production verification failed for $url" >&2
            return 1
          }

          verify_site 'https://formatxsuite.com/'
          verify_site 'https://www.formatxsuite.com/'

          license_health="$(curl -fsSL --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            'https://formatxsuite.com/api/license/health')"
          LICENSE_HEALTH_JSON="$license_health" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ['LICENSE_HEALTH_JSON'])
          assert data.get('ok') is True, data
          assert data.get('service') == 'formatx-license-center', data
          assert data.get('signed_client_api') is True, data
          assert data.get('signed_client_api_schema') == 1, data
          assert data.get('signature_algorithm') == 'Ed25519', data
          assert data.get('issuer_key_id') == 'formatx-license-issuer-32b0d26716d41bc5', data
          print('Production license API health response is valid.')
          PY

      - name: Record successful production deployment
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 114 --repo "$GITHUB_REPOSITORY" --body "✅ **PASS — éles telepítés és ellenőrzés sikeres**

          - Commit: \`${GITHUB_SHA}\`
          - Főoldal: https://formatxsuite.com/
          - Három külön csomag-QR: ellenőrizve
          - 5000-es vizuális rendszer: ellenőrizve mindkét domainen
          - Frissítéskor újrainduló boot-animáció v3: ellenőrizve
          - Mobil képernyőre lépéskor induló animáció: ellenőrizve
          - BFCache/pageshow újraindítás: ellenőrizve
          - Csökkentett mozgás fényimpulzusa: ellenőrizve
          - Licenc-API: ellenőrizve
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed production deployment
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 114 --repo "$GITHUB_REPOSITORY" --body "❌ **FAILED — az éles telepítés vagy ellenőrzés sikertelen**

          - Commit: \`${GITHUB_SHA}\`
          - Checkout: \`${{ steps.checkout.outcome }}\`
          - Konfiguráció: \`${{ steps.validate_config.outcome }}\`
          - Cloudflare-token: \`${{ steps.require_token.outcome }}\`
          - Node.js: \`${{ steps.setup_node.outcome }}\`
          - Függőségek: \`${{ steps.install_dependencies.outcome }}\`
          - Cloudflare-telepítés: \`${{ steps.live_deploy.outcome }}\`
          - Telepítő szakasz: \`${FORMATX_DEPLOY_STAGE:-nem indult}\`
          - Éles ellenőrzés: \`${{ steps.verify_production.outcome }}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - A hiba kijavításáig az új állapot nem tekinthető igazoltan élőnek."