name: Prepare or deploy FormatX production
run-name: FormatX production from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated candidate to the production custom domains
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
  push:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate public content, release, runtime and security contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-content-standard-v2.py
          python3 .github/scripts/validate-public-release-integration.py
          python3 .github/scripts/validate-webgpu-source.py
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-pricing-qr.cjs
          node .github/scripts/validate-public-site-integrity.cjs
          node .github/scripts/validate-feedback-moderation.cjs
          node .github/scripts/validate-user-requested-site-features.cjs
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs

      - name: Validate production JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check content-preview-entry.js
          node --input-type=module --check < billing-worker/src/production-with-license.js
          node --input-type=module --check < billing-worker/src/production-entry.js
          node --input-type=module --check < billing-worker/src/production-content-entry.js
          node --input-type=module --check < billing-worker/src/production-feedback-entry.js
          node --input-type=module --check < billing-worker/src/feedback-api.js
          node --input-type=module --check < billing-worker/src/feedback-schema.js
          node --input-type=module --check < billing-worker/src/pricing-v100-api.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/organism-interface.js
          node --check docs/scifi-ui/scripts/organism-menu-controller.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-voice-stability.js
          node --check docs/scifi-ui/scripts/organism-master-sync.js
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node --check docs/scifi-ui/scripts/synaptic-thought-disclosure.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          node --check .github/scripts/validate-public-site-integrity.cjs

      - name: Install dependencies and run Worker tests
        working-directory: billing-worker
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Build production Worker without deploying
        working-directory: billing-worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-production-candidate

      - name: Publish production validation status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state,
              context: 'FormatX production validation',
              description: state === 'success' ? 'Production runtime, public surface and Worker validation passed' : 'Production validation failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
          });
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE

  deploy:
    name: Deploy to FormatX custom domains
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://formatxsuite.com/
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Install locked Worker dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Deploy with Wrangler or use connected Cloudflare build
        id: deploy_mode
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.FORMATX_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'ffd7d28ea7c6a510549dc9363619c8c5' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "mode=connected-cloudflare-build" >> "$GITHUB_OUTPUT"
            echo 'Wrangler token unavailable; smoke test will wait for the connected Cloudflare deployment.'
          else
            echo "mode=wrangler" >> "$GITHUB_OUTPUT"
            npx wrangler deploy
          fi

      - name: Smoke-test canonical production and shared seamless scrolling
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGIN='https://formatxsuite.com'
          WWW='https://www.formatxsuite.com'

          for attempt in $(seq 1 30); do
            echo "Production smoke attempt $attempt/30"
            tmp="$(mktemp -d)"
            home_code="$(curl -sS -L --max-time 30 -D "$tmp/home.headers" -o "$tmp/home.html" -w '%{http_code}' "$ORIGIN/" || true)"
            www_code="$(curl -sS -L --max-time 30 -o "$tmp/www.html" -w '%{http_code}' "$WWW/" || true)"
            bootstrap_code="$(curl -sS --max-time 30 -o "$tmp/bootstrap.js" -w '%{http_code}' "$ORIGIN/scifi-ui/scripts/formatx-infinite-scroll.js?v=production-smoke" || true)"
            seamless_code="$(curl -sS --max-time 30 -o "$tmp/seamless.js" -w '%{http_code}' "$ORIGIN/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js?v=production-smoke" || true)"
            continuous_code="$(curl -sS --max-time 30 -o "$tmp/continuous.css" -w '%{http_code}' "$ORIGIN/scifi-ui/styles/formatx-continuous-scroll.css?v=production-smoke" || true)"
            mobile_code="$(curl -sS --max-time 30 -o "$tmp/mobile.css" -w '%{http_code}' "$ORIGIN/scifi-ui/styles/formatx-mobile-production-r5.css?v=production-smoke" || true)"
            mobile_loop_code="$(curl -sS --max-time 30 -o "$tmp/mobile-loop.css" -w '%{http_code}' "$ORIGIN/scifi-ui/styles/formatx-mobile-seamless-loop.css?v=production-smoke" || true)"
            policy_code="$(curl -sS --max-time 30 -o "$tmp/scroll-policy.json" -w '%{http_code}' "$ORIGIN/scifi-ui/data/scroll-policy.json?v=production-smoke" || true)"
            release_code="$(curl -sS --max-time 30 -o "$tmp/release.json" -w '%{http_code}' "$ORIGIN/scifi-ui/data/current-release.json" || true)"
            summary_code="$(curl -sS --max-time 30 -o "$tmp/summary.json" -w '%{http_code}' "$ORIGIN/api/feedback/summary" || true)"
            downloads_code="$(curl -sS -L --max-time 30 -o "$tmp/downloads.html" -w '%{http_code}' "$ORIGIN/downloads/" || true)"
            verification_code="$(curl -sS -L --max-time 30 -o "$tmp/verification.html" -w '%{http_code}' "$ORIGIN/verification" || true)"
            package_code="$(curl -sS --max-time 45 --range 0-0 -o "$tmp/package.bin" -w '%{http_code}' "$ORIGIN/download/multiplatform" || true)"

            if [[ "$home_code" == 200 && "$www_code" == 200 && "$bootstrap_code" == 200 && "$seamless_code" == 200 \
              && "$continuous_code" == 200 && "$mobile_code" == 200 && "$mobile_loop_code" == 200 && "$policy_code" == 200 \
              && "$release_code" == 200 && "$summary_code" == 200 && "$downloads_code" == 200 && "$verification_code" == 200 \
              && ( "$package_code" == 200 || "$package_code" == 206 ) ]]; then
              if python3 - "$tmp" <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          home = (root / 'home.html').read_text()
          headers = (root / 'home.headers').read_text().lower()
          bootstrap = (root / 'bootstrap.js').read_text()
          seamless = (root / 'seamless.js').read_text()
          continuous = (root / 'continuous.css').read_text()
          mobile = (root / 'mobile.css').read_text()
          mobile_loop = (root / 'mobile-loop.css').read_text()
          downloads = (root / 'downloads.html').read_text()
          verification = (root / 'verification.html').read_text()
          policy = json.loads((root / 'scroll-policy.json').read_text())
          release = json.loads((root / 'release.json').read_text())
          summary = json.loads((root / 'summary.json').read_text())

          assert 'platform-scroll-v2' in bootstrap, 'platform scroll bootstrap not deployed yet'
          assert "installSeamlessRuntime('mobile')" in bootstrap, 'mobile shared seamless runtime not deployed yet'
          assert 'native-momentum-loop-v1' in bootstrap, 'mobile native-momentum loop marker missing'
          assert "fxAutomaticLoop = mobile ? 'pending-mobile' : 'desktop-only'" in bootstrap, 'mobile seamless loop bootstrap marker missing'
          assert 'formatx-mobile-seamless-loop.css' in bootstrap, 'CSP-safe mobile bridge stylesheet loader missing'
          assert "createElement('style')" not in bootstrap, 'inline mobile bridge style violates CSP-safe contract'
          assert 'scrollTo(' not in bootstrap and 'scrollIntoView(' not in bootstrap and 'cloneNode(' not in bootstrap, 'mobile-capable bootstrap still moves/clones page'
          assert "const VERSION = 'seamless-v7'" in seamless, 'shared seamless-v7 runtime missing'
          assert 'sourceHero.cloneNode(true)' in seamless and 'window.scrollTo(' in seamless, 'shared visual bridge implementation missing'
          assert "mobileTransfer: 'scrollend-or-idle'" in seamless, 'mobile handoff is not deferred until scrollend/idle'
          assert "addEventListener('wheel'" not in seamless and "addEventListener('touchmove'" not in seamless, 'shared runtime captures native input'
          assert 'scroll-snap-type: none !important' in continuous and 'scroll-snap-align: none !important' in continuous, 'scroll snap suppression missing'
          assert '.fx-award-proof__grid' in mobile and '.fx-plan-qr-card:not(.is-qr-ready)' in mobile, 'mobile production safeguards missing'
          assert 'display: block !important' in mobile_loop and 'min-height: calc(100svh + max(320px, 24svh))' in mobile_loop, 'mobile seamless bridge runway missing'

          assert policy['mobile']['controller'] == 'seamless-v7'
          assert policy['mobile']['automatic_loop'] is True
          assert policy['mobile']['visual_bridge'] is True
          assert policy['mobile']['automatic_page_position_changes'] is True
          assert policy['mobile']['boundary_handoff_only'] is True
          assert policy['mobile']['transfer_mode'] == 'scrollend-or-idle'
          assert policy['mobile']['native_momentum_preserved'] is True
          assert policy['mobile']['finite_document'] is False
          assert policy['desktop']['controller'] == 'seamless-v7'
          assert policy['desktop']['automatic_loop'] is True
          assert policy['policy']['input_capture'] is False
          assert policy['policy']['section_scroll_snap'] is False

          multi = release.get('channels', {}).get('multiplatform') or release.get('channels', {}).get('windows') or {}
          assert release.get('ok') is True and multi.get('available') is True, release
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', multi.get('digest', ''), re.I), multi
          assert summary.get('ok') is True and isinstance(summary.get('reviews'), list), summary
          assert 'data-release-download="multiplatform"' in home
          assert 'data-release-download="multiplatform"' in downloads
          assert 'verification' in verification.lower() or 'ellenőrz' in verification.lower()
          assert 'content-security-policy' in headers, 'CSP response header missing'
          PY
              then
                rm -rf "$tmp"
                echo 'Production smoke passed.'
                exit 0
              fi
            fi

            rm -rf "$tmp"
            sleep 10
          done

          echo 'Production did not converge to the validated commit in time.' >&2
          exit 1

      - name: Publish deployment status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state,
              context: 'FormatX production deployment',
              description: state === 'success' ? 'Production deployment and live smoke tests passed' : 'Production deployment or smoke test failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
          });
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE
