name: Validate FormatX production candidate
run-name: Validate FormatX production candidate from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
      - '.github/workflows/validate-website.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-production-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate canonical cinematic source
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/site-loader.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/site-ambient-background.js
          node --check docs/scifi-ui/scripts/site-art-direction.js
          node --check docs/scifi-ui/scripts/landing.js
          node --check docs/scifi-ui/scripts/pricing-sync.js
          node --check docs/scifi-ui/scripts/checkout-v100.js
          node --check docs/scifi-ui/scripts/checkout-language-v100.js

          grep -Fq "['/', '/scifi-ui/']" billing-worker/src/production-with-license.js
          grep -Fq "no-cache, max-age=0, must-revalidate" billing-worker/src/production-with-license.js
          grep -Fq 'FAILSAFE_DEADLINE' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'overlay.getAnimations({ subtree: true })' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'visibilitychange' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'formatx:introcomplete' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq '.fx-intro-skip' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -Fq 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -Fq -- '--fx-cyan' docs/scifi-ui/styles/site-premium-finish.css
          grep -Fq 'fx-page-scrolled' docs/scifi-ui/styles/site-premium-finish.css
          grep -Fq -- '--fx-pointer-x' docs/scifi-ui/scripts/site-art-direction.js
          grep -Fq '15 900 Ft / hó' docs/scifi-ui/index.html
          grep -Fq '29 900 Ft / hó' docs/scifi-ui/index.html
          ! grep -Eq 'future-5000|causal-memory|site-readability-audit|start-sale|site-foreground-guard|main-spatial|main-readability|quantum-twin|project-hub' docs/scifi-ui/index.html

      - name: Install Worker dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Run tests and production dry build
        working-directory: billing-worker
        run: |
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-production-candidate

      - name: Publish candidate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Production source, tests and Worker dry build passed'
          else
            state='failure'
            description='Production candidate validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX production candidate' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
