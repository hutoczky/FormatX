name: Prepare or deploy FormatX production
run-name: FormatX production from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated candidate to the production custom domains
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
  push:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - 'content-preview-entry.js'
      - 'wrangler.jsonc'
      - '.github/scripts/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Validate production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate public content, releases and complete site integrity
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-content-standard-v2.py
          python3 .github/scripts/validate-public-release-integration.py
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-pricing-qr.cjs
          node .github/scripts/validate-public-site-integrity.cjs
          node .github/scripts/validate-feedback-moderation.cjs
          node .github/scripts/validate-user-requested-site-features.cjs

      - name: Validate production JavaScript syntax
        run: |
          set -euo pipefail
          node --check content-preview-entry.js
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/production-entry.js
          node --check billing-worker/src/production-content-entry.js
          node --check billing-worker/src/production-feedback-entry.js
          node --check billing-worker/src/feedback-api.js
          node --check billing-worker/src/feedback-schema.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/scifi-ui/scripts/release-metadata.js
          node --check docs/scifi-ui/scripts/formatx-public-shell.js
          node --check docs/scifi-ui/scripts/public-evidence-pages.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-premium-finish.js
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node --check docs/scifi-ui/scripts/formatx-license-links.js
          node --check docs/scifi-ui/scripts/formatx-feedback.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/organism-interface.js
          node --check docs/scifi-ui/scripts/organism-menu-controller.js
          node --check docs/scifi-ui/scripts/organism-console-state.js
          node --check docs/scifi-ui/scripts/organism-core-controller.js
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-voice-stability.js
          node --check docs/scifi-ui/scripts/organism-master-sync.js
          node --check docs/scifi-ui/scripts/organism-core-interaction.js
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node --check docs/scifi-ui/scripts/synaptic-thought-disclosure.js
          node --check docs/scifi-ui/scripts/formatx-mobile-unified.js
          node --check docs/scifi-ui/scripts/formatx-mobile-recovery.js
          node --check docs/scifi-ui/scripts/mobile-core-engine-v3.js
          node --check docs/scifi-ui/scripts/mobile-webgl-entry.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          node --check .github/scripts/validate-public-site-integrity.cjs

      - name: Install dependencies and run Worker tests
        working-directory: billing-worker
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Build production Worker without deploying
        working-directory: billing-worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-production-candidate

      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: formatx-production-candidate-${{ github.sha }}
          path: |
            .wrangler-production-candidate
            artifacts/production-readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish production validation status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_CONTEXT: FormatX production validation
          STATUS_DESCRIPTION: Full public surface, feedback, downloads and Worker validation
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              state,
              context: process.env.STATUS_CONTEXT,
              description: process.env.STATUS_DESCRIPTION.slice(0, 140),
              target_url: process.env.STATUS_URL,
            }),
          });
          if (!response.ok) throw new Error(`Status publish failed: ${response.status} ${await response.text()}`);
          NODE

  deploy:
    name: Deploy to FormatX custom domains
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.formatxsuite.com/
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Install locked Worker dependencies
        working-directory: billing-worker
        run: npm ci

      - name: Deploy with Wrangler or use the connected Cloudflare build
        id: deploy_mode
        working-directory: billing-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.FORMATX_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'ffd7d28ea7c6a510549dc9363619c8c5' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "mode=connected-cloudflare-build" >> "$GITHUB_OUTPUT"
            echo 'Wrangler token unavailable; live smoke tests will verify the connected Cloudflare deployment.'
            exit 0
          fi
          echo "mode=wrangler" >> "$GITHUB_OUTPUT"
          npx wrangler deploy

      - name: Smoke-test production feedback, downloads and seamless scrolling
        shell: bash
        run: |
          set -Eeuo pipefail
          WWW='https://www.formatxsuite.com'
          ROOT_DOMAIN='https://formatxsuite.com'
          PAYLOAD='{"overall":5,"usability":5,"performance":5,"design":5,"features":5,"comment":"","display_name":"","contact_email":"","publish_permission":false,"privacy_consent":true,"website":"formatx-production-smoke-probe","locale":"hu","source":"github-production-smoke","page_path":"/"}'

          for attempt in $(seq 1 30); do
            echo "Production smoke attempt $attempt/30"
            tmp="$(mktemp -d)"
            root_code="$(curl -sS -L --max-time 30 -o "$tmp/home.html" -w '%{http_code}' "$WWW/" || true)"
            bare_code="$(curl -sS -L --max-time 30 -o "$tmp/bare.html" -w '%{http_code}' "$ROOT_DOMAIN/" || true)"
            summary_code="$(curl -sS --max-time 30 -o "$tmp/summary.json" -w '%{http_code}' "$WWW/api/feedback/summary" || true)"
            submit_code="$(curl -sS --max-time 30 -o "$tmp/submit.json" -w '%{http_code}' \
              -X POST "$WWW/api/feedback" \
              -H 'Origin: https://www.formatxsuite.com' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data "$PAYLOAD" || true)"
            loop_code="$(curl -sS --max-time 30 -o "$tmp/loop.js" -w '%{http_code}' "$WWW/scifi-ui/scripts/formatx-infinite-scroll.js?v=production-smoke" || true)"
            downloads_code="$(curl -sS -L --max-time 30 -o "$tmp/downloads.html" -w '%{http_code}' "$WWW/downloads/" || true)"
            support_code="$(curl -sS -L --max-time 30 -o "$tmp/support.html" -w '%{http_code}' "$WWW/support.html" || true)"
            portable_code="$(curl -sS --max-time 30 -o "$tmp/portable.svg" -w '%{http_code}' "$WWW/scifi-ui/assets/images/product-showcase/portable-installer-compatible.svg" || true)"

            if [[ "$root_code" == '200' && "$bare_code" == '200' && "$summary_code" == '200' \
              && "$submit_code" == '202' && "$loop_code" == '200' && "$downloads_code" == '200' \
              && "$support_code" == '200' && "$portable_code" == '200' ]]; then
              python3 - "$tmp" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / 'summary.json').read_text())
          submit = json.loads((root / 'submit.json').read_text())
          loop = (root / 'loop.js').read_text()
          home = (root / 'home.html').read_text()
          downloads = (root / 'downloads.html').read_text()
          support = (root / 'support.html').read_text()
          portable = (root / 'portable.svg').read_text().lower()

          assert summary.get('ok') is True, summary
          assert isinstance(summary.get('count'), int), summary
          assert submit.get('ok') is True, submit
          assert submit.get('state') == 'pending-moderation', submit
          assert "const VERSION = 'seamless-v6'" in loop, 'seamless-v6 controller missing'
          assert "fxInfiniteCloneMode = 'visual-bridge'" in loop, 'visual bridge missing'
          assert 'clonedHeroOnly: true' in loop, 'Hero-only loop contract missing'
          assert 'id="user-feedback"' in home, 'feedback section missing'
          assert 'data-fx-category-title' in home and 'Egy élő operációs réteg technikusi munkához.' in home, 'static category semantics missing'
          assert 'FormatX-Updates/releases/latest' in downloads, 'latest release fallback missing'
          assert 'Támogatás' in support or 'Support' in support, 'support page invalid'
          assert '<svg' in portable and '</svg>' in portable, 'portable installer SVG missing'
          assert 'data:image/webp' not in portable and '<image' not in portable, 'embedded raster returned'
          print('FormatX production smoke passed.')
          PY
              rm -rf "$tmp"
              exit 0
            fi

            echo "root=$root_code bare=$bare_code summary=$summary_code submit=$submit_code loop=$loop_code downloads=$downloads_code support=$support_code portable=$portable_code"
            [[ -s "$tmp/summary.json" ]] && cat "$tmp/summary.json" || true
            [[ -s "$tmp/submit.json" ]] && cat "$tmp/submit.json" || true
            rm -rf "$tmp"
            if [[ "$attempt" == '30' ]]; then
              echo 'Production did not become healthy within the retry window.' >&2
              exit 1
            fi
            sleep 12
          done
