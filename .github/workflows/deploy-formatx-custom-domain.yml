name: Validate FormatX Three.js production candidate
run-name: Validate FormatX Three.js production candidate from ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
  push:
    branches: [master]
    paths:
      - 'billing-worker/**'
      - 'docs/**'
      - '.github/workflows/deploy-formatx-custom-domain.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-three-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate canonical Three.js production source
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          node --check billing-worker/src/pricing-v100-api.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-apex.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/formatx-transcend-bridge.js
          node --check docs/scifi-ui/scripts/formatx-three-host.js
          node --check docs/scifi-ui/scripts/experience-entry.js
          node --check docs/scifi-ui/scripts/Experience.js
          grep -Fq "['/', '/scifi-ui/']" billing-worker/src/production-with-license.js
          grep -Fq 'formatx-apex.css?v=20260726-apex-2' docs/scifi-ui/index.html
          grep -Fq 'formatx-apex.js?v=20260726-apex-2' docs/scifi-ui/index.html
          grep -Fq 'id="fx-apex-canvas"' docs/scifi-ui/index.html
          grep -Fq 'id="fx-particle-canvas"' docs/scifi-ui/index.html
          grep -Fq 'THREE.WebGLRenderer' docs/scifi-ui/scripts/Experience.js
          grep -Fq 'THREE.InstancedMesh' docs/scifi-ui/scripts/Experience.js
          grep -Fq 'THREE.Points' docs/scifi-ui/scripts/Experience.js
          grep -Fq 'QualityGovernor' docs/scifi-ui/scripts/Experience.js
          grep -Fq '__FORMATX_3D_STATE__' docs/scifi-ui/scripts/formatx-three-host.js
          grep -Fq 'formatx:loop' docs/scifi-ui/scripts/formatx-three-host.js
          grep -Fq 'experience-entry.js' docs/scifi-ui/three-stage.html
          grep -Fq 'formatx-three-host.css' docs/scifi-ui/styles/igloo-parity.css
          grep -Fq '15 900 Ft / hó' docs/scifi-ui/index.html
          grep -Fq '29 900 Ft / hó' docs/scifi-ui/index.html
          ! grep -Fq 'formatx-transcend-lite.js' docs/scifi-ui/scripts/igloo-parity.js
          ! grep -Fq 'worldstage-enhancements.js' docs/scifi-ui/scripts/igloo-parity.js

      - name: Install, test and dry-build Worker
        working-directory: billing-worker
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-three-production

      - name: Publish candidate status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Three.js source, tests and Worker dry build passed'
          else
            state='failure'
            description='Three.js production candidate validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX Three.js production candidate' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
