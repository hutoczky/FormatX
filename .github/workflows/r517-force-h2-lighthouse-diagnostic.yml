name: R517 force-H2 Lighthouse diagnostic
run-name: R517 force-H2 Lighthouse diagnostic for exact R516 production

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/r517-force-h2-lighthouse-diagnostic.yml'

permissions:
  contents: read

jobs:
  force-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://formatxsuite.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confirm exact R516 production marker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?h2diag=$GITHUB_RUN_ID" -o /tmp/live-marker.txt
          cmp -s docs/p0-validation-version.txt /tmp/live-marker.txt
      - name: Install pinned Lighthouse CI
        run: npm install --no-save @lhci/cli@0.13.0
      - name: Run force-H2 desktop Lighthouse x3 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r517-force-h2
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('lighthouserc.live.json','utf8'));
          c.ci.collect.url=[`https://formatxsuite.com/?r517_force_h2=${process.env.GITHUB_RUN_ID}`];
          c.ci.collect.numberOfRuns=3;
          c.ci.collect.settings.chromeFlags=(c.ci.collect.settings.chromeFlags||'')+' --disable-quic';
          delete c.ci.assert;
          fs.writeFileSync('/tmp/r517-force-h2.json',JSON.stringify(c,null,2));
          NODE
          rm -rf .lighthouseci
          npx lhci collect --config=/tmp/r517-force-h2.json | tee artifacts/r517-force-h2/output.txt
          cp -a .lighthouseci/. artifacts/r517-force-h2/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r517-force-h2-${{ github.sha }}
          path: artifacts/r517-force-h2
          include-hidden-files: true
          retention-days: 30
