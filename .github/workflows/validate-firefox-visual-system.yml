name: Validate FormatX in Firefox

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/styles/formatx-event-horizon.css'
      - 'docs/scifi-ui/styles/site-ambient-background.css'
      - 'docs/scifi-ui/styles/site-quantum-aurora.css'
      - 'docs/scifi-ui/styles/site-art-direction.css'
      - 'docs/scifi-ui/styles/site-contrast-guard.css'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/scripts/site-ambient-background.js'
      - 'docs/scifi-ui/scripts/site-art-direction.js'
      - 'billing-worker/src/production-with-license.js'
      - '.github/workflows/validate-firefox-visual-system.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-formatx-firefox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate consolidated source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/site-ambient-background.js
          node --check docs/scifi-ui/scripts/site-art-direction.js
          node --check billing-worker/src/production-with-license.js
          ! grep -Fq 'fx-intro-page-reveal' docs/scifi-ui/styles/formatx-event-horizon.css
          ! grep -Fq 'site-foreground-guard' docs/scifi-ui/index.html
          ! grep -Fq 'site-foreground-guard' docs/scifi-ui/scripts/site-art-direction.js
          ! grep -Fq "style.setProperty('opacity'" docs/scifi-ui/scripts/site-art-direction.js
          test ! -e docs/scifi-ui/styles/site-foreground-guard.css
          test "$(grep -o 'site-contrast-guard.css' billing-worker/src/production-with-license.js | wc -l)" -eq 1
          grep -F "SITE_AMBIENT_VERSION = '20260726-quantum-aurora-2'" billing-worker/src/production-with-license.js
          grep -F "SITE_ART_VERSION = '20260726-art-direction-3'" billing-worker/src/production-with-license.js
          grep -F "SITE_CONTRAST_VERSION = '20260726-contrast-guard-2'" billing-worker/src/production-with-license.js
          grep -F 'balancedMode' docs/scifi-ui/scripts/site-ambient-background.js
          grep -F 'isFirefox' docs/scifi-ui/scripts/site-ambient-background.js
          grep -F 'data-performance="balanced"' docs/scifi-ui/styles/site-ambient-background.css
          grep -F 'data-performance="balanced"' docs/scifi-ui/styles/site-quantum-aurora.css

      - name: Install Firefox
        id: install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formatx-firefox"
          npm install --prefix "$RUNNER_TEMP/formatx-firefox" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/formatx-firefox/node_modules/.bin/playwright" install --with-deps firefox

      - name: Start local website
        id: server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory docs > "$RUNNER_TEMP/formatx-firefox-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4174/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-firefox-http.log"
          exit 1

      - name: Test actual Firefox rendering
        id: firefox
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-firefox/node_modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const { firefox } = require('playwright');
          const cases = [
            { name: 'desktop-hu', width: 1440, height: 1000, locale: 'hu-HU', lang: 'hu' },
            { name: 'desktop-en', width: 1180, height: 900, locale: 'en-US', lang: 'en' },
            { name: 'mobile-hu', width: 390, height: 844, locale: 'hu-HU', lang: 'hu' },
          ];
          const layoutSelectors = ['.eyebrow', '#hero-title', '.hero-tagline', '.hero-description', '.hero-actions', '.hero-assurance:not(.platform-status)', '.platform-status'];

          (async () => {
            const browser = await firefox.launch({ headless: true });
            const failures = [];
            try {
              for (const testCase of cases) {
                const context = await browser.newContext({ viewport: { width: testCase.width, height: testCase.height }, locale: testCase.locale });
                const page = await context.newPage();
                const runtimeErrors = [];
                page.on('pageerror', (error) => runtimeErrors.push(String(error)));
                await page.goto(`http://127.0.0.1:4174/scifi-ui/index.html?lang=${testCase.lang}`, { waitUntil: 'networkidle', timeout: 30000 });
                await page.waitForSelector('#formatx-site-ambient[data-browser="firefox"][data-performance="balanced"]', { timeout: 10000 });
                await page.waitForFunction(() => {
                  const html = document.documentElement;
                  const overlay = document.getElementById('formatx-event-horizon');
                  return html.classList.contains('fx-intro-complete')
                    && !html.classList.contains('fx-intro-running')
                    && !html.classList.contains('fx-intro-reveal')
                    && (!overlay || overlay.hidden);
                }, null, { timeout: 10000 });
                await page.waitForFunction(() => document.documentElement.classList.contains('fx-contrast-guard-ready'), null, { timeout: 5000 });
                await page.waitForTimeout(250);

                const result = await page.evaluate((selectors) => {
                  const inspect = (selector) => {
                    const element = document.querySelector(selector);
                    if (!element) return null;
                    const style = getComputedStyle(element);
                    return {
                      opacity: Number(style.opacity),
                      visibility: style.visibility,
                      display: style.display,
                      color: style.color,
                      filter: style.filter,
                      inlineStyle: element.getAttribute('style') || '',
                    };
                  };
                  const visible = (item) => item && item.opacity >= 0.99 && item.visibility === 'visible' && item.display !== 'none' && item.color !== 'rgba(0, 0, 0, 0)';
                  const readable = {
                    heroCopy: inspect('.hero-copy'),
                    title: inspect('#hero-title'),
                    tagline: inspect('.hero-tagline'),
                    description: inspect('.hero-description'),
                    button: inspect('#hero-download'),
                    engine: inspect('.core-engine'),
                  };
                  const nodes = selectors.map((selector) => ({ selector, element: document.querySelector(selector) })).filter((item) => item.element);
                  const overlaps = [];
                  for (let i = 0; i < nodes.length; i += 1) {
                    const a = nodes[i].element.getBoundingClientRect();
                    for (let j = i + 1; j < nodes.length; j += 1) {
                      const b = nodes[j].element.getBoundingClientRect();
                      const width = Math.min(a.right, b.right) - Math.max(a.left, b.left);
                      const height = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
                      if (width > 1 && height > 1) overlaps.push([nodes[i].selector, nodes[j].selector, width, height]);
                    }
                  }
                  const styles = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map((link) => String(link.href || ''));
                  const scripts = Array.from(document.querySelectorAll('script[src]')).map((script) => String(script.src || ''));
                  const count = (values, token) => values.filter((value) => value.includes(token)).length;
                  const ambient = document.getElementById('formatx-site-ambient');
                  const animationCount = ambient && typeof ambient.getAnimations === 'function'
                    ? ambient.getAnimations({ subtree: true }).filter((animation) => animation.playState === 'running').length
                    : -1;
                  const heavyLayersHidden = ['.fx-site-ambient-aura--three', '.fx-site-ambient-streams', '.fx-site-ambient-beam']
                    .every((selector) => getComputedStyle(document.querySelector(selector)).display === 'none');
                  const forbiddenInline = /(opacity|filter|clip-path|transform|animation)\s*:/i;
                  const duplicateCounts = {
                    eventCss: count(styles, 'formatx-event-horizon.css'),
                    ambientCss: count(styles, 'site-ambient-background.css'),
                    quantumCss: count(styles, 'site-quantum-aurora.css'),
                    artCss: count(styles, 'site-art-direction.css'),
                    contrastCss: count(styles, 'site-contrast-guard.css'),
                    eventJs: count(scripts, 'formatx-event-horizon.js'),
                    ambientJs: count(scripts, 'site-ambient-background.js'),
                    artJs: count(scripts, 'site-art-direction.js'),
                  };
                  return {
                    performanceMode: ambient && ambient.dataset.performance,
                    browserMode: ambient && ambient.dataset.browser,
                    particles: document.querySelectorAll('.fx-site-ambient-particles i').length,
                    animationCount,
                    heavyLayersHidden,
                    readable: Object.values(readable).every(visible),
                    inlineClean: [readable.heroCopy, readable.engine].every((item) => item && !forbiddenInline.test(item.inlineStyle)),
                    overlaps,
                    overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth,
                    duplicates: Object.values(duplicateCounts).every((value) => value === 1),
                    duplicateCounts,
                    foregroundAbsent: !styles.some((href) => href.includes('site-foreground-guard.css')),
                  };
                }, layoutSelectors);

                const pass = runtimeErrors.length === 0
                  && result.performanceMode === 'balanced'
                  && result.browserMode === 'firefox'
                  && result.particles <= 6
                  && result.animationCount >= 0
                  && result.animationCount <= 12
                  && result.heavyLayersHidden
                  && result.readable
                  && result.inlineClean
                  && result.overlaps.length === 0
                  && result.overflow <= 1
                  && result.duplicates
                  && result.foregroundAbsent;
                console.log(JSON.stringify({ case: testCase.name, pass, runtimeErrors, ...result }, null, 2));
                if (!pass) failures.push({ case: testCase.name, runtimeErrors, ...result });
                await context.close();
              }
            } finally {
              await browser.close();
            }
            if (failures.length) {
              console.error(JSON.stringify({ failures }, null, 2));
              process.exit(1);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Firefox desktop and mobile visual checks passed'
          else
            state='failure'
            description='Firefox visual, layout or performance validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX Firefox visual validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
