name: Install payment QR section

# The current website uses the APEX layout. This installer targets that live structure.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-payment-qr.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install the QR payment section into APEX
        shell: python
        run: |
          from pathlib import Path

          css = Path('docs/scifi-ui/styles/payment-qr.css')
          css_text = css.read_text(encoding='utf-8')
          css_text = css_text.replace('.reference-commerce ', '')
          css.write_text(css_text, encoding='utf-8')

          script = Path('docs/scifi-ui/scripts/payment-qr.js')
          script_text = script.read_text(encoding='utf-8')
          script_text = script_text.replace(
              "document.querySelector('#pricing .price-cards')",
              "document.querySelector('#pricing .pricing, #pricing .price-cards')",
          )
          script.write_text(script_text, encoding='utf-8')

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')

          css_line = '  <link rel="stylesheet" href="./styles/payment-qr.css?v=20260726-payment-qr-2">\n'
          if 'payment-qr.css?' not in text:
              marker = '  <link rel="stylesheet" href="./styles/formatx-apex.css?v=20260726-apex-2">\n'
              if marker not in text:
                  raise SystemExit('APEX CSS insertion marker not found')
              text = text.replace(marker, marker + css_line, 1)
          else:
              import re
              text = re.sub(r'  <link rel="stylesheet" href="\./styles/payment-qr\.css\?v=[^"]+">\n', css_line, text, count=1)

          js_line = '  <script defer src="./scripts/payment-qr.js?v=20260726-payment-qr-2"></script>\n'
          if 'payment-qr.js?' not in text:
              marker = '  <script defer src="./scripts/formatx-apex.js?v=20260726-apex-2"></script>\n'
              if marker not in text:
                  raise SystemExit('APEX JS insertion marker not found')
              text = text.replace(marker, marker + js_line, 1)
          else:
              import re
              text = re.sub(r'  <script defer src="\./scripts/payment-qr\.js\?v=[^"]+"></script>\n', js_line, text, count=1)

          if 'id="formatx-plan-qr-dock"' not in text:
              payment_start = text.index('<div class="payment" data-reveal>')
              payment_end_marker = '</div></div>\n    </section>'
              payment_end = text.index(payment_end_marker, payment_start) + len('</div></div>')
              qr_markup = '''
      <section id="formatx-plan-qr-dock" class="fx-plan-qr-dock" aria-labelledby="formatx-plan-qr-title">
        <header class="fx-plan-qr-head">
          <strong id="formatx-plan-qr-title">FIZETÉS QR-KÓDDAL</strong>
          <span class="fx-plan-qr-intro">Mindhárom licenccsomag saját QR-kódot kapott. Beolvasás után a kiválasztott fizetési oldal nyílik meg.</span>
        </header>
        <div class="fx-plan-qr-grid">
          <article class="fx-plan-qr-card is-qr-loading" data-plan-qr="business_lite">
            <div class="fx-plan-qr-copy"><strong>Business Lite</strong><span>7 900 Ft / hónap</span><small>Havi licenc · rögzített összeg · bankkártyaadat-kezelés nélkül</small></div>
            <a class="fx-plan-qr-link" href="./checkout.html?plan=business_lite&amp;cycle=monthly&amp;currency=HUF&amp;lang=hu&amp;source=pricing-qr" aria-label="Business Lite fizetés megnyitása"><img src="/api/checkout-qr?plan=business_lite&amp;cycle=monthly&amp;currency=HUF" width="112" height="112" alt="FormatX fizetési QR-kód — Business Lite"></a>
          </article>
          <article class="fx-plan-qr-card is-qr-loading" data-plan-qr="business_pro">
            <div class="fx-plan-qr-copy"><strong>Business Pro</strong><span>15 900 Ft / hónap</span><small>Havi licenc · rögzített összeg · bankkártyaadat-kezelés nélkül</small></div>
            <a class="fx-plan-qr-link" href="./checkout.html?plan=business_pro&amp;cycle=monthly&amp;currency=HUF&amp;lang=hu&amp;source=pricing-qr" aria-label="Business Pro fizetés megnyitása"><img src="/api/checkout-qr?plan=business_pro&amp;cycle=monthly&amp;currency=HUF" width="112" height="112" alt="FormatX fizetési QR-kód — Business Pro"></a>
          </article>
          <article class="fx-plan-qr-card is-qr-loading" data-plan-qr="technician_team">
            <div class="fx-plan-qr-copy"><strong>Technician Team</strong><span>29 900 Ft / hónap</span><small>Havi licenc · rögzített összeg · bankkártyaadat-kezelés nélkül</small></div>
            <a class="fx-plan-qr-link" href="./checkout.html?plan=technician_team&amp;cycle=monthly&amp;currency=HUF&amp;lang=hu&amp;source=pricing-qr" aria-label="Technician Team fizetés megnyitása"><img src="/api/checkout-qr?plan=technician_team&amp;cycle=monthly&amp;currency=HUF" width="112" height="112" alt="FormatX fizetési QR-kód — Technician Team"></a>
          </article>
        </div>
      </section>'''
              text = text[:payment_end] + qr_markup + text[payment_end:]

          index.write_text(text, encoding='utf-8')

      - name: Validate the visible APEX QR section
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/payment-qr.js
          grep -F 'payment-qr.css?v=20260726-payment-qr-2' docs/scifi-ui/index.html
          grep -F 'payment-qr.js?v=20260726-payment-qr-2' docs/scifi-ui/index.html
          grep -F 'id="formatx-plan-qr-dock"' docs/scifi-ui/index.html
          test "$(grep -o 'data-plan-qr=' docs/scifi-ui/index.html | wc -l)" -eq 3
          grep -F '/api/checkout-qr?plan=business_lite' docs/scifi-ui/index.html
          grep -F '/api/checkout-qr?plan=business_pro' docs/scifi-ui/index.html
          grep -F '/api/checkout-qr?plan=technician_team' docs/scifi-ui/index.html
          grep -F "document.querySelector('#pricing .pricing, #pricing .price-cards')" docs/scifi-ui/scripts/payment-qr.js
          grep -F '#formatx-plan-qr-dock' docs/scifi-ui/styles/payment-qr.css
          ! grep -Fq '.reference-commerce #formatx-plan-qr-dock' docs/scifi-ui/styles/payment-qr.css
          grep -F "url.pathname === '/api/checkout-qr'" billing-worker/src/pricing-v100-api.js

      - name: Commit the APEX QR payment section
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/payment-qr.css docs/scifi-ui/scripts/payment-qr.js
          git commit -m 'Show QR payment cards in the current APEX pricing section'
          git push origin HEAD:master
