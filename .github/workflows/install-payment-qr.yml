name: Audit payment QR section

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate installed QR payment section
        run: |
          node --check docs/scifi-ui/scripts/payment-qr.js
          grep -Fq 'payment-qr.css?' docs/scifi-ui/index.html
          grep -Fq 'payment-qr.js?' docs/scifi-ui/index.html
          grep -Fq 'id="formatx-plan-qr-dock"' docs/scifi-ui/index.html
          test "$(grep -o 'data-plan-qr=' docs/scifi-ui/index.html | wc -l)" -eq 3
          grep -Fq "url.pathname === '/api/checkout-qr'" billing-worker/src/pricing-v100-api.js
          ! grep -Fq 'git push origin HEAD:master' .github/workflows/install-payment-qr.yml

      - name: Report
        run: echo 'Payment QR audit passed; no repository files were modified.'
