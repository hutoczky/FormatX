name: Audit FormatX Design System

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate deterministic intro source
        run: |
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'TIMELINE_DURATION' docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'HARD_DEADLINE' docs/scifi-ui/scripts/formatx-event-horizon.js
          ! grep -Fq 'async function finishIntro' docs/scifi-ui/scripts/formatx-event-horizon.js
          ! grep -Fq 'git push origin HEAD:master' .github/workflows/apply-formatx-design-system.yml

      - name: Report
        run: echo 'FormatX Design System audit passed; no repository files were modified.'
