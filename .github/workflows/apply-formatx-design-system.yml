# Trigger revision 5
name: Apply FormatX Design System

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-formatx-design-system.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ github.token }}

      - name: Make intro skip authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/scripts/formatx-event-horizon.js')
          text = path.read_text(encoding='utf-8')
          old = """  async function finishIntro(overlay, token, skipped) {
    if (token !== runToken || finishing) return;
    finishing = true;
"""
          new = """  async function finishIntro(overlay, token, skipped) {
    if (token !== runToken) return;
    if (skipped && finishing) {
      completeImmediately(overlay);
      return;
    }
    if (finishing) return;
    finishing = true;
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected finishIntro source block not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('changed=true')
          else:
              print('changed=false')
          PY
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -Fq 'if (skipped && finishing)' docs/scifi-ui/scripts/formatx-event-horizon.js

      - name: Commit intro reliability fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Intro fix already applied.'
            exit 0
          fi
          git config user.name 'FormatX Design System Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-event-horizon.js
          git commit -m 'Make intro skip authoritative during transition'
          git push origin HEAD:master
