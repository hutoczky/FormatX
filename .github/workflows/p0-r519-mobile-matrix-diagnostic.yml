name: P0 R519 mobile failure attribution
on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r519-mobile-matrix-diagnostic.yml']
permissions:
  contents: read
env:
  CANDIDATE_REF: p0-r519-apex-price
  CANDIDATE_SHA: 9272f47f4167485f26906172fe626aef13909f55
jobs:
  mobile-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: ['320x568', '844x390']
        replica: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.CANDIDATE_REF }}', fetch-depth: 1}
      - uses: actions/setup-node@v5
        with: {node-version: '22', cache: npm, cache-dependency-path: billing-worker/package-lock.json}
      - name: Start exact R519 unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"; test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.mobile-attr.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts >/dev/null
          (cd billing-worker && nohup npx wrangler dev --config wrangler.mobile-attr.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/mobile-attr.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/mobile-attr.log" || true; exit 1
      - name: Capture normal cold sample and traced cold attribution
        shell: bash
        env:
          VIEWPORT: ${{ matrix.viewport }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/mobile-attr-${VIEWPORT}-r${REPLICA}"
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),{chromium}=require('playwright');
          const [w,h]=process.env.VIEWPORT.split('x').map(Number),replica=Number(process.env.REPLICA),chrome=process.env.CHROME_BIN;
          const out=`artifacts/mobile-attr-${process.env.VIEWPORT}-r${replica}/summary.json`;
          const round=n=>Math.round(n*1000)/1000;
          async function pageContext(browser){const c=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:w,height:h},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',colorScheme:'dark'});const p=await c.newPage();await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.paint.push({n:e.name,t:e.startTime}))).observe({type:'paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.lcp.push({t:e.startTime,tag:e.element?.tagName||'',id:e.element?.id||'',cls:String(e.element?.className||'')}))).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)window.__m.shift.push({t:e.startTime,v:e.value,sources:(e.sources||[]).map(s=>({node:s.node?`${s.node.tagName||''}#${s.node.id||''}.${String(s.node.className||'')}`:'',previousRect:s.previousRect,currentRect:s.currentRect}))})})).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.long.push({t:e.startTime,d:e.duration}))).observe({type:'longtask',buffered:true})}catch{}});return{c,p};}
          async function snapshot(p){return p.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(e=>e.n==='first-contentful-paint')?.t??0,lcp:window.__m.lcp.at(-1)?.t??0,lcpEntries:window.__m.lcp,cls:window.__m.shift.reduce((a,b)=>a+b.v,0),shifts:window.__m.shift,tbt:window.__m.long.reduce((a,e)=>a+Math.max(0,e.d-50),0),longtasks:window.__m.long,ttfb:n?.responseStart??0,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||'',mobileMarker:document.documentElement.dataset.fxApexMobileR294||''}})}
          async function normal(){const b=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});const {c,p}=await pageContext(b);const r=await p.goto(`https://formatxsuite.com:8787/?normal=${w}x${h}-${replica}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3200);const x=await snapshot(p);await c.close();await b.close();return{status:r?.status()||0,...x};}
          async function traced(){const b=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});const {c,p}=await pageContext(b);const cdp=await c.newCDPSession(p);await cdp.send('Performance.enable');await cdp.send('Profiler.enable');await cdp.send('Profiler.setSamplingInterval',{interval:100});await cdp.send('Profiler.start');const ev=[];cdp.on('Tracing.dataCollected',x=>ev.push(...x.value));const done=new Promise(resolve=>cdp.once('Tracing.tracingComplete',resolve));await cdp.send('Tracing.start',{categories:'devtools.timeline,blink.user_timing,v8,disabled-by-default-devtools.timeline',options:'record-as-much-as-possible',transferMode:'ReportEvents'});const r=await p.goto(`https://formatxsuite.com:8787/?trace=${w}x${h}-${replica}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3200);const x=await snapshot(p),pm=(await cdp.send('Performance.getMetrics')).metrics.reduce((o,m)=>(o[m.name]=m.value,o),{}),prof=(await cdp.send('Profiler.stop')).profile;await cdp.send('Tracing.end');await done;const nodes=new Map(prof.nodes.map(n=>[n.id,n])),cpu=new Map();for(let i=0;i<(prof.samples||[]).length;i++){const n=nodes.get(prof.samples[i]);if(!n)continue;const f=n.callFrame||{},key=`${f.url||'(internal)'} :: ${f.functionName||'(anonymous)'}`;cpu.set(key,(cpu.get(key)||0)+(prof.timeDeltas?.[i]||0)/1000)}const cpuTop=[...cpu].map(([frame,ms])=>({frame,ms:round(ms)})).sort((a,b)=>b.ms-a.ms).slice(0,25);const wanted=new Set(['RunTask','EvaluateScript','FunctionCall','UpdateLayoutTree','RecalculateStyles','Layout','Paint','CompositeLayers','ParseHTML','TimerFire','FireAnimationFrame','EventDispatch']);const timed=ev.filter(e=>e.ph==='X'&&e.dur&&wanted.has(e.name));const agg=new Map();for(const e of timed)agg.set(e.name,(agg.get(e.name)||0)+e.dur/1000);const timelineTotals=[...agg].map(([name,ms])=>({name,ms:round(ms)})).sort((a,b)=>b.ms-a.ms);const timelineTop=timed.map(e=>({name:e.name,ms:round(e.dur/1000),url:e.args?.data?.url||e.args?.data?.scriptName||'',functionName:e.args?.data?.functionName||''})).filter(e=>e.ms>=20).sort((a,b)=>b.ms-a.ms).slice(0,35);await c.close();await b.close();return{status:r?.status()||0,...x,layoutMs:round((pm.LayoutDuration||0)*1000),recalcMs:round((pm.RecalcStyleDuration||0)*1000),scriptMs:round((pm.ScriptDuration||0)*1000),taskMs:round((pm.TaskDuration||0)*1000),cpuTop,timelineTotals,timelineTop};}
          (async()=>{const result={candidate:'9272f47f4167485f26906172fe626aef13909f55',viewport:`${w}x${h}`,replica,normal:await normal(),traced:await traced()};console.log('R519_MOBILE_ATTRIBUTION',JSON.stringify(result,null,2));fs.writeFileSync(out,JSON.stringify(result,null,2));if(result.normal.status!==200||result.traced.status!==200||result.normal.overflow>2||result.traced.overflow>2)throw new Error('attribution contract failure');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'r519-mobile-attr-${{ matrix.viewport }}-r${{ matrix.replica }}', path: 'artifacts/mobile-attr-${{ matrix.viewport }}-r${{ matrix.replica }}/', retention-days: 30}
