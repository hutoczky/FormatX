name: Validate current mobile visual and touch ownership
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/scripts/formatx-wda-controls-r198.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-regression-r310.js'
      - 'docs/scifi-ui/scripts/single-language-toggle.js'
      - 'docs/scifi-ui/styles/formatx-current-mag-r422.css'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - 'docs/scifi-ui/styles/formatx-mobile-header-final-r418.css'
      - '.github/scripts/validate-living-core-r425-source.cjs'
      - '.github/workflows/validate-mobile-touch-ownership-r417.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate R457 optics, R458 first-paint and touch source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          node --check docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node --check docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          node .github/scripts/validate-living-core-r425-source.cjs
          grep -q "touch-pulse-r417-ui-safe" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -q "production-r418-mobile-first-paint-header-lock" docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css
          grep -q "production-r428-final-cross-device-header-owner-language-visible-non-occluding" docs/scifi-ui/styles/formatx-mobile-header-final-r418.css
          grep -q "direct-r326-r456-uniform-solid-glass-idle-zero" docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js
          grep -q "r457-soft-mobile-edge-bloom" docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js
          grep -q "brightness(1.20)" docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css
          grep -q "contrast(.98)" docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css
          grep -q "saturate(1.31)" docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css
          grep -q "blur(.48px)" docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css
          grep -q "static-first-paint-owner-no-late-css" docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          grep -q "static-first-paint-owner-no-late-css" docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-touch" && cd "$RUNNER_TEMP/mobile-touch"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify R457 phone optics, header, language and touch targets
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/mobile-touch/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/mobile-touch-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(value,message)=>{if(!value)throw new Error(message);};
          const overlap=(a,b,gap=0)=>!(a.right+gap<=b.left||b.right+gap<=a.left||a.bottom+gap<=b.top||b.bottom+gap<=a.top);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const r=document.documentElement.dataset;
              return r.fxCrystalOrganismR326==='ready'
                && r.fxCoreRenderer==='single-webgl-crystal-organism-r326'
                && r.fxMobileHeaderFinalR418==='loaded-last-mobile'
                && r.fxMobileReferenceStylePolicyR458==='static-first-paint-owner-no-late-css'
                && Boolean(document.querySelector('.topbar > .fx-language-toggle'))
                && Boolean(document.querySelector('.fx-three-sound'));
            },null,{timeout:45000});
            await page.waitForTimeout(250);
            const state=await page.evaluate(()=>{
              const box=node=>{if(!node)return null;const r=node.getBoundingClientRect(),s=getComputedStyle(node);return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,position:s.position,display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1)};};
              const topbar=document.querySelector('.topbar');
              const brand=topbar?.querySelector(':scope > .brand');
              const mag=topbar?.querySelector(':scope > .fx-reference-mag-button');
              const lang=topbar?.querySelector(':scope > .fx-language-toggle');
              const menu=topbar?.querySelector(':scope > .fx-reference-menu-button');
              const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              const sound=document.querySelector('.fx-three-sound');
              const cs=canvas?getComputedStyle(canvas):null;
              return{topbar:box(topbar),brand:box(brand),mag:box(mag),lang:box(lang),menu:box(menu),sound:box(sound),langText:String(lang?.textContent||'').trim(),filter:cs?.filter||'',canvas:box(canvas),renderer:document.documentElement.dataset.fxCoreRenderer||'',policy:document.documentElement.dataset.fxMobileReferenceStylePolicyR458||''};
            });
            console.log('R457_MOBILE_STATE',JSON.stringify(state));
            for(const key of ['topbar','brand','mag','lang','menu','sound','canvas'])assert(state[key],`missing ${key}: `+JSON.stringify(state));
            assert(state.topbar.top<=1&&state.topbar.height>=68&&state.topbar.height<=76,'topbar geometry changed: '+JSON.stringify(state));
            for(const key of ['brand','mag','lang','menu'])assert(state[key].top>=state.topbar.top-1&&state[key].bottom<=state.topbar.bottom+1,`${key} escaped topbar: `+JSON.stringify(state));
            assert(!overlap(state.brand,state.mag,2)&&!overlap(state.mag,state.lang,2)&&!overlap(state.lang,state.menu,2),'header controls overlap: '+JSON.stringify(state));
            assert(state.lang.width>=44&&state.lang.height>=44&&state.sound.width>=44&&state.sound.height>=44,'touch target below 44px: '+JSON.stringify(state));
            assert(state.langText==='HU','language did not start in HU: '+JSON.stringify(state));
            assert(state.policy==='static-first-paint-owner-no-late-css','late compatibility CSS path became active: '+JSON.stringify(state));
            assert(/brightness\(1\.2(?:0)?\)/.test(state.filter),'R457 mobile brightness missing: '+state.filter);
            assert(/contrast\(0?\.98\)/.test(state.filter),'R457 mobile contrast missing: '+state.filter);
            assert(/saturate\(1\.31\)/.test(state.filter),'R457 mobile saturation missing: '+state.filter);
            assert(/blur\(0\.48px\)/.test(state.filter),'R457 soft edge missing: '+state.filter);
            assert(state.renderer==='single-webgl-crystal-organism-r326','wrong renderer: '+JSON.stringify(state));
            const lang=page.locator('.topbar > .fx-language-toggle').first();
            await lang.tap();
            await page.waitForFunction(()=>document.documentElement.lang==='en'&&document.querySelector('.topbar > .fx-language-toggle')?.textContent?.trim()==='EN',null,{timeout:5000});
            const sound=page.locator('.fx-three-sound').first();
            const sb=await sound.boundingBox();assert(sb,'SOUND box missing');
            const topmost=await page.evaluate(({x,y})=>{const el=document.elementFromPoint(x,y);return Boolean(el?.closest?.('.fx-three-sound'));},{x:sb.x+sb.width/2,y:sb.y+sb.height/2});
            assert(topmost,'SOUND is not the topmost touch target');
            await page.touchscreen.tap(sb.x+sb.width/2,sb.y+sb.height/2);
            const mb=await page.locator('.topbar > .fx-reference-mag-button').first().boundingBox();assert(mb,'MAG box missing');
            const magTopmost=await page.evaluate(({x,y})=>Boolean(document.elementFromPoint(x,y)?.closest?.('.fx-reference-mag-button')),{x:mb.x+mb.width/2,y:mb.y+mb.height/2});
            assert(magTopmost,'MAG is not the topmost touch target');
            await browser.close();
            console.log('PASS: R457 soft mobile optics, R458 first-paint ownership, HU/EN, MAG and SOUND touch targets passed.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Publish current mobile visual/touch status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='R457 soft mobile MAG, R458 first paint, language and touch passed'; else state=failure; description='Current cross-device language, visual or touch ownership failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX R454 MAG language and touch' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
