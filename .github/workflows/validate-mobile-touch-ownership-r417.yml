name: Validate r418 mobile visual and touch ownership
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/scripts/formatx-wda-controls-r198.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-true-volume-r267.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-portal-r318.js'
      - 'docs/scifi-ui/styles/formatx-core-true-volume-r267.css'
      - 'docs/scifi-ui/styles/formatx-mobile-control-stability-r320.css'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - 'docs/scifi-ui/styles/formatx-mobile-r416-stability.css'
      - 'docs/scifi-ui/styles/formatx-mobile-header-final-r418.css'
      - '.github/workflows/validate-mobile-touch-ownership-r417.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate r418 and true-volume source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          node --check docs/scifi-ui/scripts/formatx-wda-controls-r198.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -q "touch-pulse-r417-ui-safe" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -q "interactive-target-bypassed" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -q "setPointerCapture" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -q "releasePointerCapture" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -q "fxWdaSoundTouchR418" docs/scifi-ui/scripts/formatx-wda-controls-r198.js
          grep -q "fxSoundTouchRecoveryR418" docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -q "fallback-click-delivered" docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -q "production-r418-mobile-first-paint-header-lock" docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css
          grep -q "production-r418-attached-header-restrained-mag" docs/scifi-ui/styles/formatx-mobile-r416-stability.css
          grep -q "production-r418-final-mobile-header-owner" docs/scifi-ui/styles/formatx-mobile-header-final-r418.css
          grep -q "closed-front-back-sidewalls" docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -q "physical-z-depth-r267" docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -q "normal-based-two-light-soft-fresnel" docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -q "event-driven-no-idle-raf" docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -q "balanced-volume-optics" docs/scifi-ui/scripts/formatx-crystal-portal-r318.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-touch" && cd "$RUNNER_TEMP/mobile-touch"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify header, true-volume MAG optics, SOUND and direct MAG touch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/mobile-touch-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/mobile-touch"
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(value,message)=>{if(!value)throw new Error(message);};
          const overlaps=(a,b,gap=0)=>!(a.right+gap<=b.left||b.right+gap<=a.left||a.bottom+gap<=b.top||b.bottom+gap<=a.top);
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});

            const firstPaint=await page.evaluate(()=>{
              const rect=node=>{const r=node?.getBoundingClientRect();return r?{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}:null;};
              const topbar=document.querySelector('.topbar');
              const brand=topbar?.querySelector(':scope > .brand');
              const skip=document.querySelector('.skip-link');
              const skipStyle=skip?getComputedStyle(skip):null;
              return {topbar:rect(topbar),brand:rect(brand),skip:rect(skip),skipPosition:skipStyle?.position||'',skipTop:skipStyle?.top||''};
            });
            console.log('R418_FIRST_PAINT',JSON.stringify(firstPaint));
            assert(firstPaint.topbar&&firstPaint.topbar.top<=1&&firstPaint.topbar.height>=68&&firstPaint.topbar.height<=76,'mobile topbar is not the first 72px carrier: '+JSON.stringify(firstPaint));
            assert(firstPaint.brand&&firstPaint.brand.top>=firstPaint.topbar.top&&firstPaint.brand.bottom<=firstPaint.topbar.bottom+1,'brand escaped the first-paint topbar: '+JSON.stringify(firstPaint));
            assert(firstPaint.skip&&firstPaint.skip.bottom<0&&firstPaint.skipPosition==='fixed','skip link consumed touch layout space: '+JSON.stringify(firstPaint));

            await page.waitForFunction(()=>{
              const root=document.documentElement;
              return root.dataset.fxCoreTrueVolumeR267==='ready'
                && root.dataset.fxCoreVolumeTopology==='closed-front-back-sidewalls'
                && root.dataset.fxCoreVolumeDepth==='physical-z-depth-r267'
                && root.dataset.fxCoreVolumeLighting==='normal-based-two-light-soft-fresnel'
                && root.dataset.fxControlOwnerR268==='ready'
                && root.dataset.fxCoreTouchPulseR99==='ready-r417'
                && root.dataset.fxMobileHeaderFinalR418==='loaded-last'
                && root.dataset.fxSoundTouchRecoveryR418==='ready'
                && Boolean(document.querySelector('.fx-three-sound'))
                && Boolean(document.querySelector('#hero .fx-core-r267-volume-stage > .fx-core-r267-volume-canvas'));
            },null,{timeout:45000});
            await page.waitForTimeout(500);

            const header=await page.evaluate(()=>{
              const box=node=>{if(!node)return null;const r=node.getBoundingClientRect(),s=getComputedStyle(node);return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,position:s.position,display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1)};};
              const bars=[...document.querySelectorAll('.topbar')].filter(node=>{const s=getComputedStyle(node),r=node.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.02&&r.width>0&&r.height>0;});
              const topbar=bars.find(bar=>bar.querySelector(':scope > .brand'))||bars[0];
              const brand=topbar?.querySelector(':scope > .brand');
              const mag=topbar?.querySelector(':scope > .fx-reference-mag-button');
              const lang=topbar?.querySelector(':scope > .fx-language-toggle');
              const menu=topbar?.querySelector(':scope > .fx-reference-menu-button');
              const canvas=document.querySelector('#hero .fx-core-r267-volume-stage > .fx-core-r267-volume-canvas');
              const cs=canvas?getComputedStyle(canvas):null;
              let gl=false,glError=null;
              if(canvas instanceof HTMLCanvasElement){const context=canvas.getContext('webgl2')||canvas.getContext('webgl');gl=Boolean(context);glError=context?.getError?.()??null;}
              const r=document.documentElement.dataset;
              return {count:bars.length,topbar:box(topbar),brand:box(brand),mag:box(mag),lang:box(lang),menu:box(menu),canvas:box(canvas),filter:cs?.filter||'',canvasOpacity:Number(cs?.opacity||0),gl,glError,headerMarker:r.fxCanonicalTopbarR417||'',finalOwner:r.fxMobileHeaderFinalR418||'',trueVolume:r.fxCoreTrueVolumeR267||'',topology:r.fxCoreVolumeTopology||'',depth:r.fxCoreVolumeDepth||'',lighting:r.fxCoreVolumeLighting||'',scheduler:r.fxCoreSchedulerR267||''};
            });
            console.log('R418_TRUE_VOLUME_OPTICS',JSON.stringify(header));
            assert(header.count===1,'exactly one visible mobile topbar is required: '+JSON.stringify(header));
            assert(header.finalOwner==='loaded-last','final r418 header owner is not authoritative: '+JSON.stringify(header));
            for(const key of ['brand','mag','lang','menu'])assert(header[key]&&header[key].top>=header.topbar.top-1&&header[key].bottom<=header.topbar.bottom+1,key+' escaped topbar: '+JSON.stringify(header));
            assert(header.mag.position==='absolute'&&header.lang.position==='absolute'&&header.menu.position==='absolute','header controls must remain attached absolute children: '+JSON.stringify(header));
            assert(!overlaps(header.brand,header.mag,2)&&!overlaps(header.mag,header.lang,2)&&!overlaps(header.lang,header.menu,2),'mobile header controls overlap: '+JSON.stringify(header));
            assert(header.canvas&&header.canvasOpacity>=.98&&header.canvasOpacity<=1.01,'true-volume MAG canvas must remain fully visible: '+JSON.stringify(header));
            assert(/blur\(0\.(1[0-9]|2[0-9]|3[0-9])px\)/.test(header.filter),'true-volume MAG soft edge finish is missing or too strong: '+JSON.stringify(header));
            assert(header.gl&&header.glError===0,'true-volume MAG has no healthy WebGL context: '+JSON.stringify(header));
            assert(header.trueVolume==='ready'&&header.topology==='closed-front-back-sidewalls'&&header.depth==='physical-z-depth-r267'&&header.lighting==='normal-based-two-light-soft-fresnel','true-volume 3D contract missing: '+JSON.stringify(header));
            assert(header.scheduler==='event-driven-no-idle-raf','true-volume MAG regressed to idle animation loop: '+JSON.stringify(header));

            const soundTap=await page.evaluate(()=>{
              const sound=document.querySelector('.fx-three-sound');
              if(!(sound instanceof HTMLButtonElement))return null;
              const r=sound.getBoundingClientRect();
              window.__fxSoundTouchTrace=[];
              const desc=node=>node instanceof Element?`${node.tagName.toLowerCase()}#${node.id||''}.${String(node.className||'').replace(/\s+/g,'.').slice(0,120)}`:String(node?.nodeName||'');
              for(const type of ['pointerdown','touchstart','pointerup','touchend','click'])document.addEventListener(type,event=>window.__fxSoundTouchTrace.push({type,target:desc(event.target),trusted:event.isTrusted}),{capture:true,passive:true});
              return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
            });
            assert(soundTap&&soundTap.w>=44&&soundTap.h>=44,'SOUND target missing or too small: '+JSON.stringify(soundTap));

            await page.touchscreen.tap(soundTap.x,soundTap.y);
            await page.waitForTimeout(500);
            const firstDelivery=await page.evaluate(()=>({
              trace:window.__fxSoundTouchTrace||[],
              guard:document.documentElement.dataset.fxCoreTouchUiGuardR417||'',
              wda:document.documentElement.dataset.fxWdaSoundTouchR418||'',
              recovery:document.documentElement.dataset.fxSoundTouchRecoveryStateR418||'',
              audioOwner:document.documentElement.dataset.fxAudioOwner||'',
              audioState:document.documentElement.dataset.fxAudioState||''
            }));
            console.log('R418_SOUND_TOUCH_ON',JSON.stringify(firstDelivery));
            assert(firstDelivery.audioOwner==='professional-v6','professional audio owner did not receive SOUND activation: '+JSON.stringify(firstDelivery));
            assert(firstDelivery.audioState==='on','first physical SOUND tap did not switch audio on: '+JSON.stringify(firstDelivery));
            assert(['native-click','fallback-click-delivered'].includes(firstDelivery.recovery),'SOUND touch recovery did not complete: '+JSON.stringify(firstDelivery));
            assert(firstDelivery.guard==='interactive-target-bypassed','MAG touch owner did not bypass interactive SOUND target: '+JSON.stringify(firstDelivery));
            const firstPointerUp=firstDelivery.trace.find(item=>item.type==='pointerup');
            assert(firstPointerUp&&/svg|fx-three-sound|fx-wda-sound-icon/.test(firstPointerUp.target),'SOUND pointerup escaped to the MAG stage: '+JSON.stringify(firstDelivery));

            await page.touchscreen.tap(soundTap.x,soundTap.y);
            await page.waitForTimeout(500);
            const secondDelivery=await page.evaluate(()=>({
              trace:window.__fxSoundTouchTrace||[],
              recovery:document.documentElement.dataset.fxSoundTouchRecoveryStateR418||'',
              audioOwner:document.documentElement.dataset.fxAudioOwner||'',
              audioState:document.documentElement.dataset.fxAudioState||''
            }));
            console.log('R418_SOUND_TOUCH_OFF',JSON.stringify(secondDelivery));
            assert(secondDelivery.audioOwner==='professional-v6','professional audio owner disappeared after second SOUND tap: '+JSON.stringify(secondDelivery));
            assert(secondDelivery.audioState==='off','second physical SOUND tap did not switch audio off: '+JSON.stringify(secondDelivery));
            assert(['native-click','fallback-click-delivered'].includes(secondDelivery.recovery),'second SOUND touch recovery did not complete: '+JSON.stringify(secondDelivery));
            assert(secondDelivery.trace.filter(item=>item.type==='pointerup').length>=2,'second SOUND pointerup was not delivered: '+JSON.stringify(secondDelivery));

            const coreTap=await page.evaluate(()=>{
              const stage=document.querySelector('#hero .fx-core-r267-volume-stage');if(!(stage instanceof HTMLElement))return null;const r=stage.getBoundingClientRect();window.__fxCoreTouchEvents=[];addEventListener('formatx:coreinteraction',event=>window.__fxCoreTouchEvents.push(event.detail),{passive:true});return{x:r.left+r.width*.5,y:r.top+r.height*.42,w:r.width,h:r.height};
            });
            assert(coreTap&&coreTap.w>100&&coreTap.h>100,'true-volume MAG stage missing: '+JSON.stringify(coreTap));
            await page.touchscreen.tap(coreTap.x,coreTap.y);
            await page.waitForTimeout(300);
            const coreEvents=await page.evaluate(()=>window.__fxCoreTouchEvents||[]);
            console.log('R418_MAG_TOUCH',JSON.stringify(coreEvents));
            assert(coreEvents.some(event=>event?.phase==='press'),'direct MAG touch no longer reaches the 3D interaction owner');
            assert(coreEvents.some(event=>event?.phase==='release'),'direct MAG touch does not release cleanly');

            await ctx.close();await browser.close();
            console.log('PASS: r418 header, closed-volume WebGL MAG optics, SOUND ON/OFF touch transitions and direct MAG touch passed.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Publish r418 mobile visual/touch status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r418 header, true-volume MAG optics and touch ownership passed'; else state=failure; description='r418 mobile visual or touch ownership failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX r418 mobile visual and touch' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
