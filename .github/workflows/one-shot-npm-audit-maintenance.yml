name: One-shot npm audit maintenance

on:
  push:
    branches:
      - maintenance/npm-audit-20260731
    paths:
      - '.github/workflows/one-shot-npm-audit-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-npm-audit-maintenance
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Capture audit state and apply safe lockfile fixes
        working-directory: billing-worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          npm ci
          npm audit --json > ../artifacts/npm-audit-before.json || true
          npm audit fix --package-lock-only
          npm ci
          npm audit --json > ../artifacts/npm-audit-after.json || true

          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('../artifacts/npm-audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('../artifacts/npm-audit-after.json', 'utf8'));
          const counts = report => report.metadata?.vulnerabilities || {};
          console.log('AUDIT_BEFORE=' + JSON.stringify(counts(before)));
          console.log('AUDIT_AFTER=' + JSON.stringify(counts(after)));
          NODE

      - name: Run Worker and licence tests
        working-directory: billing-worker
        run: npm test

      - name: Validate production dry-build
        working-directory: billing-worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-npm-audit-candidate

      - name: Remove one-shot workflow and commit safe changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-npm-audit-maintenance.yml
          git config user.name 'FormatX maintenance automation'
          git config user.email 'actions@users.noreply.github.com'
          git add billing-worker/package-lock.json

          if git diff --cached --quiet; then
            echo 'No safe dependency changes were available.'
            git commit -m 'Remove completed npm audit maintenance workflow'
          else
            git commit -m 'Apply safe npm audit lockfile updates'
          fi

          git push origin HEAD:maintenance/npm-audit-20260731

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-npm-audit-maintenance
          path: |
            artifacts/npm-audit-before.json
            artifacts/npm-audit-after.json
          if-no-files-found: warn
          retention-days: 14
