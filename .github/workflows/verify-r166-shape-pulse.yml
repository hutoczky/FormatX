name: Verify r183 smooth living MAG motion

on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-r166-shape-pulse.yml']
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smooth-motion-live:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify display-synced heartbeat without layout movement
        run: |
          cat > verify-r183.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const origin='https://formatxsuite.com';

          async function runDevice(browser,label,opts){
            const context=await browser.newContext(opts);
            const page=await context.newPage();
            await page.goto(`${origin}/?verify=r183-${label.toLowerCase()}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{
              const r=document.documentElement.dataset;
              return r.fxCoreReferenceTextureR130==='ready' &&
                r.fxLiveHeartbeatR155==='js-reactive-heartbeat-r155' &&
                r.fxLivingHeartbeatModeR158==='r158-lub-dub-seamless-living' &&
                r.fxLivingShapeModeR167==='r183-display-synced-internal-canvas' &&
                r.fxLiveHeartbeatClockR155==='requestAnimationFrame-display-synced-r183' &&
                r.fxLivingEnergyClockR168==='display-synced-raf-r183';
            },null,{timeout:60000});
            await page.waitForTimeout(300);

            const samples=[];
            for(let i=0;i<32;i++){
              samples.push(await page.evaluate(()=>{
                const r=document.documentElement.dataset;
                const d=document.querySelector('#hero .fx-core-detail-r122');
                const b=d?.getBoundingClientRect();
                const internal=String(r.fxLivingShapePulseR166||'').split(',').map(Number);
                return {
                  x:b?.x||0,y:b?.y||0,w:b?.width||0,h:b?.height||0,
                  cssScale:d?getComputedStyle(d).scale:'',
                  internalX:internal[0],internalY:internal[1],
                  heartbeat:Number(r.fxLiveHeartbeatTickR155||0),
                  energyFrame:Number(r.fxLivingEnergyFrameR168||0),
                  hz:Number(r.fxDisplayRefreshHzR183||0),
                  scheduler:r.fxHeartbeatSchedulerR183||'',
                  energyScheduler:r.fxLivingEnergySchedulerR175||'',
                  renderMs:Number(r.fxCoreRenderMs||Infinity)
                };
              }));
              await page.waitForTimeout(40);
            }
            const span=a=>Math.max(...a)-Math.min(...a);
            const wSpan=span(samples.map(s=>s.w)),hSpan=span(samples.map(s=>s.h));
            const xSpan=span(samples.map(s=>s.x)),ySpan=span(samples.map(s=>s.y));
            const ixSpan=span(samples.map(s=>s.internalX).filter(Number.isFinite));
            const iySpan=span(samples.map(s=>s.internalY).filter(Number.isFinite));
            const hbDelta=samples.at(-1).heartbeat-samples[0].heartbeat;
            const enDelta=samples.at(-1).energyFrame-samples[0].energyFrame;
            const last=samples.at(-1);
            console.log(label,JSON.stringify({wSpan,hSpan,xSpan,ySpan,ixSpan,iySpan,hbDelta,enDelta,hz:last.hz,scheduler:last.scheduler,energyScheduler:last.energyScheduler,cssScale:last.cssScale},null,2));

            assert.ok(wSpan<0.6&&hSpan<0.6&&xSpan<0.6&&ySpan<0.6,`${label}: crystal DOM box is moving and can cause layout jump`);
            assert.ok(last.cssScale==='none'||last.cssScale==='1'||last.cssScale==='1 1',`${label}: external CSS scale returned: ${last.cssScale}`);
            assert.ok(ixSpan>.004&&iySpan>.007,`${label}: internal canvas heartbeat is not visibly alive`);
            assert.ok(hbDelta>=30,`${label}: display-synced heartbeat stalled`);
            assert.ok(enDelta>=30,`${label}: display-synced energy layer stalled`);
            assert.equal(last.scheduler,'display-refresh-adaptive');
            assert.equal(last.energyScheduler,'requestAnimationFrame-display-synced-r183');
            assert.ok(last.hz===0||last.hz>=40,`${label}: measured rAF rate too low: ${last.hz}`);
            assert.ok(samples.every(s=>s.renderMs<16.67),`${label}: renderer exceeded frame budget`);

            const before=await page.evaluate(()=>Number(document.documentElement.dataset.fxLiveHeartbeatEnergyR155||0));
            if(opts.hasTouch)await page.touchscreen.tap(Math.round(opts.viewport.width*.72),Math.round(opts.viewport.height*.35));
            else {const box=await page.locator('#hero .hero-space').boundingBox();if(box){await page.mouse.move(box.x+box.width*.72,box.y+box.height*.35);await page.mouse.down();await page.waitForTimeout(70);await page.mouse.up();}}
            await page.waitForTimeout(160);
            const after=await page.evaluate(()=>Number(document.documentElement.dataset.fxLiveHeartbeatEnergyR155||0));
            assert.ok(after>=before,`${label}: interaction did not energize the MAG`);
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              await runDevice(browser,'DESKTOP',{viewport:{width:1600,height:1000},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference'});
              await runDevice(browser,'MOBILE',{viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'});
            }finally{await browser.close();}
            console.log('PASS: r183 uses display-synced rAF, keeps the DOM box fixed and preserves internal living crystal pulse on desktop and mobile.');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-r183.cjs
