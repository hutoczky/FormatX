name: Verify r184 no-jump mobile MAG

on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-r166-shape-pulse.yml']
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-jump-live:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify stable mobile geometry while living motion runs
        run: |
          cat > verify-r184.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const origin='https://formatxsuite.com';
          const span=a=>Math.max(...a)-Math.min(...a);
          const finite=a=>a.filter(Number.isFinite);

          async function sample(page){
            return page.evaluate(()=>{
              const root=document.documentElement;
              const pick=sel=>{
                const e=document.querySelector(sel);if(!e)return null;
                const r=e.getBoundingClientRect();
                return{x:r.x,y:r.y,w:r.width,h:r.height};
              };
              return{
                scheduler:root.dataset.fxLiveLayoutSchedulerR184||'',
                paused:root.dataset.fxReferenceMotionPaused||'',
                detail:pick('#hero .fx-core-detail-r122'),
                layer:pick('#hero .fx-core-live-r147-layer'),
                heading:pick('#hero .fx-reference-heading'),
                proof:pick('#hero .fx-reference-proof'),
                dock:pick('#hero .fx-mobile-download-r151'),
                liveFrame:root.dataset.fxLiveMotionFrameR147||'',
                energyFrame:Number(root.dataset.fxLivingEnergyFrameR168||0),
                shape:root.dataset.fxLivingShapePulseR166||'',
                renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),
                corePosition:[...(window.FormatXCoreCinematic?.corePosition||[0,0,0])]
              };
            });
          }

          function motionOf(samples,key){
            const rows=samples.map(s=>s[key]).filter(Boolean);
            assert.ok(rows.length===samples.length,`${key} missing during capture`);
            return{
              x:span(rows.map(r=>r.x)),y:span(rows.map(r=>r.y)),
              w:span(rows.map(r=>r.w)),h:span(rows.map(r=>r.h))
            };
          }
          function assertStable(label,m,limit=.75){
            assert.ok(m.x<limit&&m.y<limit&&m.w<limit&&m.h<limit,
              `${label} jumped: ${JSON.stringify(m)}`);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'});
            const page=await context.newPage();
            await page.goto(`${origin}/?verify=r184-no-jump-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{
              const r=document.documentElement.dataset;
              return r.fxMobileReferenceLayout==='ready-v1' &&
                r.fxCoreReferenceTextureR130==='ready' &&
                r.fxLiveLayoutSchedulerR184==='resize-driven-stable' &&
                r.fxLiveHeartbeatR155==='js-reactive-heartbeat-r155' &&
                r.fxLivingEnergyClockR168==='display-synced-raf-r183';
            },null,{timeout:60000});
            await page.waitForTimeout(450);

            const before=[];
            for(let i=0;i<40;i++){before.push(await sample(page));await page.waitForTimeout(55);}
            const bm={
              detail:motionOf(before,'detail'),layer:motionOf(before,'layer'),
              heading:motionOf(before,'heading'),proof:motionOf(before,'proof'),dock:motionOf(before,'dock')
            };
            for(const [k,v] of Object.entries(bm))assertStable(`idle ${k}`,v);
            assert.ok(before.every(s=>s.scheduler==='resize-driven-stable'));
            assert.ok(before.every(s=>s.renderMs<16.67));

            const preEnergy=before.at(-1).energyFrame;
            const prePos=before.at(-1).corePosition;
            await page.touchscreen.tap(300,285);
            await page.waitForTimeout(120);
            await page.touchscreen.tap(130,320);
            await page.waitForTimeout(180);

            const after=[];
            for(let i=0;i<28;i++){after.push(await sample(page));await page.waitForTimeout(55);}
            const am={
              detail:motionOf(after,'detail'),layer:motionOf(after,'layer'),
              heading:motionOf(after,'heading'),proof:motionOf(after,'proof'),dock:motionOf(after,'dock')
            };
            for(const [k,v] of Object.entries(am))assertStable(`interactive ${k}`,v);
            const post=after.at(-1);
            assert.ok(post.energyFrame>=preEnergy,'living energy clock regressed');
            assert.ok(post.corePosition.some((v,i)=>Math.abs(v-(prePos[i]||0))>.0005)||post.liveFrame!==before.at(-1).liveFrame,'touch did not affect living motion');
            assert.equal(post.paused,'false');

            console.log('R184 MOBILE STABILITY',JSON.stringify({idle:bm,interactive:am,energy:[preEnergy,post.energyFrame],prePos,postPos:post.corePosition,shape:post.shape,scheduler:post.scheduler},null,2));
            await context.close();await browser.close();
            console.log('PASS: r184 mobile MAG, heading, proof and download geometry remain fixed while living touch motion continues.');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-r184.cjs
