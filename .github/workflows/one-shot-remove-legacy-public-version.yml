name: One-shot legacy public version cleanup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-remove-legacy-public-version.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove legacy public version fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace(
              '<strong id="release-name">FormatX Suite Pro V92</strong>',
              '<strong id="release-name">FormatX Suite Pro</strong>'
          )
          html = html.replace(
              'https://github.com/hutoczky/FormatX-Updates/releases/tag/v92',
              'https://github.com/hutoczky/FormatX-Updates/releases'
          )
          if 'FormatX Suite Pro V92' in html or 'releases/tag/v92' in html:
              raise SystemExit('Legacy V92 public fallback remains in index.html')
          index.write_text(html, encoding='utf-8')

          worker = Path('billing-worker/src/production-content-entry.js')
          source = worker.read_text(encoding='utf-8')
          anchor = "    .replaceAll('https://github.com/hutoczky/FormatX-Updates/releases/download/v92/FormatX-Suite-Pro-V92.zip', '/scifi-ui/downloads/')\n"
          generic = "    .replace(/\\bFormatX Suite Pro V\\d+\\b/gi, 'FormatX Suite Pro')\n    .replace(/\\bWindows V\\d+\\b/gi, 'Windows')\n    .replace(/https:\\/\\/github\\.com\\/hutoczky\\/FormatX-Updates\\/releases\\/tag\\/v\\d+/gi, 'https://github.com/hutoczky/FormatX-Updates/releases')\n"
          if generic not in source:
              if anchor not in source:
                  raise SystemExit('Expected production cleanup anchor not found')
              source = source.replace(anchor, anchor + generic, 1)
          worker.write_text(source, encoding='utf-8')

          Path('.github/workflows/one-shot-remove-legacy-public-version.yml').unlink()
          PY

      - name: Commit cleanup and request production deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '[deploy-production] Remove legacy public version fallbacks'
          git push origin HEAD:master
