name: R2124 real full-film MAG identity no-overlap proof

on:
  push:
    branches:
      - feature/r2104-cinematic-machined-mag-intro
    paths:
      - 'docs/scifi-ui/styles/formatx-ai-core-ident-r1951.css'
      - 'docs/scifi-ui/scripts/formatx-ai-core-ident-r1951.js'
      - 'docs/scifi-ui/index.html'
      - '.github/scripts/validate-r2124-no-mobile-label-overlap.cjs'
      - '.github/workflows/verify-r2124-mag-identity-overlap.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2124-identity-physical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-identity-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real post-intro badge syntax
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-ai-core-ident-r1951.js
          node --check .github/scripts/validate-r2124-no-mobile-label-overlap.cjs
      - name: Prepare true headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/r2124" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/r2124/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start real complete website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > /tmp/r2124-server.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/r2124-server.log
          exit 1
      - name: Verify real film handoff and no content overlap on 390, 360 and 1440
        env:
          NODE_PATH: ${{ runner.temp }}/r2124/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-r2124-no-mobile-label-overlap.cjs
      - name: Preserve original browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2124-post-intro-ident-layout-proof
          path: artifacts/r2124-real-post-intro-badge/
          retention-days: 21
          if-no-files-found: warn
