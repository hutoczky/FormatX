name: Validate FormatX WDA 100-target r206

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/scripts/formatx-wda-controls-r198.js'
      - 'docs/scifi-ui/scripts/formatx-wda-gpu-r198.js'
      - 'docs/scifi-ui/scripts/formatx-audio-repair.js'
      - 'docs/scifi-ui/styles/formatx-wda-hardening-r198.css'
      - 'docs/scifi-ui/styles/formatx-first-paint-r206.css'
      - 'billing-worker/src/production-content-entry.js'
      - 'lighthouserc.live.json'
      - 'lighthouserc.live.mobile.json'
      - 'billing-worker/wrangler.jsonc'
      - '.github/scripts/validate-wda-100-r198.cjs'
      - '.github/workflows/validate-wda-100-r198.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/scripts/formatx-wda-controls-r198.js'
      - 'docs/scifi-ui/scripts/formatx-wda-gpu-r198.js'
      - 'docs/scifi-ui/scripts/formatx-audio-repair.js'
      - 'docs/scifi-ui/styles/formatx-wda-hardening-r198.css'
      - 'docs/scifi-ui/styles/formatx-first-paint-r206.css'
      - 'billing-worker/src/production-content-entry.js'
      - 'lighthouserc.live.json'
      - 'lighthouserc.live.mobile.json'
      - 'billing-worker/wrangler.jsonc'
      - '.github/scripts/validate-wda-100-r198.cjs'
      - '.github/workflows/validate-wda-100-r198.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-wda-r206-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wda-100-target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate WDA 100-target source contracts
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-award-runtime-r206.js
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-wda-controls-r198.js
          node --check docs/scifi-ui/scripts/formatx-wda-gpu-r198.js
          node --check .github/scripts/validate-wda-100-r198.cjs
          node .github/scripts/validate-wda-100-r198.cjs
          git diff --check

      - name: Publish WDA target status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='r206 award UX, a11y, audio, fail-open, mobile GPU and Lighthouse contracts passed'
          else
            state=failure
            description='FormatX r206 100-target source gate failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX WDA 100-target' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
