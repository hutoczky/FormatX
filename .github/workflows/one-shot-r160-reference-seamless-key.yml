name: One-shot r381 mobile MAG optics

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-shot-r160-reference-seamless-key.yml'

permissions:
  contents: write

jobs:
  patch-mobile-mag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply targeted mobile shader softening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          shader = Path('docs/scifi-ui/scripts/formatx-crystal-organism-r326.js')
          text = shader.read_text(encoding='utf-8')
          replacements = [
              ("    innerHeartBase: '.105',", "    innerHeartBase: '.072',"),
              ("    innerHeartBreath: '.18',", "    innerHeartBreath: '.105',"),
              ("    innerHeartAlpha: '.09',", "    innerHeartAlpha: '.055',"),
              ("    innerAlphaMax: '.46',", "    innerAlphaMax: '.34',"),
              ("    rimBase: '.058',", "    rimBase: '.032',"),
              ("    rimEnergy: '.038',", "    rimEnergy: '.018',"),
              ("    rimAlpha: '.018',", "    rimAlpha: '.010',"),
              ("    outerHeartBase: '.026',", "    outerHeartBase: '.018',"),
              ("    outerHeartEnergy: '.034',", "    outerHeartEnergy: '.016',"),
              ("    facetStrength: '.13',", "    facetStrength: '.095',"),
              ("    sideStrength: '.16',", "    sideStrength: '.105',"),
              ("    outerAlphaBase: '.46',", "    outerAlphaBase: '.42',"),
              ("    outerAlphaKey: '.13',", "    outerAlphaKey: '.09',"),
              ("    outerAlphaMin: '.39',", "    outerAlphaMin: '.35',"),
              ("    outerAlphaMax: '.76'", "    outerAlphaMax: '.66'"),
              (
                  "      gl.blendFunc(gl.SRC_ALPHA,gl.ONE);\n      gl.uniform1f(uniforms.uLayer,1);",
                  "      gl.blendFunc(gl.SRC_ALPHA,mobile?gl.ONE_MINUS_SRC_ALPHA:gl.ONE);\n      gl.uniform1f(uniforms.uLayer,1);"
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          shader.write_text(text, encoding='utf-8')

          mobile = Path('docs/scifi-ui/scripts/formatx-core-mobile-v55.js')
          data = mobile.read_text(encoding='utf-8')
          old = 'formatx-crystal-organism-r326.js?v=20260825-r326-new-organism'
          new = 'formatx-crystal-organism-r326.js?v=20260828-r381-mobile-soft-optics'
          if old not in data:
              raise SystemExit('Missing current r326 renderer cache key')
          mobile.write_text(data.replace(old, new), encoding='utf-8')

          bootstrap = Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          data = bootstrap.read_text(encoding='utf-8')
          mobile_old = 'formatx-core-mobile-v55.js?v=20260824-native-mechanical-orb-r251-performance'
          mobile_new = 'formatx-core-mobile-v55.js?v=20260828-r381-mobile-soft-optics'
          style_old = 'formatx-pure-3d-r285.css?v=20260821-r285'
          style_new = 'formatx-pure-3d-r285.css?v=20260828-r380-mobile-soft-optics'
          if mobile_old not in data:
              raise SystemExit('Missing current mobile bootstrap cache key')
          if style_old not in data:
              raise SystemExit('Missing current pure-3d style cache key')
          data = data.replace(mobile_old, mobile_new).replace(style_old, style_new)
          bootstrap.write_text(data, encoding='utf-8')

          for helper in (
              '.github/workflows/apply-r381-mobile-mag-optics.yml',
              '.github/workflows/r325-first-paint-live-audit-remediation.yml',
              '.github/workflows/one-shot-r160-reference-seamless-key.yml',
          ):
              Path(helper).unlink(missing_ok=True)
          PY

          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          git diff --check

      - name: Commit shader correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Tune mobile MAG shader for softer crystal optics'
          git push origin HEAD:master
