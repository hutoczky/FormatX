name: Validate FormatX layout readability

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/styles/**'
      - 'docs/scifi-ui/scripts/**'
      - 'billing-worker/src/production-with-license.js'
      - '.github/workflows/validate-formatx-layout-readability.yml'

permissions:
  contents: write

concurrency:
  group: validate-formatx-layout-readability
  cancel-in-progress: true

jobs:
  browser-layout-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate removed module and source syntax
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/scifi-ui/scripts/causal-memory-field.js
          test ! -e docs/scifi-ui/styles/causal-memory-field.css
          ! grep -R -F 'INTERAKCIÓS DNS' docs billing-worker/src
          ! grep -R -F 'causal-memory-field' docs billing-worker/src
          node --check docs/scifi-ui/scripts/landing.js
          node --check docs/scifi-ui/scripts/start-sale.js
          node --check docs/scifi-ui/scripts/future-5000.js
          node --check docs/scifi-ui/scripts/future-5000-effects.js
          node --check docs/scifi-ui/scripts/causal-memory-hover.js
          node --check docs/scifi-ui/scripts/causal-memory-boot.js
          node --check billing-worker/src/production-with-license.js

      - name: Build production-equivalent local audit page
        shell: python
        run: |
          from pathlib import Path

          source = Path('docs/scifi-ui/index.html').read_text(encoding='utf-8')
          styles = [
              'styles/start-sale.css',
              'styles/pricing-v100.css',
              'styles/future-5000.css',
              'styles/future-5000-effects.css',
              'styles/future-5000-readability.css',
              'styles/causal-memory-hover.css',
              'styles/causal-memory-boot.css',
              'styles/site-readability-audit.css',
          ]
          scripts = [
              'scripts/start-sale.js',
              'scripts/future-5000.js',
              'scripts/future-5000-effects.js',
              'scripts/causal-memory-hover.js',
              'scripts/causal-memory-boot.js',
          ]
          style_markup = ''.join(f'<link rel="stylesheet" href="./{item}">' for item in styles)
          script_markup = ''.join(f'<script defer src="./{item}"></script>' for item in scripts)
          source = source.replace('</head>', style_markup + '</head>', 1)
          source = source.replace('</body>', script_markup + '</body>', 1)
          Path('docs/scifi-ui/layout-audit.html').write_text(source, encoding='utf-8')

      - name: Install Chromium audit runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/formatx-layout"
          npm install --prefix "$RUNNER_TEMP/formatx-layout" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/formatx-layout/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start local website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs > "$RUNNER_TEMP/formatx-layout-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/formatx-layout-http.pid"
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/scifi-ui/layout-audit.html >/dev/null && exit 0
            sleep 0.3
          done
          cat "$RUNNER_TEMP/formatx-layout-http.log"
          exit 1

      - name: Audit overlaps, clipping and horizontal overflow
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-layout/node_modules
        run: |
          set -uo pipefail
          mkdir -p layout-audit-artifacts
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const cases = [
            { name: 'desktop-1440', width: 1440, height: 1200 },
            { name: 'desktop-1180', width: 1180, height: 900 },
            { name: 'tablet-768', width: 768, height: 1024 },
            { name: 'mobile-390', width: 390, height: 844 },
            { name: 'mobile-360', width: 360, height: 800 },
          ];
          const languages = ['hu', 'en'];
          const results = [];

          function auditScript() {
            const textSelector = [
              'h1', 'h2', 'h3', 'h4', 'p', 'li', 'a', 'button', 'output',
              '.panel-title', '.section-label', '.popular', '.start-sale-badge',
              '.fx5k-panel-label', '.fx5k-detail-status', '.fx5k-era span',
              '.fx5k-era strong', '.fx5k-era small', '.fx-plan-qr-copy strong',
              '.fx-plan-qr-copy span', '.fx-plan-qr-copy small'
            ].join(',');

            const ignored = [
              '.fx-intro-overlay', '.skip-link', '.topbar', 'svg',
              '[aria-hidden="true"]', '.fx-causal-live'
            ].join(',');

            const visible = (element) => {
              if (!element || element.closest(ignored)) return false;
              const style = getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return style.display !== 'none'
                && style.visibility !== 'hidden'
                && Number(style.opacity) > 0.01
                && rect.width > 2
                && rect.height > 2
                && (element.textContent || '').trim().length > 0;
            };

            const nodes = Array.from(document.querySelectorAll(textSelector)).filter(visible);
            const entries = nodes.map((element, index) => {
              const rect = element.getBoundingClientRect();
              return {
                index,
                element,
                rect,
                label: `${element.tagName.toLowerCase()}${element.id ? '#' + element.id : ''}${element.classList.length ? '.' + Array.from(element.classList).slice(0, 2).join('.') : ''}: ${(element.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 90)}`
              };
            });

            const overlaps = [];
            for (let i = 0; i < entries.length; i += 1) {
              for (let j = i + 1; j < entries.length; j += 1) {
                const a = entries[i];
                const b = entries[j];
                if (a.element.contains(b.element) || b.element.contains(a.element)) continue;
                if (a.element.closest('a,button') && a.element.closest('a,button') === b.element.closest('a,button')) continue;
                const width = Math.min(a.rect.right, b.rect.right) - Math.max(a.rect.left, b.rect.left);
                const height = Math.min(a.rect.bottom, b.rect.bottom) - Math.max(a.rect.top, b.rect.top);
                if (width > 3 && height > 3) {
                  const area = width * height;
                  const smaller = Math.min(a.rect.width * a.rect.height, b.rect.width * b.rect.height);
                  if (area > 18 && area / Math.max(1, smaller) > 0.015) {
                    overlaps.push({ first: a.label, second: b.label, width: Math.round(width), height: Math.round(height) });
                  }
                }
              }
            }

            const clipped = nodes.flatMap((element) => {
              const style = getComputedStyle(element);
              const verticalClip = ['hidden', 'clip'].includes(style.overflowY) && element.scrollHeight > element.clientHeight + 3;
              const horizontalClip = ['hidden', 'clip'].includes(style.overflowX) && element.scrollWidth > element.clientWidth + 3;
              if (!verticalClip && !horizontalClip) return [];
              return [{
                label: `${element.tagName.toLowerCase()}${element.id ? '#' + element.id : ''}: ${(element.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100)}`,
                verticalClip,
                horizontalClip,
                client: [element.clientWidth, element.clientHeight],
                scroll: [element.scrollWidth, element.scrollHeight]
              }];
            });

            const viewportOverflow = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth;
            return {
              overlaps,
              clipped,
              viewportOverflow,
              textNodeCount: nodes.length,
              interactionDnaPresent: document.body.textContent.includes('INTERAKCIÓS DNS')
                || document.body.textContent.includes('INTERACTION DNA')
                || Boolean(document.querySelector('.fx-causal-memory-panel')),
              readabilityLoaded: Array.from(document.styleSheets).some((sheet) => String(sheet.href || '').includes('site-readability-audit.css')),
              futureSectionPresent: Boolean(document.getElementById('formatx-future-5000')),
              qrDockPresent: Boolean(document.getElementById('formatx-plan-qr-dock')),
            };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of cases) {
                for (const language of languages) {
                  const context = await browser.newContext({
                    viewport: { width: viewport.width, height: viewport.height },
                    locale: language === 'hu' ? 'hu-HU' : 'en-GB',
                    reducedMotion: 'reduce',
                    hasTouch: viewport.width <= 768,
                    isMobile: viewport.width <= 480,
                  });
                  const page = await context.newPage();
                  const runtimeErrors = [];
                  page.on('pageerror', (error) => runtimeErrors.push(String(error)));
                  await page.goto('http://127.0.0.1:4173/scifi-ui/layout-audit.html?lang=' + language, { waitUntil: 'networkidle', timeout: 30000 });
                  await page.waitForSelector('#formatx-future-5000', { timeout: 12000 });
                  await page.waitForTimeout(2500);
                  await page.evaluate(() => {
                    const overlay = document.getElementById('formatx-event-horizon');
                    if (overlay) overlay.hidden = true;
                    document.documentElement.classList.remove('fx-intro-pending', 'fx-intro-running', 'fx-intro-reveal');
                    document.documentElement.classList.add('fx-intro-complete');
                  });
                  await page.waitForTimeout(350);

                  const audit = await page.evaluate(auditScript);
                  audit.runtimeErrors = runtimeErrors;
                  audit.case = `${viewport.name}-${language}`;
                  audit.width = viewport.width;
                  audit.height = viewport.height;
                  audit.pass = audit.overlaps.length === 0
                    && audit.clipped.length === 0
                    && audit.viewportOverflow <= 1
                    && audit.interactionDnaPresent === false
                    && audit.readabilityLoaded
                    && audit.futureSectionPresent;
                  results.push(audit);
                  await page.screenshot({
                    path: `layout-audit-artifacts/${audit.case}.png`,
                    fullPage: true,
                  });
                  await context.close();
                }
              }
            } finally {
              await browser.close();
            }

            const report = {
              status: results.every((item) => item.pass) ? 'PASS' : 'FAIL',
              generatedAt: new Date().toISOString(),
              cases: results,
            };
            fs.writeFileSync('layout-audit-result.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
            process.exit(report.status === 'PASS' ? 0 : 1);
          })().catch((error) => {
            fs.writeFileSync('layout-audit-result.json', JSON.stringify({ status: 'ERROR', error: String(error) }, null, 2) + '\n');
            console.error(error);
            process.exit(1);
          });
          NODE
          audit_status=$?
          echo "AUDIT_STATUS=$audit_status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload layout screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-layout-readability-audit
          path: |
            layout-audit-result.json
            layout-audit-artifacts/*.png
          if-no-files-found: error

      - name: Persist layout audit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin master
          mkdir -p .github/audit
          cp layout-audit-result.json .github/audit/layout-readability-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/audit/layout-readability-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FormatX layout readability audit'
            git push origin HEAD:master
          fi

      - name: Fail on visual layout defects
        if: always()
        shell: bash
        run: |
          test "${AUDIT_STATUS:-1}" = '0'
