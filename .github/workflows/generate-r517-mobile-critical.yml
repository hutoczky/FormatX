name: Generate R517 mobile critical bundle
run-name: Generate R517 cascade-preserving mobile critical bundle

on:
  push:
    branches: [p0-r517-mobile-critical]
    paths:
      - '.github/workflows/generate-r517-mobile-critical.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p0-r517-mobile-critical
      - name: Build deterministic bundle from canonical source order
        shell: bash
        run: |
          set -Eeuo pipefail
          out='docs/scifi-ui/styles/formatx-mobile-critical-r517.css'
          sources=(
            'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
            'docs/scifi-ui/styles/formatx-flow-first-r74.css'
            'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
            'docs/scifi-ui/styles/formatx-mobile-proof-controls-r204.css'
            'docs/scifi-ui/styles/formatx-mobile-layout-r207.css'
            'docs/scifi-ui/styles/formatx-native-orb-reference-r250.css'
          )
          {
            echo '/* FormatX R517 — generated cascade-preserving mobile critical bundle.'
            echo '   Canonical source files remain authoritative; do not edit this file by hand. */'
            echo
            for src in "${sources[@]}"; do
              base="$(basename "$src")"
              echo "/* ===== BEGIN $base ===== */"
              cat "$src"
              echo
              echo "/* ===== END $base ===== */"
              echo
            done
          } > "$out"
          test -s "$out"
          git diff --check -- "$out"
          git status --short
      - name: Commit generated bundle once
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-mobile-critical-r517.css
          if git diff --cached --quiet; then
            echo 'Bundle already current.'
            exit 0
          fi
          git commit -m 'Generate R517 mobile critical bundle'
          git push origin HEAD:p0-r517-mobile-critical
