name: Generate and validate R517 mobile critical candidate
run-name: R517 generated mobile critical bundle + 5x Lighthouse candidate proof

on:
  push:
    branches: [p0-r517-mobile-critical]
    paths:
      - 'billing-worker/src/production-content-entry-r517.js'
      - 'billing-worker/wrangler.jsonc'
      - 'docs/scifi-ui/styles/formatx-mobile-critical-r517.css'
      - '.github/workflows/generate-r517-mobile-critical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p0-r517-mobile-critical
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Verify deterministic bundle from canonical source order
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/expected-r517.css"
          sources=(
            'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
            'docs/scifi-ui/styles/formatx-flow-first-r74.css'
            'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
            'docs/scifi-ui/styles/formatx-mobile-proof-controls-r204.css'
            'docs/scifi-ui/styles/formatx-mobile-layout-r207.css'
            'docs/scifi-ui/styles/formatx-native-orb-reference-r250.css'
          )
          {
            echo '/* FormatX R517 — generated cascade-preserving mobile critical bundle.'
            echo '   Canonical source files remain authoritative; do not edit this file by hand. */'
            echo
            for src in "${sources[@]}"; do
              base="$(basename "$src")"
              echo "/* ===== BEGIN $base ===== */"
              cat "$src"
              echo
              echo "/* ===== END $base ===== */"
              echo
            done
          } > "$out"
          cmp -s "$out" docs/scifi-ui/styles/formatx-mobile-critical-r517.css
          node --input-type=module --check < billing-worker/src/production-content-entry-r517.js
          echo R517_BUNDLE_EXACT

      - name: Install local Worker and real audit tools
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix billing-worker --no-audit --prefer-offline
          npm install --no-save --no-package-lock lighthouse@13.4.1 playwright-core@1.62.0 >/dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
          npx lighthouse@13.4.1 --version

      - name: Build local-only candidate config
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const source=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete source.ai;
          delete source.routes;
          source.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r517-candidate.json',JSON.stringify(source,null,2)+'\n');
          NODE

      - name: Start exact candidate Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          cd billing-worker
          nohup npx wrangler dev --config wrangler.r517-candidate.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r517-wrangler.log" 2>&1 &
          cd ..
          for attempt in $(seq 1 60); do
            if curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1; then
              echo R517_LOCAL_WORKER_READY
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/r517-wrangler.log" || true
          exit 1

      - name: Prove real mobile browser geometry and CLS
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-mobile-critical
          node <<'NODE' | tee artifacts/r517-mobile-critical/browser-smoke.txt
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--headless=new','--no-sandbox','--ignore-certificate-errors','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2,locale:'hu-HU',reducedMotion:'no-preference',ignoreHTTPSErrors:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(m.text()))errors.push(m.text())});
            await page.addInitScript(()=>{
              window.__r517cls={total:0,entries:[]};
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput){window.__r517cls.total+=e.value;window.__r517cls.entries.push({value:e.value,startTime:e.startTime,sources:(e.sources||[]).map(s=>({node:s.node?.className||s.node?.id||s.node?.tagName||'',previousRect:s.previousRect,currentRect:s.currentRect}))})}}).observe({type:'layout-shift',buffered:true})}catch{}
            });
            const response=await page.goto('https://formatxsuite.com:8787/',{waitUntil:'domcontentloaded',timeout:60000});
            assert.equal(response.status(),200);
            await page.waitForTimeout(2500);
            const state=await page.evaluate(()=>{
              const bundle=[...document.querySelectorAll('link[rel="stylesheet"]')].filter(l=>l.href.includes('formatx-mobile-critical-r517.css'));
              const old=['formatx-mobile-reference-layout-v1.css','formatx-flow-first-r74.css','formatx-responsive-text-guard-r72.css','formatx-mobile-proof-controls-r204.css','formatx-mobile-layout-r207.css','formatx-native-orb-reference-r250.css'];
              const oldLinks=[...document.querySelectorAll('link[rel="stylesheet"]')].filter(l=>old.some(x=>l.href.includes(x)));
              const hero=document.querySelector('#hero .fx-category-definition');
              const hs=hero?getComputedStyle(hero):null;
              return {bundleCount:bundle.length,bundleMedia:bundle[0]?.media||'',bundleMatches:bundle[0]?matchMedia(bundle[0].media).matches:false,nativeOrbOwner:Boolean(bundle[0]?.dataset.fxNativeOrbReferenceR250),oldCount:oldLinks.length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,heroVisible:Boolean(hero&&hs&&hs.display!=='none'&&hs.visibility!=='hidden'&&Number(hs.opacity)>.2&&hero.getBoundingClientRect().height>40),cls:window.__r517cls};
            });
            console.log(JSON.stringify(state,null,2));
            assert.equal(state.bundleCount,1);
            assert.equal(state.bundleMatches,true);
            assert.equal(state.nativeOrbOwner,true);
            assert.equal(state.oldCount,0);
            assert.ok(state.overflow<=2,`overflow ${state.overflow}`);
            assert.equal(state.heroVisible,true);
            assert.ok(state.cls.total<0.05,`CLS ${state.cls.total}`);
            assert.equal(errors.length,0,errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Run five consecutive real mobile Lighthouse 13 audits
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-mobile-critical/lighthouse
          for i in 1 2 3 4 5; do
            echo "R517 mobile Lighthouse run $i/5"
            npx lighthouse@13.4.1 'https://formatxsuite.com:8787/' \
              --output=json \
              --output-path="artifacts/r517-mobile-critical/lighthouse/run-$i.json" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless=new --no-sandbox --ignore-certificate-errors --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --max-wait-for-load=60000 \
              --quiet
          done

      - name: Validate five-run performance contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' | tee artifacts/r517-mobile-critical/lighthouse-summary.txt
          const fs=require('node:fs');
          const rows=[]; let failed=false;
          for(let i=1;i<=5;i++){
            const l=JSON.parse(fs.readFileSync(`artifacts/r517-mobile-critical/lighthouse/run-${i}.json`,'utf8'));
            const row={run:i,performance:Math.round(l.categories.performance.score*100),accessibility:Math.round(l.categories.accessibility.score*100),bestPractices:Math.round(l.categories['best-practices'].score*100),seo:Math.round(l.categories.seo.score*100),FCP:l.audits['first-contentful-paint'].numericValue,LCP:l.audits['largest-contentful-paint'].numericValue,SI:l.audits['speed-index'].numericValue,TBT:l.audits['total-blocking-time'].numericValue,CLS:l.audits['cumulative-layout-shift'].numericValue,TTFB:l.audits['server-response-time'].numericValue};
            rows.push(row);
            if(row.performance!==100||row.LCP>=2000||row.CLS>=0.05||row.TBT>150||row.TTFB>500)failed=true;
          }
          console.log(JSON.stringify(rows,null,2));
          fs.writeFileSync('artifacts/r517-mobile-critical/report.json',JSON.stringify({rows,failed},null,2));
          if(failed)process.exit(1);
          NODE

      - name: Show Worker log
        if: always()
        run: cat "$RUNNER_TEMP/r517-wrangler.log" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r517-mobile-critical-${{ github.sha }}
          path: artifacts/r517-mobile-critical/
          if-no-files-found: warn
          retention-days: 30
