name: R2102 real-user delayed pricing and QR correctness

on:
  push:
    branches:
      - feature/r2083-studio-cinema-reactive-mag
    paths:
      - 'docs/scifi-ui/scripts/living-architecture.js'
      - 'docs/scifi-ui/scripts/formatx-living-architecture-loader-r1985.js'
      - '.github/scripts/validate-r2102-commerce-hydration.cjs'
      - '.github/workflows/verify-r2102-commercial-idle.yml'
  pull_request:
    branches:
      - mag-r2059-native-focus-continuity-20261013
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2102-real-commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-commerce:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and original QR fallback contracts
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check docs/scifi-ui/scripts/formatx-living-architecture-loader-r1985.js
          node --check .github/scripts/validate-r2102-commerce-hydration.cjs
          node .github/scripts/validate-pricing-qr.cjs
      - name: Install actual Chromium for both viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/commerce" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/commerce/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start actual repository site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/commerce-http.log" 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat "$RUNNER_TEMP/commerce-http.log"
          exit 1
      - name: Verify live prices, changing currencies, links and language
        env:
          NODE_PATH: ${{ runner.temp }}/commerce/node_modules
        run: node .github/scripts/validate-r2102-commerce-hydration.cjs
      - name: Preserve observed actual price and language states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2102-real-currency-pricing-evidence
          path: artifacts/r2102-real-commerce-hydration/
          retention-days: 21
          if-no-files-found: warn
