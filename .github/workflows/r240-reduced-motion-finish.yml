name: r240 reduced-motion visual runtime finish

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: formatx-r240-reduced-motion-finish
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Move remaining visual-only runtimes into r239 motion template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/index.html')
          html = path.read_text(encoding='utf-8')

          template_open = '  <template id="fx-motion-runtime-r239" data-fx-motion-runtime-r239="true">\n'
          if template_open not in html:
              raise SystemExit('r239 motion template not found')

          targets = [
              '  <script defer src="./scripts/formatx-mobile-recovery.js?v=20260805-immersive-gate-2"></script>',
              '  <script defer data-fx-premium-finish src="./scripts/formatx-premium-finish.js?v=20260813-android-webgl-recovery-r71"></script>',
          ]

          moved = []
          for line in targets:
              if line in html:
                  html = html.replace(line + '\n', '', 1)
                  moved.append('    ' + line.lstrip())

          if moved:
              html = html.replace(template_open, template_open + '\n'.join(moved) + '\n', 1)
              path.write_text(html, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          for name in ['formatx-mobile-recovery.js', 'formatx-premium-finish.js']:
              if name not in final:
                  raise SystemExit(f'compatibility token missing: {name}')

          open_pos = final.index('id="fx-motion-runtime-r239"')
          close_pos = final.index('</template>', open_pos)
          template = final[open_pos:close_pos]
          for name in ['formatx-mobile-recovery.js', 'formatx-premium-finish.js']:
              if name not in template:
                  raise SystemExit(f'{name} is not inside the reduced-motion gate')

          print('PASS: r240 moved the remaining visual-only startup runtimes behind the motion gate.')
          PY

          if git diff --quiet -- docs/scifi-ui/index.html; then
            echo 'r240 already applied; no commit required.'
            exit 0
          fi

          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git commit -m 'r240 finish reduced-motion visual runtime gating'
          git push
