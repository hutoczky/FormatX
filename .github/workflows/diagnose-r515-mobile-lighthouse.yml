name: Diagnose R515 production mobile Lighthouse

on:
  push:
    branches: [p0-r515-mobile-diagnostic]
    paths: ['.github/workflows/diagnose-r515-mobile-lighthouse.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bd30cb24cde49d42594dce4c4a8a5eff58e26912
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify R515 live marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://formatxsuite.com/p0-validation-version.txt?mobile_diag=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/live-marker.txt"
            if cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-marker.txt"; then
              echo R515_EXACT_MARKER_LIVE
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Lighthouse only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock lighthouse@12.8.2
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run real production mobile Lighthouse x3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r515-mobile-diagnostic
          for i in 1 2 3; do
            ./node_modules/.bin/lighthouse "https://formatxsuite.com/?p0_mobile_diag=${GITHUB_RUN_ID}-$i" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="artifacts/r515-mobile-diagnostic/lhr-$i.json" \
              --quiet
          done
          node <<'NODE'
          const fs=require('node:fs');
          const rows=[];
          for(let i=1;i<=3;i++){
            const l=JSON.parse(fs.readFileSync(`artifacts/r515-mobile-diagnostic/lhr-${i}.json`,'utf8'));
            const lcpNode=l.audits['largest-contentful-paint-element']?.details?.items?.[0]?.items?.[0]?.node || l.audits['largest-contentful-paint-element']?.details?.items?.[0]?.node || null;
            rows.push({run:i,performance:Math.round(l.categories.performance.score*100),accessibility:Math.round(l.categories.accessibility.score*100),bestPractices:Math.round(l.categories['best-practices'].score*100),seo:Math.round(l.categories.seo.score*100),fcp:l.audits['first-contentful-paint'].numericValue,lcp:l.audits['largest-contentful-paint'].numericValue,speedIndex:l.audits['speed-index'].numericValue,tbt:l.audits['total-blocking-time'].numericValue,cls:l.audits['cumulative-layout-shift'].numericValue,ttfb:l.audits['server-response-time'].numericValue,lcpNode});
          }
          fs.writeFileSync('artifacts/r515-mobile-diagnostic/summary.json',JSON.stringify(rows,null,2)+'\n');
          console.log(JSON.stringify(rows,null,2));
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r515-mobile-diagnostic-${{ github.sha }}
          path: artifacts/r515-mobile-diagnostic
          retention-days: 30
