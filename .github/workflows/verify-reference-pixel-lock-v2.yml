name: Verify post-deploy reference pixel lock
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-reference-pixel-lock-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/ref2" && cd "$RUNNER_TEMP/ref2"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Capture current production at exact reference viewport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ref2"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});const c=await b.newContext({viewport:{width:432,height:713},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});const p=await c.newPage();p.on('pageerror',e=>console.log('[PAGEERROR]',e.message));await p.goto(`https://formatxsuite.com/?pixel_lock_post=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1',null,{timeout:20000});await p.waitForTimeout(600);const state=await p.evaluate(()=>{const r=document.documentElement,q=s=>document.querySelector(s)?.getBoundingClientRect(),c=document.querySelector('.fx-core-mobile-v55-canvas');const header=[...document.querySelectorAll('.topbar *')].map(el=>{const b=el.getBoundingClientRect(),t=(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,50);return{tag:el.tagName.toLowerCase(),class:el.className||'',text:t,x:+b.x.toFixed(2),y:+b.y.toFixed(2),w:+b.width.toFixed(2),h:+b.height.toFixed(2),display:getComputedStyle(el).display,vis:getComputedStyle(el).visibility};}).filter(x=>x.w>0&&x.h>0);return{renderer:r.dataset.fxCoreRenderer,v68:r.dataset.fxCoreMobileV68,layout:r.dataset.fxMobileReferenceLayout,canvas:q('.fx-core-mobile-v55-canvas'),heading:q('.fx-reference-heading'),proof:q('.fx-reference-proof'),rail:q('.fx-reference-rail'),brand:q('.topbar .brand'),logo:q('.topbar .brand>img'),menu:q('.topbar .menu-toggle'),energy:Number(window.FormatXCoreMobileV68?.energy||0),gl:Boolean(c?.getContext('webgl2')),header};});console.log('POST DEPLOY STATE',JSON.stringify(state));console.log('HEADER ELEMENTS',JSON.stringify(state.header));await p.screenshot({path:'reference-post-deploy.png',fullPage:false});await c.close();await b.close();assert.ok(fs.statSync('reference-post-deploy.png').size>10000);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: reference-post-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/ref2/reference-post-deploy.png
          retention-days: 14
