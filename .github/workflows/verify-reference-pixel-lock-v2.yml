name: Verify post-deploy reference composition
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-reference-pixel-lock-v2.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-deploy-capture:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium and Android reference font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ref2" && cd "$RUNNER_TEMP/ref2"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-roboto >/dev/null
      - name: Capture and verify production at the locked viewport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ref2"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:412,height:680},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await context.addInitScript(()=>{
              if(typeof window.DeviceOrientationEvent==='undefined'){
                class MockDeviceOrientationEvent extends Event{
                  constructor(type,init={}){super(type);this.alpha=Number(init.alpha||0);this.beta=Number(init.beta||0);this.gamma=Number(init.gamma||0);this.absolute=Boolean(init.absolute);}
                }
                Object.defineProperty(window,'DeviceOrientationEvent',{value:MockDeviceOrientationEvent,configurable:true});
              }
            });
            const page=await context.newPage();page.on('pageerror',e=>console.log('[PAGEERROR]',e.message));
            await page.goto(`https://formatxsuite.com/?post_deploy_reference=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const r=document.documentElement.dataset;
              return r.fxCoreMobileV69==='ready-v69'&&r.fxCoreReferenceTextureR130==='ready'&&r.fxCoreReferenceRepairR131==='applied'&&r.fxCoreReferenceArtifactRepairR138==='applied'&&r.fxCoreReferenceHeadingR138==='dom-visible-clean-reference'&&r.fxReferenceCopyR137==='ready'&&r.fxFlowFirstR75==='ready-r139'&&r.fxReferenceFinalizerR142==='ready'&&r.fxReferenceFinalizerR143==='ready'&&r.fxCoreGyroLoadR144==='ready'&&r.fxCoreMotionR144==='breathing-pointer-touch-gyro'&&String(r.fxCoreReal3dBootstrap||'').endsWith('r144');
            },null,{timeout:45000});
            await page.waitForTimeout(650);

            const beforeGyro=await page.evaluate(()=>({position:[...(window.FormatXCoreCinematic?.corePosition||[])],energy:Number(window.FormatXCoreMobileV69?.energy||0),gyroState:document.documentElement.dataset.fxCoreGyroState}));
            await page.evaluate(async()=>{
              const fire=(beta,gamma)=>window.dispatchEvent(new DeviceOrientationEvent('deviceorientation',{beta,gamma,alpha:0,absolute:false}));
              for(let i=0;i<9;i++){fire(45,0);await new Promise(r=>setTimeout(r,22));}
              for(let i=0;i<14;i++){fire(57,14);await new Promise(r=>setTimeout(r,26));}
            });
            await page.waitForTimeout(520);
            const afterGyro=await page.evaluate(()=>({position:[...(window.FormatXCoreCinematic?.corePosition||[])],energy:Number(window.FormatXCoreMobileV69?.energy||0),gyroState:document.documentElement.dataset.fxCoreGyroState,gyroInput:document.documentElement.dataset.fxCoreGyroInput,gyroVector:document.documentElement.dataset.fxCoreGyroVector,gyroPermission:document.documentElement.dataset.fxCoreGyroPermission}));

            const beforeTouch=await page.evaluate(()=>({energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])]}));
            await page.touchscreen.tap(150,300);await page.waitForTimeout(220);
            const state=await page.evaluate(()=>{
              const root=document.documentElement,q=s=>{const e=document.querySelector(s),b=e?.getBoundingClientRect();return b?{x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),opacity:getComputedStyle(e).opacity}:null;};
              const native=document.querySelector('.fx-core-mobile-v55-canvas'),gl=native?.getContext('webgl2')||native?.getContext('webgl'),heading=document.querySelector('.fx-reference-heading'),hs=heading?getComputedStyle(heading):null;
              const detail=document.querySelector('.fx-core-detail-r122'),chain=[];let n=detail?.parentElement;while(n&&n.id!=='hero'){chain.push({tag:n.tagName,cls:n.className,overflow:getComputedStyle(n).overflow,boxShadow:getComputedStyle(n).boxShadow,border:getComputedStyle(n).borderTopWidth});n=n.parentElement;}
              return{bootstrap:root.dataset.fxCoreReal3dBootstrap,texture:root.dataset.fxCoreReferenceTextureR130,repair:root.dataset.fxCoreReferenceRepairR131,artifactRepair:root.dataset.fxCoreReferenceArtifactRepairR138,headingSource:root.dataset.fxCoreReferenceHeadingR138,copy:root.dataset.fxReferenceCopyR137,flow:root.dataset.fxFlowFirstR75,finalizer142:root.dataset.fxReferenceFinalizerR142,finalizer143:root.dataset.fxReferenceFinalizerR143,gyroLoad:root.dataset.fxCoreGyroLoadR144,gyroMotion:root.dataset.fxCoreMotionR144,gyroState:root.dataset.fxCoreGyroState,facet:root.dataset.fxCoreFacetMode,detailFrame:root.dataset.fxCoreDetailFrame,detail:q('.fx-core-detail-r122'),brand:q('.topbar .brand'),logo:q('.topbar .brand>img'),mag:q('.fx-reference-mag-button'),lang:q('.fx-language-toggle'),menu:q('.fx-reference-menu-button'),rail:q('#hero .fx-reference-rail'),ask:q('#hero .fx-reference-ask'),pause:q('#hero .fx-reference-pause'),heading:q('.fx-reference-heading'),proof:q('.fx-reference-proof'),live:q('.fx-reference-liveos'),headingStyle:hs?{letterSpacing:hs.letterSpacing,fontSize:hs.fontSize}:null,chain,heroOverflow:getComputedStyle(document.getElementById('hero')).overflow,glError:gl?.getError(),renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])]};
            });
            const text=await page.evaluate(()=>{const p=document.querySelector('.fx-reference-proof p'),button=document.querySelector('.fx-reference-liveos'),bb=button?.getBoundingClientRect(),lines=[],glyphs=[];if(p&&bb){const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);let n;while((n=walker.nextNode()))for(let i=0;i<n.length;i++){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+1);for(const x of r.getClientRects())if(x.width>.1&&x.height>.1)glyphs.push({r:x,ch:n.data[i]})}const map=new Map();for(const g of glyphs){const k=Math.round(g.r.top);if(!map.has(k))map.set(k,{text:'',left:Infinity,right:-Infinity});const v=map.get(k);v.text+=g.ch;v.left=Math.min(v.left,g.r.left);v.right=Math.max(v.right,g.r.right)}for(const [y,v] of [...map].sort((a,b)=>a[0]-b[0]))lines.push({y,text:v.text,left:+v.left.toFixed(1),right:+v.right.toFixed(1)});return{lines,covered:glyphs.filter(g=>g.r.right>bb.left+.5&&g.r.left<bb.right-.5&&g.r.bottom>bb.top+.5&&g.r.top<bb.bottom-.5).length}}return{lines:[],covered:-1}});
            console.log('POST DEPLOY R144 FINAL',JSON.stringify({beforeGyro,afterGyro,beforeTouch,state,text}));

            await page.evaluate(()=>{document.documentElement.dataset.fxReferenceMotionPaused='true';dispatchEvent(new CustomEvent('formatx:referencepause',{detail:{paused:true,source:'r144-final'}}));});await page.waitForTimeout(80);
            const cdp=await context.newCDPSession(page),shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('reference-post-deploy-r144-final.png',Buffer.from(shot.data,'base64'));

            assert.ok(state.bootstrap.endsWith('r144'));assert.equal(state.texture,'ready');assert.equal(state.repair,'applied');assert.equal(state.artifactRepair,'applied');assert.equal(state.headingSource,'dom-visible-clean-reference');assert.equal(state.copy,'ready');assert.equal(state.flow,'ready-r139');assert.equal(state.finalizer142,'ready');assert.equal(state.finalizer143,'ready');assert.equal(state.gyroLoad,'ready');assert.equal(state.gyroMotion,'breathing-pointer-touch-gyro');assert.equal(state.facet,'reference-material-r138');assert.equal(state.detailFrame,'reference-material-r138');
            assert.ok(state.detail&&state.detail.h>=410&&state.detail.h<=414);assert.equal(state.heroOverflow,'visible');assert.ok(state.chain.length>=1);assert.ok(state.chain.every(v=>v.overflow==='visible'),JSON.stringify(state.chain));
            assert.ok(Math.abs(state.brand.x-18)<=1&&Math.abs(state.brand.y-19)<=1);assert.ok(Math.abs(state.logo.w-34)<=1);assert.ok(Math.abs(state.mag.x-228)<=1.5&&Math.abs(state.mag.y-16)<=1);assert.ok(Math.abs(state.lang.x-284)<=1.5&&Math.abs(state.lang.y-14)<=1);assert.ok(Math.abs(state.menu.x-337)<=1.5&&Math.abs(state.menu.y-8)<=1);assert.ok(Math.abs(state.rail.x-336.4)<=1.5&&Math.abs(state.rail.y-79)<=1.5);assert.ok(Math.abs(state.ask.w-48)<=1&&Math.abs(state.pause.w-48)<=1);assert.equal(state.heading.opacity,'1');assert.ok(Math.abs(state.heading.x-24.7)<=1.5&&Math.abs(state.heading.y-435.9)<=2);assert.equal(state.headingStyle.fontSize,'15px');assert.ok(Math.abs(parseFloat(state.headingStyle.letterSpacing)-1.95)<=.15);assert.ok(Math.abs(state.proof.x-24.7)<=1.5&&Math.abs(state.proof.y-478)<=3);
            assert.deepEqual(text.lines.map(v=>v.text),['A FormatX nem kér vak bizalmat: a kiadás, a','tesztek, a korlátozások és a biztonsági','modell külön, nyilvánosan ellenőrizhető.']);assert.equal(text.covered,0,JSON.stringify(text));assert.ok(Math.abs(text.lines[0].y-593)<=3,JSON.stringify(text));
            assert.equal(afterGyro.gyroState,'active',JSON.stringify(afterGyro));assert.ok(typeof afterGyro.gyroVector==='string'&&afterGyro.gyroVector!== '0.000,0.000',JSON.stringify(afterGyro));assert.notDeepEqual(afterGyro.position,beforeGyro.position,JSON.stringify({beforeGyro,afterGyro}));
            assert.equal(state.glError,0);assert.ok(state.renderMs<16.67);assert.ok(state.energy>beforeTouch.energy+.04,JSON.stringify({beforeTouch,state}));assert.notDeepEqual(state.position,beforeTouch.position);
            await context.close();await browser.close();assert.ok(fs.statSync('reference-post-deploy-r144-final.png').size>10000);console.log('PASS: r144 animated reference, touch interaction, mobile gyroscope parallax, geometry, WebGL and typography verified.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload production capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-post-deploy-r144-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ref2/reference-post-deploy-r144-final.png
          retention-days: 14
