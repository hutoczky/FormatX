name: Verify post-deploy reference composition
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-reference-pixel-lock-v2.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-deploy-capture:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ref2" && cd "$RUNNER_TEMP/ref2"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Capture and verify production at the locked viewport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ref2"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:412,height:680},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await context.newPage();page.on('pageerror',error=>console.log('[PAGEERROR]',error.message));
            await page.goto(`https://formatxsuite.com/?post_deploy_reference=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{const r=document.documentElement.dataset;return r.fxCoreMobileV69==='ready-v69'&&r.fxMobileReferenceLayout==='ready-v1'&&r.fxCoreReferenceTextureR130==='ready'&&r.fxCoreReferenceRepairR131==='applied'&&r.fxCoreReferenceHeadingR136==='bitmap-source'&&r.fxReferenceFinalR132==='ready'&&r.fxFlowFirstR75==='ready-r132'&&String(r.fxCoreReal3dBootstrap||'').endsWith('r136');},null,{timeout:45000});
            await page.waitForTimeout(500);
            const before=await page.evaluate(()=>({energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])]}));await page.touchscreen.tap(150,300);await page.waitForTimeout(180);
            const state=await page.evaluate(()=>{const root=document.documentElement,q=s=>{const b=document.querySelector(s)?.getBoundingClientRect();return b?{x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1)}:null;};const native=document.querySelector('.fx-core-mobile-v55-canvas'),gl=native?.getContext('webgl2')||native?.getContext('webgl'),detail=document.querySelector('.fx-core-detail-r122'),heading=document.querySelector('.fx-reference-heading'),proofText=document.querySelector('.fx-reference-proof p'),proofStyle=proofText?getComputedStyle(proofText):null;return{bootstrap:root.dataset.fxCoreReal3dBootstrap,renderer:root.dataset.fxCoreRenderer,r112:root.dataset.fxCoreR112,v69:root.dataset.fxCoreMobileV69,texture:root.dataset.fxCoreReferenceTextureR130,repair:root.dataset.fxCoreReferenceRepairR131,headingSource:root.dataset.fxCoreReferenceHeadingR136,final:root.dataset.fxReferenceFinalR132,flow:root.dataset.fxFlowFirstR75,detailLoad:root.dataset.fxCoreDetailLoadR122,facet:root.dataset.fxCoreFacetMode,detailFrame:root.dataset.fxCoreDetailFrame,detail:q('.fx-core-detail-r122'),detailTransform:detail?getComputedStyle(detail).transform:null,brand:q('.topbar .brand'),logo:q('.topbar .brand>img'),mag:q('.fx-reference-mag-button'),lang:q('.fx-language-toggle'),menu:q('.fx-reference-menu-button'),rail:q('#hero .fx-reference-rail'),ask:q('#hero .fx-reference-ask'),pause:q('#hero .fx-reference-pause'),heading:q('.fx-reference-heading'),headingOpacity:heading?getComputedStyle(heading).opacity:null,proof:q('.fx-reference-proof'),proofText:q('.fx-reference-proof p'),live:q('.fx-reference-liveos'),proofFont:proofStyle?{size:proofStyle.fontSize,lineHeight:proofStyle.lineHeight,letterSpacing:proofStyle.letterSpacing,paddingRight:proofStyle.paddingRight}:null,glError:gl?.getError(),renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])],referenceMagButtons:document.querySelectorAll('.fx-reference-mag-button').length,legacyCoreButtons:document.querySelectorAll('.fx-mobile-core-button,[data-fx-mobile-core-button]').length};});
            const textState=await page.evaluate(()=>{const copy=document.querySelector('#hero .fx-reference-proof p'),button=document.querySelector('#hero .fx-reference-liveos'),bb=button?.getBoundingClientRect(),glyphs=[],lines=new Set(),lineTexts=new Map();if(copy&&bb){const w=document.createTreeWalker(copy,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))for(let i=0;i<n.length;i++){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+1);for(const x of r.getClientRects())if(x.width>.1&&x.height>.1){glyphs.push(x);const key=Math.round(x.top);lines.add(key);lineTexts.set(key,(lineTexts.get(key)||'')+n.data[i]);}}}return{glyphs:glyphs.length,lines:lines.size,lineTexts:[...lineTexts.entries()].sort((a,b)=>a[0]-b[0]).map(v=>v[1]),covered:glyphs.filter(r=>r.right>bb.left+.5&&r.left<bb.right-.5&&r.bottom>bb.top+.5&&r.top<bb.bottom-.5).length,whiteSpace:copy?getComputedStyle(copy).whiteSpace:'missing',width:copy?getComputedStyle(copy).width:'missing',paddingRight:copy?getComputedStyle(copy).paddingRight:'missing'};});
            console.log('POST DEPLOY R136 FINAL',JSON.stringify({before,state,textState}));
            await page.evaluate(()=>{document.documentElement.dataset.fxReferenceMotionPaused='true';dispatchEvent(new CustomEvent('formatx:referencepause',{detail:{paused:true,source:'post-deploy-final-r136'}}));});await page.waitForTimeout(80);const cdp=await context.newCDPSession(page),shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('reference-post-deploy-r136-final.png',Buffer.from(shot.data,'base64'));
            assert.ok(state.bootstrap.endsWith('r136'),JSON.stringify(state));assert.equal(state.renderer,'single-webgl-luminous-crystal-r99');assert.equal(state.r112,'true-3d-mesh-glass-reactor');assert.equal(state.v69,'ready-v69');assert.equal(state.texture,'ready');assert.equal(state.repair,'applied');assert.equal(state.headingSource,'bitmap-source');assert.equal(state.final,'ready');assert.equal(state.flow,'ready-r132');assert.equal(state.detailLoad,'ready-r136');assert.equal(state.facet,'reference-material-r136');assert.equal(state.detailFrame,'reference-material-r136');assert.ok(state.detail&&state.detail.h>=410&&state.detail.h<=414,JSON.stringify(state));
            assert.ok(Math.abs(state.brand.x-18)<=1&&Math.abs(state.brand.y-19)<=1,JSON.stringify(state));assert.ok(Math.abs(state.logo.w-34)<=1,JSON.stringify(state));assert.ok(Math.abs(state.mag.x-228)<=1.5&&Math.abs(state.mag.y-16)<=1,JSON.stringify(state));assert.ok(Math.abs(state.lang.x-284)<=1.5&&Math.abs(state.lang.y-14)<=1,JSON.stringify(state));assert.ok(Math.abs(state.menu.x-337)<=1.5&&Math.abs(state.menu.y-8)<=1&&Math.abs(state.menu.h-52)<=1,JSON.stringify(state));
            assert.ok(Math.abs(state.rail.x-336.4)<=1.5&&Math.abs(state.rail.y-79)<=1.5,JSON.stringify(state));assert.ok(Math.abs(state.ask.w-48)<=1&&Math.abs(state.ask.h-48)<=1&&Math.abs(state.pause.w-48)<=1&&Math.abs(state.pause.h-48)<=1,JSON.stringify(state));assert.ok(Math.abs(state.pause.y-137)<=1.5,JSON.stringify(state));
            assert.ok(Math.abs(state.heading.x-24.7)<=1.5&&Math.abs(state.heading.y-437.9)<=3,JSON.stringify(state));assert.equal(state.headingOpacity,'0');assert.ok(Math.abs(state.proof.x-24.7)<=1.5&&Math.abs(state.proof.y-478)<=3,JSON.stringify(state));assert.equal(textState.whiteSpace,'normal');assert.equal(textState.paddingRight,'0px');assert.equal(textState.lines,3,JSON.stringify(textState));assert.equal(textState.covered,0,JSON.stringify(textState));assert.deepEqual(textState.lineTexts,['A FormatX nem kér vak bizalmat: a kiadás, a','tesztek, a korlátozások és a biztonsági','modell külön, nyilvánosan ellenőrizhető.']);
            assert.equal(state.glError,0);assert.ok(state.renderMs<16.67,JSON.stringify(state));assert.equal(state.referenceMagButtons,1);assert.equal(state.legacyCoreButtons,0);assert.ok(state.energy>before.energy+.04,JSON.stringify({before,state}));assert.notDeepEqual(state.position,before.position);
            await context.close();await browser.close();assert.ok(fs.statSync('reference-post-deploy-r136-final.png').size>10000);console.log('PASS: r136 full supplied reference pixels, exact HU proof wrap, repaired crystal and WebGL/touch contract verified.');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload production capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-post-deploy-r136-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ref2/reference-post-deploy-r136-final.png
          if-no-files-found: warn
          retention-days: 14
