name: Patch FormatX deploy trigger

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/patch-formatx-deploy-trigger.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Exclude generated validation status from production deploys
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy-formatx-custom-domain.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - 'docs/**'\n      - '.github/workflows/deploy-formatx-custom-domain.yml'"
          replacement = "      - 'docs/**'\n      - '!docs/scifi-ui/validation/**'\n      - '.github/workflows/deploy-formatx-custom-domain.yml'"
          if "!docs/scifi-ui/validation/**" not in text:
              if anchor not in text:
                  raise SystemExit('Deploy path-filter anchor not found')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate workflow patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F "- '!docs/scifi-ui/validation/**'" .github/workflows/deploy-formatx-custom-domain.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-formatx-deploy-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stop validation status from duplicating production deploys'
          git push origin HEAD:master
