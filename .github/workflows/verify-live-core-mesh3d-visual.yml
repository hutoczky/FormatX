name: Verify live true 3D MAG visual
run-name: Capture uploaded-reference MAG v30 for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture and measure live reference-lock v30
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs');

          function metrics(file, region) {
            const png = PNG.sync.read(fs.readFileSync(file));
            const x0=Math.max(0,region.x0),y0=Math.max(0,region.y0),x1=Math.min(png.width,region.x1),y1=Math.min(png.height,region.y1);
            let pixels=0,lum=0,bright=0,saturated=0,spectral=0,minX=x1,minY=y1,maxX=x0,maxY=y0,spectralPixels=0;
            for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
              const o=(y*png.width+x)<<2,r=png.data[o]/255,g=png.data[o+1]/255,b=png.data[o+2]/255;
              const l=.2126*r+.7152*g+.0722*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;
              const cv=(b>r*1.14&&g>r*1.03&&l>.055)||(b>g*1.07&&r>g*.66&&l>.055);
              pixels++;lum+=l;if(l>.34)bright++;if(s>.42&&l>.055)saturated++;if(cv)spectral++;
              if(cv&&s>.38&&l>.075){spectralPixels++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
            }
            const bounds=spectralPixels?{x:minX,y:minY,width:maxX-minX+1,height:maxY-minY+1,centerX:(minX+maxX)/2,centerY:(minY+maxY)/2}:null;
            return {pixels,mean_luminance:lum/pixels,bright_fraction:bright/pixels,saturated_fraction:saturated/pixels,cyan_violet_fraction:spectral/pixels,spectral_pixels:spectralPixels,bounds};
          }

          function knownNoise(text){return /static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(text)&&/Content Security Policy|script-src/i.test(text);}

          async function waitForRenderer(page) {
            await page.waitForFunction(() => {
              const root=document.documentElement;
              const ref=root.dataset.fxCoreReferenceLock||'';
              const real=root.dataset.fxCoreReal3d||'';
              return ref==='ready-v30' || ref.startsWith('fallback-') || ref==='load-failed' || ['shader-failed','context-unavailable','webgl2-unavailable','context-lost','geometry-failed'].includes(real);
            }, null, {timeout:60000});
            const diagnostic=await page.evaluate(()=>({
              reference:document.documentElement.dataset.fxCoreReferenceLock||null,
              referenceLoad:document.documentElement.dataset.fxCoreReferenceLockLoad||null,
              real3d:document.documentElement.dataset.fxCoreReal3d||null,
              error:document.documentElement.dataset.fxCoreReal3dError||null,
              scripts:[...document.scripts].map(s=>s.src).filter(src=>src.includes('reference-lock-v30')),
              styles:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href).filter(src=>src.includes('reference-lock-v30'))
            }));
            console.log('V30_STARTUP_DIAGNOSTIC',JSON.stringify(diagnostic));
            if(diagnostic.reference!=='ready-v30') throw new Error(`v30 renderer startup failed: ${JSON.stringify(diagnostic)}`);
          }

          async function capture(browser,cfg){
            const context=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:1,isMobile:cfg.mobile,hasTouch:cfg.mobile,locale:'hu-HU'});
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!knownNoise(m.text()))errors.push(m.text());});
            await page.goto(`https://www.formatxsuite.com/?reference_v30=${process.env.RUN_ID}&capture=${cfg.name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.evaluate(()=>{document.documentElement.lang='hu';document.documentElement.classList.add('fx-intro-complete');document.getElementById('formatx-event-horizon')?.remove();scrollTo(0,0);});
            await waitForRenderer(page);
            await page.waitForFunction(()=>document.querySelector('.fx-core-real3d-canvas') instanceof HTMLCanvasElement,null,{timeout:10000});
            await page.waitForTimeout(1800);
            const runtime=await page.evaluate(()=>{
              const root=document.documentElement,canvas=document.querySelector('.fx-core-real3d-canvas'),stage=document.querySelector('.fx-core-real3d-stage'),rect=canvas?.getBoundingClientRect();
              let webgl2=false;try{webgl2=Boolean(canvas?.getContext('webgl2'));}catch(_){}
              return {reference:root.dataset.fxCoreReferenceLock,referenceRevision:root.dataset.fxCoreReferenceRevision,framing:root.dataset.fxCoreReferenceFraming,material:root.dataset.fxCoreReferenceMaterial,visual:root.dataset.fxCoreVisualRevision,geometry:root.dataset.fxCoreGeometry,reactor:root.dataset.fxCoreInternalReactor,orbits:root.dataset.fxCoreSpectralOrbits,performance:root.dataset.fxCorePerformance,imageBacked:root.dataset.fxCoreImageBacked,webgl2,stageActive:stage?.dataset.active,canvas:rect?{x:rect.x,y:rect.y,width:rect.width,height:rect.height}:null,stages:document.querySelectorAll('.fx-core-real3d-stage').length,v26Stages:document.querySelectorAll('.fx-reference-core-v26-stage').length,oldMeshStages:document.querySelectorAll('.fx-core-mesh3d-stage').length,oldFractureStages:document.querySelectorAll('.fx-core-fracture3d-stage').length};
            });
            const file=`reference-lock-v30-${cfg.name}.png`;await page.screenshot({path:file,fullPage:false});const visual=metrics(file,cfg.region);
            fs.writeFileSync(`reference-lock-v30-${cfg.name}.json`,JSON.stringify({runtime,visual,errors},null,2));
            await context.close();
            const coverage=.97;
            const runtimeOk=runtime.reference==='ready-v30'&&runtime.referenceRevision==='uploaded-reference-20260810'&&runtime.framing==='mobile-core-center-40pct-shell-height-75pct'&&runtime.material==='dense-luminous-glass-filaments-v30'&&runtime.visual==='v30-reference-lock'&&runtime.geometry==='concave-four-sail-indexed-mesh-v30'&&runtime.reactor==='moving-white-core-four-rings-v30'&&runtime.orbits==='cyan-violet-3d-v30'&&runtime.performance==='adaptive-60-plus-fps'&&runtime.imageBacked==='false'&&runtime.webgl2&&runtime.stageActive==='true'&&runtime.stages===1&&runtime.v26Stages===0&&runtime.oldMeshStages===0&&runtime.oldFractureStages===0&&runtime.canvas?.width>=cfg.viewport.width*coverage&&runtime.canvas?.height>=cfg.viewport.height*coverage;
            const b=visual.bounds;
            const visualOk=visual.mean_luminance>=.018&&visual.mean_luminance<=.52&&visual.bright_fraction>=.001&&visual.saturated_fraction>=.012&&visual.cyan_violet_fraction>=.009&&b&&b.width>=cfg.minWidth&&b.height>=cfg.minHeight&&b.centerY>=cfg.centerYMin&&b.centerY<=cfg.centerYMax;
            if(!runtimeOk||!visualOk||errors.length)throw new Error(`${cfg.name} v30 visual gate failed: ${JSON.stringify({runtime,visual,errors,coverage})}`);
            return {runtime,visual};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const mobile=await capture(browser,{name:'mobile',mobile:true,viewport:{width:753,height:1536},region:{x0:15,y0:0,x1:738,y1:1240},minWidth:460,minHeight:650,centerYMin:430,centerYMax:780});
            const desktop=await capture(browser,{name:'desktop',mobile:false,viewport:{width:1440,height:1000},region:{x0:560,y0:40,x1:1430,y1:960},minWidth:380,minHeight:360,centerYMin:230,centerYMax:720});
            fs.writeFileSync('reference-lock-v30-summary.json',JSON.stringify({mobile,desktop},null,2));
            console.log('V30_REFERENCE_EVIDENCE',JSON.stringify({mobile,desktop}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Upload v30 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reference-lock-v30-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/reference-lock-v30-mobile.png
            ${{ runner.temp }}/mag-visual/reference-lock-v30-desktop.png
            ${{ runner.temp }}/mag-visual/reference-lock-v30-mobile.json
            ${{ runner.temp }}/mag-visual/reference-lock-v30-desktop.json
            ${{ runner.temp }}/mag-visual/reference-lock-v30-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Stable uploaded-reference WebGL2 MAG v30 r2 passed live mobile and desktop visual gates'; else state=failure; description='Uploaded-reference MAG v30 r2 failed live visual gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
