name: Verify live true 3D MAG visual
run-name: Capture reference crystal v51 for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture and validate live v51 reference crystal
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs');

          function visualPresence(file) {
            const png = PNG.sync.read(fs.readFileSync(file));
            let bright = 0, spectral = 0;
            let minX = png.width, minY = png.height, maxX = -1, maxY = -1;
            const spectralPoints = [];
            for (let y = 0; y < png.height; y += 1) {
              for (let x = 0; x < png.width; x += 1) {
                const o = (y * png.width + x) << 2;
                const r = png.data[o] / 255;
                const g = png.data[o + 1] / 255;
                const b = png.data[o + 2] / 255;
                const a = png.data[o + 3] / 255;
                const l = .2126 * r + .7152 * g + .0722 * b;
                if (a > .04 && l > .30) bright += 1;
                const cyan = b > r * 1.06 && g > r * 1.01 && l > .055;
                const violet = b > g * 1.035 && r > g * .60 && l > .055;
                if (a > .035 && (cyan || violet)) {
                  spectral += 1;
                  minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                  minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                  if ((spectral & 31) === 0) spectralPoints.push([x, y]);
                }
              }
            }
            const total = png.width * png.height;
            const bounds = spectral > 40 ? {
              x: minX, y: minY,
              width: maxX - minX + 1,
              height: maxY - minY + 1,
              centerX: (minX + maxX) / 2,
              centerY: (minY + maxY) / 2
            } : null;
            let tips = null;
            if (bounds) {
              const cx = bounds.centerX, cy = bounds.centerY;
              const hw = bounds.width / 2, hh = bounds.height / 2;
              const counts = { left: 0, right: 0, top: 0, bottom: 0, center: 0 };
              for (const [x, y] of spectralPoints) {
                const nx = (x - cx) / Math.max(1, hw);
                const ny = (y - cy) / Math.max(1, hh);
                if (nx < -.72 && Math.abs(ny) < .42) counts.left += 1;
                if (nx > .72 && Math.abs(ny) < .42) counts.right += 1;
                if (ny < -.72 && Math.abs(nx) < .42) counts.top += 1;
                if (ny > .72 && Math.abs(nx) < .42) counts.bottom += 1;
                if (Math.abs(nx) < .25 && Math.abs(ny) < .25) counts.center += 1;
              }
              tips = counts;
            }
            return {
              width: png.width,
              height: png.height,
              brightFraction: bright / Math.max(1, total),
              spectralFraction: spectral / Math.max(1, total),
              bounds,
              tips
            };
          }

          async function capture(browser, cfg) {
            const context = await browser.newContext({
              viewport: cfg.viewport,
              deviceScaleFactor: 1,
              isMobile: cfg.mobile,
              hasTouch: cfg.mobile,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            await page.goto(`https://www.formatxsuite.com/?core_v51_visual=${process.env.RUN_ID}&capture=${cfg.name}`, {
              waitUntil: 'domcontentloaded', timeout: 60000
            });
            await page.evaluate(() => {
              const root = document.documentElement;
              root.lang = 'hu';
              root.classList.remove('fx-intro-pending', 'fx-intro-running', 'fx-intro-managed');
              root.classList.add('fx-intro-complete');
              document.getElementById('formatx-event-horizon')?.setAttribute('hidden', '');
              document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
              scrollTo(0, 0);
            });

            await page.waitForFunction(() => document.documentElement.dataset.fxCoreV51 === 'ready-v51', null, { timeout: 60000 });
            await page.waitForTimeout(1800);

            const runtime = await page.evaluate(() => {
              const root = document.documentElement;
              const stage = document.querySelector('.fx-core-v51-stage');
              const canvas = document.querySelector('.fx-core-v51-canvas');
              const heroSpace = document.querySelector('#hero .hero-space');
              const rect = canvas?.getBoundingClientRect();
              const heroRect = heroSpace?.getBoundingClientRect();
              const style = stage ? getComputedStyle(stage) : null;
              const loadedCoreScripts = [...document.scripts].map(s => s.src).filter(src => /formatx-core-v5[01]\.js/.test(src));
              const legacyScripts = [...document.scripts]
                .map(s => s.src)
                .filter(src => /reference-lock-v30|mobile-mag-v33|mag-reference-v4[1467]/.test(src));
              const clippedHero = heroRect ? {
                x: Math.max(0, heroRect.left),
                y: Math.max(0, heroRect.top),
                width: Math.max(1, Math.min(innerWidth, heroRect.right) - Math.max(0, heroRect.left)),
                height: Math.max(1, Math.min(innerHeight, heroRect.bottom) - Math.max(0, heroRect.top))
              } : null;
              return {
                core: root.dataset.fxCoreV51,
                renderer: root.dataset.fxCoreRenderer,
                geometry: root.dataset.fxCoreReferenceGeometry,
                material: root.dataset.fxCoreReferenceMaterial,
                reactor: root.dataset.fxCoreInternalReactor,
                responsive: root.dataset.fxCoreResponsive,
                performance: root.dataset.fxCorePerformance,
                imageBacked: root.dataset.fxCoreImageBacked,
                depth: root.dataset.fxCoreDepth || null,
                stageActive: stage?.dataset.active || null,
                stages: document.querySelectorAll('.fx-core-v51-stage').length,
                canvases: document.querySelectorAll('.fx-core-v51-canvas').length,
                canvas: rect ? { width: rect.width, height: rect.height } : null,
                heroSpace: clippedHero,
                viewport: { width: innerWidth, height: innerHeight },
                pointerEvents: style?.pointerEvents || null,
                overflow: style?.overflow || null,
                loadedCoreScripts,
                legacyScripts
              };
            });

            assert.equal(runtime.core, 'ready-v51');
            assert.equal(runtime.renderer, 'single-webgl2-reference-crystal-v51');
            assert.equal(runtime.geometry, 'sharp-four-tip-concave-crystal-v51');
            assert.equal(runtime.material, 'layered-faceted-refractive-glass-v51');
            assert.equal(runtime.reactor, 'moving-white-nucleus-concentric-spectral-rings-v51');
            assert.equal(runtime.responsive, 'desktop-mobile-reference-framing-v51');
            assert.equal(runtime.performance, 'single-context-adaptive-60-plus-fps');
            assert.equal(runtime.imageBacked, 'false');
            assert.equal(runtime.depth, 'closed-volumetric-shell-with-sidewalls');
            assert.equal(runtime.stageActive, 'true');
            assert.equal(runtime.stages, 1);
            assert.equal(runtime.canvases, 1);
            assert.equal(runtime.loadedCoreScripts.filter(src => /formatx-core-v51\.js/.test(src)).length, 1);
            assert.equal(runtime.loadedCoreScripts.filter(src => /formatx-core-v50\.js/.test(src)).length, 0, 'v50 rounded core must not load');
            assert.deepEqual(runtime.legacyScripts, [], 'legacy multi-renderer MAG scripts must not load');
            assert.equal(runtime.pointerEvents, 'none', 'MAG must never capture pointer/touch input');
            assert.equal(runtime.overflow, 'hidden', 'MAG stage must clip accidental viewport overflow');
            assert.ok(runtime.canvas.width <= runtime.viewport.width + 1, 'canvas must not overflow viewport width');
            assert.ok(runtime.canvas.height <= runtime.viewport.height + 1, 'canvas must not overflow viewport height');
            assert.ok(runtime.heroSpace && runtime.heroSpace.width > 120 && runtime.heroSpace.height > 120, 'hero visual ROI must exist');

            const file = `core-v51-${cfg.name}.png`;
            await page.screenshot({ path: file, clip: runtime.heroSpace });
            const visual = visualPresence(file);
            assert.ok(visual.brightFraction > .00035, 'visible luminous nucleus/glass expected');
            assert.ok(visual.spectralFraction > .0018, 'visible cyan/violet crystal detail expected');
            assert.ok(visual.bounds, 'spectral crystal bounds expected');
            assert.ok(visual.bounds.width < visual.width * .98, 'crystal must stay bounded horizontally inside hero visual ROI');
            assert.ok(visual.bounds.height < visual.height * .96, 'crystal must stay bounded vertically inside hero visual ROI');
            assert.ok(visual.tips && visual.tips.left > 0, 'left crystal tip must be visible');
            assert.ok(visual.tips && visual.tips.right > 0, 'right crystal tip must be visible');
            assert.ok(visual.tips && visual.tips.top > 0, 'top crystal tip must be visible');
            assert.ok(visual.tips && visual.tips.bottom > 0, 'bottom crystal tip must be visible');
            assert.ok(visual.tips && visual.tips.center > 0, 'luminous central reactor must be visible');

            fs.writeFileSync(`core-v51-${cfg.name}.json`, JSON.stringify({ runtime, visual, errors }, null, 2));
            if (errors.length) throw new Error(`${cfg.name} page errors: ${errors.join(' | ')}`);
            await context.close();
            return { runtime, visual };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader']
            });
            const mobile = await capture(browser, { name: 'mobile', mobile: true, viewport: { width: 390, height: 844 } });
            const desktop = await capture(browser, { name: 'desktop', mobile: false, viewport: { width: 1440, height: 1000 } });
            fs.writeFileSync('core-v51-summary.json', JSON.stringify({ version: 'v51-reference-crystal-core', mobile, desktop }, null, 2));
            console.log('V51_LIVE_VISUAL_EVIDENCE', JSON.stringify({ mobile, desktop }));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload v51 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reference-crystal-v51-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/core-v51-mobile.png
            ${{ runner.temp }}/mag-visual/core-v51-desktop.png
            ${{ runner.temp }}/mag-visual/core-v51-mobile.json
            ${{ runner.temp }}/mag-visual/core-v51-desktop.json
            ${{ runner.temp }}/mag-visual/core-v51-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Reference crystal WebGL2 MAG v51 passed live mobile and desktop volumetric visual gates'; else state=failure; description='Reference crystal MAG v51 failed live visual gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
