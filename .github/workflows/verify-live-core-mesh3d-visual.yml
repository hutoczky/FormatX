name: Verify live true 3D MAG visual
run-name: Capture rounded living core v50 for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture and validate live rounded v50 MAG
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs');

          function visualPresence(file) {
            const png = PNG.sync.read(fs.readFileSync(file));
            let total = 0, bright = 0, spectral = 0;
            for (let y = 0; y < png.height; y += 1) {
              for (let x = 0; x < png.width; x += 1) {
                const o = (y * png.width + x) << 2;
                const r = png.data[o] / 255;
                const g = png.data[o + 1] / 255;
                const b = png.data[o + 2] / 255;
                const a = png.data[o + 3] / 255;
                const l = .2126 * r + .7152 * g + .0722 * b;
                total += 1;
                if (a > .04 && l > .28) bright += 1;
                const cyan = b > r * 1.08 && g > r * 1.02 && l > .055;
                const violet = b > g * 1.04 && r > g * .62 && l > .055;
                if (a > .035 && (cyan || violet)) spectral += 1;
              }
            }
            return {
              width: png.width,
              height: png.height,
              brightFraction: bright / Math.max(1, total),
              spectralFraction: spectral / Math.max(1, total)
            };
          }

          async function capture(browser, cfg) {
            const context = await browser.newContext({
              viewport: cfg.viewport,
              deviceScaleFactor: 1,
              isMobile: cfg.mobile,
              hasTouch: cfg.mobile,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            await page.goto(`https://www.formatxsuite.com/?core_v50_visual=${process.env.RUN_ID}&capture=${cfg.name}`, {
              waitUntil: 'domcontentloaded', timeout: 60000
            });
            await page.evaluate(() => {
              const root = document.documentElement;
              root.lang = 'hu';
              root.classList.remove('fx-intro-pending', 'fx-intro-running', 'fx-intro-managed');
              root.classList.add('fx-intro-complete');
              document.getElementById('formatx-event-horizon')?.setAttribute('hidden', '');
              document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
              scrollTo(0, 0);
            });

            await page.waitForFunction(() => document.documentElement.dataset.fxCoreV50 === 'ready', null, { timeout: 60000 });
            await page.waitForTimeout(1600);

            const runtime = await page.evaluate(() => {
              const root = document.documentElement;
              const stage = document.querySelector('.fx-core-v50-stage');
              const canvas = document.querySelector('.fx-core-v50-canvas');
              const rect = canvas?.getBoundingClientRect();
              const style = stage ? getComputedStyle(stage) : null;
              const legacyScripts = [...document.scripts]
                .map(s => s.src)
                .filter(src => /reference-lock-v30|mobile-mag-v33|mag-reference-v4[1467]/.test(src));
              return {
                core: root.dataset.fxCoreV50,
                renderer: root.dataset.fxCoreRenderer,
                geometry: root.dataset.fxCoreReferenceGeometry,
                material: root.dataset.fxCoreReferenceMaterial,
                reactor: root.dataset.fxCoreInternalReactor,
                responsive: root.dataset.fxCoreResponsive,
                performance: root.dataset.fxCorePerformance,
                stageActive: stage?.dataset.active || null,
                stages: document.querySelectorAll('.fx-core-v50-stage').length,
                canvases: document.querySelectorAll('.fx-core-v50-canvas').length,
                canvas: rect ? { width: rect.width, height: rect.height } : null,
                viewport: { width: innerWidth, height: innerHeight },
                pointerEvents: style?.pointerEvents || null,
                overflow: style?.overflow || null,
                legacyScripts,
                legacyDiamondOverlay: Boolean(document.querySelector('.fx-v33-core-glass'))
              };
            });

            assert.equal(runtime.core, 'ready');
            assert.equal(runtime.renderer, 'single-webgl2-rounded-living-core-v50');
            assert.equal(runtime.geometry, 'rounded-organic-glass-orb-v50');
            assert.equal(runtime.material, 'transparent-layered-living-glass-v50');
            assert.equal(runtime.reactor, 'moving-internal-nucleus-spectral-orbits-v50');
            assert.equal(runtime.responsive, 'desktop-mobile-bounded-v50');
            assert.equal(runtime.performance, 'single-context-adaptive-60-plus-fps');
            assert.equal(runtime.stageActive, 'true');
            assert.equal(runtime.stages, 1);
            assert.equal(runtime.canvases, 1);
            assert.deepEqual(runtime.legacyScripts, [], 'legacy four-tip MAG scripts must not load');
            assert.equal(runtime.legacyDiamondOverlay, false, 'legacy diamond overlay must not exist');
            assert.equal(runtime.pointerEvents, 'none', 'MAG must never capture pointer/touch input');
            assert.equal(runtime.overflow, 'hidden', 'MAG stage must clip any accidental viewport overflow');
            assert.ok(runtime.canvas.width <= runtime.viewport.width + 1, 'canvas must not overflow viewport width');
            assert.ok(runtime.canvas.height <= runtime.viewport.height + 1, 'canvas must not overflow viewport height');

            const file = `core-v50-${cfg.name}.png`;
            await page.screenshot({ path: file, fullPage: false });
            const visual = visualPresence(file);
            assert.ok(visual.brightFraction > .0003, 'visible luminous content expected');
            assert.ok(visual.spectralFraction > .0015, 'visible cyan/violet content expected');

            fs.writeFileSync(`core-v50-${cfg.name}.json`, JSON.stringify({ runtime, visual, errors }, null, 2));
            if (errors.length) throw new Error(`${cfg.name} page errors: ${errors.join(' | ')}`);
            await context.close();
            return { runtime, visual };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader']
            });
            const mobile = await capture(browser, { name: 'mobile', mobile: true, viewport: { width: 390, height: 844 } });
            const desktop = await capture(browser, { name: 'desktop', mobile: false, viewport: { width: 1440, height: 1000 } });
            fs.writeFileSync('core-v50-summary.json', JSON.stringify({ version: 'v50-rounded-living-core', mobile, desktop }, null, 2));
            console.log('V50_LIVE_VISUAL_EVIDENCE', JSON.stringify({ mobile, desktop }));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload v50 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rounded-core-v50-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/core-v50-mobile.png
            ${{ runner.temp }}/mag-visual/core-v50-desktop.png
            ${{ runner.temp }}/mag-visual/core-v50-mobile.json
            ${{ runner.temp }}/mag-visual/core-v50-desktop.json
            ${{ runner.temp }}/mag-visual/core-v50-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Rounded living WebGL2 MAG v50 passed live mobile and desktop visual gates'; else state=failure; description='Rounded living MAG v50 failed live visual gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
