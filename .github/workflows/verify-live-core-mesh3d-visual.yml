name: Verify live responsive true 3D MAG
run-name: Validate production r317/r323 WebGL MAG and living pulse on desktop and mobile
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-core-mesh3d-visual.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mag:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-live" && cd "$RUNNER_TEMP/mag-live"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate live current MAG startup pulse visuals interaction and information integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-live"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const origin = 'https://formatxsuite.com';

          function diagnostics(page, label) {
            page.on('pageerror', error => console.log(`[${label} PAGEERROR]`, error.message));
            page.on('requestfailed', request => console.log(`[${label} REQUESTFAILED]`, request.url(), request.failure()?.errorText || ''));
          }

          async function pulseState(page) {
            return page.evaluate(() => {
              const root = document.documentElement;
              const stage = document.querySelector('#hero .fx-core-mobile-v55-stage,#hero .fx-core-r112-stage');
              if (!(stage instanceof HTMLElement)) return { marker: root.dataset.fxCorePulseR312 || '', exists: false };
              const style = getComputedStyle(stage);
              const pulse = stage.getAnimations().find(animation => {
                const frames = animation.effect?.getKeyframes?.() || [];
                return frames.some(frame => typeof frame.scale === 'string' && frame.scale.length > 0);
              });
              return {
                marker: root.dataset.fxCorePulseR312 || '',
                exists: true,
                animationName: style.animationName,
                animationDuration: style.animationDuration,
                playState: pulse?.playState || '',
                currentTime: Number(pulse?.currentTime || 0),
                playbackRate: Number(pulse?.playbackRate || 0),
                scale: style.scale
              };
            });
          }

          async function verify(browser, name, viewport, mobile, dpr) {
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: dpr,
              isMobile: mobile,
              hasTouch: mobile,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            diagnostics(page, name);

            const started = Date.now();
            await page.goto(`${origin}/?live_mag_current=${name}-${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            const domReadyMs = Date.now() - started;
            assert.ok(domReadyMs < 30000, `${name}: DOMContentLoaded exceeded startup budget: ${domReadyMs}ms`);

            const expected = 'ready-v1';
            await page.waitForFunction(expectedLayout => {
              const root = document.documentElement;
              return root.dataset.fxCoreMobileV69 === 'ready-v69'
                && root.dataset.fxCoreMobileR317 === 'ready-v69'
                && root.dataset.fxMobileReferenceLayout === expectedLayout
                && root.dataset.fxCoreRenderer === 'single-webgl-luminous-crystal-r99';
            }, expected, { timeout: 60000 });

            await page.waitForFunction(() => document.documentElement.dataset.fxCorePulseR312 === 'compositor-lub-dub', null, { timeout: 15000 });
            await page.waitForTimeout(180);
            const pulseBefore = await pulseState(page);
            await page.waitForTimeout(220);
            const pulseAfter = await pulseState(page);

            assert.equal(pulseBefore.marker, 'compositor-lub-dub', `${name}: compositor pulse stylesheet marker missing`);
            assert.equal(pulseBefore.exists, true, `${name}: MAG stage missing for pulse`);
            assert.match(pulseBefore.animationName, /fx-core-pulse-r312/, `${name}: living MAG animation not applied`);
            assert.equal(pulseBefore.playState, 'running', `${name}: living MAG pulse is not running`);
            assert.ok(pulseAfter.currentTime > pulseBefore.currentTime, `${name}: living MAG pulse clock is not advancing: ${JSON.stringify({pulseBefore,pulseAfter})}`);
            assert.ok(pulseAfter.playbackRate > 0, `${name}: living MAG pulse playback rate is not positive`);

            await page.waitForTimeout(600);
            const before = await page.evaluate(() => ({
              energy: Number(window.FormatXCoreMobileV69?.energy || 0),
              position: [...(window.FormatXCoreCinematic?.corePosition || [])]
            }));

            if (mobile) {
              await page.evaluate(() => window.dispatchEvent(new CustomEvent('formatx:coreinteraction', {
                detail: { x: .46, y: -.28, phase: 'drag' }
              })));
              await page.waitForTimeout(220);
            }

            const state = await page.evaluate(() => {
              const root = document.documentElement;
              const stage = document.querySelector('#hero .fx-core-r317-stage');
              const canvas = document.querySelector('#hero .fx-core-mobile-v55-canvas');
              const box = canvas?.getBoundingClientRect();
              const gl = canvas?.getContext('webgl2') || canvas?.getContext('webgl');
              const visible = element => {
                if (!element) return false;
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return rect.width > 1 && rect.height > 1 && style.display !== 'none'
                  && style.visibility !== 'hidden' && Number(style.opacity || 1) > .01;
              };
              const overlap = (a, b) => {
                if (!visible(a) || !visible(b)) return false;
                const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
                return Math.max(0, Math.min(x.right, y.right) - Math.max(x.left, y.left))
                  * Math.max(0, Math.min(x.bottom, y.bottom) - Math.max(x.top, y.top)) > 6;
              };
              const glyphOverlap = (textEl, control) => {
                if (!visible(textEl) || !visible(control)) return false;
                const c = control.getBoundingClientRect();
                const walker = document.createTreeWalker(textEl, NodeFilter.SHOW_TEXT);
                while (walker.nextNode()) {
                  const node = walker.currentNode;
                  if (!node.nodeValue?.trim()) continue;
                  const range = document.createRange();
                  range.selectNodeContents(node);
                  for (const r of range.getClientRects()) {
                    const area = Math.max(0, Math.min(r.right, c.right) - Math.max(r.left, c.left))
                      * Math.max(0, Math.min(r.bottom, c.bottom) - Math.max(r.top, c.top));
                    if (area > 2) return true;
                  }
                }
                return false;
              };
              const refProof = document.querySelector('#hero .fx-reference-proof');
              const award = document.querySelector('.fx-award-proof');
              const heroCopy = document.querySelector('#hero .hero-copy');
              const legacyMenu = document.querySelector('#menu-toggle.fx-organism-system-toggle');
              const refText = refProof?.querySelector('p');
              const live = refProof?.querySelector('.fx-reference-liveos');
              return {
                renderer: root.dataset.fxCoreRenderer,
                stageRenderer: stage?.dataset.renderer || '',
                r317: root.dataset.fxCoreMobileR317 || '',
                quality: root.dataset.fxCoreQualityR317 || '',
                scheduler: root.dataset.fxCoreSchedulerR317 || '',
                biolume: root.dataset.fxCoreBiolumeR323 || '',
                biolumeProfile: root.dataset.fxCoreBiolumeProfileR323 || '',
                v69: root.dataset.fxCoreMobileV69,
                layout: root.dataset.fxMobileReferenceLayout,
                composition: root.dataset.fxReferenceComposition,
                paused: root.dataset.fxReferenceMotionPaused,
                narrowProof: root.dataset.fxReferenceNarrowProofR145,
                bootstrap: root.dataset.fxMobileBootstrapR312 || '',
                pulse: root.dataset.fxCorePulseR312 || '',
                canvases: document.querySelectorAll('.fx-core-mobile-v55-canvas').length,
                gl: Boolean(gl),
                glError: gl?.getError(),
                width: box?.width || 0,
                energy: Number(window.FormatXCoreMobileV69?.energy || 0),
                position: [...(window.FormatXCoreCinematic?.corePosition || [])],
                renderMs: Number(root.dataset.fxCoreRenderMs || Infinity),
                referenceVisible: [...document.querySelectorAll('#hero .fx-reference-heading,#hero .fx-reference-proof,#hero .fx-reference-rail,.fx-reference-mag-button,.fx-reference-menu-button')].filter(visible).length,
                awardVisible: [...document.querySelectorAll('.fx-award-proof')].filter(visible).length,
                heroCopyVisible: visible(heroCopy),
                legacyMenuVisible: visible(legacyMenu),
                proofOverlap: overlap(refProof, award),
                liveTextOverlap: glyphOverlap(refText, live)
              };
            });

            console.log(name.toUpperCase(), JSON.stringify({ domReadyMs, pulseBefore, pulseAfter, before, state }));
            await page.screenshot({ path: `${name}-current.png`, fullPage: false, timeout: 120000, animations: 'disabled', caret: 'hide' });

            assert.equal(state.renderer, 'single-webgl-luminous-crystal-r99');
            assert.equal(state.stageRenderer, 'reference-r317-modern-crystal');
            assert.equal(state.r317, 'ready-v69');
            assert.equal(state.quality, 'modern-flat-normal-fresnel-microfacet');
            assert.equal(state.scheduler, 'bounded-interaction-bursts-no-idle-raf');
            assert.equal(state.v69, 'ready-v69');
            assert.equal(state.layout, expected);
            assert.equal(state.pulse, 'compositor-lub-dub');
            assert.equal(state.canvases, 1);
            assert.equal(state.gl, true);
            assert.equal(state.glError, 0);
            assert.ok(state.width <= viewport.width + 1 && state.renderMs < 16.67, JSON.stringify(state));
            assert.ok(state.awardVisible <= 1);
            assert.equal(state.proofOverlap, false);

            if (mobile) {
              assert.equal(state.biोलume || state.biolume, 'ready');
              assert.equal(state.biolumeProfile, 'deep-water-iridescent-traveling-rim');
              assert.equal(state.bootstrap, 'postdom-real3d-and-pulse');
              assert.equal(state.paused, 'false');
              assert.equal(state.narrowProof, 'ready');
              assert.ok(state.energy >= before.energy - .01, JSON.stringify({ before, state }));
              assert.notDeepEqual(state.position, before.position);
              assert.ok(state.referenceVisible >= 3);
              assert.equal(state.liveTextOverlap, false, JSON.stringify(state));
            } else {
              assert.ok(['desktop-skip',''].includes(state.biolume), JSON.stringify(state));
              assert.equal(state.composition, 'desktop-reference-r244');
              assert.ok(state.referenceVisible >= 2, JSON.stringify(state));
              assert.equal(state.heroCopyVisible, true);
            }

            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']
            });
            try {
              await verify(browser, 'desktop', { width: 1440, height: 960 }, false, 1);
              await verify(browser, 'mobile', { width: 390, height: 844 }, true, 2);
            } finally {
              await browser.close();
            }
            for (const file of ['desktop-current.png','mobile-current.png']) assert.ok(fs.statSync(file).size > 10000, file);
            console.log('PASS: live current r317/r323 desktop/mobile WebGL MAG, compositor pulse, interaction and information integrity passed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload live MAG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mag-current-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-live/desktop-current.png
            ${{ runner.temp }}/mag-live/mobile-current.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live MAG status
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live current r317/r323 desktop/mobile MAG and pulse passed'; else state=failure; description='Live current desktop/mobile MAG/pulse diagnostic failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live MAG r312' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
