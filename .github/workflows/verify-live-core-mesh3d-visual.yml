name: Verify live responsive true 3D MAG
run-name: Validate production v69 WebGL2 MAG on desktop and mobile
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-live" && cd "$RUNNER_TEMP/mag-live"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate live v69 MAG visuals animation interaction and information integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-live"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const {chromium}=require('playwright');const origin='https://formatxsuite.com';
          function diagnostics(page,label){page.on('pageerror',e=>console.log(`[${label} PAGEERROR]`,e.message));page.on('requestfailed',r=>console.log(`[${label} REQUESTFAILED]`,r.url(),r.failure()?.errorText||''));}
          async function verify(browser,name,viewport,mobile,dpr){
            const context=await browser.newContext({viewport,deviceScaleFactor:dpr,isMobile:mobile,hasTouch:mobile,locale:'hu-HU'}),page=await context.newPage();diagnostics(page,name);
            await page.goto(`${origin}/?live_mag=${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});const expected=mobile?'ready-v1':'desktop-skip';
            await page.waitForFunction(expected=>document.documentElement.dataset.fxCoreMobileV69==='ready-v69'&&document.documentElement.dataset.fxMobileReferenceLayout===expected,expected,{timeout:60000});await page.waitForTimeout(1000);
            const before=await page.evaluate(()=>({energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])]}));
            if(mobile)await page.touchscreen.tap(viewport.width/2,Math.min(340,viewport.height/2));else await page.mouse.click(viewport.width*.72,Math.min(420,viewport.height/2));await page.waitForTimeout(360);
            const state=await page.evaluate(()=>{const root=document.documentElement,canvas=document.querySelector('#hero .fx-core-mobile-v55-canvas'),box=canvas?.getBoundingClientRect();const visible=el=>{if(!el)return false;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.01};const overlap=(a,b)=>{if(!visible(a)||!visible(b))return false;const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();return Math.max(0,Math.min(x.right,y.right)-Math.max(x.left,y.left))*Math.max(0,Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top))>6};const refProof=document.querySelector('#hero .fx-reference-proof'),award=document.querySelector('.fx-award-proof'),heroCopy=document.querySelector('#hero .hero-copy'),legacyMenu=document.querySelector('#menu-toggle.fx-organism-system-toggle'),refText=refProof?.querySelector('p'),live=refProof?.querySelector('.fx-reference-liveos');return{renderer:root.dataset.fxCoreRenderer,geometry:root.dataset.fxCoreReferenceGeometry,material:root.dataset.fxCoreReferenceMaterial,reactor:root.dataset.fxCoreInternalReactor,fidelity:root.dataset.fxCoreReferenceFidelity,performance:root.dataset.fxCorePerformance,animation:root.dataset.fxCoreAnimation,interaction:root.dataset.fxCoreInteractionVisual,v69:root.dataset.fxCoreMobileV69,layout:root.dataset.fxMobileReferenceLayout,canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,gl:Boolean(canvas?.getContext('webgl2')),glError:canvas?.getContext('webgl2')?.getError(),width:box?.width||0,energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])],renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),referenceVisible:[...document.querySelectorAll('#hero .fx-reference-heading,#hero .fx-reference-proof,#hero .fx-reference-rail,.fx-reference-mag-button,.fx-reference-menu-button')].filter(visible).length,awardVisible:[...document.querySelectorAll('.fx-award-proof')].filter(visible).length,heroCopyVisible:visible(heroCopy),legacyMenuVisible:visible(legacyMenu),proofOverlap:overlap(refProof,award),liveTextOverlap:overlap(live,refText)};});
            console.log(name.toUpperCase(),JSON.stringify(state));assert.equal(state.renderer,'single-webgl2-mobile-cinematic-reference-glass-v69');assert.equal(state.geometry,'reference-target-organic-deep-concave-four-point-v69');assert.equal(state.material,'four-layer-luminous-fresnel-faceted-glass-v69');assert.equal(state.reactor,'white-cyan-reactor-six-orbitals-crossflare-v69');assert.equal(state.fidelity,'native-webgl2-only-no-raster-no-svg-v69');assert.equal(state.performance,'single-context-adaptive-60-plus-fps');assert.equal(state.animation,'continuous-native-webgl2-living-motion-v69');assert.equal(state.interaction,'direct-touch-drag-energy-burst-parallax-v69');assert.equal(state.v69,'ready-v69');assert.equal(state.layout,expected);assert.equal(state.canvases,1);assert.equal(state.gl,true);assert.equal(state.glError,0);assert.ok(state.width<=viewport.width+1&&state.renderMs<16.67,JSON.stringify(state));assert.ok(state.energy>=before.energy);assert.notDeepEqual(state.position,before.position);assert.ok(state.awardVisible<=1);assert.equal(state.proofOverlap,false);if(mobile){assert.ok(state.referenceVisible>=3);assert.equal(state.liveTextOverlap,false);}else{assert.equal(state.referenceVisible,0);assert.equal(state.heroCopyVisible,true);assert.equal(state.legacyMenuVisible,true);}await page.screenshot({path:`${name}-v69.png`,fullPage:false});await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await verify(browser,'desktop',{width:1440,height:960},false,1);await verify(browser,'mobile',{width:390,height:844},true,2);}finally{await browser.close()}for(const f of['desktop-v69.png','mobile-v69.png'])assert.ok(fs.statSync(f).size>10000,f);console.log('PASS: live v69 desktop/mobile visual, interaction and information-integrity checks passed.');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live MAG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mag-v69-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-live/desktop-v69.png
            ${{ runner.temp }}/mag-live/mobile-v69.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live MAG status
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live v69 desktop/mobile visual and information integrity passed'; else state=failure; description='Live v69 desktop/mobile diagnostic failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live MAG v69' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
