name: Verify live true 3D MAG visual
run-name: Capture true 3D MAG for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest
          npx playwright install --with-deps chromium

      - name: Capture cinematic live mobile MAG v11 states
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']
            });
            const context = await browser.newContext({
              viewport: { width: 753, height: 1536 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            await page.goto(`https://www.formatxsuite.com/?cinematic_v11_visual=${process.env.RUN_ID}`, {
              waitUntil: 'domcontentloaded', timeout: 45000
            });
            await page.waitForTimeout(1200);
            await page.evaluate(() => {
              const r=document.documentElement;
              r.lang='hu';
              r.dataset.fxImmersive='active';
              r.classList.add('fx-intro-complete');
              dispatchEvent(new CustomEvent('formatx:immersiveactivate'));
              document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
            });
            await page.waitForFunction(() => document.documentElement.dataset.fxCoreMesh3d === 'ready-v11', null, { timeout: 30000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCoreGeometry === 'indexed-triangle-mesh-v11', null, { timeout: 10000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCoreFracture3d === 'ready-v11', null, { timeout: 30000 });
            await page.waitForFunction(() => window.FormatXCoreCinematic?.version === 'film-reactive-v1', null, { timeout: 10000 });
            await page.waitForTimeout(1600);

            const idle = await page.evaluate(() => ({
              mapper: document.documentElement.dataset.fxApexSceneStability,
              mesh: document.documentElement.dataset.fxCoreMesh3d,
              geometry: document.documentElement.dataset.fxCoreGeometry,
              fracture: document.documentElement.dataset.fxCoreFracture3d,
              cinematic: document.documentElement.dataset.fxCoreCinematic,
              state: window.FormatXCoreCinematic?.state,
              energy: window.FormatXCoreCinematic?.energy,
              surge: window.FormatXCoreCinematic?.surge,
              depth: document.documentElement.dataset.fxCoreDepthBuffer,
              camera: document.documentElement.dataset.fxCoreCamera,
              screenReactor: document.documentElement.dataset.fxScreenSpaceReactor
            }));
            await page.screenshot({ path:'mag-idle.png', fullPage:false });

            await page.evaluate(() => {
              dispatchEvent(new CustomEvent('formatx:organismcoreactivate',{detail:{source:'visual-audit',scene:0,userInitiated:true}}));
              dispatchEvent(new CustomEvent('formatx:organismresponse',{detail:{text:'audit',scene:0,language:'hu',localOnly:true}}));
            });
            await page.waitForTimeout(700);
            const awake = await page.evaluate(() => ({
              state: window.FormatXCoreCinematic?.state,
              energy: window.FormatXCoreCinematic?.energy,
              surge: window.FormatXCoreCinematic?.surge
            }));
            await page.screenshot({ path:'mag-awake.png', fullPage:false });

            await page.evaluate(() => dispatchEvent(new CustomEvent('formatx:organismspeechstart',{detail:{text:'audit',explicit:true}})));
            await page.waitForTimeout(850);
            const speaking = await page.evaluate(() => ({
              state: window.FormatXCoreCinematic?.state,
              energy: window.FormatXCoreCinematic?.energy,
              surge: window.FormatXCoreCinematic?.surge,
              speech: window.FormatXCoreCinematic?.speech
            }));
            await page.screenshot({ path:'mag-speaking.png', fullPage:false });

            await page.evaluate(() => dispatchEvent(new CustomEvent('formatx:organismspeechend',{detail:{text:'audit',explicit:true}})));
            await page.waitForTimeout(900);
            const settling = await page.evaluate(() => ({
              state: window.FormatXCoreCinematic?.state,
              energy: window.FormatXCoreCinematic?.energy,
              speech: window.FormatXCoreCinematic?.speech
            }));
            await page.screenshot({ path:'mag-settling.png', fullPage:false });

            const state={idle,awake,speaking,settling};
            fs.writeFileSync('mag-state.json',JSON.stringify(state,null,2));
            if (
              idle.mapper !== 'ready-v20' ||
              idle.mesh !== 'ready-v11' ||
              idle.geometry !== 'indexed-triangle-mesh-v11' ||
              idle.fracture !== 'ready-v11' ||
              idle.cinematic !== 'film-reactive-v1' ||
              idle.depth !== 'enabled' ||
              idle.camera !== 'perspective' ||
              idle.screenReactor !== 'retired-for-real-3d-reactor' ||
              !(awake.energy > idle.energy + 0.20) ||
              !(awake.surge > 0.12) ||
              speaking.speech !== 1 ||
              !(speaking.energy > 0.65) ||
              settling.speech !== 0
            ) throw new Error(`Unexpected cinematic true 3D state: ${JSON.stringify(state)}`);

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload MAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-cinematic-true-mesh3d-mag-v11-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/mag-idle.png
            ${{ runner.temp }}/mag-visual/mag-awake.png
            ${{ runner.temp }}/mag-visual/mag-speaking.png
            ${{ runner.temp }}/mag-visual/mag-settling.png
            ${{ runner.temp }}/mag-visual/mag-state.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Cinematic true 3D MAG v11 reacted to activation, response and speech; visual states captured'
          else
            state='failure'
            description='Cinematic true 3D MAG v11 visual/state capture failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live true 3D MAG visual' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
