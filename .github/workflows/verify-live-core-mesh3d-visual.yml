name: Verify canonical live MAG visual
run-name: Canonical live MAG visual for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ['Prepare or deploy FormatX production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: canonical-live-mag-visual-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  visual-proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      FORMATX_TEST_URL: https://formatxsuite.com/
      FORMATX_MAG_EVIDENCE_DIR: artifacts/live-mag-functional
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDITED_SHA }}

      - name: Wait for exact audited production revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://formatxsuite.com/p0-validation-version.txt?wait=${GITHUB_RUN_ID}-${attempt}" \
              -o "$RUNNER_TEMP/live-p0.txt" && cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
              echo 'Exact production revision is live.'
              exit 0
            fi
            sleep 10
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Measure canonical desktop and mobile MAG
        run: node .github/scripts/validate-live-mag-functional.cjs

      - name: Upload canonical MAG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-mag-visual-${{ env.AUDITED_SHA }}
          path: artifacts/live-mag-functional
          if-no-files-found: warn
          retention-days: 30

      - name: Publish measured MAG visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='Canonical desktop/mobile MAG functional visual proof failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='Canonical desktop/mobile renderer, motion, ASK and fallback passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" \
            -f context='FormatX canonical native MAG visual' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
