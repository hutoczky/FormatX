name: Verify live responsive true 3D MAG
run-name: Validate production r326/r369 WebGL MAG on desktop and mobile

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-core-mesh3d-visual.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mag:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-live" && cd "$RUNNER_TEMP/mag-live"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Validate live current r326 crystal and r369 balanced optics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-live"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const origin = 'https://formatxsuite.com';

          function diagnostics(page, label) {
            page.on('pageerror', error => console.log(`[${label} PAGEERROR]`, error.message));
            page.on('requestfailed', request => {
              const url = request.url();
              if (!/cloudflareinsights\.com/.test(url)) {
                console.log(`[${label} REQUESTFAILED]`, url, request.failure()?.errorText || '');
              }
            });
          }

          async function verify(browser, name, viewport, mobile, dpr) {
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: dpr,
              isMobile: mobile,
              hasTouch: mobile,
              locale: 'hu-HU',
              colorScheme: 'dark'
            });
            const page = await context.newPage();
            diagnostics(page, name);

            await page.goto(`${origin}/?live_mag_r326=${name}-${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });

            await page.waitForFunction(() => {
              const root = document.documentElement;
              return root.dataset.fxCoreMobileV69 === 'ready-v69'
                && root.dataset.fxCrystalOrganismR326 === 'ready'
                && root.dataset.fxCoreRenderer === 'single-webgl-crystal-organism-r326'
                && Boolean(document.querySelector('#hero .fx-crystal-organism-r326-stage > .fx-crystal-organism-r326-canvas'));
            }, null, { timeout: 60000 });

            await page.waitForTimeout(500);
            const before = await page.evaluate(() => ({
              energy: Number(window.FormatXCoreMobileV69?.energy || 0),
              position: [...(window.FormatXCoreCinematic?.corePosition || [])]
            }));

            if (mobile) {
              await page.evaluate(() => {
                window.FormatXCoreMobileV69?.pulse?.();
                dispatchEvent(new CustomEvent('formatx:coreinteraction', {
                  detail: { x: .42, y: -.24, phase: 'drag' }
                }));
              });
              await page.waitForTimeout(260);
            }

            const state = await page.evaluate(() => {
              const root = document.documentElement;
              const stage = document.querySelector('#hero .fx-crystal-organism-r326-stage');
              const canvas = stage?.querySelector('.fx-crystal-organism-r326-canvas');
              const box = canvas?.getBoundingClientRect();
              const gl = canvas?.getContext('webgl2') || canvas?.getContext('webgl');
              const style = canvas ? getComputedStyle(canvas) : null;
              const visible = element => {
                if (!(element instanceof Element)) return false;
                const rect = element.getBoundingClientRect();
                const computed = getComputedStyle(element);
                return rect.width > 1 && rect.height > 1
                  && computed.display !== 'none'
                  && computed.visibility !== 'hidden'
                  && Number(computed.opacity || 1) > .01;
              };
              const overlap = (a, b, gap = 2) => {
                if (!visible(a) || !visible(b)) return false;
                const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
                return !(x.right + gap <= y.left || y.right + gap <= x.left || x.bottom + gap <= y.top || y.bottom + gap <= x.top);
              };
              const controls = document.querySelector('#hero .fx-reference-controls-r204');
              const sound = controls?.querySelector('.fx-three-sound');
              const ask = controls?.querySelector('.fx-reference-ask');
              const pause = controls?.querySelector('.fx-reference-pause');
              const opticsLink = [...document.querySelectorAll('link[rel="stylesheet"]')]
                .find(link => String(link.href).includes('formatx-mobile-core-optics-r328.css'));
              return {
                renderer: root.dataset.fxCoreRenderer || '',
                material: root.dataset.fxCoreMaterial || '',
                geometry: root.dataset.fxCoreGeometry || '',
                scheduler: root.dataset.fxCoreScheduler || '',
                composition: root.dataset.fxCoreCompositionRevisionR326 || '',
                stageRenderer: stage?.dataset.renderer || '',
                v69: root.dataset.fxCoreMobileV69 || '',
                r326: root.dataset.fxCrystalOrganismR326 || '',
                opticsOwner: root.dataset.fxCoreMobileOpticsR328 || '',
                opticsHref: opticsLink?.href || '',
                canvases: document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length,
                gl: Boolean(gl),
                glError: gl?.getError(),
                width: box?.width || 0,
                height: box?.height || 0,
                opacity: Number(style?.opacity || 0),
                filter: style?.filter || '',
                energy: Number(window.FormatXCoreMobileV69?.energy || 0),
                position: [...(window.FormatXCoreCinematic?.corePosition || [])],
                renderMs: Number(root.dataset.fxCoreRenderMs || Infinity),
                controlsVisible: visible(controls) && visible(sound) && visible(ask) && visible(pause),
                soundAskOverlap: overlap(sound, ask),
                askPauseOverlap: overlap(ask, pause),
                heroCopyVisible: visible(document.querySelector('#hero .hero-copy')),
                proofVisible: visible(document.querySelector('#hero .fx-reference-proof'))
              };
            });

            console.log(name.toUpperCase(), JSON.stringify({ before, state }));
            await page.screenshot({ path: `${name}-r326-current.png`, fullPage: false, timeout: 120000, animations: 'disabled', caret: 'hide' });

            assert.equal(state.renderer, 'single-webgl-crystal-organism-r326');
            assert.equal(state.stageRenderer, 'crystal-organism-r326');
            assert.equal(state.material, 'translucent-living-facet-organism-r326');
            assert.equal(state.geometry, 'four-direction-asymmetric-crystal-organism-r326');
            assert.equal(state.scheduler, 'heartbeat-and-interaction-bursts-no-idle-loop-r326');
            assert.equal(state.composition, 'new-organism-no-legacy-visual-fallback');
            assert.equal(state.v69, 'ready-v69');
            assert.equal(state.r326, 'ready');
            assert.equal(state.canvases, 1);
            assert.equal(state.gl, true);
            assert.equal(state.glError, 0);
            assert.ok(state.width <= viewport.width + 1 && state.height > 100, JSON.stringify(state));
            assert.ok(Number.isFinite(state.renderMs) && state.renderMs < 16.67, JSON.stringify(state));
            assert.ok(state.opticsHref.includes('formatx-mobile-core-optics-r328.css'), 'r369 optics stylesheet is not loaded');
            assert.equal(state.controlsVisible, true, JSON.stringify(state));
            assert.equal(state.soundAskOverlap, false, JSON.stringify(state));
            assert.equal(state.askPauseOverlap, false, JSON.stringify(state));
            assert.equal(state.heroCopyVisible, true, JSON.stringify(state));
            assert.equal(state.proofVisible, true, JSON.stringify(state));

            if (mobile) {
              assert.ok(state.energy >= before.energy - .02, JSON.stringify({ before, state }));
              assert.equal(state.position.length, 3);
              assert.notDeepEqual(state.position, before.position);
              assert.equal(state.opticsOwner, 'r369-balanced-mobile-optics-owner');
              assert.ok(state.opticsHref.includes('20260827-r369-balanced-mobile-optics'), state.opticsHref);
              assert.ok(state.opacity <= .8451 && state.opacity >= .844, `mobile r369 canvas opacity mismatch: ${JSON.stringify(state)}`);
              assert.match(state.filter, /blur\(1\.12px\)/, `mobile r369 edge softening missing: ${state.filter}`);
            }

            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']
            });
            try {
              await verify(browser, 'desktop', { width: 1440, height: 960 }, false, 1);
              await verify(browser, 'mobile', { width: 390, height: 844 }, true, 2);
            } finally {
              await browser.close();
            }
            for (const file of ['desktop-r326-current.png','mobile-r326-current.png']) {
              assert.ok(fs.statSync(file).size > 10000, file);
            }
            console.log('PASS: live r326 WebGL crystal, r369 balanced mobile optics, interaction and control geometry passed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload live MAG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mag-r326-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-live/desktop-r326-current.png
            ${{ runner.temp }}/mag-live/mobile-r326-current.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish live MAG status
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r326 crystal and r369 balanced mobile optics passed'
          else
            state=failure
            description='Live r326/r369 MAG diagnostic failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live MAG r326' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
