name: Verify live true 3D MAG visual
run-name: Capture single-context real 3D MAG for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest pngjs@latest
          npx playwright install --with-deps chromium

      - name: Capture and measure single-context real 3D MAG v20
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs');
          const polygon = [[45, 684], [377, 300], [710, 684], [377, 1064]];
          function inside(x, y, points) {
            let value = false;
            for (let index = 0, previous = points.length - 1; index < points.length; previous = index, index += 1) {
              const a = points[index], b = points[previous];
              if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) value = !value;
            }
            return value;
          }
          function percentile(values, position) {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.min(sorted.length - 1, Math.max(0, Math.round((sorted.length - 1) * position)))];
          }
          function metrics(file) {
            const png = PNG.sync.read(fs.readFileSync(file)), luminance = [], saturation = [];
            let over050 = 0, over075 = 0;
            for (let y = 0; y < png.height; y += 1) for (let x = 0; x < png.width; x += 1) {
              if (!inside(x, y, polygon)) continue;
              const offset = (png.width * y + x) << 2;
              const r = png.data[offset] / 255, g = png.data[offset + 1] / 255, b = png.data[offset + 2] / 255;
              const light = .2126 * r + .7152 * g + .0722 * b;
              const maximum = Math.max(r, g, b), minimum = Math.min(r, g, b);
              luminance.push(light);
              saturation.push(maximum ? (maximum - minimum) / maximum : 0);
              if (light > .5) over050 += 1;
              if (light > .75) over075 += 1;
            }
            const sum = values => values.reduce((total, value) => total + value, 0);
            return {
              pixels: luminance.length,
              mean_luminance: sum(luminance) / luminance.length,
              median_luminance: percentile(luminance, .5),
              p90_luminance: percentile(luminance, .9),
              p99_luminance: percentile(luminance, .99),
              mean_saturation: sum(saturation) / saturation.length,
              fraction_over_050: over050 / luminance.length,
              fraction_over_075: over075 / luminance.length
            };
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
            const context = await browser.newContext({ viewport: { width: 753, height: 1536 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true, locale: 'hu-HU' });
            const page = await context.newPage();
            await page.goto(`https://www.formatxsuite.com/?real3d_v20=${process.env.RUN_ID}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(1200);
            await page.evaluate(() => {
              const root = document.documentElement;
              root.lang = 'hu';
              root.dataset.fxImmersive = 'active';
              root.classList.add('fx-intro-complete');
              dispatchEvent(new CustomEvent('formatx:immersiveactivate'));
              document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
            });
            const waits = [
              [() => document.documentElement.dataset.fxApexSceneStability === 'ready-v36', 'mapper'],
              [() => document.documentElement.dataset.fxCoreReal3d === 'ready-v20', 'real3d'],
              [() => document.documentElement.dataset.fxCoreRenderer === 'single-webgl2-indexed-3d-v20', 'renderer'],
              [() => document.documentElement.dataset.fxCoreContexts === '1', 'single-context'],
              [() => document.documentElement.dataset.fxCoreImageBacked === 'false', 'not-image-backed'],
              [() => document.documentElement.dataset.fxCoreDepthBuffer === 'enabled', 'depth'],
              [() => document.documentElement.dataset.fxCoreCamera === 'perspective', 'perspective'],
              [() => window.FormatXCoreCinematic?.version === 'film-reactive-v1', 'cinematic']
            ];
            for (const [condition, name] of waits) {
              console.log('WAIT', name);
              await page.waitForFunction(condition, null, { timeout: 60000 });
              console.log('READY', name);
            }
            await page.waitForTimeout(900);
            await page.evaluate(() => scrollTo(0, Math.min(400, document.documentElement.scrollHeight - innerHeight)));
            await page.waitForTimeout(900);
            const runtime = await page.evaluate(() => {
              const root = document.documentElement;
              const canvas = document.querySelector('.fx-core-real3d-canvas');
              return {
                real3d: root.dataset.fxCoreReal3d,
                renderer: root.dataset.fxCoreRenderer,
                contexts: root.dataset.fxCoreContexts,
                drawCalls: root.dataset.fxCoreDrawCalls,
                target: root.dataset.fxCorePerformanceTarget,
                visibility: root.dataset.fxCoreVisibility,
                webgl2: Boolean(canvas?.getContext('webgl2')),
                oldMeshStages: document.querySelectorAll('.fx-core-mesh3d-stage').length,
                oldFractureStages: document.querySelectorAll('.fx-core-fracture3d-stage').length,
                nativeStages: document.querySelectorAll('.fx-transcend-shell[data-fx-native-apex="true"]').length,
                fallbackActive: document.querySelector('.fx-resilient-core')?.dataset.active || 'absent'
              };
            });
            await page.screenshot({ path: 'mag-idle-reference.png', fullPage: false });
            await page.evaluate(() => {
              dispatchEvent(new CustomEvent('formatx:organismcoreactivate', { detail: { userInitiated: true } }));
              dispatchEvent(new CustomEvent('formatx:organismresponse', { detail: { text: 'audit', localOnly: true } }));
            });
            await page.waitForTimeout(180);
            const awake = await page.evaluate(() => ({
              energy: window.FormatXCoreCinematic?.energy,
              surge: window.FormatXCoreCinematic?.surge,
              immediate: document.documentElement.dataset.fxCoreCinematicImmediate
            }));
            await page.waitForTimeout(520);
            await page.screenshot({ path: 'mag-awake-reference.png', fullPage: false });
            const visual = metrics('mag-awake-reference.png');
            await page.evaluate(() => dispatchEvent(new CustomEvent('formatx:organismspeechstart', { detail: { text: 'audit', explicit: true } })));
            await page.waitForTimeout(180);
            const speaking = await page.evaluate(() => ({ energy: window.FormatXCoreCinematic?.energy, speech: window.FormatXCoreCinematic?.speech }));
            await page.waitForTimeout(500);
            await page.screenshot({ path: 'mag-speaking-reference.png', fullPage: false });
            await page.evaluate(() => dispatchEvent(new CustomEvent('formatx:organismspeechend', { detail: { explicit: true } })));
            await page.waitForTimeout(180);
            const settling = await page.evaluate(() => ({ speech: window.FormatXCoreCinematic?.speech }));
            await page.waitForTimeout(500);
            await page.screenshot({ path: 'mag-settling-reference.png', fullPage: false });
            const evidence = { runtime, awake, speaking, settling, visual };
            fs.writeFileSync('mag-state.json', JSON.stringify(evidence, null, 2));
            fs.writeFileSync('mag-metrics.json', JSON.stringify({
              acceptance: { mean_luminance: [.23, .42], median_luminance: [.18, .35], p90_luminance_min: .52, p99_luminance_min: .82, mean_saturation: [.58, .86], fraction_over_050_min: .10, fraction_over_075_min: .025 },
              measured: visual
            }, null, 2));
            const visualOk = visual.mean_luminance >= .23 && visual.mean_luminance <= .42
              && visual.median_luminance >= .18 && visual.median_luminance <= .35
              && visual.p90_luminance >= .52 && visual.p99_luminance >= .82
              && visual.mean_saturation >= .58 && visual.mean_saturation <= .86
              && visual.fraction_over_050 >= .10 && visual.fraction_over_075 >= .025;
            const runtimeOk = runtime.real3d === 'ready-v20' && runtime.renderer === 'single-webgl2-indexed-3d-v20'
              && runtime.contexts === '1' && runtime.drawCalls === '14-max'
              && runtime.target === 'adaptive-60-plus-fps' && runtime.visibility === 'hero-only-raf-paused'
              && runtime.webgl2 && runtime.oldMeshStages === 0 && runtime.oldFractureStages === 0
              && runtime.nativeStages === 0 && runtime.fallbackActive !== 'true';
            if (!runtimeOk || !(awake.energy >= .70) || !(awake.surge > .50)
              || awake.immediate !== 'frame-rate-independent-v1' || speaking.speech !== 1
              || settling.speech !== 0 || !visualOk) throw new Error(`real 3D v20 gate failed: ${JSON.stringify(evidence)}`);
            console.log('EVIDENCE', JSON.stringify(evidence));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload MAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-single-context-real3d-mag-v20-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/mag-idle-reference.png
            ${{ runner.temp }}/mag-visual/mag-awake-reference.png
            ${{ runner.temp }}/mag-visual/mag-speaking-reference.png
            ${{ runner.temp }}/mag-visual/mag-settling-reference.png
            ${{ runner.temp }}/mag-visual/mag-state.json
            ${{ runner.temp }}/mag-visual/mag-metrics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Single-context real 3D MAG v20 passed runtime and visual gates'; else state=failure; description='Single-context real 3D MAG v20 failed runtime or visual gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
