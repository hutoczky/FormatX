name: Verify live true 3D MAG visual
run-name: Capture reference-fit MAG r7 for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture and measure live reference-fit MAG r7
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const {chromium}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('node:fs');
          function metrics(file,region){
            const png=PNG.sync.read(fs.readFileSync(file));
            const x0=Math.max(0,region.x0),y0=Math.max(0,region.y0),x1=Math.min(png.width,region.x1),y1=Math.min(png.height,region.y1);
            let pixels=0,lum=0,bright=0,sat=0,spectral=0,minX=x1,minY=y1,maxX=x0,maxY=y0,sp=0;
            for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
              const o=(y*png.width+x)<<2,r=png.data[o]/255,g=png.data[o+1]/255,b=png.data[o+2]/255,l=.2126*r+.7152*g+.0722*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;
              const cv=(b>r*1.12&&g>r*1.01&&l>.05)||(b>g*1.05&&r>g*.62&&l>.05);
              pixels++;lum+=l;if(l>.34)bright++;if(s>.40&&l>.05)sat++;if(cv)spectral++;
              if(cv&&s>.34&&l>.07){sp++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
            }
            const bounds=sp?{x:minX,y:minY,width:maxX-minX+1,height:maxY-minY+1,centerX:(minX+maxX)/2,centerY:(minY+maxY)/2}:null;
            return {pixels,mean_luminance:lum/pixels,bright_fraction:bright/pixels,saturated_fraction:sat/pixels,cyan_violet_fraction:spectral/pixels,spectral_pixels:sp,bounds};
          }
          async function capture(browser,cfg){
            const context=await browser.newContext({viewport:cfg.viewport,deviceScaleFactor:1,isMobile:cfg.mobile,hasTouch:cfg.mobile,locale:'hu-HU'});
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`https://www.formatxsuite.com/?reference_fit_r7=${process.env.RUN_ID}&capture=${cfg.name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.evaluate(()=>{document.documentElement.lang='hu';document.documentElement.classList.add('fx-intro-complete');document.getElementById('formatx-event-horizon')?.remove();scrollTo(0,0);});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreReferenceLock==='ready-v30',null,{timeout:60000});
            await page.waitForTimeout(1800);
            const runtime=await page.evaluate(()=>{
              const root=document.documentElement,canvas=document.querySelector('.fx-core-real3d-canvas'),stage=document.querySelector('.fx-core-real3d-stage'),rect=canvas?.getBoundingClientRect();
              let webgl2=false;try{webgl2=Boolean(canvas?.getContext('webgl2'));}catch(_){}
              return {reference:root.dataset.fxCoreReferenceLock,referenceRevision:root.dataset.fxCoreReferenceRevision,fit:root.dataset.fxCoreReferenceFit,surface:root.dataset.fxCoreReferenceSurface,visual:root.dataset.fxCoreVisualRevision,geometry:root.dataset.fxCoreGeometry,reactor:root.dataset.fxCoreInternalReactor,performance:root.dataset.fxCorePerformance,imageBacked:root.dataset.fxCoreImageBacked,webgl2,stageActive:stage?.dataset.active,canvas:rect?{width:rect.width,height:rect.height}:null,stages:document.querySelectorAll('.fx-core-real3d-stage').length};
            });
            const file=`reference-fit-r7-${cfg.name}.png`;await page.screenshot({path:file,fullPage:false});const visual=metrics(file,cfg.region);
            fs.writeFileSync(`reference-fit-r7-${cfg.name}.json`,JSON.stringify({runtime,visual,errors},null,2));
            await context.close();
            const b=visual.bounds;
            const runtimeOk=runtime.reference==='ready-v30'&&runtime.referenceRevision==='uploaded-reference-20260810'&&runtime.fit==='uploaded-image-20260810-r7'&&runtime.surface==='organic-faceted-glass-r6'&&runtime.visual==='v30-reference-lock'&&runtime.geometry==='concave-four-sail-indexed-mesh-v30'&&runtime.reactor==='moving-white-core-four-rings-v30'&&runtime.performance==='adaptive-60-plus-fps'&&runtime.imageBacked==='false'&&runtime.webgl2&&runtime.stageActive==='true'&&runtime.stages===1&&runtime.canvas?.width>=cfg.viewport.width*.97&&runtime.canvas?.height>=cfg.viewport.height*.97;
            const visualOk=visual.mean_luminance>=.018&&visual.mean_luminance<=.58&&visual.bright_fraction>=.0015&&visual.saturated_fraction>=.010&&visual.cyan_violet_fraction>=.008&&b&&b.width>=cfg.minWidth&&b.height>=cfg.minHeight&&b.centerY>=cfg.centerYMin&&b.centerY<=cfg.centerYMax;
            if(!runtimeOk||!visualOk||errors.length)throw new Error(`${cfg.name} r7 gate failed: ${JSON.stringify({runtime,visual,errors})}`);
            return {runtime,visual};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const mobile=await capture(browser,{name:'mobile',mobile:true,viewport:{width:753,height:1536},region:{x0:15,y0:0,x1:738,y1:1300},minWidth:500,minHeight:520,centerYMin:500,centerYMax:930});
            const desktop=await capture(browser,{name:'desktop',mobile:false,viewport:{width:1440,height:1000},region:{x0:560,y0:40,x1:1430,y1:960},minWidth:380,minHeight:360,centerYMin:250,centerYMax:780});
            fs.writeFileSync('reference-fit-r7-summary.json',JSON.stringify({fit:'uploaded-image-20260810-r7',mobile,desktop},null,2));
            console.log('REFERENCE_FIT_R7_EVIDENCE',JSON.stringify({mobile,desktop}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Upload r7 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reference-fit-r7-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/reference-fit-r7-mobile.png
            ${{ runner.temp }}/mag-visual/reference-fit-r7-desktop.png
            ${{ runner.temp }}/mag-visual/reference-fit-r7-mobile.json
            ${{ runner.temp }}/mag-visual/reference-fit-r7-desktop.json
            ${{ runner.temp }}/mag-visual/reference-fit-r7-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Reference-fit WebGL2 MAG r7 passed live mobile and desktop visual gates'; else state=failure; description='Reference-fit MAG r7 failed live visual gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"