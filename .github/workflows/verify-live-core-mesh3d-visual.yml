name: Verify live true 3D MAG visual
run-name: Capture true 3D MAG for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"; cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest pngjs@latest
          npx playwright install --with-deps chromium
      - name: Capture and measure sparse high-dynamic MAG v21
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const { chromium }=require('playwright');
          const { PNG }=require('pngjs');
          const fs=require('node:fs');
          const polygon=[[45,684],[377,300],[710,684],[377,1064]];
          function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
          function percentile(a,q){const b=[...a].sort((x,y)=>x-y);const i=Math.min(b.length-1,Math.max(0,Math.round((b.length-1)*q)));return b[i];}
          function metrics(path){const png=PNG.sync.read(fs.readFileSync(path));const lum=[],sat=[];let over50=0,over75=0;for(let y=0;y<png.height;y++)for(let x=0;x<png.width;x++){if(!inside(x,y,polygon))continue;const i=(png.width*y+x)<<2,r=png.data[i]/255,g=png.data[i+1]/255,b=png.data[i+2]/255;const l=.2126*r+.7152*g+.0722*b;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx===0?0:(mx-mn)/mx;lum.push(l);sat.push(s);if(l>.5)over50++;if(l>.75)over75++;}const sum=a=>a.reduce((x,y)=>x+y,0);return{pixels:lum.length,mean_luminance:sum(lum)/lum.length,median_luminance:percentile(lum,.5),p90_luminance:percentile(lum,.9),p99_luminance:percentile(lum,.99),mean_saturation:sum(sat)/sat.length,fraction_over_050:over50/lum.length,fraction_over_075:over75/lum.length};}
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const context=await browser.newContext({viewport:{width:753,height:1536},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'hu-HU'});const page=await context.newPage();
          await page.goto(`https://www.formatxsuite.com/?glass_v21_ref_visual=${process.env.RUN_ID}`,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1200);
          await page.evaluate(()=>{const r=document.documentElement;r.lang='hu';r.dataset.fxImmersive='active';r.classList.add('fx-intro-complete');dispatchEvent(new CustomEvent('formatx:immersiveactivate'));document.dispatchEvent(new CustomEvent('formatx:introcomplete'));});
          for(const [expr,timeout] of [[()=>document.documentElement.dataset.fxApexSceneStability==='ready-v31',30000],[()=>document.documentElement.dataset.fxCoreMeshMaterial==='reference-glass-v21',30000],[()=>document.documentElement.dataset.fxCoreHighlightModel==='sparse-high-dynamic-facets-v21',10000],[()=>document.documentElement.dataset.fxCoreHighlightCoverage==='thresholded-facet-web-axis-ring-v21',10000],[()=>document.documentElement.dataset.fxCoreMaterialCenter==='object-space-y-minus-0.18',10000],[()=>document.documentElement.dataset.fxCoreShapeMesh==='applied-v14',10000],[()=>document.documentElement.dataset.fxCoreShapeFracture==='applied-v14',30000],[()=>document.documentElement.dataset.fxCoreGeometryScale==='1.15x-true-3d-uniform',10000],[()=>document.documentElement.dataset.fxCoreMesh3d==='ready-v11',30000],[()=>document.documentElement.dataset.fxCoreFracture3d==='ready-v11',30000],[()=>document.documentElement.dataset.fxCoreCinematicGrade==='sparse-hdr-v21',10000],[()=>window.FormatXCoreCinematic?.version==='film-reactive-v1',10000]])await page.waitForFunction(expr,null,{timeout});
          await page.waitForTimeout(1200);await page.evaluate(()=>scrollTo(0,Math.min(400,document.documentElement.scrollHeight-innerHeight)));await page.waitForTimeout(900);
          const idle=await page.evaluate(()=>({mapper:document.documentElement.dataset.fxApexSceneStability,material:document.documentElement.dataset.fxCoreMeshMaterial,highlight:document.documentElement.dataset.fxCoreHighlightModel,coverage:document.documentElement.dataset.fxCoreHighlightCoverage,center:document.documentElement.dataset.fxCoreMaterialCenter,shapeMesh:document.documentElement.dataset.fxCoreShapeMesh,shapeFracture:document.documentElement.dataset.fxCoreShapeFracture,scale:document.documentElement.dataset.fxCoreGeometryScale,mesh:document.documentElement.dataset.fxCoreMesh3d,fracture:document.documentElement.dataset.fxCoreFracture3d,grade:document.documentElement.dataset.fxCoreCinematicGrade,energy:window.FormatXCoreCinematic?.energy,scrollY}));
          await page.screenshot({path:'mag-idle-reference.png',fullPage:false});
          await page.evaluate(()=>{dispatchEvent(new CustomEvent('formatx:organismcoreactivate',{detail:{source:'visual-audit',userInitiated:true}}));dispatchEvent(new CustomEvent('formatx:organismresponse',{detail:{text:'audit',localOnly:true}}));});await page.waitForTimeout(180);
          const awake=await page.evaluate(()=>({energy:window.FormatXCoreCinematic?.energy,surge:window.FormatXCoreCinematic?.surge,immediate:document.documentElement.dataset.fxCoreCinematicImmediate}));await page.waitForTimeout(520);await page.screenshot({path:'mag-awake-reference.png',fullPage:false});
          const visual=metrics('mag-awake-reference.png');fs.writeFileSync('mag-metrics.json',JSON.stringify({target:{mean_luminance:.326,median_luminance:.261,p90_luminance:.663,p99_luminance:.932,mean_saturation:.719},acceptance:{mean_luminance:[.23,.42],median_luminance:[.18,.35],p90_luminance_min:.52,p99_luminance_min:.82,mean_saturation:[.58,.86],fraction_over_050_min:.10,fraction_over_075_min:.025},measured:visual},null,2));
          await page.evaluate(()=>dispatchEvent(new CustomEvent('formatx:organismspeechstart',{detail:{text:'audit',explicit:true}})));await page.waitForTimeout(180);const speaking=await page.evaluate(()=>({energy:window.FormatXCoreCinematic?.energy,speech:window.FormatXCoreCinematic?.speech}));await page.waitForTimeout(620);await page.screenshot({path:'mag-speaking-reference.png',fullPage:false});
          await page.evaluate(()=>dispatchEvent(new CustomEvent('formatx:organismspeechend',{detail:{text:'audit',explicit:true}})));await page.waitForTimeout(180);const settling=await page.evaluate(()=>({speech:window.FormatXCoreCinematic?.speech}));await page.waitForTimeout(620);await page.screenshot({path:'mag-settling-reference.png',fullPage:false});
          const state={idle,awake,speaking,settling,visual};fs.writeFileSync('mag-state.json',JSON.stringify(state,null,2));
          const visualOk=visual.mean_luminance>=.23&&visual.mean_luminance<=.42&&visual.median_luminance>=.18&&visual.median_luminance<=.35&&visual.p90_luminance>=.52&&visual.p99_luminance>=.82&&visual.mean_saturation>=.58&&visual.mean_saturation<=.86&&visual.fraction_over_050>=.10&&visual.fraction_over_075>=.025;
          if(idle.mapper!=='ready-v31'||idle.material!=='reference-glass-v21'||idle.highlight!=='sparse-high-dynamic-facets-v21'||idle.coverage!=='thresholded-facet-web-axis-ring-v21'||idle.center!=='object-space-y-minus-0.18'||idle.shapeMesh!=='applied-v14'||idle.shapeFracture!=='applied-v14'||idle.scale!=='1.15x-true-3d-uniform'||idle.mesh!=='ready-v11'||idle.fracture!=='ready-v11'||idle.grade!=='sparse-hdr-v21'||idle.scrollY!==400||awake.immediate!=='frame-rate-independent-v1'||!(awake.energy>=.70)||!(awake.surge>.50)||speaking.speech!==1||!(speaking.energy>=.78)||settling.speech!==0||!visualOk)throw new Error(`v21 gate failed: ${JSON.stringify(state)}`);
          await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload MAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sparse-high-dynamic-mag-v21-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/mag-idle-reference.png
            ${{ runner.temp }}/mag-visual/mag-awake-reference.png
            ${{ runner.temp }}/mag-visual/mag-speaking-reference.png
            ${{ runner.temp }}/mag-visual/mag-settling-reference.png
            ${{ runner.temp }}/mag-visual/mag-state.json
            ${{ runner.temp }}/mag-visual/mag-metrics.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Sparse HDR MAG v21 passed runtime and unchanged reference pixel-metric gates'; else state=failure; description='MAG v21 failed runtime or unchanged reference pixel-metric gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
