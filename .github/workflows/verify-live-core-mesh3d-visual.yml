name: Verify live true 3D MAG visual
run-name: Capture true 3D MAG for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"; cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest pngjs@latest
          npx playwright install --with-deps chromium
      - name: Capture and measure luminous energy-network MAG v24
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const {chromium}=require('playwright');const {PNG}=require('pngjs');const fs=require('node:fs');const polygon=[[45,684],[377,300],[710,684],[377,1064]];
          function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const A=p[i],B=p[j];if(((A[1]>y)!==(B[1]>y))&&(x<(B[0]-A[0])*(y-A[1])/(B[1]-A[1])+A[0]))c=!c}return c}function pct(a,q){const b=[...a].sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.max(0,Math.round((b.length-1)*q)))]}
          function metrics(path){const p=PNG.sync.read(fs.readFileSync(path)),lum=[],sat=[];let o50=0,o75=0;for(let y=0;y<p.height;y++)for(let x=0;x<p.width;x++){if(!inside(x,y,polygon))continue;const i=(p.width*y+x)<<2,r=p.data[i]/255,g=p.data[i+1]/255,b=p.data[i+2]/255,l=.2126*r+.7152*g+.0722*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?((mx-mn)/mx):0;lum.push(l);sat.push(s);if(l>.5)o50++;if(l>.75)o75++}const sum=a=>a.reduce((x,y)=>x+y,0);return{pixels:lum.length,mean_luminance:sum(lum)/lum.length,median_luminance:pct(lum,.5),p90_luminance:pct(lum,.9),p99_luminance:pct(lum,.99),mean_saturation:sum(sat)/sat.length,fraction_over_050:o50/lum.length,fraction_over_075:o75/lum.length}}
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});const context=await browser.newContext({viewport:{width:753,height:1536},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'hu-HU'});const page=await context.newPage();await page.goto(`https://www.formatxsuite.com/?glass_v24=${process.env.RUN_ID}`,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1200);await page.evaluate(()=>{const r=document.documentElement;r.lang='hu';r.dataset.fxImmersive='active';r.classList.add('fx-intro-complete');dispatchEvent(new CustomEvent('formatx:immersiveactivate'));document.dispatchEvent(new CustomEvent('formatx:introcomplete'))});
          const waits=[[()=>document.documentElement.dataset.fxApexSceneStability==='ready-v34','mapper'],[()=>document.documentElement.dataset.fxCoreMeshMaterial==='reference-glass-v24','material'],[()=>document.documentElement.dataset.fxCoreHighlightModel==='luminous-energy-network-v24','highlight'],[()=>document.documentElement.dataset.fxCoreHighlightCoverage==='expanded-10-25pct-network-v24','coverage'],[()=>document.documentElement.dataset.fxCoreMaterialCenter==='object-space-y-minus-0.18','center'],[()=>document.documentElement.dataset.fxCoreShapeMesh==='applied-v14','shapeMesh'],[()=>document.documentElement.dataset.fxCoreShapeFracture==='applied-v14','shapeFracture'],[()=>document.documentElement.dataset.fxCoreGeometryScale==='1.15x-true-3d-uniform','scale'],[()=>document.documentElement.dataset.fxCoreMesh3d==='ready-v11','mesh'],[()=>document.documentElement.dataset.fxCoreFracture3d==='ready-v11','fracture'],[()=>document.documentElement.dataset.fxCoreCinematicGrade==='reference-network-v23','grade'],[()=>window.FormatXCoreCinematic?.version==='film-reactive-v1','cinematic']];for(const [f,n] of waits){console.log('WAIT',n);await page.waitForFunction(f,null,{timeout:60000});console.log('READY',n)}
          await page.waitForTimeout(900);await page.evaluate(()=>scrollTo(0,Math.min(400,document.documentElement.scrollHeight-innerHeight)));await page.waitForTimeout(900);await page.screenshot({path:'mag-idle-reference.png',fullPage:false});await page.evaluate(()=>{dispatchEvent(new CustomEvent('formatx:organismcoreactivate',{detail:{userInitiated:true}}));dispatchEvent(new CustomEvent('formatx:organismresponse',{detail:{text:'audit',localOnly:true}}))});await page.waitForTimeout(180);const awake=await page.evaluate(()=>({energy:window.FormatXCoreCinematic?.energy,surge:window.FormatXCoreCinematic?.surge,immediate:document.documentElement.dataset.fxCoreCinematicImmediate}));await page.waitForTimeout(520);await page.screenshot({path:'mag-awake-reference.png',fullPage:false});const visual=metrics('mag-awake-reference.png');console.log('METRICS',JSON.stringify(visual));fs.writeFileSync('mag-metrics.json',JSON.stringify({target:{mean_luminance:.326,median_luminance:.261,p90_luminance:.663,p99_luminance:.932,mean_saturation:.719},acceptance:{mean_luminance:[.23,.42],median_luminance:[.18,.35],p90_luminance_min:.52,p99_luminance_min:.82,mean_saturation:[.58,.86],fraction_over_050_min:.10,fraction_over_075_min:.025},measured:visual},null,2));await page.evaluate(()=>dispatchEvent(new CustomEvent('formatx:organismspeechstart',{detail:{text:'audit',explicit:true}})));await page.waitForTimeout(180);const speaking=await page.evaluate(()=>({energy:window.FormatXCoreCinematic?.energy,speech:window.FormatXCoreCinematic?.speech}));await page.waitForTimeout(500);await page.screenshot({path:'mag-speaking-reference.png',fullPage:false});await page.evaluate(()=>dispatchEvent(new CustomEvent('formatx:organismspeechend',{detail:{explicit:true}})));await page.waitForTimeout(180);const settling=await page.evaluate(()=>({speech:window.FormatXCoreCinematic?.speech}));await page.waitForTimeout(500);await page.screenshot({path:'mag-settling-reference.png',fullPage:false});const state={awake,speaking,settling,visual};fs.writeFileSync('mag-state.json',JSON.stringify(state,null,2));const ok=visual.mean_luminance>=.23&&visual.mean_luminance<=.42&&visual.median_luminance>=.18&&visual.median_luminance<=.35&&visual.p90_luminance>=.52&&visual.p99_luminance>=.82&&visual.mean_saturation>=.58&&visual.mean_saturation<=.86&&visual.fraction_over_050>=.10&&visual.fraction_over_075>=.025;if(!(awake.energy>=.70)||!(awake.surge>.50)||awake.immediate!=='frame-rate-independent-v1'||speaking.speech!==1||settling.speech!==0||!ok)throw new Error('v24 gate failed '+JSON.stringify(state));await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload MAG visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-luminous-energy-network-mag-v24-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/mag-idle-reference.png
            ${{ runner.temp }}/mag-visual/mag-awake-reference.png
            ${{ runner.temp }}/mag-visual/mag-speaking-reference.png
            ${{ runner.temp }}/mag-visual/mag-settling-reference.png
            ${{ runner.temp }}/mag-visual/mag-state.json
            ${{ runner.temp }}/mag-visual/mag-metrics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Luminous energy-network MAG v24 passed unchanged reference pixel gates'; else state=failure; description='Luminous energy-network MAG v24 failed unchanged reference pixel gate'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live true 3D MAG visual' -f description="$description" -f target_url="$TARGET_URL"
