name: Verify live true 3D MAG visual
run-name: Capture current desktop v53 and mobile v65 MAG for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-live" && cd "$RUNNER_TEMP/mag-live"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate desktop v53 and native cinematic mobile v65 live MAG
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-live"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const {chromium}=require('playwright');const origin='https://formatxsuite.com';
          async function desktop(b){const c=await b.newContext({viewport:{width:1440,height:960},deviceScaleFactor:1,locale:'hu-HU'}),p=await c.newPage();await p.goto(`${origin}/?mag_visual=desktop-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.dataset.fxCoreReferenceV53==='ready-v53',null,{timeout:60000});const s=await p.evaluate(()=>{const r=document.documentElement,x=document.querySelector('.fx-core-reference-v53-canvas'),b=x?.getBoundingClientRect();return{renderer:r.dataset.fxCoreRenderer,canvases:document.querySelectorAll('.fx-core-reference-v53-canvas').length,gl:Boolean(x?.getContext('webgl2')),width:b?.width||0,height:b?.height||0};});assert.equal(s.renderer,'single-webgl2-reference-crystal-v53');assert.equal(s.canvases,1);assert.equal(s.gl,true);assert.ok(s.width>100&&s.height>100);await p.screenshot({path:'desktop-v53.png',fullPage:false});await c.close();}
          async function mobile(b){const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'}),p=await c.newPage();await p.goto(`${origin}/?mag_visual=mobile-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileV65==='ready-v65',null,{timeout:60000});await p.waitForFunction(()=>document.documentElement.dataset.fxCoreInteraction==='direct-pointer-touch-drag-r4-living-system',null,{timeout:30000});const before=await p.evaluate(()=>Number(window.FormatXCoreMobileV65?.energy||0));await p.touchscreen.tap(196,390);await p.waitForTimeout(180);const s=await p.evaluate(()=>{const r=document.documentElement,x=document.querySelector('#hero .hero-space > .fx-core-mobile-v55-stage > .fx-core-mobile-v55-canvas'),b=x?.getBoundingClientRect();return{renderer:r.dataset.fxCoreRenderer,geometry:r.dataset.fxCoreReferenceGeometry,material:r.dataset.fxCoreReferenceMaterial,reactor:r.dataset.fxCoreInternalReactor,fidelity:r.dataset.fxCoreReferenceFidelity,performance:r.dataset.fxCorePerformance,interaction:r.dataset.fxCoreInteraction,v55:r.dataset.fxCoreMobileV55,v65:r.dataset.fxCoreMobileV65,canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,overlays:document.querySelectorAll('.fx-core-fidelity-v61').length,gl:Boolean(x?.getContext('webgl2')),width:b?.width||0,height:b?.height||0,vw:innerWidth,vh:innerHeight,energy:Number(window.FormatXCoreMobileV65?.energy||0)};});assert.equal(s.renderer,'single-webgl2-mobile-cinematic-crystal-volume-v65');assert.equal(s.geometry,'target-proportioned-organic-deep-concave-four-point-v65');assert.equal(s.material,'layered-fresnel-crystal-volume-v65');assert.equal(s.reactor,'white-cyan-spherical-reactor-multiaxis-orbitals-v65');assert.equal(s.fidelity,'native-webgl2-only-no-raster-no-svg-v65');assert.equal(s.performance,'single-context-adaptive-60-plus-fps');assert.equal(s.interaction,'direct-pointer-touch-drag-r4-living-system');assert.equal(s.v55,'ready-v55');assert.equal(s.v65,'ready-v65');assert.equal(s.canvases,1);assert.equal(s.overlays,0);assert.equal(s.gl,true);assert.ok(s.width<=s.vw+1&&s.height<=s.vh+1,JSON.stringify(s));assert.ok(s.energy>=before,JSON.stringify({before,after:s.energy}));await p.screenshot({path:'mobile-v65.png',fullPage:false});await c.close();}
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await desktop(b);await mobile(b);await b.close();for(const f of['desktop-v53.png','mobile-v65.png'])assert.ok(fs.statSync(f).size>10000,f);console.log('PASS: live desktop v53 + native cinematic mobile v65 are current and interactive.');})().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Upload live MAG captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mag-v53-v65-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/mag-live/desktop-v53.png
            ${{ runner.temp }}/mag-live/mobile-v65.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish current MAG visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live desktop v53 + native cinematic mobile v65 visual passed'; else state=failure; description='Live production MAG visual or interaction failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live MAG v53-v65' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
