name: Verify live true 3D MAG visual
run-name: Capture native WebGL2 reference crystal v26 for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  capture-live-mag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium capture runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mag-visual"
          cd "$RUNNER_TEMP/mag-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture and measure live reference core v26
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mag-visual"
          node <<'NODE'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const fs = require('node:fs');

          function imageMetrics(file, region) {
            const png = PNG.sync.read(fs.readFileSync(file));
            const x0 = Math.max(0, region.x0), y0 = Math.max(0, region.y0);
            const x1 = Math.min(png.width, region.x1), y1 = Math.min(png.height, region.y1);
            let pixels = 0, luminance = 0, bright = 0, saturated = 0, cyanViolet = 0;
            for (let y = y0; y < y1; y += 1) for (let x = x0; x < x1; x += 1) {
              const o = (y * png.width + x) << 2;
              const r = png.data[o] / 255, g = png.data[o + 1] / 255, b = png.data[o + 2] / 255;
              const l = .2126 * r + .7152 * g + .0722 * b;
              const maximum = Math.max(r, g, b), minimum = Math.min(r, g, b);
              const sat = maximum ? (maximum - minimum) / maximum : 0;
              pixels += 1; luminance += l;
              if (l > .36) bright += 1;
              if (sat > .45 && l > .06) saturated += 1;
              if ((b > r * 1.18 && g > r * 1.08 && l > .07) || (b > g * 1.10 && r > g * .72 && l > .07)) cyanViolet += 1;
            }
            return {
              pixels,
              mean_luminance: luminance / pixels,
              bright_fraction: bright / pixels,
              saturated_fraction: saturated / pixels,
              cyan_violet_fraction: cyanViolet / pixels
            };
          }

          async function capture(browser, config) {
            const context = await browser.newContext({
              viewport: config.viewport,
              deviceScaleFactor: 1,
              isMobile: config.mobile,
              hasTouch: config.mobile,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            const consoleErrors = [];
            page.on('pageerror', error => consoleErrors.push(String(error)));
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            await page.goto(`https://www.formatxsuite.com/?reference_v26=${process.env.RUN_ID}&capture=${config.name}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.evaluate(() => {
              document.documentElement.lang = 'hu';
              document.documentElement.classList.add('fx-intro-complete');
              document.getElementById('formatx-event-horizon')?.remove();
              scrollTo(0, 0);
            });
            await page.waitForFunction(() => document.documentElement.dataset.fxReferenceCore === 'ready-v26', null, { timeout: 60000 });
            await page.waitForFunction(() => document.querySelector('.fx-reference-core-v26-canvas') instanceof HTMLCanvasElement, null, { timeout: 10000 });
            await page.waitForTimeout(1600);
            const runtime = await page.evaluate(() => {
              const root = document.documentElement;
              const canvas = document.querySelector('.fx-reference-core-v26-canvas');
              const stage = document.querySelector('.fx-reference-core-v26-stage');
              const rect = canvas?.getBoundingClientRect();
              let webgl2 = false;
              try { webgl2 = Boolean(canvas?.getContext('webgl2')); } catch (_) {}
              return {
                reference: root.dataset.fxReferenceCore,
                revision: root.dataset.fxCoreReal3dRevision,
                renderer: root.dataset.fxCoreRendererRevision,
                geometry: root.dataset.fxReferenceCoreGeometry,
                depth: root.dataset.fxReferenceCoreDepth,
                animation: root.dataset.fxReferenceCoreAnimation,
                pixels: root.dataset.fxReferenceCorePixels,
                renderScale: root.dataset.fxReferenceCoreRenderScale || 'initial',
                webgl2,
                stageActive: stage?.dataset.active,
                canvas: rect ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height } : null,
                referenceStages: document.querySelectorAll('.fx-reference-core-v26-stage').length,
                legacyStages: document.querySelectorAll('.fx-core-real3d-stage').length,
                oldMeshStages: document.querySelectorAll('.fx-core-mesh3d-stage').length,
                oldFractureStages: document.querySelectorAll('.fx-core-fracture3d-stage').length
              };
            });
            const file = `reference-core-v26-${config.name}.png`;
            await page.screenshot({ path: file, fullPage: false });
            const metrics = imageMetrics(file, config.region);
            fs.writeFileSync(`reference-core-v26-${config.name}.json`, JSON.stringify({ runtime, metrics, consoleErrors }, null, 2));
            await context.close();

            const runtimeOk = runtime.reference === 'ready-v26'
              && runtime.revision === 'ready-v26'
              && runtime.renderer === 'native-webgl2-reference-crystal-v26'
              && runtime.geometry === 'true-indexed-four-tip-concave-crystal'
              && runtime.depth === 'depth-buffer-perspective'
              && runtime.animation === 'independent-shell-reactor-orbits'
              && runtime.webgl2
              && runtime.stageActive === 'true'
              && runtime.referenceStages === 1
              && runtime.legacyStages === 0
              && runtime.oldMeshStages === 0
              && runtime.oldFractureStages === 0
              && runtime.canvas?.width >= config.viewport.width - 2
              && runtime.canvas?.height >= config.viewport.height - 2;
            const visualOk = metrics.mean_luminance >= .025 && metrics.mean_luminance <= .45
              && metrics.bright_fraction >= .0015
              && metrics.saturated_fraction >= .018
              && metrics.cyan_violet_fraction >= .012;
            if (!runtimeOk || !visualOk || consoleErrors.length) {
              throw new Error(`${config.name} v26 visual gate failed: ${JSON.stringify({ runtime, metrics, consoleErrors })}`);
            }
            return { runtime, metrics };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader']
            });
            const mobile = await capture(browser, {
              name: 'mobile', mobile: true,
              viewport: { width: 753, height: 1536 },
              region: { x0: 25, y0: 170, x1: 728, y1: 1190 }
            });
            const desktop = await capture(browser, {
              name: 'desktop', mobile: false,
              viewport: { width: 1440, height: 1000 },
              region: { x0: 620, y0: 100, x1: 1400, y1: 930 }
            });
            fs.writeFileSync('reference-core-v26-summary.json', JSON.stringify({ mobile, desktop }, null, 2));
            console.log('V26_EVIDENCE', JSON.stringify({ mobile, desktop }));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload v26 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-native-webgl2-reference-core-v26-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mag-visual/reference-core-v26-mobile.png
            ${{ runner.temp }}/mag-visual/reference-core-v26-desktop.png
            ${{ runner.temp }}/mag-visual/reference-core-v26-mobile.json
            ${{ runner.temp }}/mag-visual/reference-core-v26-desktop.json
            ${{ runner.temp }}/mag-visual/reference-core-v26-summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish visual capture status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Native WebGL2 reference crystal v26 passed mobile and desktop live visual gates'
          else
            state=failure
            description='Native WebGL2 reference crystal v26 failed live visual gate'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live true 3D MAG visual' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
