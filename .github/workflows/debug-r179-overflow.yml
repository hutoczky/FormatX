name: Debug r179 desktop overflow
on:
  push:
    branches: [master]
    paths: ['.github/workflows/debug-r179-overflow.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Find overflow offenders
        run: |
          cat > debug.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});const c=await b.newContext({viewport:{width:1600,height:1000},deviceScaleFactor:1});const p=await c.newPage();await p.goto('https://formatxsuite.com/?debug_r179='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>document.documentElement.dataset.fxSotyContinuityR179==='r179-soty-organ-field-continuity',{timeout:60000});await p.waitForTimeout(400);const out=await p.evaluate(()=>{const vw=document.documentElement.clientWidth;const list=[];for(const e of document.querySelectorAll('body *')){const s=getComputedStyle(e);if(s.display==='none'||s.visibility==='hidden')continue;const r=e.getBoundingClientRect();if(!Number.isFinite(r.left)||!Number.isFinite(r.right)||r.width<1)continue;if(r.right>vw+2||r.left<-2){list.push({tag:e.tagName,id:e.id,cls:String(e.className||'').slice(0,180),left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),position:s.position,overflowX:s.overflowX,transform:s.transform});}}return{vw,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,offenders:list.sort((a,b)=>(b.right-vw)-(a.right-vw)).slice(0,60)}});console.log(JSON.stringify(out,null,2));await p.screenshot({path:'r179-overflow.png',fullPage:false,animations:'disabled',timeout:120000});await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node debug.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r179-overflow-${{ github.run_id }}
          path: r179-overflow.png
          if-no-files-found: warn
          retention-days: 3
