# Triggered after workflow registration on master.
name: One-shot r407 static first-paint parity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r406-static-first-paint.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lock static homepage to production first-paint geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')
          marker = 'data-fx-production-first-paint-r370="true"'
          link = '  <link rel="stylesheet" fetchpriority="high" media="(max-width: 900px), (pointer: coarse), (max-aspect-ratio: 27/25)" data-fx-mobile-first-paint-r358="true" data-fx-production-first-paint-r370="true" href="/scifi-ui/styles/formatx-mobile-first-paint-r358.css?v=20260827-r407-static-parity">\n'
          anchor = '  <link rel="stylesheet" data-fx-critical-core-r227="true"'
          if marker not in text:
              if anchor not in text:
                  raise SystemExit('critical-core anchor missing from index.html')
              text = text.replace(anchor, link + anchor, 1)
              index.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/validate-mobile-intro-recovery.yml')
          body = workflow.read_text(encoding='utf-8')
          old = "          grep -Fq '20260811-mobile-intro-direct-r1' docs/scifi-ui/index.html\n"
          new = (
              "          grep -Fq 'data-fx-intro=' docs/scifi-ui/index.html\n"
              "          grep -Fq 'formatx-event-horizon.js' docs/scifi-ui/index.html\n"
              "          grep -Fq 'data-fx-production-first-paint-r370=\"true\"' docs/scifi-ui/index.html\n"
          )
          if old in body:
              body = body.replace(old, new, 1)
          elif "grep -Fq 'data-fx-production-first-paint-r370=\"true\"' docs/scifi-ui/index.html" not in body:
              raise SystemExit('mobile intro validator is neither legacy nor r407 current')
          workflow.write_text(body, encoding='utf-8')

          Path('.github/workflows/one-shot-r406-static-first-paint.yml').unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/workflows/validate-mobile-intro-recovery.yml .github/workflows/one-shot-r406-static-first-paint.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Lock r407 static mobile first paint to production geometry'
          git push origin HEAD:master
