# Integration trigger revision 2
name: Apply FormatX Reality Fork Capsule

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-reality-fork-capsule.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ github.token }}

      - name: Bind Reality Fork Capsule to Operational Twin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('docs/scifi-ui/project-simulator.html')
          html = html_path.read_text(encoding='utf-8')

          css_link = '  <link rel="stylesheet" href="./styles/reality-fork-capsule.css?v=20260728-reality-fork-1">'
          if css_link not in html:
              anchor = '  <link rel="stylesheet" data-fx-design-system="true" href="./styles/formatx-design-system.css?v=20260728-ds2">'
              if anchor not in html:
                  raise SystemExit('Design System stylesheet anchor missing')
              html = html.replace(anchor, anchor + '\n' + css_link, 1)

          old_script = '  <script defer src="./scripts/project-simulator.js?v=20260728-operational-twin-1"></script>'
          new_script = '  <script defer src="./scripts/project-simulator.js?v=20260728-operational-twin-2"></script>'
          html = html.replace(old_script, new_script, 1)
          feature_script = '  <script defer src="./scripts/reality-fork-capsule.js?v=20260728-reality-fork-1"></script>'
          if feature_script not in html:
              if new_script not in html:
                  raise SystemExit('Operational Twin script anchor missing')
              html = html.replace(new_script, new_script + '\n' + feature_script, 1)

          html_path.write_text(html, encoding='utf-8')

          js_path = Path('docs/scifi-ui/scripts/project-simulator.js')
          js = js_path.read_text(encoding='utf-8')
          old_marker = "  root.dataset.projectSimulator = 'operational-twin-v1';"
          new_marker = "  root.dataset.projectSimulator = 'operational-twin-v2';"
          api_marker = 'window.FormatXOperationalTwin = Object.freeze'
          if api_marker not in js:
              if old_marker not in js:
                  raise SystemExit('Operational Twin final marker missing')
              api = '''  window.FormatXOperationalTwin = Object.freeze({
    version: 'operational-twin-v2',
    getReport: function () {
      return state.report ? JSON.parse(JSON.stringify(state.report)) : null;
    },
    getConfiguration: function () {
      return {
        language: state.language,
        scenario: state.scenario,
        platform: state.platform,
        targetIndex: state.targetIndex,
        running: state.running,
        simulatorState: root.dataset.simulatorState || 'idle',
        project: scenario().name[state.language],
        platformName: platform().name[state.language],
        target: target().name
      };
    }
  });
  document.dispatchEvent(new CustomEvent('formatx:operational-twin-ready'));
'''
              js = js.replace(old_marker, api + new_marker, 1)
          else:
              js = js.replace(old_marker, new_marker)
          js_path.write_text(js, encoding='utf-8')

          assert 'reality-fork-capsule.css?v=20260728-reality-fork-1' in html
          assert 'reality-fork-capsule.js?v=20260728-reality-fork-1' in html
          assert 'operational-twin-v2' in js
          assert api_marker in js
          PY

      - name: Validate syntax and integration
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/project-simulator.js
          node --check docs/scifi-ui/scripts/reality-fork-capsule.js
          grep -Fq 'reality-fork-capsule.css?v=20260728-reality-fork-1' docs/scifi-ui/project-simulator.html
          grep -Fq 'reality-fork-capsule.js?v=20260728-reality-fork-1' docs/scifi-ui/project-simulator.html
          grep -Fq 'FormatXOperationalTwin' docs/scifi-ui/scripts/project-simulator.js

      - name: Commit Reality Fork Capsule integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Reality Fork Capsule already integrated.'
            exit 0
          fi
          git config user.name 'FormatX Reality Fork Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/project-simulator.html docs/scifi-ui/scripts/project-simulator.js
          git commit -m 'Integrate proof-carrying Reality Fork Capsule'
          git push origin HEAD:master
