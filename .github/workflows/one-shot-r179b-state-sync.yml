name: One-shot publish r179b state sync
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r179b-state-sync.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Synchronize r179 runtime state with CSS and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js=Path('docs/scifi-ui/scripts/formatx-soty-continuity-r179.js')
          s=js.read_text()
          s=s.replace("if(root.dataset.fxSotyContinuityR179===VERSION)return;","if(root.dataset.fxSotyContinuityR179==='ready'&&root.dataset.fxSotyVersionR179===VERSION)return;")
          s=s.replace("root.dataset.fxSotyContinuityR179='audit-skip';\n  root.dataset.fxSotyModeR179='audit-skip';","root.dataset.fxSotyContinuityR179='audit-skip';\n  root.dataset.fxSotyVersionR179=VERSION;\n  root.dataset.fxSotyModeR179='audit-skip';")
          s=s.replace("root.dataset.fxSotyContinuityR179='booting';","root.dataset.fxSotyContinuityR179='booting';\nroot.dataset.fxSotyVersionR179=VERSION;",1)
          old="root.dataset.fxSotyContinuityR179=VERSION;\n  root.dataset.fxSotyActiveOrganR179=organ.id;"
          new="root.dataset.fxSotyContinuityR179='ready';\n  root.dataset.fxSotyVersionR179=VERSION;\n  root.dataset.fxSotyActiveOrganR179=organ.id;"
          if old not in s: raise SystemExit('paint state anchor missing')
          s=s.replace(old,new,1)
          old2="root.dataset.fxSotyContinuityR179='ready';\n  root.dataset.fxSotySystemR179='core-nerves-organs-heart-skeleton-beacon';"
          new2="root.dataset.fxSotyContinuityR179='ready';\n  root.dataset.fxSotyVersionR179=VERSION;\n  root.dataset.fxSotySystemR179='core-nerves-organs-heart-skeleton-beacon';"
          if old2 not in s: raise SystemExit('start state anchor missing')
          s=s.replace(old2,new2,1)
          js.write_text(s)

          p=Path('docs/scifi-ui/index.html')
          html=p.read_text()
          oldq='formatx-soty-continuity-r179.js?v=20260816-r179-adaptive-continuity'
          newq='formatx-soty-continuity-r179.js?v=20260816-r179b-css-state-sync'
          if oldq in html: html=html.replace(oldq,newq,1)
          elif newq not in html: raise SystemExit('r179 JS cache token missing')
          p.write_text(html)
          PY
          node --check docs/scifi-ui/scripts/formatx-soty-continuity-r179.js
          grep -q "fxSotyVersionR179=VERSION" docs/scifi-ui/scripts/formatx-soty-continuity-r179.js
          grep -q "formatx-soty-continuity-r179.js?v=20260816-r179b-css-state-sync" docs/scifi-ui/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-soty-continuity-r179.js docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r179b already current'; exit 0; fi
          git commit -m '[deploy-production] fix(soty): keep r179 visual continuity state active'
          git push origin HEAD:master
