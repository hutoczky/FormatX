name: One-shot publish r163 heading seam bridge
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r163-heading-seam-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Blend MAG heading guard into page atmosphere
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css=Path('docs/scifi-ui/styles/formatx-seamless-living-r158.css')
          s=css.read_text()
          old='background:linear-gradient(180deg,rgba(1,7,17,0),rgba(1,7,17,.50) 48%,rgba(1,7,17,.92) 86%,#010711 100%)!important;'
          new='background:linear-gradient(180deg,rgba(4,13,30,0) 0%,rgba(4,13,30,.18) 42%,rgba(4,13,30,.62) 78%,#040d1e 100%)!important;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('heading guard gradient not found')
          css.write_text(s)

          heartbeat=Path('docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js')
          h=heartbeat.read_text()
          h,n=re.subn(
              r"const SEAMLESS='/scifi-ui/styles/formatx-seamless-living-r158\.css\?v=[^']+';",
              "const SEAMLESS='/scifi-ui/styles/formatx-seamless-living-r158.css?v=20260815-r163-heading-seam-bridge';",
              h,count=1
          )
          if n!=1 and '20260815-r163-heading-seam-bridge' not in h:
              raise SystemExit('heartbeat seamless loader token not found')
          heartbeat.write_text(h)

          index=Path('docs/scifi-ui/index.html')
          i=index.read_text()
          i,n=re.subn(
              r'(formatx-live-heartbeat-r155\.js\?v=20260815-r158-lubdub-seamless&rev=)[^"\']+',
              r'\g<1>20260815-r163-heading-seam-bridge',i,count=1
          )
          if n!=1:
              raise SystemExit('heartbeat script cache URL not found')
          index.write_text(i)
          PY

          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node .github/scripts/validate-real3d-core.cjs
          grep -F '#040d1e 100%)!important;' docs/scifi-ui/styles/formatx-seamless-living-r158.css >/dev/null
          grep -F 'formatx-seamless-living-r158.css?v=20260815-r163-heading-seam-bridge' docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js >/dev/null
          grep -F 'formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r163-heading-seam-bridge' docs/scifi-ui/index.html >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-seamless-living-r158.css docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r163 already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r163 seamless heading bridge'
          git push origin HEAD:master
