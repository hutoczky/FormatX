name: One-shot publish r163 heading seam bridge
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r163-heading-seam-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Blend MAG heading guard into page atmosphere
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('docs/scifi-ui/styles/formatx-seamless-living-r158.css')
          s=css.read_text()
          old='background:linear-gradient(180deg,rgba(1,7,17,0),rgba(1,7,17,.50) 48%,rgba(1,7,17,.92) 86%,#010711 100%)!important;'
          new='background:linear-gradient(180deg,rgba(4,13,30,0) 0%,rgba(4,13,30,.18) 42%,rgba(4,13,30,.62) 78%,#040d1e 100%)!important;'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('heading guard gradient not found')
          css.write_text(s)

          boot=Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          b=boot.read_text()
          b,n=re.subn(r'formatx-seamless-living-r158\.css\?v=[^"\']+','formatx-seamless-living-r158.css?v=20260815-r163-heading-seam-bridge',b,count=1)
          if n!=1:raise SystemExit('seamless style cache URL not found')
          boot.write_text(b)

          index=Path('docs/scifi-ui/index.html')
          h=index.read_text()
          h,n=re.subn(r'(formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=)[^"\']+',r'\g<1>20260815-r163-heading-seam-bridge',h,count=1)
          if n!=1:raise SystemExit('bootstrap cache URL not found')
          index.write_text(h)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=re.sub(r'formatx-seamless-living-r158\.css\?v=[^"\']+','formatx-seamless-living-r158.css?v=20260815-r163-heading-seam-bridge',v)
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-seamless-living-r158.css docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r163 already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r163 seamless heading bridge'
          git push origin HEAD:master
