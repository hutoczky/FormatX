name: One-shot publish r180b mobile style guard

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r180b-mobile-styleguard-cache.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump r180b finalizer cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          old='./scripts/formatx-mobile-ui-finalizer-r180.js?v=20260816-r180-inline-lock'
          new='./scripts/formatx-mobile-ui-finalizer-r180.js?v=20260816-r180b-style-guard'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('r180 finalizer URL not found')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-mobile-ui-finalizer-r180.js
          git rm .github/workflows/one-shot-r180b-mobile-styleguard-cache.yml
          git commit -m '[deploy-production] fix(mobile): publish r180b self-healing style guard'
          git push origin HEAD:master
