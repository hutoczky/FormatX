name: R2105 permanent MAG genuine 3D sapphire/iris proof

on:
  push:
    branches:
      - feature/r2107-master-sculpted-mag-optics
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-r2105-native-iris.cjs'
      - '.github/workflows/verify-r2105-native-iris.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2105-real-physical-native-optics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-hero-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure all native renderer JavaScript is parseable
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js
          node --check docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check .github/scripts/validate-r2105-native-iris.cjs
      - name: Install Chrome-equivalent Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native-mag" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/native-mag/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run original local production site
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > /tmp/r2105-native-http.log 2>&1 &
          for count in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/r2105-native-http.log
          exit 1
      - name: Check real desktop and phone R326 WebGL optic after original ten-second film
        env:
          NODE_PATH: ${{ runner.temp }}/native-mag/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-r2105-native-iris.cjs
      - name: Preserve physical-optic browser screenshots and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2105-original-mag-3d-sapphire-proof
          path: artifacts/r2105-native-physical-optics/
          retention-days: 21
          if-no-files-found: warn
