name: One-shot publish r180 mobile UI finalizer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r180-mobile-ui-finalizer.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r180 mobile UI finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          tag='  <script defer data-fx-mobile-ui-finalizer-r180="true" src="./scripts/formatx-mobile-ui-finalizer-r180.js?v=20260816-r180-inline-lock"></script>\n'
          if 'data-fx-mobile-ui-finalizer-r180="true"' not in s:
              anchor='  <script defer data-fx-soty-continuity-r179="true" src="./scripts/formatx-soty-continuity-r179.js?v=20260816-r179-adaptive-continuity"></script>\n'
              if anchor not in s: raise SystemExit('r179 SOTY script anchor not found')
              s=s.replace(anchor,anchor+tag,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-mobile-ui-finalizer-r180.js
          git rm .github/workflows/one-shot-r180-mobile-ui-finalizer.yml
          git commit -m '[deploy-production] fix(mobile): publish r180 final control alignment'
          git push origin HEAD:master
