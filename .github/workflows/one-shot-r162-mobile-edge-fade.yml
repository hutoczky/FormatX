name: One-shot publish r162 mobile reference edge fade
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r162-mobile-edge-fade.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Soften mobile bitmap boundary without touching crystal geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          detail=Path('docs/scifi-ui/scripts/formatx-core-detail-overlay-r122.js')
          s=detail.read_text()
          replacements={
            'const edge=Math.pow(Math.max(nx,ny),2.2);':'const edge=Math.pow(Math.max(nx,ny),desktopKey?2.2:1.62);',
            'const edgeFloor=desktopKey ? .16 : .27;':'const edgeFloor=desktopKey ? .16 : .02;',
            'const edgeStrength=desktopKey ? .78 : .68;':'const edgeStrength=desktopKey ? .78 : .96;',
            "root.dataset.fxCoreReferenceKeyR160=desktopKey?'desktop-edge-alpha':'mobile-gentle-edge-alpha';":"root.dataset.fxCoreReferenceKeyR160=desktopKey?'desktop-edge-alpha':'mobile-soft-edge-alpha-r162';"
          }
          for old,new in replacements.items():
              if old in s:s=s.replace(old,new,1)
              elif new not in s:raise SystemExit('missing detail token: '+old)
          detail.write_text(s)

          boot=Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          b=boot.read_text()
          old='formatx-core-detail-overlay-r122.js?v=20260815-r160-cross-device-alpha-key'
          new='formatx-core-detail-overlay-r122.js?v=20260815-r162-mobile-edge-fade'
          if old in b:b=b.replace(old,new,1)
          elif new not in b:raise SystemExit('detail cache token not found')
          boot.write_text(b)

          index=Path('docs/scifi-ui/index.html')
          h=index.read_text()
          h,n=re.subn(r'(formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=)[^"\']+',r'\g<1>20260815-r162-mobile-edge-fade',h,count=1)
          if n!=1:raise SystemExit('bootstrap cache URL not found')
          index.write_text(h)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=v.replace('formatx-core-detail-overlay-r122.js?v=20260815-r160-cross-device-alpha-key','formatx-core-detail-overlay-r122.js?v=20260815-r162-mobile-edge-fade')
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-core-detail-overlay-r122.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-core-detail-overlay-r122.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r162 already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r162 mobile bitmap edge fade'
          git push origin HEAD:master
