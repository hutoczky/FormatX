name: Prove R519 semantic R482 validator candidate v2
run-name: R519 semantic verifier v2 against exact R516 production

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/build-r519-r482-semantic-candidate-v2.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
      CANDIDATE_BRANCH: p0-r519-r482-candidate
      ORIGIN: https://formatxsuite.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate semantic R482 legacy workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/workflows/verify-r481-live-mag.yml <<'YAML'
          name: Verify current semantic live MAG (legacy R482 gate)
          run-name: Current semantic mobile + desktop MAG verification for ${{ github.sha }}
          on:
            push:
              branches: [master]
              paths:
                - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
                - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
                - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
                - '.github/workflows/verify-r481-live-mag.yml'
                - 'docs/p0-validation-version.txt'
            workflow_dispatch:
          permissions:
            contents: read
            statuses: write
          concurrency:
            group: r482-live-mag-${{ github.ref }}
            cancel-in-progress: true
          jobs:
            live-r482-mag:
              if: >-
                github.event_name == 'workflow_dispatch' ||
                (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - name: Check out audited revision
                  uses: actions/checkout@v5
                - name: Wait for exact deployed P0 marker
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    origin='https://formatxsuite.com'
                    for attempt in $(seq 1 90); do
                      if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$origin/p0-validation-version.txt?r482_wait=${GITHUB_RUN_ID}_${attempt}" -o "$RUNNER_TEMP/live-p0.txt"; then
                        if cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then echo 'Exact source P0 marker is live.'; exit 0; fi
                      fi
                      sleep 10
                    done
                    exit 1
                - name: Install lightweight real-browser verifier
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    npm install --no-save --ignore-scripts playwright-core@1.62.0
                    command -v google-chrome
                - name: Verify current live MAG semantic invariants with real interactions
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    node <<'NODE'
                    const assert=require('node:assert/strict');
                    const {chromium}=require('playwright-core');
                    const cp=require('node:child_process');
                    const chrome=cp.execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
                    async function verify(browser,name,viewport,mobile){
                      const context=await browser.newContext({viewport,deviceScaleFactor:mobile?2:1,isMobile:mobile,hasTouch:mobile,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
                      const page=await context.newPage(); const errors=[]; const failed=[];
                      page.on('pageerror',e=>errors.push(String(e)));
                      page.on('console',m=>{const t=m.text();if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(t))errors.push(t)});
                      page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
                      await page.goto(`https://formatxsuite.com/?verify=current-semantic-mag-${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
                      const target=page.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();
                      await target.waitFor({state:'visible',timeout:30000}); const tb=await target.boundingBox(); assert.ok(tb&&tb.width>=16&&tb.height>=16); await page.mouse.click(tb.x+tb.width/2,tb.y+tb.height/2);
                      await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready'&&document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length===1,null,{timeout:45000});
                      async function state(){return page.evaluate(()=>{const root=document.documentElement;const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');const s=canvas?getComputedStyle(canvas):null;const r=canvas?.getBoundingClientRect();const header=document.querySelector('.topbar .fx-reference-mag-button');const hs=header?getComputedStyle(header):null;const hr=header?.getBoundingClientRect();const link=document.querySelector('link[data-fx-mag-living-balance-r481]');return{renderer:root.dataset.fxCoreRenderer||'',sync:root.dataset.fxMagShapeSyncR476||'',lifeContract:root.dataset.fxPrimaryMagLifeContractR482||'',optics:root.dataset.fxPrimaryMagOpticsR482||'',scheduler:root.dataset.fxCoreScheduler||'',idle:root.dataset.fxCoreIdleRenderR441||'',balanceHref:link?.href||'',rect:r?{w:r.width,h:r.height}:null,display:s?.display||'',visibility:s?.visibility||'',opacity:Number(s?.opacity||0),animations:canvas?.getAnimations().map(a=>({name:a.animationName,currentTime:typeof a.currentTime==='number'?a.currentTime:null,playState:a.playState,pending:a.pending}))||[],headerVisible:Boolean(header&&hs&&hr&&hs.display!=='none'&&hs.visibility!=='hidden'&&Number(hs.opacity)>.2&&hr.width>=40&&hr.height>=40),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,pause:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||''};});}
                      await page.waitForTimeout(700); const initial=await state();
                      assert.equal(initial.renderer,'single-webgl-crystal-organism-r326'); assert.match(initial.sync,/^ready-r\d+$/); assert.equal(initial.lifeContract,'large-mini-header-spectrum-breath-zero-webgl-idle'); assert.equal(initial.optics,'restrained-soft-spectrum-mobile-edge'); assert.equal(initial.scheduler,'interaction-bursts-idle-zero-frame-r441'); assert.equal(initial.idle,'zero-frame'); assert.ok(new URL(initial.balanceHref).pathname.endsWith('/scifi-ui/styles/formatx-mag-living-balance-r481.css')); assert.ok(initial.rect&&initial.rect.w>120&&initial.rect.h>180); assert.notEqual(initial.display,'none'); assert.notEqual(initial.visibility,'hidden'); assert.ok(initial.opacity>.2); assert.ok(initial.headerVisible); assert.ok(initial.overflow<=2);
                      const samples=[];for(let i=0;i<4;i++){samples.push(await state());await page.waitForTimeout(420)}
                      const ops=samples.map(x=>x.opacity);const opacitySpan=Math.max(...ops)-Math.min(...ops);const times=samples.flatMap(x=>x.animations.map(a=>a.currentTime)).filter(Number.isFinite);const timeSpan=times.length?Math.max(...times)-Math.min(...times):0;assert.ok(opacitySpan>.004||timeSpan>50,JSON.stringify({opacitySpan,timeSpan}));
                      const pause=page.locator('#hero .fx-reference-pause').first();await pause.waitFor({state:'visible',timeout:10000});const pb=await pause.boundingBox();assert.ok(pb);await page.mouse.click(pb.x+pb.width/2,pb.y+pb.height/2);await page.waitForTimeout(250);const p1=await state();await page.waitForTimeout(650);const p2=await state();assert.equal(p2.pause,'true');const pa=p1.animations.find(a=>Number.isFinite(a.currentTime));const pb2=p2.animations.find(a=>a.name===pa?.name&&Number.isFinite(a.currentTime));if(pa&&pb2)assert.ok(Math.abs(pb2.currentTime-pa.currentTime)<80);
                      await page.mouse.click(pb.x+pb.width/2,pb.y+pb.height/2);await page.waitForTimeout(250);const r1=await state();await page.waitForTimeout(500);const r2=await state();assert.equal(r2.pause,'false');const ra=r1.animations.find(a=>Number.isFinite(a.currentTime));const rb=r2.animations.find(a=>a.name===ra?.name&&Number.isFinite(a.currentTime));if(ra&&rb)assert.ok(rb.currentTime-ra.currentTime>16);
                      const ask=page.locator('#hero .fx-reference-ask').first();await ask.waitFor({state:'visible',timeout:10000});const ab=await ask.boundingBox();assert.ok(ab&&ab.width>=44&&ab.height>=44);await page.mouse.click(ab.x+ab.width/2,ab.y+ab.height/2);await page.waitForTimeout(200);assert.equal(errors.length,0,errors.join(' | '));assert.equal(failed.length,0,failed.join(' | '));console.log(`PASS ${name}`,JSON.stringify({initial,opacitySpan,timeSpan,ask:{w:ab.width,h:ab.height}},null,2));await context.close();
                    }
                    (async()=>{const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await verify(browser,'mobile-390x844',{width:390,height:844},true);await verify(browser,'desktop-1440x900',{width:1440,height:900},false);await browser.close();console.log('R519_CURRENT_SEMANTIC_R482_PASS');})().catch(e=>{console.error(e);process.exit(1)});
                    NODE
                - name: Publish R482 live MAG status
                  if: always()
                  env:
                    GH_TOKEN: ${{ github.token }}
                    JOB_STATUS: ${{ job.status }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    if [[ "$JOB_STATUS" == success ]]; then state=success; description='Current semantic MAG activation, motion, pause/resume and ASK passed'; else state=failure; description='Current semantic MAG verification failed'; fi
                    gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX R482 live MAG' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          YAML
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/verify-r481-live-mag.yml'); puts 'R519_WORKFLOW_YAML_PASS'"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/verify-r481-live-mag.yml').read_text()
          assert "ready-r482'" not in s
          assert 'r482-spectrum-soft-edge/' not in s
          assert 'target.waitFor' in s and '#hero .fx-reference-pause' in s and '#hero .fx-reference-ask' in s
          print('R519_NO_STALE_IMPLEMENTATION_ASSERTION_PASS')
          PY
      - name: Install lightweight runner Chrome driver
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.62.0
          command -v google-chrome
      - name: Confirm exact R516 production marker
        run: |
          curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?r519v2=$GITHUB_RUN_ID" -o /tmp/marker.txt
          cmp -s docs/p0-validation-version.txt /tmp/marker.txt
      - name: Execute exact intended verifier JS against real production
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          s=Path('.github/workflows/verify-r481-live-mag.yml').read_text()
          matches=re.findall(r"node <<'NODE'\n(.*?)\n\s*NODE",s,re.S)
          assert len(matches)==1, len(matches)
          Path('/tmp/r519.cjs').write_text(textwrap.dedent(matches[0])+'\n',encoding='utf-8')
          PY
          node /tmp/r519.cjs | tee /tmp/r519.log
          grep -Fq 'R519_CURRENT_SEMANTIC_R482_PASS' /tmp/r519.log
      - name: Commit proven validator candidate
        run: |
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add .github/workflows/verify-r481-live-mag.yml
          git commit -m 'Modernize R482 legacy gate to current semantic MAG'
          git push --force-with-lease origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
