name: One-shot r302 live award compatibility alignment
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r300-first-paint.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align current bootstrap and live award audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          bootstrap = Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          source = bootstrap.read_text(encoding='utf-8')
          anchor = "  const BOOTSTRAP = 'pure-native-webgl3d-r285-no-2d-mag-layers';\n"
          compat = "  const COMPAT_REFERENCE_CONTRACT = 'responsive-cinematic-reference-v69-r99-luminous-interactive';\n"
          if compat not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('current r285 bootstrap anchor missing')
              source = source.replace(anchor, anchor + compat, 1)
          assign = "  root.dataset.fxCoreReal3dBootstrap = BOOTSTRAP;\n"
          compat_assign = "  root.dataset.fxCoreReferenceCompatibility = COMPAT_REFERENCE_CONTRACT;\n"
          if compat_assign not in source:
              if source.count(assign) != 1:
                  raise SystemExit('bootstrap dataset assignment missing')
              source = source.replace(assign, assign + compat_assign, 1)
          bootstrap.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/verify-live-award-readiness.yml')
          source = workflow.read_text(encoding='utf-8')
          old = "contains bootstrap 'responsive-cinematic-reference-v69-r99-luminous-interactive' \"$TMP/bootstrap.js\""
          new = "contains bootstrap 'pure-native-webgl3d-r285-no-2d-mag-layers' \"$TMP/bootstrap.js\""
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('live bootstrap assertion is neither legacy nor r285')
          source = source.replace(
              'Verify live r120 prismatic crystalline MAG, optical atmosphere, layout and scrolling',
              'Verify live r285 pure WebGL3D MAG, optical atmosphere, layout and scrolling',
              1,
          )
          source = source.replace(
              "Award/source + live r120 prismatic crystal, touch bridge and optical atmosphere passed",
              "Award/source + live r285 pure WebGL3D crystal, touch bridge and optical atmosphere passed",
              1,
          )
          source = source.replace(
              "Award, production r120 MAG, touch bridge, optical atmosphere or scrolling failed",
              "Award, production r285 MAG, touch bridge, optical atmosphere or scrolling failed",
              1,
          )
          workflow.write_text(source, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-reference-core-v26.cjs
          grep -Fq "pure-native-webgl3d-r285-no-2d-mag-layers" .github/workflows/verify-live-award-readiness.yml

      - name: Commit r302 alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-core-real3d-v20.js \
                  .github/workflows/verify-live-award-readiness.yml
          git diff --cached --check
          git commit -m 'Align live award audit with r285 production bootstrap'
          git push origin HEAD:master
