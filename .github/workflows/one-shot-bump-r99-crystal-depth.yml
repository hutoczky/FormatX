name: One-shot publish r166 living crystal shape pulse
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r166 heartbeat-driven silhouette cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          boot=Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          s=boot.read_text()
          old='formatx-core-detail-overlay-r122.js?v=20260815-r162-mobile-edge-fade'
          new='formatx-core-detail-overlay-r122.js?v=20260815-r166-heartbeat-shape-pulse'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('detail overlay cache token not found')
          boot.write_text(s)

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          target='./scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260815-r166-heartbeat-shape-pulse'
          html,n=re.subn(r'\.\/scripts\/formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=[^"\']+',target,html,count=1)
          if n!=1: raise SystemExit('FormatX real3d bootstrap URL not found exactly once')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=v.replace('formatx-core-detail-overlay-r122.js?v=20260815-r162-mobile-edge-fade','formatx-core-detail-overlay-r122.js?v=20260815-r166-heartbeat-shape-pulse',1)
          marker="for(const source of [bootstrap,heartbeat,detail,mobileStability,wrapper,renderer,layout,flow,contentFinalizer,livingRendering,tailFinalizer,gyro])new Function(source);"
          shape_assert="for(const token of ['heartbeatShape','fxLivingHeartbeatBeatR158','fxLivingShapePulseR166','fxLivingShapeBeatR166','heartbeat-driven-four-tip-breathing','reference-material-interactive-seamless-shape-pulse'])assert.ok(detail.includes(token),`missing r166 shape-pulse token: ${token}`);\n"
          if shape_assert not in v:
              if marker not in v: raise SystemExit('validator insertion marker not found')
              v=v.replace(marker,shape_assert+marker,1)
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-core-detail-overlay-r122.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r166 shape pulse cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): publish r166 heartbeat-driven silhouette pulse'
          git push origin HEAD:master
