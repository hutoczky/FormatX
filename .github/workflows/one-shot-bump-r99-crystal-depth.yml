name: One-shot bump r99 crystal depth cache
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump production faceted crystal r111 bootstrap cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/scifi-ui/index.html')
          s = p.read_text()
          old = './scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260814-dark-refractive-r110'
          new = './scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260814-faceted-crystal-r111'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('expected r110 dark refractive bootstrap cache key not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then
            echo 'cache key already current'
            exit 0
          fi
          git commit -m '[deploy-production] fix(mag): publish faceted crystal r111 bootstrap'
          git push origin HEAD:master
