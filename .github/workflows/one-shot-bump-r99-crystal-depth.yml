name: One-shot publish r185b real MAG hit layer
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r185b hit-tested MAG layer with fresh site cache
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          python3 - <<'PY'
          from pathlib import Path
          import re

          style=Path('docs/scifi-ui/styles/formatx-signature-system-r185.css')
          s=style.read_text()
          s=s.replace('#hero .hero-space{position:relative}\n#hero .fx-signature-core-trigger{','#hero{position:relative}\n#hero>.fx-signature-core-trigger{')
          old='position:absolute;z-index:44;border:0;background:transparent;color:transparent;padding:0;margin:0;\n  min-width:44px;min-height:44px;cursor:pointer;border-radius:50%;touch-action:manipulation;\n  -webkit-tap-highlight-color:transparent;'
          new='position:absolute;z-index:420;pointer-events:auto!important;isolation:isolate;border:0;background:transparent;color:transparent;padding:0;margin:0;\n  min-width:44px;min-height:44px;cursor:pointer;border-radius:50%;touch-action:manipulation;\n  clip-path:polygon(50% 1%,64% 31%,99% 50%,64% 69%,50% 99%,36% 69%,1% 50%,36% 31%);\n  -webkit-tap-highlight-color:transparent;'
          if old in s:s=s.replace(old,new,1)
          elif 'z-index:420' not in s:raise SystemExit('signature trigger property anchor not found')
          s=s.replace('#hero .fx-signature-core-trigger','#hero>.fx-signature-core-trigger')
          style.write_text(s)

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          html,n1=re.subn(r'formatx-signature-system-r185\.css\?v=[^"\']+','formatx-signature-system-r185.css?v=20260816-iconic-mag-r185b-hitlayer',html,count=1)
          html,n2=re.subn(r'formatx-signature-system-r185\.js\?v=[^"\']+','formatx-signature-system-r185.js?v=20260816-iconic-mag-r185b-hitlayer',html,count=1)
          if n1!=1 or n2!=1:raise SystemExit(f'signature asset cache anchors missing css={n1} js={n2}')
          index.write_text(html)
          PY
          node --check docs/scifi-ui/scripts/formatx-signature-system-r185.js
          node .github/scripts/validate-signature-system-r185.cjs
          node .github/scripts/validate-user-requested-site-features.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-signature-system-r185.css docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r185b hit layer already current'; exit 0; fi
          git commit -m '[deploy-production] fix(signature): publish r185b real MAG hit layer'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1
