name: One-shot publish r158 alive seamless MAG
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r158 heartbeat and seamless integration cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          # Fresh bootstrap request so both devices rebuild the complete MAG chain.
          boot='./scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260815-r158-alive-seamless'
          s,n=re.subn(r'\.\/scripts\/formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=[^"\']+',boot,s,count=1)
          if n!=1: raise SystemExit('FormatX real3d bootstrap URL not found exactly once')
          heartbeat='./scripts/formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless'
          s,n=re.subn(r'\.\/scripts\/formatx-live-heartbeat-r155\.js\?v=[^"\']+',heartbeat,s,count=1)
          if n!=1: raise SystemExit('FormatX heartbeat URL not found exactly once')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r158 cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): publish r158 alive seamless cross-device integration'
          git push origin HEAD:master
