name: One-shot publish r167 visible crystal body heartbeat
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r167 heartbeat script cache and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          target='./scripts/formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r167-crystal-body-pulse'
          html,n=re.subn(r'\.\/scripts\/formatx-live-heartbeat-r155\.js\?v=20260815-r158-lubdub-seamless&rev=[^"\']+',target,html,count=1)
          if n!=1: raise SystemExit('heartbeat script URL not found exactly once')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          old="assert.ok(index.includes('formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless'));"
          new="assert.ok(index.includes('formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r167-crystal-body-pulse'));"
          if old in v:v=v.replace(old,new,1)
          elif new not in v:raise SystemExit('heartbeat index validator token not found')
          marker="for(const token of ['js-reactive-heartbeat-r155','r158-lub-dub-seamless-living'"
          if marker not in v:raise SystemExit('heartbeat validator marker missing')
          needle="'formatx-seamless-living-r158.css'])assert.ok(heartbeat.includes(token),`missing r158 heartbeat token: ${token}`);"
          replacement="'formatx-seamless-living-r158.css','r167-heartbeat-css-scale-four-tip','applyCrystalShapePulse','fxLivingShapeScaleR167','fxLivingShapeEnvelopeR167','visible-four-tip-lub-dub',\"set(detail,'scale'\"])assert.ok(heartbeat.includes(token),`missing r167 heartbeat token: ${token}`);"
          if needle in v:v=v.replace(needle,replacement,1)
          elif 'fxLivingShapeScaleR167' not in v:raise SystemExit('heartbeat token list terminator not found')
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r167 heartbeat cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): publish r167 visible crystal-body heartbeat'
          git push origin HEAD:master
