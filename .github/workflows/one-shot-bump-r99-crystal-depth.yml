name: One-shot publish r185 iconic MAG system
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r185 signature assets with fresh site cache
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          python3 - <<'PY'
          from pathlib import Path
          import re

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          css='  <link rel="stylesheet" data-fx-signature-system-r185="true" href="./styles/formatx-signature-system-r185.css?v=20260816-iconic-mag-r185">\n'
          js='  <script defer data-fx-signature-system-r185="true" src="./scripts/formatx-signature-system-r185.js?v=20260816-iconic-mag-r185"></script>\n'
          if 'formatx-signature-system-r185.css' not in html:
              anchor=re.search(r'(^\s*<link rel="stylesheet" data-fx-core-real3d="true"[^\n]+\n)',html,re.M)
              if not anchor: raise SystemExit('core real3d stylesheet anchor not found')
              html=html[:anchor.end()]+css+html[anchor.end():]
          if 'formatx-signature-system-r185.js' not in html:
              anchor=re.search(r'(^\s*<script defer data-fx-live-heartbeat-r155="true"[^\n]+</script>\n)',html,re.M)
              if not anchor: raise SystemExit('heartbeat script anchor not found')
              html=html[:anchor.end()]+js+html[anchor.end():]
          index.write_text(html)
          PY
          node --check docs/scifi-ui/scripts/formatx-signature-system-r185.js
          node .github/scripts/validate-signature-system-r185.cjs
          node .github/scripts/validate-user-requested-site-features.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r185 signature assets already current'; exit 0; fi
          git commit -m '[deploy-production] feat(signature): publish r185 iconic MAG assets'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1
