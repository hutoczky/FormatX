name: One-shot publish r169 optics-led living MAG
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reduce crystal zoom and publish optics-led heartbeat cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          hb=Path('docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js')
          s=hb.read_text()
          oldx="const targetX=still?1:clamp(.995+(breath-.5)*.006+shapeBeat*.019+activity*.002,.991,1.025);"
          oldy="const targetY=still?1:clamp(.993+(breath-.5)*.009+shapeBeat*.031+activity*.003,.987,1.039);"
          newx="const targetX=still?1:clamp(1+(breath-.5)*.0012+shapeBeat*.0018+activity*.0004,.9988,1.0032);"
          newy="const targetY=still?1:clamp(1+(breath-.5)*.0016+shapeBeat*.0024+activity*.0005,.9985,1.0040);"
          if oldx in s:s=s.replace(oldx,newx,1)
          elif newx not in s:raise SystemExit('heartbeat targetX token not found')
          if oldy in s:s=s.replace(oldy,newy,1)
          elif newy not in s:raise SystemExit('heartbeat targetY token not found')
          s=s.replace("root.dataset.fxLivingShapePulseStateR167=still?'reduced-motion-static':'visible-four-tip-lub-dub';","root.dataset.fxLivingShapePulseStateR167=still?'reduced-motion-static':'micro-breath-optics-led';",1)
          hb.write_text(s)

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          old='formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r168-living-energy'
          new='formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r169-optics-led-micro-scale'
          if old in html:html=html.replace(old,new,1)
          elif new not in html:raise SystemExit('heartbeat index cache token not found')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=v.replace(old,new)
          v=v.replace("'visible-four-tip-lub-dub'","'micro-breath-optics-led'")
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r169 optics-led cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): make heartbeat optics-led with micro scale'
          git push origin HEAD:master
