name: One-shot bump r145 narrow-proof bootstrap cache
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump production r145 narrow-proof bootstrap cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/scifi-ui/index.html')
          s = p.read_text()
          new = './scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260815-narrow-proof-r145'
          if new in s:
              raise SystemExit(0)
          pat = r'\.\/scripts\/formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=[^"\']+'
          out, n = re.subn(pat, new, s, count=1)
          if n != 1:
              raise SystemExit('expected FormatX real3d bootstrap URL not found exactly once')
          p.write_text(out)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then
            echo 'cache key already current'
            exit 0
          fi
          git commit -m '[deploy-production] fix(mobile): publish r145 narrow-proof bootstrap'
          git push origin HEAD:master
