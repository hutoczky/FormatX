name: One-shot publish r168 v2 multimodal living MAG
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r168 v2 multimodal interaction cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          css='./styles/formatx-living-energy-r168.css?v=20260815-r168-v2-multimodal&rev=20260815-visible-caustics'
          js='./scripts/formatx-living-energy-r168.js?v=20260815-r168-v2-multimodal&rev=20260815-visible-interaction'
          html,n1=re.subn(r'\.\/styles\/formatx-living-energy-r168\.css\?[^"\']+',css,html,count=1)
          html,n2=re.subn(r'\.\/scripts\/formatx-living-energy-r168\.js\?[^"\']+',js,html,count=1)
          if n1!=1 or n2!=1: raise SystemExit(f'r168 asset URLs not found exactly once: css={n1} js={n2}')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=re.sub(r'formatx-living-energy-r168\.css\?[^\'"\)]+','formatx-living-energy-r168.css?v=20260815-r168-v2-multimodal&rev=20260815-visible-caustics',v)
          v=re.sub(r'formatx-living-energy-r168\.js\?[^\'"\)]+','formatx-living-energy-r168.js?v=20260815-r168-v2-multimodal&rev=20260815-visible-interaction',v)
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r168 v2 cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): publish r168 v2 multimodal living interaction'
          git push origin HEAD:master
