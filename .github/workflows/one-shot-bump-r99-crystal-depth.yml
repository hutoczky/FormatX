name: One-shot publish r168 living energy and seamless mobile MAG
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r168 living energy assets and cache contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()

          # Keep the existing heartbeat engine but bust its cache for the r168 integration.
          target='./scripts/formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r168-living-energy'
          html,n=re.subn(r'\.\/scripts\/formatx-live-heartbeat-r155\.js\?v=20260815-r158-lubdub-seamless&rev=[^"\']+',target,html,count=1)
          if n!=1: raise SystemExit('heartbeat script URL not found exactly once')

          style='  <link rel="stylesheet" data-fx-living-energy-r168="true" href="./styles/formatx-living-energy-r168.css?v=20260815-r168-living-energy-seamless">\n'
          script='  <script defer data-fx-living-energy-r168="true" src="./scripts/formatx-living-energy-r168.js?v=20260815-r168-living-energy-seamless"></script>\n'
          if 'data-fx-living-energy-r168="true" href=' not in html:
              anchor='  <script defer data-fx-core-real3d="true"'
              if anchor not in html: raise SystemExit('real3d script anchor missing')
              html=html.replace(anchor,style+anchor,1)
          if 'data-fx-living-energy-r168="true" src=' not in html:
              anchor='</head>'
              if anchor not in html: raise SystemExit('head terminator missing')
              html=html.replace(anchor,script+anchor,1)
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          old="assert.ok(index.includes('formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r167-crystal-body-pulse'));"
          new="assert.ok(index.includes('formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r168-living-energy'));assert.ok(index.includes('formatx-living-energy-r168.css?v=20260815-r168-living-energy-seamless'));assert.ok(index.includes('formatx-living-energy-r168.js?v=20260815-r168-living-energy-seamless'));"
          if old in v:v=v.replace(old,new,1)
          elif 'formatx-living-energy-r168.js?v=20260815-r168-living-energy-seamless' not in v:
              raise SystemExit('r167 heartbeat validator token not found')
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r168 living energy cache already current'; exit 0; fi
          git commit -m '[deploy-production] feat(mag): publish r168 living energy seamless integration'
          git push origin HEAD:master
