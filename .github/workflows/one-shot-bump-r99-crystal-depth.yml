name: One-shot publish r170 monotonic living optics
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish monotonic r168 v3 optical clock cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          new='./scripts/formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260815-r170-stable-optical-clock'
          pat=r'\.\/scripts\/formatx-living-energy-r168\.js\?[^"\']+'
          html,n=re.subn(pat,new,html,count=1)
          if n!=1:raise SystemExit(f'r168 JS URL not found exactly once: {n}')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=re.sub(r'formatx-living-energy-r168\.js\?[^\'"\)]+','formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260815-r170-stable-optical-clock',v)
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node .github/scripts/validate-real3d-core.cjs
          grep -q "32ms-optical-reactor-v3" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          grep -q "fxLivingEnergyFrameR168" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r170 optical cache already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r170 monotonic optical clock'
          git push origin HEAD:master
