name: One-shot publish r172 priority seamless MAG
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r99-crystal-depth.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r172 high-priority seamless dissolve cache
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          new='./scripts/formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260815-r172-priority-seamless'
          html,n=re.subn(r'\.\/scripts\/formatx-living-energy-r168\.js\?[^"\']+',new,html,count=1)
          if n!=1:raise SystemExit(f'r168 JS URL not found exactly once: {n}')
          index.write_text(html)
          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          v=re.sub(r'formatx-living-energy-r168\.js\?[^\'"\)]+','formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260815-r172-priority-seamless',v)
          validator.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node .github/scripts/validate-real3d-core.cjs
          grep -q "ready-58-72-priority" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          grep -q "top:58%" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          grep -q "height:72%" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r172 cache already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r172 priority seamless dissolve'
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1
