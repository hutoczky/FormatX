name: Diagnose live v61 canvas ownership
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnose-live-v61.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          cd "$RUNNER_TEMP/diag"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Inspect live mobile DOM
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/diag"
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await context.newPage();
            await page.goto(`https://formatxsuite.com/?v61_diag=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileV60==='ready-v60'&&document.documentElement.dataset.fxCoreFidelityV61==='ready-v61',null,{timeout:60000});
            await page.waitForTimeout(1000);
            const state=await page.evaluate(()=>({
              root:{...document.documentElement.dataset},
              stages:[...document.querySelectorAll('.fx-core-mobile-v55-stage')].map((n,i)=>({i,renderer:n.dataset.renderer,parent:n.parentElement?.className,html:n.outerHTML.slice(0,500)})),
              canvases:[...document.querySelectorAll('.fx-core-mobile-v55-canvas')].map((n,i)=>({i,parentClass:n.parentElement?.className,parentRenderer:n.parentElement?.dataset?.renderer,width:n.width,height:n.height})),
              overlays:[...document.querySelectorAll('.fx-core-fidelity-v61')].map((n,i)=>({i,parentRenderer:n.parentElement?.dataset?.renderer})),
              scripts:[...document.scripts].map(s=>s.src).filter(s=>/core-mobile|reference-cinematic|core-real3d/.test(s))
            }));
            console.log('V61_DIAG='+JSON.stringify(state,null,2));
            await page.screenshot({path:'live-v61-diag.png',fullPage:false});
            await context.close(); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-v61-diag-${{ github.sha }}
          path: ${{ runner.temp }}/diag/live-v61-diag.png
          retention-days: 2
