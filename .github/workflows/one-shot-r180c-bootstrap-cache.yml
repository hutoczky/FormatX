name: One-shot publish r180c bootstrap cache

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r180c-bootstrap-cache.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump public bootstrap URL to r180c
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          old='./scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260816-r178-flow-mobile-only'
          new='./scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260816-r180c-mobile-ui-flow'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('public bootstrap cache token not found')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git rm .github/workflows/one-shot-r180c-bootstrap-cache.yml
          git commit -m '[deploy-production] fix(mobile): publish r180c bootstrap cache'
          git push origin HEAD:master
