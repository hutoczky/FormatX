name: Debug r130 reference chunks
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/debug-r130-chunks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate-corruption:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
