name: R639 P0 canonical first-frame network fix

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r639-p0-canonical-network-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Patch canonical production CSS network staging
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python3
          node --check billing-worker/src/production-content-entry.js
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r637.js
          git diff --check
      - name: Commit R639 canonical source fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          git add billing-worker/src/production-content-entry.js
          git commit -m "R639 defer secondary CSS network until first paint"
          git push origin HEAD:fix/r533-p0-intro-lcp
