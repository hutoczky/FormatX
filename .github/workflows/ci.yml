name: Lighthouse CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/**'
      - 'lighthouserc.json'
      - 'lighthouserc.mobile.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/**'
      - 'lighthouserc.json'
      - 'lighthouserc.mobile.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install -g @lhci/cli@0.13.x

      - name: Run desktop Lighthouse CI
        id: lighthouse_desktop
        shell: bash
        run: |
          set -o pipefail
          rm -rf .lighthouseci
          set +e
          lhci autorun --config=./lighthouserc.json 2>&1 | tee lighthouse-desktop-output.txt
          lhci_status=${PIPESTATUS[0]}
          set -e
          grep -Eq 'Running Lighthouse 3 time\(s\) on http://localhost:[0-9]+/scifi-ui/index.html\?lighthouse=1$' lighthouse-desktop-output.txt
          mkdir -p lighthouse-results/desktop
          cp -a .lighthouseci/. lighthouse-results/desktop/
          exit "$lhci_status"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Run mobile Lighthouse CI
        id: lighthouse_mobile
        if: always()
        shell: bash
        run: |
          set -o pipefail
          rm -rf .lighthouseci
          set +e
          lhci autorun --config=./lighthouserc.mobile.json 2>&1 | tee lighthouse-mobile-output.txt
          lhci_status=${PIPESTATUS[0]}
          set -e
          grep -Eq 'Running Lighthouse 3 time\(s\) on http://localhost:[0-9]+/scifi-ui/index.html\?lighthouse=1&mobile=1$' lighthouse-mobile-output.txt
          mkdir -p lighthouse-results/mobile
          cp -a .lighthouseci/. lighthouse-results/mobile/
          exit "$lhci_status"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lighthouse-results
          path: |
            lighthouse-results/
            lighthouse-desktop-output.txt
            lighthouse-mobile-output.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize Lighthouse results
        if: always()
        run: |
          {
            echo "## Lighthouse CI Results"
            echo
            echo "Validated surfaces: desktop + mobile"
            echo
            echo "### Strict thresholds"
            echo "- Performance ≥ 0.90"
            echo "- Accessibility = 1.00"
            echo "- Best practices = 1.00"
            echo "- SEO = 1.00"
            echo "- LCP ≤ 2.5s"
            echo "- CLS ≤ 0.10"
            echo "- TTFB ≤ 600ms"
            echo "- 3 runs per viewport profile"
            echo
            echo "The production site is deployed as one Cloudflare Worker with Static Assets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Lighthouse status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Strict desktop and mobile Lighthouse quality gates passed'
          else
            state='failure'
            description='Desktop or mobile Lighthouse quality gate failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX Lighthouse quality gate' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
