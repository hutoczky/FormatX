name: R528 one-shot active CSS contract cleanup

on:
  push:
    branches: [p0-r528-candidate]
    paths:
      - '.github/workflows/r528-contract-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p0-r528-candidate
          fetch-depth: 0
      - name: Remove obsolete manual MAG pause styling from active CSS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path)
              s=p.read_text()
              found=s.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old[:100]!r}')
              if found == 0:
                  raise SystemExit(f'{path}: pattern not found: {old[:100]!r}')
              p.write_text(s.replace(old,new))

          q='docs/scifi-ui/styles/formatx-quality-r461.css'
          replace(q,'grid-template-columns: repeat(3, 50px) !important;','grid-template-columns: repeat(2, 50px) !important;',1)
          replace(q,
          '  html body.living-architecture #hero .fx-reference-controls-r264 > .fx-three-sound,\n  html body.living-architecture #hero .fx-reference-controls-r264 .fx-reference-ask,\n  html body.living-architecture #hero .fx-reference-controls-r264 .fx-reference-pause {',
          '  html body.living-architecture #hero .fx-reference-controls-r264 > .fx-three-sound,\n  html body.living-architecture #hero .fx-reference-controls-r264 .fx-reference-ask {',1)
          replace(q,
          '  html body.living-architecture #hero .fx-reference-controls-r264 .fx-reference-pause {\n    grid-column: 3 !important;\n    grid-row: 1 !important;\n  }\n','',1)

          m='docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
          replace(m,'#hero .fx-reference-ask,#hero .fx-reference-pause{pointer-events:auto;appearance:none;border:1px solid rgba(139,198,226,.24);background:rgba(3,14,24,.88);color:#d9ecf7;box-shadow:inset 0 0 24px rgba(55,180,255,.035)}','#hero .fx-reference-ask{pointer-events:auto;appearance:none;border:1px solid rgba(139,198,226,.24);background:rgba(3,14,24,.88);color:#d9ecf7;box-shadow:inset 0 0 24px rgba(55,180,255,.035)}',1)
          replace(m,'  #hero .fx-reference-pause{width:46px!important;min-width:0!important;height:46px!important;min-height:0!important;border-radius:50%;padding:0!important;font:800 14px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#62dcff}\n  #hero .fx-reference-pause[data-paused="true"]{color:#d6f8ff;box-shadow:0 0 22px rgba(54,203,255,.12),inset 0 0 24px rgba(55,180,255,.08)}\n','',1)
          replace(m,'.fx-reference-mag-button,.fx-reference-menu-button,#hero .fx-reference-ask,#hero .fx-reference-pause,#hero .fx-reference-liveos{touch-action:manipulation;transition:border-color .22s ease,background-color .22s ease,color .22s ease,box-shadow .22s ease,transform .22s ease}', '.fx-reference-mag-button,.fx-reference-menu-button,#hero .fx-reference-ask,#hero .fx-reference-liveos{touch-action:manipulation;transition:border-color .22s ease,background-color .22s ease,color .22s ease,box-shadow .22s ease,transform .22s ease}',1)
          replace(m,'#hero .fx-reference-ask,#hero .fx-reference-pause{cursor:pointer}','#hero .fx-reference-ask{cursor:pointer}',1)
          replace(m,'#hero .fx-reference-pause{position:relative!important;color:transparent!important;text-indent:-9999px;overflow:hidden}\n#hero .fx-reference-pause:before,#hero .fx-reference-pause:after{content:"";position:absolute;top:50%;width:2px;height:10px;border-radius:2px;background:#62dcff;box-shadow:0 0 8px rgba(98,220,255,.48);transform:translateY(-50%)}\n#hero .fx-reference-pause:before{left:calc(50% - 4px)}\n#hero .fx-reference-pause:after{left:calc(50% + 2px)}\n#hero .fx-reference-pause[data-paused="true"]:before{left:50%;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #b8f3ff;border-radius:0;background:transparent;box-shadow:none;transform:translate(-40%,-50%)}\n#hero .fx-reference-pause[data-paused="true"]:after{display:none}\n','',1)
          replace(m,'.fx-reference-mag-button:focus-visible,.fx-reference-menu-button:focus-visible,#hero .fx-reference-ask:focus-visible,#hero .fx-reference-pause:focus-visible,#hero .fx-reference-liveos:focus-visible{outline:2px solid #68dcff;outline-offset:3px;box-shadow:0 0 0 5px rgba(33,190,255,.16),0 0 28px rgba(33,190,255,.22)}','.fx-reference-mag-button:focus-visible,.fx-reference-menu-button:focus-visible,#hero .fx-reference-ask:focus-visible,#hero .fx-reference-liveos:focus-visible{outline:2px solid #68dcff;outline-offset:3px;box-shadow:0 0 0 5px rgba(33,190,255,.16),0 0 28px rgba(33,190,255,.22)}',1)
          replace(m,'.fx-reference-mag-button:hover,.fx-reference-menu-button:hover,#hero .fx-reference-ask:hover,#hero .fx-reference-pause:hover,#hero .fx-reference-liveos:hover{border-color:rgba(83,224,255,.72);background-color:rgba(5,28,43,.94);box-shadow:inset 0 0 28px rgba(55,180,255,.10),0 0 24px rgba(0,197,255,.09)}','.fx-reference-mag-button:hover,.fx-reference-menu-button:hover,#hero .fx-reference-ask:hover,#hero .fx-reference-liveos:hover{border-color:rgba(83,224,255,.72);background-color:rgba(5,28,43,.94);box-shadow:inset 0 0 28px rgba(55,180,255,.10),0 0 24px rgba(0,197,255,.09)}',1)
          replace(m,'@media (prefers-reduced-motion:reduce){.fx-reference-mag-button,.fx-reference-menu-button,#hero .fx-reference-ask,#hero .fx-reference-pause,#hero .fx-reference-liveos{transition:none!important}}','@media (prefers-reduced-motion:reduce){.fx-reference-mag-button,.fx-reference-menu-button,#hero .fx-reference-ask,#hero .fx-reference-liveos{transition:none!important}}',1)

          p='docs/scifi-ui/styles/formatx-mobile-proof-controls-r204.css'
          replace(p,'  #hero .fx-reference-controls-r204 .fx-reference-ask,\n  #hero .fx-reference-controls-r204 .fx-reference-pause {','  #hero .fx-reference-controls-r204 .fx-reference-ask {',2)
          replace(p,'    width: 110px !important;\n    min-width: 110px !important;','    width: 48px !important;\n    min-width: 48px !important;',1)
          replace(p,'/* r205 production marker: compact audio + horizontal ASK/Pause + mini MAG. */','/* r528 production marker: compact audio + ASK + mini MAG; no manual PAUSE control. */',1)

          l='docs/scifi-ui/styles/formatx-mobile-layout-r207.css'
          replace(l,'    width: 178px !important;','    width: 114px !important;',2)
          replace(l,'    grid-template-columns: repeat(3, 50px) !important;','    grid-template-columns: repeat(2, 50px) !important;',1)
          replace(l,'    min-width: 178px !important;','    min-width: 114px !important;',1)
          replace(l,'  html:root:root body.living-architecture #hero .fx-reference-controls-r204 > .fx-three-sound,\n  html:root:root body.living-architecture #hero .fx-reference-controls-r204 .fx-reference-ask,\n  html:root:root body.living-architecture #hero .fx-reference-controls-r204 .fx-reference-pause {','  html:root:root body.living-architecture #hero .fx-reference-controls-r204 > .fx-three-sound,\n  html:root:root body.living-architecture #hero .fx-reference-controls-r204 .fx-reference-ask {',1)

          for path in [q,m,p,l]:
              text=Path(path).read_text()
              if '.fx-reference-pause' in text or 'data-paused=' in text:
                  raise SystemExit(f'{path}: obsolete manual pause styling remains')
              print(f'PASS cleanup: {path}')
          PY

          git diff --check
          git diff -- docs/scifi-ui/styles/formatx-quality-r461.css \
            docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css \
            docs/scifi-ui/styles/formatx-mobile-proof-controls-r204.css \
            docs/scifi-ui/styles/formatx-mobile-layout-r207.css

      - name: Commit cleanup to candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-quality-r461.css \
            docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css \
            docs/scifi-ui/styles/formatx-mobile-proof-controls-r204.css \
            docs/scifi-ui/styles/formatx-mobile-layout-r207.css
          git commit -m '[candidate] Remove obsolete manual MAG pause styles from active mobile CSS'
          git push origin HEAD:p0-r528-candidate
