name: Diagnose R517 with current Lighthouse
run-name: R517 current Lighthouse comparison on exact R516 production

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/diagnose-r517-current-lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDITED_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
  ORIGIN: https://formatxsuite.com

jobs:
  current-lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Confirm exact R516 production marker
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$AUDITED_SHA"
          git show "$AUDITED_SHA:docs/p0-validation-version.txt" > "$RUNNER_TEMP/expected.txt"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?lh13_diag=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/live.txt"
          cmp -s "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/live.txt"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install current stable Lighthouse
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install -g lighthouse@13.4.1 >/dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
          lighthouse --version
      - name: Run one current desktop Lighthouse diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-lh13/desktop artifacts/r517-lh13/mobile
          lighthouse "$ORIGIN/" \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/r517-lh13/desktop/lhr.json \
            --save-assets \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
            --max-wait-for-load=60000 \
            --quiet
      - name: Run one current mobile Lighthouse diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          lighthouse "$ORIGIN/" \
            --output=json \
            --output-path=artifacts/r517-lh13/mobile/lhr.json \
            --save-assets \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage' \
            --max-wait-for-load=60000 \
            --quiet
      - name: Summarize current Lighthouse evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          for (const profile of ['desktop','mobile']) {
            const d=JSON.parse(fs.readFileSync(`artifacts/r517-lh13/${profile}/lhr.json`,'utf8'));
            const a=d.audits,c=d.categories;
            const score=k=>Math.round((c[k]?.score??-1)*100),n=k=>a[k]?.numericValue??null;
            const failedSeo=(c.seo?.auditRefs||[]).map(x=>x.id).filter(id=>a[id]?.score!==null&&a[id]?.score<1).map(id=>({id,score:a[id].score,title:a[id].title,displayValue:a[id].displayValue,details:a[id].details}));
            const metrics=a.metrics?.details?.items?.[0]||{};
            const summary={lighthouseVersion:d.lighthouseVersion,fetchTime:d.fetchTime,performance:score('performance'),accessibility:score('accessibility'),bestPractices:score('best-practices'),seo:score('seo'),FCP:n('first-contentful-paint'),LCP:n('largest-contentful-paint'),SI:n('speed-index'),TBT:n('total-blocking-time'),CLS:n('cumulative-layout-shift'),TTFB:n('server-response-time'),observedFCP:metrics.observedFirstContentfulPaint??null,observedLCP:metrics.observedLargestContentfulPaint??null,observedLoad:metrics.observedLoad??null,failedSeo};
            fs.writeFileSync(`artifacts/r517-lh13/${profile}/summary.json`,JSON.stringify(summary,null,2));
            console.log(`CURRENT_LIGHTHOUSE_${profile.toUpperCase()}`,JSON.stringify(summary,null,2));
          }
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r517-current-lighthouse-${{ env.AUDITED_SHA }}
          path: artifacts/r517-lh13/
          include-hidden-files: true
          retention-days: 30
