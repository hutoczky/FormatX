name: Diagnose r165 mobile seam owner
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnose-r165-mobile-seam.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Inspect live mobile seam geometry
        run: |
          cat > diagnose-seam.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const origin='https://formatxsuite.com';
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'});
            const page=await context.newPage();
            await page.goto(`${origin}/?diag=r165-seam-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxSeamlessLivingR158==='ready'&&document.documentElement.dataset.fxLiveHeartbeatR155==='js-reactive-heartbeat-r155',null,{timeout:60000});
            await page.waitForTimeout(500);
            await page.evaluate(()=>{
              document.documentElement.dataset.fxReferenceMotionPaused='true';
              dispatchEvent(new CustomEvent('formatx:referencepause',{detail:{paused:true,source:'r165-seam-diagnostic'}}));
            });
            await page.waitForTimeout(120);
            const diag=await page.evaluate(()=>{
              const selectors={
                hero:'#hero',grid:'#hero .hero-grid',space:'#hero .hero-space',
                stage:'#hero .fx-core-mobile-v55-stage,#hero .fx-core-r112-stage',
                native:'#hero .fx-core-mobile-v55-canvas,#hero .fx-core-r112-canvas',
                detail:'#hero .fx-core-detail-r122',live:'#hero .fx-core-live-r147-layer',
                heading:'#hero .fx-reference-heading',proof:'#hero .fx-reference-proof',dock:'#hero .fx-mobile-download-r151'
              };
              const info={};
              const read=(el,pseudo=null)=>{
                if(!el)return null;
                const r=el.getBoundingClientRect(),s=getComputedStyle(el,pseudo);
                return {tag:el.tagName,cls:el.className||'',id:el.id||'',rect:{top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height},backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,zIndex:s.zIndex,position:s.position,display:s.display,opacity:s.opacity,overflow:s.overflow,borderRadius:s.borderRadius,boxShadow:s.boxShadow,content:pseudo?s.content:undefined};
              };
              for(const [k,sel] of Object.entries(selectors)){const el=document.querySelector(sel);info[k]=read(el);if(el){info[k+'Before']=read(el,'::before');info[k+'After']=read(el,'::after');}}
              const rows={};
              for(const y of [436,438,440,442,443,444,445,446,448,450,452]){
                rows[y]={};
                for(const x of [2,20,195,370,388]){
                  rows[y][x]=document.elementsFromPoint(x,y).slice(0,8).map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{tag:el.tagName,id:el.id||'',cls:String(el.className||''),top:+r.top.toFixed(2),bottom:+r.bottom.toFixed(2),bg:s.backgroundColor,bgi:s.backgroundImage,z:s.zIndex,opacity:s.opacity};});
                }
              }
              return {dataset:{seamless:document.documentElement.dataset.fxSeamlessLivingR158,enforcer:document.documentElement.dataset.fxSeamlessEnforcerR159,carrier:document.documentElement.dataset.fxSeamlessCarrierR161,referenceKey:document.documentElement.dataset.fxCoreReferenceKeyR160},info,rows};
            });
            console.log('MOBILE SEAM DIAGNOSTIC\n'+JSON.stringify(diag,null,2));
            const cdp=await context.newCDPSession(page);const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync('/tmp/r165-seam-diagnostic.png',Buffer.from(shot.data,'base64'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node diagnose-seam.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r165-mobile-seam-diagnostic-${{ github.run_id }}
          path: /tmp/r165-seam-diagnostic.png
          if-no-files-found: warn
          retention-days: 3
