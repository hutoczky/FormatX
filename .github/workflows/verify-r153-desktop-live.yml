name: Verify r169 optics-led MAG compatibility

on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-r153-desktop-live.yml']
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-device-live:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify optics-led heartbeat without zoom dependency
        run: |
          cat > check-r169.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const origin='https://formatxsuite.com';
          const parseScale=s=>String(s||'1,1').split(',').map(Number);
          async function state(page){return page.evaluate(()=>{const r=document.documentElement.dataset,stage=document.querySelector('#hero .fx-core-mobile-v55-stage,#hero .fx-core-r112-stage'),canvas=document.querySelector('#hero .fx-core-mobile-v55-canvas,#hero .fx-core-r112-canvas'),gl=canvas?.getContext('webgl2')||canvas?.getContext('webgl');return{tick:Number(r.fxLiveHeartbeatTickR155||0),pulse:r.fxLivingShapePulseStateR167||'',shape:r.fxLivingShapeScaleR167||'',energy:r.fxLivingEnergyR168||'',mode:r.fxLivingEnergyEffectModeR168||'',optics:r.fxLivingEnergyOpticsR168||'',activity:Number(r.fxLivingEnergyActivityR168||0),interaction:r.fxLivingEnergyInteractionR168||'',position:r.fxLivingEnergyPositionR168||'',stage:stage?getComputedStyle(stage).backgroundImage:'missing',renderMs:Number(r.fxCoreRenderMs||Infinity),glError:gl?.getError(),motion:r.fxCoreMotionR144||'',gyro:r.fxCoreGyroLoadR144||''};});}
          function assertBase(a,b,label){assert.ok(a.energy.includes('v2'),`${label}: r168 v2 missing`);assert.equal(a.mode,'orbit-caustic-spectrum-shock-refraction');assert.equal(a.pulse,'micro-breath-optics-led');assert.ok(b.tick>a.tick,`${label}: heartbeat clock stalled`);assert.notEqual(a.optics,b.optics,`${label}: optics did not breathe`);for(const s of [a.shape,b.shape]){const [x,y]=parseScale(s);assert.ok(Number.isFinite(x)&&Number.isFinite(y));assert.ok(Math.abs(x-1)<.01&&Math.abs(y-1)<.01,`${label}: crystal zoom is too large ${s}`);}assert.equal(a.stage,'none');assert.equal(a.glError,0);assert.ok(a.renderMs<16.67&&b.renderMs<16.67);}
          async function desktop(browser){const c=await browser.newContext({viewport:{width:1600,height:1000},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();await p.goto(`${origin}/?verify=r169-desktop-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>document.documentElement.dataset.fxLivingShapePulseStateR167==='micro-breath-optics-led'&&String(document.documentElement.dataset.fxLivingEnergyR168||'').includes('v2'),null,{timeout:60000});const a=await state(p);await p.waitForTimeout(480);const b=await state(p);assertBase(a,b,'desktop');const box=await p.locator('#hero .hero-space').boundingBox();if(box){await p.mouse.move(box.x+box.width*.78,box.y+box.height*.35);await p.mouse.down();await p.waitForTimeout(70);await p.mouse.up();}await p.waitForTimeout(90);const x=await state(p);assert.ok(x.activity>b.activity||x.position!==b.position||x.interaction==='energy-burst','desktop interaction not visible');await c.close();}
          async function mobile(browser){const c=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,reducedMotion:'no-preference'}),p=await c.newPage();await p.goto(`${origin}/?verify=r169-mobile-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxLivingShapePulseStateR167==='micro-breath-optics-led'&&String(document.documentElement.dataset.fxLivingEnergyR168||'').includes('v2'),null,{timeout:60000});const a=await state(p);await p.waitForTimeout(480);const b=await state(p);assertBase(a,b,'mobile');assert.ok(a.motion.includes('breathing-pointer-touch-gyro'));assert.ok(['ready','permission-required','unsupported'].includes(a.gyro));await p.touchscreen.tap(300,300);await p.waitForTimeout(90);const x=await state(p);assert.ok(x.activity>=b.activity||x.interaction==='energy-burst','mobile touch burst not visible');await c.close();}
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await desktop(b);await mobile(b)}finally{await b.close()}console.log('PASS: r169 heartbeat is optics-led, micro-scale and interactive on desktop/mobile.')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check-r169.cjs
