name: One-shot R462 semantic cache migration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r461-clean-active-path.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch final semantic owners and cache revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          owner_path = Path('docs/scifi-ui/scripts/formatx-control-owner-r268.js')
          owner = owner_path.read_text(encoding='utf-8')
          old_label = "lang.setAttribute('aria-label',current==='en'?'Switch to Hungarian':'Váltás angol nyelvre');"
          new_label = "lang.setAttribute('aria-label',current==='en'?'EN – switch to Hungarian':'HU – váltás angol nyelvre');"
          old_title = "lang.setAttribute('title',current==='en'?'Switch to Hungarian':'Váltás angol nyelvre');"
          new_title = "lang.setAttribute('title',current==='en'?'EN – switch to Hungarian':'HU – váltás angol nyelvre');"
          if old_label in owner:
              owner = owner.replace(old_label, new_label, 1)
          if old_title in owner:
              owner = owner.replace(old_title, new_title, 1)
          if new_label not in owner or new_title not in owner:
              raise SystemExit('R462: control-owner language semantic patch failed')
          owner_path.write_text(owner, encoding='utf-8')

          index_path = Path('docs/scifi-ui/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              'class="fx-language-toggle" data-language-toggle="true" lang="hu"',
              'class="fx-language-toggle" data-language-toggle="true" data-fx-single-language-toggle="ready-v3" lang="hu"',
              1,
          )
          index = index.replace('formatx-quality-r461.css?v=20260830-r461', 'formatx-quality-r461.css?v=20260830-r462-mobile-a11y', 1)
          index = index.replace('formatx-motion-runtime-loader-r239.js?v=20260830-r461-clean-active-path', 'formatx-motion-runtime-loader-r239.js?v=20260830-r462-compact-active-path', 1)
          index = index.replace(
              'formatx-control-owner-r268.js?v=20260824-instant-award-r251&rev=20260830-r454-visible-electric-surface',
              'formatx-control-owner-r268.js?v=20260824-instant-award-r251&rev=20260830-r462-language-a11y',
              1,
          )
          if 'data-fx-single-language-toggle="ready-v3"' not in index:
              raise SystemExit('R462: static semantic language marker missing')
          index_path.write_text(index, encoding='utf-8')

          motion_path = Path('docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js')
          motion = motion_path.read_text(encoding='utf-8')
          motion = motion.replace('single-language-toggle.js?v=20260830-r461-static-owner', 'single-language-toggle.js?v=20260830-r462-semantic-owner', 1)
          if 'single-language-toggle.js?v=20260830-r462-semantic-owner' not in motion:
              raise SystemExit('R462: language cache revision patch failed')
          motion_path.write_text(motion, encoding='utf-8')

          gate_path = Path('.github/scripts/validate-wda-100-r198.cjs')
          gate = gate_path.read_text(encoding='utf-8')
          gate = gate.replace('single-language-toggle.js?v=20260830-r461-static-owner', 'single-language-toggle.js?v=20260830-r462-semantic-owner')
          gate = gate.replace('formatx-quality-r461\\.css\\?v=20260830-r461', 'formatx-quality-r461\\.css\\?v=20260830-r462-mobile-a11y')
          gate_path.write_text(gate, encoding='utf-8')
          PY

      - name: Validate R462 source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node --check docs/scifi-ui/scripts/formatx-control-owner-r268.js
          node --check docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js
          node .github/scripts/validate-wda-100-r198.cjs
          node .github/scripts/validate-living-core-r425-source.cjs

      - name: Commit migration and delete this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-r461-clean-active-path.yml
          git add docs/scifi-ui/index.html \
                  docs/scifi-ui/scripts/formatx-control-owner-r268.js \
                  docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js \
                  .github/scripts/validate-wda-100-r198.cjs
          git commit -m 'Finalize R462 language semantics and cache revisions'
          git push origin HEAD:master
