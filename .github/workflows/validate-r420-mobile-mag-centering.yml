name: Validate r420 mobile MAG centering

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-optics-r419.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-portal-r318.js'
      - '.github/workflows/validate-r420-mobile-mag-centering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-mag-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r420" && cd "$RUNNER_TEMP/r420"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify centered MAG on phone viewports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/r420-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/r420"
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };

          async function snapshot(page) {
            return page.evaluate(() => {
              const host = document.querySelector('#hero .hero-space');
              const stage = document.querySelector('#hero .fx-crystal-organism-r326-stage');
              const canvas = document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              if (!host || !stage || !canvas) return null;
              const hr = host.getBoundingClientRect();
              const sr = stage.getBoundingClientRect();
              const cr = canvas.getBoundingClientRect();
              const cs = getComputedStyle(canvas);
              const ss = getComputedStyle(stage);
              const center = r => (r.left + r.right) / 2;
              const visibleWidth = Math.max(0, Math.min(cr.right, innerWidth) - Math.max(cr.left, 0));
              return {
                viewport: innerWidth,
                host: { left: hr.left, right: hr.right, width: hr.width, center: center(hr) },
                stage: { left: sr.left, right: sr.right, width: sr.width, center: center(sr) },
                canvas: { left: cr.left, right: cr.right, width: cr.width, center: center(cr) },
                stageLeftStyle: ss.left,
                stageRightStyle: ss.right,
                stageTranslate: ss.translate,
                stageRenderer: stage.dataset.renderer || '',
                r326State: document.documentElement.dataset.fxCrystalOrganismR326 || '',
                canvasScale: cs.scale,
                canvasFilter: cs.filter,
                horizontalOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                visibleRatio: visibleWidth / Math.max(1, cr.width),
                telemetryRenderer: document.documentElement.dataset.fxCoreRenderer || '',
                optics: document.documentElement.dataset.fxCoreMobileOpticsR419 || '',
                ownership: document.documentElement.dataset.fxCrystalRendererOwnershipR420 || '',
                r267Loaded: Boolean(document.querySelector('script[data-fx-core-true-volume-r267], .fx-core-r267-volume-stage'))
              };
            });
          }

          function verify(state, name) {
            assert(state, name + ': MAG state missing');
            assert(state.r326State === 'ready', name + ': r326 runtime is not ready ' + JSON.stringify(state));
            assert(state.stageRenderer === 'crystal-organism-r326', name + ': physical r326 stage owner missing ' + JSON.stringify(state));
            assert(state.ownership === 'r326-exclusive-primary', name + ': r326 ownership marker missing ' + JSON.stringify(state));
            assert(state.r267Loaded === false, name + ': legacy r267 renderer was loaded ' + JSON.stringify(state));
            assert(state.horizontalOverflow <= 2, name + ': horizontal overflow ' + JSON.stringify(state));
            assert(state.stage.width > 280, name + ': stage too small ' + JSON.stringify(state));
            assert(Math.abs(state.stage.center - state.host.center) <= 2, name + ': stage not centered in host ' + JSON.stringify(state));
            assert(Math.abs(state.canvas.center - state.host.center) <= 2, name + ': canvas not centered in host ' + JSON.stringify(state));
            assert(state.stage.left >= -1 && state.stage.right <= state.viewport + 1, name + ': stage leaves viewport ' + JSON.stringify(state));
            assert(state.visibleRatio >= .98, name + ': canvas clipped horizontally ' + JSON.stringify(state));
            assert(state.canvasFilter.includes('blur('), name + ': softened mobile edge filter missing ' + JSON.stringify(state));
          }

          async function run(browser, name, viewport) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'hu-HU', colorScheme: 'dark' });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCrystalOrganismR326 === 'ready' && document.querySelector('.fx-crystal-organism-r326-canvas'), null, { timeout: 45000 });
            await page.waitForTimeout(900);

            const initial = await snapshot(page);
            verify(initial, name + '-initial');

            const hostBox = await page.locator('#hero .hero-space').boundingBox();
            assert(hostBox, name + ': hero-space missing');
            const y = Math.min(viewport.height - 80, Math.max(120, hostBox.y + hostBox.height * .46));
            await page.touchscreen.tap(Math.max(12, viewport.width * .08), y);
            await page.waitForTimeout(220);
            verify(await snapshot(page), name + '-after-left-touch');
            await page.touchscreen.tap(Math.min(viewport.width - 12, viewport.width * .92), y);
            await page.waitForTimeout(220);
            verify(await snapshot(page), name + '-after-right-touch');

            console.log('PASS', name, JSON.stringify(await snapshot(page)));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader'] });
            await run(browser, 'mobile-390x844', { width: 390, height: 844 });
            await run(browser, 'mobile-430x932', { width: 430, height: 932 });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
