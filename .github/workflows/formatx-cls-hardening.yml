name: FormatX mobile first-paint geometry repair

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/formatx-cls-hardening.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align critical mobile geometry with final layout
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          css_path=Path('docs/scifi-ui/styles/formatx-critical-shell-v56.css')
          s=css_path.read_text(encoding='utf-8')
          marker='First-paint geometry lock r4'
          if marker in s:
              raise SystemExit('first-paint geometry lock already present')

          s += r'''

/* First-paint geometry lock r4 -----------------------------------------------
   Mirrors the final mobile recovery + hero-flow composition from the very
   first CSS response. This prevents header mode, source order and hero height
   from changing after first paint. */
@media (max-width: 900px), (pointer: coarse) {
  .topbar {
    position: fixed;
    z-index: 1600;
    top: 0;
    right: 0;
    left: 0;
    width: 100%;
    min-height: 82px;
    margin: 0;
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    align-items: center;
  }

  .menu-toggle {
    width: 58px;
    min-width: 58px;
    height: 58px;
    min-height: 58px;
    padding: 0;
    border-radius: 19px;
  }

  #hero {
    min-height: 0;
    height: auto;
    padding: 84px 0 max(104px, calc(92px + env(safe-area-inset-bottom, 0px)));
  }

  #hero .hero-grid {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    max-width: 100%;
    min-height: 0;
    margin: 0;
    padding-inline: 12px;
    gap: 18px;
  }

  #hero .hero-copy {
    order: 0;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 24px clamp(18px, 5.2vw, 26px) 28px;
  }

  #hero .hero-space {
    order: 0;
    width: 100%;
    margin: 0;
    min-height: clamp(300px, 45svh, 470px);
    max-height: 490px;
  }
}
'''
          css_path.write_text(s, encoding='utf-8')

          entry=Path('billing-worker/src/production-content-entry.js')
          e=entry.read_text(encoding='utf-8')
          old='formatx-critical-shell-v56.css?v=20260811-mobile-intro-direct-r1'
          new='formatx-critical-shell-v56.css?v=20260812-first-paint-r4'
          if old not in e:
              raise SystemExit('critical shell production version token changed unexpectedly')
          entry.write_text(e.replace(old,new,1), encoding='utf-8')
          PY

      - name: Validate geometry repair
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'First-paint geometry lock r4' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq 'padding: 84px 0 max(104px' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq 'min-height: clamp(300px, 45svh, 470px)' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq '#hero .hero-copy' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq 'order: 0;' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq 'formatx-critical-shell-v56.css?v=20260812-first-paint-r4' billing-worker/src/production-content-entry.js

      - name: Commit and deploy repaired first paint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-critical-shell-v56.css billing-worker/src/production-content-entry.js
          git commit -m '[deploy-production] fix: eliminate mobile first-paint layout shift'
          git push origin HEAD:master
