name: Validate natural Organism voice

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/organism-voice.js'
      - 'docs/scifi-ui/scripts/organism-natural-voice.js'
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - '.github/scripts/validate-organism-natural-voice.cjs'
      - '.github/workflows/validate-organism-natural-voice.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/organism-voice.js'
      - 'docs/scifi-ui/scripts/organism-natural-voice.js'
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - '.github/scripts/validate-organism-natural-voice.cjs'
      - '.github/workflows/validate-organism-natural-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatx-natural-organism-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check docs/scifi-ui/scripts/organism-voice.js
          node --check docs/scifi-ui/scripts/organism-natural-voice.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check .github/scripts/validate-organism-natural-voice.cjs
      - name: Validate natural-only voice contract
        run: node .github/scripts/validate-organism-natural-voice.cjs
