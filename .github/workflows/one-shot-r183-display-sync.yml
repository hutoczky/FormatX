name: One-shot publish r183 display-synced motion
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r183-display-sync.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r183 display-synced heartbeat and energy cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          pairs={
            'formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260815-r169-optics-led-micro-scale':
              'formatx-live-heartbeat-r155.js?v=20260815-r158-lubdub-seamless&rev=20260816-r183-display-sync',
            'formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r182-idle-watchdog':
              'formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r183-display-sync',
          }
          for old,new in pairs.items():
            if old in s:s=s.replace(old,new)
            elif new not in s:raise SystemExit(f'cache token not found: {old}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r183 cache already current'; exit 0; fi
          git commit -m 'fix(mag): publish r183 display-synced motion cache'
          git push origin HEAD:master
