name: Fix unified Firefox context

# One-time compatibility patch for Playwright Firefox mobile viewport testing.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-unified-firefox-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Remove Chromium-only mobile emulation from Firefox
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/validate-website.yml')
          text = path.read_text(encoding='utf-8')
          old = """                  locale: 'hu-HU',
                  hasTouch: testCase.mobile,
                  isMobile: testCase.mobile,
                });
                const page = await context.newPage();
                await inspectPage(page, testCase.label, true);
"""
          new = """                  locale: 'hu-HU',
                  hasTouch: testCase.mobile,
                });
                const page = await context.newPage();
                await inspectPage(page, testCase.label, true);
"""
          if old not in text:
              raise SystemExit('Firefox context block not found exactly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const firefoxBrowser = await firefox.launch" .github/workflows/validate-website.yml
          firefox_block="$(sed -n '/const firefoxBrowser = await firefox.launch/,/await firefoxBrowser.close/p' .github/workflows/validate-website.yml)"
          ! grep -Fq 'isMobile:' <<< "$firefox_block"
          grep -Fq 'hasTouch: testCase.mobile' <<< "$firefox_block"

      - name: Commit and remove mutator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-unified-firefox-context.yml
          git add .github/workflows/validate-website.yml
          git commit -m 'Use Firefox-compatible mobile viewport validation'
          git push origin HEAD:master
