name: Build and publish FormatX Mobile Android APK

on:
  push:
    branches: [master]
    paths:
      - "android-mobile/**"
      - "docs/scifi-ui/android/**"
      - ".github/workflows/build-android-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: formatx-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify dedicated Android source
        shell: bash
        run: |
          set -euo pipefail
          BUILD="android-mobile/app/build.gradle.kts"
          MANIFEST="android-mobile/app/src/main/AndroidManifest.xml"
          MAIN="android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java"
          PAGE="docs/scifi-ui/android/index.html"

          grep -F 'applicationId = "hu.formatx.mobile"' "$BUILD"
          grep -F 'versionCode = 100' "$BUILD"
          grep -F 'versionName = "1.0.0"' "$BUILD"
          grep -F 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -F 'PRIMARY_PATH = "/scifi-ui/android/"' "$MAIN"
          grep -F 'FormatXMobileAndroid/' "$MAIN"
          grep -F 'class="reference-commerce formatx-android"' "$PAGE"
          ! grep -R -Fq 'REQUEST_INSTALL_PACKAGES' android-mobile/app/src/main
          ! grep -R -Fq 'setAllowFileAccess(true)' android-mobile/app/src/main
          ! grep -R -Fq 'setAllowContentAccess(true)' android-mobile/app/src/main

      - name: Build and lint FormatX Mobile Android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all --project-dir android-mobile \
            :app:assembleDebug :app:lintDebug

      - name: Publish APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android-mobile/app/build/outputs/apk/debug/app-debug.apk"
          DEST="docs/scifi-ui/downloads/FormatX-Mobile-Android.apk"
          VERSIONED="docs/scifi-ui/downloads/FormatX-Mobile-Android-1.0.0.apk"
          DIGEST_FILE="docs/scifi-ui/downloads/FormatX-Mobile-Android.apk.sha256"
          MANIFEST="docs/scifi-ui/downloads/android-mobile-update.json"

          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c '%s' "$APK")" -gt 50000
          cp "$APK" "$DEST"
          cp "$APK" "$VERSIONED"
          SHA256="$(sha256sum "$DEST" | awk '{print $1}')"
          test "${#SHA256}" -eq 64
          printf '%s  %s\n' "$SHA256" "FormatX-Mobile-Android.apk" > "$DIGEST_FILE"

          SHA256="$SHA256" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = Path('docs/scifi-ui/downloads/android-mobile-update.json')
          data = {
              'versionCode': 100,
              'versionName': '1.0.0',
              'apkUrl': 'https://www.formatxsuite.com/scifi-ui/downloads/FormatX-Mobile-Android.apk',
              'sha256': os.environ['SHA256'],
              'mandatory': False,
              'notes': 'Első külön FormatX Mobile Android kiadás mobilra optimalizált projekt-, kiadás-, támogatási és licencközponttal.'
          }
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          test "$(python3 -c "import json; print(json.load(open('$MANIFEST'))['sha256'])")" = "$SHA256"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Commit downloadable Android package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/scifi-ui/downloads/FormatX-Mobile-Android.apk \
            docs/scifi-ui/downloads/FormatX-Mobile-Android-1.0.0.apk \
            docs/scifi-ui/downloads/FormatX-Mobile-Android.apk.sha256 \
            docs/scifi-ui/downloads/android-mobile-update.json
          if git diff --cached --quiet; then
            echo "No generated Android package changes to commit."
            exit 0
          fi
          git commit -m "Publish FormatX Mobile Android 1.0.0 APK"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Build summary
        run: |
          {
            echo "## FormatX Mobile Android 1.0.0"
            echo
            echo "APK: https://www.formatxsuite.com/scifi-ui/downloads/FormatX-Mobile-Android.apk"
            echo
            echo "SHA256: $APK_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful Android build
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "✅ **PASS — FormatX Mobile Android 1.0.0 elkészült**

          - Forrás commit: \`${GITHUB_SHA}\`
          - Külön csomag: \`hu.formatx.mobile\`
          - APK: https://www.formatxsuite.com/scifi-ui/downloads/FormatX-Mobile-Android.apk
          - SHA-256: \`${APK_SHA256}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed Android build
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "❌ **FAILED — FormatX Mobile Android build**

          - Forrás commit: \`${GITHUB_SHA}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Az APK a hiba kijavításáig nem tekinthető elkészültnek."
