name: Build and publish FormatX Native Android APK

on:
  pull_request:
    branches: [master]
    paths:
      - "android-mobile/**"
      - ".github/workflows/build-android-mobile.yml"
  push:
    branches: [master]
    paths:
      - "android-mobile/**"
      - ".github/workflows/build-android-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: formatx-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.5.0"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify native Android source
        shell: bash
        run: |
          set -euo pipefail
          BUILD="android-mobile/app/build.gradle.kts"
          MANIFEST="android-mobile/app/src/main/AndroidManifest.xml"
          MAIN="android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java"

          grep -F 'applicationId = "hu.formatx.mobile"' "$BUILD"
          grep -F 'versionCode = 110' "$BUILD"
          grep -F 'versionName = "1.1.0"' "$BUILD"
          grep -F 'android.hardware.usb.host' "$MANIFEST"
          grep -F 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -F 'RawUsbMassStorageDevice' "$MAIN"
          grep -F 'StorageTools' "$MAIN"
          grep -F 'IntegrityTools' "$MAIN"
          ! grep -R -Eq 'android\.webkit|WebView|loadUrl\(' android-mobile/app/src/main
          ! grep -R -Fq 'MANAGE_EXTERNAL_STORAGE' android-mobile/app/src/main
          ! grep -R -Fq 'REQUEST_INSTALL_PACKAGES' android-mobile/app/src/main
          ! grep -R -Fq 'setAllowFileAccess(true)' android-mobile/app/src/main

      - name: Build and lint FormatX Native Android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all --project-dir android-mobile \
            :app:assembleDebug :app:lintDebug

      - name: Validate generated native APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(stat -c '%s' "$APK")" -gt 100000
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          test "${#SHA256}" -eq 64
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Publish native APK and metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="android-mobile/app/build/outputs/apk/debug/app-debug.apk"
          DEST="docs/scifi-ui/downloads/FormatX-Native-Android.apk"
          VERSIONED="docs/scifi-ui/downloads/FormatX-Native-Android-1.1.0-beta.apk"
          DIGEST_FILE="docs/scifi-ui/downloads/FormatX-Native-Android.apk.sha256"
          MANIFEST="docs/scifi-ui/downloads/android-native-update.json"

          cp "$APK" "$DEST"
          cp "$APK" "$VERSIONED"
          printf '%s  %s\n' "$APK_SHA256" "FormatX-Native-Android.apk" > "$DIGEST_FILE"

          SHA256="$APK_SHA256" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              'versionCode': 110,
              'versionName': '1.1.0-beta',
              'apkUrl': 'https://github.com/hutoczky/FormatX/releases/download/android-native-v1.1.0-beta/FormatX-Native-Android.apk',
              'sha256': os.environ['SHA256'],
              'mandatory': False,
              'notes': 'Első natív Android-kiadás WebView nélkül. ISO/USB, USB-vizsgálat és törlés, kétpaneles fájlkezelés, ZIP, diagnosztika és integritás-ellenőrzés.'
          }
          Path('docs/scifi-ui/downloads/android-native-update.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit downloadable native package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/scifi-ui/downloads/FormatX-Native-Android.apk \
            docs/scifi-ui/downloads/FormatX-Native-Android-1.1.0-beta.apk \
            docs/scifi-ui/downloads/FormatX-Native-Android.apk.sha256 \
            docs/scifi-ui/downloads/android-native-update.json
          if git diff --cached --quiet; then
            echo "No native Android package changes to commit."
            exit 0
          fi
          git commit -m "Publish FormatX Native Android 1.1.0 beta APK"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Build summary
        run: |
          {
            echo "## FormatX Native Android 1.1.0 beta"
            echo
            echo "Native WebView-free APK build: PASS"
            echo
            echo "SHA256: $APK_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record successful native build
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "✅ **PASS — FormatX Native Android 1.1.0 beta elkészült**

          - Forrás commit: \`${GITHUB_SHA}\`
          - Csomag: \`hu.formatx.mobile\`
          - WebView: nincs
          - SHA-256: \`${APK_SHA256}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed native build
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 116 --repo "$GITHUB_REPOSITORY" --body "❌ **FAILED — FormatX Native Android build**

          - Forrás commit: \`${GITHUB_SHA}\`
          - Futás: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
