name: r229 reduced first-paint CSS

on:
  push:
    paths:
      - '.github/workflows/r229-first-paint-css.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build reduced-motion first-paint layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('docs/scifi-ui')
          styles = root / 'styles'
          sources = [
              'formatx-apex.css',
              'formatx-category-positioning.css',
              'formatx-first-paint-r206.css',
              'formatx-readability-floor.css',
          ]
          parts = [
              '/* FormatX r229 — compact reduced-motion first-paint contract. */',
              '/* Full reduced styling is progressively applied after load. */',
          ]
          for name in sources:
              text = (styles / name).read_text(encoding='utf-8-sig')
              parts.append(f'\n/* ===== BEGIN {name} ===== */\n{text}\n/* ===== END {name} ===== */\n')
          parts.append(r'''
/* Final first-paint typography/focus floor mirrors Design System 2 without
   pulling the entire below-fold design system into the render-blocking path. */
html[data-fx-design-system="2"]{color-scheme:dark;--fx-focus:#b9f5ff;--fx-font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
html[data-fx-design-system="2"] body{color:#f4fbff;font-family:var(--fx-font-sans);line-height:1.55;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
html[data-fx-design-system="2"] :where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--fx-focus)!important;outline-offset:3px!important}
''')
          (styles / 'formatx-first-paint-reduced-r229.css').write_text('\n'.join(parts), encoding='utf-8')

          loader = root / 'scripts' / 'formatx-reduced-style-loader-r229.js'
          loader.write_text(r'''(function(){
'use strict';
const root=document.documentElement;
if(root.dataset.fxReducedStyleLoaderR229)return;
root.dataset.fxReducedStyleLoaderR229='standby';
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
if(!reduced.matches){root.dataset.fxReducedStyleLoaderR229='normal-bypass';return;}
const full=document.querySelector('link[data-fx-critical-reduced-r228="true"]');
if(!(full instanceof HTMLLinkElement)){root.dataset.fxReducedStyleLoaderR229='missing-full-style';return;}
const activate=()=>{
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    full.media='all';
    root.dataset.fxReducedStyleLoaderR229='full-style-active';
  }));
};
if(document.readyState==='complete')activate();
else addEventListener('load',activate,{once:true});
}());
''', encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          old = '<link rel="stylesheet" data-fx-critical-reduced-r228="true" href="./styles/formatx-critical-reduced-r228.css?v=20260819-r228" media="(prefers-reduced-motion: reduce)">'
          new = '<link rel="stylesheet" data-fx-first-paint-reduced-r229="true" href="./styles/formatx-first-paint-reduced-r229.css?v=20260819-r229" media="(prefers-reduced-motion: reduce)">\n  <link rel="stylesheet" data-fx-critical-reduced-r228="true" href="./styles/formatx-critical-reduced-r228.css?v=20260819-r228" media="print">\n  <script defer data-fx-reduced-style-loader-r229="true" src="./scripts/formatx-reduced-style-loader-r229.js?v=20260819-r229"></script>'
          if html.count(old) != 1:
              raise SystemExit(f'index.html: expected one r228 reduced link, got {html.count(old)}')
          index.write_text(html.replace(old,new,1), encoding='utf-8')
          PY

          git diff --check
          grep -n 'r229\|critical-reduced-r228' docs/scifi-ui/index.html

      - name: Commit first-paint layer
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html \
            docs/scifi-ui/styles/formatx-first-paint-reduced-r229.css \
            docs/scifi-ui/scripts/formatx-reduced-style-loader-r229.js
          git commit -m 'r229 split reduced first paint from full visual CSS'
          git push origin HEAD:master
