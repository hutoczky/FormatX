name: Verify r424 sharp mobile MAG finish

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-regression-r310.js'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r424-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate r424 native sharp optics source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD='docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
          REGRESSION='docs/scifi-ui/scripts/formatx-mobile-regression-r310.js'

          node --check "$SHADER"
          node --check "$AWARD"
          node --check "$REGRESSION"

          grep -Fq 'r424 sharp optics' "$CSS"
          grep -Fq 'brightness(1.12)' "$CSS"
          grep -Fq 'contrast(1.22)' "$CSS"
          grep -Fq 'saturate(1.38)' "$CSS"
          ! grep -Fq 'blur(' "$CSS"

          grep -Fq 'const IDLE_ENERGY = mobile ? .36 : .32' "$SHADER"
          grep -Fq 'mobile?1.75:1.55' "$SHADER"
          grep -Fq 'mobile?980000:1050000' "$SHADER"
          grep -Fq 'vec3 filmic' "$SHADER"
          grep -Fq 'float irisBand' "$SHADER"
          grep -Fq 'float axisV' "$SHADER"
          grep -Fq 'fxCoreOpticsR424' "$SHADER"
          grep -Fq 'dpr-cap-1.75-pixel-budget-980k' "$SHADER"
          ! grep -Eq "getContext\\(['\"]2d['\"]|drawImage\\s*\\(|new[[:space:]]+Image\\s*\\(" "$SHADER"

          grep -Fq 'fxFinalValidationR424' "$AWARD"
          grep -Fq 'retired-r424-native-shader-optics' "$AWARD"
          grep -Fq 'retired-r424-native-shader-optics' "$REGRESSION"
          grep -Fq 'formatx-core-shapeshifter-r337-css' "$REGRESSION"

      - name: Verify production serves r424 sharp mobile MAG
        shell: bash
        run: |
          set -euo pipefail
          CSS_URL='https://www.formatxsuite.com/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
          JS_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-award-runtime-r206.js'
          REGRESSION_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-mobile-regression-r310.js'
          CSS_TMP="$RUNNER_TEMP/r424-live.css"
          JS_TMP="$RUNNER_TEMP/r424-live.js"
          AWARD_TMP="$RUNNER_TEMP/r424-award-live.js"
          REGRESSION_TMP="$RUNNER_TEMP/r424-regression-live.js"
          ok=0

          for attempt in $(seq 1 45); do
            echo "r424 live verification $attempt/45"
            suffix="r424_live=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CSS_URL}?${suffix}" -o "$CSS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${JS_URL}?${suffix}" -o "$JS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${AWARD_URL}?${suffix}" -o "$AWARD_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${REGRESSION_URL}?${suffix}" -o "$REGRESSION_TMP"; then
              if grep -Fq 'r424 sharp optics' "$CSS_TMP" \
                && grep -Fq 'brightness(1.12)' "$CSS_TMP" \
                && grep -Fq 'contrast(1.22)' "$CSS_TMP" \
                && ! grep -Fq 'blur(' "$CSS_TMP" \
                && grep -Fq 'const IDLE_ENERGY = mobile ? .36 : .32' "$JS_TMP" \
                && grep -Fq 'mobile?1.75:1.55' "$JS_TMP" \
                && grep -Fq 'mobile?980000:1050000' "$JS_TMP" \
                && grep -Fq 'fxCoreOpticsR424' "$JS_TMP" \
                && grep -Fq 'fxFinalValidationR424' "$AWARD_TMP" \
                && grep -Fq 'retired-r424-native-shader-optics' "$REGRESSION_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 6
          done

          test "$ok" = 1
          echo 'PASS: production serves r424 sharp native WebGL optics without legacy blur or image-backed MAG layers.'

      - name: Publish r424 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r424 sharp native MAG finish passed'
          else
            state=failure
            description='Live r424 sharp native MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r424 live mobile MAG finish' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
