name: Verify r373 live mobile visibility recovery

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r373-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate r373 recovery source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          grep -Fq 'FormatX r371 emergency recovery' "$CSS"
          grep -Fq 'brightness(.82)' "$CSS"
          grep -Fq 'contrast(.78)' "$CSS"
          grep -Fq 'blur(.60px)' "$CSS"
          grep -Fq 'brightness(.80)' "$CSS"
          grep -Fq 'contrast(.76)' "$CSS"
          grep -Fq 'blur(.70px)' "$CSS"
          grep -Fq 'production-deploy-r373-emergency-visibility-recovery' "$CSS"
          ! grep -Fq 'html:root:root:root' "$CSS"
          ! grep -Fq 'FINAL MOBILE CONTROL GEOMETRY' "$CSS"

      - name: Verify production serves r373 visibility recovery
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          TMP="$RUNNER_TEMP/r373-live.css"
          ok=0
          for attempt in $(seq 1 24); do
            echo "r373 live verification $attempt/24"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${URL}?r373_live=${GITHUB_RUN_ID}_${attempt}" -o "$TMP"; then
              if grep -Fq 'FormatX r371 emergency recovery' "$TMP" \
                && grep -Fq 'brightness(.82)' "$TMP" \
                && grep -Fq 'contrast(.78)' "$TMP" \
                && grep -Fq 'blur(.60px)' "$TMP" \
                && grep -Fq 'production-deploy-r373-emergency-visibility-recovery' "$TMP" \
                && ! grep -Fq 'html:root:root:root' "$TMP"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS: production serves r373 visible mobile MAG optics without the r372 final-owner override.'

      - name: Publish r373 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r373 visible mobile MAG recovery passed'
          else
            state=failure
            description='Live r373 mobile visibility recovery verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r373 live mobile recovery' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
