name: Verify r374 live mobile MAG lighting

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r374-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate r374 mobile lighting source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'

          node --check "$SHADER"

          grep -Fq 'FormatX r374' "$CSS"
          grep -Fq 'production-deploy-r374-feathered-mobile-lighting' "$CSS"
          grep -Fq 'opacity: .040' "$CSS"
          grep -Fq 'opacity: .028' "$CSS"
          ! grep -Fq 'html:root:root:root' "$CSS"
          ! grep -Fq 'FINAL MOBILE CONTROL GEOMETRY' "$CSS"

          grep -Fq "fresnelPower: '2.0'" "$SHADER"
          grep -Fq "innerHeartBase: '.15'" "$SHADER"
          grep -Fq "innerHeartBreath: '.27'" "$SHADER"
          grep -Fq "rimBase: '.10'" "$SHADER"
          grep -Fq "rimAlpha: '.035'" "$SHADER"
          grep -Fq "fresnelPower: '2.7'" "$SHADER"
          grep -Fq "innerHeartBase: '.24'" "$SHADER"
          grep -Fq "rimBase: '.16'" "$SHADER"
          grep -Fq 'fxCoreMobileLightingR374' "$SHADER"
          grep -Fq "desktop-r326-unchanged" "$SHADER"

      - name: Verify production serves r374 feathered lighting
        shell: bash
        run: |
          set -euo pipefail
          CSS_URL='https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          JS_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          CSS_TMP="$RUNNER_TEMP/r374-live.css"
          JS_TMP="$RUNNER_TEMP/r374-live.js"
          ok=0

          for attempt in $(seq 1 30); do
            echo "r374 live verification $attempt/30"
            suffix="r374_live=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CSS_URL}?${suffix}" -o "$CSS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${JS_URL}?${suffix}" -o "$JS_TMP"; then
              if grep -Fq 'FormatX r374' "$CSS_TMP" \
                && grep -Fq 'production-deploy-r374-feathered-mobile-lighting' "$CSS_TMP" \
                && grep -Fq "fresnelPower: '2.0'" "$JS_TMP" \
                && grep -Fq "innerHeartBase: '.15'" "$JS_TMP" \
                && grep -Fq "rimBase: '.10'" "$JS_TMP" \
                && grep -Fq 'fxCoreMobileLightingR374' "$JS_TMP" \
                && grep -Fq "desktop-r326-unchanged" "$JS_TMP" \
                && ! grep -Fq 'html:root:root:root' "$CSS_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done

          test "$ok" = 1
          echo 'PASS: production serves r374 mobile-only feathered heart/Fresnel lighting while preserving the visible recovery geometry.'

      - name: Publish r374 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r374 feathered mobile MAG lighting passed'
          else
            state=failure
            description='Live r374 mobile MAG lighting verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r374 live mobile lighting' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
