name: Verify r409 live mobile MAG lighting

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r409-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate r409 mobile lighting source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD='docs/scifi-ui/scripts/formatx-award-runtime-r206.js'

          node --check "$SHADER"
          node --check "$AWARD"

          grep -Fq 'FormatX r409' "$CSS"
          grep -Fq 'production-deploy-r409-softer-mobile-crystal' "$CSS"
          grep -Fq 'opacity: .018' "$CSS"
          grep -Fq 'opacity: .012' "$CSS"
          grep -Fq 'brightness(.76)' "$CSS"
          grep -Fq 'contrast(.71)' "$CSS"
          grep -Fq 'blur(.98px)' "$CSS"
          grep -Fq 'brightness(.75)' "$CSS"
          grep -Fq 'contrast(.69)' "$CSS"
          grep -Fq 'blur(1.06px)' "$CSS"
          grep -Fq 'r409-softer-mobile-crystal' "$AWARD"
          grep -Fq 'mobile-optics-r409-cachebust' "$AWARD"
          ! grep -Fq 'html:root:root:root' "$CSS"
          ! grep -Fq 'FINAL MOBILE CONTROL GEOMETRY' "$CSS"

          # r409 changes only composite mobile presentation. The proven WebGL
          # geometry/material contract remains the r374 shader.
          grep -Fq "fresnelPower: '2.0'" "$SHADER"
          grep -Fq "innerHeartBase: '.15'" "$SHADER"
          grep -Fq "innerHeartBreath: '.27'" "$SHADER"
          grep -Fq "rimBase: '.10'" "$SHADER"
          grep -Fq "rimAlpha: '.035'" "$SHADER"
          grep -Fq "fresnelPower: '2.7'" "$SHADER"
          grep -Fq "innerHeartBase: '.24'" "$SHADER"
          grep -Fq "rimBase: '.16'" "$SHADER"
          grep -Fq 'fxCoreMobileLightingR374' "$SHADER"
          grep -Fq "desktop-r326-unchanged" "$SHADER"

      - name: Verify production serves r409 softened lighting
        shell: bash
        run: |
          set -euo pipefail
          CSS_URL='https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          JS_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-award-runtime-r206.js'
          CSS_TMP="$RUNNER_TEMP/r409-live.css"
          JS_TMP="$RUNNER_TEMP/r409-live.js"
          AWARD_TMP="$RUNNER_TEMP/r409-award-live.js"
          ok=0

          for attempt in $(seq 1 45); do
            echo "r409 live verification $attempt/45"
            suffix="r409_live=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CSS_URL}?${suffix}" -o "$CSS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${JS_URL}?${suffix}" -o "$JS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${AWARD_URL}?${suffix}" -o "$AWARD_TMP"; then
              if grep -Fq 'FormatX r409' "$CSS_TMP" \
                && grep -Fq 'production-deploy-r409-softer-mobile-crystal' "$CSS_TMP" \
                && grep -Fq 'opacity: .018' "$CSS_TMP" \
                && grep -Fq 'opacity: .012' "$CSS_TMP" \
                && grep -Fq 'brightness(.76)' "$CSS_TMP" \
                && grep -Fq 'contrast(.71)' "$CSS_TMP" \
                && grep -Fq 'blur(.98px)' "$CSS_TMP" \
                && grep -Fq 'brightness(.75)' "$CSS_TMP" \
                && grep -Fq 'contrast(.69)' "$CSS_TMP" \
                && grep -Fq 'blur(1.06px)' "$CSS_TMP" \
                && grep -Fq 'r409-softer-mobile-crystal' "$AWARD_TMP" \
                && grep -Fq 'mobile-optics-r409-cachebust' "$AWARD_TMP" \
                && grep -Fq "fresnelPower: '2.0'" "$JS_TMP" \
                && grep -Fq "innerHeartBase: '.15'" "$JS_TMP" \
                && grep -Fq "rimBase: '.10'" "$JS_TMP" \
                && grep -Fq 'fxCoreMobileLightingR374' "$JS_TMP" \
                && grep -Fq "desktop-r326-unchanged" "$JS_TMP" \
                && ! grep -Fq 'html:root:root:root' "$CSS_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 6
          done

          test "$ok" = 1
          echo 'PASS: production serves r409 softer mobile MAG compositing and the r409 cache-busted runtime while preserving proven WebGL geometry/material.'

      - name: Publish r409 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r409 softer mobile MAG lighting passed'
          else
            state=failure
            description='Live r409 mobile MAG lighting verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r409 live mobile lighting' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"