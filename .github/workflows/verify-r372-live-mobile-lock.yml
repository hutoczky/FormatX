name: Verify R460 primary MAG runtime

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-solid-glass-r456.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - 'docs/scifi-ui/scripts/formatx-native-mag-touch-r434.js'
      - 'docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - '.github/scripts/validate-living-core-r425-source.cjs'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r460:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate R460 source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          SOLID='docs/scifi-ui/scripts/formatx-mobile-solid-glass-r456.js'
          CURRENT='docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
          MOTION='docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
          TOUCH='docs/scifi-ui/scripts/formatx-native-mag-touch-r434.js'
          MINI='docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'

          node --check "$SHADER"
          node --check "$SOLID"
          node --check "$CURRENT"
          node --check "$MOTION"
          node --check "$TOUCH"
          node --check "$MINI"
          node .github/scripts/validate-living-core-r425-source.cjs

          grep -Fq "const VERSION='r460-uniform-solid-glass-soft-mobile-optics'" "$SOLID"
          grep -Fq "const smoothWeight=mobile?'.992':'.930'" "$SOLID"
          grep -Fq "glass+=spectral*fresnel*(.76+.48*visualEnergy);" "$SOLID"
          grep -Fq "organ+=ice*nucleus*(2.02+.62*visualEnergy);" "$SOLID"
          grep -Fq "fxCoreMobileOpticalBalanceR460=mobile?'soft-nucleus-broad-fresnel-feather':'desktop-material-unchanged'" "$SOLID"
          grep -Fq "fxCoreOuterNoiseR456='disabled-on-glass-shell'" "$SOLID"
          grep -Fq "fxCoreTriangleEdgesR456='disabled'" "$SOLID"

          grep -Fq 'formatx-mobile-solid-glass-r456.js?v=20260830-r460-soft-mobile-optics' "$CURRENT"
          grep -Fq 'formatx-core-shapeshifter-r337.css?v=20260830-r460-soft-mobile-rim' "$CURRENT"
          grep -Fq 'formatx-native-mag-touch-r434.js?v=20260830-r460-controller-tap-drag-safe' "$CURRENT"
          grep -Fq "cleanupLegacyMagRuntime()" "$CURRENT"
          grep -Fq "fxPrimaryMagOwnerR460='r326-only'" "$CURRENT"

          grep -Fq 'formatx-current-mag-loader-r422.js?v=20260830-r460-primary-controller-clean-runtime' "$MOTION"
          grep -Fq 'isRetiredMagRuntime' "$MOTION"
          grep -Fq "fxLegacyMagRuntimeCleanupR460='ready'" "$MOTION"
          grep -Fq '.fx-crystal-organism-r326-stage' "$MOTION"

          grep -Fq "const VERSION='native-r326-touch-r460-controller-tap'" "$TOUCH"
          grep -Fq 'window.FormatXMiniMagR459' "$TOUCH"
          grep -Fq 'formatx:heromagcontrollerrequest' "$TOUCH"
          grep -Fq "fxHeroMagControllerR460='ready'" "$TOUCH"
          grep -Fq 'formatx:heromagcontrollerrequest' "$MINI"
          grep -Fq "fxMiniMagHeroBridgeR460='ready'" "$MINI"

          grep -Fq 'brightness(1.01)' "$CSS"
          grep -Fq 'contrast(.86)' "$CSS"
          grep -Fq 'blur(.90px)' "$CSS"
          grep -Fq 'production-r460-single-native-webgl-optics-owner-soft-mobile-rim' "$CSS"
          grep -Fq "const REVISION = 'living-luminous-electric-crystal-r454'" "$SHADER"
          grep -Fq 'single-luminous-webgl-material-owner' "$SHADER"

      - name: Verify production serves R460 chain
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'
          SOLID_URL="$ORIGIN/scifi-ui/scripts/formatx-mobile-solid-glass-r456.js"
          CURRENT_URL="$ORIGIN/scifi-ui/scripts/formatx-current-mag-loader-r422.js"
          MOTION_URL="$ORIGIN/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js"
          TOUCH_URL="$ORIGIN/scifi-ui/scripts/formatx-native-mag-touch-r434.js"
          MINI_URL="$ORIGIN/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js"
          CSS_URL="$ORIGIN/scifi-ui/styles/formatx-core-shapeshifter-r337.css"
          SOLID_TMP="$RUNNER_TEMP/r460-solid-live.js"
          CURRENT_TMP="$RUNNER_TEMP/r460-current-live.js"
          MOTION_TMP="$RUNNER_TEMP/r460-motion-live.js"
          TOUCH_TMP="$RUNNER_TEMP/r460-touch-live.js"
          MINI_TMP="$RUNNER_TEMP/r460-mini-live.js"
          CSS_TMP="$RUNNER_TEMP/r460-optics-live.css"
          ok=0

          for attempt in $(seq 1 45); do
            echo "R460 live verification $attempt/45"
            suffix="r460=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${SOLID_URL}?${suffix}" -o "$SOLID_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CURRENT_URL}?${suffix}" -o "$CURRENT_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${MOTION_URL}?${suffix}" -o "$MOTION_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${TOUCH_URL}?${suffix}" -o "$TOUCH_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${MINI_URL}?${suffix}" -o "$MINI_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CSS_URL}?${suffix}" -o "$CSS_TMP"; then
              if grep -Fq "const VERSION='r460-uniform-solid-glass-soft-mobile-optics'" "$SOLID_TMP" \
                && grep -Fq 'formatx-mobile-solid-glass-r456.js?v=20260830-r460-soft-mobile-optics' "$CURRENT_TMP" \
                && grep -Fq 'formatx-current-mag-loader-r422.js?v=20260830-r460-primary-controller-clean-runtime' "$MOTION_TMP" \
                && grep -Fq "const VERSION='native-r326-touch-r460-controller-tap'" "$TOUCH_TMP" \
                && grep -Fq 'formatx:heromagcontrollerrequest' "$MINI_TMP" \
                && grep -Fq 'production-r460-single-native-webgl-optics-owner-soft-mobile-rim' "$CSS_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 6
          done

          test "$ok" = 1
          echo 'PASS: production serves the R460 soft mobile MAG, hero-controller bridge and clean single-R326 runtime chain.'

      - name: Publish R460 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='R460 primary MAG runtime contract passed'
          else
            state=failure
            description='R460 primary MAG runtime verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R460 MAG runtime' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"