name: Verify r410 approved-v51 mobile MAG finish

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r410-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate r410 approved-v51 mobile finish source contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD='docs/scifi-ui/scripts/formatx-award-runtime-r206.js'

          node --check "$SHADER"
          node --check "$AWARD"

          grep -Fq 'FormatX r410' "$CSS"
          grep -Fq 'approved v51 reference crystal' "$CSS"
          grep -Fq 'production-deploy-r410-v51-approved-detail-finish' "$CSS"
          grep -Fq 'opacity: .008' "$CSS"
          grep -Fq 'opacity: .005' "$CSS"
          grep -Fq 'brightness(.73)' "$CSS"
          grep -Fq 'contrast(.79)' "$CSS"
          grep -Fq 'blur(.46px)' "$CSS"
          grep -Fq 'brightness(.72)' "$CSS"
          grep -Fq 'contrast(.78)' "$CSS"
          grep -Fq 'blur(.52px)' "$CSS"
          grep -Fq 'r410-v51-approved-detail' "$AWARD"
          grep -Fq 'mobile-optics-r410-v51-cachebust' "$AWARD"
          ! grep -Fq 'html:root:root:root' "$CSS"
          ! grep -Fq 'FINAL MOBILE CONTROL GEOMETRY' "$CSS"

          # r410 changes only the mobile presentation finish. The event-driven
          # current WebGL renderer and its proven mobile/desktop lighting contract
          # remain authoritative while the approved v51 visual lineage is restored.
          grep -Fq "fresnelPower: '2.0'" "$SHADER"
          grep -Fq "innerHeartBase: '.15'" "$SHADER"
          grep -Fq "innerHeartBreath: '.27'" "$SHADER"
          grep -Fq "rimBase: '.10'" "$SHADER"
          grep -Fq "rimAlpha: '.035'" "$SHADER"
          grep -Fq "fresnelPower: '2.7'" "$SHADER"
          grep -Fq "innerHeartBase: '.24'" "$SHADER"
          grep -Fq "rimBase: '.16'" "$SHADER"
          grep -Fq 'fxCoreMobileLightingR374' "$SHADER"
          grep -Fq "desktop-r326-unchanged" "$SHADER"

      - name: Verify production serves r410 approved-v51 detail finish
        shell: bash
        run: |
          set -euo pipefail
          CSS_URL='https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
          JS_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          AWARD_URL='https://www.formatxsuite.com/scifi-ui/scripts/formatx-award-runtime-r206.js'
          CSS_TMP="$RUNNER_TEMP/r410-live.css"
          JS_TMP="$RUNNER_TEMP/r410-live.js"
          AWARD_TMP="$RUNNER_TEMP/r410-award-live.js"
          ok=0

          for attempt in $(seq 1 45); do
            echo "r410 live verification $attempt/45"
            suffix="r410_live=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CSS_URL}?${suffix}" -o "$CSS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${JS_URL}?${suffix}" -o "$JS_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${AWARD_URL}?${suffix}" -o "$AWARD_TMP"; then
              if grep -Fq 'FormatX r410' "$CSS_TMP" \
                && grep -Fq 'approved v51 reference crystal' "$CSS_TMP" \
                && grep -Fq 'production-deploy-r410-v51-approved-detail-finish' "$CSS_TMP" \
                && grep -Fq 'opacity: .008' "$CSS_TMP" \
                && grep -Fq 'opacity: .005' "$CSS_TMP" \
                && grep -Fq 'brightness(.73)' "$CSS_TMP" \
                && grep -Fq 'contrast(.79)' "$CSS_TMP" \
                && grep -Fq 'blur(.46px)' "$CSS_TMP" \
                && grep -Fq 'brightness(.72)' "$CSS_TMP" \
                && grep -Fq 'contrast(.78)' "$CSS_TMP" \
                && grep -Fq 'blur(.52px)' "$CSS_TMP" \
                && grep -Fq 'r410-v51-approved-detail' "$AWARD_TMP" \
                && grep -Fq 'mobile-optics-r410-v51-cachebust' "$AWARD_TMP" \
                && grep -Fq "fresnelPower: '2.0'" "$JS_TMP" \
                && grep -Fq "innerHeartBase: '.15'" "$JS_TMP" \
                && grep -Fq "rimBase: '.10'" "$JS_TMP" \
                && grep -Fq 'fxCoreMobileLightingR374' "$JS_TMP" \
                && grep -Fq "desktop-r326-unchanged" "$JS_TMP" \
                && ! grep -Fq 'html:root:root:root' "$CSS_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 6
          done

          test "$ok" = 1
          echo 'PASS: production serves r410 approved-v51 mobile detail finish with restrained edge energy and the current proven WebGL runtime.'

      - name: Publish r410 live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r410 approved-v51 mobile MAG finish passed'
          else
            state=failure
            description='Live r410 approved-v51 mobile MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r410 live mobile MAG finish' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
