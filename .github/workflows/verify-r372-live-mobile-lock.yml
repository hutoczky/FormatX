# R473 final live runtime gate after WDA contract synchronization.
name: Verify R473 mobile MAG optics on R468 runtime

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-solid-glass-r456.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - 'docs/scifi-ui/scripts/formatx-core-life-r455.js'
      - 'docs/scifi-ui/scripts/formatx-native-mag-touch-r434.js'
      - 'docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - 'docs/scifi-ui/styles/formatx-core-life-r455.css'
      - '.github/scripts/validate-living-core-r425-source.cjs'
      - '.github/scripts/validate-living-core-r425-browser.cjs'
      - '.github/workflows/verify-r372-live-mobile-lock.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r473:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate R473 display on R468 source contract
        shell: bash
        run: |
          set -euo pipefail
          SHADER='docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
          SOLID='docs/scifi-ui/scripts/formatx-mobile-solid-glass-r456.js'
          GOVERNOR='docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js'
          CURRENT='docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
          MOTION='docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
          LIFE='docs/scifi-ui/scripts/formatx-core-life-r455.js'
          LIFE_CSS='docs/scifi-ui/styles/formatx-core-life-r455.css'
          TOUCH='docs/scifi-ui/scripts/formatx-native-mag-touch-r434.js'
          MINI='docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'

          node --check "$SHADER"
          node --check "$SOLID"
          node --check "$GOVERNOR"
          node --check "$CURRENT"
          node --check "$MOTION"
          node --check "$LIFE"
          node --check "$TOUCH"
          node --check "$MINI"
          node .github/scripts/validate-living-core-r425-source.cjs

          # R473 is the final display layer carried by the existing R472 loader route.
          grep -Fq 'formatx-core-life-r455.css?v=20260831-r472-pc-bright-low-halo' "$CURRENT"
          grep -Fq "fxCurrentMagOpticsR472=mobile?'pc-bright-centre-restrained-perimeter-zero-idle':'desktop-optics-unchanged'" "$CURRENT"
          grep -Fq 'formatx-current-mag-loader-r422.js?v=20260831-r472-pc-bright-low-halo' "$MOTION"
          grep -Fq 'formatx-core-life-r455.css?v=20260831-r472-pc-bright-low-halo' "$MOTION"
          grep -Fq "fxFinalVisualRevisionR472='pc-bright-low-halo-mobile-mag'" "$MOTION"

          grep -Fq 'FormatX r473' "$LIFE_CSS"
          grep -Fq 'balanced mobile crystal detail' "$LIFE_CSS"
          grep -Fq 'opacity: .985' "$LIFE_CSS"
          grep -Fq 'brightness(1.015)' "$LIFE_CSS"
          grep -Fq 'contrast(.895)' "$LIFE_CSS"
          grep -Fq 'saturate(1.035)' "$LIFE_CSS"
          grep -Fq 'blur(.20px)' "$LIFE_CSS"
          grep -Fq 'image-rendering: auto' "$LIFE_CSS"
          grep -Fq '.skip-link:not(:focus):not(:focus-visible)' "$LIFE_CSS"
          grep -Fq 'clip-path: inset(50%)' "$LIFE_CSS"
          grep -Fq 'production-r473-balanced-mobile-facets-subpixel-edge-feather' "$LIFE_CSS"
          grep -Fq 'animation: none' "$LIFE_CSS"
          ! grep -Fq 'fx-core-r468-compositor-breathe' "$LIFE_CSS"

          grep -Fq "const VERSION='r465-uniform-solid-glass-soft-perimeter-low-bloom-mobile-optics'" "$SOLID"
          grep -Fq 'float edge=0.0;' "$SOLID"
          grep -Fq "fxCoreMobileIdlePolicyR426='explicit-mag-interaction-only-zero-idle'" "$GOVERNOR"
          ! grep -Fq "active('scroll-r463'" "$GOVERNOR"
          ! grep -Fq "active('resize-r463'" "$GOVERNOR"
          ! grep -Fq 'setInterval(' "$LIFE"
          ! grep -Fq 'requestAnimationFrame(' "$LIFE"
          grep -Fq "const REVISION = 'living-luminous-electric-crystal-r454'" "$SHADER"
          grep -Fq 'single-luminous-webgl-material-owner' "$SHADER"

      - name: Verify production serves R473 display chain
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'
          CURRENT_URL="$ORIGIN/scifi-ui/scripts/formatx-current-mag-loader-r422.js"
          MOTION_URL="$ORIGIN/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js"
          LIFE_CSS_URL="$ORIGIN/scifi-ui/styles/formatx-core-life-r455.css"
          CURRENT_TMP="$RUNNER_TEMP/r473-current-live.js"
          MOTION_TMP="$RUNNER_TEMP/r473-motion-live.js"
          LIFE_CSS_TMP="$RUNNER_TEMP/r473-life-live.css"
          ok=0

          for attempt in $(seq 1 45); do
            echo "R473 live verification $attempt/45"
            suffix="r473=${GITHUB_RUN_ID}_${attempt}"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${CURRENT_URL}?${suffix}" -o "$CURRENT_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${MOTION_URL}?${suffix}" -o "$MOTION_TMP" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${LIFE_CSS_URL}?${suffix}" -o "$LIFE_CSS_TMP"; then
              if grep -Fq 'formatx-core-life-r455.css?v=20260831-r472-pc-bright-low-halo' "$CURRENT_TMP" \
                && grep -Fq 'formatx-current-mag-loader-r422.js?v=20260831-r472-pc-bright-low-halo' "$MOTION_TMP" \
                && grep -Fq 'FormatX r473' "$LIFE_CSS_TMP" \
                && grep -Fq 'opacity: .985' "$LIFE_CSS_TMP" \
                && grep -Fq 'brightness(1.015)' "$LIFE_CSS_TMP" \
                && grep -Fq 'contrast(.895)' "$LIFE_CSS_TMP" \
                && grep -Fq 'saturate(1.035)' "$LIFE_CSS_TMP" \
                && grep -Fq 'blur(.20px)' "$LIFE_CSS_TMP" \
                && grep -Fq '.skip-link:not(:focus):not(:focus-visible)' "$LIFE_CSS_TMP" \
                && ! grep -Fq 'fx-core-r468-compositor-breathe' "$LIFE_CSS_TMP"; then
                ok=1
                break
              fi
            fi
            sleep 6
          done

          test "$ok" = 1
          echo 'PASS: production serves the R473 balanced faceted mobile MAG display on the R468 explicit-energy, R465 zero-idle runtime.'

      - name: Publish R468 runtime status with R473 display
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='R468 runtime + R473 mobile MAG display passed'
          else
            state=failure
            description='R468/R473 primary MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R468 MAG runtime' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
