name: Diagnose mobile control motion r321
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/scripts/formatx-core-shapeshifter-r337.js'
      - 'docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - 'docs/scifi-ui/styles/formatx-mobile-control-stability-r320.css'
      - '.github/workflows/diagnose-mobile-controls-r321.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/control-motion" && cd "$RUNNER_TEMP/control-motion"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate stable controls and settled native MAG morph
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/control-motion-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/control-motion"
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=(value,message)=>{if(!value)throw new Error(message);};
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const r=document.documentElement.dataset;
              return r.fxCrystalOrganismR326==='ready'
                && r.fxCoreMobileV69==='ready-v69'
                && r.fxControlOwnerR268==='ready'
                && r.fxCoreShapeshifterR337==='ready'
                && Boolean(document.querySelector('.fx-reference-mag-button'))
                && Boolean(document.querySelector('.fx-three-sound'));
            },null,{timeout:45000});
            await page.waitForTimeout(800);

            const frames=await page.evaluate(async()=>{
              const out=[];
              for(let i=0;i<24;i++){
                await new Promise(resolve=>requestAnimationFrame(resolve));
                const sound=document.querySelector('.fx-three-sound');
                const r=sound?.getBoundingClientRect();
                const hit=r?document.elementFromPoint(r.left+r.width/2,r.top+r.height/2):null;
                out.push(r?{x:r.x,y:r.y,w:r.width,h:r.height,hit:Boolean(sound&&hit&&sound.contains(hit))}:null);
              }
              return out;
            });
            assert(frames.every(Boolean),'SOUND geometry disappeared during sampling');
            const span=key=>Math.max(...frames.map(v=>v[key]))-Math.min(...frames.map(v=>v[key]));
            const motion={x:span('x'),y:span('y'),w:span('w'),h:span('h')};
            console.log('CONTROL_MOTION_SUMMARY',JSON.stringify(motion));
            assert(Object.values(motion).every(v=>v<=1.5),'mobile controls are not geometrically stable: '+JSON.stringify(motion));
            assert(frames.every(v=>v.w>=44&&v.h>=44&&v.hit),'SOUND control is not continuously actionable');

            const startShape=await page.evaluate(()=>document.documentElement.dataset.fxCoreShapeR337||'');
            const samples=[];
            for(let i=0;i<2;i++){
              const before=await page.evaluate(()=>({shape:document.documentElement.dataset.fxCoreShapeR337||'',morph:Number(window.FormatXCoreMobileV69?.morph)}));
              const mag=page.locator('.fx-reference-mag-button').first();
              assert(await mag.isVisible(),'MAG control is not visible');
              await mag.click();
              await page.waitForFunction(previous=>document.documentElement.dataset.fxCoreShapeR337!==previous,before.shape,{timeout:3000});
              const targetShape=await page.evaluate(()=>document.documentElement.dataset.fxCoreShapeR337||'');
              const target=targetShape==='sphere'?1:0;
              await page.waitForFunction(({target,targetShape})=>{
                const morph=Number(window.FormatXCoreMobileV69?.morph);
                const settled=document.documentElement.dataset.fxCoreShape;
                return settled===targetShape&&Number.isFinite(morph)&&Math.abs(morph-target)<.07;
              },{target,targetShape},{timeout:10000});
              const after=await page.evaluate(()=>({shape:document.documentElement.dataset.fxCoreShapeR337||'',settled:document.documentElement.dataset.fxCoreShape||'',morph:Number(window.FormatXCoreMobileV69?.morph)}));
              samples.push({before,after,target});
              assert(Math.abs(after.morph-target)<.07,'native WebGL MAG did not settle at target: '+JSON.stringify(samples));
            }
            const finalShape=await page.evaluate(()=>document.documentElement.dataset.fxCoreShapeR337||'');
            assert(finalShape===startShape,'two MAG activations did not return to the starting shape: '+JSON.stringify({startShape,finalShape,samples}));
            console.log('MAG_NATIVE_WEBGL_SHAPE_SHIFT','PASS',JSON.stringify(samples));

            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            assert(overflow<=2,'shape shift introduced horizontal overflow: '+overflow);
            await ctx.close();await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r432 controls, direct MAG runtime and settled WebGL morph passed'; else state=failure; description='r432 mobile control or native MAG morph diagnostic failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile control motion diagnostic' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
