name: P0 R528 critical inline candidate

on:
  push:
    branches: [p0-r528-final-owner]
    paths:
      - '.github/workflows/p0-r528-critical-inline-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: f0f7f43c03ec32dbdcee2e7781d06614dbccd5a6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Install cached Worker and Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix billing-worker --prefer-offline
          npm install -g @lhci/cli@0.13.x
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"; echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Capture exact R527 HTML
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r528-base.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          cd billing-worker; nohup npx wrangler dev --config wrangler.r528-base.json --ip 127.0.0.1 --port 8786 --local-protocol https > "$RUNNER_TEMP/base.log" 2>&1 & echo $! > "$RUNNER_TEMP/base.pid"; cd ..
          for i in $(seq 1 60); do curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8786/ -o "$RUNNER_TEMP/r527.html" && break; sleep 1; done
          test -s "$RUNNER_TEMP/r527.html"
      - name: Generate order-preserving inline critical asset
        shell: bash
        run: |
          set -euo pipefail
          HTML="$RUNNER_TEMP/r527.html" node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');const html=fs.readFileSync(process.env.HTML,'utf8');
          const targets=new Set(['/scifi-ui/styles/formatx-critical-shell-v56.css','/scifi-ui/styles/formatx-quality-r461.css','/scifi-ui/styles/formatx-mobile-apex-composition.css','/scifi-ui/styles/formatx-award-readiness.css','/scifi-ui/styles/formatx-mobile-reference-layout-v1.css','/scifi-ui/styles/formatx-flow-first-r74.css','/scifi-ui/styles/formatx-responsive-text-guard-r72.css','/scifi-ui/styles/formatx-mobile-proof-controls-r204.css','/scifi-ui/styles/formatx-mobile-layout-r207.css','/scifi-ui/styles/formatx-first-paint-r206.css','/scifi-ui/styles/formatx-mobile-first-paint-r358.css','/scifi-ui/styles/formatx-p0-first-paint-r490.css']);
          const rows=[];for(const tag of html.match(/<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi)||[]){const href=tag.match(/\bhref=(["'])(.*?)\1/i)?.[2];if(!href)continue;const u=new URL(href,'https://formatxsuite.com/scifi-ui/');if(!targets.has(u.pathname))continue;const media=tag.match(/\bdata-fx-r487-media=(["'])(.*?)\1/i)?.[2]||tag.match(/\bmedia=(["'])(.*?)\1/i)?.[2]||'all';rows.push({pathname:u.pathname,media});}
          if(new Set(rows.map(x=>x.pathname)).size!==targets.size)throw new Error('critical target mismatch');let out='/* R528 exact critical inline candidate */\n';
          for(const row of rows){const file=path.join('docs',row.pathname.slice(1));let css=fs.readFileSync(file,'utf8').replace(/^\uFEFF/,'').replace(/@charset\s+["'][^"']+["']\s*;?/gi,'');if(/@import\s/i.test(css)||/url\s*\(/i.test(css))throw new Error(`unsafe inline dependency: ${file}`);out+=row.media!=='all'?`\n@media ${row.media}{\n${css}\n}\n`:`\n${css}\n`;}
          fs.writeFileSync('docs/scifi-ui/styles/formatx-p0-critical-inline-r528.css',out);console.log(JSON.stringify({count:rows.length,bytes:Buffer.byteLength(out)}));
          NODE
      - name: Generate R527 wrapper with server-side critical inline
        shell: bash
        run: |
          set -euo pipefail
          cat > billing-worker/src/production-content-entry-r528-inline-candidate.js <<'JS'
          import r527Production from './production-content-entry-r527.js';
          const PUBLIC_HOSTS=new Set(['formatxsuite.com','www.formatxsuite.com']);
          const TARGETS=new Set(['/scifi-ui/styles/formatx-critical-shell-v56.css','/scifi-ui/styles/formatx-quality-r461.css','/scifi-ui/styles/formatx-mobile-apex-composition.css','/scifi-ui/styles/formatx-award-readiness.css','/scifi-ui/styles/formatx-mobile-reference-layout-v1.css','/scifi-ui/styles/formatx-flow-first-r74.css','/scifi-ui/styles/formatx-responsive-text-guard-r72.css','/scifi-ui/styles/formatx-mobile-proof-controls-r204.css','/scifi-ui/styles/formatx-mobile-layout-r207.css','/scifi-ui/styles/formatx-first-paint-r206.css','/scifi-ui/styles/formatx-mobile-first-paint-r358.css','/scifi-ui/styles/formatx-p0-first-paint-r490.css']);
          let cssPromise=null;
          function pathname(tag){const m=tag.match(/\bhref=(["'])(.*?)\1/i);if(!m)return'';try{return new URL(m[2],'https://formatxsuite.com/scifi-ui/').pathname}catch{return''}}
          async function criticalCss(env,request){if(!cssPromise){const u=new URL('/scifi-ui/styles/formatx-p0-critical-inline-r528.css',request.url);cssPromise=env.ASSETS.fetch(new Request(u,{method:'GET'})).then(async r=>{if(!r.ok)throw new Error(`critical css ${r.status}`);return r.text();});}return cssPromise;}
          export default{async fetch(request,env,ctx){const response=await r527Production.fetch(request,env,ctx);const url=new URL(request.url);if(!['GET','HEAD'].includes(request.method)||!PUBLIC_HOSTS.has(url.hostname)||request.method==='HEAD')return response;const headers=new Headers(response.headers);if(!(headers.get('Content-Type')||'').includes('text/html'))return response;let removed=0;let html=String(await response.text()).replace(/<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi,tag=>{if(!TARGETS.has(pathname(tag)))return tag;removed++;return'';});if(removed!==TARGETS.size)throw new Error(`R528 critical inline expected ${TARGETS.size}, removed ${removed}`);const css=await criticalCss(env,request);html=html.replace('</head>',`<style data-fx-p0-critical-inline-r528="true">${css}</style>\n</head>`);headers.delete('Content-Length');headers.delete('Content-Encoding');headers.delete('ETag');headers.set('Cache-Control','no-store, max-age=0');headers.set('X-FormatX-Critical-Delivery','r528-server-inline');return new Response(html,{status:response.status,statusText:response.statusText,headers});}};
          JS
          node --check billing-worker/src/production-content-entry-r528-inline-candidate.js
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;c.main='src/production-content-entry-r528-inline-candidate.js';fs.writeFileSync('billing-worker/wrangler.r528-inline.json',JSON.stringify(c,null,2)+'\n');
          NODE
          git diff --check
      - name: Start inline candidate
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/base.pid")" 2>/dev/null || true
          cd billing-worker;nohup npx wrangler dev --config wrangler.r528-inline.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/inline.log" 2>&1 & cd ..
          for i in $(seq 1 60); do curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0;sleep 1;done;cat "$RUNNER_TEMP/inline.log";exit 1
      - name: Prepare profile
        shell: bash
        run: |
          p='${{ matrix.profile }}';if [ "$p" = mobile ];then src='lighthouserc.live.mobile.json';runs=3;else src='lighthouserc.live.json';runs=1;fi
          node - "$src" "$p" "$runs" <<'NODE'
          const fs=require('node:fs');const [src,p,runs]=process.argv.slice(2),c=JSON.parse(fs.readFileSync(src,'utf8'));c.ci.collect.url=[`https://formatxsuite.com:8787/?r528_inline=${p}`];c.ci.collect.numberOfRuns=Number(runs);c.ci.collect.settings.chromeFlags='--headless=new --no-sandbox --disable-dev-shm-usage --ignore-certificate-errors --allow-insecure-localhost';fs.writeFileSync(`lighthouserc.r528-inline-${p}.json`,JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Run Lighthouse candidate
        shell: bash
        run: |
          set -euo pipefail
          p='${{ matrix.profile }}';rm -rf .lighthouseci "artifacts/r528-inline-$p";lhci collect --config="./lighthouserc.r528-inline-$p.json";mkdir -p "artifacts/r528-inline-$p";cp -a .lighthouseci/. "artifacts/r528-inline-$p/"
          PROFILE="$p" node <<'NODE' | tee "artifacts/r528-inline-$p/summary.txt"
          const fs=require('node:fs'),path=require('node:path'),p=process.env.PROFILE,dir=`artifacts/r528-inline-${p}`;const files=fs.readdirSync(dir).filter(x=>x.startsWith('lhr-')&&x.endsWith('.json')).sort();let bad=0;for(const [i,f] of files.entries()){const r=JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')),a=r.audits,c=r.categories,m=a.metrics.details.items[0];const row={run:i+1,performance:Math.round(c.performance.score*100),a11y:Math.round(c.accessibility.score*100),bp:Math.round(c['best-practices'].score*100),seo:Math.round(c.seo.score*100),fcp:a['first-contentful-paint'].numericValue,lcp:a['largest-contentful-paint'].numericValue,observedLcp:m.observedLargestContentfulPaint,tbt:a['total-blocking-time'].numericValue,cls:a['cumulative-layout-shift'].numericValue,ttfb:a['server-response-time'].numericValue,renderBlocking:a['render-blocking-resources']?.numericValue||0};console.log(JSON.stringify(row));if(!(row.lcp<2000&&row.cls<.05&&row.tbt<=150&&row.ttfb<=500))bad++;}if(bad)process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r528-critical-inline-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/r528-inline-${{ matrix.profile }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
