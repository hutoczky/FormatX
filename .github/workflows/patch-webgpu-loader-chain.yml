name: Patch WebGPU loader chain

on:
  push:
    branches:
      - agent/webgpu-tsl-evolution
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Align all loader and stage cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/scifi-ui/scripts/living-architecture.js': [
                  ("./styles/igloo-parity.css?v=20260727-three-1", "./styles/igloo-parity.css?v=20260727-webgpu-1"),
                  ("./scripts/igloo-parity.js?v=20260727-three-1", "./scripts/igloo-parity.js?v=20260727-webgpu-1"),
              ],
              'docs/scifi-ui/scripts/formatx-three-host.js': [
                  ("./three-stage.html?v=20260727-three-6", "./three-stage.html?v=20260727-webgpu-1"),
              ],
              'docs/scifi-ui/scripts/formatx-three-frame-bootstrap.js': [
                  ("20260727-three-6", "20260727-webgpu-1"),
              ],
              'docs/scifi-ui/scripts/igloo-parity.js': [
                  ("'./scripts/formatx-three-host.js?v=20260727-three-6',\n    './scripts/formatx-three-frame-bootstrap.js?v=20260727-three-6',",
                   "'./scripts/formatx-three-host.js?v=20260727-webgpu-1',\n    './scripts/formatx-nextgen-controls.js?v=20260727-webgpu-1',\n    './scripts/formatx-three-frame-bootstrap.js?v=20260727-webgpu-1',"),
              ],
          }

          changed = False
          for name, pairs in replacements.items():
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              original = source
              for old, new in pairs:
                  if old in source:
                      source = source.replace(old, new, 1)
                  elif new not in source:
                      raise SystemExit(f'Expected marker missing from {name}: {old}')
              if source != original:
                  path.write_text(source, encoding='utf-8')
                  changed = True

          if not changed:
              raise SystemExit(0)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'FormatX WebGPU Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/living-architecture.js \
                  docs/scifi-ui/scripts/formatx-three-host.js \
                  docs/scifi-ui/scripts/formatx-three-frame-bootstrap.js \
                  docs/scifi-ui/scripts/igloo-parity.js
          git commit -m 'Wire the WebGPU, XR and generative audio loader chain'
          git push origin HEAD:agent/webgpu-tsl-evolution
