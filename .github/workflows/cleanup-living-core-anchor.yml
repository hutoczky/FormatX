name: Clean Living Core mobile anchor

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Living Core branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Collapse duplicate HUD anchor declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('docs/scifi-ui/scripts/living-core.js')
          source = path.read_text(encoding='utf-8')
          block = """const MOBILE_HUD_ANCHORS = Object.freeze([
            [0.24, 0.37], [0.76, 0.37],
            [0.20, 0.52], [0.80, 0.52],
            [0.26, 0.67], [0.74, 0.67]
          ]);"""
          pattern = r'(?:const MOBILE_HUD_ANCHORS = Object\.freeze\(\[\n(?:.|\n)*?\n\]\);\n\n)+(?=const RELEASE_API)'
          cleaned, count = re.subn(pattern, block + '\n\n', source, count=1)
          if count != 1:
              raise SystemExit('Living Core mobile anchor block was not found')
          path.write_text(cleaned, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/living-core.js

          if git diff --quiet -- docs/scifi-ui/scripts/living-core.js; then
            echo 'Living Core mobile anchor is already unique.'
            exit 0
          fi

          git config user.name 'FormatX Living Core Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/living-core.js
          git commit -m 'Remove duplicate Living Core mobile anchor declaration'
          git push origin HEAD:agent/webgpu-tsl-evolution
