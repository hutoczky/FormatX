name: FormatX native MAG scroll budget R2226

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-native-scroll-budget-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.AUDITED_SHA }}
      - name: Check benchmark source
        run: node --check .github/scripts/measure-mag-scroll-budget-r2226.cjs
      - name: Wait for exact live archive, renderer and revision
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://www.formatxsuite.com/scifi-ui'
          expected=$(node -e 'const s=require("node:fs").readFileSync("docs/scifi-ui/index.html","utf8"); const m=s.match(/formatx-cinematic-archive-r1987\.js\?v=[^"\s<>]+/g); if(!m||m.length!==1)process.exit(1); process.stdout.write(m[0]);')
          native=$(node -e 'const s=require("node:fs").readFileSync("docs/scifi-ui/scripts/formatx-core-mobile-v55.js","utf8"); const m=s.match(/formatx-crystal-organism-r326\.js\?v=[^"\x27\s<>]+/g); if(!m||m.length!==1)process.exit(1); process.stdout.write(m[0]);')
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          ok=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' -o "$tmp/revision" "https://www.formatxsuite.com/production-revision.txt?audit=$AUDITED_SHA-$attempt" \
              && cmp -s docs/production-revision.txt "$tmp/revision" \
              && curl -fsSL --max-time 25 -o "$tmp/home" "$BASE/?scroll-budget=$AUDITED_SHA-$attempt" \
              && grep -Fq -- "$expected" "$tmp/home" \
              && curl -fsSL --max-time 25 -o "$tmp/archive" "$BASE/scripts/$expected" \
              && cmp -s docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js "$tmp/archive" \
              && curl -fsSL --max-time 25 -o "$tmp/native" "$BASE/scripts/$native" \
              && cmp -s docs/scifi-ui/scripts/formatx-crystal-organism-r326.js "$tmp/native"; then
              echo "Exact archive and renderer verified for $AUDITED_SHA"
              ok=1
              break
            fi
            sleep 10
          done
          [[ "$ok" == 1 ]] || { echo "Live release has not converged to the audited SHA" >&2; exit 1; }
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix "$RUNNER_TEMP/fx-scroll-audit" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/fx-scroll-audit/node_modules/.bin/playwright" install --with-deps chromium
      - name: Measure native MAG interaction cost in desktop and mobile Chrome
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/fx-scroll-audit/node_modules
          FORMATX_SCROLL_AUDIT_URL: https://www.formatxsuite.com/scifi-ui/
        run: |
          set -o pipefail
          node .github/scripts/measure-mag-scroll-budget-r2226.cjs 2>&1 | tee formatx-mag-scroll-r2226.txt
      - name: Reject mixed-revision benchmark results
        if: always() && !cancelled()
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp)
          trap 'rm -f -- "$tmp"' EXIT
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' -o "$tmp" "https://www.formatxsuite.com/production-revision.txt?post-audit=$GITHUB_RUN_ID"
          cmp docs/production-revision.txt "$tmp"
      - name: Keep benchmark and reactor viewport evidence for three days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-mag-scroll-budget-r2226
          path: |
            formatx-mag-scroll-r2226.txt
            formatx-reactor-proof/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Publish native MAG scroll audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == 'success' ]]; then
            state=success
            description='Real desktop/mobile MAG scroll interaction audit captured'
          else
            state=failure
            description='MAG scroll interaction smoke failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" \
            -f context='FormatX R2226 native scroll budget' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
