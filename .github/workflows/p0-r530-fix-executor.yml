name: P0 R530 fallback semantic repair

on:
  push:
    branches:
      - p0-r530-candidate

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[candidate] Align R530 fallback Live OS surface') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p0-r530-candidate
      - name: Align fallback semantic proof with current Live OS surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/validate-r522-semantic-mag.cjs')
          s=p.read_text()
          old="live: Boolean(document.querySelector('#live-os,#live-os-overview,[data-fx-live-os]'))"
          new="live: Boolean(document.querySelector('#live-os,#live-os-overview,[data-fx-live-os],[data-fx-live-os-launcher],[data-fx-live-os-cta]'))"
          if old not in s:
              raise SystemExit('R522 fallback Live OS selector anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check .github/scripts/validate-r522-semantic-mag.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/validate-r522-semantic-mag.cjs
          git commit -m '[candidate] Align R530 fallback Live OS surface'
          git push origin HEAD:p0-r530-candidate
