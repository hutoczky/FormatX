name: Fix full-version licensing copy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-full-version-license-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Correct public product and licence wording
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'docs/scifi-ui/index.html': [
                  ('A FormatX többplatformos technikusi rendszer meghajtókezeléshez, rendszerdiagnosztikához és rendszer-előkészítéshez. A próbaverzió Linux/Bazzite, Windows és macOS rendszeren is használható.',
                   'A FormatX teljes értékű, többplatformos technikusi rendszer meghajtókezeléshez, rendszerdiagnosztikához és rendszer-előkészítéshez. Az első aktiváláskor 5 napos licencet kap; ezt követően az érvényes licenc feltételei szerint működik tovább.'),
                  ('Próbaverzió letöltése', 'Teljes verzió letöltése'),
                  ('Többplatformos próbaverzió elérhető', 'Teljes értékű kiadás · 5 napos kezdőlicenc'),
                  ('5 napos próba', '5 napos teljes értékű kezdőlicenc'),
                  ('Ellenőrizhető meghajtó- és fájlműveletek a többplatformos próbaverzióban.', 'Ellenőrizhető meghajtó- és fájlműveletek a teljes értékű, licencalapú kiadásban.'),
                  ('A próbaverzió Linux/Bazzite, Windows és macOS rendszeren is használható. A Linux/Bazzite az elsődlegesen támogatott platform.', 'A teljes értékű kiadás Linux/Bazzite, Windows és macOS rendszeren is használható. Az 5 napos kezdőlicenc után az érvényes licenc feltételei szerint működik tovább; a Linux/Bazzite az elsődlegesen támogatott platform.'),
              ],
              'docs/scifi-ui/scripts/landing.js': [
                  ("heroDescription: 'A FormatX többplatformos technikusi rendszer meghajtókezeléshez, rendszerdiagnosztikához és rendszer-előkészítéshez. A próbaverzió Linux/Bazzite, Windows és macOS rendszeren is használható.'", "heroDescription: 'A FormatX teljes értékű, többplatformos technikusi rendszer meghajtókezeléshez, rendszerdiagnosztikához és rendszer-előkészítéshez. Az első aktiváláskor 5 napos licencet kap; ezt követően az érvényes licenc feltételei szerint működik tovább.'"),
                  ("startTrial: 'Próbaverzió letöltése'", "startTrial: 'Teljes verzió letöltése'"),
                  ("platformNow: 'Többplatformos próbaverzió elérhető'", "platformNow: 'Teljes értékű kiadás · 5 napos kezdőlicenc'"),
                  ("trialNote: '5 napos próba'", "trialNote: '5 napos teljes értékű kezdőlicenc'"),
                  ("feature1Copy: 'Ellenőrizhető meghajtó- és fájlműveletek a többplatformos próbaverzióban.'", "feature1Copy: 'Ellenőrizhető meghajtó- és fájlműveletek a teljes értékű, licencalapú kiadásban.'"),
                  ("feature6Copy: 'A próbaverzió Linux/Bazzite, Windows és macOS rendszeren is használható. A Linux/Bazzite az elsődlegesen támogatott platform.'", "feature6Copy: 'A teljes értékű kiadás Linux/Bazzite, Windows és macOS rendszeren is használható. Az 5 napos kezdőlicenc után az érvényes licenc feltételei szerint működik tovább; a Linux/Bazzite az elsődlegesen támogatott platform.'"),
                  ("heroDescription: 'FormatX is a cross-platform technician system for drive management, system diagnostics and system preparation. The trial version is available for Linux/Bazzite, Windows and macOS.'", "heroDescription: 'FormatX is a full-featured cross-platform technician system for drive management, system diagnostics and system preparation. First activation includes a 5-day licence; after that, it continues to operate under the terms of a valid licence.'"),
                  ("startTrial: 'Download trial version'", "startTrial: 'Download full version'"),
                  ("platformNow: 'Cross-platform trial available'", "platformNow: 'Full-featured release · 5-day initial licence'"),
                  ("trialNote: '5-day trial included'", "trialNote: '5-day full-featured initial licence'"),
                  ("feature1Copy: 'Verifiable drive and file operations in the cross-platform trial version.'", "feature1Copy: 'Verifiable drive and file operations in the full-featured, licence-based release.'"),
                  ("feature6Copy: 'The trial version is available for Linux/Bazzite, Windows and macOS. Linux/Bazzite is the primary supported platform.'", "feature6Copy: 'The full-featured release is available for Linux/Bazzite, Windows and macOS. After the 5-day initial licence, it continues under the terms of a valid licence; Linux/Bazzite is the primary supported platform.'"),
              ],
              'docs/scifi-ui/scripts/site.js': [
                  ("<span>TRIAL BUILD</span><strong>MULTIPLATFORM</strong>", "<span>LICENSED BUILD</span><strong>MULTIPLATFORM</strong>"),
                  ("title: 'MULTIPLATFORM TRIAL'", "title: 'FULL-FEATURED RELEASE'"),
              ],
              'billing-worker/src/project-ai.js': [
                  ('- The trial version is available for Linux/Bazzite, Windows and macOS.', '- The full-featured release is available for Linux/Bazzite, Windows and macOS. First activation includes a 5-day licence; continued operation follows the terms of a valid licence.'),
                  ('- Windows and macOS are also supported by the trial version.', '- Windows and macOS are also supported by the full-featured release.'),
                  ("platforms: 'A FormatX próbaverziója Linux/Bazzite, Windows és macOS rendszeren is használható. A Linux, különösen a Bazzite-kompatibilis környezet, az elsődlegesen támogatott platform. A webes felület és az Android kliens további hozzáférést biztosít.'", "platforms: 'A FormatX teljes értékű kiadása Linux/Bazzite, Windows és macOS rendszeren is használható. Az első aktiváláskor 5 napos licencet kap, majd az érvényes licenc feltételei szerint működik tovább. A Linux, különösen a Bazzite-kompatibilis környezet, az elsődlegesen támogatott platform.'"),
                  ("platforms: 'The FormatX trial version is available for Linux/Bazzite, Windows and macOS. Linux, especially Bazzite-compatible environments, is the primary supported platform. The web interface and Android client provide supplementary access.'", "platforms: 'The full-featured FormatX release is available for Linux/Bazzite, Windows and macOS. First activation includes a 5-day licence, after which operation continues under the terms of a valid licence. Linux, especially Bazzite-compatible environments, is the primary supported platform.'"),
              ],
              'billing-worker/src/sales-gate.js': [
                  ('A FormatX bemutatóoldala és a próbaverzió elérhető, de az éles fizetési folyamat', 'A FormatX bemutatóoldala és a teljes értékű, 5 napos kezdőlicenccel használható kiadás elérhető, de az éles fizetési folyamat'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # Update legacy public translation strings without touching licence API enums.
          i18n = Path('docs/scifi-ui/scripts/i18n.js')
          text = i18n.read_text(encoding='utf-8')
          text = text.replace('Próbaverzió', 'Teljes verzió').replace('próbaverzió', 'teljes verzió')
          text = text.replace('Trial version', 'Full version').replace('trial version', 'full version')
          i18n.write_text(text, encoding='utf-8')

      - name: Validate corrected public wording
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/landing.js
          node --check docs/scifi-ui/scripts/site.js
          node --check docs/scifi-ui/scripts/i18n.js
          node --check billing-worker/src/project-ai.js
          node --check billing-worker/src/sales-gate.js
          grep -F 'Teljes verzió letöltése' docs/scifi-ui/index.html
          grep -F "startTrial: 'Teljes verzió letöltése'" docs/scifi-ui/scripts/landing.js
          grep -F '5 napos licencet kap' docs/scifi-ui/index.html
          grep -F 'érvényes licenc feltételei szerint működik tovább' docs/scifi-ui/index.html
          grep -F "startTrial: 'Download full version'" docs/scifi-ui/scripts/landing.js
          ! grep -Fq 'Próbaverzió letöltése' docs/scifi-ui/index.html
          ! grep -Fq "startTrial: 'Próbaverzió letöltése'" docs/scifi-ui/scripts/landing.js
          ! grep -Fq "startTrial: 'Download trial version'" docs/scifi-ui/scripts/landing.js

      - name: Commit corrected wording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/landing.js docs/scifi-ui/scripts/site.js docs/scifi-ui/scripts/i18n.js billing-worker/src/project-ai.js billing-worker/src/sales-gate.js
          git commit -m 'Describe FormatX as full version governed by licence status'
          git push origin HEAD:master
