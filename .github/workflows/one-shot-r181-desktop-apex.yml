name: One-shot publish r181 desktop apex
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r181-desktop-apex.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate and publish r181 desktop apex
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-desktop-apex-r181.js
          grep -q 'desktop crystal apex' docs/scifi-ui/styles/formatx-desktop-apex-r181.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          css='  <link rel="stylesheet" data-fx-desktop-apex-r181="true" href="./styles/formatx-desktop-apex-r181.css?v=20260816-r181-crystal-apex">\n'
          js='  <script defer data-fx-desktop-apex-r181="true" src="./scripts/formatx-desktop-apex-r181.js?v=20260816-r181-crystal-apex"></script>\n'
          anchor_css='  <link rel="stylesheet" data-fx-soty-continuity-r179="true" href="./styles/formatx-soty-continuity-r179.css?v=20260816-r179-organ-field">\n'
          anchor_js='  <script defer data-fx-soty-continuity-r179="true" src="./scripts/formatx-soty-continuity-r179.js?v=20260816-r179b-css-state-sync"></script>\n'
          if 'data-fx-desktop-apex-r181="true" href=' not in s:
              if anchor_css not in s: raise SystemExit('r179 CSS anchor missing')
              s=s.replace(anchor_css,anchor_css+css,1)
          if 'data-fx-desktop-apex-r181="true" src=' not in s:
              if anchor_js not in s: raise SystemExit('r179 JS anchor missing')
              s=s.replace(anchor_js,anchor_js+js,1)
          p.write_text(s)
          PY
          grep -q 'formatx-desktop-apex-r181.css?v=20260816-r181-crystal-apex' docs/scifi-ui/index.html
          grep -q 'formatx-desktop-apex-r181.js?v=20260816-r181-crystal-apex' docs/scifi-ui/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r181 already published'; exit 0; fi
          git commit -m '[deploy-production] feat(soty): publish r181 desktop crystal apex'
          git push origin HEAD:master
