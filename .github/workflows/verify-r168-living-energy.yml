name: Verify r168 multimodal living MAG

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  push:
    branches: [master]
    paths: ['.github/workflows/verify-r168-living-energy.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-device-live:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Verify r168 living energy on desktop and mobile
        run: |
          cat > check-r168.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const origin='https://formatxsuite.com';
          const MODE='orbit-caustic-spectrum-shock-refraction';
          const CLOCK='32ms-optical-reactor-v3';

          async function ready(page,mobile=false){
            await page.waitForFunction(({mobile,mode,clock})=>{
              const r=document.documentElement.dataset;
              return (!mobile||r.fxMobileReferenceLayout==='ready-v1') &&
                String(r.fxLivingEnergyR168||'').includes('r168-living-energy-orbit-caustic-v2') &&
                r.fxLivingEnergyEffectModeR168===mode && r.fxLivingEnergyClockR168===clock &&
                Number(r.fxLivingEnergyFrameR168||0)>2 && Number(r.fxLiveHeartbeatTickR155||0)>2 &&
                document.querySelectorAll('#hero .fx-r168-orbit').length===2 &&
                document.querySelectorAll('#hero .fx-r168-caustic').length===2 &&
                document.querySelectorAll('#hero .fx-r168-spectrum').length===1 &&
                document.querySelectorAll('#hero .fx-r168-interaction-wave').length===1 &&
                document.querySelectorAll('#hero .fx-r168-spark').length===6;
            },{mobile,mode:MODE,clock:CLOCK},{timeout:60000});
          }

          async function state(page){return page.evaluate(()=>{
            const r=document.documentElement.dataset,h=document.querySelector('#hero .hero-space'),s=document.querySelector('#hero .fx-core-mobile-v55-stage,#hero .fx-core-r112-stage');
            const hs=h?getComputedStyle(h):null,ss=s?getComputedStyle(s):null,after=h?getComputedStyle(h,'::after'):null,box=h?.getBoundingClientRect();
            const css=n=>h?.style.getPropertyValue(n)||getComputedStyle(h).getPropertyValue(n)||'';
            return {version:r.fxLivingEnergyR168||'',mode:r.fxLivingEnergyEffectModeR168||'',clock:r.fxLivingEnergyClockR168||'',frame:Number(r.fxLivingEnergyFrameR168||0),tick:Number(r.fxLiveHeartbeatTickR155||0),interaction:r.fxLivingEnergyInteractionR168||'',position:r.fxLivingEnergyPositionR168||'',activity:Number(r.fxLivingEnergyActivityR168||0),optics:r.fxLivingEnergyOpticsR168||'',beat:r.fxLivingEnergyBeatR168||'',gyro:r.fxCoreGyroLoadR144||'',renderMs:Number(r.fxCoreRenderMs||Infinity),orbitA:css('--fx-r168-orbit-a'),orbitB:css('--fx-r168-orbit-b'),causticA:css('--fx-r168-caustic-a'),causticB:css('--fx-r168-caustic-b'),spectrum:css('--fx-r168-spectrum'),burst:Number(css('--fx-r168-burst-opacity')||0),stageBg:ss?.backgroundImage||'',stageColor:ss?.backgroundColor||'',seamTop:after?.top||'',seamHeight:after?.height||'',seamBg:after?.backgroundImage||'',hostHeight:box?.height||0,hostBg:hs?.backgroundImage||''};
          })}

          function base(a){assert.ok(a.version.includes('v2'));assert.equal(a.mode,MODE);assert.equal(a.clock,CLOCK);assert.ok(a.renderMs<16.67,`render ${a.renderMs}`)}
          function motion(a,b){assert.ok(b.frame>a.frame,'r168 clock stalled');assert.ok(b.tick>a.tick,'heartbeat stalled');assert.notEqual(a.orbitA,b.orbitA,'orbit A stalled');assert.notEqual(a.orbitB,b.orbitB,'orbit B stalled');assert.notEqual(a.causticA,b.causticA,'caustic A stalled');assert.notEqual(a.causticB,b.causticB,'caustic B stalled');assert.ok(a.optics!==b.optics||a.beat!==b.beat||a.spectrum!==b.spectrum,'optics static')}

          async function desktop(browser){
            const c=await browser.newContext({viewport:{width:1600,height:1000},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference'}),p=await c.newPage();
            await p.goto(`${origin}/?verify=r168d-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});await ready(p,false);await p.waitForTimeout(160);
            const a=await state(p);await p.waitForTimeout(420);const b=await state(p);base(a);motion(a,b);
            const box=await p.locator('#hero .hero-space').boundingBox();if(box){await p.mouse.move(box.x+box.width*.76,box.y+box.height*.33);await p.mouse.down();await p.waitForTimeout(90);await p.mouse.up();}
            await p.waitForTimeout(80);const d=await state(p);assert.ok(d.position!==a.position||d.activity>a.activity,'desktop interaction missing');assert.ok(d.burst>0||d.interaction==='energy-burst'||d.activity>b.activity,'desktop burst missing');
            await p.evaluate(()=>{document.documentElement.dataset.fxReferenceMotionPaused='true'});await p.waitForTimeout(80);await p.screenshot({path:'/tmp/r168-desktop.png',animations:'disabled',timeout:120000});console.log('DESKTOP',JSON.stringify({a,b,d},null,2));await c.close();
          }

          async function mobile(browser,w,h,label){
            const c=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'}),p=await c.newPage();
            await p.goto(`${origin}/?verify=r168-${label}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});await ready(p,true);await p.waitForTimeout(160);
            const a=await state(p);await p.waitForTimeout(380);const b=await state(p);base(a);motion(a,b);
            await p.touchscreen.tap(Math.round(w*.69),Math.round(h*.37));await p.waitForTimeout(80);const d=await state(p);assert.ok(d.activity>=b.activity||d.interaction==='energy-burst','touch energy missing');assert.ok(d.burst>0||d.interaction==='energy-burst','touch burst missing');
            assert.ok(['ready','permission-required','unsupported'].includes(a.gyro),`gyro ${a.gyro}`);assert.equal(a.stageBg,'none');assert.ok(a.stageColor==='rgba(0, 0, 0, 0)'||a.stageColor==='transparent',`stage ${a.stageColor}`);
            const top=parseFloat(a.seamTop),height=parseFloat(a.seamHeight);assert.ok(Number.isFinite(top)&&top<a.hostHeight*.80,`seam top ${a.seamTop}/${a.hostHeight}`);assert.ok(Number.isFinite(height)&&height>a.hostHeight*.40,`seam height ${a.seamHeight}/${a.hostHeight}`);assert.ok(a.seamBg.includes('linear-gradient'),'seam gradient missing');
            await p.evaluate(()=>{document.documentElement.dataset.fxReferenceMotionPaused='true'});await p.waitForTimeout(80);await p.screenshot({path:`/tmp/r168-${label}.png`,animations:'disabled',timeout:120000});console.log(label.toUpperCase(),JSON.stringify({a,b,d},null,2));await c.close();
          }

          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await desktop(b);await mobile(b,390,844,'mobile390');await mobile(b,412,915,'mobile412')}finally{await b.close()}for(const f of ['/tmp/r168-desktop.png','/tmp/r168-mobile390.png','/tmp/r168-mobile412.png'])assert.ok(fs.statSync(f).size>10000,f);console.log('PASS r168 optical life + interaction + seamless mobile');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check-r168.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r168-living-energy-${{ github.run_id }}
          path: |
            /tmp/r168-desktop.png
            /tmp/r168-mobile390.png
            /tmp/r168-mobile412.png
          if-no-files-found: warn
          retention-days: 14
