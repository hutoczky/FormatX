name: r231 category deck stability

on:
  push:
    paths:
      - '.github/workflows/r231-category-deck-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent duplicate hero category deck
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/scifi-ui/scripts/formatx-category-positioning.js')
          text = path.read_text(encoding='utf-8')
          old = "    if (!hero || !grid || hero.querySelector('.fx-category-deck')) return;"
          new = "    if (!hero || !grid || document.querySelector('.fx-category-deck')) return;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one buildDeck guard, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/scifi-ui/scripts/formatx-category-positioning.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- docs/scifi-ui/scripts/formatx-category-positioning.js; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-category-positioning.js
          git commit -m 'r231 prevent duplicate category deck from shifting hero'
          git push origin HEAD:master
