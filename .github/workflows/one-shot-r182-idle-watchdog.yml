name: One-shot publish r182 idle living watchdog
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r182-idle-watchdog.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch idle-motion watchdog and production cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('docs/scifi-ui/scripts/formatx-living-energy-r168.js')
          s=p.read_text()
          old="let host=null,layer=null,detail=null,boost=0,lastInput=0,raf=0,last=performance.now(),lastTickAt=0;"
          new="let host=null,layer=null,detail=null,boost=0,lastInput=0,raf=0,watchdog=0,last=performance.now(),lastTickAt=0;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('r168 scheduler state declaration not found')

          old="  const now=performance.now();\n  const dt=clamp(now-last||32,16,120);last=now;"
          new="  const now=performance.now();\n  lastTickAt=now;\n  const dt=clamp(now-last||32,16,120);last=now;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('r168 tick timestamp anchor not found')

          old="""function loop(now){raf=requestAnimationFrame(loop);if(document.hidden)return;if(!lastTickAt||now-lastTickAt>=30){lastTickAt=now;tick();}}
function start(){if(!ensure())return;if(raf)return;last=performance.now();lastTickAt=0;tick();raf=requestAnimationFrame(loop);root.dataset.fxLivingEnergyClockR168=CLOCK;root.dataset.fxLivingEnergySchedulerR175='requestAnimationFrame-throttled-30ms';}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
const mo=new MutationObserver(()=>{if(!layer?.isConnected||!detail?.isConnected||!raf)start();});mo.observe(document.documentElement,{childList:true,subtree:true});
addEventListener('pageshow',start,{passive:true});"""
          new="""function loop(now){raf=requestAnimationFrame(loop);if(document.hidden)return;if(!lastTickAt||now-lastTickAt>=30)tick();}
function armWatchdog(){
  if(watchdog)return;
  watchdog=setInterval(()=>{
    if(document.hidden||reduced.matches||root.dataset.fxReferenceMotionPaused==='true')return;
    const now=performance.now();
    if(!lastTickAt||now-lastTickAt>=120)tick();
  },96);
  root.dataset.fxLivingEnergyWatchdogR182='96ms-stall-fallback';
}
function start(){
  if(!ensure())return;
  if(!raf){last=performance.now();lastTickAt=0;tick();raf=requestAnimationFrame(loop);}
  armWatchdog();
  root.dataset.fxLivingEnergyClockR168=CLOCK;
  root.dataset.fxLivingEnergySchedulerR175='requestAnimationFrame-throttled-30ms';
  root.dataset.fxLivingEnergySchedulerR182='raf-primary-watchdog-fallback';
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
const mo=new MutationObserver(()=>{if(!layer?.isConnected||!detail?.isConnected||!raf||!watchdog)start();});mo.observe(document.documentElement,{childList:true,subtree:true});
addEventListener('pageshow',start,{passive:true});"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('r168 scheduler block not found')
          p.write_text(s)

          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          old='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r175-raf-throttled'
          new='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r182-idle-watchdog'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('index r168 cache token not found')
          p.write_text(s)

          p=Path('.github/scripts/validate-real3d-core.cjs')
          s=p.read_text()
          old='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r175-raf-throttled'
          new='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r182-idle-watchdog'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('real3d validator r168 cache token not found')
          p.write_text(s)
          PY

          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node .github/scripts/validate-real3d-core.cjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-living-energy-r168.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r182 idle watchdog already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): keep idle living clock alive r182'
          git push origin HEAD:master
