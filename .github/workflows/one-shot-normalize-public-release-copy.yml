name: Normalize public release copy once

on:
  push:
    branches: [fix/desktop-multiplatform-final]
    paths:
      - '.github/workflows/one-shot-normalize-public-release-copy.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-normalize-public-release-copy
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-multiplatform-final

      - name: Normalize public release language
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('docs/scifi-ui/index.html')
          text = home.read_text(encoding='utf-8')
          text = text.replace('data-release-download="windows"', 'data-release-download="multiplatform"')
          text = text.replace(
              'data-hu="Windows nyilvános béta letöltése" data-en="Download Windows public beta">Windows nyilvános béta letöltése',
              'data-hu="Multiplatform nyilvános béta letöltése" data-en="Download multiplatform public beta">Multiplatform nyilvános béta letöltése',
          )
          text = text.replace(
              '<span>92.00</span><b>RELEASE DNA</b>',
              '<span>—</span><b>RELEASE CHANNEL</b>',
          )
          home.write_text(text, encoding='utf-8')

          replacements = {
              'Windows nyilvános béta letöltése': 'Multiplatform nyilvános béta letöltése',
              'Download Windows public beta': 'Download multiplatform public beta',
          }
          for relative in (
              'content-preview-entry.js',
              'billing-worker/src/production-content-entry.js',
          ):
              path = Path(relative)
              source = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
          PY

          grep -Fq 'data-release-download="multiplatform"' docs/scifi-ui/index.html
          grep -Fq 'Multiplatform nyilvános béta letöltése' docs/scifi-ui/index.html
          ! grep -Fq '92.00' docs/scifi-ui/index.html
          ! grep -Fq 'Windows nyilvános béta letöltése' content-preview-entry.js
          ! grep -Fq 'Windows nyilvános béta letöltése' billing-worker/src/production-content-entry.js

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-normalize-public-release-copy.yml
          git config user.name 'FormatX maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html \
                  content-preview-entry.js \
                  billing-worker/src/production-content-entry.js \
                  .github/workflows/one-shot-normalize-public-release-copy.yml
          git commit -m 'Normalize public multiplatform release copy'
          git push origin HEAD:fix/desktop-multiplatform-final
