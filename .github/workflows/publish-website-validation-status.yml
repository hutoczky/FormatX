name: Publish website validation status

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-website-validation-status.yml'
  workflow_run:
    workflows:
      - Validate FormatX website
    types:
      - completed

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  trigger:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the authoritative website validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-website.yml --ref master

  publish:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Publish unified validation result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONCLUSION" = 'success' ]; then
            state='success'
            description='Chromium, Firefox, mobile, layout and checkout checks passed'
          else
            state='failure'
            description="Unified website validation ended with: $CONCLUSION"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='FormatX unified website validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
