name: r345 one-shot first-paint stabilizer

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r345-stabilize-first-paint.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align legacy and final control geometry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          js_path = Path('docs/scifi-ui/scripts/formatx-reference-production-r244.js')
          js = js_path.read_text()
          replacement = r'''  function applyControlLayout(nodes, mobile) {
    const size = mobile ? '50px' : '54px';
    const gap = mobile ? '12px' : '14px';

    // r345: the render-blocking reference layer and the final owner now use
    // exactly one physical geometry on every viewport. The legacy mobile
    // vertical rail/hide-SOUND state caused a visible late reflow and CLS.
    importantMany(nodes.controls, {
      position: 'absolute',
      inset: 'auto auto ' + (mobile ? '28px' : '30px') + ' 50%',
      top: 'auto',
      right: 'auto',
      bottom: mobile ? '28px' : '30px',
      left: '50%',
      display: 'grid',
      'grid-template-columns': `repeat(3, ${size})`,
      'grid-template-rows': mobile ? 'minmax(76px, auto)' : 'minmax(82px, auto)',
      'align-items': 'start',
      'justify-content': 'center',
      'justify-items': 'center',
      'column-gap': gap,
      'row-gap': '0',
      width: 'max-content',
      'max-width': 'calc(100% - 24px)',
      height: 'auto',
      'min-height': mobile ? '76px' : '82px',
      margin: '0',
      padding: mobile ? '0 4px 20px' : '0 8px 24px',
      'pointer-events': 'auto',
      transform: 'translateX(-50%)',
      translate: 'none',
      opacity: '1',
      visibility: 'visible',
      'z-index': '10030'
    });

    importantMany(nodes.rail, {
      position: 'static',
      inset: 'auto',
      top: 'auto',
      right: 'auto',
      bottom: 'auto',
      left: 'auto',
      display: 'contents',
      width: 'auto',
      'min-width': '0',
      height: 'auto',
      'min-height': '0',
      margin: '0',
      padding: '0',
      'pointer-events': 'auto',
      transform: 'none',
      translate: 'none',
      opacity: '1',
      visibility: 'visible'
    });

    if (nodes.sound instanceof HTMLElement) {
      importantMany(nodes.sound, {
        position: 'relative',
        inset: 'auto',
        top: 'auto',
        right: 'auto',
        bottom: 'auto',
        left: 'auto',
        display: 'inline-flex',
        'align-items': 'center',
        'justify-content': 'center',
        flex: `0 0 ${size}`,
        width: size,
        'min-width': size,
        'max-width': size,
        height: size,
        'min-height': size,
        'max-height': size,
        margin: '0',
        padding: '0',
        'border-radius': '50%',
        gap: '0',
        'font-size': '0',
        'pointer-events': 'auto',
        transform: 'none',
        translate: 'none',
        opacity: '1',
        visibility: 'visible',
        overflow: 'hidden'
      });
    }

    nodes.rail?.querySelectorAll('.fx-reference-ask, .fx-reference-pause').forEach(button => {
      clearInlineLayout(button);
      importantMany(button, {
        position: 'relative',
        inset: 'auto',
        top: 'auto',
        right: 'auto',
        bottom: 'auto',
        left: 'auto',
        flex: `0 0 ${size}`,
        width: size,
        'min-width': size,
        'max-width': size,
        height: size,
        'min-height': size,
        'max-height': size,
        margin: '0',
        padding: '0',
        'pointer-events': 'auto',
        transform: 'none',
        translate: 'none',
        opacity: '1',
        visibility: 'visible'
      });
    });

    const askLabel = nodes.rail?.querySelector('.fx-reference-ask span');
    if (askLabel instanceof HTMLElement) {
      importantMany(askLabel, {
        top: mobile ? '55px' : '59px',
        right: 'auto',
        bottom: 'auto',
        left: '50%',
        width: 'max-content',
        'max-width': '84px',
        transform: 'translateX(-50%)',
        translate: 'none',
        'text-align': 'center',
        'white-space': 'nowrap',
        opacity: '1',
        visibility: 'visible'
      });
    }
  }

'''
          js, count = re.subn(r'  function applyControlLayout\(nodes, mobile\) \{.*?\n  function reconcile\(\) \{', replacement + '  function reconcile() {', js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('r244 applyControlLayout block not found exactly once')
          js = js.replace('// r304 stability/performance pass.', '// r345 first-paint stability/performance pass.')
          js_path.write_text(js)

          css_path = Path('docs/scifi-ui/styles/formatx-reference-production-r244.css')
          css = css_path.read_text()
          marker = '/* r345 — first-paint canonical controls/header; mirrors the final owner. */'
          if marker not in css:
              css += r'''

/* r345 — first-paint canonical controls/header; mirrors the final owner. */
@media (max-width: 900px) {
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture .topbar .fx-reference-mag-button {
    top: 11px !important; right: 122px !important; width: 50px !important; min-width: 50px !important; max-width: 50px !important; height: 48px !important; min-height: 48px !important; max-height: 48px !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture .topbar .fx-language-toggle {
    top: 11px !important; right: 70px !important; width: 44px !important; min-width: 44px !important; max-width: 44px !important; height: 48px !important; min-height: 48px !important; max-height: 48px !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture .topbar .fx-reference-menu-button {
    top: 8px !important; right: 12px !important; width: 50px !important; min-width: 50px !important; max-width: 50px !important; height: 54px !important; min-height: 54px !important; max-height: 54px !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 {
    position: absolute !important; inset: auto auto 28px 50% !important; z-index: 12040 !important;
    display: grid !important; grid-template-columns: repeat(3, 50px) !important; grid-template-rows: minmax(76px, auto) !important;
    align-items: start !important; justify-content: center !important; justify-items: center !important; column-gap: 12px !important; row-gap: 0 !important;
    width: max-content !important; max-width: calc(100% - 24px) !important; height: auto !important; min-height: 76px !important;
    margin: 0 !important; padding: 0 4px 20px !important; opacity: 1 !important; visibility: visible !important; pointer-events: auto !important;
    transform: translateX(-50%) !important; translate: none !important; isolation: isolate !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 > .fx-reference-rail {
    display: contents !important; position: static !important; inset: auto !important; width: auto !important; min-width: 0 !important; height: auto !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; transform: none !important; translate: none !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 > .fx-three-sound,
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 .fx-reference-ask,
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 .fx-reference-pause {
    position: relative !important; inset: auto !important; display: grid !important; place-items: center !important; box-sizing: border-box !important;
    width: 50px !important; min-width: 50px !important; max-width: 50px !important; height: 50px !important; min-height: 50px !important; max-height: 50px !important;
    margin: 0 !important; padding: 0 !important; opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; transform: none !important; translate: none !important;
  }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 > .fx-three-sound { grid-column: 1 !important; grid-row: 1 !important; }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 .fx-reference-ask { grid-column: 2 !important; grid-row: 1 !important; }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 .fx-reference-pause { grid-column: 3 !important; grid-row: 1 !important; }
  html:root:root[data-fx-reference-production-r244="ready"] body.living-architecture #hero .hero-space > .fx-reference-controls-r204 .fx-reference-ask span { top: 55px !important; }
}
'''
          css_path.write_text(css)

          owner_path = Path('docs/scifi-ui/styles/formatx-control-owner-r264.css')
          owner = owner_path.read_text()
          owner_marker = '/* r345 — canonical mobile controls live inside hero-space. */'
          if owner_marker not in owner:
              owner += r'''

/* r345 — canonical mobile controls live inside hero-space. */
@media (max-width: 900px) {
  html:root:root body.living-architecture #hero .hero-space > .fx-reference-controls-r204.fx-reference-controls-r264 {
    position: absolute !important; inset: auto auto 28px 50% !important; display: grid !important;
    grid-template-columns: repeat(3, 50px) !important; grid-template-rows: minmax(76px, auto) !important;
    column-gap: 12px !important; row-gap: 0 !important; width: max-content !important; min-height: 76px !important;
    margin: 0 !important; padding: 0 4px 20px !important; transform: translateX(-50%) !important; translate: none !important;
  }
  html:root:root body.living-architecture #hero .hero-space > .fx-reference-controls-r204.fx-reference-controls-r264 > .fx-reference-rail-r264 { display: contents !important; }
}
'''
          owner_path.write_text(owner)
          PY

          node --check docs/scifi-ui/scripts/formatx-reference-production-r244.js
          git diff --check
          git diff -- docs/scifi-ui/scripts/formatx-reference-production-r244.js docs/scifi-ui/styles/formatx-reference-production-r244.css docs/scifi-ui/styles/formatx-control-owner-r264.css

      - name: Commit stabilized first-paint ownership
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-reference-production-r244.js docs/scifi-ui/styles/formatx-reference-production-r244.css docs/scifi-ui/styles/formatx-control-owner-r264.css
          git diff --cached --quiet && exit 0
          git commit -m 'Stabilize canonical controls from first paint'
          git push origin HEAD:master
