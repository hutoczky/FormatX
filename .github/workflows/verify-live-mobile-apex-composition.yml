name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live cinematic indexed 3D MAG v11
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"
          MESH="$RUNNER_TEMP/mesh-v11.js"
          FRACTURE="$RUNNER_TEMP/fracture-v11.js"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v11.js?v=20260809-cinematic-mesh3d-v11&audit=${GITHUB_RUN_ID}" -o "$MESH"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-fracture3d-v11.js?v=20260809-cinematic-fracture3d-v11&audit=${GITHUB_RUN_ID}" -o "$FRACTURE"

          grep -Fq "fxApexSceneStability==='ready-v20'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-v11.js?v=20260809-cinematic-mesh3d-v11' "$MAPPER"
          grep -Fq 'formatx-core-fracture3d-v11.js?v=20260809-cinematic-fracture3d-v11' "$MAPPER"
          grep -Fq 'film-reactive-v1' "$MAPPER"
          grep -Fq 'retired-for-real-3d-reactor' "$MAPPER"

          grep -Fq "getContext('webgl2'" "$MESH"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH"
          grep -Fq 'gl.enable(gl.CULL_FACE)' "$MESH"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          grep -Fq 'xs=.82' "$MESH"
          grep -Fq 'ys=1.30' "$MESH"
          grep -Fq 'window.FormatXCoreCinematic' "$MESH"
          grep -Fq 'formatx:organismcoreactivate' "$MESH"
          grep -Fq 'formatx:organismresponse' "$MESH"
          grep -Fq 'formatx:organismspeechstart' "$MESH"
          grep -Fq 'formatx:organismspeechend' "$MESH"
          grep -Fq 'orbSpeed=.010+.026*cinematic.energy' "$MESH"
          grep -Fq "fxCoreMesh3d='ready-v11'" "$MESH"
          grep -Fq "fxCoreGeometry='indexed-triangle-mesh-v11'" "$MESH"
          grep -Fq "fxCoreCinematic='film-reactive-v1'" "$MESH"

          grep -Fq "getContext('webgl2'" "$FRACTURE"
          grep -Fq 'gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER' "$FRACTURE"
          grep -Fq 'gl.drawElements(gl.LINES' "$FRACTURE"
          grep -Fq 'window.FormatXCoreCinematic' "$FRACTURE"
          grep -Fq 'uEnergy' "$FRACTURE"
          grep -Fq 'uSurge' "$FRACTURE"
          grep -Fq "fxCoreFracture3d='ready-v11'" "$FRACTURE"
          grep -Fq "fxCoreFractureBehavior='cinematic-reactive-v1'" "$FRACTURE"

          ! grep -Fq 'drawImage(' "$MESH"
          ! grep -Fq 'drawImage(' "$FRACTURE"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live MAG uses cinematic reactive indexed WebGL2 mesh v11 plus reactive 3D fracture v11'
          else
            state='failure'
            description='Live cinematic true 3D MAG v11 verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live mobile Apex composition' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
