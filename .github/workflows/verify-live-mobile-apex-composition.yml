name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live additive layered indexed 3D MAG v7
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"
          MESH="$RUNNER_TEMP/mesh-v7.js"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v7.js?v=20260808-true-mesh3d-v7&audit=${GITHUB_RUN_ID}" -o "$MESH"

          grep -Fq "fxApexSceneStability === 'ready-v15'" "$MAPPER"
          grep -Fq 'retired-for-real-3d-reactor' "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-v7.js?v=20260808-true-mesh3d-v7' "$MAPPER"
          grep -Fq "getContext('webgl2'" "$MESH"
          grep -Fq 'depth: true' "$MESH"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          grep -Fq 'gl.blendFunc(gl.SRC_ALPHA,gl.ONE)' "$MESH"
          grep -Fq 'drawTriangles(crystal,0,.455,pulse' "$MESH"
          grep -Fq 'drawTriangles(crystal,0,.505,pulse' "$MESH"
          grep -Fq 'drawTriangles(crystal,0,.550,pulse' "$MESH"
          grep -Fq 'drawTriangles(crystal,0,.563,pulse' "$MESH"
          grep -Fq 'buildTorus(.34,.006)' "$MESH"
          grep -Fq 'buildTorus(.50,.0055)' "$MESH"
          grep -Fq 'buildTorus(.66,.005)' "$MESH"
          grep -Fq "fxCoreMesh3d='ready-v7'" "$MESH"
          grep -Fq "fxCoreGeometry='indexed-triangle-mesh-v7'" "$MESH"
          grep -Fq "fxCoreReactorGeometry='sphere-plus-3-tori'" "$MESH"
          ! grep -Fq 'drawImage(' "$MESH"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Live MAG uses additive layered real indexed WebGL2 mesh v7 and real 3D reactor'; else state='failure'; description='Live additive true 3D MAG v7 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
