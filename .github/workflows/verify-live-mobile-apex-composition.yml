name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live faceted indexed 3D MAG v4
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"
          MESH="$RUNNER_TEMP/mesh-v4.js"
          CSS="$RUNNER_TEMP/mesh.css"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v4.js?v=20260808-true-mesh3d-v4&audit=${GITHUB_RUN_ID}" -o "$MESH"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-mesh3d.css?v=20260808-true-mesh3d-v4&audit=${GITHUB_RUN_ID}" -o "$CSS"

          grep -Fq "fxApexSceneStability === 'ready-v12'" "$MAPPER"
          grep -Fq 'if(uScene<.92)return vec2(10.,1.)' "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-v4.js?v=20260808-true-mesh3d-v4' "$MAPPER"
          grep -Fq "getContext('webgl2'" "$MESH"
          grep -Fq 'depth:true' "$MESH"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH"
          grep -Fq 'gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER' "$MESH"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          grep -Fq 'gl.drawElements(gl.LINES' "$MESH"
          grep -Fq 'cross(dFdx(vP),dFdy(vP))' "$MESH"
          grep -Fq 'ys=1.20' "$MESH"
          grep -Fq 'latticeA=pow' "$MESH"
          grep -Fq 'latticeB=pow' "$MESH"
          grep -Fq 'lines(crystal,.552,pulse' "$MESH"
          grep -Fq "fxCoreMesh3d='ready-v4'" "$MESH"
          grep -Fq "fxCoreGeometry='indexed-triangle-mesh-v4'" "$MESH"
          grep -Fq "fxCoreLineGeometry='indexed-3d-grid'" "$MESH"
          ! grep -Fq 'drawImage(' "$MESH"
          grep -Fq 'pointer-events: none' "$CSS"
          grep -Fq 'height: 100dvh' "$CSS"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Live MAG uses faceted real indexed WebGL2 mesh v4 plus 3D light grid'; else state='failure'; description='Live faceted true 3D MAG v4 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
