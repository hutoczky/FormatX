name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify calibrated post-grade MAG v22 live
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"; MATERIAL="$RUNNER_TEMP/material.js"; SHAPE="$RUNNER_TEMP/shape.js"; GEOMETRY="$RUNNER_TEMP/geometry.js"; GRADE="$RUNNER_TEMP/grade.css"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-material-v21.js?v=20260809-sparse-hdr-facets-v21&audit=${GITHUB_RUN_ID}" -o "$MATERIAL"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-shape-v14.js?v=20260809-reference-ratio-v14&audit=${GITHUB_RUN_ID}" -o "$SHAPE"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-geometry-v13.js?v=20260809-true-3d-scale-v13&audit=${GITHUB_RUN_ID}" -o "$GEOMETRY"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-cinematic-grade-v22.css?v=20260809-calibrated-postgrade-v22&audit=${GITHUB_RUN_ID}" -o "$GRADE"
          grep -Fq "fxApexSceneStability==='ready-v32'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-material-v21.js?v=20260809-sparse-hdr-facets-v21' "$MAPPER"
          grep -Fq 'formatx-core-cinematic-grade-v22.css?v=20260809-calibrated-postgrade-v22' "$MAPPER"
          grep -Fq "fxCoreVisualCalibration='reference-polygon-postgrade-v22'" "$MAPPER"
          grep -Fq 'cinematic-sparse-hdr-postgrade-reference-glass-v32' "$MAPPER"
          grep -Fq "fxCoreHighlightModel='sparse-high-dynamic-facets-v21'" "$MATERIAL"
          grep -Fq "fxCoreMeshMaterial='reference-glass-v21'" "$MATERIAL"
          grep -Fq "fxCoreShapeMesh='applied-v14'" "$SHAPE"
          grep -Fq "fxCoreShapeFracture='applied-v14'" "$SHAPE"
          grep -Fq 'value*1.15' "$GEOMETRY"
          grep -Fq 'filter: saturate(4.00) contrast(3.20)' "$GRADE"
          grep -Fq 'filter: saturate(2.35) contrast(1.65)' "$GRADE"
          grep -Fq 'brightness(2.08)' "$GRADE"
      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live MAG uses sparse true-3D material with calibrated cinematic post-grade v22'; else state=failure; description='Live calibrated post-grade MAG v22 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
