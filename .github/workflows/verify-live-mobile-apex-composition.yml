name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live cinematic indexed 3D MAG v11c
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"
          MESH="$RUNNER_TEMP/mesh-v11.js"
          KICK="$RUNNER_TEMP/kick-v11b.js"
          FRACTURE="$RUNNER_TEMP/fracture-v11.js"
          GRADE="$RUNNER_TEMP/grade-v11c.css"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v11.js?v=20260809-cinematic-mesh3d-v11&audit=${GITHUB_RUN_ID}" -o "$MESH"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-cinematic-kick-v11.js?v=20260809-cinematic-kick-v11b&audit=${GITHUB_RUN_ID}" -o "$KICK"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-fracture3d-v11.js?v=20260809-cinematic-fracture3d-v11&audit=${GITHUB_RUN_ID}" -o "$FRACTURE"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-cinematic-grade-v11c.css?v=20260809-reference-emissive-v1&audit=${GITHUB_RUN_ID}" -o "$GRADE"

          grep -Fq "fxApexSceneStability==='ready-v21'" "$MAPPER"
          grep -Fq 'formatx-core-cinematic-grade-v11c.css?v=20260809-reference-emissive-v1' "$MAPPER"
          grep -Fq 'cinematic-reference-graded-true-mesh3d-v21' "$MAPPER"
          grep -Fq 'retired-for-real-3d-reactor' "$MAPPER"
          grep -Fq "getContext('webgl2'" "$MESH"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          grep -Fq "fxCoreGeometry='indexed-triangle-mesh-v11'" "$MESH"
          grep -Fq "fxCoreCinematicKick==='ready-v1'" "$KICK"
          grep -Fq "apply('response',.74,1.15,2100)" "$KICK"
          grep -Fq 'gl.drawElements(gl.LINES' "$FRACTURE"
          grep -Fq "fxCoreFracture3d='ready-v11'" "$FRACTURE"
          grep -Fq 'brightness(1.95)' "$GRADE"
          grep -Fq 'saturate(2.15)' "$GRADE"
          grep -Fq 'brightness(2.02)' "$GRADE"
          grep -Fq 'saturate(2.20)' "$GRADE"
          grep -Fq 'drop-shadow(0 0 5px rgba(72, 226, 255, 0.20))' "$GRADE"
          ! grep -Fq 'drawImage(' "$MESH"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then state='success'; description='Live MAG uses real cinematic 3D v11c with reference emissive grade'; else state='failure'; description='Live cinematic true 3D MAG v11c verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
