name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify sparse high-dynamic MAG v18 live
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"; MATERIAL="$RUNNER_TEMP/material.js"; GRADE="$RUNNER_TEMP/grade.css"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-material-v18.js?v=20260809-sparse-hdr-facets-v18&audit=${GITHUB_RUN_ID}" -o "$MATERIAL"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-cinematic-grade-v18.css?v=20260809-high-dynamic-facets-v18&audit=${GITHUB_RUN_ID}" -o "$GRADE"
          grep -Fq "fxApexSceneStability==='ready-v28'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-material-v18.js?v=20260809-sparse-hdr-facets-v18' "$MAPPER"
          grep -Fq 'formatx-core-cinematic-grade-v18.css?v=20260809-high-dynamic-facets-v18' "$MAPPER"
          grep -Fq "fxCoreVisualCalibration='reference-contrast-distribution-v18'" "$MAPPER"
          grep -Fq "fxCoreHighlightModel='sparse-high-dynamic-facets-v18'" "$MATERIAL"
          grep -Fq "fxCoreMeshMaterial='reference-glass-v18'" "$MATERIAL"
          grep -Fq 'float webA=' "$MATERIAL"
          grep -Fq 'float micro=' "$MATERIAL"
          grep -Fq 'brightness(1.64)' "$GRADE"
          grep -Fq 'opacity: 0.68' "$GRADE"
      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live MAG uses sparse high-dynamic reference facets v18'; else state=failure; description='Live sparse high-dynamic MAG v18 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
