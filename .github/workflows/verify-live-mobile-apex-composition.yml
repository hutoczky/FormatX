name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live centered object-space glass v15
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"; MATERIAL="$RUNNER_TEMP/material-v15.js"; SHAPE="$RUNNER_TEMP/shape-v14.js"; MESH="$RUNNER_TEMP/mesh.js"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-material-v15.js?v=20260809-object-space-center-v15&audit=${GITHUB_RUN_ID}" -o "$MATERIAL"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-shape-v14.js?v=20260809-reference-ratio-v14&audit=${GITHUB_RUN_ID}" -o "$SHAPE"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v11.js?v=20260809-cinematic-mesh3d-v11&audit=${GITHUB_RUN_ID}" -o "$MESH"
          grep -Fq "fxApexSceneStability==='ready-v25'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-material-v15.js?v=20260809-object-space-center-v15' "$MAPPER"
          grep -Fq 'cinematic-reference-centered-glass-true-mesh3d-v25' "$MAPPER"
          grep -Fq "reference-glass-v15-object-space-centered" "$MAPPER"
          grep -Fq 'vec2 cp=vec2(vP.x,vP.y-.18)' "$MATERIAL"
          grep -Fq 'float coreMask=1.-sm(.030,.082,r)' "$MATERIAL"
          grep -Fq "fxCoreMeshMaterial='reference-glass-v15'" "$MATERIAL"
          grep -Fq "fxCoreMaterialCenter='object-space-y-minus-0.18'" "$MATERIAL"
          grep -Fq "fxCoreShapeMesh='applied-v14'" "$SHAPE"
          grep -Fq "fxCoreShapeFracture='applied-v14'" "$SHAPE"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          ! grep -Fq 'drawImage(' "$MATERIAL"
      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live MAG uses centered object-space cinematic glass v15'; else state=failure; description='Live centered glass v15 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
