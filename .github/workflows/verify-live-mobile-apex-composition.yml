name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live volumetric glass crystal v6
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          MOBILE_CSS="$RUNNER_TEMP/formatx-mobile-apex-composition.css"
          APEX_JS="$RUNNER_TEMP/formatx-apex-native.js"
          MAPPER_JS="$RUNNER_TEMP/formatx-apex-scene-stability.js"
          CSS_HEADERS="$RUNNER_TEMP/mobile-css-headers.txt"
          MAPPER_HEADERS="$RUNNER_TEMP/mapper-headers.txt"
          REV='20260808-mobile-apex-live-2'

          for attempt in $(seq 1 18); do
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://www.formatxsuite.com/?volumetric_apex_audit=${GITHUB_RUN_ID}-${attempt}" \
              -o "$HOME_HTML" || true
            if grep -Fq 'data-fx-mobile-apex-composition="true"' "$HOME_HTML" \
              && grep -Fq "formatx-mobile-apex-composition.css?v=${REV}" "$HOME_HTML"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Live homepage is missing the mobile Apex bootstrap.' >&2
              exit 1
            fi
            sleep 5
          done

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-apex-composition.css?v=${REV}&audit=${GITHUB_RUN_ID}" \
            -D "$CSS_HEADERS" -o "$MOBILE_CSS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-native.js?audit=${GITHUB_RUN_ID}" \
            -o "$APEX_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" \
            -D "$MAPPER_HEADERS" -o "$MAPPER_JS"

          # Native Apex must be visible and native-resolution.
          grep -Fq 'html[data-fx-native-apex="ready"] .fx-transcend-shell[data-fx-native-apex="true"]' "$MOBILE_CSS"
          grep -Fq 'display: block !important' "$MOBILE_CSS"
          grep -Fq 'height: 100dvh !important' "$MOBILE_CSS"
          grep -Fq 'visibility: visible !important' "$MOBILE_CSS"
          grep -Fq 'opacity: 1 !important' "$MOBILE_CSS"
          grep -Fq 'translate3d(0, -.8svh, 0) scale(1)' "$MOBILE_CSS"
          ! grep -Fq 'scale(1.34)' "$MOBILE_CSS"

          # One first-party WebGL2 renderer remains authoritative.
          grep -Fq "getContext('webgl2'" "$APEX_JS"
          grep -Fq 'float starPrism(' "$APEX_JS"
          grep -Fq 'quality: coarse.matches ? 0.82 : 0.88' "$APEX_JS"
          grep -Fq 'coarse.matches ? 1.25 : 1.5' "$APEX_JS"

          # Volumetric v6: tapered wings, actual Z volume, 3-axis rotation,
          # multi-plane orbits, glass transmission and internal caustics.
          grep -Fq "fxApexSceneStability === 'ready-v5'" "$MAPPER_JS"
          grep -Fq 'function volumetricCrystalShader(source)' "$MAPPER_JS"
          grep -Fq 'float along=max(ap.x,ap.y)' "$MAPPER_JS"
          grep -Fq 'float across=min(ap.x,ap.y)' "$MAPPER_JS"
          grep -Fq 'float wing=radius*.46*max(0.,1.-pow(t,.66))' "$MAPPER_JS"
          grep -Fq 'float zProfile=max(.022,depth*max(0.,1.-pow(t,1.42)))' "$MAPPER_JS"
          grep -Fq 'starPrism(crystal,1.50*pulse,.58,.003)' "$MAPPER_JS"
          grep -Fq 'q.xz*=rot(.26+sin(uTime*.13)*.16' "$MAPPER_JS"
          grep -Fq 'q.yz*=rot(-.17+cos(uTime*.15)*.11' "$MAPPER_JS"
          grep -Fq 'q.xy*=rot(sin(uTime*.09)*.035)' "$MAPPER_JS"
          grep -Fq 'ring.xz*=rot(.38' "$MAPPER_JS"
          grep -Fq 'ring.xz*=rot(1.08' "$MAPPER_JS"
          grep -Fq 'ring.xy*=rot(1.57079633)' "$MAPPER_JS"
          grep -Fq 'vec3 refrDir=refract(rd,n,.73)' "$MAPPER_JS"
          grep -Fq 'float caustic=pow' "$MAPPER_JS"
          grep -Fq 'float depthFacet=pow(sat(1.-abs(n.z)),1.8)' "$MAPPER_JS"
          grep -Fq 'volumetric-glass-crystal-v6' "$MAPPER_JS"

          # Delivery and single-renderer guards.
          grep -Fq 'html[data-fx-native-apex="ready"] #fx-apex-canvas' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] .fx-three-stage-shell' "$MOBILE_CSS"
          grep -Fq '.fx-transcend-hud[data-fx-native-apex="true"]' "$MOBILE_CSS"
          grep -Eiq '^cache-control:.*no-store' "$CSS_HEADERS"
          grep -Eiq '^cache-control:.*no-store' "$MAPPER_HEADERS"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live volumetric glass crystal v6 is true 3D, transmissive and single-renderer'
          else
            state='failure'
            description='Live volumetric glass crystal v6 verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live mobile Apex composition' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
