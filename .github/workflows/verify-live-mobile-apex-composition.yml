name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify distributed high-dynamic MAG v20 live
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"; MATERIAL="$RUNNER_TEMP/material.js"; SHAPE="$RUNNER_TEMP/shape.js"; GEOMETRY="$RUNNER_TEMP/geometry.js"; GRADE="$RUNNER_TEMP/grade.css"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-material-v20.js?v=20260809-distributed-hdr-facets-v20&audit=${GITHUB_RUN_ID}" -o "$MATERIAL"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-shape-v14.js?v=20260809-reference-ratio-v14&audit=${GITHUB_RUN_ID}" -o "$SHAPE"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-geometry-v13.js?v=20260809-true-3d-scale-v13&audit=${GITHUB_RUN_ID}" -o "$GEOMETRY"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-cinematic-grade-v20.css?v=20260809-distributed-hdr-v20&audit=${GITHUB_RUN_ID}" -o "$GRADE"
          grep -Fq "fxApexSceneStability==='ready-v30'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-material-v20.js?v=20260809-distributed-hdr-facets-v20' "$MAPPER"
          grep -Fq 'formatx-core-cinematic-grade-v20.css?v=20260809-distributed-hdr-v20' "$MAPPER"
          grep -Fq "fxCoreVisualCalibration='reference-polygon-contrast-v20'" "$MAPPER"
          grep -Fq 'cinematic-distributed-hdr-reference-glass-v30' "$MAPPER"
          grep -Fq "fxCoreHighlightModel='distributed-high-dynamic-facets-v20'" "$MATERIAL"
          grep -Fq "fxCoreHighlightCoverage='facet-web-axis-ring-distribution-v20'" "$MATERIAL"
          grep -Fq "fxCoreMeshMaterial='reference-glass-v20'" "$MATERIAL"
          grep -Fq 'float planeGlow=sm(.34,.72,face)' "$MATERIAL"
          grep -Fq 'float hAxis=exp(-abs(cp.y)*11.0)' "$MATERIAL"
          grep -Fq 'float ringGlow=' "$MATERIAL"
          grep -Fq "fxCoreShapeMesh='applied-v14'" "$SHAPE"
          grep -Fq "fxCoreShapeFracture='applied-v14'" "$SHAPE"
          grep -Fq 'value*1.15' "$GEOMETRY"
          grep -Fq 'brightness(2.06)' "$GRADE"
          grep -Fq 'opacity: 0.82' "$GRADE"
          grep -Fq 'brightness(1.68)' "$GRADE"
      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live MAG uses distributed HDR centered true-3D reference material v20'; else state=failure; description='Live distributed HDR MAG v20 verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live mobile Apex composition' -f description="$description" -f target_url="$TARGET_URL"
