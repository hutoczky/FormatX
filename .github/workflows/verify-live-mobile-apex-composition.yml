name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live reference-proportioned indexed 3D MAG v10
        shell: bash
        run: |
          set -euo pipefail
          MAPPER="$RUNNER_TEMP/mapper.js"
          MESH="$RUNNER_TEMP/mesh-v10.js"
          FRACTURE="$RUNNER_TEMP/fracture-v10.js"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" -o "$MAPPER"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d-v10.js?v=20260809-true-mesh3d-v10&audit=${GITHUB_RUN_ID}" -o "$MESH"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-fracture3d-v10.js?v=20260809-fracture3d-v10&audit=${GITHUB_RUN_ID}" -o "$FRACTURE"

          grep -Fq "fxApexSceneStability='ready-v18'" "$MAPPER"
          grep -Fq 'formatx-core-mesh3d-v10.js?v=20260809-true-mesh3d-v10' "$MAPPER"
          grep -Fq 'formatx-core-fracture3d-v10.js?v=20260809-fracture3d-v10' "$MAPPER"
          grep -Fq 'retired-for-real-3d-reactor' "$MAPPER"

          grep -Fq "getContext('webgl2'" "$MESH"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH"
          grep -Fq 'gl.enable(gl.CULL_FACE)' "$MESH"
          grep -Fq 'gl.cullFace(gl.FRONT)' "$MESH"
          grep -Fq 'gl.cullFace(gl.BACK)' "$MESH"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH"
          grep -Fq 'xs=.82' "$MESH"
          grep -Fq 'ys=1.30' "$MESH"
          grep -Fq 'core=up(sphere(.060))' "$MESH"
          grep -Fq 'up(torus(.23,.0055))' "$MESH"
          grep -Fq "fxCoreMesh3d='ready-v10'" "$MESH"
          grep -Fq "fxCoreGeometry='indexed-triangle-mesh-v10'" "$MESH"
          grep -Fq "fxCoreProportion='x0.82-y1.30'" "$MESH"

          grep -Fq "getContext('webgl2'" "$FRACTURE"
          grep -Fq 'gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER' "$FRACTURE"
          grep -Fq 'gl.drawElements(gl.LINES' "$FRACTURE"
          grep -Fq 'xs=.82' "$FRACTURE"
          grep -Fq 'ys=1.30' "$FRACTURE"
          grep -Fq "fxCoreFracture3d='ready-v10'" "$FRACTURE"
          grep -Fq "fxCoreFractureGeometry='indexed-gl-lines-v10'" "$FRACTURE"
          grep -Fq "fxCoreFractureAlignment='x0.82-y1.30'" "$FRACTURE"

          ! grep -Fq 'drawImage(' "$MESH"
          ! grep -Fq 'drawImage(' "$FRACTURE"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live MAG uses reference-proportioned true indexed WebGL2 mesh v10 plus aligned 3D fracture v10'
          else
            state='failure'
            description='Live reference-proportioned true 3D MAG v10 verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live mobile Apex composition' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
