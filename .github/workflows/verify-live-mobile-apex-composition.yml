name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live mobile Apex stylesheet delivery
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          MOBILE_CSS="$RUNNER_TEMP/formatx-mobile-apex-composition.css"
          HEADERS="$RUNNER_TEMP/formatx-mobile-apex-headers.txt"
          REV='20260808-mobile-apex-live-2'

          for attempt in $(seq 1 18); do
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://www.formatxsuite.com/?mobile_apex_audit=${GITHUB_RUN_ID}-${attempt}" \
              -o "$HOME_HTML" || true

            if grep -Fq 'data-fx-mobile-apex-composition="true"' "$HOME_HTML" \
              && grep -Fq "formatx-mobile-apex-composition.css?v=${REV}" "$HOME_HTML"; then
              break
            fi

            if [ "$attempt" -eq 18 ]; then
              echo 'Live homepage is missing the direct mobile Apex composition bootstrap.' >&2
              grep -o 'formatx-mobile-apex-composition[^"<]*' "$HOME_HTML" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-apex-composition.css?v=${REV}&audit=${GITHUB_RUN_ID}" \
            -D "$HEADERS" -o "$MOBILE_CSS"

          grep -Fq 'translate3d(0, -5.5svh, 0) scale(1.34)' "$MOBILE_CSS"
          grep -Fq 'brightness(1.32)' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] #hero .hero-space::before' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] #hero .hero-space::after' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] .fx-resilient-core' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] #fx-apex-canvas' "$MOBILE_CSS"
          grep -Fq 'html[data-fx-native-apex="ready"] .fx-three-stage-shell' "$MOBILE_CSS"
          grep -Fq '.fx-transcend-hud[data-fx-native-apex="true"]' "$MOBILE_CSS"
          grep -Fq 'display: none !important' "$MOBILE_CSS"
          grep -Fq 'prefers-reduced-motion: reduce' "$MOBILE_CSS"
          grep -Eiq '^cache-control:.*no-store' "$HEADERS"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live mobile Apex is authoritative; legacy core layers are retired'
          else
            state='failure'
            description='Live mobile Apex single-renderer verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live mobile Apex composition' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
