name: Verify FormatX live mobile Apex composition
run-name: Live mobile Apex delivery audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-mobile-apex:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live true indexed 3D MAG
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          MOBILE_CSS="$RUNNER_TEMP/formatx-mobile-apex-composition.css"
          MAPPER_JS="$RUNNER_TEMP/formatx-apex-scene-stability.js"
          MESH_JS="$RUNNER_TEMP/formatx-core-mesh3d.js"
          MESH_CSS="$RUNNER_TEMP/formatx-core-mesh3d.css"
          MAPPER_HEADERS="$RUNNER_TEMP/mapper-headers.txt"
          MESH_HEADERS="$RUNNER_TEMP/mesh-headers.txt"
          REV='20260808-mobile-apex-live-2'

          for attempt in $(seq 1 18); do
            curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://www.formatxsuite.com/?true_mesh3d_audit=${GITHUB_RUN_ID}-${attempt}" \
              -o "$HOME_HTML" || true
            if grep -Fq 'data-fx-mobile-apex-composition="true"' "$HOME_HTML"; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Live homepage is missing the mobile Apex bootstrap.' >&2
              exit 1
            fi
            sleep 5
          done

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/styles/formatx-mobile-apex-composition.css?v=${REV}&audit=${GITHUB_RUN_ID}" \
            -o "$MOBILE_CSS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-scene-stability.js?audit=${GITHUB_RUN_ID}" \
            -D "$MAPPER_HEADERS" -o "$MAPPER_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-mesh3d.js?v=20260808-true-mesh3d-v1&audit=${GITHUB_RUN_ID}" \
            -D "$MESH_HEADERS" -o "$MESH_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            "https://www.formatxsuite.com/scifi-ui/styles/formatx-core-mesh3d.css?v=20260808-true-mesh3d-v1&audit=${GITHUB_RUN_ID}" \
            -o "$MESH_CSS"

          # Existing mobile background remains native-resolution and visible.
          grep -Fq 'display: block !important' "$MOBILE_CSS"
          grep -Fq 'height: 100dvh !important' "$MOBILE_CSS"
          grep -Fq 'translate3d(0, -.8svh, 0) scale(1)' "$MOBILE_CSS"

          # SDF core is explicitly retired while the true mesh owns MAG.
          grep -Fq "fxApexSceneStability === 'ready-v9'" "$MAPPER_JS"
          grep -Fq 'if(uScene<.92)return vec2(10.,1.)' "$MAPPER_JS"
          grep -Fq "fxSdfCore = 'disabled-before-scene-0.92'" "$MAPPER_JS"
          grep -Fq 'formatx-core-mesh3d.js?v=20260808-true-mesh3d-v1' "$MAPPER_JS"
          grep -Fq 'formatx-core-mesh3d.css?v=20260808-true-mesh3d-v1' "$MAPPER_JS"

          # Real 3D: vertex/index buffers, normals, depth test and perspective.
          grep -Fq "getContext('webgl2'" "$MESH_JS"
          grep -Fq 'depth: true' "$MESH_JS"
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' "$MESH_JS"
          grep -Fq 'gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER' "$MESH_JS"
          grep -Fq 'gl.drawElements(gl.TRIANGLES' "$MESH_JS"
          grep -Fq 'aPosition' "$MESH_JS"
          grep -Fq 'aNormal' "$MESH_JS"
          grep -Fq 'computeNormals(' "$MESH_JS"
          grep -Fq 'function perspective(' "$MESH_JS"
          grep -Fq 'function lookAt(' "$MESH_JS"
          grep -Fq 'uProjection*uView*vec4(p,1.)' "$MESH_JS"

          # Reference geometry: four tips, concave shoulders, front/back surfaces and side walls.
          grep -Fq '[0,1],[.115,.705],[.305,.325],[.705,.115]' "$MESH_JS"
          grep -Fq '[1,0]' "$MESH_JS"
          grep -Fq '[0,-1]' "$MESH_JS"
          grep -Fq '[-1,0]' "$MESH_JS"
          grep -Fq 'const depth = .46' "$MESH_JS"
          grep -Fq 'frontCenter = add(0, 0, depth)' "$MESH_JS"
          grep -Fq 'backCenter = add(0, 0, -depth)' "$MESH_JS"
          grep -Fq 'outerFront = front[rings - 1]' "$MESH_JS"

          # Actual 3D reactor/orbits and living pulse.
          grep -Fq 'buildSphereGeometry(.165)' "$MESH_JS"
          grep -Fq 'buildTorusGeometry(.29, .012)' "$MESH_JS"
          grep -Fq 'buildTorusGeometry(.88, .008)' "$MESH_JS"
          grep -Fq 'Math.pow(beatA, 4) * .72 + Math.pow(beatB, 9) * .28' "$MESH_JS"
          grep -Fq 'const pulse = 1 + heart * .026 + breath * .006' "$MESH_JS"
          grep -Fq "fxCoreGeometry = 'indexed-triangle-mesh'" "$MESH_JS"
          grep -Fq "fxCoreDepthBuffer = 'enabled'" "$MESH_JS"
          grep -Fq "fxCoreCamera = 'perspective'" "$MESH_JS"
          ! grep -Fq 'drawImage(' "$MESH_JS"
          ! grep -Fqi 'three.js' "$MESH_JS"

          grep -Fq 'pointer-events: none' "$MESH_CSS"
          grep -Fq 'height: 100dvh' "$MESH_CSS"
          grep -Fq 'background: transparent' "$MESH_CSS"
          grep -Eiq '^cache-control:.*no-store' "$MAPPER_HEADERS"

      - name: Publish live mobile Apex status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live MAG uses real indexed WebGL2 mesh geometry, depth, normals, perspective and pulsing 3D reactor'
          else
            state='failure'
            description='Live true indexed 3D MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live mobile Apex composition' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
