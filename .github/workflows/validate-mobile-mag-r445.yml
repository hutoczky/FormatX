name: Validate r446 mobile MAG optics

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-mag-balance-r446.css'
      - 'docs/scifi-ui/scripts/formatx-mag-surface-sheen-r439.js'
      - '.github/scripts/validate-mobile-mag-r445.cjs'
      - '.github/workflows/validate-mobile-mag-r445.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate-r446:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate compact balanced soft-perimeter mobile MAG
        run: node .github/scripts/validate-mobile-mag-r445.cjs
      - name: Publish r446 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='r446 compact balanced soft-perimeter mobile MAG passed'
          else
            state=failure
            description='r446 mobile MAG optics validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX r446 mobile MAG optics' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
