name: R2120 real desktop and phone hero layout shift diagnostics

on:
  push:
    branches:
      - feature/r2104-cinematic-machined-mag-intro
    paths:
      - '.github/scripts/diagnose-r2120-layout-shift.cjs'
      - '.github/workflows/diagnose-r2120-layout-shift.yml'
      - 'docs/scifi-ui/index.html'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2120-hero-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-actual-cls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual browser probe
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/diagnose-r2120-layout-shift.cjs
      - name: Install Chromium for true layout trace
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/r2120" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/r2120/node_modules/.bin/playwright" install --with-deps chromium
      - name: Host exact site under test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs >/tmp/formatx-r2120.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/formatx-r2120.log
          exit 1
      - name: Record actual layout-shift sources at 200-4200ms
        env:
          NODE_PATH: ${{ runner.temp }}/r2120/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/diagnose-r2120-layout-shift.cjs
      - name: Preserve first-paint screenshot and browser trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2120-real-hero-cls
          path: artifacts/r2120-layout-shift/
          retention-days: 21
          if-no-files-found: warn
