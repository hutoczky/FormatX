name: Validate FormatX mobile WebGL 60 FPS target r191

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - '.github/workflows/validate-mobile-webgl-60fps-r191.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - '.github/workflows/validate-mobile-webgl-60fps-r191.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-mobile-webgl-r191-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-webgl-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate r191 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          grep -Fq "TARGET_FPS=60" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "FRAME_BUDGET=1000/TARGET_FPS" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "r191-dynamic-resolution-hysteresis" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "QUALITY_FLOOR=mobile?.62" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "budget=mobile?520000" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "powerPreference:'high-performance'" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "desynchronized:true" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "20260817-r191-mobile-60fps" docs/scifi-ui/scripts/formatx-core-mobile-v55.js

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-webgl-r191" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-webgl-r191/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-webgl-http.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-webgl-http.log"
          exit 1

      - name: Measure mobile frame pacing and adaptive resolution
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-webgl-r191/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          const median = values => {
            const sorted = [...values].sort((a,b) => a-b);
            return sorted[Math.floor(sorted.length / 2)] || 0;
          };
          const percentile = (values, p) => {
            const sorted = [...values].sort((a,b) => a-b);
            return sorted[Math.min(sorted.length - 1, Math.max(0, Math.floor((sorted.length - 1) * p)))] || 0;
          };

          async function runCase(browser, width, height, dpr) {
            const context = await browser.newContext({
              viewport: { width, height },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: dpr,
              locale: 'en-US',
              colorScheme: 'dark'
            });
            await context.addInitScript(() => {
              try { localStorage.setItem('formatx:intro-seen-v1', '1'); } catch (_) {}
            });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4178/scifi-ui/index.html?webgl-r191=1', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCoreMobileR99 === 'ready-v69', null, { timeout: 45000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCoreTargetFps === '60', null, { timeout: 10000 });
            await page.waitForTimeout(1800);

            const samples = [];
            for (let i = 0; i < 20; i += 1) {
              await page.waitForTimeout(200);
              samples.push(await page.evaluate(() => {
                const root = document.documentElement;
                const canvas = document.querySelector('.fx-core-mobile-v55-canvas');
                const box = canvas?.getBoundingClientRect();
                const gl = canvas?.getContext('webgl2') || canvas?.getContext('webgl');
                return {
                  fps: Number(root.dataset.fxCoreReal3dFps || 0),
                  frameMs: Number(root.dataset.fxCoreFrameMs || 0),
                  renderMs: Number(root.dataset.fxCoreRenderAverageMs || root.dataset.fxCoreRenderMs || 0),
                  scale: Number(root.dataset.fxCoreRenderScale || 0),
                  quality: Number(root.dataset.fxCoreReal3dQuality || 0),
                  target: root.dataset.fxCoreTargetFps || '',
                  budget: Number(root.dataset.fxCoreFrameBudgetMs || 0),
                  adaptive: root.dataset.fxCoreAdaptiveQuality || '',
                  mode: root.dataset.fxCorePerformanceMode || '',
                  resolution: [canvas?.width || 0, canvas?.height || 0],
                  box: box ? [box.width, box.height] : [0,0],
                  canvases: document.querySelectorAll('.fx-core-mobile-v55-canvas').length,
                  glOk: Boolean(gl),
                  glError: gl?.getError?.() ?? -1
                };
              }));
            }

            const useful = samples.filter(s => s.fps > 0 && s.frameMs > 0);
            assert.ok(useful.length >= 10, JSON.stringify({ width, height, dpr, samples }));
            const fpsValues = useful.map(s => s.fps);
            const frameValues = useful.map(s => s.frameMs);
            const last = useful.at(-1);
            assert.equal(last.target, '60');
            assert.ok(Math.abs(last.budget - 16.67) <= .05, JSON.stringify(last));
            assert.equal(last.adaptive, 'r191-dynamic-resolution-hysteresis');
            assert.equal(last.canvases, 1);
            assert.equal(last.glOk, true);
            assert.equal(last.glError, 0);
            assert.ok(last.scale >= .61 && last.scale <= .97, JSON.stringify(last));
            assert.ok(last.resolution[0] * last.resolution[1] <= 520000, JSON.stringify(last));
            assert.ok(median(fpsValues) >= 55, JSON.stringify({ width, height, fpsValues, samples }));
            assert.ok(percentile(fpsValues, .25) >= 50, JSON.stringify({ width, height, fpsValues, samples }));
            assert.ok(median(frameValues) <= 18.2, JSON.stringify({ width, height, frameValues, samples }));

            const canvasBox = await page.locator('.fx-core-mobile-v55-canvas').boundingBox();
            assert.ok(canvasBox);
            await page.touchscreen.tap(canvasBox.x + canvasBox.width / 2, canvasBox.y + canvasBox.height / 2);
            await page.waitForTimeout(500);
            const afterTouch = await page.evaluate(() => ({
              fps: Number(document.documentElement.dataset.fxCoreReal3dFps || 0),
              mode: document.documentElement.dataset.fxCorePerformanceMode || '',
              scale: Number(document.documentElement.dataset.fxCoreRenderScale || 0),
              energy: Number(window.FormatXCoreMobileV69?.energy || 0)
            }));
            assert.ok(afterTouch.fps >= 45, JSON.stringify(afterTouch));
            assert.ok(afterTouch.energy > .3, JSON.stringify(afterTouch));

            console.log(JSON.stringify({
              viewport: `${width}x${height}@${dpr}`,
              medianFps: median(fpsValues),
              p25Fps: percentile(fpsValues, .25),
              medianFrameMs: median(frameValues),
              final: last,
              afterTouch
            }));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader']
            });
            try {
              await runCase(browser, 390, 844, 3);
              await runCase(browser, 412, 915, 3);
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Publish mobile WebGL status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state='success'; description='Mobile WebGL r191 60 FPS target and adaptive frame budget passed'
          else
            state='failure'; description='Mobile WebGL r191 frame-budget validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX mobile WebGL 60 FPS r191' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
