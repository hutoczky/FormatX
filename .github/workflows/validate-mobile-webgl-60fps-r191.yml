name: Validate FormatX mobile WebGL 60 FPS target r192

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js'
      - 'docs/scifi-ui/scripts/formatx-living-energy-r168.js'
      - 'docs/scifi-ui/scripts/formatx-soty-continuity-r179.js'
      - 'docs/scifi-ui/styles/formatx-mobile-performance-r192.css'
      - '.github/workflows/validate-mobile-webgl-60fps-r191.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js'
      - 'docs/scifi-ui/scripts/formatx-living-energy-r168.js'
      - 'docs/scifi-ui/scripts/formatx-soty-continuity-r179.js'
      - 'docs/scifi-ui/styles/formatx-mobile-performance-r192.css'
      - '.github/workflows/validate-mobile-webgl-60fps-r191.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-mobile-webgl-r192-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-webgl-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate r192 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node --check docs/scifi-ui/scripts/formatx-soty-continuity-r179.js
          grep -Fq "TARGET_FPS=60" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "FRAME_BUDGET=1000/TARGET_FPS" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "r191-dynamic-resolution-hysteresis" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "QUALITY_FLOOR=mobile?.62" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "budget=mobile?520000" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "powerPreference:'high-performance'" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "desynchronized:true" docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          grep -Fq "20260817-r192-first-paint-60fps" docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -Fq "first-paint-before-shader-compile" docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -Fq "r192-budgeted-telemetry-css-owned-visuals" docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          grep -Fq "r192-event-driven-energy-css-animations" docs/scifi-ui/scripts/formatx-living-energy-r168.js
          grep -Fq "event-driven-max-8fps-r192" docs/scifi-ui/scripts/formatx-soty-continuity-r179.js
          grep -Fq "content-visibility: auto" docs/scifi-ui/styles/formatx-mobile-performance-r192.css

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-webgl-r192" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-webgl-r192/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-webgl-http.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-webgl-http.log"
          exit 1

      - name: Measure mobile frame pacing and competing animation budget
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-webgl-r192/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const median = values => { const s=[...values].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]||0; };
          const percentile = (values,p) => { const s=[...values].sort((a,b)=>a-b); return s[Math.min(s.length-1,Math.max(0,Math.floor((s.length-1)*p)))]||0; };

          async function runCase(browser,width,height){
            const context=await browser.newContext({viewport:{width,height},isMobile:true,hasTouch:true,deviceScaleFactor:2,locale:'en-US',colorScheme:'dark'});
            await context.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4178/scifi-ui/index.html?webgl-r192=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileR99==='ready-v69',null,{timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreTargetFps==='60',null,{timeout:10000});
            await page.waitForTimeout(1100);
            const samples=[];
            for(let i=0;i<12;i++){
              await page.waitForTimeout(150);
              samples.push(await page.evaluate(()=>{
                const root=document.documentElement,canvas=document.querySelector('.fx-core-mobile-v55-canvas'),gl=canvas?.getContext('webgl2')||canvas?.getContext('webgl');
                return {fps:Number(root.dataset.fxCoreReal3dFps||0),frameMs:Number(root.dataset.fxCoreFrameMs||0),renderMs:Number(root.dataset.fxCoreRenderAverageMs||root.dataset.fxCoreRenderMs||0),scale:Number(root.dataset.fxCoreRenderScale||0),target:root.dataset.fxCoreTargetFps||'',budget:Number(root.dataset.fxCoreFrameBudgetMs||0),adaptive:root.dataset.fxCoreAdaptiveQuality||'',resolution:[canvas?.width||0,canvas?.height||0],canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,glOk:Boolean(gl),glError:gl?.getError?.()??-1,heartbeatPerf:root.dataset.fxLiveHeartbeatPerformanceR192||'',energyPerf:root.dataset.fxLivingEnergyPerformanceR192||'',sotyScheduler:root.dataset.fxSotySchedulerR179||'',startup:root.dataset.fxCoreStartupBudgetR192||''};
              }));
            }
            const useful=samples.filter(s=>s.fps>0&&s.frameMs>0);assert.ok(useful.length>=6,JSON.stringify({width,height,samples}));
            const fps=useful.map(s=>s.fps),frames=useful.map(s=>s.frameMs),last=useful.at(-1);
            assert.equal(last.target,'60');assert.ok(Math.abs(last.budget-16.67)<=.05,JSON.stringify(last));assert.equal(last.adaptive,'r191-dynamic-resolution-hysteresis');assert.equal(last.canvases,1);assert.equal(last.glOk,true);assert.equal(last.glError,0);assert.ok(last.scale>=.61&&last.scale<=.97,JSON.stringify(last));assert.ok(last.resolution[0]*last.resolution[1]<=520000,JSON.stringify(last));
            assert.ok(median(fps)>=52,JSON.stringify({width,height,fps,samples}));assert.ok(percentile(fps,.25)>=45,JSON.stringify({width,height,fps,samples}));assert.ok(median(frames)<=19.3,JSON.stringify({width,height,frames,samples}));
            assert.equal(last.heartbeatPerf,'r192-budgeted-telemetry-css-owned-visuals');assert.equal(last.energyPerf,'r192-event-driven-energy-css-animations');assert.match(last.sotyScheduler,/event-driven|max-8fps|^$/);
            console.log(JSON.stringify({viewport:`${width}x${height}@2`,medianFps:median(fps),p25Fps:percentile(fps,.25),medianFrameMs:median(frames),final:last}));
            await context.close();
          }

          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await runCase(browser,390,844);await runCase(browser,412,915);}finally{await browser.close();}})().catch(error=>{console.error(error.stack||error);process.exit(1);});
          NODE

      - name: Publish mobile WebGL status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state='success'; description='Mobile WebGL r192 60 FPS target and competing animation budget passed'
          else
            state='failure'; description='Mobile WebGL r192 frame-budget validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX mobile WebGL 60 FPS r192' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
