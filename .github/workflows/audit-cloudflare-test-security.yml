name: Audit Cloudflare test security migration

on:
  push:
    branches:
      - audit/cloudflare-test-security-20260807
    paths:
      - 'billing-worker/package.json'
      - 'billing-worker/package-lock.json'
      - 'billing-worker/vitest.config.js'
      - 'billing-worker/vitest.license-workers.config.js'
      - '.github/workflows/audit-cloudflare-test-security.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formatx-cloudflare-test-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/cloudflare-test-security-20260807

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Refresh locked test toolchain
        working-directory: billing-worker
        run: npm install --package-lock-only --ignore-scripts

      - name: Install refreshed lockfile
        working-directory: billing-worker
        run: npm ci

      - name: Block high or critical npm vulnerabilities
        working-directory: billing-worker
        run: npm audit --audit-level=high

      - name: Run complete Worker test suite
        working-directory: billing-worker
        run: npm test

      - name: Build Worker candidate
        working-directory: billing-worker
        run: npx wrangler deploy --dry-run --outdir ../.wrangler-security-audit

      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- billing-worker/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add billing-worker/package-lock.json
          git commit -m 'Lock verified Cloudflare test security upgrade'
          git push origin HEAD:audit/cloudflare-test-security-20260807
