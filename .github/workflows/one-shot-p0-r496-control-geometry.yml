name: One-shot P0 R496 control geometry repair

on:
  push:
    branches: [p0-vip-awwwards-gate]
    paths:
      - '.github/workflows/one-shot-p0-r496-control-geometry.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-vip-awwwards-gate
          fetch-depth: 0
      - name: Apply R496 first-frame and overflow repair
        shell: python
        run: |
          from pathlib import Path

          owner = Path('docs/scifi-ui/styles/formatx-control-owner-r264.css')
          text = owner.read_text()
          old = '''  html body.living-architecture .topbar {
              width: 100vw !important;
              min-width: 100vw !important;
              max-width: 100vw !important;
              box-sizing: border-box !important;
            }'''
          # Keep indentation-independent replacement deterministic.
          old = old.replace('            ', '')
          new = '''  html body.living-architecture .topbar {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('R496: expected mobile topbar 100vw block not found')
          owner.write_text(text.replace(old, new, 1))

          stability = Path('docs/scifi-ui/styles/formatx-first-frame-stability-r283.css')
          css = stability.read_text()
          marker = 'deploy-r496-final-control-first-frame'
          if marker not in css:
              css += r'''

/* R496 P0 — first-frame controls are born in the exact final r264 geometry.
   High specificity intentionally outranks legacy pre-owner rails before DCL. */
@media (min-width: 901px) {
  html:root:root:root:root:root body.living-architecture .topbar .fx-reference-menu-button {
    position: fixed !important;
    inset: auto !important;
    top: 12px !important;
    right: 22px !important;
    width: 52px !important;
    min-width: 52px !important;
    max-width: 52px !important;
    height: 50px !important;
    min-height: 50px !important;
    max-height: 50px !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    translate: none !important;
  }
  html:root:root:root:root:root body.living-architecture .topbar .fx-language-toggle {
    position: fixed !important;
    inset: auto !important;
    top: 13px !important;
    right: 88px !important;
    width: 46px !important;
    min-width: 46px !important;
    max-width: 46px !important;
    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    translate: none !important;
  }
  html:root:root:root:root:root body.living-architecture .topbar .fx-reference-mag-button {
    position: fixed !important;
    inset: auto !important;
    top: 13px !important;
    right: 148px !important;
    width: 54px !important;
    min-width: 54px !important;
    max-width: 54px !important;
    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    translate: none !important;
  }
  html:root:root:root:root:root body.living-architecture #hero .hero-space > .fx-reference-controls-r204,
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 {
    position: absolute !important;
    inset: auto auto 28px 50% !important;
    z-index: 12040 !important;
    display: grid !important;
    grid-template-columns: repeat(3, 54px) !important;
    grid-template-rows: auto !important;
    align-items: start !important;
    justify-content: center !important;
    gap: 14px !important;
    box-sizing: border-box !important;
    width: max-content !important;
    min-width: 0 !important;
    max-width: none !important;
    height: auto !important;
    min-height: 82px !important;
    margin: 0 !important;
    padding: 0 8px 24px !important;
    overflow: visible !important;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    transform: translateX(-50%) !important;
    translate: none !important;
  }
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 > .fx-reference-rail,
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 > .fx-reference-rail-r264 {
    display: contents !important;
    position: static !important;
    inset: auto !important;
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    height: auto !important;
    min-height: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    translate: none !important;
  }
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 > .fx-three-sound,
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 .fx-reference-ask,
  html:root:root:root:root:root body.living-architecture #hero .fx-reference-controls-r204 .fx-reference-pause {
    position: relative !important;
    inset: auto !important;
    box-sizing: border-box !important;
    display: grid !important;
    place-items: center !important;
    width: 54px !important;
    min-width: 54px !important;
    max-width: 54px !important;
    height: 54px !important;
    min-height: 54px !important;
    max-height: 54px !important;
    margin: 0 !important;
    padding: 0 !important;
    transform: none !important;
    translate: none !important;
  }
}
/* deploy-r496-final-control-first-frame */
'''
              stability.write_text(css)

          trace = Path('.github/scripts/trace-p0-desktop-cls.cjs')
          js = trace.read_text()
          probe_marker = 'p0-mobile-overflow.json'
          if probe_marker not in js:
              needle = '''    await context.close();\n  } finally {'''
              insert = r'''    await context.close();

    const mobileContext = await browser.newContext({
      viewport: { width: 390, height: 844 },
      isMobile: true,
      hasTouch: true,
      locale: 'hu-HU',
      colorScheme: 'dark'
    });
    const mobilePage = await mobileContext.newPage();
    await mobilePage.goto(`${URL}?p0_overflow_trace=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
    await mobilePage.waitForLoadState('networkidle', { timeout: 6000 }).catch(() => {});
    await mobilePage.waitForTimeout(1100);
    const mobileOverflow = await mobilePage.evaluate(() => {
      const root = document.documentElement;
      const body = document.body;
      const vw = root.clientWidth;
      const offenders = [];
      for (const el of document.querySelectorAll('*')) {
        const cs = getComputedStyle(el);
        const r = el.getBoundingClientRect();
        if (cs.display === 'none' || cs.visibility === 'hidden' || r.width < .5 || r.height < .5) continue;
        const right = r.right - vw;
        const left = -r.left;
        const scrollExtra = el.scrollWidth - el.clientWidth;
        if (right > .5 || left > .5 || (scrollExtra > 1 && cs.overflowX === 'visible')) {
          offenders.push({
            tag: el.tagName,
            id: el.id || '',
            className: String(el.className || '').slice(0, 160),
            left: +r.left.toFixed(2),
            right: +r.right.toFixed(2),
            width: +r.width.toFixed(2),
            rightOverflow: +Math.max(0, right).toFixed(2),
            leftOverflow: +Math.max(0, left).toFixed(2),
            clientWidth: el.clientWidth,
            scrollWidth: el.scrollWidth,
            scrollExtra,
            position: cs.position,
            boxSizing: cs.boxSizing,
            overflowX: cs.overflowX,
            transform: cs.transform
          });
        }
      }
      offenders.sort((a,b) => Math.max(b.rightOverflow,b.leftOverflow,b.scrollExtra) - Math.max(a.rightOverflow,a.leftOverflow,a.scrollExtra));
      return {
        viewport: innerWidth,
        clientWidth: vw,
        rootScrollWidth: root.scrollWidth,
        bodyScrollWidth: body?.scrollWidth || 0,
        overflow: Math.max(root.scrollWidth, body?.scrollWidth || 0) - vw,
        offenders: offenders.slice(0, 60)
      };
    });
    fs.writeFileSync('p0-evidence/p0-mobile-overflow.json', JSON.stringify(mobileOverflow, null, 2) + '\n');
    console.log(`P0 mobile overflow trace: overflow=${mobileOverflow.overflow}px, offenders=${mobileOverflow.offenders.length}`);
    for (const offender of mobileOverflow.offenders.slice(0, 20)) console.log(`P0 overflow offender ${JSON.stringify(offender)}`);
    await mobileContext.close();
  } finally {'''
              if needle not in js:
                  raise SystemExit('R496: trace insertion point not found')
              trace.write_text(js.replace(needle, insert, 1))

      - name: Commit R496 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/styles/formatx-control-owner-r264.css docs/scifi-ui/styles/formatx-first-frame-stability-r283.css .github/scripts/trace-p0-desktop-cls.cjs
          git diff --cached --check
          git commit -m "P0 R496: stabilize final controls and mobile viewport width"
          git push origin HEAD:p0-vip-awwwards-gate
