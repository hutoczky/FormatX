name: Patch FormatX causal hover animation

on:
  push:
    branches: [master]
    paths:
      - "docs/scifi-ui/CAUSAL_HOVER_TRIGGER.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0

      - name: Add causal hover preview animation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/scripts/causal-memory-field.js')
          text = path.read_text(encoding='utf-8')

          variable_anchor = '  let intersectionObserver;\n'
          variable_insert = '  let intersectionObserver;\n  let hoverPreviewTimer = 0;\n'
          if 'let hoverPreviewTimer = 0;' not in text:
              if variable_anchor not in text:
                  raise SystemExit('Variable insertion anchor not found')
              text = text.replace(variable_anchor, variable_insert, 1)

          old_block = '''  function bindModules() {
    root.querySelectorAll('[data-fx5k-module]').forEach(function (button) {
      const id = button.dataset.fx5kModule;
      button.addEventListener('click', function () { recordModule(id); });
      button.addEventListener('pointerenter', function () {
        hoveredModule = id;
        updateReadout();
        requestFrame();
      });
      button.addEventListener('pointerleave', function () {
        hoveredModule = '';
        updateReadout();
        requestFrame();
      });
      button.addEventListener('focus', function () {
        hoveredModule = id;
        updateReadout();
        requestFrame();
      });
      button.addEventListener('blur', function () {
        hoveredModule = '';
        updateReadout();
        requestFrame();
      });
    });
  }
'''

          new_block = '''  function clearPreviewClasses() {
    window.clearTimeout(hoverPreviewTimer);
    hoverPreviewTimer = 0;
    root.classList.remove('fx-causal-previewing');
    root.querySelectorAll('[data-fx5k-module]').forEach(function (node) {
      node.classList.remove('fx-causal-preview-source', 'fx-causal-preview-target');
      node.style.removeProperty('--fx-causal-preview-delay');
    });
    pulses = pulses.filter(function (pulse) { return !pulse.preview; });
    waves = waves.filter(function (wave) { return !wave.preview; });
  }

  function previewModule(id, button) {
    if (!MODULES.includes(id)) return;
    clearPreviewClasses();
    hoveredModule = id;
    root.classList.add('fx-causal-previewing');
    button.classList.add('fx-causal-preview-source');

    const now = performance.now();
    const targets = RELATIONS[id] || [];
    waves.push({ id: id, started: now, duration: 1250, preview: true });
    targets.forEach(function (targetId, index) {
      const target = root.querySelector('[data-fx5k-module="' + targetId + '"]');
      const delay = index * 145;
      if (target) {
        target.classList.add('fx-causal-preview-target');
        target.style.setProperty('--fx-causal-preview-delay', delay + 'ms');
      }
      pulses.push({
        from: id,
        to: targetId,
        started: now + delay,
        duration: 1050,
        preview: true
      });
      waves.push({
        id: targetId,
        started: now + delay + 520,
        duration: 920,
        preview: true
      });
    });

    updateReadout();
    animatePanel();
    requestFrame();

    hoverPreviewTimer = window.setTimeout(function () {
      if (hoveredModule !== id || reduceMotion.matches) return;
      previewModule(id, button);
    }, 2400);
  }

  function endModulePreview(id) {
    if (hoveredModule !== id) return;
    clearPreviewClasses();
    hoveredModule = '';
    updateReadout();
    requestFrame();
  }

  function bindModules() {
    root.querySelectorAll('[data-fx5k-module]').forEach(function (button) {
      const id = button.dataset.fx5kModule;
      button.addEventListener('click', function () { recordModule(id); });
      button.addEventListener('pointerenter', function () { previewModule(id, button); });
      button.addEventListener('pointerleave', function () { endModulePreview(id); });
      button.addEventListener('focus', function () { previewModule(id, button); });
      button.addEventListener('blur', function () { endModulePreview(id); });
    });
  }
'''

          if 'function previewModule(id, button)' not in text:
              if old_block not in text:
                  raise SystemExit('Original bindModules block not found')
              text = text.replace(old_block, new_block, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'function previewModule(id, button)' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'fx-causal-preview-source' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'preview: true' docs/scifi-ui/scripts/causal-memory-field.js
          rm -f docs/scifi-ui/CAUSAL_HOVER_TRIGGER.txt .github/workflows/patch-causal-memory-hover.yml

      - name: Commit hover animation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Animate causal branch previews on hover"
          git push origin HEAD:master
