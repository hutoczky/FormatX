name: Validate FormatX Year 5000 website

on:
  push:
    branches: [master]
    paths:
      - "docs/scifi-ui/scripts/future-5000.js"
      - "docs/scifi-ui/scripts/future-5000-effects.js"
      - "docs/scifi-ui/scripts/causal-memory-field.js"
      - "docs/scifi-ui/scripts/causal-memory-hover.js"
      - "docs/scifi-ui/styles/future-5000.css"
      - "docs/scifi-ui/styles/future-5000-effects.css"
      - "docs/scifi-ui/styles/future-5000-readability.css"
      - "docs/scifi-ui/styles/causal-memory-field.css"
      - "docs/scifi-ui/styles/causal-memory-hover.css"
      - "docs/scifi-ui/scripts/start-sale.js"
      - "billing-worker/src/production-with-license.js"
      - ".github/workflows/validate-year-5000.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/future-5000.js
          node --check docs/scifi-ui/scripts/future-5000-effects.js
          node --check docs/scifi-ui/scripts/causal-memory-field.js
          node --check docs/scifi-ui/scripts/causal-memory-hover.js
          node --check docs/scifi-ui/scripts/start-sale.js
          node --check billing-worker/src/production-with-license.js

      - name: Validate separate QR structure
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id = '\''formatx-plan-qr-dock'\''' docs/scifi-ui/scripts/start-sale.js
          grep -F 'cards.insertAdjacentElement('\''afterend'\'', dock)' docs/scifi-ui/scripts/start-sale.js
          grep -F 'grid-template-columns: repeat(3, minmax(0, 1fr))' docs/scifi-ui/styles/future-5000.css
          grep -F '.fx-plan-qr-dock' docs/scifi-ui/styles/future-5000.css
          grep -F '.fx-plan-qr-card' docs/scifi-ui/styles/future-5000.css
          ! grep -E 'price-card[^\n]*position:[[:space:]]*absolute' docs/scifi-ui/styles/future-5000.css

      - name: Validate refined Year 5000 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'formatx-future-5000' docs/scifi-ui/scripts/future-5000.js
          grep -F 'fx5k-map-node' docs/scifi-ui/scripts/future-5000.js
          grep -F 'fx5k-sequence-button' docs/scifi-ui/scripts/future-5000.js
          grep -F '[data-fx5k-lens]' docs/scifi-ui/scripts/future-5000.js
          grep -F 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/future-5000.css

      - name: Validate cinematic effects layer
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'future-5000-effects.css' billing-worker/src/production-with-license.js
          grep -F 'future-5000-effects.js' billing-worker/src/production-with-license.js
          grep -F 'fx5k-cinematic-layer' docs/scifi-ui/scripts/future-5000-effects.js
          grep -F 'animateMotion' docs/scifi-ui/scripts/future-5000-effects.js
          grep -F 'fx5k-core-orbit' docs/scifi-ui/styles/future-5000-effects.css
          grep -F 'fx5k-detail-refract' docs/scifi-ui/styles/future-5000-effects.css
          grep -F 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/future-5000-effects.css

      - name: Validate causal memory field
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'sessionStorage' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'formatx-causal-memory-v1' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'INTERAKCIÓS DNS' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'drawMemoryPaths' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F 'drawPredictions' docs/scifi-ui/scripts/causal-memory-field.js
          grep -F '.fx-causal-memory-panel' docs/scifi-ui/styles/causal-memory-field.css
          grep -F '.fx-causal-dna' docs/scifi-ui/styles/causal-memory-field.css
          grep -F 'causal-memory-field.css' billing-worker/src/production-with-license.js
          grep -F 'causal-memory-field.js' billing-worker/src/production-with-license.js

      - name: Validate causal hover animation
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'fx-causal-hover-layer' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F 'animateMotion' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F 'fx-causal-preview-source' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F 'fx-causal-preview-target' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F 'pointerenter' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F 'focus' docs/scifi-ui/scripts/causal-memory-hover.js
          grep -F '.fx-causal-hover-path' docs/scifi-ui/styles/causal-memory-hover.css
          grep -F '@keyframes fx-causal-wave' docs/scifi-ui/styles/causal-memory-hover.css
          grep -F 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/causal-memory-hover.css
          grep -F 'causal-memory-hover.css' billing-worker/src/production-with-license.js
          grep -F 'causal-memory-hover.js' billing-worker/src/production-with-license.js

      - name: Validate readability protection
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'future-5000-readability.css' billing-worker/src/production-with-license.js
          grep -F '.fx5k-cinematic .fx5k-stage' docs/scifi-ui/styles/future-5000-readability.css
          grep -F 'transform: none !important' docs/scifi-ui/styles/future-5000-readability.css
          grep -F 'writing-mode: horizontal-tb !important' docs/scifi-ui/styles/future-5000-readability.css
          grep -F 'text-rendering: optimizeLegibility' docs/scifi-ui/styles/future-5000-readability.css
          grep -F 'transform: none !important' docs/scifi-ui/styles/causal-memory-field.css
          grep -F 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/future-5000-readability.css

      - name: Summary
        run: |
          {
            echo '## FormatX Year 5000 validation'
            echo
            echo '- JavaScript syntax: PASS'
            echo '- Separate three-plan QR row: PASS'
            echo '- Refined system architecture: PASS'
            echo '- Cinematic effects injection: PASS'
            echo '- Causal session memory: PASS'
            echo '- Interaction DNA generation: PASS'
            echo '- Hover branch projection: PASS'
            echo '- Animated SVG energy paths: PASS'
            echo '- Keyboard focus animation: PASS'
            echo '- Flat readable text plane: PASS'
            echo '- Firefox/Linux glyph protection: PASS'
            echo '- Reduced-motion accessibility: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist successful validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/scifi-ui/validation
          cat > docs/scifi-ui/validation/year5000-status.json <<EOF
          {
            "status": "PASS",
            "sourceCommit": "${GITHUB_SHA}",
            "validatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "javascriptSyntax": true,
            "separatePlanQrRow": true,
            "refinedSystemArchitecture": true,
            "cinematicEffectsInjection": true,
            "causalSessionMemory": true,
            "interactionDnaGeneration": true,
            "hoverBranchProjection": true,
            "animatedSvgEnergyPaths": true,
            "keyboardFocusAnimation": true,
            "flatReadableTextPlane": true,
            "firefoxLinuxGlyphProtection": true,
            "reducedMotionAccessibility": true
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/validation/year5000-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful causal Year 5000 validation"
            git push origin HEAD:master
          fi
