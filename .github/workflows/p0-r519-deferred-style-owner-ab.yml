name: P0 R519 deferred style owner A/B

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r519-deferred-style-owner-ab.yml']

permissions:
  contents: read

env:
  CANDIDATE_REF: p0-r518-apex-buildtmp
  CANDIDATE_SHA: 0c983b25cbabecbdd73c8df760638c0c7554663b

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Prepare exact R518 with diagnostic-only style exclusion switch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/scripts/formatx-deferred-css-r487.js')
          s=p.read_text()
          needle="""  const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));"""
          replacement="""  const DIAG_SKIP_STYLE = new URLSearchParams(location.search).get('diag_skip_style') || '';\n  const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));"""
          assert needle in s
          s=s.replace(needle,replacement,1)
          needle2="""      const targetMedia = link.dataset.fxR487TargetMedia || 'all';"""
          replacement2="""      if (DIAG_SKIP_STYLE && link.href.includes(DIAG_SKIP_STYLE)) {\n        link.dataset.fxDiagSkippedStyle = DIAG_SKIP_STYLE;\n        continue;\n      }\n      const targetMedia = link.dataset.fxR487TargetMedia || 'all';"""
          assert needle2 in s
          p.write_text(s.replace(needle2,replacement2,1))
          PY
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r487.js
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r519-ab.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r519-ab.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r519-style-ab-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r519-style-ab-worker.log" || true
          exit 1

      - name: Screen each deferred stylesheet with fresh browsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r519-style-ab
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          const variants=[
            ['baseline',''],
            ['continuous','formatx-continuous-scroll.css'],
            ['seamless','formatx-seamless-loop.css'],
            ['platform','platform-status.css'],
            ['copy','formatx-copy-polish.css'],
            ['feedback','formatx-feedback.css'],
            ['language','single-language-toggle.css'],
            ['content','formatx-content-standard.css'],
            ['award','formatx-award-readiness.css']
          ];
          const countFor=name=>name==='baseline'?4:3;
          async function one(name,skip,i){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'});
            const p=await c.newPage();
            await p.addInitScript(()=>{
              window.__m={paint:[],lcp:[],shift:[],long:[]};
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.paint.push({n:e.name,t:e.startTime})}).observe({type:'paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.lcp.push(e.startTime)}).observe({type:'largest-contentful-paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__m.shift.push(e.value)}).observe({type:'layout-shift',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.long.push(e.duration)}).observe({type:'longtask',buffered:true})}catch{}
            });
            const cdp=await c.newCDPSession(p); await cdp.send('Performance.enable');
            const q=skip?`&diag_skip_style=${encodeURIComponent(skip)}`:'';
            const r=await p.goto(`https://formatxsuite.com:8787/?r519_style_ab=${name}-${i}-${Date.now()}${q}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(2800);
            const m=await p.evaluate(()=>({fcp:window.__m.paint.find(x=>x.n==='first-contentful-paint')?.t??null,lcp:window.__m.lcp.at(-1)??null,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),longtasks:window.__m.long,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,skipped:[...document.querySelectorAll('[data-fx-diag-skipped-style]')].map(x=>x.href)}));
            const pm=(await cdp.send('Performance.getMetrics')).metrics.reduce((o,x)=>(o[x.name]=x.value,o),{});
            const out={name,skip,run:i,status:r?.status()||0,...m,layoutMs:(pm.LayoutDuration||0)*1000,recalcStyleMs:(pm.RecalcStyleDuration||0)*1000,scriptMs:(pm.ScriptDuration||0)*1000,taskMs:(pm.TaskDuration||0)*1000};
            await c.close();await b.close();return out;
          }
          const median=a=>{const s=[...a].sort((x,y)=>x-y);return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2};
          (async()=>{
            const all=[];
            for(const [name,skip] of variants){for(let i=1;i<=countFor(name);i++)all.push(await one(name,skip,i));}
            const summary=[];
            for(const [name,skip] of variants){const x=all.filter(r=>r.name===name);summary.push({name,skip,n:x.length,medianTbt:median(x.map(r=>r.tbt)),maxTbt:Math.max(...x.map(r=>r.tbt)),medianLayout:median(x.map(r=>r.layoutMs)),medianRecalc:median(x.map(r=>r.recalcStyleMs)),medianTask:median(x.map(r=>r.taskMs)),medianFcp:median(x.map(r=>r.fcp||0)),medianLcp:median(x.map(r=>r.lcp||0)),maxCls:Math.max(...x.map(r=>r.cls)),maxOverflow:Math.max(...x.map(r=>r.overflow)),skipObserved:x.every(r=>name==='baseline'||r.skipped.some(u=>u.includes(skip)))});}
            console.log('STYLE_AB_ROWS',JSON.stringify(all,null,2));
            console.log('STYLE_AB_SUMMARY',JSON.stringify(summary,null,2));
            fs.writeFileSync('artifacts/r519-style-ab/rows.json',JSON.stringify(all,null,2));
            fs.writeFileSync('artifacts/r519-style-ab/summary.json',JSON.stringify(summary,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-r519-deferred-style-owner-ab
          path: artifacts/r519-style-ab/
          retention-days: 30
