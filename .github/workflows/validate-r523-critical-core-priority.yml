name: Validate R523 critical-core priority candidate
run-name: R523 critical-core priority candidate for ${{ github.sha }}

on:
  push:
    branches: [p0-r523-critical-core-priority-candidate]
    paths:
      - '.github/workflows/validate-r523-critical-core-priority.yml'

permissions:
  contents: write

concurrency:
  group: r523-critical-core-priority-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Generate evidence-backed R521 plus R523 owner fix
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r523/desktop artifacts/r523/mobile
          python3 <<'PY'
          from pathlib import Path
          root=Path('docs/scifi-ui/styles')
          def read(n): return (root/n).read_text(encoding='utf-8')
          def safe(n):
              s=read(n); low=s.lower(); assert '@charset' not in low and '@import' not in low, n; return s
          mobile=['formatx-mobile-reference-layout-v1.css','formatx-flow-first-r74.css','formatx-responsive-text-guard-r72.css','formatx-mobile-proof-controls-r204.css','formatx-mobile-layout-r207.css','formatx-native-orb-reference-r250.css']
          out=['/* R523 candidate: exact six-link mobile bootstrap cascade. */']
          for n in mobile: out.append(f'@media (max-width: 900px) {{\n/* BEGIN {n} */\n{safe(n)}\n/* END {n} */\n}}')
          (root/'formatx-mobile-critical-r523.css').write_text('\n'.join(out)+'\n',encoding='utf-8')
          first=read('formatx-mobile-first-paint-r358.css'); frame=safe('formatx-first-frame-stability-r283.css'); p0=read('formatx-p0-first-paint-r490.css')
          terminal='/* R523 candidate: exact terminal first-paint cascade. */\n'+f'@media (max-width: 900px), (pointer: coarse), (max-aspect-ratio: 27/25) {{\n{first}\n}}\n'+f'@media (prefers-reduced-motion: no-preference) and (min-width: 901px) and (pointer: fine) {{\n{frame}\n}}\n'+p0+'\n'
          (root/'formatx-terminal-first-paint-r523.css').write_text(terminal,encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js');s=p.read_text(encoding='utf-8')
          old='}else existingFlow?.remove();';new="}else if(existingFlow&&!existingFlow.hasAttribute('data-fx-mobile-critical-r523'))existingFlow.remove();"
          assert s.count(old)==1, s.count(old);p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('billing-worker/src/production-content-entry-r515.js');s=p.read_text(encoding='utf-8')
          old='''    if (!/\\sfetchpriority=/i.test(next)) {\n      next = next.replace(/\\s*\\/?>$/, close => ` fetchpriority="high"${close}`);\n    }'''
          assert s.count(old)==1, 'R515 unconditional fetchpriority block not found'
          p.write_text(s.replace(old,"    next = next.replace(/\\sfetchpriority=([\"'])(.*?)\\1/gi, '');",1),encoding='utf-8')
          PY

          cat > billing-worker/src/production-content-entry-r523.js <<'JS'
          import r516Production from './production-content-entry-r515.js';
          const HOSTS=new Set(['formatxsuite.com','www.formatxsuite.com']);
          const MOBILE=new Set(['/scifi-ui/styles/formatx-mobile-reference-layout-v1.css','/scifi-ui/styles/formatx-flow-first-r74.css','/scifi-ui/styles/formatx-responsive-text-guard-r72.css','/scifi-ui/styles/formatx-mobile-proof-controls-r204.css','/scifi-ui/styles/formatx-mobile-layout-r207.css','/scifi-ui/styles/formatx-native-orb-reference-r250.css']);
          const TERMINAL=new Set(['/scifi-ui/styles/formatx-mobile-first-paint-r358.css','/scifi-ui/styles/formatx-first-frame-stability-r283.css','/scifi-ui/styles/formatx-p0-first-paint-r490.css']);
          const MOBILE_LINK='<link rel="stylesheet" fetchpriority="high" media="(max-width: 900px)" data-fx-mobile-critical-r523="true" data-fx-mobile-reference-layout-style="true" data-fx-flow-first-r74="true" data-fx-responsive-text-guard="true" data-fx-mobile-proof-controls-r204="true" data-fx-mobile-layout-r207="true" data-fx-native-orb-reference-r250="true" href="/scifi-ui/styles/formatx-mobile-critical-r523.css?v=20260904-r523-owner">';
          const TERMINAL_LINK='<link rel="stylesheet" fetchpriority="high" data-fx-terminal-first-paint-r523="true" data-fx-mobile-first-paint-r358="true" data-fx-production-first-paint-r370="true" data-fx-first-frame-stability-r500="true" data-fx-p0-first-paint-r503="true" href="/scifi-ui/styles/formatx-terminal-first-paint-r523.css?v=20260904-r523-owner">';
          function pathOf(tag){const m=tag.match(/\bhref=(["'])(.*?)\1/i);if(!m)return'';try{return new URL(m[2],'https://formatxsuite.com/scifi-ui/').pathname}catch{return''}}
          function mediaOf(tag){return (tag.match(/\smedia=(["'])(.*?)\1/i)||[])[2]||'all'}
          function isMobileBootstrap(tag){const p=pathOf(tag);return MOBILE.has(p)&&mediaOf(tag).replace(/\s+/g,' ').trim()==='(max-width: 900px)'&&!/data-fx-deferred-media-r300/i.test(tag)}
          function replaceWhere(html,predicate,replacement,expected){const tags=String(html||'').match(/<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi)||[];const hits=tags.map((t,i)=>predicate(t)?i:-1).filter(i=>i>=0);if(hits.length!==expected||hits[hits.length-1]-hits[0]+1!==expected)return html;let inserted=false;return String(html||'').replace(/<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi,t=>{if(!predicate(t))return t;if(inserted)return'';inserted=true;return replacement})}
          function consolidate(html){let out=replaceWhere(String(html||''),isMobileBootstrap,MOBILE_LINK,6);out=replaceWhere(out,t=>TERMINAL.has(pathOf(t)),TERMINAL_LINK,3);return out}
          export default{async fetch(request,env,ctx){const response=await r516Production.fetch(request,env,ctx);const url=new URL(request.url);if(!['GET','HEAD'].includes(request.method)||!HOSTS.has(url.hostname))return response;const headers=new Headers(response.headers);headers.set('X-FormatX-First-Paint-Delivery','r523-critical-core-priority');if(request.method==='HEAD'){headers.delete('Content-Length');return new Response(null,{status:response.status,statusText:response.statusText,headers})}if(!(headers.get('Content-Type')||'').includes('text/html'))return new Response(response.body,{status:response.status,statusText:response.statusText,headers});const html=consolidate(await response.text());headers.delete('Content-Length');headers.delete('Content-Encoding');headers.delete('ETag');headers.set('Cache-Control','no-store, max-age=0');return new Response(html,{status:response.status,statusText:response.statusText,headers})}};
          JS
          python3 <<'PY'
          from pathlib import Path
          p=Path('billing-worker/wrangler.jsonc');s=p.read_text(encoding='utf-8');old='"main": "src/production-content-entry-r515.js"';assert old in s;p.write_text(s.replace(old,'"main": "src/production-content-entry-r523.js"',1),encoding='utf-8')
          PY
          node --input-type=module --check < billing-worker/src/production-content-entry-r515.js
          node --input-type=module --check < billing-worker/src/production-content-entry-r523.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          git diff --check

      - name: Install Worker and Lighthouse tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix billing-worker --no-audit --prefer-offline
          npm install --no-save --no-package-lock lighthouse@13.4.1 playwright-core@1.62.0 >/dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)";test -n "$chrome";echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV";"$chrome" --version
          node <<'NODE'
          const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r523-local.json',JSON.stringify(c,null,2)+'\n');
          NODE
      - name: Start exact R523 candidate Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r523-local.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r523-worker.log" 2>&1 &)
          for i in $(seq 1 60);do curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1&&exit 0;sleep 1;done
          cat "$RUNNER_TEMP/r523-worker.log";exit 1
      - name: Real browser geometry ownership and critical-core priority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' | tee artifacts/r523/browser-smoke.txt
          const assert=require('node:assert/strict');const{chromium}=require('playwright-core');
          async function one(b,name,viewport,mobile){const c=await b.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1,ignoreHTTPSErrors:true});const p=await c.newPage();await p.addInitScript(()=>{window.__cls=0;new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__cls+=e.value}).observe({type:'layout-shift',buffered:true})});const r=await p.goto('https://formatxsuite.com:8787/',{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r.status(),200);await p.waitForTimeout(2500);const s=await p.evaluate(()=>{const links=[...document.querySelectorAll('link[rel="stylesheet"]')],cc=document.querySelector('link[data-fx-critical-core-r227]');return{bundle:links.filter(x=>x.href.includes('formatx-mobile-critical-r523.css')).length,terminal:links.filter(x=>x.href.includes('formatx-terminal-first-paint-r523.css')).length,criticalMedia:cc?.media||'',criticalMatches:cc?.media?matchMedia(cc.media).matches:null,criticalFetchPriority:cc?.getAttribute('fetchpriority'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cls:window.__cls}});console.log(name,s);assert.equal(s.bundle,1);assert.equal(s.terminal,1);assert.equal(s.criticalFetchPriority,null);assert.ok(s.overflow<=2);assert.ok(s.cls<0.05);if(mobile)assert.equal(s.criticalMatches,false);else assert.equal(s.criticalMatches,true);await c.close()}
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--headless=new','--no-sandbox','--ignore-certificate-errors','--disable-dev-shm-usage']});await one(b,'desktop',{width:1350,height:940},false);await one(b,'mobile',{width:390,height:844},true);await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Five consecutive desktop and mobile Lighthouse runs
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3 4 5;do npx lighthouse@13.4.1 'https://formatxsuite.com:8787/' --preset=desktop --output=json --output-path="artifacts/r523/desktop/run-$i.json" --chrome-path="$CHROME_PATH" --chrome-flags='--headless=new --no-sandbox --ignore-certificate-errors --disable-dev-shm-usage' --only-categories=performance --quiet;done
          for i in 1 2 3 4 5;do npx lighthouse@13.4.1 'https://formatxsuite.com:8787/' --output=json --output-path="artifacts/r523/mobile/run-$i.json" --chrome-path="$CHROME_PATH" --chrome-flags='--headless=new --no-sandbox --ignore-certificate-errors --disable-dev-shm-usage' --only-categories=performance --quiet;done
      - name: Evaluate R523 performance owner
        shell: bash
        run: |
          node <<'NODE' | tee artifacts/r523/summary.txt
          const fs=require('node:fs');let fail=false;const out={};for(const lane of ['desktop','mobile']){out[lane]=[];for(let i=1;i<=5;i++){const l=JSON.parse(fs.readFileSync(`artifacts/r523/${lane}/run-${i}.json`));const a=l.audits,r={run:i,performance:Math.round(l.categories.performance.score*100),FCP:a['first-contentful-paint'].numericValue,LCP:a['largest-contentful-paint'].numericValue,SI:a['speed-index'].numericValue,TBT:a['total-blocking-time'].numericValue,CLS:a['cumulative-layout-shift'].numericValue,TTFB:a['server-response-time'].numericValue,criticalPriority:(a['network-requests'].details.items.find(x=>x.url.includes('formatx-critical-core-r227.css'))||{}).priority};out[lane].push(r);if(r.performance!==100||r.LCP>=2000||r.CLS>=0.05||r.TBT>150||r.TTFB>500)fail=true}}console.log(JSON.stringify(out,null,2));fs.writeFileSync('artifacts/r523/report.json',JSON.stringify({out,fail},null,2));if(fail)process.exit(1);
          NODE
      - name: Commit proven R523 source
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Games Tech';git config user.email 'hutoczky@users.noreply.github.com'
          git add billing-worker/src/production-content-entry-r515.js billing-worker/src/production-content-entry-r523.js billing-worker/wrangler.jsonc docs/scifi-ui/styles/formatx-mobile-critical-r523.css docs/scifi-ui/styles/formatx-terminal-first-paint-r523.css docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          git commit -m 'Fix critical-core mobile priority and first-paint ownership'
          git push origin HEAD:refs/heads/p0-r523-proven-candidate
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r523-critical-core-priority-${{ github.sha }}
          path: artifacts/r523/
          retention-days: 30
      - name: Show Worker log
        if: always()
        run: cat "$RUNNER_TEMP/r523-worker.log" || true
