name: Validate FormatX Event Horizon loader

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/styles/formatx-event-horizon.css'
      - '.github/workflows/validate-formatx-event-horizon.yml'

permissions:
  contents: write

concurrency:
  group: validate-formatx-event-horizon
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate source syntax and first-frame integration
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -F 'class="fx-intro-pending"' docs/scifi-ui/index.html
          grep -F 'id="formatx-event-horizon"' docs/scifi-ui/index.html
          grep -F 'formatx-event-horizon.css?v=20260726-event-horizon-1' docs/scifi-ui/index.html
          grep -F 'formatx-event-horizon.js?v=20260726-event-horizon-1' docs/scifi-ui/index.html
          grep -F 'data-fx-intro-progress' docs/scifi-ui/index.html
          grep -F 'fx-intro-failsafe' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -F '.fx-intro-overlay.is-exiting' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -F '@media (max-width: 720px)' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -F 'prefers-reduced-motion: reduce' docs/scifi-ui/styles/formatx-event-horizon.css
          grep -F "window.addEventListener('pageshow'" docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -F "window.addEventListener('load'" docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -F 'MAX_DURATION' docs/scifi-ui/scripts/formatx-event-horizon.js

      - name: Install isolated DOM runtime
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/formatx-jsdom" --no-audit --no-fund jsdom@26.1.0

      - name: Exercise desktop and mobile loading lifecycle
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-jsdom/node_modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { JSDOM, VirtualConsole } = require('jsdom');
          const script = fs.readFileSync('docs/scifi-ui/scripts/formatx-event-horizon.js', 'utf8');

          const markup = `<!doctype html>
          <html class="fx-intro-pending"><head></head><body>
            <div id="formatx-event-horizon" class="fx-intro-overlay" aria-hidden="true">
              <div class="fx-intro-curtain fx-intro-curtain--top"></div>
              <div class="fx-intro-curtain fx-intro-curtain--bottom"></div>
              <div class="fx-intro-center"><strong class="fx-intro-word"><span>FORMATX</span></strong></div>
              <div class="fx-intro-progress-wrap">
                <output data-fx-intro-output>000</output>
                <progress data-fx-intro-progress max="100" value="0">0%</progress>
                <span data-fx-intro-status>KAPCSOLAT FELÉPÍTÉSE</span>
              </div>
            </div>
            <main><section class="hero"><div class="hero-copy"></div><div class="core-engine"></div></section></main>
          </body></html>`;

          async function wait(ms) {
            await new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function verify(mode) {
            const mobile = mode === 'mobile';
            const runtimeErrors = [];
            const virtualConsole = new VirtualConsole();
            virtualConsole.on('error', (error) => runtimeErrors.push(String(error)));

            const dom = new JSDOM(markup, {
              runScripts: 'outside-only',
              pretendToBeVisual: true,
              url: 'https://formatxsuite.test/',
              virtualConsole,
              beforeParse(window) {
                window.matchMedia = (query) => ({
                  matches: query.includes('pointer: coarse') ? mobile : false,
                  media: query,
                  onchange: null,
                  addListener() {},
                  removeListener() {},
                  addEventListener() {},
                  removeEventListener() {},
                  dispatchEvent() { return false; },
                });
              },
            });

            dom.window.eval(script);
            dom.window.document.dispatchEvent(new dom.window.Event('DOMContentLoaded'));
            dom.window.dispatchEvent(new dom.window.Event('load'));

            const root = dom.window.document.documentElement;
            const overlay = dom.window.document.getElementById('formatx-event-horizon');
            const progress = overlay.querySelector('[data-fx-intro-progress]');

            await wait(180);
            if (!root.classList.contains('fx-intro-running')) {
              throw new Error(`${mode}: loading lifecycle did not start`);
            }
            if (overlay.hidden) throw new Error(`${mode}: overlay hid before the sequence`);
            if (Number(progress.value) <= 0) throw new Error(`${mode}: progress did not advance`);

            await wait(mobile ? 3000 : 3300);
            if (!overlay.hidden) throw new Error(`${mode}: overlay did not release the page`);
            if (!root.classList.contains('fx-intro-complete')) {
              throw new Error(`${mode}: completion state missing`);
            }
            if (root.classList.contains('fx-intro-running')) {
              throw new Error(`${mode}: scroll lock remained active`);
            }
            if (runtimeErrors.length) {
              throw new Error(`${mode}: runtime errors: ${runtimeErrors.join(' | ')}`);
            }

            dom.window.close();
          }

          (async () => {
            await verify('desktop');
            await verify('mobile');
            console.log('Desktop and mobile Event Horizon lifecycle: PASS');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Summary
        run: |
          {
            echo '## FormatX Event Horizon validation'
            echo
            echo '- First HTML frame overlay: PASS'
            echo '- JavaScript syntax: PASS'
            echo '- Desktop loading lifecycle: PASS'
            echo '- Mobile loading lifecycle: PASS'
            echo '- Progress animation: PASS'
            echo '- Automatic page release: PASS'
            echo '- Scroll-lock cleanup: PASS'
            echo '- Reduced-motion fallback: PRESENT'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist successful runtime validation
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin master
          mkdir -p .github/audit
          cat > .github/audit/event-horizon-status.json <<EOF
          {
            "status": "PASS",
            "sourceCommit": "${GITHUB_SHA}",
            "validatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "firstHtmlFrameOverlay": true,
            "javascriptSyntax": true,
            "desktopLifecycle": true,
            "mobileLifecycle": true,
            "progressAnimation": true,
            "automaticPageRelease": true,
            "scrollLockCleanup": true,
            "reducedMotionFallback": true
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/audit/event-horizon-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record successful Event Horizon runtime validation'
            git push origin HEAD:master
          fi
