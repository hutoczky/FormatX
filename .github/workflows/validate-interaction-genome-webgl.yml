name: Validate FormatX Interaction Genome WebGL

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/interaction-genome-webgl.js'
      - 'docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js'
      - 'docs/scifi-ui/styles/interaction-genome-webgl.css'
      - 'docs/scifi-ui/scripts/living-architecture.js'
      - '.github/scripts/validate-interaction-genome-webgl.cjs'
      - '.github/workflows/validate-interaction-genome-webgl.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-genome-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate WebGL Genome source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/interaction-genome-webgl.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          node --check docs/scifi-ui/scripts/living-architecture.js
          node --check .github/scripts/validate-interaction-genome-webgl.cjs
          grep -Fq "getContext('webgl2'" docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq "interaction-genome-webgl-adapter.js?v=20260728-genome-webgl-1" docs/scifi-ui/scripts/living-architecture.js
          grep -Fq "data-renderer=\"webgl2-pbr\"" docs/scifi-ui/styles/interaction-genome-webgl.css

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-genome-webgl" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-genome-webgl/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4181 --directory docs > "$RUNNER_TEMP/formatx-genome-webgl-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4181/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-genome-webgl-http.log"
          exit 1

      - name: Validate realistic WebGL2 genome rendering
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-genome-webgl/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-interaction-genome-webgl.cjs 2>&1 | tee interaction-genome-webgl-report.txt

      - name: Upload WebGL Genome report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-interaction-genome-webgl-report
          path: interaction-genome-webgl-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish validation status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='WebGL2 depth, PBR nodes, particles and responsive rendering passed'
          else
            state='failure'
            description='Interaction Genome WebGL validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX Interaction Genome WebGL' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
