name: r234 final Lighthouse polish

on:
  push:
    paths:
      - '.github/workflows/r234-final-lighthouse-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce desktop LCP candidate and fix footer tap targets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/styles/formatx-critical-first-paint-r232.css')
          s=p.read_text()
          old='font-size:clamp(62px,8vw,128px)!important'
          new='font-size:clamp(46px,4.4vw,62px)!important'
          if old not in s:
              raise SystemExit('desktop reduced title token not found')
          s=s.replace(old,new,1)
          extra='''\n/* r234 — final Lighthouse polish: keep reduced-mode title from becoming a late\n   desktop LCP candidate and make every footer link a proper touch target. */\n@media (prefers-reduced-motion:reduce){\n  footer.site-footer nav{display:flex!important;flex-wrap:wrap!important;align-items:center!important;gap:8px 12px!important}\n  footer.site-footer nav+nav{margin-top:10px!important}\n  footer.site-footer nav a{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:44px!important;min-height:44px!important;padding:8px 10px!important;margin:0!important;line-height:1.25!important;text-decoration:none}\n}\n@media (prefers-reduced-motion:reduce) and (min-width:901px){\n  #hero-title{max-width:650px!important}\n  #hero .hero-title-main{font-size:clamp(46px,4.4vw,62px)!important;line-height:.92!important;letter-spacing:-.045em!important}\n  #hero .hero-title-sub{font-size:clamp(20px,2.2vw,30px)!important;margin-top:7px!important}\n}\n'''
          if 'r234 — final Lighthouse polish' not in s:
              s += extra
          p.write_text(s)
          PY
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-critical-first-paint-r232.css
          git commit -m 'r234 fix reduced desktop LCP and mobile tap targets'
          git push
