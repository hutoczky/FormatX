name: One-shot publish visible MAG motion r147b
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r147b-visible-motion-cache-bust.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bust MAG runtime caches and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          bootstrap = Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          text = bootstrap.read_text()
          text = text.replace(
              '/scifi-ui/styles/formatx-live-motion-r147.css?v=20260815-r145-safe-live-optics-r147',
              '/scifi-ui/styles/formatx-live-motion-r147.css?v=20260815-visible-motion-safe-lane-r147b'
          )
          text = text.replace(
              '/scifi-ui/scripts/formatx-core-live-motion-r147.js?v=20260815-r145-safe-live-optics-r147',
              '/scifi-ui/scripts/formatx-core-live-motion-r147.js?v=20260815-visible-motion-safe-lane-r147b'
          )
          text = text.replace(
              '// r145 core preserved; r147 only adds non-destructive live optics and a mobile content safe lane.',
              '// r145 core preserved; r147b adds clearly visible live optics and a measured mobile safe lane.'
          )
          bootstrap.write_text(text)

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text()
          text = text.replace(
              './scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260815-narrow-proof-r145',
              './scripts/formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260815-visible-motion-safe-lane-r147b'
          )
          index.write_text(text)
          PY

          git rm .github/workflows/one-shot-r147b-visible-motion-cache-bust.yml
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html
          git commit -m '[deploy-production] fix(mag): visible r147b animation and clear content safe lane'
          git push
