name: Validate FormatX intro animation

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/scripts/site-art-direction.js'
      - 'docs/scifi-ui/styles/formatx-event-horizon.css'
      - 'docs/scifi-ui/styles/site-premium-finish.css'
      - 'docs/scifi-ui/styles/site-contrast-guard.css'
      - '.github/workflows/validate-intro-animation.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: validate-formatx-intro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-intro-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/formatx-intro-browser/node_modules/.bin/playwright" install --with-deps chromium firefox

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-intro-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-intro-http.log"
          exit 1

      - name: Test normal, skipped, reduced-motion and mobile flows
        id: browser_test
        continue-on-error: true
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-intro-browser/node_modules
        run: |
          set +e
          node <<'NODE' 2>&1 | tee intro-browser-validation.log
          const { chromium, firefox } = require('playwright');

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function waitForComplete(page, timeout) {
            await page.waitForFunction(() => {
              const overlay = document.getElementById('formatx-event-horizon');
              const root = document.documentElement;
              return root.classList.contains('fx-intro-complete')
                && !root.classList.contains('fx-intro-running')
                && (!overlay || overlay.hidden);
            }, null, { timeout });
          }

          async function runNormal(browserType, name) {
            const browser = await browserType.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 1440, height: 960 }, locale: 'hu-HU' });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(String(error)));
              const started = Date.now();
              await page.goto('http://127.0.0.1:4178/scifi-ui/index.html?lang=hu', { waitUntil: 'domcontentloaded' });
              await page.waitForSelector('.fx-intro-skip', { state: 'attached', timeout: 2000 });
              await waitForComplete(page, 6500);
              const elapsed = Date.now() - started;
              const state = await page.evaluate(() => ({
                overlayHidden: document.getElementById('formatx-event-horizon').hidden,
                rootComplete: document.documentElement.classList.contains('fx-intro-complete'),
                heroOpacity: Number(getComputedStyle(document.querySelector('.hero-copy')).opacity),
                engineOpacity: Number(getComputedStyle(document.querySelector('.core-engine')).opacity),
                overflow: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth,
              }));
              console.log(JSON.stringify({ case: name, elapsed, errors, state }));
              assert(errors.length === 0, `${name}: runtime errors ${errors.join(' | ')}`);
              assert(elapsed < 6200, `${name}: intro exceeded failsafe (${elapsed}ms)`);
              assert(state.overlayHidden && state.rootComplete, `${name}: intro did not finish cleanly`);
              assert(state.heroOpacity >= 0.99 && state.engineOpacity >= 0.99, `${name}: page content remained dimmed`);
              assert(state.overflow <= 1, `${name}: desktop overflow ${state.overflow}px`);
              await context.close();
            } finally {
              await browser.close();
            }
          }

          async function runSkip() {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 860 } });
              await page.goto('http://127.0.0.1:4178/scifi-ui/index.html', { waitUntil: 'domcontentloaded' });
              const skip = page.locator('.fx-intro-skip');
              await skip.waitFor({ state: 'attached', timeout: 2000 });
              await page.waitForFunction(() => {
                const button = document.querySelector('.fx-intro-skip');
                return button
                  && getComputedStyle(button).visibility === 'visible'
                  && Number(getComputedStyle(button).opacity) >= 0.5;
              }, null, { timeout: 2600 });
              const started = Date.now();
              await skip.click();
              await waitForComplete(page, 1800);
              const elapsed = Date.now() - started;
              console.log(JSON.stringify({ case: 'skip', elapsed }));
              assert(elapsed < 1700, 'skip: animation did not close quickly');
            } finally {
              await browser.close();
            }
          }

          async function runReducedMotion() {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 1180, height: 820 },
                reducedMotion: 'reduce',
              });
              const page = await context.newPage();
              const started = Date.now();
              await page.goto('http://127.0.0.1:4178/scifi-ui/index.html', { waitUntil: 'domcontentloaded' });
              await waitForComplete(page, 1600);
              const elapsed = Date.now() - started;
              console.log(JSON.stringify({ case: 'reduced-motion', elapsed }));
              assert(elapsed < 1500, 'reduced-motion: intro lasted too long');
              await context.close();
            } finally {
              await browser.close();
            }
          }

          async function runMobile() {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
              });
              const page = await context.newPage();
              await page.goto('http://127.0.0.1:4178/scifi-ui/index.html', { waitUntil: 'domcontentloaded' });
              await waitForComplete(page, 6500);
              const overflow = await page.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth);
              console.log(JSON.stringify({ case: 'mobile', overflow }));
              assert(overflow <= 1, `mobile: horizontal overflow ${overflow}px`);
              await context.close();
            } finally {
              await browser.close();
            }
          }

          (async () => {
            await runNormal(chromium, 'chromium');
            await runNormal(firefox, 'firefox');
            await runSkip();
            await runReducedMotion();
            await runMobile();
          })().catch(error => {
            console.error(error && error.stack ? error.stack : error);
            process.exit(1);
          });
          NODE
          browser_status=${PIPESTATUS[0]}
          echo "exit_code=$browser_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-intro-browser-diagnostics
          path: intro-browser-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce browser validation
        if: steps.browser_test.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Intro browser validation failed with exit code ${{ steps.browser_test.outputs.exit_code }}" >&2
          exit 1

      - name: Publish browser validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Chromium, Firefox, skip, reduced motion and mobile intro tests passed'
          else
            state='failure'
            description='Cross-browser intro animation validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX intro browser validation' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
