name: Finalize R517 audit parity and R519 legacy MAG candidates
run-name: Exact R516 diagnostic candidate finalization

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/finalize-r517-r519-candidates.yml'

permissions:
  contents: write

jobs:
  audit-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
      CANDIDATE_BRANCH: p0-r517-candidate
    steps:
      - name: Checkout exact R516 base
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch only proven active audit-specific runtime branches
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-final
          python3 <<'PY'
          from pathlib import Path
          def remove_block(path, marker):
              p=Path(path); lines=p.read_text(encoding='utf-8').splitlines(True)
              idx=next((i for i,l in enumerate(lines) if marker in l),None)
              if idx is None: raise SystemExit(f'marker missing in {path}: {marker}')
              if 'const AUDIT_MODE' in lines[idx]:
                  del lines[idx]
                  while idx < len(lines) and not lines[idx].strip(): del lines[idx]
                  if idx>=len(lines) or 'if (AUDIT_MODE)' not in lines[idx]: raise SystemExit(f'AUDIT_MODE block missing in {path}')
              depth=0; started=False; end=idx
              for j in range(idx,len(lines)):
                  depth += lines[j].count('{') - lines[j].count('}')
                  if '{' in lines[j]: started=True
                  end=j
                  if started and depth<=0: break
              if not started: raise SystemExit(f'block start missing in {path}')
              del lines[idx:end+1]
              if idx < len(lines) and not lines[idx].strip(): del lines[idx]
              p.write_text(''.join(lines),encoding='utf-8')
          remove_block('docs/scifi-ui/scripts/living-architecture.js', "const AUDIT_MODE = new URLSearchParams(location.search).get('lighthouse')")
          remove_block('docs/scifi-ui/scripts/formatx-apex.js', "const AUDIT_MODE = new URLSearchParams(location.search).get('lighthouse')")
          remove_block('docs/scifi-ui/scripts/formatx-core-real3d-v20.js', "if (new URLSearchParams(location.search).get('lighthouse') === '1')")
          p=Path('docs/scifi-ui/scripts/formatx-core-mobile-v55.js'); lines=p.read_text(encoding='utf-8').splitlines(True)
          idx=next((i for i,l in enumerate(lines) if "get('lighthouse') === '1'" in l and 'audit-skip' in l),None)
          if idx is None: raise SystemExit('mobile audit bypass line missing')
          del lines[idx]; p.write_text(''.join(lines),encoding='utf-8')
          p=Path('docs/scifi-ui/scripts/formatx-premium-finish.js'); lines=p.read_text(encoding='utf-8').splitlines(True)
          found={'decl':False,'renderer':False,'fallback':False}; out=[]
          for l in lines:
              if "const auditMode = parameters.get('lighthouse') === '1'" in l: found['decl']=True; continue
              if "if (auditMode) return 'audit-skip'" in l: found['renderer']=True; continue
              if 'if (auditMode || resilientCore) return resilientCore;' in l:
                  found['fallback']=True; out.append(l.replace('if (auditMode || resilientCore)','if (resilientCore)')); continue
              out.append(l)
          if not all(found.values()): raise SystemExit(f'premium patch incomplete {found}')
          p.write_text(''.join(out),encoding='utf-8')
          targets=['docs/scifi-ui/scripts/living-architecture.js','docs/scifi-ui/scripts/formatx-apex.js','docs/scifi-ui/scripts/formatx-premium-finish.js','docs/scifi-ui/scripts/formatx-core-real3d-v20.js','docs/scifi-ui/scripts/formatx-core-mobile-v55.js']
          for f in targets:
              s=Path(f).read_text(encoding='utf-8')
              if "get('lighthouse')" in s or 'audit-skip' in s or 'fx-audit-mode' in s: raise SystemExit(f'active audit-specific behavior remains in {f}')
          print('R517_SOURCE_PATCH_PASS')
          PY
          for f in docs/scifi-ui/scripts/living-architecture.js docs/scifi-ui/scripts/formatx-apex.js docs/scifi-ui/scripts/formatx-premium-finish.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/scripts/formatx-core-mobile-v55.js; do node --check "$f"; done
          git diff --check
          git diff -- docs/scifi-ui/scripts > artifacts/r517-final/source.diff
      - name: Install lightweight runner Chrome driver
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.62.0
          command -v google-chrome
          google-chrome --version
      - name: Start patched candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4177 --directory docs > /tmp/r517-final-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4177/scifi-ui/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r517-final-http.log; exit 1
      - name: Real Chrome normal-vs-lighthouse-query semantic parity
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' | tee artifacts/r517-final/browser-parity.json
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const cp=require('node:child_process');
          const chrome=cp.execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
          const noAudit=s=>Object.entries(s).filter(([,v])=>String(v).includes('audit-skip'));
          async function realClick(page, locator, label, minW=16, minH=16){
            await locator.waitFor({state:'visible',timeout:30000});
            await locator.scrollIntoViewIfNeeded();
            await page.waitForTimeout(120);
            const box=await locator.boundingBox();
            assert.ok(box&&box.width>=minW&&box.height>=minH,`${label}: invalid box ${JSON.stringify(box)}`);
            const owns=await locator.evaluate(el=>{const r=el.getBoundingClientRect();const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return Boolean(hit&&(hit===el||el.contains(hit)));});
            assert.equal(owns,true,`${label}: center point not owned by control`);
            await page.mouse.click(box.x+box.width/2,box.y+box.height/2);
            return box;
          }
          async function verify(browser,name,query,viewport,mobile){
            const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1,locale:'hu-HU',colorScheme:'dark',reducedMotion:'no-preference'});
            const page=await context.newPage(); const pageErrors=[]; const failed=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
            await page.goto(`http://127.0.0.1:4177/scifi-ui/${query}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1000);
            const pre=await page.evaluate(()=>({dataset:{...document.documentElement.dataset},auditClass:document.documentElement.classList.contains('fx-audit-mode'),hero:Boolean(document.querySelector('#hero')),lead:(document.querySelector('#hero .hero-lead')?.textContent||'').trim().length}));
            assert.equal(pre.auditClass,false,`${name}: fx-audit-mode`); assert.equal(noAudit(pre.dataset).length,0,`${name}: pre audit state`); assert.ok(pre.hero&&pre.lead>40,`${name}: hero`);
            const target=page.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();
            await realClick(page,target,`${name}: activation`);
            await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready'&&document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length===1,null,{timeout:45000});
            const pause=page.locator('#hero .fx-reference-pause').first();
            await realClick(page,pause,`${name}: PAUSE`,16,16); await page.waitForFunction(()=>document.querySelector('#hero .fx-reference-pause')?.dataset.paused==='true',null,{timeout:5000});
            const paused=await page.evaluate(()=>({flag:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||'',dataset:{...document.documentElement.dataset}}));
            assert.equal(paused.flag,'true'); assert.equal(noAudit(paused.dataset).length,0,`${name}: pause audit state`);
            await realClick(page,pause,`${name}: RESUME`,16,16); await page.waitForFunction(()=>document.querySelector('#hero .fx-reference-pause')?.dataset.paused!=='true',null,{timeout:5000});
            const ask=page.locator('#hero .fx-reference-ask').first(); const askBox=await realClick(page,ask,`${name}: ASK`,44,44); await page.waitForTimeout(200);
            const post=await page.evaluate(()=>{const r=document.documentElement;return{dataset:{...r.dataset},renderer:r.dataset.fxCoreRenderer||'',crystal:r.dataset.fxCrystalOrganismR326||'',sync:r.dataset.fxMagShapeSyncR476||'',scheduler:r.dataset.fxCoreScheduler||'',idle:r.dataset.fxCoreIdleRenderR441||'',pause:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||'',canvasCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            assert.equal(noAudit(post.dataset).length,0,`${name}: post audit state`); assert.equal(post.renderer,'single-webgl-crystal-organism-r326'); assert.equal(post.crystal,'ready'); assert.match(post.sync,/^ready-r\d+$/); assert.equal(post.scheduler,'interaction-bursts-idle-zero-frame-r441'); assert.equal(post.idle,'zero-frame'); assert.notEqual(post.pause,'true'); assert.equal(post.canvasCount,1); assert.ok(post.overflow<=2); assert.equal(pageErrors.length,0,pageErrors.join(' | ')); assert.equal(failed.length,0,failed.join(' | '));
            const result={name,query,viewport,mobile,pre:{auditClass:pre.auditClass,hero:pre.hero,lead:pre.lead},post:{renderer:post.renderer,crystal:post.crystal,sync:post.sync,scheduler:post.scheduler,idle:post.idle,pause:post.pause,canvasCount:post.canvasCount,overflow:post.overflow},ask:{width:askBox.width,height:askBox.height}};
            await context.close(); return result;
          }
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});const results=[];results.push(await verify(browser,'desktop-normal','?candidate=normal',{width:1440,height:900},false));results.push(await verify(browser,'desktop-lighthouse-query','?lighthouse=1',{width:1440,height:900},false));results.push(await verify(browser,'mobile-normal','?candidate=mobile',{width:390,height:844},true));results.push(await verify(browser,'mobile-lighthouse-query','?lighthouse=1',{width:390,height:844},true));await browser.close();const sem=x=>x.post;assert.deepEqual(sem(results[0]),sem(results[1]),'desktop semantic mismatch');assert.deepEqual(sem(results[2]),sem(results[3]),'mobile semantic mismatch');console.log(JSON.stringify({pass:true,results},null,2));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit proven R517 source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/living-architecture.js docs/scifi-ui/scripts/formatx-apex.js docs/scifi-ui/scripts/formatx-premium-finish.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          git commit -m 'Remove active audit-specific runtime bypasses'
          git rev-parse HEAD | tee artifacts/r517-final/sha.txt
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r517-final-${{ github.sha }}
          path: artifacts/r517-final
          include-hidden-files: true
          retention-days: 30

  r482-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
      CANDIDATE_BRANCH: p0-r519-r482-candidate
      ORIGIN: https://formatxsuite.com
    steps:
      - name: Checkout exact R516 base
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install lightweight runner Chrome driver
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.62.0
          command -v google-chrome
      - name: Confirm exact R516 production marker
        run: |
          curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?r519final=$GITHUB_RUN_ID" -o /tmp/marker.txt
          cmp -s docs/p0-validation-version.txt /tmp/marker.txt
      - name: Generate current-semantic legacy R482 verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/workflows/verify-r481-live-mag.yml <<'YAML'
          name: Verify current semantic live MAG (legacy R482 gate)
          run-name: Current semantic mobile + desktop MAG verification for ${{ github.sha }}
          on:
            push:
              branches: [master]
              paths:
                - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
                - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
                - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
                - '.github/workflows/verify-r481-live-mag.yml'
                - 'docs/p0-validation-version.txt'
            workflow_dispatch:
          permissions:
            contents: read
            statuses: write
          jobs:
            live-r482-mag:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v5
                - name: Wait for exact deployed P0 marker
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    for attempt in $(seq 1 90); do if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://formatxsuite.com/p0-validation-version.txt?r482_wait=${GITHUB_RUN_ID}_${attempt}" -o "$RUNNER_TEMP/live-p0.txt" && cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then exit 0; fi; sleep 10; done; exit 1
                - name: Install lightweight runner Chrome driver
                  run: |
                    npm install --no-save --ignore-scripts playwright-core@1.62.0
                    command -v google-chrome
                - name: Verify current live MAG semantic invariants with real interactions
                  shell: bash
                  run: |
                    node <<'NODE'
                    const assert=require('node:assert/strict'); const {chromium}=require('playwright-core'); const cp=require('node:child_process'); const chrome=cp.execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
                    async function click(page,loc,label,minW=16,minH=16){await loc.waitFor({state:'visible',timeout:30000});await loc.scrollIntoViewIfNeeded();await page.waitForTimeout(100);const b=await loc.boundingBox();assert.ok(b&&b.width>=minW&&b.height>=minH,`${label} box`);const owns=await loc.evaluate(el=>{const r=el.getBoundingClientRect();const h=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return Boolean(h&&(h===el||el.contains(h)))});assert.ok(owns,`${label} hit`);await page.mouse.click(b.x+b.width/2,b.y+b.height/2);return b;}
                    async function verify(browser,name,viewport,mobile){const c=await browser.newContext({viewport,deviceScaleFactor:mobile?2:1,isMobile:mobile,hasTouch:mobile,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});const p=await c.newPage();const errors=[];const failed=[];p.on('pageerror',e=>errors.push(String(e)));p.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));await p.goto(`https://formatxsuite.com/?verify=current-semantic-mag-${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});const target=p.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();await click(p,target,'activate');await p.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready'&&document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length===1,null,{timeout:45000});
                    async function state(){return p.evaluate(()=>{const root=document.documentElement;const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');const s=canvas?getComputedStyle(canvas):null;const r=canvas?.getBoundingClientRect();const header=document.querySelector('.topbar .fx-reference-mag-button');const hs=header?getComputedStyle(header):null;const hr=header?.getBoundingClientRect();const link=document.querySelector('link[data-fx-mag-living-balance-r481]');return{renderer:root.dataset.fxCoreRenderer||'',sync:root.dataset.fxMagShapeSyncR476||'',lifeContract:root.dataset.fxPrimaryMagLifeContractR482||'',optics:root.dataset.fxPrimaryMagOpticsR482||'',scheduler:root.dataset.fxCoreScheduler||'',idle:root.dataset.fxCoreIdleRenderR441||'',balanceHref:link?.href||'',rect:r?{w:r.width,h:r.height}:null,display:s?.display||'',visibility:s?.visibility||'',opacity:Number(s?.opacity||0),animations:canvas?.getAnimations().map(a=>({name:a.animationName,currentTime:typeof a.currentTime==='number'?a.currentTime:null,playState:a.playState,pending:a.pending}))||[],headerVisible:Boolean(header&&hs&&hr&&hs.display!=='none'&&hs.visibility!=='hidden'&&Number(hs.opacity)>.2&&hr.width>=40&&hr.height>=40),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,pause:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||''};});}
                    await p.waitForTimeout(700);const initial=await state();assert.equal(initial.renderer,'single-webgl-crystal-organism-r326');assert.match(initial.sync,/^ready-r\d+$/);assert.equal(initial.lifeContract,'large-mini-header-spectrum-breath-zero-webgl-idle');assert.equal(initial.optics,'restrained-soft-spectrum-mobile-edge');assert.equal(initial.scheduler,'interaction-bursts-idle-zero-frame-r441');assert.equal(initial.idle,'zero-frame');assert.ok(new URL(initial.balanceHref).pathname.endsWith('/scifi-ui/styles/formatx-mag-living-balance-r481.css'));assert.ok(initial.rect&&initial.rect.w>120&&initial.rect.h>180);assert.notEqual(initial.display,'none');assert.notEqual(initial.visibility,'hidden');assert.ok(initial.opacity>.2);assert.ok(initial.headerVisible);assert.ok(initial.overflow<=2);
                    const samples=[];for(let i=0;i<4;i++){samples.push(await state());await p.waitForTimeout(420)}const times=samples.flatMap(x=>x.animations.map(a=>a.currentTime)).filter(Number.isFinite);const timeSpan=times.length?Math.max(...times)-Math.min(...times):0;assert.ok(timeSpan>50);const pause=p.locator('#hero .fx-reference-pause').first();await click(p,pause,'PAUSE');await p.waitForTimeout(250);const p1=await state();await p.waitForTimeout(650);const p2=await state();assert.equal(p2.pause,'true');const pa=p1.animations.find(a=>Number.isFinite(a.currentTime));const pb=p2.animations.find(a=>a.name===pa?.name&&Number.isFinite(a.currentTime));if(pa&&pb)assert.ok(Math.abs(pb.currentTime-pa.currentTime)<80);await click(p,pause,'RESUME');await p.waitForTimeout(250);const r1=await state();await p.waitForTimeout(500);const r2=await state();assert.notEqual(r2.pause,'true');const ra=r1.animations.find(a=>Number.isFinite(a.currentTime));const rb=r2.animations.find(a=>a.name===ra?.name&&Number.isFinite(a.currentTime));if(ra&&rb)assert.ok(rb.currentTime-ra.currentTime>16);const ask=p.locator('#hero .fx-reference-ask').first();const ab=await click(p,ask,'ASK',44,44);assert.equal(errors.length,0,errors.join(' | '));assert.equal(failed.length,0,failed.join(' | '));console.log(`PASS ${name}`,JSON.stringify({renderer:initial.renderer,sync:initial.sync,timeSpan,ask:{w:ab.width,h:ab.height}}));await c.close();}
                    (async()=>{const b=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await verify(b,'mobile-390x844',{width:390,height:844},true);await verify(b,'desktop-1440x900',{width:1440,height:900},false);await b.close();console.log('CURRENT_SEMANTIC_R482_PASS');})().catch(e=>{console.error(e);process.exit(1)});
                    NODE
          YAML
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/verify-r481-live-mag.yml')"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/verify-r481-live-mag.yml').read_text()
          assert "ready-r482'" not in s
          assert 'r482-spectrum-soft-edge/' not in s
          assert 'scrollIntoViewIfNeeded' in s and '#hero .fx-reference-pause' in s and '#hero .fx-reference-ask' in s
          print('R519_SEMANTIC_WORKFLOW_STATIC_PASS')
          PY
      - name: Execute exact intended verifier against real R516 production
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          s=Path('.github/workflows/verify-r481-live-mag.yml').read_text()
          m=re.findall(r"node <<'NODE'\n(.*?)\n\s*NODE",s,re.S)
          assert len(m)==1, len(m)
          Path('.r519-verifier.cjs').write_text(textwrap.dedent(m[0])+'\n',encoding='utf-8')
          PY
          node .r519-verifier.cjs | tee /tmp/r519-final.log
          grep -Fq 'CURRENT_SEMANTIC_R482_PASS' /tmp/r519-final.log
          rm -f .r519-verifier.cjs
      - name: Commit proven R519 validator candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add .github/workflows/verify-r481-live-mag.yml
          git commit -m 'Modernize R482 legacy gate to current semantic MAG'
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
