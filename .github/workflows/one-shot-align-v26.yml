name: One-shot align production validation with Organism loader v26

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-align-v26.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-align-v26
  cancel-in-progress: false

jobs:
  align:
    if: contains(github.event.head_commit.message, '[align-v26]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align stale validation contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/scripts/production-preflight.cjs'),
              Path('.github/scripts/validate-webgpu-source.py'),
              Path('.github/workflows/validate-organism-dialogue.yml'),
              Path('.github/workflows/validate-mobile-intro-recovery.yml'),
              Path('.github/workflows/deploy-formatx-custom-domain.yml'),
          ]
          replacements = {
              'safe-ready-v25': 'safe-ready-v26',
              'safe-degraded-v25': 'safe-degraded-v26',
              'organism-loader-v25': 'organism-loader-v26',
              'v25 disclosure-safe contract': 'v26 disclosure-safe contract',
              'loader version is v25': 'loader version is v26',
              'v25 loader or disclosure module missing': 'v26 loader or disclosure module missing',
              'organism-voice-dock.css?v=20260730-organism-dock-2': 'organism-voice-dock.css?v=20260731-organism-dock-3',
              'loader includes dock v2': 'loader includes dock v3',
          }
          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No stale v25 validation contracts were found')
          print('Updated:')
          print('\n'.join(changed))
          PY

      - name: Validate aligned candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-webgpu-source.py
          python3 .github/scripts/validate-content-standard-v2.py
          python3 .github/scripts/validate-public-release-integration.py
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-pricing-qr.cjs
          node .github/scripts/validate-user-requested-site-features.cjs
          node --check docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'safe-ready-v26' docs/scifi-ui/scripts/igloo-parity.js
          ! grep -R -Fq 'safe-ready-v25' .github/scripts .github/workflows
          ! grep -R -Fq 'organism-dock-2' .github/scripts .github/workflows

      - name: Commit aligned validation and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-align-v26.yml
          git config user.name 'FormatX production automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scripts/production-preflight.cjs \
                  .github/scripts/validate-webgpu-source.py \
                  .github/workflows/validate-organism-dialogue.yml \
                  .github/workflows/validate-mobile-intro-recovery.yml \
                  .github/workflows/deploy-formatx-custom-domain.yml
          git commit -m '[deploy-production] Align validation with the current v26 Organism loader'
          git push origin HEAD:master
