name: Verify R476 synchronized Mini MAG
run-name: R476 Mini MAG shape-sync verification for ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
      - 'docs/scifi-ui/styles/formatx-mini-mag-assistant-r459.css'
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - 'docs/scifi-ui/styles/formatx-mag-visual-sync-r476.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - '.github/workflows/verify-r459-live-mini-mag.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r476-mini-mag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-r476-mini-mag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate synchronized Mini MAG source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINI='docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
          MINI_CSS='docs/scifi-ui/styles/formatx-mini-mag-assistant-r459.css'
          SYNC='docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
          SYNC_CSS='docs/scifi-ui/styles/formatx-mag-visual-sync-r476.css'
          CURRENT='docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
          MOTION='docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'

          node --check "$MINI"
          node --check "$SYNC"
          node --check "$MOTION"

          grep -Fq "fxMiniMagPrimaryHeroR459='preserved-native-webgl'" "$MINI"
          grep -Fq 'window.FormatXMiniMagR459' "$MINI"
          grep -Fq "const SECTION_IDS=['hero','experience','capabilities','pricing','system','resources']" "$MINI"
          grep -Fq '.fx-mini-mag-assistant-r459' "$MINI_CSS"
          grep -Fq 'position: fixed' "$MINI_CSS"

          grep -Fq "attributeFilter:['data-fx-core-shape-r337']" "$SYNC"
          grep -Fq 'fxMiniMagShapeSyncR476' "$SYNC"
          grep -Fq '.fx-mini-mag-launcher-r459' "$SYNC"
          grep -Fq '.fx-mini-mag-glyph-r459' "$SYNC"
          grep -Fq 'formatx:coreshapechange' "$SYNC"
          grep -Fq 'formatx:minimagready' "$SYNC"
          grep -Fq 'r477-refined-phone-highlight-edge-softening' "$SYNC"

          grep -Fq 'data-fx-core-shape="sphere"' "$SYNC_CSS"
          grep -Fq 'brightness(.88) contrast(.68) saturate(.91) blur(1.85px)' "$SYNC_CSS"
          grep -Fq 'production-r476-shape-synchronised-mini-mag-header-icon-soft-phone-optics' "$SYNC_CSS"
          grep -Fq 'production-r477-refined-phone-highlight-and-edge-softening' "$SYNC_CSS"

          grep -Fq "const VERSION='direct-r326-r468-soft-optics-live-energy-zero-idle'" "$CURRENT"
          grep -Fq 'formatx-mini-mag-assistant-r459.js?v=20260830-r460-hero-controller-bridge' "$CURRENT"
          grep -Fq 'formatx-core-life-r455.css?v=20260831-r471-softer-mobile-bloom-feather' "$CURRENT"
          grep -Fq 'formatx-current-mag-loader-r422.js?v=20260831-r471-softer-mobile-mag' "$MOTION"
          grep -Fq 'formatx-mag-shape-sync-r476.js?v=20260831-r476-shape-sync-soft-phone-optics' "$MOTION"

          echo 'PASS: R476 keeps one R326 primary renderer, synchronizes Mini MAG/header state, and enforces the refined R477 softer mobile optic contract.'

      - name: Verify production serves R476 when deploying
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://formatxsuite.com'
          for attempt in $(seq 1 36); do
            echo "R476 live verification attempt $attempt/36"
            tmp="$(mktemp -d)"
            sync_code="$(curl -sS --max-time 30 -o "$tmp/sync.js" -w '%{http_code}' "$origin/scifi-ui/scripts/formatx-mag-shape-sync-r476.js?r476=${GITHUB_RUN_ID}_${attempt}" || true)"
            css_code="$(curl -sS --max-time 30 -o "$tmp/sync.css" -w '%{http_code}' "$origin/scifi-ui/styles/formatx-mag-visual-sync-r476.css?r476=${GITHUB_RUN_ID}_${attempt}" || true)"
            motion_code="$(curl -sS --max-time 30 -o "$tmp/motion.js" -w '%{http_code}' "$origin/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js?r476=${GITHUB_RUN_ID}_${attempt}" || true)"
            if [[ "$sync_code" == 200 && "$css_code" == 200 && "$motion_code" == 200 ]] \
              && grep -Fq 'fxMiniMagShapeSyncR476' "$tmp/sync.js" \
              && grep -Fq 'r477-refined-phone-highlight-edge-softening' "$tmp/sync.js" \
              && grep -Fq 'brightness(.88) contrast(.68) saturate(.91) blur(1.85px)' "$tmp/sync.css" \
              && grep -Fq 'formatx-mag-shape-sync-r476.js?v=20260831-r476-shape-sync-soft-phone-optics' "$tmp/motion.js"; then
              echo 'PASS: production serves R476 synchronized Mini MAG with refined R477 softer phone optics.'
              rm -rf "$tmp"
              exit 0
            fi
            echo "codes: sync-js=$sync_code sync-css=$css_code motion=$motion_code"
            rm -rf "$tmp"
            sleep 10
          done
          echo 'Production did not converge to R476/R477 within the verification window.' >&2
          exit 1

      - name: Publish R476 Mini MAG status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='R476 Mini MAG sync + R477 mobile optics passed'
          else
            state=failure
            description='R476/R477 Mini MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R476 Mini MAG sync' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
