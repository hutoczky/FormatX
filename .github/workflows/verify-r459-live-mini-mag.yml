name: Verify R479 synchronized living MAG
run-name: R479 MAG colour/softness + living-state verification for ${{ github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
      - 'docs/scifi-ui/styles/formatx-mini-mag-assistant-r459.css'
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - 'docs/scifi-ui/styles/formatx-mag-visual-sync-r476.css'
      - 'docs/scifi-ui/data/r479-primary-mag-optics.json'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - '.github/workflows/verify-r459-live-mini-mag.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r479-living-mag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-r479-living-mag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate R479 living MAG source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          MINI='docs/scifi-ui/scripts/formatx-mini-mag-assistant-r459.js'
          MINI_CSS='docs/scifi-ui/styles/formatx-mini-mag-assistant-r459.css'
          SYNC='docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
          SYNC_CSS='docs/scifi-ui/styles/formatx-mag-visual-sync-r476.css'
          MARKER='docs/scifi-ui/data/r479-primary-mag-optics.json'
          CURRENT='docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
          MOTION='docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'

          node --check "$MINI"
          node --check "$SYNC"
          node --check "$MOTION"
          python3 -m json.tool "$MARKER" >/dev/null

          grep -Fq "fxMiniMagPrimaryHeroR459='preserved-native-webgl'" "$MINI"
          grep -Fq 'window.FormatXMiniMagR459' "$MINI"
          grep -Fq "const SECTION_IDS=['hero','experience','capabilities','pricing','system','resources']" "$MINI"
          grep -Fq '.fx-mini-mag-assistant-r459' "$MINI_CSS"
          grep -Fq 'position: fixed' "$MINI_CSS"

          grep -Fq 'data-fx-core-energy-bolt-r455' "$SYNC"
          grep -Fq 'formatx:coreinteraction' "$SYNC"
          grep -Fq 'fxMiniMagLifeContractR479' "$SYNC"
          grep -Fq 'primary-and-mini-compositor-breath-colour-depth-zero-js-idle' "$SYNC"
          grep -Fq 'r479-colour-depth-soft-living-primary' "$SYNC"
          grep -Fq '.fx-mini-mag-launcher-r459' "$SYNC"
          grep -Fq '.fx-mini-mag-glyph-r459' "$SYNC"
          grep -Fq 'formatx:coreshapechange' "$SYNC"
          grep -Fq 'formatx:minimagready' "$SYNC"

          grep -Fq 'data-fx-core-shape="sphere"' "$SYNC_CSS"
          grep -Fq 'brightness(.72)' "$SYNC_CSS"
          grep -Fq 'contrast(.76)' "$SYNC_CSS"
          grep -Fq 'saturate(1.38)' "$SYNC_CSS"
          grep -Fq 'blur(1.15px)' "$SYNC_CSS"
          grep -Fq 'drop-shadow(0 0 9px rgba(46,218,255,.18))' "$SYNC_CSS"
          grep -Fq 'drop-shadow(0 0 22px rgba(91,71,255,.10))' "$SYNC_CSS"
          grep -Fq 'fx-primary-mag-live-breath-r479' "$SYNC_CSS"
          grep -Fq 'fx-mini-mag-live-breath-r479' "$SYNC_CSS"
          grep -Fq 'data-fx-mag-life="pulse"' "$SYNC_CSS"
          grep -Fq 'production-r479-colour-depth-soft-alpha-edge-living-primary-mag' "$SYNC_CSS"

          grep -Fq '"revision": "R479"' "$MARKER"
          grep -Fq 'lower-centre-luminance-cobalt-cyan-violet-soft-alpha-edge' "$MARKER"
          grep -Fq 'compositor-opacity-scale-breath-zero-js-idle' "$MARKER"

          grep -Fq "const VERSION='direct-r326-r468-soft-optics-live-energy-zero-idle'" "$CURRENT"
          grep -Fq 'formatx-mini-mag-assistant-r459.js?v=20260830-r460-hero-controller-bridge' "$CURRENT"
          grep -Fq 'formatx-core-life-r455.css?v=20260831-r474-softer-mobile-glow' "$CURRENT"
          grep -Fq 'formatx-current-mag-loader-r422.js?v=20260831-r484-periodic-native-energy' "$MOTION"
          grep -Fq 'formatx-mag-shape-sync-r476.js?v=20260831-r484-readable-electric-surface' "$MOTION"

          if grep -Eq 'requestAnimationFrame\([^)]*sync|function[[:space:]]+frame|setInterval' "$SYNC"; then
            echo 'R479 MAG sync must not add an idle JavaScript render loop.' >&2
            exit 1
          fi

          if grep -Eq 'animation:[^;]*(filter|brightness|contrast|saturate)' "$SYNC_CSS"; then
            echo 'R479 primary MAG breath must remain compositor-only; animated filters are forbidden.' >&2
            exit 1
          fi

          echo 'PASS: R479 richer colour depth, lower centre luminance, alpha-aware soft edge and compositor-only primary/Mini MAG life are source-valid.'

      - name: Verify production serves R479 when deploying
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
        shell: bash
        run: |
          set -Eeuo pipefail
          origin='https://formatxsuite.com'
          for attempt in $(seq 1 36); do
            echo "R479 live verification attempt $attempt/36"
            tmp="$(mktemp -d)"
            sync_code="$(curl -sS --max-time 30 -o "$tmp/sync.js" -w '%{http_code}' "$origin/scifi-ui/scripts/formatx-mag-shape-sync-r476.js?r479=${GITHUB_RUN_ID}_${attempt}" || true)"
            css_code="$(curl -sS --max-time 30 -o "$tmp/sync.css" -w '%{http_code}' "$origin/scifi-ui/styles/formatx-mag-visual-sync-r476.css?r479=${GITHUB_RUN_ID}_${attempt}" || true)"
            motion_code="$(curl -sS --max-time 30 -o "$tmp/motion.js" -w '%{http_code}' "$origin/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js?r479=${GITHUB_RUN_ID}_${attempt}" || true)"
            marker_code="$(curl -sS --max-time 30 -o "$tmp/marker.json" -w '%{http_code}' "$origin/scifi-ui/data/r479-primary-mag-optics.json?r479=${GITHUB_RUN_ID}_${attempt}" || true)"
            if [[ "$sync_code" == 200 && "$css_code" == 200 && "$motion_code" == 200 && "$marker_code" == 200 ]] \
              && grep -Fq 'fxMiniMagLifeContractR479' "$tmp/sync.js" \
              && grep -Fq 'r479-colour-depth-soft-living-primary' "$tmp/sync.js" \
              && grep -Fq 'brightness(.72)' "$tmp/sync.css" \
              && grep -Fq 'saturate(1.38)' "$tmp/sync.css" \
              && grep -Fq 'fx-primary-mag-live-breath-r479' "$tmp/sync.css" \
              && grep -Fq 'formatx-mag-shape-sync-r476.js?v=20260831-r484-readable-electric-surface' "$tmp/motion.js" \
              && grep -Fq '"revision": "R479"' "$tmp/marker.json"; then
              echo 'PASS: production serves R479 living colour-depth MAG optics.'
              rm -rf "$tmp"
              exit 0
            fi
            echo "codes: sync-js=$sync_code sync-css=$css_code motion=$motion_code marker=$marker_code"
            rm -rf "$tmp"
            sleep 10
          done
          echo 'Production did not converge to R479 within the verification window.' >&2
          exit 1

      - name: Publish R479 source/live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='R479 source/live optics passed; visual proof pending'
          else
            state=failure
            description='R479 source/live optics verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R479 living MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  visual-r479-live-mag:
    needs: verify-r479-living-mag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium visual verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r479-visual"
          cd "$RUNNER_TEMP/r479-visual"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Validate live 390x844 MAG optics and breathing
        env:
          NODE_PATH: ${{ runner.temp }}/r479-visual/node_modules
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r479
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            page.on('console',message=>{if(message.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(message.text()))errors.push(message.text());});
            await page.goto(`https://formatxsuite.com/?verify=r479-visual-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              const style=canvas?getComputedStyle(canvas):null;
              const box=canvas?.getBoundingClientRect();
              return d.fxCrystalOrganismR326==='ready'
                && d.fxMagShapeSyncR476==='ready-r482'
                && canvas && style && box && box.width>120 && box.height>180
                && style.display!=='none' && style.visibility!=='hidden' && Number(style.opacity)>.2;
            },null,{timeout:120000});
            await page.waitForTimeout(900);

            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              const cs=getComputedStyle(canvas);
              const box=canvas.getBoundingClientRect();
              const controls=[...document.querySelectorAll('#hero .fx-reference-controls-r204 .fx-three-sound,#hero .fx-reference-controls-r204 .fx-reference-ask,#hero .fx-reference-controls-r204 .fx-reference-pause')].map(el=>{const b=el.getBoundingClientRect();const s=getComputedStyle(el);return{left:b.left,right:b.right,top:b.top,bottom:b.bottom,width:b.width,height:b.height,display:s.display,visibility:s.visibility,opacity:Number(s.opacity)};});
              return{
                renderer:root.dataset.fxCoreRenderer,
                shapeSync:root.dataset.fxMagShapeSyncR476,
                life:root.dataset.fxMiniMagLifeR479,
                lifeContract:root.dataset.fxMiniMagLifeContractR479,
                scheduler:root.dataset.fxCoreScheduler,
                idle:root.dataset.fxCoreIdleRenderR441,
                filter:cs.filter,
                animationName:cs.animationName,
                opacity:Number(cs.opacity),
                scale:cs.scale,
                canvas:{left:box.left,top:box.top,width:box.width,height:box.height},
                controls,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            assert.equal(state.renderer,'single-webgl-crystal-organism-r326');
            assert.equal(state.shapeSync,'ready-r482');
            assert.ok(['breath','pulse'].includes(state.life),JSON.stringify(state));
            assert.equal(state.lifeContract,'primary-and-mini-compositor-breath-colour-depth-zero-js-idle');
            assert.equal(state.scheduler,'interaction-bursts-idle-zero-frame-r441');
            assert.equal(state.idle,'zero-frame');
            assert.match(state.filter,/brightness\(1\.02\)/);
            assert.match(state.filter,/contrast\(0\.98\)/);
            assert.match(state.filter,/saturate\(1\.28\)/);
            assert.match(state.filter,/blur\(0\.3px\)/);
            assert.ok(state.animationName.includes('fx-primary-mag-mobile-heart-r483'),state.animationName);
            assert.equal(state.controls.length,3);
            assert.ok(state.controls.every(c=>c.width>=44&&c.height>=44&&c.display!=='none'&&c.visibility!=='hidden'&&c.opacity>.2),JSON.stringify(state.controls));
            const overlaps=(a,b)=>!(a.right+2<=b.left||b.right+2<=a.left||a.bottom+2<=b.top||b.bottom+2<=a.top);
            assert.equal(overlaps(state.controls[0],state.controls[1]),false,JSON.stringify(state.controls));
            assert.equal(overlaps(state.controls[1],state.controls[2]),false,JSON.stringify(state.controls));
            assert.ok(state.overflow<=2,JSON.stringify(state));

            const samples=[];
            for(let i=0;i<4;i++){
              samples.push(await page.evaluate(()=>{const s=getComputedStyle(document.querySelector('#hero .fx-crystal-organism-r326-canvas'));return{opacity:Number(s.opacity),scale:s.scale};}));
              await page.waitForTimeout(700);
            }
            const opacitySpan=Math.max(...samples.map(x=>x.opacity))-Math.min(...samples.map(x=>x.opacity));
            const scaleValues=samples.map(x=>Number.parseFloat(x.scale)||1);
            const scaleSpan=Math.max(...scaleValues)-Math.min(...scaleValues);
            assert.ok(opacitySpan>.004||scaleSpan>.002,JSON.stringify({samples,opacitySpan,scaleSpan}));
            assert.equal(errors.length,0,errors.join(' | '));

            await page.screenshot({path:'artifacts/r479/mobile-390x844.png',fullPage:false});
            console.log('R479 LIVE MOBILE',JSON.stringify({state,samples,opacitySpan,scaleSpan},null,2));
            await context.close();
            await browser.close();
            console.log('PASS: live R479 mobile MAG is visible, colour-depth optics are active, controls are clear, and compositor breathing changes over time with zero WebGL idle frames.');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE

      - name: Upload R479 mobile visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r479-live-mobile-visual
          path: artifacts/r479/mobile-390x844.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final R479 living MAG status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='R479 live mobile visual + living optics passed'
          else
            state=failure
            description='R479 live mobile visual verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R479 living MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
