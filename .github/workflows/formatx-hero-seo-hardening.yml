name: FormatX hero and SEO hardening

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/formatx-hero-seo-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize hero before first paint and canonical SEO
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p=Path('docs/scifi-ui/index.html')
          s=p.read_text(encoding='utf-8')

          # Canonical public source must agree with the production apex.
          s=s.replace('https://www.formatxsuite.com/', 'https://formatxsuite.com/')

          viewport='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          if 'name="robots"' not in s:
              s=s.replace(viewport, viewport+'\n  <meta name="robots" content="index,follow,max-image-preview:large">', 1)

          canonical='<link rel="canonical" href="https://formatxsuite.com/">'
          alternates='''<link rel="alternate" hreflang="hu" href="https://formatxsuite.com/?lang=hu">\n  <link rel="alternate" hreflang="en" href="https://formatxsuite.com/?lang=en">\n  <link rel="alternate" hreflang="x-default" href="https://formatxsuite.com/">'''
          if 'hreflang="hu"' not in s:
              if canonical not in s:
                  raise SystemExit('canonical link not found after apex normalization')
              s=s.replace(canonical, canonical+'\n  '+alternates, 1)

          # Above-the-fold elements must never wait for reveal orchestration.
          s=s.replace('<header class="topbar" data-reveal>', '<header class="topbar">', 1)
          s=s.replace('<div class="hero-copy" data-reveal>', '<div class="hero-copy">', 1)

          # These blocks used to be created by formatx-content-standard.js after
          # first paint. Ship them in the HTML so JS only translates/updates them.
          kicker='''          <p class="kicker" data-hu="ÉLŐ RENDSZERARCHITEKTÚRA" data-en="LIVING SYSTEM ARCHITECTURE">ÉLŐ RENDSZERARCHITEKTÚRA</p>'''
          category='''          <p class="fx-category-definition"><strong>Technikusi operációs réteg</strong>Egy közös, ellenőrizhető munkafolyamat meghajtókezeléshez, rendszerdiagnosztikához, telepítéshez és biztonságos karbantartáshoz.</p>'''
          if 'class="fx-category-definition"' not in s:
              if kicker not in s: raise SystemExit('hero kicker anchor not found')
              s=s.replace(kicker, kicker+'\n'+category, 1)

          lead='''          <p class="hero-lead" data-hu="A FormatX nem egy eszközdoboz. Egy élő rendszerépület: érzékel, döntési útvonalat épít, kontrolláltan cselekszik, majd visszaellenőrzi saját állapotát." data-en="FormatX is not a toolbox. It is a living system structure: it senses, builds a decision path, acts under control, then verifies its own state.">A FormatX nem egy eszközdoboz. Egy élő rendszerépület: érzékel, döntési útvonalat épít, kontrolláltan cselekszik, majd visszaellenőrzi saját állapotát.</p>'''
          method='''          <ol class="fx-method-inline" aria-label="FormatX Method"><li>Felderítés</li><li>Terv</li><li>Kontrollált végrehajtás</li><li>Visszaellenőrzés</li></ol>'''
          if 'class="fx-method-inline"' not in s:
              if lead not in s: raise SystemExit('hero lead anchor not found')
              s=s.replace(lead, lead+'\n'+method, 1)

          # Critical r4 reserved the wrong top padding relative to the final
          # mobile hero-flow. Match the final 28px value exactly.
          critical=Path('docs/scifi-ui/styles/formatx-critical-shell-v56.css')
          c=critical.read_text(encoding='utf-8')
          c=c.replace('padding: 84px 0 max(104px, calc(92px + env(safe-area-inset-bottom, 0px)));',
                      'padding: 28px 0 max(104px, calc(92px + env(safe-area-inset-bottom, 0px)));')
          critical.write_text(c, encoding='utf-8')

          # robots sitemap should also use the canonical apex.
          robots=Path('docs/robots.txt')
          r=robots.read_text(encoding='utf-8').replace('https://www.formatxsuite.com/sitemap.xml','https://formatxsuite.com/sitemap.xml')
          robots.write_text(r, encoding='utf-8')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<p class="fx-category-definition">' docs/scifi-ui/index.html
          grep -Fq '<ol class="fx-method-inline"' docs/scifi-ui/index.html
          grep -Fq 'hreflang="x-default"' docs/scifi-ui/index.html
          grep -Fq '<link rel="canonical" href="https://formatxsuite.com/">' docs/scifi-ui/index.html
          ! grep -Fq 'https://www.formatxsuite.com/' docs/scifi-ui/index.html
          ! grep -Fq '<div class="hero-copy" data-reveal>' docs/scifi-ui/index.html
          grep -Fq 'padding: 28px 0 max(104px' docs/scifi-ui/styles/formatx-critical-shell-v56.css
          grep -Fq 'Sitemap: https://formatxsuite.com/sitemap.xml' docs/robots.txt
          node --check docs/scifi-ui/scripts/formatx-content-standard.js
          node .github/scripts/validate-award-readiness.cjs

      - name: Commit production repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/formatx-critical-shell-v56.css docs/robots.txt
          git commit -m '[deploy-production] fix: stabilize hero first paint and canonical SEO'
          git push origin HEAD:master
