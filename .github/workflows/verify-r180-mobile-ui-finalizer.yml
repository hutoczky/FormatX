name: Verify r180 final mobile UI

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-final:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify final 390px mobile UI after late flow timers
        run: |
          cat > verify-r180.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'});
            const page=await context.newPage();page.setDefaultTimeout(120000);
            await page.goto('https://formatxsuite.com/?verify_r180_mobile_final='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxMobileUiFinalizerR180==='ready'&&document.querySelector('script[data-fx-mobile-ui-finalizer-r180]'),null,{timeout:90000});
            /* r178 has delayed writes up to 3.2s; r180 re-locks at 3.7/5.2s. */
            await page.waitForTimeout(4300);
            const state=await page.evaluate(()=>{
              const q=s=>document.querySelector(s),box=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2,cy:r.y+r.height/2,b:r.bottom}};
              const mag=q('.fx-reference-mag-button'),lang=q('.fx-language-toggle'),menu=q('.fx-reference-menu-button'),brand=q('.topbar .brand'),ask=q('#hero .fx-reference-ask'),askLabel=q('#hero .fx-reference-ask span'),pause=q('#hero .fx-reference-pause'),proof=q('#hero .fx-reference-proof'),p=q('#hero .fx-reference-proof p'),live=q('#hero .fx-reference-liveos'),space=q('#hero .hero-space');
              if(![mag,lang,menu,brand,ask,askLabel,pause,proof,p,live,space].every(Boolean))throw new Error('r180 nodes missing');
              const cs=e=>getComputedStyle(e),pseudo=getComputedStyle(space,'::after');
              return{
                finalizer:document.documentElement.dataset.fxMobileUiFinalizerR180,
                headerLock:document.documentElement.dataset.fxMobileUiHeaderR180,
                actionLock:document.documentElement.dataset.fxMobileUiActionsR180,
                proofLock:document.documentElement.dataset.fxMobileUiProofR180,
                mag:box(mag),lang:box(lang),menu:box(menu),brand:box(brand),ask:box(ask),askLabel:box(askLabel),pause:box(pause),proof:box(proof),p:box(p),live:box(live),
                magTop:mag.style.getPropertyValue('top'),langTop:lang.style.getPropertyValue('top'),railGap:q('#hero .fx-reference-rail').style.getPropertyValue('gap'),
                magFont:cs(mag).fontSize,langFont:cs(lang).fontSize,askFont:cs(askLabel).fontSize,pPaddingRight:cs(p).paddingRight,
                seamBackground:pseudo.backgroundImage,orbitOpacity:cs(q('#hero .fx-r168-orbit')||space).opacity,
                magText:mag.textContent.trim(),langText:lang.textContent.trim(),askText:askLabel.textContent.trim(),
                paused:document.documentElement.dataset.fxReferenceMotionPaused,renderMs:Number(document.documentElement.dataset.fxCoreRenderMs||Infinity)
              };
            });
            console.log('R180 MOBILE FINAL',JSON.stringify(state,null,2));
            await page.screenshot({path:'r180-mobile-final.png',fullPage:false,animations:'allow',timeout:120000});
            assert.equal(state.finalizer,'ready');assert.equal(state.headerLock,'centerline-34');assert.equal(state.actionLock,'ask-label-safe-lane');
            assert.equal(state.magText,'MAG');assert.equal(state.langText,'HU');assert.equal(state.askText,'KÉRDEZZ');
            assert.equal(state.magTop,'14px');assert.equal(state.langTop,'14px');assert.equal(state.railGap,'24px');
            assert.ok(Math.abs(state.mag.cy-state.lang.cy)<=.6,`MAG/HU center ${state.mag.cy}/${state.lang.cy}`);
            assert.ok(Math.abs(state.lang.cy-state.menu.cy)<=.6,`HU/menu center ${state.lang.cy}/${state.menu.cy}`);
            assert.ok(Math.abs(state.brand.cy-state.mag.cy)<=1.5,`brand/control center ${state.brand.cy}/${state.mag.cy}`);
            assert.equal(state.mag.h,40);assert.equal(state.lang.h,40);assert.equal(state.menu.h,52);
            assert.equal(state.magFont,'10px');assert.equal(state.langFont,'10px');assert.equal(state.askFont,'10px');
            assert.ok(state.pause.y-state.ask.b>=23,`ASK/pause gap ${state.pause.y-state.ask.b}`);
            assert.ok(state.askLabel.b<=state.pause.y-8,`ASK label collision ${state.askLabel.b}/${state.pause.y}`);
            assert.equal(state.pPaddingRight,'0px');assert.ok(state.p.w>=state.proof.w-40,`proof width ${state.p.w}/${state.proof.w}`);
            assert.ok(state.live.y>=state.p.b+10,`Live OS overlap ${state.live.y}/${state.p.b}`);
            assert.ok(state.seamBackground.includes('linear-gradient'));assert.ok(Number(state.orbitOpacity)<=.11);
            assert.equal(state.paused,'false');assert.ok(state.renderMs<16.67);
            await browser.close();assert.ok(fs.statSync('r180-mobile-final.png').size>10000);
            console.log('PASS: r180 final mobile controls and copy remain stable after all delayed flow writes.');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-r180.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r180-mobile-final-${{ github.run_id }}
          path: r180-mobile-final.png
          if-no-files-found: warn
          retention-days: 14
