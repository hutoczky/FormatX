name: Validate feedback moderation centre

on:
  pull_request:
    branches: [master]
    paths:
      - 'billing-worker/src/feedback-api.js'
      - 'billing-worker/src/feedback-schema.js'
      - 'billing-worker/src/production-feedback-entry.js'
      - 'docs/fx-owner-license/index.html'
      - 'docs/fx-owner-license/feedback.html'
      - 'docs/fx-owner-license/feedback-admin.js'
      - 'docs/fx-owner-license/feedback-admin.css'
      - '.github/scripts/validate-feedback-moderation.cjs'
      - '.github/workflows/validate-feedback-moderation.yml'
  push:
    branches: [master]
    paths:
      - 'billing-worker/src/feedback-api.js'
      - 'billing-worker/src/feedback-schema.js'
      - 'billing-worker/src/production-feedback-entry.js'
      - 'docs/fx-owner-license/index.html'
      - 'docs/fx-owner-license/feedback.html'
      - 'docs/fx-owner-license/feedback-admin.js'
      - 'docs/fx-owner-license/feedback-admin.css'
      - '.github/scripts/validate-feedback-moderation.cjs'
      - '.github/workflows/validate-feedback-moderation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check billing-worker/src/feedback-api.js
          node --check billing-worker/src/feedback-schema.js
          node --check billing-worker/src/production-feedback-entry.js
          node --check docs/fx-owner-license/feedback-admin.js
          node --check .github/scripts/validate-feedback-moderation.cjs
      - name: Validate moderation and migration contracts
        run: node .github/scripts/validate-feedback-moderation.cjs
      - name: Validate production Worker bundle
        working-directory: billing-worker
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir ../.wrangler-feedback-moderation
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-feedback-moderation-candidate
          path: .wrangler-feedback-moderation
          if-no-files-found: error
          retention-days: 7
