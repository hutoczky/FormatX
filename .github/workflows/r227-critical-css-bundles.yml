name: r227 critical CSS bundles

on:
  push:
    paths:
      - '.github/workflows/r227-critical-css-bundles.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build cascade-preserving critical bundles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('docs/scifi-ui')
          styles = root / 'styles'

          bundles = {
              'formatx-critical-core-r227.css': [
                  'formatx-apex.css',
                  'living-architecture.css',
                  'formatx-category-positioning.css',
                  'formatx-design-system.css',
                  'formatx-mobile-recovery.css',
                  'formatx-premium-finish.css',
              ],
              'formatx-critical-signature-r227.css': [
                  'formatx-signature-system-r185.css',
              ],
              'formatx-critical-narrative-r227.css': [
                  'formatx-award-narrative-r175.css',
                  'formatx-mobile-ui-polish-r179.css',
              ],
          }

          for bundle, sources in bundles.items():
              parts = [
                  '/* FormatX r227 — generated cascade-preserving critical CSS bundle. */',
                  '/* Source files remain canonical; regenerate this bundle when a source changes. */',
              ]
              for source in sources:
                  text = (styles / source).read_text(encoding='utf-8-sig')
                  parts.append(f'\n/* ===== BEGIN {source} ===== */\n{text}\n/* ===== END {source} ===== */\n')
              (styles / bundle).write_text('\n'.join(parts), encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          replacements = [
              (
                  '<link rel="stylesheet" href="./styles/formatx-apex.css?v=20260726-apex-2">',
                  '<link rel="stylesheet" data-fx-critical-core-r227="true" href="./styles/formatx-critical-core-r227.css?v=20260819-r227">'
              ),
              ('  <link rel="stylesheet" href="./styles/living-architecture.css?v=20260726-living-1">\n', ''),
              ('  <link rel="stylesheet" data-fx-category-style="true" href="./styles/formatx-category-positioning.css?v=20260819-r223-mobile-wpo">\n', ''),
              ('  <link rel="stylesheet" data-fx-design-system="true" href="./styles/formatx-design-system.css?v=20260728-ds2">\n', ''),
              ('  <link rel="stylesheet" href="./styles/formatx-mobile-recovery.css?v=20260812-mobile-stability-r7">\n', ''),
              ('  <link rel="stylesheet" data-fx-premium-finish href="./styles/formatx-premium-finish.css?v=20260805-motion-gate-3">\n', ''),
              (
                  '<link rel="stylesheet" data-fx-signature-system-r185="true" href="./styles/formatx-signature-system-r185.css?v=20260816-iconic-mag-r185b-hitlayer">',
                  '<link rel="stylesheet" data-fx-critical-signature-r227="true" href="./styles/formatx-critical-signature-r227.css?v=20260819-r227">'
              ),
              (
                  '<link rel="stylesheet" data-fx-award-narrative-r175="true" href="./styles/formatx-award-narrative-r175.css?v=20260816-r175-award-narrative">',
                  '<link rel="stylesheet" data-fx-critical-narrative-r227="true" href="./styles/formatx-critical-narrative-r227.css?v=20260819-r227">'
              ),
              ('  <link rel="stylesheet" data-fx-mobile-ui-polish-r179="true" href="./styles/formatx-mobile-ui-polish-r179.css?v=20260819-r222-critical-flat" media="(max-width: 900px), (pointer: coarse)">\n', ''),
          ]

          for old, new in replacements:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'index.html: expected exactly one match, got {count}: {old}')
              html = html.replace(old, new, 1)

          index.write_text(html, encoding='utf-8')
          PY

          git diff --check
          git diff --stat
          grep -n 'critical-.*r227' docs/scifi-ui/index.html

      - name: Commit bundles
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html \
            docs/scifi-ui/styles/formatx-critical-core-r227.css \
            docs/scifi-ui/styles/formatx-critical-signature-r227.css \
            docs/scifi-ui/styles/formatx-critical-narrative-r227.css
          git commit -m 'r227 collapse critical CSS fan-out without changing cascade'
          git push origin HEAD:master
