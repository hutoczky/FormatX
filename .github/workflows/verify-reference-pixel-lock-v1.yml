name: Verify responsive reference composition
run-name: Validate current award MAG composition at review viewports
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-reference-pixel-lock-v1.yml'
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-flow-first-r75.js'
      - 'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
      - 'docs/scifi-ui/styles/formatx-award-reference-r80.css'
      - 'docs/scifi-ui/styles/formatx-award-proof-r85.css'
      - 'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ref-lock" && cd "$RUNNER_TEMP/ref-lock"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate current award composition and capture review images
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory docs >"$RUNNER_TEMP/ref-lock-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/ref-lock"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:4174/scifi-ui/';
          const overlap=(a,b)=>a&&b&&Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y))>6;
          async function capture(browser,name,viewport,mobile=false,dpr=1){
            const context=await browser.newContext({viewport,deviceScaleFactor:dpr,isMobile:mobile,hasTouch:mobile,locale:'hu-HU'});
            const page=await context.newPage();
            page.on('pageerror',e=>console.log(`[${name} PAGEERROR]`,e.message));
            await page.goto(`${origin}?reference_composition=${name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(mobile
              ? ()=>document.documentElement.dataset.fxCoreMobileV69==='ready-v69'&&document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxFlowFirstR75==='ready-r139'
              : ()=>document.documentElement.dataset.fxCoreMobileV69==='ready-v69'&&document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxFlowFirstR75==='desktop-bypass-r178',null,{timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreSilhouetteStability==='r189-fixed-geometry-dt-smoothing',null,{timeout:10000});
            await page.waitForTimeout(1900);
            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const q=s=>{const el=document.querySelector(s),r=el?.getBoundingClientRect(),cs=el?getComputedStyle(el):null;return r?{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),display:cs.display,visibility:cs.visibility,opacity:+(cs.opacity||1),position:cs.position}:null};
              const canvas=document.querySelector('.fx-core-mobile-v55-canvas');
              return {renderer:root.dataset.fxCoreRenderer,stability:root.dataset.fxCoreSilhouetteStability,v69:root.dataset.fxCoreMobileV69,layout:root.dataset.fxMobileReferenceLayout,flow:root.dataset.fxFlowFirstR75,composition:root.dataset.fxReferenceComposition,renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),gl:Boolean(canvas?.getContext('webgl2')),glError:canvas?.getContext('webgl2')?.getError(),canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,topbar:q('.topbar'),space:q('#hero .hero-space'),rail:q('#hero .fx-reference-rail'),copy:q('#hero .hero-copy'),heading:q('#hero .fx-reference-heading'),proof:q('#hero .fx-reference-proof'),proofText:q('#hero .fx-reference-proof p'),liveOs:q('#hero .fx-reference-liveos'),brand:q('.topbar .brand'),mag:q('.topbar>.fx-reference-mag-button'),menu:q('.topbar>.fx-reference-menu-button'),legacyMenu:q('#menu-toggle.fx-organism-system-toggle')};
            });
            console.log(name.toUpperCase(),JSON.stringify(state));
            await page.screenshot({path:`${name}.png`,fullPage:false});
            assert.equal(state.renderer,'single-webgl-luminous-crystal-r99');
            assert.equal(state.stability,'r189-fixed-geometry-dt-smoothing');
            assert.equal(state.v69,'ready-v69');assert.equal(state.layout,'ready-v1');
            assert.equal(state.gl,true);assert.equal(state.glError,0);assert.equal(state.canvases,1);assert.ok(Number.isFinite(state.renderMs)&&state.renderMs<50,JSON.stringify(state));
            if(mobile)assert.ok(state.renderMs<16.67,JSON.stringify(state));
            assert.ok(state.topbar&&state.space&&state.brand,`${name}: structural shell missing`);
            assert.ok(state.space.y>=state.topbar.y+state.topbar.h-1,`${name}: header covers MAG`);
            if(mobile){
              assert.equal(state.flow,'ready-r139');
              assert.equal(state.composition,'award-reference-overlay-r139');
              for(const key of ['rail','heading','proof','proofText','liveOs','mag','menu'])assert.ok(state[key],`${name}: missing ${key}`);
              assert.ok(state.copy&&state.copy.w<=2&&state.copy.h<=2,`${name}: desktop hero copy leaked into award composition`);
              assert.ok(state.heading.y>=state.space.y+state.space.h-80,`${name}: heading detached from MAG transition`);
              assert.ok(state.proof.y>=state.heading.y+state.heading.h-2,`${name}: proof overlaps heading`);
              assert.equal(overlap(state.liveOs,state.proofText),false,`${name}: Live OS covers proof text`);
              assert.equal(overlap(state.brand,state.mag),false,`${name}: brand/MAG overlap`);
              assert.equal(overlap(state.mag,state.menu),false,`${name}: MAG/menu overlap`);
            }else{
              assert.equal(state.flow,'desktop-bypass-r178');
              assert.equal(state.composition,'desktop-native-r178');
              assert.ok(state.copy&&state.copy.w>500&&state.copy.h>200,`${name}: desktop hero copy collapsed`);
              assert.ok(state.legacyMenu&&state.legacyMenu.display!=='none'&&state.legacyMenu.visibility==='visible',`${name}: desktop menu unavailable`);
              for(const key of ['rail','heading','proof'])if(state[key])assert.ok(state[key].display==='none'||state[key].visibility==='hidden'||state[key].opacity<.01,`${name}: mobile award overlay leaked to desktop`);
            }
            await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await capture(browser,'mobile-412x680',{width:412,height:680},true,2);await capture(browser,'mobile-390x844',{width:390,height:844},true,2);await capture(browser,'desktop-1440x960',{width:1440,height:960},false,1);}finally{await browser.close()}for(const f of['mobile-412x680.png','mobile-390x844.png','desktop-1440x960.png'])assert.ok(fs.statSync(f).size>10000,f);console.log('PASS: r189 award MAG composition captured with stable silhouette and without structural overlap.');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-reference-r189-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ref-lock/mobile-412x680.png
            ${{ runner.temp }}/ref-lock/mobile-390x844.png
            ${{ runner.temp }}/ref-lock/desktop-1440x960.png
          retention-days: 14
