name: Verify responsive reference composition
run-name: Validate MAG-first no-overlap composition at award review viewports
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-reference-pixel-lock-v1.yml'
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-v69.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-flow-first-r75.js'
      - 'docs/scifi-ui/scripts/interaction-genome-export-stability.js'
      - 'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
      - 'docs/scifi-ui/styles/formatx-flow-first-r74.css'
      - 'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ref-lock" && cd "$RUNNER_TEMP/ref-lock"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Validate MAG-first normal flow and no content overlap
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory docs >"$RUNNER_TEMP/ref-lock-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/ref-lock"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');const {chromium}=require('playwright');
          const origin='http://127.0.0.1:4174/scifi-ui/';
          const bottom=b=>b.y+b.h,right=b=>b.x+b.w;
          const separated=(a,b,gap=0)=>bottom(a)<=b.y+gap||bottom(b)<=a.y+gap||right(a)<=b.x+gap||right(b)<=a.x+gap;
          async function capture(browser,name,viewport,mobile=false,dpr=1){
            const context=await browser.newContext({viewport,deviceScaleFactor:dpr,isMobile:mobile,hasTouch:mobile,locale:'hu-HU'}),page=await context.newPage();
            page.on('pageerror',error=>console.log(`[${name} PAGEERROR]`,error.message));
            await page.goto(`${origin}?reference_composition=${name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileV69==='ready-v69'&&document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxFlowFirstR75==='ready',null,{timeout:45000});
            await page.waitForTimeout(1900);
            const state=await page.evaluate(()=>{const root=document.documentElement,q=s=>{const el=document.querySelector(s),box=el?.getBoundingClientRect(),cs=el?getComputedStyle(el):null;return box?{x:+box.x.toFixed(1),y:+box.y.toFixed(1),w:+box.width.toFixed(1),h:+box.height.toFixed(1),position:cs.position,display:cs.display,visibility:cs.visibility,opacity:cs.opacity}:null;},canvas=document.querySelector('.fx-core-mobile-v55-canvas'),genome=document.querySelector('.fx-genome-launcher'),copy=document.querySelector('#hero .hero-copy');const copyChildren=copy?[...copy.children].map(el=>{const b=el.getBoundingClientRect(),cs=getComputedStyle(el);return{tag:el.tagName,cls:String(el.className||''),id:el.id||'',text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80),x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),display:cs.display,position:cs.position,visibility:cs.visibility,opacity:cs.opacity,cssText:el.getAttribute('style')||''};}):[];return{renderer:root.dataset.fxCoreRenderer,v69:root.dataset.fxCoreMobileV69,layout:root.dataset.fxMobileReferenceLayout,composition:root.dataset.fxReferenceComposition,topbar:q('.topbar'),space:q('#hero .hero-space'),rail:q('#hero .fx-reference-rail'),askLabel:q('#hero .fx-reference-ask span'),copy:q('#hero .hero-copy'),heading:q('#hero .fx-reference-heading'),proof:q('#hero .fx-reference-proof'),proofText:q('#hero .fx-reference-proof p'),liveOs:q('#hero .fx-reference-liveos'),brand:q('.topbar .brand'),mag:q('.topbar>.fx-reference-mag-button'),language:q('.topbar>.fx-language-toggle'),menu:q('.topbar>.fx-reference-menu-button'),category:q('#hero .fx-category-definition'),title:q('#hero-title'),lead:q('#hero .hero-lead'),actions:q('#hero .hero-actions'),facts:q('#hero .hero-facts'),copyChildren,gl:Boolean(canvas?.getContext('webgl2')),glError:canvas?.getContext('webgl2')?.getError(),renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),legacyStages:document.querySelectorAll('.fx-core-mesh3d-stage,.fx-core-fracture3d-stage,.fx-transcend-shell[data-fx-native-apex="true"]').length,genome:genome?getComputedStyle(genome).display:'absent'};});
            console.log(name.toUpperCase(),JSON.stringify(state));
            console.log(`${name.toUpperCase()} COPY CHILDREN`,JSON.stringify(state.copyChildren));
            for(const key of ['topbar','space','rail','copy','heading','proof','brand','mag','menu'])assert.ok(state[key],`${name}: missing ${key}`);
            assert.equal(state.renderer,'single-webgl2-mobile-cinematic-reference-glass-v69');assert.equal(state.v69,'ready-v69');assert.equal(state.layout,'ready-v1');assert.equal(state.composition,'mag-first-normal-flow-r75');assert.equal(state.gl,true);assert.equal(state.glError,0);assert.equal(state.legacyStages,0);assert.ok(state.renderMs<16.67,JSON.stringify(state));assert.ok(['none','absent'].includes(state.genome));
            assert.ok(state.space.y>=state.topbar.y+state.topbar.h-1,`${name}: header covers MAG`);
            assert.ok(state.rail.y>=state.space.y+state.space.h-1,`${name}: rail overlays MAG`);
            assert.ok(state.copy.y>=state.rail.y+state.rail.h-1,`${name}: copy overlaps controls`);
            if(state.askLabel)assert.ok(state.copy.y>=state.askLabel.y+state.askLabel.h-1,`${name}: ASK label covers copy`);
            for(const key of ['category','title','lead','actions','facts']){assert.ok(state[key],`${name}: missing visible hero ${key}`);assert.ok(state[key].h>0,`${name}: hero ${key} has zero height: ${JSON.stringify(state.copyChildren)}`);assert.notEqual(state[key].display,'none',`${name}: hero ${key} hidden`);assert.equal(state[key].visibility,'visible',`${name}: hero ${key} not visible`);}
            assert.ok(state.copy.h>200,`${name}: hero copy collapsed: ${JSON.stringify(state.copyChildren)}`);
            assert.ok(state.heading.y>=state.copy.y+state.copy.h-1,`${name}: heading overlaps copy`);
            assert.ok(state.proof.y>=state.heading.y+state.heading.h-1,`${name}: proof overlaps heading`);
            if(state.proofText&&state.liveOs)assert.ok(state.liveOs.y>=state.proofText.y+state.proofText.h-1,`${name}: Live OS covers proof text`);
            const controls=[state.brand,state.mag,state.language,state.menu].filter(Boolean);for(let i=0;i<controls.length;i++){const c=controls[i];assert.ok(c.y>=state.topbar.y-1&&c.y+c.h<=state.topbar.y+state.topbar.h+1,`${name}: header control escapes header`);for(let j=i+1;j<controls.length;j++)assert.ok(separated(c,controls[j],-.5),`${name}: header controls overlap`)}
            assert.equal(state.brand.position,'relative');assert.equal(state.mag.position,'relative');assert.equal(state.menu.position,'relative');
            await page.screenshot({path:`${name}.png`,fullPage:false});await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await capture(browser,'mobile-412x680',{width:412,height:680},true,2);await capture(browser,'mobile-390x844',{width:390,height:844},true,2);await capture(browser,'desktop-1440x960',{width:1440,height:960},false,1);}finally{await browser.close()}for(const file of ['mobile-412x680.png','mobile-390x844.png','desktop-1440x960.png'])assert.ok(fs.statSync(file).size>10000,file);console.log('PASS: MAG is first, hero information is visible, and nothing overlaps on phone or desktop.');})().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-reference-v69-r75-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ref-lock/mobile-412x680.png
            ${{ runner.temp }}/ref-lock/mobile-390x844.png
            ${{ runner.temp }}/ref-lock/desktop-1440x960.png
          retention-days: 14
