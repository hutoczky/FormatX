name: Finish desktop browser contracts once

on:
  push:
    branches: [fix/desktop-multiplatform-final]
    paths:
      - '.github/workflows/one-shot-finish-desktop-browser-contracts.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-finish-desktop-browser-contracts
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-multiplatform-final

      - name: Apply browser contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          visuals = Path('.github/scripts/validate-content-visuals.cjs')
          text = visuals.read_text(encoding='utf-8')
          text = text.replace(
              "assert(/Windows|public beta|nyilvános béta/i.test(cta.text), 'Primary CTA does not communicate Windows beta status');",
              "assert(/multiplatform|public beta|nyilvános béta/i.test(cta.text), 'Primary CTA does not communicate multiplatform beta status');",
          )
          text = text.replace(
              "page.locator('.fx-language-toggle:visible, .language-switch:visible, .language-control:visible').count()",
              "page.locator('.fx-language-toggle:visible, .language-switch [data-language]:visible, .language-control [data-language-choice]:visible').count()",
          )
          visuals.write_text(text, encoding='utf-8')

          organism = Path('.github/scripts/validate-organism-main.cjs')
          text = organism.read_text(encoding='utf-8')
          text = text.replace(
              "if (await skip.isVisible().catch(() => false)) await skip.click();",
              "if (await skip.isVisible().catch(() => false)) {\n    await skip.click({ force: true, timeout: 1500 }).catch(() => {});\n  }",
          )
          organism.write_text(text, encoding='utf-8')

          language = Path('docs/scifi-ui/scripts/single-language-toggle.js')
          text = language.read_text(encoding='utf-8')
          text = text.replace(
              "  function setLanguage(language, persist, container, toggle) {\n    if (!SUPPORTED.has(language)) return;",
              "  function setLanguage(language, persist, container, toggle) {\n    if (!SUPPORTED.has(language)) return;\n    const preservedHash = location.hash;",
          )
          text = text.replace(
              "    requestAnimationFrame(() => updateToggle(toggle, language));",
              "    requestAnimationFrame(() => {\n      if (preservedHash && location.hash !== preservedHash) {\n        const url = new URL(location.href);\n        url.hash = preservedHash;\n        history.replaceState({}, '', url.pathname + url.search + url.hash);\n      }\n      updateToggle(toggle, language);\n    });",
          )
          language.write_text(text, encoding='utf-8')

          infinite = Path('docs/scifi-ui/scripts/formatx-infinite-scroll.js')
          text = infinite.read_text(encoding='utf-8')
          text = text.replace(
              "  const DOWN_KEYS = new Set(['ArrowDown', 'PageDown', 'End', ' ']);",
              "  const DOWN_KEYS = new Set(['ArrowDown', 'PageDown', 'End', ' ']);\n  const CONTINUOUS_POINTER = matchMedia('(hover: hover) and (pointer: fine)').matches;\n\n  if (CONTINUOUS_POINTER) root.classList.add('fx-continuous-scroll-mode');",
          )
          infinite.write_text(text, encoding='utf-8')

          stability = Path('docs/scifi-ui/styles/formatx-site-stability.css')
          text = stability.read_text(encoding='utf-8')
          rule = "\n/* Fine-pointer desktop and laptop input remains continuous after boundary loops. */\nhtml.fx-continuous-scroll-mode {\n  scroll-snap-type: none !important;\n}\n"
          if 'html.fx-continuous-scroll-mode' not in text:
              text += rule
          stability.write_text(text, encoding='utf-8')
          PY

          grep -Fq 'multiplatform beta status' .github/scripts/validate-content-visuals.cjs
          grep -Fq '.language-switch [data-language]:visible' .github/scripts/validate-content-visuals.cjs
          grep -Fq 'force: true, timeout: 1500' .github/scripts/validate-organism-main.cjs
          grep -Fq 'const preservedHash = location.hash' docs/scifi-ui/scripts/single-language-toggle.js
          grep -Fq 'fx-continuous-scroll-mode' docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq 'scroll-snap-type: none !important' docs/scifi-ui/styles/formatx-site-stability.css

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-finish-desktop-browser-contracts.yml
          git config user.name 'FormatX maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scripts/validate-content-visuals.cjs \
                  .github/scripts/validate-organism-main.cjs \
                  docs/scifi-ui/scripts/single-language-toggle.js \
                  docs/scifi-ui/scripts/formatx-infinite-scroll.js \
                  docs/scifi-ui/styles/formatx-site-stability.css \
                  .github/workflows/one-shot-finish-desktop-browser-contracts.yml
          git commit -m 'Finish desktop continuous-scroll browser contracts'
          git push origin HEAD:fix/desktop-multiplatform-final
