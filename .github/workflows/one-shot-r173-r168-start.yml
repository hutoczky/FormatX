name: One-shot r174 r168 seam mutation recovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r173-r168-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Make r168 seam style updates idempotent and publish fresh cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js=Path('docs/scifi-ui/scripts/formatx-living-energy-r168.js')
          s=js.read_text()
          old_open="  style.textContent=`"
          new_open="  const css=`"
          if old_open in s:
              s=s.replace(old_open,new_open,1)
          elif new_open not in s:
              raise SystemExit('r168 seam css assignment target not found')

          old_append="  if(style.parentNode!==document.head)document.head.appendChild(style);else if(document.head.lastElementChild!==style)document.head.appendChild(style);"
          new_append="  if(style.textContent!==css)style.textContent=css;\n  if(style.parentNode!==document.head)document.head.appendChild(style);"
          if old_append in s:
              s=s.replace(old_append,new_append,1)
          elif new_append not in s:
              raise SystemExit('r168 seam append target not found')
          js.write_text(s)

          old_rev='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r173-late-layer-start'
          new_rev='formatx-living-energy-r168.js?v=20260815-r168-v3-monotonic&rev=20260816-r174-idempotent-seam-style'

          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          if old_rev in html:
              html=html.replace(old_rev,new_rev,1)
          elif new_rev not in html:
              raise SystemExit('r168 index cache token not found')
          index.write_text(html)

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          if old_rev in v:
              v=v.replace(old_rev,new_rev,1)
          elif new_rev not in v:
              raise SystemExit('r168 validator cache token not found')
          validator.write_text(v)
          PY

          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node .github/scripts/validate-real3d-core.cjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-living-energy-r168.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then
            echo 'r174 idempotent seam patch already current'
            exit 0
          fi
          git commit -m '[deploy-production] perf(mag): stop redundant r168 seam DOM mutations r174'
          git push origin HEAD:master
