name: Diagnose R517 remaining P0 blockers
run-name: R517 diagnostic from exact R516 production

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/diagnose-r517-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r517-p0-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      AUDITED_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
      ORIGIN: https://formatxsuite.com
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v5

      - name: Confirm exact R516 production marker
        shell: bash
        run: |
          set -Eeuo pipefail
          git show "$AUDITED_SHA:docs/p0-validation-version.txt" > "$RUNNER_TEMP/expected-p0.txt"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?diag=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/live-p0.txt"
          cmp -s "$RUNNER_TEMP/expected-p0.txt" "$RUNNER_TEMP/live-p0.txt"
          echo 'R516 exact production marker confirmed.'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install lightweight browser diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r517diag"
          cd "$RUNNER_TEMP/r517diag"
          npm init -y >/dev/null 2>&1
          npm install --silent --ignore-scripts playwright-core@1.62.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          npm install -g @lhci/cli@0.13.x >/dev/null

      - name: Capture desktop LCP paint and mutation diagnostics x3
        env:
          NODE_PATH: ${{ runner.temp }}/r517diag/node_modules
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-diagnostics/desktop
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {chromium}=require('playwright-core');
          const out='artifacts/r517-diagnostics/desktop';
          const origin=process.env.ORIGIN;
          const chrome=process.env.CHROME_PATH;
          const critical=/formatx-(?:critical-shell-v56|quality-r461|critical-core-r227|reference-production-r244|first-paint-r206|p0-first-paint-r490)\.css|formatx-reference-mode-boot-r334\.js/;

          async function run(browser,index){
            const context=await browser.newContext({viewport:{width:1350,height:940},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page);
            await cdp.send('Network.enable');
            const net=new Map();
            cdp.on('Network.requestWillBeSent',e=>{
              if(e.type==='Document'||critical.test(e.request.url)) net.set(e.requestId,{url:e.request.url,type:e.type,requestTime:e.timestamp,wallTime:e.wallTime,priority:e.request.initialPriority||null});
            });
            cdp.on('Network.responseReceived',e=>{
              const x=net.get(e.requestId); if(!x)return;
              Object.assign(x,{status:e.response.status,protocol:e.response.protocol,fromDiskCache:e.response.fromDiskCache,fromServiceWorker:e.response.fromServiceWorker,responseTime:e.timestamp,headers:e.response.headers,mimeType:e.response.mimeType});
            });
            cdp.on('Network.loadingFinished',e=>{
              const x=net.get(e.requestId); if(!x)return;
              Object.assign(x,{finishTime:e.timestamp,encodedDataLength:e.encodedDataLength});
            });

            await page.addInitScript(()=>{
              const diag=window.__fxR517={lcp:[],layoutShifts:[],paints:[],longTasks:[],mutations:[],styleChanges:[],resources:[],errors:[]};
              const plainRect=r=>r?{x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left}:null;
              const nodeName=n=>{
                const e=n?.nodeType===1?n:n?.parentElement;
                if(!e)return String(n?.nodeName||'');
                if(e.id)return '#'+e.id;
                const cls=typeof e.className==='string'?e.className.trim().split(/\s+/).slice(0,3).join('.'):'';
                return e.tagName.toLowerCase()+(cls?'.'+cls:'');
              };
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()){diag.lcp.push({startTime:e.startTime,renderTime:e.renderTime,loadTime:e.loadTime,size:e.size,url:e.url||'',element:nodeName(e.element),id:e.id||''});}}).observe({type:'largest-contentful-paint',buffered:true});}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()){if(!e.hadRecentInput)diag.layoutShifts.push({startTime:e.startTime,value:e.value,sources:(e.sources||[]).map(s=>({node:nodeName(s.node),previousRect:plainRect(s.previousRect),currentRect:plainRect(s.currentRect)}))});}}).observe({type:'layout-shift',buffered:true});}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())diag.paints.push({name:e.name,startTime:e.startTime,duration:e.duration});}).observe({type:'paint',buffered:true});}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())diag.longTasks.push({startTime:e.startTime,duration:e.duration,name:e.name});}).observe({type:'longtask',buffered:true});}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries()){if(/formatx-(?:critical-shell-v56|quality-r461|critical-core-r227|reference-production-r244|first-paint-r206|p0-first-paint-r490)\.css|formatx-reference-mode-boot-r334\.js/.test(e.name))diag.resources.push({name:e.name,startTime:e.startTime,responseStart:e.responseStart,responseEnd:e.responseEnd,duration:e.duration,transferSize:e.transferSize,encodedBodySize:e.encodedBodySize,decodedBodySize:e.decodedBodySize,nextHopProtocol:e.nextHopProtocol,initiatorType:e.initiatorType});}}).observe({type:'resource',buffered:true});}catch{}
              const interesting=e=>e&&(e.matches?.('html,body,#hero,.hero-grid,.hero-copy,.hero-lead')||e.closest?.('.hero-lead'));
              new MutationObserver(list=>{for(const m of list){const e=m.target?.nodeType===1?m.target:m.target?.parentElement;if(!interesting(e))continue;diag.mutations.push({t:performance.now(),type:m.type,target:nodeName(m.target),attribute:m.attributeName||'',oldValue:m.oldValue||'',text:m.type==='characterData'?String(m.target.data||'').slice(0,160):'',htmlClass:document.documentElement.className,bodyClass:document.body?.className||''});}}).observe(document,{subtree:true,attributes:true,attributeOldValue:true,characterData:true,characterDataOldValue:true,childList:true});
              function snap(){
                const els=[['html',document.documentElement],['body',document.body],['hero',document.querySelector('#hero')],['grid',document.querySelector('#hero .hero-grid')],['copy',document.querySelector('#hero .hero-copy')],['lead',document.querySelector('#hero .hero-lead')]];
                const state={t:performance.now()};
                for(const [k,e] of els){if(!e)continue;const s=getComputedStyle(e),r=e.getBoundingClientRect();state[k]={className:e.className||'',opacity:s.opacity,visibility:s.visibility,display:s.display,transform:s.transform,filter:s.filter,contentVisibility:s.contentVisibility,animationName:s.animationName,animationPlayState:s.animationPlayState,transitionProperty:s.transitionProperty,width:r.width,height:r.height,top:r.top,left:r.left,color:s.color,fontSize:s.fontSize,lineHeight:s.lineHeight};}
                const sig=JSON.stringify(state,(key,value)=>key==='t'?undefined:value);
                if(sig!==window.__fxR517LastStyleSig){diag.styleChanges.push(state);window.__fxR517LastStyleSig=sig;}
              }
              addEventListener('DOMContentLoaded',()=>{snap();const id=setInterval(snap,50);setTimeout(()=>clearInterval(id),5000);},{once:true});
              addEventListener('error',e=>diag.errors.push(String(e.error?.stack||e.message||e)),true);
            });

            const errors=[]; page.on('pageerror',e=>errors.push(String(e.stack||e))); page.on('console',m=>{if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(m.text()))errors.push(m.text());});
            const started=Date.now();
            const response=await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(5200);
            const diag=await page.evaluate(()=>({diag:window.__fxR517,final:{now:performance.now(),readyState:document.readyState,htmlDataset:{...document.documentElement.dataset},bodyDataset:{...document.body.dataset},leadText:document.querySelector('#hero .hero-lead')?.textContent||'',leadRect:(()=>{const e=document.querySelector('#hero .hero-lead');if(!e)return null;const r=e.getBoundingClientRect();return{top:r.top,left:r.left,width:r.width,height:r.height};})()}}));
            const result={index,httpStatus:response?.status()||0,elapsedWallMs:Date.now()-started,errors,network:[...net.values()],...diag};
            fs.writeFileSync(`${out}/run-${index}.json`,JSON.stringify(result,null,2));
            console.log('DESKTOP_DIAG',JSON.stringify({index,httpStatus:result.httpStatus,lcp:result.diag.lcp,paints:result.diag.paints,mutations:result.diag.mutations.slice(-20),styleChanges:result.diag.styleChanges,resources:result.diag.resources,network:result.network.map(x=>({url:x.url,protocol:x.protocol,priority:x.priority,requestTime:x.requestTime,responseTime:x.responseTime,finishTime:x.finishTime,encodedDataLength:x.encodedDataLength,status:x.status,cache:x.fromDiskCache,worker:x.fromServiceWorker}))},null,2));
            await context.close();
          }

          (async()=>{const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});for(let i=1;i<=3;i++)await run(browser,i);await browser.close();})().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Run independent mobile Lighthouse diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .lighthouseci artifacts/r517-diagnostics/mobile
          mkdir -p artifacts/r517-diagnostics/mobile
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('lighthouserc.live.mobile.json','utf8'));
          c.ci.collect.url=['https://formatxsuite.com/'];
          c.ci.collect.numberOfRuns=1;
          c.ci.collect.settings={...c.ci.collect.settings,formFactor:'mobile',screenEmulation:{mobile:true,width:390,height:844,deviceScaleFactor:1,disabled:false}};
          delete c.ci.assert;
          c.ci.upload={target:'filesystem',outputDir:'artifacts/r517-diagnostics/mobile-upload'};
          fs.writeFileSync('r517-mobile-diag.json',JSON.stringify(c,null,2)+'\n');
          NODE
          CHROME_PATH="$CHROME_PATH" lhci collect --config=./r517-mobile-diag.json 2>&1 | tee artifacts/r517-diagnostics/mobile/collect.txt
          cp -a .lighthouseci/. artifacts/r517-diagnostics/mobile/
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir='artifacts/r517-diagnostics/mobile';
          const file=fs.readdirSync(dir).find(x=>/^lhr-.*\.json$/.test(x));
          if(!file)throw new Error('mobile LHR missing');
          const d=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
          const a=d.audits,c=d.categories;
          const score=k=>Math.round((c[k]?.score??-1)*100);
          const n=k=>a[k]?.numericValue??null;
          const failedSeo=(c.seo?.auditRefs||[]).map(r=>r.id).filter(id=>a[id]?.score!==null&&a[id]?.score<1).map(id=>({id,score:a[id].score,title:a[id].title,details:a[id].details}));
          const summary={performance:score('performance'),accessibility:score('accessibility'),bestPractices:score('best-practices'),seo:score('seo'),FCP:n('first-contentful-paint'),LCP:n('largest-contentful-paint'),SI:n('speed-index'),TBT:n('total-blocking-time'),CLS:n('cumulative-layout-shift'),TTFB:n('server-response-time'),lcpElement:a['largest-contentful-paint-element']?.details||null,failedSeo};
          fs.writeFileSync(path.join(dir,'summary.json'),JSON.stringify(summary,null,2));
          console.log('MOBILE_LIGHTHOUSE_DIAGNOSTIC',JSON.stringify(summary,null,2));
          NODE

      - name: Capture live robots evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-diagnostics/seo
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' -D artifacts/r517-diagnostics/seo/robots.headers -o artifacts/r517-diagnostics/seo/robots.txt -w 'http_code=%{http_code}\nhttp_version=%{http_version}\nremote_ip=%{remote_ip}\ntime_starttransfer=%{time_starttransfer}\ntime_total=%{time_total}\nsize_download=%{size_download}\n' "$ORIGIN/robots.txt" | tee artifacts/r517-diagnostics/seo/robots.curl.txt
          echo '--- ROBOTS BODY ---'
          nl -ba artifacts/r517-diagnostics/seo/robots.txt

      - name: Dump R482 legacy conditions and current MAG semantics
        env:
          NODE_PATH: ${{ runner.temp }}/r517diag/node_modules
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r517-diagnostics/r482
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {chromium}=require('playwright-core');
          const CANVAS='#hero .hero-space > .fx-crystal-organism-r326-stage > .fx-crystal-organism-r326-canvas';
          const PAUSE='#hero .fx-reference-pause';
          const ASK='#hero .fx-reference-ask';
          const origin=process.env.ORIGIN;
          function stateScript(){
            const canvasSel='#hero .hero-space > .fx-crystal-organism-r326-stage > .fx-crystal-organism-r326-canvas';
            const pauseSel='#hero .fx-reference-pause';
            const askSel='#hero .fx-reference-ask';
            const root=document.documentElement,canvas=document.querySelector(canvasSel),link=document.querySelector('link[data-fx-mag-living-balance-r481]');
            const style=canvas?getComputedStyle(canvas):null,rect=canvas?.getBoundingClientRect();
            const pause=document.querySelector(pauseSel),ask=document.querySelector(askSel);
            const askRect=ask?.getBoundingClientRect();
            const hit=askRect?document.elementFromPoint(askRect.left+askRect.width/2,askRect.top+askRect.height/2):null;
            const anims=canvas?.getAnimations?.().map(a=>({name:a.animationName||'',currentTime:typeof a.currentTime==='number'?a.currentTime:null,playState:a.playState,pending:a.pending,startTime:typeof a.startTime==='number'?a.startTime:null}))||[];
            return{
              crystalReady:root.dataset.fxCrystalOrganismR326||'',shapeSync:root.dataset.fxMagShapeSyncR476||'',lifeContract:root.dataset.fxPrimaryMagLifeContractR482||'',life:root.dataset.fxPrimaryMagLifeR482||'',optics:root.dataset.fxPrimaryMagOpticsR482||'',renderer:root.dataset.fxCoreRenderer||'',scheduler:root.dataset.fxCoreScheduler||'',idle:root.dataset.fxCoreIdleRenderR441||'',playback:root.dataset.fxPrimaryMagPlaybackR498||'',paused:root.dataset.fxReferenceMotionPaused||'',balanceLinkExists:link instanceof HTMLLinkElement,balanceHref:link?.href||'',canvasExists:canvas instanceof HTMLCanvasElement,canvasWidth:rect?.width||0,canvasHeight:rect?.height||0,display:style?.display||'',visibility:style?.visibility||'',opacity:style?Number(style.opacity):null,animationName:style?.animationName||'',animationPlayState:style?.animationPlayState||'',filter:style?.filter||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,pauseExists:pause instanceof HTMLButtonElement,pauseDataset:pause?{...pause.dataset}:null,askExists:ask instanceof HTMLButtonElement,askHit:{width:askRect?.width||0,height:askRect?.height||0,owns:Boolean(hit&&ask?.contains(hit))},animations:anims
            };
          }
          async function one(browser,name,viewport,mobile){
            const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
            const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e))); page.on('console',m=>{if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(m.text()))errors.push(m.text());});
            await page.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:60000});
            const target=page.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();
            if(await target.isVisible().catch(()=>false))await target.click();
            await page.waitForTimeout(5000);
            const initial=await page.evaluate(stateScript);
            let semantic={pause:null,resume:null,ask:null};
            if(initial.pauseExists&&initial.canvasExists){
              const before=await page.evaluate(stateScript);
              await page.locator(PAUSE).click(); await page.waitForTimeout(700); const paused=await page.evaluate(stateScript);
              await page.locator(PAUSE).click(); await page.waitForTimeout(700); const resumed=await page.evaluate(stateScript);
              const maxDelta=(a,b)=>{let m=0;for(let i=0;i<Math.min(a.animations.length,b.animations.length);i++){if(typeof a.animations[i].currentTime==='number'&&typeof b.animations[i].currentTime==='number')m=Math.max(m,Math.abs(b.animations[i].currentTime-a.animations[i].currentTime));}return m;};
              semantic.pause={before,paused,delta:maxDelta(before,paused)}; semantic.resume={resumed,delta:maxDelta(paused,resumed)};
            }
            if(initial.askExists){
              const ask=page.locator(ASK); const beforeText=(await ask.textContent())||''; await ask.click(); await page.waitForTimeout(500); const after=await page.evaluate(()=>({htmlDataset:{...document.documentElement.dataset},bodyDataset:{...document.body.dataset},active:document.activeElement?.outerHTML?.slice(0,300)||'',thoughtVisible:Boolean(document.querySelector('.fx-reference-thought.is-visible,[data-fx-reference-thought="visible"],.fx-reference-thought:not([hidden])'))})); semantic.ask={beforeText,after};
            }
            const result={name,initial,semantic,errors}; fs.writeFileSync(`artifacts/r517-diagnostics/r482/${name}.json`,JSON.stringify(result,null,2)); console.log('R482_DIAGNOSTIC',JSON.stringify(result,null,2)); await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await one(browser,'mobile-390x844',{width:390,height:844},true);await one(browser,'desktop-1440x900',{width:1440,height:900},false);await browser.close();})().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Upload R517 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r517-p0-diagnostics-${{ env.AUDITED_SHA }}
          path: artifacts/r517-diagnostics/
          include-hidden-files: true
          retention-days: 30
