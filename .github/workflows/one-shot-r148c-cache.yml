name: One-shot r148c cache publish
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r148c-cache.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish r148c cache token
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text(encoding='utf-8')
          old='rev=20260815-spectacular-reactor-safe-lane-r148b'
          new='rev=20260815-spectacular-reactor-safe-lane-r148c'
          if old not in s and new not in s:
              raise SystemExit('r148b/r148c index token not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then
            echo 'r148c cache already active.'
            exit 0
          fi
          git commit -m '[deploy-production] fix(mag): publish r148c final cache token'
          git push origin HEAD:master
