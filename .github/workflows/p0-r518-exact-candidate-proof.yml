name: P0 R518 exact candidate proof
run-name: Prove exact R518 desktop x5 and mobile x3

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths:
      - '.github/workflows/p0-r518-exact-candidate-proof.yml'

permissions:
  contents: read

env:
  CANDIDATE_REF: p0-r518-apex-buildtmp
  CANDIDATE_SHA: 0c983b25cbabecbdd73c8df760638c0c7554663b

jobs:
  desktop-x5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Start exact local candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r518-desktop.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r518-desktop.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r518-desktop-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r518-desktop-worker.log" || true
          exit 1
      - name: Desktop fresh-browser measurements x5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r518-exact
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          async function one(i){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'});
            const p=await c.newPage();
            await p.addInitScript(()=>{
              window.__m={paint:[],lcp:[],shift:[],long:[]};
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.paint.push({n:e.name,t:e.startTime})}).observe({type:'paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.lcp.push(e.startTime)}).observe({type:'largest-contentful-paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__m.shift.push(e.value)}).observe({type:'layout-shift',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.long.push(e.duration)}).observe({type:'longtask',buffered:true})}catch{}
            });
            const r=await p.goto(`https://formatxsuite.com:8787/?r518_exact_desktop=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3500);
            const s=await p.evaluate(()=>{
              const n=performance.getEntriesByType('navigation')[0];
              return {fcp:window.__m.paint.find(x=>x.n==='first-contentful-paint')?.t??null,lcp:window.__m.lcp.at(-1)??null,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),ttfb:n?.responseStart??null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||'',progress:getComputedStyle(document.documentElement).getPropertyValue('--progress').trim()};
            });
            const out={run:i,status:r?.status()||0,altSvc:r?.headers()['alt-svc']||'',...s};
            await c.close(); await b.close(); return out;
          }
          (async()=>{
            const rows=[]; for(let i=1;i<=5;i++)rows.push(await one(i));
            console.log('DESKTOP_X5',JSON.stringify(rows,null,2));
            fs.writeFileSync('artifacts/r518-exact/desktop-x5.json',JSON.stringify(rows,null,2));
            const failures=rows.filter(r=>r.status!==200||!r.fcp||!r.lcp||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.altSvc.toLowerCase()!=='clear');
            if(failures.length)throw new Error('desktop target failures '+JSON.stringify(failures));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r518-exact-desktop-x5
          path: artifacts/r518-exact/desktop-x5.json
          retention-days: 30

  mobile-x3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Start exact local candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r518-mobile.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r518-mobile.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r518-mobile-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r518-mobile-worker.log" || true
          exit 1
      - name: Mobile 390x844 fresh-browser measurements x3 independent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r518-exact
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const {chromium}=require('playwright');
          async function one(i){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',colorScheme:'dark'});
            const p=await c.newPage();
            await p.addInitScript(()=>{
              window.__m={paint:[],lcp:[],shift:[],long:[]};
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.paint.push({n:e.name,t:e.startTime})}).observe({type:'paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.lcp.push(e.startTime)}).observe({type:'largest-contentful-paint',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__m.shift.push(e.value)}).observe({type:'layout-shift',buffered:true})}catch{}
              try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__m.long.push(e.duration)}).observe({type:'longtask',buffered:true})}catch{}
            });
            const r=await p.goto(`https://formatxsuite.com:8787/?r518_exact_mobile=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3500);
            const s=await p.evaluate(()=>{
              const n=performance.getEntriesByType('navigation')[0];
              return {fcp:window.__m.paint.find(x=>x.n==='first-contentful-paint')?.t??null,lcp:window.__m.lcp.at(-1)??null,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),ttfb:n?.responseStart??null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||''};
            });
            const out={run:i,status:r?.status()||0,altSvc:r?.headers()['alt-svc']||'',...s};
            await c.close(); await b.close(); return out;
          }
          (async()=>{
            const rows=[]; for(let i=1;i<=3;i++)rows.push(await one(i));
            console.log('MOBILE_X3',JSON.stringify(rows,null,2));
            fs.writeFileSync('artifacts/r518-exact/mobile-x3.json',JSON.stringify(rows,null,2));
            const failures=rows.filter(r=>r.status!==200||!r.fcp||!r.lcp||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.altSvc.toLowerCase()!=='clear');
            if(failures.length)throw new Error('mobile target failures '+JSON.stringify(failures));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r518-exact-mobile-x3
          path: artifacts/r518-exact/mobile-x3.json
          retention-days: 30
