name: Verify R502 MAG pause race

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
      - '.github/scripts/validate-live-mag-functional.cjs'
      - '.github/workflows/verify-r502-mag-race.yml'

permissions:
  contents: read

concurrency:
  group: formatx-r502-mag-race
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout R502 source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js
          node --check .github/scripts/validate-live-mag-functional.cjs
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.62.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start exact source site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4177 --directory docs > "$RUNNER_TEMP/r502-mag-http.log" 2>&1 &
          for attempt in $(seq 1 80); do
            curl -fsS http://127.0.0.1:4177/scifi-ui/ >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/r502-mag-http.log"
          exit 1
      - name: Verify PAUSE RESUME ASK fallback and reduced motion
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4177/scifi-ui/
          FORMATX_MAG_EVIDENCE_DIR: artifacts/r502-mag-race
          AUDITED_SHA: ${{ github.sha }}
        run: node .github/scripts/validate-live-mag-functional.cjs
      - name: Upload R502 MAG source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r502-mag-race-${{ github.sha }}
          path: artifacts/r502-mag-race/
          if-no-files-found: warn
          retention-days: 30
