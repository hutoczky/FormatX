name: Validate reference crystal v51 mobile runtime

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v51.js'
      - 'docs/scifi-ui/styles/formatx-core-v51.css'
      - 'docs/scifi-ui/scripts/formatx-premium-finish.js'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/workflows/validate-real3d-mobile-runtime-v22.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  mobile-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate source contracts
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-v51.js
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-v51-mobile"
          cd "$RUNNER_TEMP/core-v51-mobile"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Verify mobile success and resilient WebGL failure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/core-v51-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/core-v51-mobile"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          async function scenario(browser, blockWebgl) {
            const context = await browser.newContext({
              viewport: { width: 384, height: 780 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            if (blockWebgl) {
              await page.addInitScript(() => {
                const original = HTMLCanvasElement.prototype.getContext;
                HTMLCanvasElement.prototype.getContext = function(type, attributes) {
                  if (type === 'webgl2') return null;
                  return original.call(this, type, attributes);
                };
              });
            }
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.evaluate(() => {
              const root = document.documentElement;
              root.classList.remove('fx-intro-pending', 'fx-intro-running', 'fx-intro-managed');
              root.classList.add('fx-intro-complete');
              document.getElementById('formatx-event-horizon')?.setAttribute('hidden', '');
              document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
              scrollTo(0, 0);
            });

            if (!blockWebgl) {
              await page.waitForFunction(() => document.documentElement.dataset.fxCoreV51 === 'ready-v51', null, { timeout: 45000 });
              const state = await page.evaluate(() => ({
                renderer: document.documentElement.dataset.fxCoreRenderer,
                geometry: document.documentElement.dataset.fxCoreReferenceGeometry,
                material: document.documentElement.dataset.fxCoreReferenceMaterial,
                reactor: document.documentElement.dataset.fxCoreInternalReactor,
                responsive: document.documentElement.dataset.fxCoreResponsive,
                performance: document.documentElement.dataset.fxCorePerformance,
                canvasCount: document.querySelectorAll('.fx-core-v51-canvas').length,
                stage: document.querySelector('.fx-core-v51-stage')?.dataset.active,
                width: document.querySelector('.fx-core-v51-canvas')?.getBoundingClientRect().width || 0,
                viewport: innerWidth,
                fallback: document.querySelector('.fx-resilient-core')?.dataset.active || 'absent'
              }));
              assert.equal(state.renderer, 'single-webgl2-reference-crystal-v51');
              assert.equal(state.geometry, 'sharp-four-tip-concave-crystal-v51');
              assert.equal(state.material, 'layered-faceted-refractive-glass-v51');
              assert.equal(state.reactor, 'moving-white-nucleus-concentric-spectral-rings-v51');
              assert.equal(state.responsive, 'desktop-mobile-reference-framing-v51');
              assert.equal(state.performance, 'single-context-adaptive-60-plus-fps');
              assert.equal(state.canvasCount, 1);
              assert.ok(state.width <= state.viewport + 1, `canvas overflow: ${state.width} > ${state.viewport}`);
              assert.notEqual(state.fallback, 'true');
            } else {
              await page.waitForFunction(() => ['context-unavailable','webgl2-unavailable'].includes(document.documentElement.dataset.fxCoreV51), null, { timeout: 45000 });
              await page.waitForFunction(() => document.querySelector('.fx-resilient-core')?.dataset.active === 'true', null, { timeout: 45000 });
              const state = await page.evaluate(() => ({
                core: document.documentElement.dataset.fxCoreV51,
                v51Canvases: document.querySelectorAll('.fx-core-v51-canvas').length,
                fallback: document.querySelector('.fx-resilient-core')?.dataset.active || 'absent'
              }));
              assert.ok(['context-unavailable','webgl2-unavailable'].includes(state.core));
              assert.equal(state.v51Canvases, 0);
              assert.equal(state.fallback, 'true');
            }
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader'] });
            await scenario(browser, false);
            await scenario(browser, true);
            await browser.close();
            console.log('PASS: v51 mobile reference crystal stays bounded and resilient fallback activates when WebGL2 is unavailable.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Publish mobile runtime status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Reference crystal v51 mobile runtime and fallback passed'; else state=failure; description='Reference crystal v51 mobile runtime validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX v51 mobile runtime' -f description="$description" -f target_url="$TARGET_URL"
