name: Validate responsive cinematic MAG runtime
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/scripts/formatx-signature-system-r185.js'
      - 'docs/scifi-ui/scripts/formatx-premium-finish.js'
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - 'docs/scifi-ui/scripts/interaction-genome-export-stability.js'
      - 'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
      - 'docs/scifi-ui/styles/formatx-mobile-control-stability-r320.css'
      - 'docs/scifi-ui/styles/formatx-signature-explicit-r320.css'
      - 'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
      - '.github/scripts/validate-real3d-core-v20.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/workflows/validate-real3d-mobile-runtime-v22.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  responsive-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate current r317 r321 r325 source contracts
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node --check docs/scifi-ui/scripts/formatx-control-owner-r268.js
          node --check docs/scifi-ui/scripts/formatx-signature-system-r185.js
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-responsive" && cd "$RUNNER_TEMP/core-responsive"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify r317 r321 WebGL interaction controls and WebGL1 fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/core-responsive-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/core-responsive"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          async function scenario(browser,blockWebGL2){
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await ctx.newPage();
            if(blockWebGL2)await page.addInitScript(()=>{const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,attrs){if(type==='webgl2')return null;return original.call(this,type,attrs);};});
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return d.fxCoreMobileR317==='ready-v69'
                && d.fxCoreRendererSelection==='modern-r317-primary'
                && d.fxCoreSoftlightR318==='shader-tuned-r319'
                && d.fxCoreSoftlightOwnershipR321==='native-r317-source-no-prototype-patch'
                && d.fxMobileReferenceLayout==='ready-v1'
                && d.fxSignatureSystem==='r325-inert-hidden-architecture'
                && d.fxSignatureTrigger==='retired-r320-no-core-hitlayer'
                && window.FormatXCoreMobileV69?.version==='reference-crystal-webgl-r317-modern-flat-normal-fresnel';
            },null,{timeout:45000});
            await page.waitForTimeout(800);
            const before=await page.evaluate(()=>({energy:Number(window.FormatXCoreMobileV69?.energy||0)}));
            await page.touchscreen.tap(195,330);await page.waitForTimeout(360);
            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const api=window.FormatXCoreMobileV69;
              const stage=document.querySelector('#hero .fx-core-r317-stage');
              const canvas=stage?.querySelector('.fx-core-r317-canvas');
              const box=canvas?.getBoundingClientRect();
              const genome=document.querySelector('.fx-genome-launcher');
              const sound=document.querySelector('.fx-three-sound');
              const soundBox=sound?.getBoundingClientRect();
              const soundStyle=sound?getComputedStyle(sound):null;
              const gl2=canvas?.getContext('webgl2');
              const gl=gl2||canvas?.getContext('webgl');
              const architecture=document.querySelector('.fx-signature-architecture');
              return{
                version:api?.version||'',quality:api?.quality||'',scheduler:api?.scheduler||'',
                selection:root.dataset.fxCoreRendererSelection||'',softlight:root.dataset.fxCoreSoftlightR318||'',
                rim:root.dataset.fxCoreRimProfileR318||'',glow:root.dataset.fxCoreGlowProfileR318||'',
                softlightOwner:root.dataset.fxCoreSoftlightOwnershipR321||'',
                controlStability:root.dataset.fxControlStabilityR321||'',
                r317:root.dataset.fxCoreMobileR317||'',layout:root.dataset.fxMobileReferenceLayout||'',
                signature:root.dataset.fxSignatureSystem||'',signatureTrigger:root.dataset.fxSignatureTrigger||'',
                signatureUsability:root.dataset.fxSignatureUsability||'',signatureCsp:root.dataset.fxSignatureCsp||'',
                signatureOpen:root.classList.contains('fx-signature-open'),signatureHitLayers:document.querySelectorAll('.fx-signature-core-trigger').length,
                signatureInert:architecture?.hasAttribute('inert')||false,signatureHidden:architecture?.getAttribute('aria-hidden')||'',
                stageCount:document.querySelectorAll('#hero .fx-core-r317-stage').length,
                canvasCount:document.querySelectorAll('#hero .fx-core-r317-canvas').length,
                width:box?.width||0,height:box?.height||0,vw:innerWidth,vh:innerHeight,
                gl:Boolean(gl),webgl2:Boolean(gl2),glError:gl?.getError(),
                energy:Number(api?.energy||0),renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),
                heading:Boolean(document.querySelector('.fx-reference-heading')),
                proof:Boolean(document.querySelector('.fx-reference-proof')),
                rail:Boolean(document.querySelector('.fx-reference-rail')),
                genomeDisplay:genome?getComputedStyle(genome).display:'absent',
                soundDisplay:soundStyle?.display||'absent',soundVisibility:soundStyle?.visibility||'absent',
                soundOpacity:Number(soundStyle?.opacity||0),soundWidth:soundBox?.width||0,soundHeight:soundBox?.height||0
              };
            });
            assert.equal(state.version,'reference-crystal-webgl-r317-modern-flat-normal-fresnel');
            assert.equal(state.quality,'modern-flat-normal-fresnel-microfacet-r317');
            assert.equal(state.scheduler,'bounded-interaction-bursts-no-idle-raf');
            assert.equal(state.selection,'modern-r317-primary');
            assert.equal(state.softlight,'shader-tuned-r319');
            assert.equal(state.rim,'broader-softer-low-intensity-fresnel');
            assert.equal(state.glow,'balanced-mobile-perimeter-and-core');
            assert.equal(state.softlightOwner,'native-r317-source-no-prototype-patch');
            assert.equal(state.controlStability,'direct-structure-observer-no-feedback');
            assert.equal(state.r317,'ready-v69');assert.equal(state.layout,'ready-v1');
            assert.equal(state.signature,'r325-inert-hidden-architecture');
            assert.equal(state.signatureTrigger,'retired-r320-no-core-hitlayer');
            assert.equal(state.signatureUsability,'explicit-disclosure-focus-inert-r325');
            assert.equal(state.signatureCsp,'external-css-no-inline-style-r325');
            assert.equal(state.signatureOpen,false);assert.equal(state.signatureHitLayers,0);
            assert.equal(state.signatureInert,true);assert.equal(state.signatureHidden,'true');
            assert.equal(state.stageCount,1);assert.equal(state.canvasCount,1);assert.equal(state.gl,true);assert.equal(state.glError,0);
            assert.equal(state.webgl2,!blockWebGL2);
            assert.equal(state.heading,true);assert.equal(state.proof,true);assert.equal(state.rail,true);
            assert.ok(state.width<=state.vw+1&&state.height<=state.vh+1,JSON.stringify(state));
            assert.ok(state.energy>=before.energy,JSON.stringify({before,after:state}));
            assert.ok(state.renderMs<16.67,JSON.stringify(state));
            assert.ok(['none','absent'].includes(state.genomeDisplay));
            assert.notEqual(state.soundDisplay,'none');assert.notEqual(state.soundVisibility,'hidden');assert.ok(state.soundOpacity>.02);
            assert.ok(state.soundWidth>=44&&state.soundHeight>=44,JSON.stringify(state));
            const sound=page.locator('.fx-three-sound:visible').first();
            const pause=page.locator('.fx-reference-pause:visible').first();
            await sound.click({trial:true,timeout:5000});
            await pause.click({trial:true,timeout:5000});
            const pauseBox=await pause.boundingBox();assert.ok(pauseBox);
            await page.touchscreen.tap(pauseBox.x+pauseBox.width/2,pauseBox.y+pauseBox.height/2);await page.waitForTimeout(100);
            assert.equal(await pause.getAttribute('data-paused'),'true');
            await page.touchscreen.tap(pauseBox.x+pauseBox.width/2,pauseBox.y+pauseBox.height/2);await page.waitForTimeout(100);
            assert.equal(await pause.getAttribute('data-paused'),'false');
            await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await scenario(browser,false);await scenario(browser,true);await browser.close();console.log('PASS: r317 modern WebGL MAG, r321 source-owned softer rim/glow, r325 inert architecture, stable actionable controls, render budget and WebGL1 fallback passed.');})().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Publish responsive runtime status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r317/r321/r325 mobile MAG runtime and controls passed'; else state=failure; description='r317/r321/r325 responsive runtime failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX v69 responsive runtime' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
