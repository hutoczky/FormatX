name: Validate responsive cinematic MAG runtime
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-premium-finish.js'
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - 'docs/scifi-ui/scripts/interaction-genome-export-stability.js'
      - 'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
      - 'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/workflows/validate-real3d-mobile-runtime-v22.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  responsive-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate current r99 source contracts
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-responsive" && cd "$RUNNER_TEMP/core-responsive"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify native r99 WebGL animation interaction layout performance and WebGL1 fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/core-responsive-server.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/core-responsive"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          async function scenario(browser,blockWebGL2){
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            const page=await ctx.newPage();
            if(blockWebGL2)await page.addInitScript(()=>{const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,attrs){if(type==='webgl2')return null;return original.call(this,type,attrs);};});
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCoreMobileR99==='ready-v69'&&document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1',null,{timeout:45000});
            await page.waitForTimeout(1200);
            const before=await page.evaluate(()=>({energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])]}));
            await page.touchscreen.tap(195,330);await page.waitForTimeout(360);
            const state=await page.evaluate(()=>{const root=document.documentElement,canvas=document.querySelector('#hero .hero-space > .fx-core-mobile-v55-stage > .fx-core-mobile-v55-canvas'),box=canvas?.getBoundingClientRect(),genome=document.querySelector('.fx-genome-launcher'),sound=document.querySelector('.fx-three-sound'),soundBox=sound?.getBoundingClientRect(),soundStyle=sound?getComputedStyle(sound):null,pause=document.querySelector('.fx-reference-pause'),pauseBox=pause?.getBoundingClientRect(),gl2=canvas?.getContext('webgl2'),gl=gl2||canvas?.getContext('webgl'),soundHit=soundBox?document.elementFromPoint(soundBox.x+soundBox.width/2,soundBox.y+soundBox.height/2):null;return{renderer:root.dataset.fxCoreRenderer,geometry:root.dataset.fxCoreReferenceGeometry,material:root.dataset.fxCoreReferenceMaterial,interaction:root.dataset.fxCoreInteractionVisual,verified:root.dataset.fxCoreFrameVerified,gpu:root.dataset.fxGpuCapability,v55:root.dataset.fxCoreMobileV55,v69:root.dataset.fxCoreMobileV69,r99:root.dataset.fxCoreMobileR99,layout:root.dataset.fxMobileReferenceLayout,canvases:document.querySelectorAll('.fx-core-mobile-v55-canvas').length,legacyStages:document.querySelectorAll('.fx-core-mesh3d-stage,.fx-core-fracture3d-stage,.fx-transcend-shell[data-fx-native-apex="true"]').length,width:box?.width||0,height:box?.height||0,vw:innerWidth,vh:innerHeight,gl:Boolean(gl),glError:gl?.getError(),energy:Number(window.FormatXCoreMobileV69?.energy||0),position:[...(window.FormatXCoreCinematic?.corePosition||[])],renderMs:Number(root.dataset.fxCoreRenderMs||Infinity),heading:Boolean(document.querySelector('.fx-reference-heading')),proof:Boolean(document.querySelector('.fx-reference-proof')),rail:Boolean(document.querySelector('.fx-reference-rail')),genomeDisplay:genome?getComputedStyle(genome).display:'absent',soundDisplay:soundStyle?.display||'absent',soundVisibility:soundStyle?.visibility||'absent',soundOpacity:Number(soundStyle?.opacity||0),soundWidth:soundBox?.width||0,soundHeight:soundBox?.height||0,soundTopMost:Boolean(sound&&soundHit&&sound.contains(soundHit)),pauseTopMost:pauseBox?document.elementFromPoint(pauseBox.x+pauseBox.width/2,pauseBox.y+pauseBox.height/2)===pause:false};});
            assert.equal(state.renderer,'single-webgl-luminous-crystal-r99');
            assert.equal(state.geometry,'reference-deep-concave-four-point-size-lock-r99');
            assert.equal(state.material,'luminous-faceted-iceglass-caustic-r99');
            assert.equal(state.interaction,'touch-pointer-breathing-spectral-refraction-r99');
            assert.equal(state.verified,'visible-native-3d-r99');
            assert.equal(state.gpu,blockWebGL2?'webgl1':'webgl2');
            assert.equal(state.v55,'ready-v55');assert.equal(state.v69,'ready-v69');assert.equal(state.r99,'ready-v69');assert.equal(state.layout,'ready-v1');
            assert.equal(state.canvases,1);assert.equal(state.legacyStages,0);assert.equal(state.gl,true);assert.equal(state.glError,0);
            assert.equal(state.heading,true);assert.equal(state.proof,true);assert.equal(state.rail,true);
            assert.ok(state.width<=state.vw+1&&state.height<=state.vh+1,JSON.stringify(state));
            assert.ok(state.energy>=before.energy,JSON.stringify({before,after:state}));assert.equal(state.position.length,3);assert.notDeepEqual(state.position,before.position);
            assert.ok(state.renderMs<16.67,JSON.stringify(state));assert.ok(['none','absent'].includes(state.genomeDisplay));assert.notEqual(state.soundDisplay,'none');assert.notEqual(state.soundVisibility,'hidden');assert.ok(state.soundOpacity>.02);assert.ok(state.soundWidth>=44&&state.soundHeight>=44,JSON.stringify(state));assert.equal(state.soundTopMost,true);assert.equal(state.pauseTopMost,true);
            const pauseBox=await page.locator('.fx-reference-pause').first().boundingBox();assert.ok(pauseBox);await page.touchscreen.tap(pauseBox.x+pauseBox.width/2,pauseBox.y+pauseBox.height/2);await page.waitForTimeout(80);const pausedFrom=await page.evaluate(()=>[document.querySelector('.fx-reference-pause')?.dataset.paused,[...(window.FormatXCoreCinematic?.corePosition||[])]]);await page.waitForTimeout(360);const pausedTo=await page.evaluate(()=>[document.querySelector('.fx-reference-pause')?.dataset.paused,[...(window.FormatXCoreCinematic?.corePosition||[])]]);assert.equal(pausedFrom[0],'true');assert.equal(pausedTo[0],'true');assert.deepEqual(pausedTo[1],pausedFrom[1]);await page.touchscreen.tap(pauseBox.x+pauseBox.width/2,pauseBox.y+pauseBox.height/2);await page.waitForTimeout(80);assert.equal(await page.locator('.fx-reference-pause').first().getAttribute('data-paused'),'false');
            await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await scenario(browser,false);await scenario(browser,true);await browser.close();console.log('PASS: current r99 native WebGL layout, animation, interaction, visible SOUND control, render budget and WebGL1 fallback passed.');})().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Publish responsive runtime status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Current r99 native WebGL runtime and render budget passed'; else state=failure; description='Current r99 responsive runtime failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX v69 responsive runtime' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
