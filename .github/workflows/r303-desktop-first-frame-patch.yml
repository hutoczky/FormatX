name: One-shot r303 desktop first-frame patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r303-desktop-first-frame-patch.yml'

permissions:
  contents: write

jobs:
  patch-desktop-first-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed final desktop hero geometry in critical CSS
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          target = Path('docs/scifi-ui/styles/formatx-critical-core-r227.css')
          text = target.read_text(encoding='utf-8')
          marker = '/* ===== r303 DESKTOP FIRST-FRAME GEOMETRY ===== */'
          if marker not in text:
              text += r'''

/* ===== r303 DESKTOP FIRST-FRAME GEOMETRY ===== */
/* The r244 desktop frame is final geometry, so reserve it in the existing
   render-blocking bundle instead of repainting the hero after deferred JS sets
   data-fx-reference-production-r244=desktop. This removes the real CLS source
   without adding another request or changing any Lighthouse-only behavior. */
@media (min-width:901px) {
  html body.living-architecture main#main-content section#hero.scene.hero {
    position:relative!important;display:block!important;box-sizing:border-box!important;
    width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;
    margin:0!important;padding:36px 0 92px!important;overflow:visible!important;isolation:isolate!important;
  }
  html body.living-architecture #hero > .hero-grid {
    position:relative!important;display:grid!important;
    grid-template-columns:minmax(0,.86fr) minmax(430px,1.14fr)!important;
    grid-template-rows:clamp(520px,42vw,620px) minmax(258px,auto)!important;
    grid-template-areas:"copy space" "heading proof"!important;
    align-items:center!important;box-sizing:border-box!important;
    width:min(1320px,calc(100% - 80px))!important;max-width:1320px!important;
    height:auto!important;min-height:808px!important;margin:0 auto!important;padding:0!important;
    gap:30px 56px!important;overflow:visible!important;
  }
  html body.living-architecture #hero .hero-grid > .hero-copy {
    grid-area:copy!important;position:relative!important;inset:auto!important;z-index:12!important;
    display:block!important;align-self:center!important;box-sizing:border-box!important;
    width:100%!important;min-width:0!important;max-width:580px!important;height:auto!important;
    min-height:0!important;margin:0!important;padding:0!important;overflow:visible!important;
    clip:auto!important;clip-path:none!important;white-space:normal!important;opacity:1!important;
    visibility:visible!important;transform:none!important;
  }
  html body.living-architecture #hero .hero-copy .kicker {
    margin:0 0 14px!important;font:700 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace!important;
    letter-spacing:.28em!important;
  }
  html body.living-architecture #hero .fx-category-definition {
    position:relative!important;inset:auto!important;box-sizing:border-box!important;width:100%!important;
    max-width:560px!important;min-height:62px!important;margin:0 0 24px!important;padding:12px 14px!important;
    font:400 13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif!important;
    white-space:normal!important;overflow-wrap:anywhere!important;
  }
  html body.living-architecture #hero #hero-title {
    display:grid!important;width:100%!important;max-width:100%!important;margin:0!important;
    line-height:1!important;white-space:normal!important;
  }
  html body.living-architecture #hero .hero-title-main {
    display:block!important;max-width:100%!important;font-size:clamp(64px,6.25vw,92px)!important;
    line-height:.88!important;letter-spacing:-.075em!important;white-space:nowrap!important;
  }
  html body.living-architecture #hero .hero-title-sub {
    justify-self:end!important;margin:7px 2px 0 0!important;font-size:clamp(27px,2.7vw,40px)!important;
    line-height:1!important;letter-spacing:.12em!important;white-space:nowrap!important;
  }
  html body.living-architecture #hero .hero-lead {
    width:100%!important;max-width:560px!important;margin:24px 0 0!important;
    font:400 clamp(16px,1.25vw,18px)/1.55 system-ui,-apple-system,"Segoe UI",sans-serif!important;
    white-space:normal!important;overflow-wrap:anywhere!important;
  }
  html body.living-architecture #hero .fx-method-inline {
    display:flex!important;flex-wrap:wrap!important;width:100%!important;margin:14px 0 0!important;
    padding:0!important;gap:7px 18px!important;list-style:none!important;
    font:500 11px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;
  }
  html body.living-architecture #hero .hero-actions {
    display:flex!important;flex-wrap:wrap!important;width:100%!important;margin:22px 0 0!important;gap:10px!important;
  }
  html body.living-architecture #hero .hero-actions .button {
    box-sizing:border-box!important;min-height:48px!important;max-width:100%!important;padding:0 18px!important;
    white-space:normal!important;text-align:center!important;line-height:1.25!important;
  }
  html body.living-architecture #hero .hero-actions #hero-download {flex:1 1 250px!important;}
  html body.living-architecture #hero .hero-actions .button:not(#hero-download) {flex:1 1 180px!important;}
  html body.living-architecture #hero .hero-facts {display:none!important;visibility:hidden!important;pointer-events:none!important;}
  html body.living-architecture #hero .hero-grid > .hero-space {
    grid-area:space!important;position:relative!important;inset:auto!important;align-self:center!important;
    box-sizing:border-box!important;width:100%!important;max-width:100%!important;
    height:clamp(520px,42vw,620px)!important;min-height:520px!important;max-height:620px!important;
    margin:0!important;padding:0!important;overflow:visible!important;transform:none!important;
  }
  html body.living-architecture #hero .fx-reference-heading {
    grid-area:heading!important;position:relative!important;inset:auto!important;align-self:center!important;
    width:100%!important;height:24px!important;min-height:24px!important;margin:0!important;
    opacity:1!important;visibility:visible!important;transform:none!important;
  }
  html body.living-architecture #hero .fx-reference-proof {
    grid-area:proof!important;position:relative!important;inset:auto!important;align-self:start!important;
    box-sizing:border-box!important;width:100%!important;height:auto!important;min-height:258px!important;
    margin:0!important;opacity:1!important;visibility:visible!important;transform:none!important;
  }
}
'''
          target.write_text(text, encoding='utf-8')
          Path('.github/workflows/r303-desktop-first-frame-patch.yml').unlink()
          PY

          git config user.name 'FormatX first-frame patch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-critical-core-r227.css .github/workflows/r303-desktop-first-frame-patch.yml
          git diff --cached --check
          git commit -m 'Reserve final desktop hero geometry in critical first paint'
          git push origin HEAD:master
