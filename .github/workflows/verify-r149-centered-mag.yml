name: Verify r149 centered MAG
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-r149-centered-mag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r149" && cd "$RUNNER_TEMP/r149"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify centered optics, compact safe lane, touch and gyro
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r149"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:412,height:760},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await context.addInitScript(()=>{
              class MockDeviceOrientationEvent extends Event{
                constructor(type,init={}){super(type);this.alpha=Number(init.alpha||0);this.beta=Number(init.beta||0);this.gamma=Number(init.gamma||0);this.absolute=Boolean(init.absolute);}
              }
              try{Object.defineProperty(window,'DeviceOrientationEvent',{value:MockDeviceOrientationEvent,configurable:true});}catch(_){ }
            });
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(`https://formatxsuite.com/?verify_r149=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return String(d.fxLiveMotionR147||'').includes('r149')&&
                     d.fxLiveMotionVisualR149==='centered-clipped-reactor'&&
                     d.fxLiveLayerAnchorR149==='detail-canvas'&&
                     d.fxLiveSafeLaneR147==='active-r149';
            },null,{timeout:90000});
            await page.waitForTimeout(900);

            const frameA=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            await page.waitForTimeout(900);
            const frameB=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            assert.notEqual(frameA,frameB,'idle optical animation is not changing');

            const state=await page.evaluate(()=>{
              const q=s=>{const e=document.querySelector(s),r=e?.getBoundingClientRect(),c=e?getComputedStyle(e):null;return e&&r&&c?{x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2),display:c.display,visibility:c.visibility,opacity:c.opacity,overflow:c.overflow,filter:c.filter,clipPath:c.clipPath}:null};
              const root=document.documentElement;
              const detail=q('#hero .fx-core-detail-r122');
              const layer=q('#hero .fx-core-live-r147-layer');
              const heading=q('#hero .fx-reference-heading');
              const tail=q('#hero .fx-core-reference-tail-r143');
              const copy=q('#hero .hero-copy');
              const ring=q('#hero .hero-ring');
              return{
                version:root.dataset.fxLiveMotionR147,
                visual:root.dataset.fxLiveMotionVisualR149,
                anchor:root.dataset.fxLiveLayerAnchorR149,
                bounds:root.dataset.fxLiveLayerBoundsR149,
                safe:root.dataset.fxLiveSafeLaneR147,
                gap:parseFloat(root.dataset.fxLiveSafeGapR147||'0'),
                detail,layer,heading,tail,copy,ring,
                layers:document.querySelectorAll('#hero .fx-core-live-r147-layer').length,
                glError:(()=>{const c=document.querySelector('.fx-core-mobile-v55-canvas');const gl=c?.getContext('webgl2')||c?.getContext('webgl');return gl?.getError()})()
              };
            });
            console.log('R149 LIVE STATE',JSON.stringify(state));
            assert.ok(String(state.version).includes('r149'));
            assert.equal(state.visual,'centered-clipped-reactor');
            assert.equal(state.anchor,'detail-canvas');
            assert.equal(state.layers,1,'duplicate live optical layer');
            assert.ok(state.detail&&state.layer,'detail/layer missing');
            assert.ok(Math.abs(state.detail.x-state.layer.x)<=2.1,JSON.stringify({detail:state.detail,layer:state.layer}));
            assert.ok(Math.abs(state.detail.y-state.layer.y)<=2.1,JSON.stringify({detail:state.detail,layer:state.layer}));
            assert.ok(Math.abs(state.detail.w-state.layer.w)<=2.1,JSON.stringify({detail:state.detail,layer:state.layer}));
            assert.ok(Math.abs(state.detail.h-state.layer.h)<=2.1,JSON.stringify({detail:state.detail,layer:state.layer}));
            assert.equal(state.layer.overflow,'hidden');
            assert.ok(state.ring&&state.ring.display==='none','legacy top-left hero ring is visible');
            assert.ok(state.copy&&state.copy.w<=1.1&&state.copy.h<=1.1,'legacy hero copy still occupies visual space');
            assert.equal(state.copy.opacity,'0');
            assert.ok(state.gap>=34&&state.gap<=64,`safe gap outside compact target: ${state.gap}`);
            if(state.heading&&state.tail){
              const actual=state.heading.y-(state.tail.y+state.tail.h);
              assert.ok(actual>=34&&actual<=68,`actual heading gap outside target: ${actual}`);
            }
            assert.notEqual(state.detail.filter,'none','crystal luminance animation is inactive');
            assert.equal(state.glError,0);

            const beforeTouch=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            await page.touchscreen.tap(206,360);await page.waitForTimeout(360);
            const touch=await page.evaluate(()=>({frame:document.documentElement.dataset.fxLiveMotionFrameR147||'',interaction:document.documentElement.dataset.fxLiveMotionInteractionR147||'',vector:document.documentElement.dataset.fxLiveMotionVectorR147||''}));
            assert.equal(touch.interaction,'active-r149');
            assert.notEqual(touch.frame,beforeTouch,'touch did not affect the reactor');
            assert.ok(touch.vector.length>8);

            await page.waitForTimeout(1000);
            await page.evaluate(async()=>{
              const fire=(beta,gamma)=>window.dispatchEvent(new DeviceOrientationEvent('deviceorientation',{beta,gamma,alpha:0,absolute:false}));
              for(let i=0;i<10;i++){fire(45,0);await new Promise(r=>setTimeout(r,24));}
              for(let i=0;i<18;i++){fire(57,14);await new Promise(r=>setTimeout(r,28));}
            });
            await page.waitForTimeout(900);
            const gyro=await page.evaluate(()=>({state:document.documentElement.dataset.fxCoreGyroState,input:document.documentElement.dataset.fxCoreGyroInput,frame:document.documentElement.dataset.fxLiveMotionFrameR147}));
            console.log('R149 GYRO',JSON.stringify(gyro));
            assert.equal(gyro.state,'active');
            assert.ok(typeof gyro.input==='string'&&gyro.input!=='0.000,0.000');
            assert.ok(String(gyro.frame).endsWith('gyro'),`optical layer did not select gyro source: ${gyro.frame}`);

            await page.screenshot({path:'formatx-r149-live-mobile.png',fullPage:true});
            assert.ok(fs.statSync('formatx-r149-live-mobile.png').size>20000);
            assert.deepEqual(errors,[],`page errors: ${errors.join(' | ')}`);
            await browser.close();
            console.log('PASS: r149 centered/clipped optics, compact safe lane, hidden legacy overlays, touch and gyro are live.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload r149 live capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r149-live-mobile-${{ github.run_id }}
          path: ${{ runner.temp }}/r149/formatx-r149-live-mobile.png
          retention-days: 14
