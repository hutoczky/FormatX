name: Validate R531 preloader integration

on:
  push:
    branches:
      - chatgpt/r530-lightweight-preloader-v2
    paths:
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - '.github/workflows/validate-r531-preloader-integration.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser runtime
        run: npm install --no-save --no-package-lock playwright@1.62.0
      - name: Resolve Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Validate preloader source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('docs/scifi-ui/scripts/formatx-event-horizon.js','utf8');
          const required=[
            "fxPreloaderContractR531='visual-only-mag-independent-bounded'",
            "LIVING CORE STARTING",
            "ÉLŐ MAG INDÍTÁSA",
            "RENDSZER KÉSZ",
            "pointer-events",
            "prefers-reduced-motion:reduce",
            "PRELOADER_MIN_MS",
            "PRELOADER_MAX_MS",
            "formatx:preloadercomplete"
          ];
          for(const token of required)if(!s.includes(token))throw new Error('missing preloader contract token: '+token);
          if(s.includes('formatx:referencepause'))throw new Error('manual pause event restored');
          if(/addEventListener\(['\"](?:click|pointerdown|touchstart|keydown|scroll)['\"][\s\S]{0,300}runPreloader/.test(s))throw new Error('preloader waits for user intent');
          console.log('PASS source: visual-only, bounded, no manual pause/user-intent start');
          NODE
      - name: Start exact source site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4187 --directory docs > "$RUNNER_TEMP/r531-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4187/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/r531-http.log"
          exit 1
      - name: Prove loader and MAG lifecycle
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/validate-r531.cjs" <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const URL='http://127.0.0.1:4187/scifi-ui/index.html?lang=hu&r531='+Date.now();
          const CANVAS='#hero .fx-crystal-organism-r326-canvas';
          const STAGE='#hero .fx-crystal-organism-r326-stage';
          const PAUSE='.fx-reference-pause';
          const ASK='.fx-reference-ask';
          const SOUND='.fx-three-sound';
          function visibleData(el){if(!el)return null;const s=getComputedStyle(el),r=el.getBoundingClientRect();return {display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1),position:s.position,pointerEvents:s.pointerEvents,zIndex:s.zIndex,backgroundImage:s.backgroundImage,backgroundColor:s.backgroundColor,left:r.left,top:r.top,width:r.width,height:r.height,hidden:el.hidden,ariaHidden:el.getAttribute('aria-hidden')};}
          async function runCase(browser,{name,viewport,isMobile,hasTouch,reducedMotion,maxMs}){
            const context=await browser.newContext({viewport,isMobile,hasTouch,reducedMotion,locale:'hu-HU'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/^Failed to load resource:/i.test(m.text()))errors.push('console:'+m.text());});
            await page.addInitScript(() => {
              window.__r531={nav:0,preloaderVisible:null,startup:null,magReady:null,release:null};
              const stamp=()=>{
                const root=document.documentElement, p=window.__r531;if(!root||!p)return;
                const now=performance.now();
                const overlay=document.getElementById('formatx-event-horizon');
                if(p.preloaderVisible==null && root.dataset.fxPreloaderR531==='active' && overlay && !overlay.hidden)p.preloaderVisible=now;
                const startup=root.dataset.fxMagStartupContractR530==='living-core-autostart-navigation-owned'||root.dataset.fxCurrentMagRequestR530==='navigation-owned'||String(root.dataset.fxCurrentMagRequestR530||'').startsWith('navigation-owned');
                if(p.startup==null&&startup)p.startup=now;
                if(p.magReady==null&&root.dataset.fxCrystalOrganismR326==='ready')p.magReady=now;
                if(p.release==null&&root.dataset.fxPreloaderR531==='done')p.release=now;
              };
              new MutationObserver(stamp).observe(document,{subtree:true,childList:true,attributes:true});
              addEventListener('DOMContentLoaded',stamp,{once:true});
              addEventListener('load',stamp,{once:true});
            });
            await page.goto(URL+'&case='+encodeURIComponent(name),{waitUntil:'commit',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxPreloaderR531==='active',{timeout:10000});
            const active=await page.evaluate(({vw,vh})=>{const o=document.getElementById('formatx-event-horizon');const d=o?(()=>{const s=getComputedStyle(o),r=o.getBoundingClientRect();return {display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1),position:s.position,pointerEvents:s.pointerEvents,zIndex:s.zIndex,backgroundImage:s.backgroundImage,backgroundColor:s.backgroundColor,left:r.left,top:r.top,width:r.width,height:r.height,hidden:o.hidden,ariaHidden:o.getAttribute('aria-hidden')};})():null;return {overlay:d,root:{preloader:document.documentElement.dataset.fxPreloaderR531||'',startup:document.documentElement.dataset.fxMagStartupContractR530||'',request:document.documentElement.dataset.fxCurrentMagRequestR530||''},viewport:{width:vw,height:vh}};},{vw:viewport.width,vh:viewport.height});
            assert.ok(active.overlay,`${name}: overlay missing`);
            assert.equal(active.overlay.hidden,false,`${name}: overlay hidden while active`);
            assert.equal(active.overlay.ariaHidden,'true',`${name}: overlay must be aria-hidden`);
            assert.equal(active.overlay.pointerEvents,'none',`${name}: overlay must be nonblocking`);
            assert.equal(active.overlay.position,'fixed',`${name}: overlay is not a fixed visual cover: ${JSON.stringify(active.overlay)}`);
            assert.ok(Math.abs(active.overlay.left)<=2&&Math.abs(active.overlay.top)<=2,`${name}: overlay not pinned to viewport origin`);
            assert.ok(active.overlay.width>=viewport.width-2&&active.overlay.height>=viewport.height-2,`${name}: overlay does not cover viewport: ${JSON.stringify(active.overlay)}`);
            assert.ok(Number.parseInt(active.overlay.zIndex,10)>=10000,`${name}: overlay stacking too low: ${active.overlay.zIndex}`);
            await page.waitForFunction(()=>{const r=document.documentElement;return r.dataset.fxMagStartupContractR530==='living-core-autostart-navigation-owned'||String(r.dataset.fxCurrentMagRequestR530||'').startsWith('navigation-owned');},{timeout:10000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxPreloaderR531==='done',{timeout:maxMs+1600});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready',{timeout:20000});
            const done=await page.evaluate(({CANVAS,STAGE,PAUSE,ASK,SOUND})=>{const vis=n=>{if(!n)return false;const s=getComputedStyle(n),r=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.15&&r.width>0&&r.height>0};return {times:window.__r531,release:document.documentElement.dataset.fxPreloaderReleaseR531||'',preloader:document.documentElement.dataset.fxPreloaderR531||'',canvasCount:document.querySelectorAll(CANVAS).length,stageCount:document.querySelectorAll(STAGE).length,pauseCount:document.querySelectorAll(PAUSE).length,canvasVisible:vis(document.querySelector(CANVAS)),askVisible:vis(document.querySelector(ASK)),soundVisible:vis(document.querySelector(SOUND)),overflow:document.documentElement.scrollWidth-innerWidth};},{CANVAS,STAGE,PAUSE,ASK,SOUND});
            assert.equal(done.preloader,'done',`${name}: preloader not released`);
            assert.ok(done.times.preloaderVisible!=null,`${name}: preloader was never visibly active`);
            assert.ok(done.times.startup!=null,`${name}: MAG startup marker missing`);
            assert.ok(done.times.release!=null,`${name}: release timing missing`);
            assert.ok(done.times.startup<=done.times.release,`${name}: loader released before MAG navigation startup: ${JSON.stringify(done.times)}`);
            assert.ok(done.times.release-done.times.preloaderVisible<=maxMs+220,`${name}: preloader exceeded hard bound: ${JSON.stringify(done.times)}`);
            if(reducedMotion==='reduce')assert.ok(done.times.release-done.times.preloaderVisible<=500,`${name}: reduced-motion release too slow`);
            assert.equal(done.canvasCount,1,`${name}: expected one canvas`);assert.equal(done.stageCount,1,`${name}: expected one stage`);assert.equal(done.pauseCount,0,`${name}: manual PAUSE reappeared`);assert.ok(done.canvasVisible,`${name}: MAG not visible after release`);assert.ok(done.askVisible&&done.soundVisible,`${name}: ASK/SOUND not visible after release`);assert.ok(done.overflow<=2,`${name}: horizontal overflow ${done.overflow}`);assert.deepEqual(errors,[],`${name}: browser errors ${JSON.stringify(errors)}`);
            console.log('R531_PASS',name,JSON.stringify({active,done}));
            await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});try{await runCase(browser,{name:'desktop-normal',viewport:{width:1440,height:900},isMobile:false,hasTouch:false,reducedMotion:'no-preference',maxMs:820});await runCase(browser,{name:'mobile-normal',viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'no-preference',maxMs:680});await runCase(browser,{name:'desktop-reduced',viewport:{width:1440,height:900},isMobile:false,hasTouch:false,reducedMotion:'reduce',maxMs:820});await runCase(browser,{name:'mobile-reduced',viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'reduce',maxMs:680});}finally{await browser.close();}})().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
          node "$RUNNER_TEMP/validate-r531.cjs"
