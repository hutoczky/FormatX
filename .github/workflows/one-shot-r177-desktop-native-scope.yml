name: One-shot r177 desktop native layout scope
# rerun: robust-fragment-patch-20260816
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r177-desktop-native-scope.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep mobile reference layout mobile-only and desktop native from first paint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Remove the obsolete desktop reference-layout block from the mobile stylesheet.
          cp=Path('docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css')
          css=cp.read_text()
          marker='@media (min-width:901px) {'
          while marker in css:
              start=css.index(marker)
              brace=css.index('{',start)
              depth=0;end=None
              for i in range(brace,len(css)):
                  if css[i]=='{': depth+=1
                  elif css[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1;break
              if end is None: raise SystemExit('desktop media block did not close')
              css=css[:start]+'/* r177: desktop remains native; reference-flow geometry is mobile-only. */\n'+css[end:]
          if '@media (min-width:901px)' in css: raise SystemExit('desktop reference media block remains')
          cp.write_text(css)

          # 2) Do not create mobile-only reference heading/proof/rail on desktop.
          jp=Path('docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js')
          js=jp.read_text()
          js=js.replace('/scifi-ui/styles/formatx-mobile-reference-layout-v1.css?v=20260813-mobile-only-r73','/scifi-ui/styles/formatx-mobile-reference-layout-v1.css?v=20260816-mobile-only-r177',1)
          if 'function cleanupDesktopFlow(hero)' not in js:
              anchor='function create(){'
              if anchor not in js: raise SystemExit('create function anchor missing')
              cleanup="function cleanupDesktopFlow(hero){hero.querySelectorAll('.fx-reference-heading,.fx-reference-proof,.fx-reference-rail').forEach(node=>node.remove());root.dataset.fxReferenceComposition='desktop-native-r177';}\n"
              js=js.replace(anchor,cleanup+anchor,1)
          old_fragment="ensureHeader(hero);ensureFlowContent(hero,grid,space);root.dataset.fxMobileReferenceLayout='ready-v1';root.dataset.fxReferenceComposition=mobileViewport()?'mag-first-normal-flow-r74':'desktop-native-r84';"
          new_fragment="ensureHeader(hero);if(mobileViewport())ensureFlowContent(hero,grid,space);else cleanupDesktopFlow(hero);root.dataset.fxMobileReferenceLayout='ready-v1';root.dataset.fxReferenceComposition=mobileViewport()?'mag-first-normal-flow-r74':'desktop-native-r177';"
          if old_fragment in js:
              js=js.replace(old_fragment,new_fragment,1)
          elif new_fragment not in js:
              # Fallback regex ignores small whitespace/revision differences around the same semantic block.
              pat=r"ensureHeader\(hero\);\s*ensureFlowContent\(hero,grid,space\);\s*root\.dataset\.fxMobileReferenceLayout='ready-v1';\s*root\.dataset\.fxReferenceComposition=mobileViewport\(\)\?'mag-first-normal-flow-r74':'desktop-native-r84';"
              js,n=re.subn(pat,new_fragment,js,count=1)
              if n!=1: raise SystemExit('layout create semantic fragment missing')
          if 'desktop-native-r177' not in js or 'if(mobileViewport())ensureFlowContent' not in js:
              raise SystemExit('desktop cleanup contract incomplete')
          jp.write_text(js)

          # 3) Fresh cache chain through the core bootstrap and index.
          bp=Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          boot=bp.read_text()
          boot,n=re.subn(r"const LAYOUT_SCRIPT = '/scifi-ui/scripts/formatx-mobile-reference-layout-v1\.js\?v=[^']+';",
                         "const LAYOUT_SCRIPT = '/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js?v=20260816-desktop-native-r177';",boot,count=1)
          if n!=1 and 'v=20260816-desktop-native-r177' not in boot: raise SystemExit('bootstrap layout cache anchor missing')
          bp.write_text(boot)

          ip=Path('docs/scifi-ui/index.html')
          html=ip.read_text()
          html,n=re.subn(r'formatx-core-real3d-v20\.js\?v=20260814-r99-touch-contrast-r2&rev=[^"\']+',
                         'formatx-core-real3d-v20.js?v=20260814-r99-touch-contrast-r2&rev=20260816-r177-desktop-native-scope',html,count=1)
          if n!=1 and 'rev=20260816-r177-desktop-native-scope' not in html: raise SystemExit('index core bootstrap cache anchor missing')
          ip.write_text(html)

          # 4) Align production validation with the mobile-only scope.
          vp=Path('.github/scripts/validate-real3d-core.cjs')
          v=vp.read_text()
          v=re.sub(r'formatx-mobile-reference-layout-v1\.js\?v=[^\'\"]+', 'formatx-mobile-reference-layout-v1.js?v=20260816-desktop-native-r177', v, count=1)
          legacy="assert.ok(layoutStyle.includes('@media (min-width:901px)'));"
          replacement="assert.doesNotMatch(layoutStyle,/@media \\(min-width:901px\\)/,'mobile reference stylesheet leaked a desktop media block');"
          if legacy in v:v=v.replace(legacy,replacement,1)
          elif replacement not in v:
              # Insert beside the existing layoutStyle assertions.
              anchor="assert.ok(layoutStyle.includes(':focus-visible'));"
              if anchor not in v: raise SystemExit('layoutStyle validator anchor missing')
              v=v.replace(anchor,anchor+replacement,1)
          if 'formatx-mobile-reference-layout-v1.js?v=20260816-desktop-native-r177' not in v: raise SystemExit('validator cache token update failed')
          vp.write_text(v)
          PY
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-real3d-core.cjs
          node .github/scripts/validate-award-narrative-r175.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          if git diff --cached --quiet; then echo 'r177 already applied'; exit 0; fi
          git commit -m '[deploy-production] fix(layout): keep reference flow mobile-only r177'
          git push origin HEAD:master
