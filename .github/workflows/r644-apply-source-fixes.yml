name: R644 apply source first-frame and loop fixes

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r644-apply-source-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply R644 source fixes
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r644.py
          python3 -m py_compile /tmp/r644.py
          python3 /tmp/r644.py
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r637.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git commit -m "R644 source first-frame and collapsed desktop loop"
          git push origin HEAD:fix/r533-p0-intro-lcp
