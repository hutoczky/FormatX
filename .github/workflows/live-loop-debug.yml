name: Debug live Three.js loop

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/scripts/debug-live-loop.cjs'
      - '.github/workflows/live-loop-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-live-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostics
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test three live loop cycles
        shell: bash
        run: node .github/scripts/debug-live-loop.cjs

      - name: Upload loop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-live-loop-debug
          path: |
            live-loop-debug.json
            live-loop-debug.png
          if-no-files-found: warn
          retention-days: 7
