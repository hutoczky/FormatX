name: One-shot P0 R494 desktop first-paint optimizer

on:
  push:
    branches: [p0-vip-awwwards-gate]
    paths:
      - '.github/workflows/one-shot-p0-r494-desktop-first-paint.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Promote stable desktop first paint and defer legacy critical bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          index_path = Path('docs/scifi-ui/index.html')
          stability_path = Path('docs/scifi-ui/styles/formatx-first-frame-stability-r283.css')

          index = index_path.read_text(encoding='utf-8')
          stability = stability_path.read_text(encoding='utf-8')

          # R494: Event Horizon already imports the small R283 stability owner.
          # Make that chain unconditionally render-blocking on desktop instead of
          # depending on pointer:fine, which Lighthouse/headless may not treat as
          # a blocking media condition during the first paint.
          event_pattern = re.compile(r'<link\s+rel="stylesheet"\s+href="\.\/styles\/formatx-event-horizon\.css\?v=20260819-r224-desktop-intro"[^>]*>')
          event_match = event_pattern.search(index)
          if not event_match:
              raise SystemExit('R494: event-horizon stylesheet link not found')
          event_tag = event_match.group(0)
          event_tag = re.sub(r'\s+fetchpriority="[^"]*"', '', event_tag)
          event_tag = re.sub(r'\s+media="[^"]*"', '', event_tag)
          event_tag = event_tag[:-1] + ' fetchpriority="high" media="(prefers-reduced-motion: no-preference) and (min-width: 901px)">'
          index = index[:event_match.start()] + event_tag + index[event_match.end():]

          # The 27.8 KB generated critical bundle is not required to calculate the
          # stable desktop hero geometry anymore. Keep its target media for the
          # existing interaction-deferred loader, but remove it from first paint.
          core_pattern = re.compile(r'<link\s+rel="stylesheet"\s+data-fx-critical-core-r227="true"[^>]*>')
          core_match = core_pattern.search(index)
          if not core_match:
              raise SystemExit('R494: critical-core stylesheet link not found')
          core_tag = core_match.group(0)
          href_match = re.search(r'href="([^"]+)"', core_tag)
          if not href_match:
              raise SystemExit('R494: critical-core href missing')
          core_href = href_match.group(1)
          target_media = '(prefers-reduced-motion: no-preference) and (min-width: 901px)'
          core_tag = re.sub(r'\s+media="[^"]*"', '', core_tag)
          core_tag = re.sub(r'\s+fetchpriority="[^"]*"', '', core_tag)
          if 'data-fx-deferred-media-r300=' in core_tag:
              core_tag = re.sub(r'data-fx-deferred-media-r300="[^"]*"', f'data-fx-deferred-media-r300="{target_media}"', core_tag)
          else:
              core_tag = core_tag[:-1] + f' data-fx-deferred-media-r300="{target_media}">'
          core_tag = core_tag[:-1] + ' fetchpriority="low" media="not all">'
          noscript = f'<noscript><link rel="stylesheet" href="{core_href}" media="(min-width: 901px)"></noscript>'
          index = index[:core_match.start()] + core_tag + '\n  ' + noscript + index[core_match.end():]

          # Remove an older duplicate fallback if this workflow is ever retried.
          duplicate = '  ' + noscript + '\n  ' + noscript
          while duplicate in index:
              index = index.replace(duplicate, '  ' + noscript)

          marker = '/* R494 P0 desktop header first-paint lock — exact R244 settled geometry. */'
          if marker not in stability:
              stability = stability.rstrip() + '''\n\n''' + marker + '''\n@media (min-width: 901px) {\n  html:root:root body.living-architecture .topbar {\n    position: relative !important;\n    inset: auto !important;\n    display: block !important;\n    box-sizing: border-box !important;\n    width: 100% !important;\n    height: 76px !important;\n    min-height: 76px !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    overflow: visible !important;\n  }\n  html:root:root body.living-architecture .topbar .brand {\n    position: absolute !important;\n    inset: 18px auto auto max(38px, calc((100vw - 1320px) / 2)) !important;\n    display: flex !important;\n    align-items: center !important;\n    gap: 12px !important;\n    width: auto !important;\n    min-width: 0 !important;\n    height: 40px !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    transform: none !important;\n  }\n  html:root:root body.living-architecture .topbar .brand img {\n    width: 40px !important;\n    height: 40px !important;\n    flex: 0 0 40px !important;\n  }\n  html:root:root body.living-architecture .topbar .brand strong {\n    font: 780 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif !important;\n    letter-spacing: .15em !important;\n  }\n  html:root:root body.living-architecture .topbar .brand small {\n    margin-top: 5px !important;\n    font: 650 7px/1 system-ui, -apple-system, "Segoe UI", sans-serif !important;\n    letter-spacing: .22em !important;\n  }\n  html:root:root body.living-architecture .topbar > .header-actions,\n  html:root:root body.living-architecture .topbar > .main-nav:not(.open) {\n    display: none !important;\n    visibility: hidden !important;\n    pointer-events: none !important;\n  }\n  html:root:root body.living-architecture .topbar #menu-toggle,\n  html:root:root body.living-architecture .topbar .fx-reference-menu-button {\n    position: absolute !important;\n    inset: 10px 38px auto auto !important;\n    z-index: 8 !important;\n    display: grid !important;\n    place-items: center !important;\n    box-sizing: border-box !important;\n    width: 58px !important;\n    min-width: 58px !important;\n    max-width: 58px !important;\n    height: 56px !important;\n    min-height: 56px !important;\n    max-height: 56px !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    transform: none !important;\n    translate: none !important;\n  }\n  html:root:root body.living-architecture .topbar > .fx-language-toggle {\n    position: absolute !important;\n    inset: 16px 112px auto auto !important;\n    z-index: 8 !important;\n    display: grid !important;\n    place-items: center !important;\n    box-sizing: border-box !important;\n    width: 46px !important;\n    min-width: 46px !important;\n    max-width: 46px !important;\n    height: 44px !important;\n    min-height: 44px !important;\n    max-height: 44px !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    transform: none !important;\n    translate: none !important;\n  }\n  html:root:root body.living-architecture .topbar > .fx-reference-mag-button {\n    position: absolute !important;\n    inset: 16px 174px auto auto !important;\n    z-index: 8 !important;\n    display: grid !important;\n    place-items: center !important;\n    box-sizing: border-box !important;\n    width: 54px !important;\n    min-width: 54px !important;\n    max-width: 54px !important;\n    height: 44px !important;\n    min-height: 44px !important;\n    max-height: 44px !important;\n    margin: 0 !important;\n    padding: 0 !important;\n    transform: none !important;\n    translate: none !important;\n  }\n}\n\n/* deploy-r494-p0-desktop-critical-path */\n'''

          index_path.write_text(index, encoding='utf-8')
          stability_path.write_text(stability, encoding='utf-8')

          # Contract checks.
          updated = index_path.read_text(encoding='utf-8')
          event = event_pattern.search(updated)
          core = core_pattern.search(updated)
          if not event or '(pointer: fine)' in event.group(0) or 'fetchpriority="high"' not in event.group(0):
              raise SystemExit('R494: desktop stability chain is not hard render-blocking')
          if not core or 'media="not all"' not in core.group(0) or 'fetchpriority="low"' not in core.group(0):
              raise SystemExit('R494: legacy critical bundle still blocks first paint')
          if noscript not in updated:
              raise SystemExit('R494: no-JS critical-core fallback missing')
          if marker not in stability_path.read_text(encoding='utf-8'):
              raise SystemExit('R494: header first-paint lock missing')
          print('PASS R494: stable desktop CSS blocks first paint; legacy critical bundle is progressive; no-JS fallback retained.')
          PY

          git diff --check
          git diff --stat

      - name: Commit R494 production first-paint path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/formatx-first-frame-stability-r283.css
          if git diff --cached --quiet; then
            echo 'No R494 changes required.'
            exit 0
          fi
          git commit -m 'R494 stabilize desktop first paint and defer legacy critical CSS'
          git push origin HEAD:p0-vip-awwwards-gate
