name: One-shot publish r172 physical mobile seam bridge
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-r168-clock.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r172 mobile seamless bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          index=Path('docs/scifi-ui/index.html')
          html=index.read_text()
          tag='  <script defer data-fx-mobile-seam-bridge-r172="true" src="./scripts/formatx-mobile-seam-bridge-r172.js?v=20260815-r172-physical-seam-bridge"></script>\n'
          if 'data-fx-mobile-seam-bridge-r172="true"' not in html:
              anchor='</head>'
              if anchor not in html: raise SystemExit('head terminator missing')
              html=html.replace(anchor,tag+anchor,1)
          index.write_text(html)
          PY
          node --check docs/scifi-ui/scripts/formatx-living-energy-r168.js
          node --check docs/scifi-ui/scripts/formatx-mobile-seam-bridge-r172.js
          node .github/scripts/validate-real3d-core.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r172 bridge already published'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r172 physical mobile seam bridge'
          git push origin HEAD:master
