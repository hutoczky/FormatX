name: R641 intro raster owner fix

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r641-intro-raster-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply intro raster fix
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r641.py
          python3 /tmp/r641.py
          git diff --check
      - name: Commit source fixes
        run: |
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          git add docs/scifi-ui/styles/formatx-quality-r461.css docs/scifi-ui/styles/formatx-intro-p0-r575.css docs/scifi-ui/scripts/formatx-event-horizon.js
          git commit -m "R641 retire full-screen intro transform promotion"
          git push origin HEAD:fix/r533-p0-intro-lcp
