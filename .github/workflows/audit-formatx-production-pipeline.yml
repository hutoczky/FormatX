name: Audit FormatX production pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/audit-formatx-production-pipeline.yml'
      - '.github/workflows/deploy-formatx-custom-domain.yml'
      - '.github/workflows/validate-year-5000.yml'
      - 'billing-worker/vitest.config.js'
      - 'billing-worker/wrangler.billing-test.jsonc'
      - 'billing-worker/package.json'
      - 'billing-worker/package-lock.json'
      - 'billing-worker/test/**'

permissions:
  contents: write

concurrency:
  group: formatx-production-pipeline-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit source, deploy prerequisites and live assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Validate production configuration
        id: config
        continue-on-error: true
        shell: python
        run: |
          import json
          from pathlib import Path

          config = json.loads(Path('billing-worker/wrangler.jsonc').read_text(encoding='utf-8'))
          assert config['name'] == 'formatx'
          assert config['main'] == 'src/production-with-license.js'
          assert config['assets']['directory'] == '../docs'
          assert config['assets']['run_worker_first'] is True
          routes = {(item.get('pattern'), item.get('custom_domain')) for item in config.get('routes', [])}
          assert ('formatxsuite.com', True) in routes
          assert ('www.formatxsuite.com', True) in routes

      - name: Validate JavaScript syntax
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/start-sale.js
          node --check docs/scifi-ui/scripts/future-5000.js
          node --check docs/scifi-ui/scripts/future-5000-effects.js
          node --check docs/scifi-ui/scripts/causal-memory-field.js
          node --check docs/scifi-ui/scripts/causal-memory-hover.js
          node --check docs/scifi-ui/scripts/causal-memory-boot.js
          node --check billing-worker/src/production-with-license.js

      - name: Install exact Worker dependencies
        id: npm_ci
        continue-on-error: true
        working-directory: billing-worker
        run: npm ci

      - name: Run billing and license Worker test suites
        id: tests
        continue-on-error: true
        working-directory: billing-worker
        run: npm test

      - name: Check Cloudflare credential prerequisite
        id: cloudflare
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '\r\n')"
          token="${token#Authorization: Bearer }"
          token="${token#Bearer }"
          token="$(printf '%s' "$token" | xargs)"
          if [ "${#token}" -ge 20 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect workflow topology
        id: topology
        shell: python
        run: |
          from pathlib import Path

          deploy = Path('.github/workflows/deploy-formatx-custom-domain.yml').read_text(encoding='utf-8')
          validation = Path('.github/workflows/validate-year-5000.yml').read_text(encoding='utf-8')
          generated_status_is_deploy_asset = 'docs/scifi-ui/validation/year5000-status.json' in validation
          deploy_watches_docs = "- 'docs/**'" in deploy
          validation_status_excluded = "!docs/scifi-ui/validation/**" in deploy
          duplicate = generated_status_is_deploy_asset and deploy_watches_docs and not validation_status_excluded
          serial_queue = 'cancel-in-progress: false' in deploy
          with open(Path.home() / 'topology.env', 'w', encoding='utf-8') as handle:
              handle.write(f'duplicate_status_deploy={str(duplicate).lower()}\n')
              handle.write(f'serial_deploy_queue={str(serial_queue).lower()}\n')
          print(f'duplicate_status_deploy={str(duplicate).lower()}')
          print(f'serial_deploy_queue={str(serial_queue).lower()}')

      - name: Export workflow topology
        shell: bash
        run: cat "$HOME/topology.env" >> "$GITHUB_ENV"

      - name: Check live website and mobile boot assets
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          main_http="$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            -o "$work/main.html" -w '%{http_code}' 'https://formatxsuite.com/' || true)"
          www_http="$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            -o "$work/www.html" -w '%{http_code}' 'https://www.formatxsuite.com/' || true)"
          boot_js_http="$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            -o "$work/boot.js" -w '%{http_code}' \
            'https://formatxsuite.com/scifi-ui/scripts/causal-memory-boot.js?v=20260726-causal-boot-3' || true)"
          boot_css_http="$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            -o "$work/boot.css" -w '%{http_code}' \
            'https://formatxsuite.com/scifi-ui/styles/causal-memory-boot.css?v=20260726-causal-boot-3' || true)"
          license_http="$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
            -o "$work/license.json" -w '%{http_code}' 'https://formatxsuite.com/api/license/health' || true)"

          main_boot3=false
          js_mobile=false
          css_mobile=false
          license_ok=false
          grep -Fq '/scifi-ui/scripts/causal-memory-boot.js?v=20260726-causal-boot-3' "$work/main.html" && main_boot3=true
          grep -Fq 'new IntersectionObserver' "$work/boot.js" && grep -Fq 'visible-entry' "$work/boot.js" && js_mobile=true
          grep -Fq '@keyframes fx-causal-root-energize-mobile' "$work/boot.css" && css_mobile=true
          python3 - "$work/license.json" <<'PY' && license_ok=true || true
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('service') == 'formatx-license-center'
          PY

          {
            echo "main_http=${main_http:-000}"
            echo "www_http=${www_http:-000}"
            echo "boot_js_http=${boot_js_http:-000}"
            echo "boot_css_http=${boot_css_http:-000}"
            echo "license_http=${license_http:-000}"
            echo "main_boot3=$main_boot3"
            echo "js_mobile=$js_mobile"
            echo "css_mobile=$css_mobile"
            echo "license_ok=$license_ok"
          } >> "$GITHUB_OUTPUT"

      - name: Persist audit result
        if: ${{ always() }}
        shell: bash
        env:
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm_ci.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CLOUDFLARE_TOKEN_PRESENT: ${{ steps.cloudflare.outputs.present }}
          MAIN_HTTP: ${{ steps.live.outputs.main_http }}
          WWW_HTTP: ${{ steps.live.outputs.www_http }}
          BOOT_JS_HTTP: ${{ steps.live.outputs.boot_js_http }}
          BOOT_CSS_HTTP: ${{ steps.live.outputs.boot_css_http }}
          LICENSE_HTTP: ${{ steps.live.outputs.license_http }}
          MAIN_BOOT3: ${{ steps.live.outputs.main_boot3 }}
          JS_MOBILE: ${{ steps.live.outputs.js_mobile }}
          CSS_MOBILE: ${{ steps.live.outputs.css_mobile }}
          LICENSE_OK: ${{ steps.live.outputs.license_ok }}
        run: |
          set -euo pipefail
          git pull --rebase origin master
          mkdir -p .github/audit
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def truth(name):
              return os.environ.get(name, '').lower() == 'true'

          result = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'auditedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'configuration': os.environ.get('CONFIG_OUTCOME', 'unknown'),
              'javascriptSyntax': os.environ.get('JAVASCRIPT_OUTCOME', 'unknown'),
              'npmCi': os.environ.get('NPM_CI_OUTCOME', 'unknown'),
              'workerTests': os.environ.get('TESTS_OUTCOME', 'unknown'),
              'cloudflareTokenPresent': truth('CLOUDFLARE_TOKEN_PRESENT'),
              'duplicateValidationStatusDeployTrigger': truth('duplicate_status_deploy'),
              'serialProductionQueue': truth('serial_deploy_queue'),
              'live': {
                  'mainHttp': os.environ.get('MAIN_HTTP', '000'),
                  'wwwHttp': os.environ.get('WWW_HTTP', '000'),
                  'bootJsHttp': os.environ.get('BOOT_JS_HTTP', '000'),
                  'bootCssHttp': os.environ.get('BOOT_CSS_HTTP', '000'),
                  'licenseHttp': os.environ.get('LICENSE_HTTP', '000'),
                  'mainReferencesBoot3': truth('MAIN_BOOT3'),
                  'bootJsContainsMobileTrigger': truth('JS_MOBILE'),
                  'bootCssContainsMobileEffect': truth('CSS_MOBILE'),
                  'licenseHealthValid': truth('LICENSE_OK'),
              },
          }
          result['sourceReady'] = all(result[key] == 'success' for key in (
              'configuration', 'javascriptSyntax', 'npmCi', 'workerTests'
          ))
          result['productionReady'] = (
              result['sourceReady']
              and result['cloudflareTokenPresent']
              and result['live']['mainHttp'] == '200'
              and result['live']['mainReferencesBoot3']
              and result['live']['bootJsContainsMobileTrigger']
              and result['live']['bootCssContainsMobileEffect']
              and result['live']['licenseHealthValid']
          )
          Path('.github/audit/production-pipeline-status.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/audit/production-pipeline-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record FormatX production pipeline audit'
            git push origin HEAD:master
          fi
