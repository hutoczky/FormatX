name: One-shot r309 deterministic CSS owner fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r309-css-runtime-order.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore immediate WebGL CSS and contain deferred Signature
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          index_path=Path('docs/scifi-ui/index.html')
          signature_path=Path('docs/scifi-ui/styles/formatx-critical-signature-r227.css')
          index=index_path.read_text(encoding='utf-8')
          signature=signature_path.read_text(encoding='utf-8')

          match=re.search(r'<link\s+[^>]*data-fx-core-real3d="true"[^>]*>',index,re.I)
          if not match:
              raise SystemExit('core-real3d link missing')
          tag=match.group(0)
          tag=re.sub(r'\s+data-fx-deferred-media-r300="[^"]*"','',tag)
          tag=re.sub(r'\s+media="[^"]*"','',tag)
          tag=tag[:-1]+' media="(prefers-reduced-motion: no-preference)">'
          index=index[:match.start()]+tag+index[match.end():]
          index_path.write_text(index,encoding='utf-8')

          guard='''
/* r309 — deferred Signature remains fully contained on narrow viewports. */
@media (max-width:900px),(pointer:coarse){
  .fx-signature-map{
    box-sizing:border-box!important;
    width:100vw!important;
    max-width:100vw!important;
    min-width:0!important;
  }
  .fx-signature-node{
    box-sizing:border-box!important;
    min-width:0!important;
    max-width:100%!important;
  }
}
'''
          if 'r309 — deferred Signature remains fully contained' not in signature:
              signature=signature.rstrip()+'\n'+guard
              signature_path.write_text(signature,encoding='utf-8')

          final=index_path.read_text(encoding='utf-8')
          core=re.search(r'<link\s+[^>]*data-fx-core-real3d="true"[^>]*>',final,re.I).group(0)
          signature_link=re.search(r'<link\s+[^>]*data-fx-critical-signature-r227="true"[^>]*>',final,re.I).group(0)
          assert 'media="not all"' not in core
          assert 'data-fx-deferred-media-r300' not in core
          assert 'media="(prefers-reduced-motion: no-preference)"' in core
          assert 'media="not all"' in signature_link
          assert 'data-fx-deferred-media-r300' in signature_link
          print('PASS r309 deterministic CSS ownership patch')
          PY
          git diff --check
          git diff --stat

      - name: Commit deterministic CSS ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/formatx-critical-signature-r227.css
          git rm -f .github/workflows/one-shot-r309-css-runtime-order.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore immediate WebGL CSS and contain deferred Signature'
          git push origin HEAD:master
