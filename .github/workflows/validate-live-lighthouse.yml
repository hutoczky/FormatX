name: Validate live FormatX Lighthouse

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/p0-validation-version.txt'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-live-lighthouse
  cancel-in-progress: true

jobs:
  live-lighthouse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUDITED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      ORIGIN: https://formatxsuite.com
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDITED_SHA }}

      - name: Wait for exact validated revision to reach production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$ORIGIN/p0-validation-version.txt?wait=${GITHUB_RUN_ID}-${attempt}" -o "$RUNNER_TEMP/live-p0.txt"; then
              if cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
                echo 'Exact P0 marker is live on production.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Production never converged to the audited P0 marker.' >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Confirm production security headers
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/home.html" -D "$RUNNER_TEMP/headers.txt" -w '%{http_code}' -H 'Cache-Control: no-cache' "$ORIGIN/?p0_header=${GITHUB_RUN_ID}")"
          test "$code" = 200
          grep -Fq 'FormatX Suite Pro' "$RUNNER_TEMP/home.html"
          python3 - "$RUNNER_TEMP/headers.txt" <<'PY'
          import pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace').replace('\r\n','\n')
          blocks=[b for b in raw.split('\n\n') if b.strip()]; lines=blocks[-1].splitlines(); h={}
          assert lines and ' 200 ' in lines[0]
          for line in lines[1:]:
              if ':' in line:
                  k,v=line.split(':',1); h[k.strip().lower()]=v.strip()
          hsts=h.get('strict-transport-security','').lower(); csp=h.get('content-security-policy','').lower()
          assert 'max-age=63072000' in hsts and 'includesubdomains' in hsts and 'preload' in hsts
          assert h.get('x-content-type-options','').lower()=='nosniff'
          assert h.get('x-frame-options','').upper()=='DENY'
          assert h.get('cross-origin-opener-policy','').lower()=='same-origin'
          assert "default-src 'self'" in csp and "object-src 'none'" in csp and "frame-ancestors 'none'" in csp
          assert 'x-powered-by' not in h
          print('P0_SECURITY_HEADERS_PASS')
          PY

      - name: Verify checkout readiness invariant
        shell: bash
        run: |
          set -euo pipefail
          rc="$(curl -sS --max-time 25 -H 'Accept: application/json' -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/readiness.json" -w '%{http_code}' "$ORIGIN/api/checkout-readiness?audit=${GITHUB_RUN_ID}")"
          test "$rc" = 200
          cc="$(curl -sS --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/checkout.html" -w '%{http_code}' "$ORIGIN/scifi-ui/checkout.html?audit=${GITHUB_RUN_ID}")"
          python3 - "$RUNNER_TEMP/readiness.json" "$cc" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); code=int(sys.argv[2])
          assert p.get('provider')=='bank_transfer' and p.get('business_checkout_only') is True
          assert p.get('legal_acceptance_required') is True and p.get('manual_verification_required') is True
          assert {'HUF','EUR'} <= set(p.get('supported_currencies') or [])
          if p.get('sales_ready') is True:
              assert p.get('order_tracking_ready') is True and p.get('live_ready') is True and p.get('ok') is True and code==200
          else:
              assert p.get('live_ready') is not True and p.get('ok') is not True and code==503
          print('P0_CHECKOUT_READINESS_PASS')
          PY

      - name: Prepare cache-busted Lighthouse configs
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const [src,out,profile] of [['lighthouserc.live.json','lighthouserc.live.p0.json','desktop'],['lighthouserc.live.mobile.json','lighthouserc.live.mobile.p0.json','mobile']]){
            const c=JSON.parse(fs.readFileSync(src,'utf8'));
            c.ci.collect.url=[`https://formatxsuite.com/?p0_lighthouse=${process.env.GITHUB_RUN_ID}-${profile}`];
            fs.writeFileSync(out,JSON.stringify(c,null,2)+'\n');
          }
          NODE

      - name: Run and validate desktop Lighthouse x3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lighthouseci lighthouse-live-results/desktop
          lhci collect --config=./lighthouserc.live.p0.json 2>&1 | tee lighthouse-live-desktop-output.txt
          mkdir -p lighthouse-live-results/desktop
          cp -a .lighthouseci/. lighthouse-live-results/desktop/
          lhci assert --config=./lighthouserc.live.p0.json 2>&1 | tee -a lighthouse-live-desktop-output.txt
          PROFILE=desktop node .github/scripts/summarize-p0-lighthouse.cjs lighthouse-live-results/desktop | tee -a lighthouse-live-desktop-output.txt

      - name: Run and validate mobile Lighthouse x3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lighthouseci lighthouse-live-results/mobile
          lhci collect --config=./lighthouserc.live.mobile.p0.json 2>&1 | tee lighthouse-live-mobile-output.txt
          mkdir -p lighthouse-live-results/mobile
          cp -a .lighthouseci/. lighthouse-live-results/mobile/
          lhci assert --config=./lighthouserc.live.mobile.p0.json 2>&1 | tee -a lighthouse-live-mobile-output.txt
          PROFILE=mobile node .github/scripts/summarize-p0-lighthouse.cjs lighthouse-live-results/mobile | tee -a lighthouse-live-mobile-output.txt

      - name: Upload live Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-lighthouse-results-${{ env.AUDITED_SHA }}
          path: |
            lighthouse-live-results/
            lighthouse-live-desktop-output.txt
            lighthouse-live-mobile-output.txt
            lighthouserc.live.p0.json
            lighthouserc.live.mobile.p0.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Publish live Lighthouse status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='P0 live desktop/mobile 3x Lighthouse and security gate passed'; else state=failure; description='P0 live Lighthouse or security gate failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" -f state="$state" -f context='FormatX P0 live Lighthouse gate' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
