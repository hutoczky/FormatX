name: P0 R526 apply final owners

on:
  push:
    branches: [p0-r526-final-422a4cc]
    paths:
      - '.github/workflows/p0-r526-apply-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: p0-r526-final-422a4cc
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Apply R526 performance and validator owners
        env:
          R526_PATCH_GZ_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$R526_PATCH_GZ_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/r526-apply.sh"
          bash "$RUNNER_TEMP/r526-apply.sh"

      - name: Lightweight preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r487.js
          node --check billing-worker/src/production-content-entry-r526.js
          node --check .github/scripts/verify-apex-shell-r500.cjs
          grep -Fq "Date.now()+20000" .github/workflows/verify-r522-semantic-mag.yml
          grep -Fq "R482_CONDITION_DUMP" .github/workflows/verify-r481-live-mag.yml
          ! grep -Fq "ready-r482" .github/workflows/verify-r481-live-mag.yml
          ! grep -Fq "playwright install --with-deps chromium" .github/workflows/verify-r481-live-mag.yml
          grep -Fq '"main": "src/production-content-entry-r526.js"' billing-worker/wrangler.jsonc
          grep -Fq "20260904-r526-fcp-observer" billing-worker/src/production-content-entry-r526.js
          git diff --check
          npm ci --prefix billing-worker --prefer-offline
          (cd billing-worker && npx wrangler deploy --dry-run --outdir="$RUNNER_TEMP/r526-worker")

      - name: Commit coherent R526 tree and remove helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/p0-r526-apply-final.yml
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add \
            docs/scifi-ui/scripts/formatx-deferred-css-r487.js \
            billing-worker/src/production-content-entry-r526.js \
            billing-worker/wrangler.jsonc \
            .github/workflows/verify-r522-semantic-mag.yml \
            .github/workflows/verify-r481-live-mag.yml \
            .github/scripts/verify-apex-shell-r500.cjs \
            .github/workflows/verify-apex-shell-live.yml \
            docs/p0-validation-version.txt \
            .github/workflows/p0-r526-apply-final.yml
          git commit -m 'Fix R526 final FCP scheduler and semantic gates'
          git push origin HEAD:p0-r526-final-422a4cc
