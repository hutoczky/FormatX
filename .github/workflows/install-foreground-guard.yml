name: Install foreground guard

# Triggered explicitly after the Firefox Nightly screenshot confirmed a suspended reveal frame.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-foreground-guard.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Load the foreground guard last
        shell: python
        run: |
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '  <link rel="stylesheet" href="./styles/site-contrast-guard.css?v=20260726-contrast-guard-1">\n'
          guard = '  <link rel="stylesheet" href="./styles/site-foreground-guard.css?v=20260726-foreground-1">\n'
          if guard not in text:
              if marker not in text:
                  raise SystemExit('Static foreground insertion marker not found')
              text = text.replace(marker, marker + guard, 1)
          index.write_text(text, encoding='utf-8')

          worker = Path('billing-worker/src/production-with-license.js')
          text = worker.read_text(encoding='utf-8')
          version_marker = "const SITE_ART_VERSION = '20260726-art-direction-2';\n"
          version_line = "const SITE_FOREGROUND_VERSION = '20260726-foreground-1';\n"
          if version_line not in text:
              if version_marker not in text:
                  raise SystemExit('Worker version insertion marker not found')
              text = text.replace(version_marker, version_marker + version_line, 1)

          if 'class ForegroundHeadHandler' not in text:
              marker = '''class StartSaleHeadHandler {
'''
              handler = '''class ForegroundHeadHandler {
  constructor(skipStaticVisuals) {
    this.skipStaticVisuals = skipStaticVisuals;
  }

  element(element) {
    if (this.skipStaticVisuals) return;
    element.append(
      `<link rel="stylesheet" href="/scifi-ui/styles/site-foreground-guard.css?v=${SITE_FOREGROUND_VERSION}">`,
      { html: true },
    );
  }
}

'''
              if marker not in text:
                  raise SystemExit('Worker handler insertion marker not found')
              text = text.replace(marker, handler + marker, 1)

          registration = '''  if (startSale) {
    rewriter
      .on('head', new StartSaleHeadHandler(isCheckout))
      .on('body', new StartSaleBodyHandler(isCheckout))
      .on('script[src]', new CheckoutScriptHandler(isCheckout));
  }

  return rewriter.transform(response);
'''
          replacement = '''  if (startSale) {
    rewriter
      .on('head', new StartSaleHeadHandler(isCheckout))
      .on('body', new StartSaleBodyHandler(isCheckout))
      .on('script[src]', new CheckoutScriptHandler(isCheckout));
  }

  rewriter.on('head', new ForegroundHeadHandler(staticVisuals));
  return rewriter.transform(response);
'''
          if replacement not in text:
              if registration not in text:
                  raise SystemExit('Worker registration marker not found')
              text = text.replace(registration, replacement, 1)
          worker.write_text(text, encoding='utf-8')

      - name: Validate foreground protection
        shell: bash
        run: |
          set -euo pipefail
          node --check billing-worker/src/production-with-license.js
          grep -F 'site-foreground-guard.css?v=20260726-foreground-1' docs/scifi-ui/index.html
          grep -F "SITE_FOREGROUND_VERSION = '20260726-foreground-1'" billing-worker/src/production-with-license.js
          grep -F 'class ForegroundHeadHandler' billing-worker/src/production-with-license.js
          grep -F "rewriter.on('head', new ForegroundHeadHandler(staticVisuals));" billing-worker/src/production-with-license.js
          grep -F 'html.fx-intro-reveal .reference-commerce .hero-copy' docs/scifi-ui/styles/site-foreground-guard.css
          grep -F 'animation: none !important' docs/scifi-ui/styles/site-foreground-guard.css

      - name: Commit foreground fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html billing-worker/src/production-with-license.js
          git commit -m 'Keep hero content in the foreground after the intro animation'
          git push origin HEAD:master
