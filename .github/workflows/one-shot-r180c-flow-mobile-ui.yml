name: One-shot publish r180c mobile flow UI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r180c-flow-mobile-ui.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch mobile flow at the source and refresh cache contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          flow=Path('docs/scifi-ui/scripts/formatx-flow-first-r75.js')
          s=flow.read_text()
          replacements=[
            ("imp(brand,'top','19px')", "imp(brand,'top','17px')"),
            ("fixed(mag,'16px','calc(clamp(16px,6.55vw,57px) + 109px)','48px','36px');", "fixed(mag,'14px','calc(clamp(16px,6.55vw,57px) + 109px)','48px','40px');"),
            ("imp(rail,'top','11px')", "imp(rail,'top','18px')"),
            ("imp(rail,'gap','10px')", "imp(rail,'gap','24px')"),
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'missing flow token: {old}')
            s=s.replace(old,new,1)

          old_live="if(proof instanceof HTMLElement){normal(proof);imp(proof,'display','block');imp(proof,'visibility','visible');imp(proof,'opacity','1');imp(proof,'order','3');imp(proof,'align-self','stretch');imp(proof,'height','auto');imp(proof,'min-height','222px');imp(proof,'margin','0 7% 30px 6%');imp(proof,'overflow','hidden');const live=proof.querySelector('.fx-reference-liveos');if(live instanceof HTMLElement){imp(live,'position','absolute');imp(live,'right','6px');imp(live,'top','143px');imp(live,'left','auto');imp(live,'bottom','auto');imp(live,'display','grid');imp(live,'margin','0');}}"
          new_live="if(proof instanceof HTMLElement){normal(proof);imp(proof,'display','block');imp(proof,'visibility','visible');imp(proof,'opacity','1');imp(proof,'order','3');imp(proof,'align-self','stretch');imp(proof,'height','auto');imp(proof,'min-height','222px');imp(proof,'margin','0 7% 30px 6%');imp(proof,'overflow','hidden');const live=proof.querySelector('.fx-reference-liveos'),proofText=proof.querySelector('p'),narrow=innerWidth<=400;if(narrow&&proofText instanceof HTMLElement){imp(proof,'padding-bottom','88px');imp(proofText,'width','100%');imp(proofText,'max-width','100%');imp(proofText,'padding-right','0');imp(proofText,'word-break','normal');imp(proofText,'overflow-wrap','normal');}if(live instanceof HTMLElement){imp(live,'position','absolute');imp(live,'right',narrow?'16px':'6px');imp(live,'top',narrow?'auto':'143px');imp(live,'left','auto');imp(live,'bottom',narrow?'18px':'auto');if(narrow){imp(live,'width','78px');imp(live,'height','54px');}imp(live,'display','grid');imp(live,'margin','0');}}"
          if old_live not in s:
            raise SystemExit('legacy proof/live block not found exactly')
          s=s.replace(old_live,new_live,1)

          # Source-level action dimensions/label placement, so CSS is enhancement not authority.
          old_rail="if(rail instanceof HTMLElement){imp(rail,'position','absolute');imp(rail,'inset','auto');imp(rail,'top','18px');imp(rail,'right','6.7%');imp(rail,'left','auto');imp(rail,'bottom','auto');imp(rail,'z-index','20');imp(rail,'display','flex');imp(rail,'flex-direction','column');imp(rail,'align-items','center');imp(rail,'justify-content','flex-start');imp(rail,'gap','24px');imp(rail,'width','auto');imp(rail,'height','auto');imp(rail,'margin','0');imp(rail,'transform','none');}"
          new_rail="if(rail instanceof HTMLElement){imp(rail,'position','absolute');imp(rail,'inset','auto');imp(rail,'top','18px');imp(rail,'right','6.7%');imp(rail,'left','auto');imp(rail,'bottom','auto');imp(rail,'z-index','20');imp(rail,'display','flex');imp(rail,'flex-direction','column');imp(rail,'align-items','center');imp(rail,'justify-content','flex-start');imp(rail,'gap','24px');imp(rail,'width','auto');imp(rail,'height','auto');imp(rail,'margin','0');imp(rail,'transform','none');const ask=rail.querySelector('.fx-reference-ask'),pause=rail.querySelector('.fx-reference-pause'),askLabel=ask?.querySelector('span');for(const el of [ask,pause]){if(el instanceof HTMLElement){imp(el,'width','50px');imp(el,'min-width','50px');imp(el,'height','50px');imp(el,'min-height','50px');imp(el,'flex','0 0 50px');}}if(askLabel instanceof HTMLElement){imp(askLabel,'top','55px');imp(askLabel,'font-size','10px');imp(askLabel,'font-weight','700');imp(askLabel,'line-height','1');}}"
          if old_rail not in s:
            raise SystemExit('updated rail anchor not found')
          s=s.replace(old_rail,new_rail,1)
          flow.write_text(s)

          bootstrap=Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          b=bootstrap.read_text()
          old='formatx-flow-first-r75.js?v=20260816-mobile-only-r178'
          new='formatx-flow-first-r75.js?v=20260816-mobile-ui-r180c'
          if old not in b:
            raise SystemExit('bootstrap old flow cache token not found')
          bootstrap.write_text(b.replace(old,new,1))

          validator=Path('.github/scripts/validate-real3d-core.cjs')
          v=validator.read_text()
          if old not in v:
            raise SystemExit('validator old flow cache token not found')
          v=v.replace(old,new,1)
          anchor="assert.match(flow,/imp\\(rail,'display','none'\\)/);"
          contract="assert.match(flow,/fixed\\(mag,'14px'.*'48px','40px'\\)/);assert.ok(flow.includes(\"imp(rail,'gap','24px')\"));assert.ok(flow.includes(\"imp(live,'bottom',narrow?'18px':'auto')\"));assert.ok(flow.includes(\"imp(proofText,'padding-right','0')\"));"
          if contract not in v:
            if anchor not in v: raise SystemExit('validator flow contract anchor not found')
            v=v.replace(anchor,anchor+contract,1)
          validator.write_text(v)

          # Retire the temporary observer workaround from the page. The root flow now owns coordinates.
          index=Path('docs/scifi-ui/index.html')
          h=index.read_text()
          h,n=re.subn(r'\n  <script defer data-fx-mobile-ui-finalizer-r180="true" src="[^"]+"></script>', '', h, count=1)
          if n!=1:
            raise SystemExit('r180b temporary finalizer script tag not found exactly once')
          index.write_text(h)
          PY

          node --check docs/scifi-ui/scripts/formatx-flow-first-r75.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-real3d-core.cjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-flow-first-r75.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/index.html .github/scripts/validate-real3d-core.cjs
          git rm .github/workflows/one-shot-r180c-flow-mobile-ui.yml
          git commit -m '[deploy-production] fix(mobile): make r180c flow own final UI coordinates'
          git push origin HEAD:master
