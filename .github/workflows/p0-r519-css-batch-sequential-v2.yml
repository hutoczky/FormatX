name: P0 R519 CSS batch sequential A B v2

on:
  push:
    branches:
      - p0-r517-owner-76b79fe
    paths:
      - .github/workflows/p0-r519-css-batch-sequential-v2.yml

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v5
        with:
          ref: p0-r518-apex-buildtmp
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Prepare diagnostic loader and local Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0c983b25cbabecbdd73c8df760638c0c7554663b'
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/scifi-ui/scripts/formatx-deferred-css-r487.js')
          s = p.read_text()
          marker = "  let fallback = 0;"
          assert marker in s
          s = s.replace(marker, marker + "\n  const diagMode = new URLSearchParams(location.search).get('diag_css_mode') === 'sequential' ? 'sequential' : 'batch';\n  root.dataset.fxDiagCssMode = diagMode;", 1)
          old = """    const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));
    for (const link of links) {
      if (!(link instanceof HTMLLinkElement)) continue;
      const targetMedia = link.dataset.fxR487Media || 'all';
      if (link.media !== targetMedia) link.media = targetMedia;
      link.removeAttribute('fetchpriority');
    }

    root.dataset.fxDeferredCssR487 = 'ready';
    root.dataset.fxDeferredCssCountR487 = String(links.length);
    dispatchEvent(new CustomEvent('formatx:deferredcssready', {
      detail: { count: links.length, scheduler: 'post-first-paint-r487' }
    }));"""
          new = """    const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));
    const applyLink = link => {
      if (!(link instanceof HTMLLinkElement)) return;
      const targetMedia = link.dataset.fxR487Media || 'all';
      if (link.media !== targetMedia) link.media = targetMedia;
      link.removeAttribute('fetchpriority');
    };
    const finish = () => {
      root.dataset.fxDeferredCssR487 = 'ready';
      root.dataset.fxDeferredCssCountR487 = String(links.length);
      root.dataset.fxDiagCssApplied = String(links.filter(link => link instanceof HTMLLinkElement && link.media !== 'print').length);
      dispatchEvent(new CustomEvent('formatx:deferredcssready', {
        detail: { count: links.length, scheduler: diagMode === 'sequential' ? 'diag-one-style-per-frame' : 'post-first-paint-r487' }
      }));
    };
    if (diagMode === 'sequential') {
      let index = 0;
      const step = () => {
        if (index >= links.length) {
          finish();
          return;
        }
        applyLink(links[index++]);
        requestAnimationFrame(step);
      };
      step();
      return;
    }
    for (const link of links) applyLink(link);
    finish();"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r487.js
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc', 'utf8'));
          delete c.ai;
          delete c.routes;
          c.workers_dev = true;
          fs.writeFileSync('billing-worker/wrangler.cssab.json', JSON.stringify(c, null, 2) + '\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.cssab.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/cssab-v2.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cssab-v2.log" || true
          exit 1

      - name: Prove diagnostic marker before measurement
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors'] });
            const c = await b.newContext({ ignoreHTTPSErrors: true, viewport: { width: 1440, height: 900 } });
            const p = await c.newPage();
            await p.goto('https://formatxsuite.com:8787/?diag_css_mode=sequential&contract=1', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForFunction(() => document.documentElement.dataset.fxDeferredCssR487 === 'ready', null, { timeout: 10000 });
            const s = await p.evaluate(() => ({ mode: document.documentElement.dataset.fxDiagCssMode || '', count: Number(document.documentElement.dataset.fxDeferredCssCountR487 || 0), applied: Number(document.documentElement.dataset.fxDiagCssApplied || 0), search: location.search }));
            console.log('CSS_DIAG_CONTRACT', JSON.stringify(s));
            if (s.mode !== 'sequential' || s.count < 8 || s.applied !== s.count || !s.search.includes('diag_css_mode=sequential')) throw new Error('diagnostic contract not active');
            await b.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Interleaved batch versus sequential fresh Chrome x10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cssab-v2
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          const schedule = ['batch','sequential','sequential','batch','batch','sequential','sequential','batch','batch','sequential'];
          async function one(mode, run) {
            const b = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors'] });
            const c = await b.newContext({ ignoreHTTPSErrors: true, viewport: { width: 1440, height: 900 }, locale: 'hu-HU', colorScheme: 'dark' });
            const p = await c.newPage();
            await p.addInitScript(() => {
              window.__m = { paint: [], lcp: [], shift: [], long: [] };
              try { new PerformanceObserver(l => l.getEntries().forEach(e => window.__m.paint.push({ n: e.name, t: e.startTime }))).observe({ type: 'paint', buffered: true }); } catch {}
              try { new PerformanceObserver(l => l.getEntries().forEach(e => window.__m.lcp.push(e.startTime))).observe({ type: 'largest-contentful-paint', buffered: true }); } catch {}
              try { new PerformanceObserver(l => l.getEntries().forEach(e => { if (!e.hadRecentInput) window.__m.shift.push(e.value); })).observe({ type: 'layout-shift', buffered: true }); } catch {}
              try { new PerformanceObserver(l => l.getEntries().forEach(e => window.__m.long.push(e.duration))).observe({ type: 'longtask', buffered: true }); } catch {}
            });
            const cdp = await c.newCDPSession(p);
            await cdp.send('Performance.enable');
            const response = await p.goto(`https://formatxsuite.com:8787/?diag_css_mode=${mode}&run=${run}-${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3500);
            const x = await p.evaluate(() => ({
              mode: document.documentElement.dataset.fxDiagCssMode || '',
              ready: document.documentElement.dataset.fxDeferredCssR487 || '',
              count: Number(document.documentElement.dataset.fxDeferredCssCountR487 || 0),
              applied: Number(document.documentElement.dataset.fxDiagCssApplied || 0),
              fcp: window.__m.paint.find(e => e.n === 'first-contentful-paint')?.t || 0,
              lcp: window.__m.lcp.at(-1) || 0,
              cls: window.__m.shift.reduce((a,b) => a + b, 0),
              tbt: window.__m.long.reduce((a,d) => a + Math.max(0, d - 50), 0),
              longtasks: window.__m.long,
              overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth
            }));
            const pm = (await cdp.send('Performance.getMetrics')).metrics.reduce((o,m) => (o[m.name] = m.value, o), {});
            await c.close();
            await b.close();
            return { run, requestedMode: mode, status: response?.status() || 0, ...x, layoutMs: (pm.LayoutDuration || 0) * 1000, recalcMs: (pm.RecalcStyleDuration || 0) * 1000, taskMs: (pm.TaskDuration || 0) * 1000, scriptMs: (pm.ScriptDuration || 0) * 1000 };
          }
          const median = a => { const s = [...a].sort((x,y) => x-y); return s.length % 2 ? s[(s.length-1)/2] : (s[s.length/2-1] + s[s.length/2]) / 2; };
          (async () => {
            const rows = [];
            for (let i = 0; i < schedule.length; i++) rows.push(await one(schedule[i], i + 1));
            for (const r of rows) {
              if (r.status !== 200 || r.mode !== r.requestedMode || r.ready !== 'ready' || r.count < 8 || r.applied !== r.count || r.overflow > 2) throw new Error('measurement contract fail ' + JSON.stringify(r));
            }
            const summary = {};
            for (const mode of ['batch','sequential']) {
              const x = rows.filter(r => r.mode === mode);
              summary[mode] = { n: x.length, medianTbt: median(x.map(r => r.tbt)), maxTbt: Math.max(...x.map(r => r.tbt)), medianFcp: median(x.map(r => r.fcp)), maxFcp: Math.max(...x.map(r => r.fcp)), medianLcp: median(x.map(r => r.lcp)), maxLcp: Math.max(...x.map(r => r.lcp)), maxCls: Math.max(...x.map(r => r.cls)), medianLayout: median(x.map(r => r.layoutMs)), medianRecalc: median(x.map(r => r.recalcMs)), medianTask: median(x.map(r => r.taskMs)) };
            }
            console.log('CSS_AB_V2_SUMMARY', JSON.stringify(summary, null, 2));
            console.log('CSS_AB_V2_ROWS', JSON.stringify(rows, null, 2));
            fs.writeFileSync('artifacts/cssab-v2/summary.json', JSON.stringify(summary, null, 2));
            fs.writeFileSync('artifacts/cssab-v2/rows.json', JSON.stringify(rows, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-r519-css-batch-sequential-v2
          path: artifacts/cssab-v2/
          retention-days: 30
