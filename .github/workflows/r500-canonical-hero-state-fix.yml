      - name: Prepare R500 production release marker and edge revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('billing-worker/src/production-content-entry.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "FormatX R499 — canonical frame rollback + MAG pause invariant.":"FormatX R500 — canonical hero product-state first-frame ownership.",
            "20260902-r499-canonical-frame-mag-pause":"20260902-r500-canonical-hero-product-state",
            'data-fx-first-frame-stability-r499="true"':'data-fx-first-frame-stability-r500="true"',
            '20260902-r499-canonical-frame':'20260902-r500-canonical-hero-state',
            'data-fx-p0-first-paint-r499="true"':'data-fx-p0-first-paint-r500="true"',
            '20260902-r499-mag-pause-invariant':'20260902-r500-canonical-hero-state',
            "r499-canonical-frame:${STARTUP_REVISION}":"r500-canonical-hero-state:${STARTUP_REVISION}",
            "r499-no-static-hero-injection-no-interaction-media-mutation":"r500-canonical-hero-state-no-runtime-insertion",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'missing R500 release token: {old}')
              s=s.replace(old,new)
          # Cache-bust only the changed canonical status runtime/style on the homepage.
          needle="    .replace(/formatx-mag-shape-sync-r476\\.js\\?v=[^\"']+/g, 'formatx-mag-shape-sync-r476.js?v=20260902-r499-persistent-pause-clock');"
          repl="    .replace(/formatx-mag-shape-sync-r476\\.js\\?v=[^\"']+/g, 'formatx-mag-shape-sync-r476.js?v=20260902-r499-persistent-pause-clock')\\n    .replace(/platform-status\\.js\\?v=[^\"']+/g, 'platform-status.js?v=20260902-r500-canonical-hero-state')\\n    .replace(/platform-status\\.css\\?v=[^\"']+/g, 'platform-status.css?v=20260902-r500-canonical-hero-state');"
          if needle not in s: raise SystemExit('runtime cache-bust anchor missing')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          marker=Path('docs/p0-validation-version.txt')
          m=marker.read_text(encoding='utf-8')
          m=m.replace('version=2026-09-02-p0-100x3-r9','version=2026-09-02-p0-100x3-r10')
          m=re.sub(r'^trigger=.*$', 'trigger=r500-canonical-hero-product-state-cls', m, flags=re.M)
          marker.write_text(m,encoding='utf-8')
          PY
          node --input-type=module --check < billing-worker/src/production-content-entry.js
          node --check docs/scifi-ui/scripts/platform-status.js
          node .github/scripts/production-preflight.cjs

