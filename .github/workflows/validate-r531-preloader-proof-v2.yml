name: Validate R531 preloader proof v2

on:
  push:
    branches: [chatgpt/r530-lightweight-preloader-v2]
    paths:
      - 'docs/scifi-ui/scripts/formatx-event-horizon.js'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - '.github/workflows/validate-r531-preloader-proof-v2.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.0
      - name: Resolve Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start source site
        shell: bash
        run: |
          python3 -m http.server 4188 --directory docs > "$RUNNER_TEMP/r531-v2-http.log" 2>&1 &
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4188/scifi-ui/index.html >/dev/null && exit 0; sleep .2; done
          cat "$RUNNER_TEMP/r531-v2-http.log"; exit 1
      - name: Prove no-input preloader/MAG ordering and geometry
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/r531-v2.cjs" <<'NODE'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const URL='http://127.0.0.1:4188/scifi-ui/index.html?lang=hu&r531v2='+Date.now();
          const cases=[
            {name:'desktop-normal',viewport:{width:1440,height:900},isMobile:false,hasTouch:false,reducedMotion:'no-preference',max:820},
            {name:'mobile-normal',viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'no-preference',max:680},
            {name:'desktop-reduced',viewport:{width:1440,height:900},isMobile:false,hasTouch:false,reducedMotion:'reduce',max:820},
            {name:'mobile-reduced',viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'reduce',max:680},
          ];
          async function one(browser,c){
            const context=await browser.newContext({viewport:c.viewport,isMobile:c.isMobile,hasTouch:c.hasTouch,reducedMotion:c.reducedMotion,locale:'hu-HU'});
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/^Failed to load resource:/i.test(m.text()))errors.push('console:'+m.text());});
            await page.addInitScript(() => {
              window.__r531={visible:null,startup:null,ready:null,release:null,geometry:null,events:[]};
              let last='';
              const snap=()=>{
                const p=window.__r531,r=document.documentElement;if(!p||!r)return;const o=document.getElementById('formatx-event-horizon'),now=performance.now();
                const state=[r.dataset.fxPreloaderR531||'',o?.hidden?'hidden':'shown',r.dataset.fxMagStartupContractR530||'',r.dataset.fxCurrentMagRequestR530||'',r.dataset.fxCrystalOrganismR326||''].join('|');
                if(state!==last&&p.events.length<30){last=state;p.events.push({t:now,state});}
                if(p.visible==null&&r.dataset.fxPreloaderR531==='active'&&o&&!o.hidden){const s=getComputedStyle(o),b=o.getBoundingClientRect();p.visible=now;p.geometry={position:s.position,display:s.display,visibility:s.visibility,opacity:Number(s.opacity||1),pointerEvents:s.pointerEvents,zIndex:s.zIndex,backgroundImage:s.backgroundImage,backgroundColor:s.backgroundColor,left:b.left,top:b.top,width:b.width,height:b.height,ariaHidden:o.getAttribute('aria-hidden')};}
                const startup=r.dataset.fxMagStartupContractR530==='living-core-autostart-navigation-owned'||String(r.dataset.fxCurrentMagRequestR530||'').startsWith('navigation-owned');
                if(p.startup==null&&startup)p.startup=now;
                if(p.ready==null&&r.dataset.fxCrystalOrganismR326==='ready')p.ready=now;
                if(p.release==null&&r.dataset.fxPreloaderR531==='done')p.release=now;
              };
              new MutationObserver(snap).observe(document,{subtree:true,childList:true,attributes:true});
              addEventListener('DOMContentLoaded',snap,{once:true});addEventListener('load',snap,{once:true});
            });
            await page.goto(URL+'&case='+c.name,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxPreloaderR531==='done',{timeout:c.max+3000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready',{timeout:20000});
            const r=await page.evaluate(()=>{const root=document.documentElement;const vis=n=>{if(!n)return false;const s=getComputedStyle(n),b=n.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.15&&b.width>0&&b.height>0};return {probe:window.__r531,releaseSource:root.dataset.fxPreloaderReleaseR531||'',canvasCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length,stageCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-stage').length,pauseCount:document.querySelectorAll('.fx-reference-pause').length,canvasVisible:vis(document.querySelector('#hero .fx-crystal-organism-r326-canvas')),askVisible:vis(document.querySelector('.fx-reference-ask')),soundVisible:vis(document.querySelector('.fx-three-sound')),overflow:document.documentElement.scrollWidth-innerWidth};});
            console.log('R531_RESULT',c.name,JSON.stringify(r));
            const p=r.probe,g=p.geometry;assert.ok(p.visible!=null,`${c.name}: loader never became visible; ${JSON.stringify(p.events)}`);assert.ok(g,`${c.name}: no visible geometry captured`);assert.equal(g.position,'fixed',`${c.name}: loader not fixed ${JSON.stringify(g)}`);assert.equal(g.pointerEvents,'none',`${c.name}: loader blocks pointer`);assert.equal(g.ariaHidden,'true',`${c.name}: loader not aria-hidden`);assert.ok(Math.abs(g.left)<=2&&Math.abs(g.top)<=2,`${c.name}: cover origin wrong ${JSON.stringify(g)}`);assert.ok(g.width>=c.viewport.width-2&&g.height>=c.viewport.height-2,`${c.name}: cover size wrong ${JSON.stringify(g)}`);assert.ok(Number.parseInt(g.zIndex,10)>=10000,`${c.name}: z-index too low ${g.zIndex}`);assert.ok(p.startup!=null&&p.release!=null,`${c.name}: startup/release timing missing ${JSON.stringify(p)}`);assert.ok(p.startup<=p.release,`${c.name}: MAG startup waited until after loader release ${JSON.stringify(p)}`);assert.ok(p.release-p.visible<=c.max+220,`${c.name}: hard bound exceeded ${JSON.stringify(p)}`);if(c.reducedMotion==='reduce')assert.ok(p.release-p.visible<=500,`${c.name}: reduced release too slow ${JSON.stringify(p)}`);assert.equal(r.canvasCount,1);assert.equal(r.stageCount,1);assert.equal(r.pauseCount,0);assert.ok(r.canvasVisible&&r.askVisible&&r.soundVisible,`${c.name}: post-release product incomplete ${JSON.stringify(r)}`);assert.ok(r.overflow<=2,`${c.name}: overflow ${r.overflow}`);assert.deepEqual(errors,[],`${c.name}: browser errors ${JSON.stringify(errors)}`);
            await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});try{for(const c of cases)await one(browser,c);}finally{await browser.close();}})().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
          node "$RUNNER_TEMP/r531-v2.cjs"
