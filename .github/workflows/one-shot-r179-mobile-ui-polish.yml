name: One-shot publish r179 mobile UI polish

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r179-mobile-ui-polish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish r179 mobile UI polish with fresh cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/index.html')
          s=p.read_text()
          link='  <link rel="stylesheet" data-fx-mobile-ui-polish-r179="true" href="./styles/formatx-mobile-ui-polish-r179.css?v=20260816-r179-mobile-ui-polish">\n'
          if 'data-fx-mobile-ui-polish-r179="true"' not in s:
              needle='  <link rel="stylesheet" data-fx-award-narrative-r175="true" href="./styles/formatx-award-narrative-r175.css?v=20260816-r175-award-narrative">\n'
              if needle not in s:
                  raise SystemExit('r175 stylesheet anchor not found')
              s=s.replace(needle,needle+link,1)
          else:
              import re
              s=re.sub(r'  <link rel="stylesheet" data-fx-mobile-ui-polish-r179="true" href="[^"]+">\n',link,s,count=1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html docs/scifi-ui/styles/formatx-mobile-ui-polish-r179.css
          git rm .github/workflows/one-shot-r179-mobile-ui-polish.yml
          git commit -m '[deploy-production] fix(mobile): publish r179 header controls and proof flow'
          git push origin HEAD:master
