name: P0 R518 build Apex candidate

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r518-build-apex-candidate.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: p0-r518-apex-startup
  BASE_SHA: 0cae78cd44785984e5b2b966636fa29032550398
  NEW_TOKEN: 20260904-r518-post-load-progress

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply evidence-backed R518 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          apex = Path('docs/scifi-ui/scripts/formatx-apex.js')
          s = apex.read_text()
          old = "    progress();\n    addEventListener('scroll', scheduleProgress, { passive: true });\n    addEventListener('resize', scheduleProgress, { passive: true });\n"
          new = "    // R518: avoid the forced startup scrollHeight layout flush after the DCL mutation batch.\n    // pageshow runs after initial layout and also covers BFCache / restored scroll state.\n    addEventListener('scroll', scheduleProgress, { passive: true });\n    addEventListener('resize', scheduleProgress, { passive: true });\n    addEventListener('pageshow', scheduleProgress, { passive: true });\n"
          if s.count(old) != 1:
              raise SystemExit(f'apex startup target count={s.count(old)}')
          apex.write_text(s.replace(old, new, 1))

          old_token = 'formatx-apex.js?v=20260726-apex-2'
          new_token = 'formatx-apex.js?v=20260904-r518-post-load-progress'
          for filename in ['docs/scifi-ui/index.html', '.github/workflows/probe-live-formatx.yml']:
              p = Path(filename)
              s = p.read_text()
              if s.count(old_token) != 1:
                  raise SystemExit(f'{filename}: apex token count={s.count(old_token)}')
              p.write_text(s.replace(old_token, new_token, 1))
          PY

          node --check docs/scifi-ui/scripts/formatx-apex.js
          grep -F "addEventListener('pageshow', scheduleProgress" docs/scifi-ui/scripts/formatx-apex.js
          grep -F "formatx-apex.js?v=$NEW_TOKEN" docs/scifi-ui/index.html
          grep -F "formatx-apex.js?v=$NEW_TOKEN" .github/workflows/probe-live-formatx.yml
          ! grep -Fq '    progress();' docs/scifi-ui/scripts/formatx-apex.js

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/scifi-ui/scripts/formatx-apex.js'
          printf '%s\n' "${changed[@]}" | grep -Fx 'docs/scifi-ui/index.html'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/probe-live-formatx.yml'
          git diff --check

      - name: Commit single coherent R518 revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-apex.js docs/scifi-ui/index.html .github/workflows/probe-live-formatx.yml
          git commit -m 'Fix R518 Apex startup forced layout'
          git push origin HEAD:"$TARGET_BRANCH"
          git log -2 --oneline
          test -z "$(git status --porcelain)"
