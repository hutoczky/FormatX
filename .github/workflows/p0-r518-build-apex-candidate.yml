name: P0 R518 build temporary Apex tree

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r518-build-apex-candidate.yml']

permissions:
  contents: write

env:
  TARGET_BRANCH: p0-r518-apex-buildtmp
  BASE_SHA: 0cae78cd44785984e5b2b966636fa29032550398

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 2
      - name: Patch and commit product files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/scripts/formatx-apex.js')
          s=p.read_text()
          old="    progress();\n    addEventListener('scroll', scheduleProgress, { passive: true });\n    addEventListener('resize', scheduleProgress, { passive: true });\n"
          new="    // R518: avoid the forced startup scrollHeight layout flush after the DCL mutation batch.\n    // pageshow runs after initial layout and also covers BFCache / restored scroll state.\n    addEventListener('scroll', scheduleProgress, { passive: true });\n    addEventListener('resize', scheduleProgress, { passive: true });\n    addEventListener('pageshow', scheduleProgress, { passive: true });\n"
          if s.count(old)!=1: raise SystemExit('apex target mismatch')
          p.write_text(s.replace(old,new,1))
          p=Path('docs/scifi-ui/index.html'); s=p.read_text()
          old='formatx-apex.js?v=20260726-apex-2'; new='formatx-apex.js?v=20260904-r518-post-load-progress'
          if s.count(old)!=1: raise SystemExit('index token mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          node --check docs/scifi-ui/scripts/formatx-apex.js
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-apex.js docs/scifi-ui/index.html
          git commit -m 'Build R518 Apex product tree'
          git push origin HEAD:"$TARGET_BRANCH"
          git log -2 --oneline
