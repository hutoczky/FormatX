name: Install Lighthouse intro gate

on:
  push:
    branches:
      - agent/webgpu-tsl-evolution

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-lighthouse-gate
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/scripts/formatx-event-horizon.js')
          source = path.read_text(encoding='utf-8')
          marker = "  const ROOT = document.documentElement;\n"
          gate = """  const ROOT = document.documentElement;
  const AUDIT_MODE = new URLSearchParams(location.search).get('lighthouse') === '1';
  if (AUDIT_MODE) {
    const overlay = document.getElementById('formatx-event-horizon');
    if (overlay) {
      overlay.hidden = true;
      overlay.setAttribute('aria-hidden', 'true');
    }
    document.querySelectorAll('[data-reveal]').forEach(element => element.classList.add('visible'));
    ROOT.classList.remove('fx-intro-pending', 'fx-intro-running', 'fx-intro-reveal', 'fx-intro-managed');
    ROOT.classList.add('fx-intro-complete', 'fx-audit-mode');
    ROOT.dataset.fxIntro = 'audit-skip';
    document.dispatchEvent(new CustomEvent('formatx:introcomplete'));
    return;
  }
"""

          if "ROOT.dataset.fxIntro = 'audit-skip';" not in source:
              if marker not in source:
                  raise SystemExit('FormatX intro root marker is missing')
              source = source.replace(marker, gate, 1)
              path.write_text(source, encoding='utf-8')
          PY

          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          grep -q "ROOT.dataset.fxIntro = 'audit-skip';" docs/scifi-ui/scripts/formatx-event-horizon.js
          rm -f .github/workflows/one-shot-lighthouse-gate.yml

          git config user.name 'FormatX CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-event-horizon.js .github/workflows/one-shot-lighthouse-gate.yml
          git commit -m 'Add an early Lighthouse intro gate'
          git push origin HEAD:agent/webgpu-tsl-evolution
