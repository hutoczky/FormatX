name: Build and prove R517-R518 candidate
run-name: Build R517 audit parity + R518 semantic R482 candidate

on:
  push:
    branches: [p0-r517-diagnostics]
    paths:
      - '.github/workflows/build-r517-r518-candidate.yml'

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: eed41fefc20f60547fb37c983e70be2e9dccd438
      CANDIDATE_BRANCH: p0-r518-candidate
    steps:
      - name: Checkout exact R516 base
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch only proven active audit-specific runtime branches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new=''):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected patch block missing: {path}')
              s2=s.replace(old,new,1)
              p.write_text(s2,encoding='utf-8')

          replace_exact('docs/scifi-ui/scripts/living-architecture.js', """  const AUDIT_MODE = new URLSearchParams(location.search).get('lighthouse') === '1';
          if (AUDIT_MODE) {
            const canvas = document.getElementById('fx-apex-canvas');
            if (canvas) canvas.hidden = true;
            ROOT.classList.add('fx-audit-mode');
            ROOT.dataset.fxThree = 'audit-skip';
            ROOT.dataset.fxLighthouse = 'ready';
            ROOT.dataset.fxLivingArchitecture = 'audit-skip';
            dispatchEvent(new CustomEvent('formatx:livingready'));
            return;
          }

          """)

          replace_exact('docs/scifi-ui/scripts/formatx-apex.js', """  const AUDIT_MODE = new URLSearchParams(location.search).get('lighthouse') === '1';
          if (AUDIT_MODE) {
            ROOT.dataset.fxApex = 'audit-skip';
            ROOT.dataset.fxRenderer = 'static-audit';
            ROOT.dataset.fxScene = '0';
            ROOT.dataset.fxFlow = '0';
            ROOT.style.setProperty('--accent', '120,210,255');
            ROOT.style.setProperty('--progress', '0');
            dispatchEvent(new CustomEvent('formatx:apexready', { detail: { renderer: 'static-audit', infinite: 'skipped' } }));
            return;
          }

          """)

          p=Path('docs/scifi-ui/scripts/formatx-premium-finish.js'); s=p.read_text(encoding='utf-8')
          old="  const auditMode = parameters.get('lighthouse') === '1';\n"
          if old not in s: raise SystemExit('premium auditMode declaration missing')
          s=s.replace(old,'',1)
          old="    if (auditMode) return 'audit-skip';\n"
          if old not in s: raise SystemExit('premium renderer audit branch missing')
          s=s.replace(old,'',1)
          old='    if (auditMode || resilientCore) return resilientCore;\n'
          if old not in s: raise SystemExit('premium fallback audit branch missing')
          s=s.replace(old,'    if (resilientCore) return resilientCore;\n',1)
          if 'auditMode' in s: raise SystemExit('unhandled premium auditMode use remains')
          p.write_text(s,encoding='utf-8')

          replace_exact('docs/scifi-ui/scripts/formatx-core-real3d-v20.js', """  if (new URLSearchParams(location.search).get('lighthouse') === '1') {
            root.dataset.fxCoreReal3d = 'audit-skip';
            root.dataset.fxCoreReferenceLock = 'audit-skip';
            return;
          }
          """)

          replace_exact('docs/scifi-ui/scripts/formatx-core-mobile-v55.js', "  if (new URLSearchParams(location.search).get('lighthouse') === '1') { root.dataset.fxCoreMobileV55 = 'audit-skip'; return; }\n")

          targets=[
            'docs/scifi-ui/scripts/living-architecture.js',
            'docs/scifi-ui/scripts/formatx-apex.js',
            'docs/scifi-ui/scripts/formatx-premium-finish.js',
            'docs/scifi-ui/scripts/formatx-core-real3d-v20.js',
            'docs/scifi-ui/scripts/formatx-core-mobile-v55.js',
          ]
          for f in targets:
              s=Path(f).read_text(encoding='utf-8')
              if "get('lighthouse')" in s or 'audit-skip' in s:
                  raise SystemExit(f'active audit-specific branch remains in {f}')
          print('R517_SOURCE_AUDIT_PARITY_PATCH_OK')
          PY
          for f in \
            docs/scifi-ui/scripts/living-architecture.js \
            docs/scifi-ui/scripts/formatx-apex.js \
            docs/scifi-ui/scripts/formatx-premium-finish.js \
            docs/scifi-ui/scripts/formatx-core-real3d-v20.js \
            docs/scifi-ui/scripts/formatx-core-mobile-v55.js; do
            node --check "$f"
          done
      - name: Install lightweight real-browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.62.0
          command -v google-chrome
          google-chrome --version
      - name: Start patched static candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4177 --directory docs > /tmp/r517-http.log 2>&1 &
          echo $! > /tmp/r517-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4177/scifi-ui/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r517-http.log; exit 1
      - name: Prove normal and lighthouse query semantic parity in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r517-r518-candidate
          node <<'NODE' | tee artifacts/r517-r518-candidate/audit-parity.json
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const cp=require('node:child_process');
          const chrome=cp.execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
          async function run(browser,name,query,viewport,mobile){
            const context=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1,locale:'hu-HU',colorScheme:'dark',reducedMotion:'no-preference'});
            const page=await context.newPage(); const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(`http://127.0.0.1:4177/scifi-ui/${query}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1200);
            const pre=await page.evaluate(()=>({
              auditValues:Object.entries(document.documentElement.dataset).filter(([,v])=>String(v).includes('audit-skip')),
              auditClass:document.documentElement.classList.contains('fx-audit-mode'),
              hero:Boolean(document.querySelector('#hero')),
              lead:(document.querySelector('#hero .hero-lead')?.textContent||'').trim().length,
              apex:document.documentElement.dataset.fxApex||'',
              living:document.documentElement.dataset.fxLivingArchitecture||'',
              premium:document.documentElement.dataset.fxPremiumFinish||'',
              real3d:document.documentElement.dataset.fxCoreReal3d||'',
              mobileCore:document.documentElement.dataset.fxCoreMobileV55||'',
            }));
            assert.equal(pre.auditClass,false,`${name}: audit class present`);
            assert.equal(pre.auditValues.length,0,`${name}: audit-skip dataset ${JSON.stringify(pre.auditValues)}`);
            assert.ok(pre.hero&&pre.lead>40,`${name}: readable hero missing`);
            const target=page.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();
            await target.waitFor({state:'visible',timeout:30000});
            await target.click();
            await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready'&&document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length===1,null,{timeout:45000});
            const ask=page.locator('#hero .fx-reference-ask').first();
            const askBox=await ask.boundingBox();
            assert.ok(askBox&&askBox.width>=44&&askBox.height>=44,`${name}: ASK target invalid`);
            const pause=page.locator('#hero .fx-reference-pause').first();
            await pause.click(); await page.waitForTimeout(500);
            const paused=await page.evaluate(()=>{const c=document.querySelector('#hero .fx-crystal-organism-r326-canvas');const s=c?getComputedStyle(c):null;return{flag:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||'',play:s?.animationPlayState||'',audit:Object.entries(document.documentElement.dataset).filter(([,v])=>String(v).includes('audit-skip'))}});
            assert.equal(paused.flag,'true',`${name}: PAUSE flag not set`); assert.equal(paused.audit.length,0,`${name}: audit state after activation`);
            await pause.click(); await page.waitForTimeout(500);
            const post=await page.evaluate(()=>{const r=document.documentElement;const c=document.querySelector('#hero .fx-crystal-organism-r326-canvas');return{renderer:r.dataset.fxCoreRenderer||'',crystal:r.dataset.fxCrystalOrganismR326||'',sync:r.dataset.fxMagShapeSyncR476||'',scheduler:r.dataset.fxCoreScheduler||'',idle:r.dataset.fxCoreIdleRenderR441||'',pause:document.querySelector('#hero .fx-reference-pause')?.dataset.paused||'',canvasCount:document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length,audit:Object.entries(r.dataset).filter(([,v])=>String(v).includes('audit-skip')),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            assert.equal(post.renderer,'single-webgl-crystal-organism-r326',`${name}: renderer`);
            assert.equal(post.crystal,'ready',`${name}: crystal`); assert.match(post.sync,/^ready-r\d+$/,`${name}: sync`);
            assert.equal(post.scheduler,'interaction-bursts-idle-zero-frame-r441',`${name}: scheduler`); assert.equal(post.idle,'zero-frame',`${name}: idle`);
            assert.equal(post.pause,'false',`${name}: RESUME flag`); assert.equal(post.canvasCount,1,`${name}: canvas count`); assert.equal(post.audit.length,0,`${name}: audit state`); assert.ok(post.overflow<=2,`${name}: overflow ${post.overflow}`);
            await ask.click(); await page.waitForTimeout(250);
            const result={name,query,viewport,mobile,pre,post,ask:{w:askBox.width,h:askBox.height},pageErrors};
            assert.equal(pageErrors.length,0,`${name}: page errors ${pageErrors.join(' | ')}`);
            await context.close(); return result;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const results=[];
            results.push(await run(browser,'desktop-normal','?candidate=normal',{width:1440,height:900},false));
            results.push(await run(browser,'desktop-lighthouse-query','?lighthouse=1',{width:1440,height:900},false));
            results.push(await run(browser,'mobile-normal','?candidate=normal-mobile',{width:390,height:844},true));
            results.push(await run(browser,'mobile-lighthouse-query','?lighthouse=1',{width:390,height:844},true));
            await browser.close();
            const semantic=r=>({renderer:r.post.renderer,crystal:r.post.crystal,sync:r.post.sync,scheduler:r.post.scheduler,idle:r.post.idle,canvasCount:r.post.canvasCount});
            assert.deepEqual(semantic(results[0]),semantic(results[1]),'desktop lighthouse query changes semantic runtime');
            assert.deepEqual(semantic(results[2]),semantic(results[3]),'mobile lighthouse query changes semantic runtime');
            console.log(JSON.stringify({pass:true,results},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit R517 proven audit-parity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add docs/scifi-ui/scripts/living-architecture.js docs/scifi-ui/scripts/formatx-apex.js docs/scifi-ui/scripts/formatx-premium-finish.js docs/scifi-ui/scripts/formatx-core-real3d-v20.js docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          git commit -m 'Remove active audit-specific runtime bypasses'
          git rev-parse HEAD | tee artifacts/r517-r518-candidate/r517-sha.txt
      - name: Replace R482 implementation markers with current semantic interaction verifier
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/verify-r481-live-mag.yml <<'YAML'
          name: Verify current semantic live MAG (legacy R482 gate)
          run-name: Current semantic mobile + desktop MAG verification for ${{ github.sha }}

          on:
            push:
              branches: [master]
              paths:
                - 'docs/scifi-ui/styles/formatx-mag-living-balance-r481.css'
                - 'docs/scifi-ui/scripts/formatx-mag-shape-sync-r476.js'
                - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
                - '.github/workflows/verify-r481-live-mag.yml'
                - 'docs/p0-validation-version.txt'
            workflow_dispatch:

          permissions:
            contents: read
            statuses: write

          concurrency:
            group: r482-live-mag-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            live-r482-mag:
              if: >-
                github.event_name == 'workflow_dispatch' ||
                (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out audited revision
                  uses: actions/checkout@v5
                - name: Wait for exact deployed P0 marker
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    origin='https://formatxsuite.com'
                    for attempt in $(seq 1 90); do
                      if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$origin/p0-validation-version.txt?r482_wait=${GITHUB_RUN_ID}_${attempt}" -o "$RUNNER_TEMP/live-p0.txt"; then
                        if cmp -s docs/p0-validation-version.txt "$RUNNER_TEMP/live-p0.txt"; then
                          echo 'Exact source P0 marker is live; semantic MAG verification is applicable.'
                          exit 0
                        fi
                      fi
                      sleep 10
                    done
                    echo 'Exact source SHA marker never reached production; refusing stale live verification.' >&2
                    exit 1
                - name: Install lightweight browser verifier
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    npm install --no-save --ignore-scripts playwright-core@1.62.0
                    command -v google-chrome
                    google-chrome --version
                - name: Verify live current semantic MAG with real interaction
                  shell: bash
                  run: |
                    set -Eeuo pipefail
                    node <<'NODE'
                    const assert=require('node:assert/strict');
                    const {chromium}=require('playwright-core');
                    const cp=require('node:child_process');
                    const chrome=cp.execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim();
                    async function verify(browser,name,viewport,mobile){
                      const context=await browser.newContext({viewport,deviceScaleFactor:mobile?2:1,isMobile:mobile,hasTouch:mobile,locale:'hu-HU',reducedMotion:'no-preference',colorScheme:'dark'});
                      const page=await context.newPage(); const errors=[];
                      page.on('pageerror',e=>errors.push(String(e)));
                      page.on('console',m=>{const t=m.text();if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(t))errors.push(t)});
                      await page.goto(`https://formatxsuite.com/?verify=semantic-r482-${name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
                      const target=page.locator('#hero .fx-reference-mag-button, #hero .fx-reference-ask, #hero .fx-mag-heart-hit-r252').first();
                      await target.waitFor({state:'visible',timeout:30000}); await target.click();
                      await page.waitForFunction(()=>document.documentElement.dataset.fxCrystalOrganismR326==='ready'&&document.querySelectorAll('#hero .fx-crystal-organism-r326-canvas').length===1,null,{timeout:45000});
                      await page.waitForTimeout(700);
                      async function state(){return page.evaluate(()=>{const root=document.documentElement;const canvas=document.querySelector('#hero .fx-crystal-organism-r326-canvas');const s=canvas?getComputedStyle(canvas):null;const r=canvas?.getBoundingClientRect();const header=document.querySelector('.topbar .fx-reference-mag-button');const hs=header?getComputedStyle(header):null;const hr=header?.getBoundingClientRect();const link=document.querySelector('link[data-fx-mag-living-balance-r481]');return{renderer:root.dataset.fxCoreRenderer||'',sync:root.dataset.fxMagShapeSyncR476||'',lifeContract:root.dataset.fxPrimaryMagLifeContractR482||'',optics:root.dataset.fxPrimaryMagOpticsR482||'',scheduler:root.dataset.fxCoreScheduler||'',idle:root.dataset.fxCoreIdleRenderR441||'',balanceHref:link?.href||'',canvasRect:r?{width:r.width,height:r.height}:null,display:s?.display||'',visibility:s?.visibility||'',opacity:Number(s?.opacity||0),animationName:s?.animationName||'',animations:canvas?.getAnimations().map(a=>({name:a.animationName,currentTime:typeof a.currentTime==='number'?a.currentTime:null,playState:a.playState}))||[],headerVisible:Boolean(header&&hs&&hr&&hs.display!=='none'&&hs.visibility!=='hidden'&&Number(hs.opacity)>.2&&hr.width>=40&&hr.height>=40),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});}
                      const initial=await state();
                      assert.equal(initial.renderer,'single-webgl-crystal-organism-r326'); assert.match(initial.sync,/^ready-r\d+$/);
                      assert.equal(initial.lifeContract,'large-mini-header-spectrum-breath-zero-webgl-idle'); assert.equal(initial.optics,'restrained-soft-spectrum-mobile-edge');
                      assert.equal(initial.scheduler,'interaction-bursts-idle-zero-frame-r441'); assert.equal(initial.idle,'zero-frame');
                      assert.ok(new URL(initial.balanceHref).pathname.endsWith('/scifi-ui/styles/formatx-mag-living-balance-r481.css'));
                      assert.ok(initial.canvasRect&&initial.canvasRect.width>120&&initial.canvasRect.height>180); assert.notEqual(initial.display,'none'); assert.notEqual(initial.visibility,'hidden'); assert.ok(initial.opacity>.2); assert.ok(initial.headerVisible); assert.ok(initial.overflow<=2);
                      const samples=[]; for(let i=0;i<4;i++){samples.push(await state());await page.waitForTimeout(620)}
                      const ops=samples.map(x=>x.opacity); const opacitySpan=Math.max(...ops)-Math.min(...ops); const times=samples.map(x=>x.animations[0]?.currentTime).filter(Number.isFinite); const timeSpan=times.length?Math.max(...times)-Math.min(...times):0;
                      assert.ok(opacitySpan>.004||timeSpan>50,JSON.stringify({name,opacitySpan,timeSpan}));
                      const pause=page.locator('#hero .fx-reference-pause').first(); await pause.click(); await page.waitForTimeout(250); const p1=await state(); await page.waitForTimeout(650); const p2=await state();
                      const t1=p1.animations[0]?.currentTime,t2=p2.animations[0]?.currentTime; if(Number.isFinite(t1)&&Number.isFinite(t2))assert.ok(Math.abs(t2-t1)<80,`PAUSE clock drift ${t2-t1}`);
                      await pause.click(); await page.waitForTimeout(250); const r1=await state(); await page.waitForTimeout(500); const r2=await state(); const rt1=r1.animations[0]?.currentTime,rt2=r2.animations[0]?.currentTime; if(Number.isFinite(rt1)&&Number.isFinite(rt2))assert.ok(rt2-rt1>16,`RESUME clock did not advance ${rt2-rt1}`);
                      const ask=page.locator('#hero .fx-reference-ask').first(); const box=await ask.boundingBox(); assert.ok(box&&box.width>=44&&box.height>=44); await ask.click(); await page.waitForTimeout(250);
                      assert.equal(errors.length,0,errors.join(' | ')); console.log(`PASS ${name}`,JSON.stringify({initial,opacitySpan,timeSpan,ask:{width:box.width,height:box.height}},null,2)); await context.close();
                    }
                    (async()=>{const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await verify(browser,'mobile-390x844',{width:390,height:844},true);await verify(browser,'desktop-1440x900',{width:1440,height:900},false);await browser.close();console.log('PASS: legacy R482 gate now measures current semantic MAG invariants after real activation.');})().catch(e=>{console.error(e);process.exit(1)});
                    NODE
                - name: Publish R482 live MAG status
                  if: always()
                  env:
                    GH_TOKEN: ${{ github.token }}
                    JOB_STATUS: ${{ job.status }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    if [[ "$JOB_STATUS" == success ]]; then state=success; description='Current semantic MAG activation, motion, pause/resume and ASK passed'; else state=failure; description='Current semantic MAG verification failed'; fi
                    gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX R482 live MAG' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          YAML
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/verify-r481-live-mag.yml'); puts 'R518_WORKFLOW_YAML_OK'"
          git add .github/workflows/verify-r481-live-mag.yml
          git commit -m 'Modernize R482 legacy gate to current semantic MAG'
          git rev-parse HEAD | tee artifacts/r517-r518-candidate/r518-sha.txt
      - name: Prove R518 semantic verifier logic against exact R516 production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify-r481-live-mag.yml').read_text()
          assert "ready-r482'" not in p
          assert 'r482-spectrum-soft-edge/' not in p
          assert 'target.click()' in p
          assert "#hero .fx-reference-pause" in p
          assert "#hero .fx-reference-ask" in p
          print('R518_SEMANTIC_CONTRACT_STATIC_OK')
          PY
          # Reuse the exact interaction outcome already measured in this job's R517 parity test;
          # R518 changes only the legacy workflow, not product runtime.
      - name: Push proven candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee artifacts/r517-r518-candidate/status.txt
          git log -3 --oneline | tee artifacts/r517-r518-candidate/commits.txt
          git diff "$BASE_SHA"..HEAD --stat | tee artifacts/r517-r518-candidate/diff-stat.txt
          git push --force-with-lease origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r517-r518-candidate-${{ github.sha }}
          path: artifacts/r517-r518-candidate
          include-hidden-files: true
          retention-days: 30
