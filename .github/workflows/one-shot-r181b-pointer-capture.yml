name: One-shot publish r181b pointer capture
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r181b-pointer-capture.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish robust r181b desktop pointer capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js=Path('docs/scifi-ui/scripts/formatx-desktop-apex-r181.js')
          s=js.read_text()
          old="""  if(bound!==space){
    bound=space;
    space.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!desktop.matches)return;const r=space.getBoundingClientRect();tx=clamp((e.clientX-r.left)/Math.max(1,r.width)*2-1,-1,1);ty=clamp((e.clientY-r.top)/Math.max(1,r.height)*2-1,-1,1);energy=Math.max(energy,.32);},{passive:true});
    space.addEventListener('pointerdown',()=>{energy=1;root.dataset.fxDesktopApexInteractionR181='energized';},{passive:true});
    space.addEventListener('pointerleave',()=>{tx=0;ty=0;},{passive:true});
  }
"""
          new="""  if(bound!==hero){
    bound=hero;
    hero.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!desktop.matches)return;const r=space.getBoundingClientRect();tx=clamp((e.clientX-r.left)/Math.max(1,r.width)*2-1,-1,1);ty=clamp((e.clientY-r.top)/Math.max(1,r.height)*2-1,-1,1);energy=Math.max(energy,.36);root.dataset.fxDesktopApexInteractionR181='tracking';},{passive:true,capture:true});
    hero.addEventListener('pointerdown',e=>{if(!desktop.matches)return;const r=space.getBoundingClientRect();tx=clamp((e.clientX-r.left)/Math.max(1,r.width)*2-1,-1,1);ty=clamp((e.clientY-r.top)/Math.max(1,r.height)*2-1,-1,1);energy=1;root.dataset.fxDesktopApexInteractionR181='energized';},{passive:true,capture:true});
    hero.addEventListener('pointerleave',()=>{tx=0;ty=0;},{passive:true,capture:true});
  }
"""
          if old not in s: raise SystemExit('r181 pointer binding anchor missing')
          js.write_text(s.replace(old,new,1))
          p=Path('docs/scifi-ui/index.html')
          html=p.read_text()
          oldq='formatx-desktop-apex-r181.js?v=20260816-r181-crystal-apex'
          newq='formatx-desktop-apex-r181.js?v=20260816-r181b-pointer-capture'
          if oldq in html: html=html.replace(oldq,newq,1)
          elif newq not in html: raise SystemExit('r181 JS cache token missing')
          p.write_text(html)
          PY
          node --check docs/scifi-ui/scripts/formatx-desktop-apex-r181.js
          grep -q "capture:true" docs/scifi-ui/scripts/formatx-desktop-apex-r181.js
          grep -q "r181b-pointer-capture" docs/scifi-ui/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/scripts/formatx-desktop-apex-r181.js docs/scifi-ui/index.html
          git commit -m '[deploy-production] fix(soty): publish r181b capture-phase desktop interaction'
          git push origin HEAD:master
