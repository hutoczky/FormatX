name: R2014 source bundle for local MAG and Lighthouse debugging

on:
  push:
    branches: [dev/r2008-archive-adaptive-native-render]
    paths:
      - '.github/workflows/site-debug-bundle-r2014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pack actual website source, without application secrets
        run: tar -czf formatx-static-source.tar.gz -C docs scifi-ui
      - name: Publish inspectable static assets
        uses: actions/upload-artifact@v4
        with:
          name: formatx-scifi-ui-source-r2014
          path: formatx-static-source.tar.gz
          retention-days: 2
          if-no-files-found: error
