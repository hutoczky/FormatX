name: Validate mobile MAG optics r324
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - '.github/workflows/validate-mobile-core-softening-r322.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-core-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate r324 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'formatx-mobile-core-softening-r322.css?v=20260824-r324-balanced-optics' docs/scifi-ui/scripts/formatx-award-runtime-r206.js
          grep -Fq 'brightness(.83)' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'contrast(1)' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'saturate(1.09)' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'blur(.38px)' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'opacity: .68' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'fx-biolume-travel-r323' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'deep-water-iridescent-traveling-rim' docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js
          grep -Fq 'r323-deep-water-biolume' docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r324-optics" && cd "$RUNNER_TEMP/r324-optics"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify balanced mobile softening biolume and desktop isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/r324-http.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/r324-optics"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          async function mobile(browser){
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return d.fxMobileCoreOpticsR322==='soft-glow-soft-edge'
                && d.fxCoreBiolumeR323==='ready'
                && document.querySelector('.fx-core-r317-canvas')
                && document.querySelector('.fx-core-biolume-r323');
            },null,{timeout:45000});
            await page.waitForTimeout(500);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('.fx-core-r317-canvas');
              const style=canvas?getComputedStyle(canvas):null;
              const link=document.querySelector('link[data-fx-mobile-core-softening-r322]');
              const rim=document.querySelector('.fx-core-biolume-r323');
              const runner=rim?.querySelector('.fx-biolume-runner-a');
              const runnerStyle=runner?getComputedStyle(runner):null;
              return{
                marker:document.documentElement.dataset.fxMobileCoreOpticsR322||'',
                biolume:document.documentElement.dataset.fxCoreBiolumeR323||'',
                profile:document.documentElement.dataset.fxCoreBiolumeProfileR323||'',
                link:Boolean(link),href:link?.getAttribute('href')||'',
                opacity:Number(style?.opacity||1),filter:style?.filter||'',
                width:canvas?.getBoundingClientRect().width||0,height:canvas?.getBoundingClientRect().height||0,
                rimPaths:rim?.querySelectorAll('path').length||0,
                rimOpacity:Number(rim?getComputedStyle(rim).opacity:0),
                animation:runnerStyle?.animationName||'',dasharray:runnerStyle?.strokeDasharray||''
              };
            });
            console.log('R324_MOBILE_OPTICS',JSON.stringify(state));
            assert.equal(state.marker,'soft-glow-soft-edge');
            assert.equal(state.biolume,'ready');
            assert.equal(state.profile,'deep-water-iridescent-traveling-rim');
            assert.equal(state.link,true);
            assert.match(state.href,/r324-balanced-optics/);
            assert.ok(state.opacity<=0.90&&state.opacity>=0.88,JSON.stringify(state));
            assert.match(state.filter,/brightness\(0\.83\)/);
            assert.match(state.filter,/contrast\(1\)/);
            assert.match(state.filter,/saturate\(1\.09\)/);
            assert.match(state.filter,/blur\(0\.38px\)/);
            assert.equal(state.rimPaths,5,JSON.stringify(state));
            assert.ok(state.rimOpacity>=0.66&&state.rimOpacity<=0.70,JSON.stringify(state));
            assert.match(state.animation,/fx-biolume-travel-r323/);
            assert.ok(state.width>0&&state.height>0,JSON.stringify(state));
            try {
              await page.addStyleTag({content:'*{animation-play-state:paused!important}'});
              await page.screenshot({path:'mobile-r324.png',fullPage:false,animations:'disabled',timeout:8000});
            } catch (error) {
              console.log('R324_SCREENSHOT_OPTIONAL',String(error.message||error));
            }
            await ctx.close();
          }
          async function desktop(browser){
            const ctx=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,isMobile:false,hasTouch:false,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1800);
            const state=await page.evaluate(()=>({
              link:Boolean(document.querySelector('link[data-fx-mobile-core-softening-r322]')),
              rim:Boolean(document.querySelector('.fx-core-biolume-r323')),
              marker:document.documentElement.dataset.fxMobileCoreOpticsR322||''
            }));
            assert.equal(state.link,false,JSON.stringify(state));
            assert.equal(state.rim,false,JSON.stringify(state));
            assert.equal(state.marker,'',JSON.stringify(state));
            await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await mobile(browser);await desktop(browser);await browser.close();console.log('PASS: r324 mobile MAG has balanced glow, softer edges and the living bioluminescent rim, with desktop unchanged.');})().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload mobile optical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-mobile-core-r324
          path: ${{ runner.temp }}/r324-optics/mobile-r324.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish mobile optics status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r324 balanced mobile MAG glow and softened edge contract passed'; else state=failure; description='r324 mobile MAG optical validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile core optics' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
