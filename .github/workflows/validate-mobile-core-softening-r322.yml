name: Validate mobile r250 mechanical orb performance
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-mechanical-orb-r250.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/styles/formatx-native-orb-reference-r250.css'
      - '.github/scripts/validate-mechanical-orb-r250-browser.cjs'
      - '.github/workflows/validate-mobile-core-softening-r322.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-core-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate native r250 source contracts
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-core-mechanical-orb-r250.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-control-owner-r268.js
          node --check .github/scripts/validate-mechanical-orb-r250-browser.cjs
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Install Chromium runtime
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/r250-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/r250-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop mobile interaction performance and WebGL1 fallback
        env:
          NODE_PATH: ${{ runner.temp }}/r250-browser/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_VISUAL_DIR: artifacts/mechanical-orb-r250
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs >"$RUNNER_TEMP/r250-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS "$FORMATX_TEST_URL" >/dev/null && break
            sleep .25
          done
          node .github/scripts/validate-mechanical-orb-r250-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r250-native-mechanical-orb-${{ github.run_id }}
          path: artifacts/mechanical-orb-r250
          if-no-files-found: ignore
          retention-days: 14
