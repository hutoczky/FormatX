name: Validate mobile MAG optics r344
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - 'docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css'
      - 'docs/scifi-ui/styles/formatx-mobile-regression-r310.css'
      - 'docs/scifi-ui/styles/formatx-quantum-particles-r335.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-regression-r310.js'
      - 'docs/scifi-ui/scripts/formatx-quantum-particles-r335.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - '.github/workflows/validate-mobile-core-softening-r322.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-core-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate r344 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'r344-restrained-bloom-soft-edge' docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          grep -Fq "r344-restrained-bloom-soft-edge-owner" docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          grep -Fq 'FormatX r344' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .69' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'brightness(.62)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'contrast(.75)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'saturate(.80)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'blur(1.32px)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .64' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'brightness(.58)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'contrast(.72)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'saturate(.77)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'blur(1.52px)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'r337-capture-touch' docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -Fq 'event-driven-no-idle-raf' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'capture-pointer-touch-deduplicated' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          ! grep -Eq 'requestAnimationFrame\s*\(|setInterval\s*\(|getContext\s*\(' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          node --check docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          node --check docs/scifi-ui/scripts/formatx-award-runtime-r206.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r344-optics" && cd "$RUNNER_TEMP/r344-optics"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify effective r344 optics and touch interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/r344-http.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/r344-optics"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return d.fxCoreMobileOpticsR328==='r344-restrained-bloom-soft-edge-owner'
                && d.fxQuantumParticlesR335==='ready'
                && d.fxQuantumParticleInput==='capture-pointer-touch-deduplicated'
                && document.querySelector('.fx-core-r317-canvas')
                && document.querySelectorAll('.fx-quantum-particle-r335').length===24;
            },null,{timeout:45000});
            await page.waitForTimeout(450);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('.fx-core-r317-canvas');
              const style=canvas?getComputedStyle(canvas):null;
              const optics=document.querySelector('link[data-fx-mobile-core-optics-r328]');
              const rim=document.querySelector('.fx-core-biolume-r323');
              const halo=rim?.querySelector('.fx-biolume-halo');
              return {
                marker:document.documentElement.dataset.fxCoreMobileOpticsR328||'',
                href:optics?.getAttribute('href')||'',
                opacity:Number(style?.opacity||1),
                filter:style?.filter||'',
                width:canvas?.getBoundingClientRect().width||0,
                height:canvas?.getBoundingClientRect().height||0,
                rimOpacity:Number(rim?getComputedStyle(rim).opacity:0),
                haloOpacity:Number(halo?getComputedStyle(halo).opacity:0),
                quantumCount:document.querySelectorAll('.fx-quantum-particle-r335').length,
                quantumInput:document.documentElement.dataset.fxQuantumParticleInput||''
              };
            });
            console.log('R344_EFFECTIVE_MOBILE_OPTICS',JSON.stringify(state));
            assert.equal(state.marker,'r344-restrained-bloom-soft-edge-owner');
            assert.match(state.href,/r344-restrained-bloom-soft-edge/);
            assert.ok(state.opacity>=0.63&&state.opacity<=0.65,JSON.stringify(state));
            assert.match(state.filter,/brightness\(0\.58\)/);
            assert.match(state.filter,/contrast\(0\.72\)/);
            assert.match(state.filter,/saturate\(0\.77\)/);
            assert.match(state.filter,/blur\(1\.52px\)/);
            assert.ok(state.rimOpacity<=0.017,JSON.stringify(state));
            assert.ok(state.haloOpacity<=0.004,JSON.stringify(state));
            assert.equal(state.quantumCount,24);
            assert.equal(state.quantumInput,'capture-pointer-touch-deduplicated');
            assert.ok(state.width>0&&state.height>0,JSON.stringify(state));

            const field=await page.locator('.fx-quantum-field-r335').boundingBox();
            assert.ok(field&&field.width>0&&field.height>0,JSON.stringify(field));
            const before=await page.evaluate(()=>Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0));
            await page.touchscreen.tap(field.x+field.width*.55,field.y+field.height*.48);
            await page.waitForFunction(n=>Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0)>n,before,{timeout:3000});

            try {
              await page.addStyleTag({content:'*{animation-play-state:paused!important}'});
              await page.screenshot({path:'mobile-r344.png',fullPage:false,animations:'disabled',timeout:8000});
            } catch (error) {
              console.log('R344_SCREENSHOT_OPTIONAL',String(error.message||error));
            }
            await ctx.close();
            await browser.close();
            console.log('PASS: r344 restrained mobile MAG optics and touch interaction validated.');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload mobile optical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-mobile-core-r344
          path: ${{ runner.temp }}/r344-optics/mobile-r344.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish mobile optics status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r344 restrained MAG bloom, soft edge and touch passed'; else state=failure; description='r344 mobile MAG optics validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile core optics' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
