name: Validate mobile MAG optics r343
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - 'docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css'
      - 'docs/scifi-ui/styles/formatx-quantum-particles-r335.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-regression-r310.js'
      - 'docs/scifi-ui/scripts/formatx-quantum-particles-r335.js'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - '.github/workflows/validate-mobile-core-softening-r322.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-core-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate r343 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'formatx-mobile-core-softening-r322.css?v=20260824-r327-soft-mobile-core' docs/scifi-ui/scripts/formatx-award-runtime-r206.js
          grep -Fq "fxMobileCoreOpticsR322 = 'r327-restrained-bloom-soft-edge'" docs/scifi-ui/scripts/formatx-award-runtime-r206.js
          grep -Fq 'r343-balanced-detail-soft-edge' docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          grep -Fq "r343-balanced-detail-soft-edge-owner" docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          grep -Fq 'FormatX r343' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .72' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'brightness(.66)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'contrast(.79)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'saturate(.83)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'blur(1.15px)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .69' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'brightness(.63)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'contrast(.77)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'saturate(.81)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'blur(1.30px)' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .022' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .004' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .016' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'opacity: .060' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'stroke-width: .09' docs/scifi-ui/styles/formatx-mobile-core-optics-r328.css
          grep -Fq 'r337-capture-touch' docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          grep -Fq 'r337-quantum-inspired-capture-touch-particles' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'probability-shells-entangled-pairs-collapse-tunneling' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'event-driven-no-idle-raf' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'capture-pointer-touch-deduplicated' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'fxQuantumParticleMeasurements' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'fxQuantumParticleTunnels' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          ! grep -Eq 'requestAnimationFrame\s*\(|setInterval\s*\(|getContext\s*\(' docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          grep -Fq 'reference-crystal-webgl-r317-modern-flat-normal-fresnel' docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js
          grep -Fq 'single-webgl-luminous-crystal-r99' docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r317.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-softlight-r318.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-mobile-regression-r310.js
          node --check docs/scifi-ui/scripts/formatx-quantum-particles-r335.js
          node --check docs/scifi-ui/scripts/formatx-award-runtime-r206.js
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r343-optics" && cd "$RUNNER_TEMP/r343-optics"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify effective r343 optics and r337 quantum touch interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/r343-http.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/r343-optics"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          async function mobile(browser){
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return d.fxCoreMobileOpticsR328==='r343-balanced-detail-soft-edge-owner'
                && d.fxCoreBiolumeR323==='ready'
                && d.fxQuantumParticlesR335==='ready'
                && d.fxQuantumParticleInput==='capture-pointer-touch-deduplicated'
                && document.querySelector('.fx-core-r317-canvas')
                && document.querySelector('.fx-core-biolume-r323')
                && document.querySelectorAll('.fx-quantum-particle-r335').length===24;
            },null,{timeout:45000});
            await page.waitForTimeout(400);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('.fx-core-r317-canvas');
              const style=canvas?getComputedStyle(canvas):null;
              const optics=document.querySelector('link[data-fx-mobile-core-optics-r328]');
              const quantum=document.querySelector('.fx-quantum-field-r335');
              const rim=document.querySelector('.fx-core-biolume-r323');
              const halo=rim?.querySelector('.fx-biolume-halo');
              const base=rim?.querySelector('.fx-biolume-base');
              const runner=rim?.querySelector('.fx-biolume-runner-a');
              const haloStyle=halo?getComputedStyle(halo):null;
              const baseStyle=base?getComputedStyle(base):null;
              const runnerStyle=runner?getComputedStyle(runner):null;
              return{
                opticsMarker:document.documentElement.dataset.fxCoreMobileOpticsR328||'',
                biolume:document.documentElement.dataset.fxCoreBiolumeR323||'',
                profile:document.documentElement.dataset.fxCoreBiolumeProfileR323||'',
                quantum:document.documentElement.dataset.fxQuantumParticlesR335||'',
                quantumModel:document.documentElement.dataset.fxQuantumParticleModel||'',
                quantumScheduler:document.documentElement.dataset.fxQuantumParticleScheduler||'',
                quantumInput:document.documentElement.dataset.fxQuantumParticleInput||'',
                measurements:Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0),
                tunnels:Number(document.documentElement.dataset.fxQuantumParticleTunnels||0),
                quantumCount:document.querySelectorAll('.fx-quantum-particle-r335').length,
                quantumState:quantum?.dataset.state||'',
                opticsLink:Boolean(optics),opticsHref:optics?.getAttribute('href')||'',
                opacity:Number(style?.opacity||1),filter:style?.filter||'',
                width:canvas?.getBoundingClientRect().width||0,height:canvas?.getBoundingClientRect().height||0,
                rimPaths:rim?.querySelectorAll('path').length||0,rimOpacity:Number(rim?getComputedStyle(rim).opacity:0),
                haloOpacity:Number(haloStyle?.opacity||0),haloFilter:haloStyle?.filter||'',haloStrokeWidth:haloStyle?.strokeWidth||'',
                baseOpacity:Number(baseStyle?.opacity||0),runnerOpacity:Number(runnerStyle?.opacity||0),runnerStrokeWidth:runnerStyle?.strokeWidth||'',
                animation:runnerStyle?.animationName||''
              };
            });
            console.log('R343_EFFECTIVE_MOBILE_OPTICS',JSON.stringify(state));
            assert.equal(state.opticsMarker,'r343-balanced-detail-soft-edge-owner');
            assert.equal(state.biolume,'ready');
            assert.equal(state.profile,'deep-water-iridescent-traveling-rim');
            assert.equal(state.quantum,'ready');
            assert.equal(state.quantumCount,24);
            assert.equal(state.quantumModel,'probability-shells-entangled-pairs-collapse-tunneling');
            assert.equal(state.quantumScheduler,'event-driven-no-idle-raf');
            assert.equal(state.quantumInput,'capture-pointer-touch-deduplicated');
            assert.equal(state.opticsLink,true);
            assert.match(state.opticsHref,/r343-balanced-detail-soft-edge/);
            assert.ok(state.opacity<=0.70&&state.opacity>=0.68,JSON.stringify(state));
            assert.match(state.filter,/brightness\(0\.63\)/);
            assert.match(state.filter,/contrast\(0\.77\)/);
            assert.match(state.filter,/saturate\(0\.81\)/);
            assert.match(state.filter,/blur\(1\.3px\)/);
            assert.equal(state.rimPaths,5,JSON.stringify(state));
            assert.ok(state.rimOpacity>=0.019&&state.rimOpacity<=0.021,JSON.stringify(state));
            assert.ok(state.haloOpacity>=0.003&&state.haloOpacity<=0.005,JSON.stringify(state));
            assert.match(state.haloFilter,/blur\(9\.5px\)/);
            assert.ok(state.baseOpacity>=0.015&&state.baseOpacity<=0.017,JSON.stringify(state));
            assert.ok(state.runnerOpacity>=0.059&&state.runnerOpacity<=0.061,JSON.stringify(state));
            assert.match(state.runnerStrokeWidth,/0\.09px|\.09px/);
            assert.match(state.animation,/fx-biolume-travel-r323/);
            assert.ok(state.width>0&&state.height>0,JSON.stringify(state));

            const box=await page.locator('.fx-quantum-field-r335').boundingBox();
            assert.ok(box&&box.width>0&&box.height>0,JSON.stringify(box));
            const before=await page.evaluate(()=>({
              measurements:Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0),
              tunnels:Number(document.documentElement.dataset.fxQuantumParticleTunnels||0)
            }));
            await page.touchscreen.tap(box.x+box.width*.55,box.y+box.height*.48);
            await page.waitForFunction(beforeCount=>Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0)>beforeCount,before.measurements,{timeout:3000});
            const measured=await page.evaluate(()=>({
              measurements:Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0),
              input:document.documentElement.dataset.fxQuantumParticleInputSource||'',
              last:document.documentElement.dataset.fxQuantumParticleLastState||''
            }));
            assert.ok(measured.measurements>before.measurements,JSON.stringify({before,measured}));
            assert.ok(['touch','pen','mouse','pointer'].includes(measured.input),JSON.stringify(measured));
            await page.waitForFunction(beforeCount=>Number(document.documentElement.dataset.fxQuantumParticleTunnels||0)>beforeCount,before.tunnels,{timeout:3000});
            await page.waitForFunction(()=>document.querySelector('.fx-quantum-field-r335')?.dataset.state==='superposition',null,{timeout:3000});
            const after=await page.evaluate(()=>({
              measurements:Number(document.documentElement.dataset.fxQuantumParticleMeasurements||0),
              tunnels:Number(document.documentElement.dataset.fxQuantumParticleTunnels||0),
              state:document.querySelector('.fx-quantum-field-r335')?.dataset.state||'',
              last:document.documentElement.dataset.fxQuantumParticleLastState||''
            }));
            console.log('R343_QUANTUM_TOUCH',JSON.stringify({before,measured,after}));
            assert.ok(after.tunnels>before.tunnels,JSON.stringify({before,after}));
            assert.equal(after.state,'superposition');

            try {
              await page.addStyleTag({content:'*{animation-play-state:paused!important}'});
              await page.screenshot({path:'mobile-r343.png',fullPage:false,animations:'disabled',timeout:8000});
            } catch (error) {
              console.log('R343_SCREENSHOT_OPTIONAL',String(error.message||error));
            }
            await ctx.close();
          }
          async function desktop(browser){
            const ctx=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,isMobile:false,hasTouch:false,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1800);
            const state=await page.evaluate(()=>({
              quantum:Boolean(document.querySelector('.fx-quantum-field-r335')),
              quantumMarker:document.documentElement.dataset.fxQuantumParticlesR335||''
            }));
            assert.equal(state.quantum,false,JSON.stringify(state));
            assert.ok(state.quantumMarker===''||state.quantumMarker==='desktop-bypass',JSON.stringify(state));
            await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await mobile(browser);await desktop(browser);await browser.close();console.log('PASS: r343 balanced-detail mobile MAG optics and r337 capture-phase touch quantum interaction validated.');})().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload mobile optical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-mobile-core-r343
          path: ${{ runner.temp }}/r343-optics/mobile-r343.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish mobile optics status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r343 balanced MAG detail + soft edge + r337 quantum touch passed'; else state=failure; description='r343 mobile MAG optics/quantum validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile core optics' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
