name: Validate mobile MAG optical softening r322
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css'
      - 'docs/scifi-ui/scripts/formatx-award-runtime-r206.js'
      - '.github/workflows/validate-mobile-core-softening-r322.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  mobile-core-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate r322 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'formatx-mobile-core-softening-r322.css?v=20260824-r322-soft-glow' docs/scifi-ui/scripts/formatx-award-runtime-r206.js
          grep -Fq 'brightness(.85) saturate(.88) contrast(.90) blur(.38px)' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
          grep -Fq 'opacity: .90 !important' docs/scifi-ui/styles/formatx-mobile-core-softening-r322.css
      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r322-optics" && cd "$RUNNER_TEMP/r322-optics"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify mobile softening and desktop isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory docs >"$RUNNER_TEMP/r322-http.log" 2>&1 &
          server_pid=$!; trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$RUNNER_TEMP/r322-optics"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          async function mobile(browser){
            const ctx=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxMobileCoreOpticsR322==='soft-glow-soft-edge'&&document.querySelector('.fx-core-r317-canvas'),null,{timeout:45000});
            await page.waitForTimeout(350);
            const state=await page.evaluate(()=>{
              const canvas=document.querySelector('.fx-core-r317-canvas');
              const style=canvas?getComputedStyle(canvas):null;
              const link=document.querySelector('link[data-fx-mobile-core-softening-r322]');
              return{marker:document.documentElement.dataset.fxMobileCoreOpticsR322||'',link:Boolean(link),href:link?.getAttribute('href')||'',opacity:Number(style?.opacity||1),filter:style?.filter||'',width:canvas?.getBoundingClientRect().width||0,height:canvas?.getBoundingClientRect().height||0};
            });
            assert.equal(state.marker,'soft-glow-soft-edge');
            assert.equal(state.link,true);
            assert.match(state.href,/formatx-mobile-core-softening-r322\.css/);
            assert.ok(state.opacity<=0.91&&state.opacity>=0.88,JSON.stringify(state));
            assert.match(state.filter,/brightness\(0\.85\)/);
            assert.match(state.filter,/saturate\(0\.88\)/);
            assert.match(state.filter,/contrast\(0\.9\)/);
            assert.match(state.filter,/blur\(0\.38px\)/);
            assert.ok(state.width>0&&state.height>0,JSON.stringify(state));
            await page.screenshot({path:'mobile-r322.png',fullPage:false});
            await ctx.close();
          }
          async function desktop(browser){
            const ctx=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,isMobile:false,hasTouch:false,locale:'hu-HU'});
            await ctx.addInitScript(()=>{try{localStorage.setItem('formatx:intro-seen-v1','1')}catch(_){}});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/scifi-ui/?lang=hu&immersive=1',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1800);
            const state=await page.evaluate(()=>({link:Boolean(document.querySelector('link[data-fx-mobile-core-softening-r322]')),marker:document.documentElement.dataset.fxMobileCoreOpticsR322||''}));
            assert.equal(state.link,false,JSON.stringify(state));
            assert.equal(state.marker,'',JSON.stringify(state));
            await ctx.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});await mobile(browser);await desktop(browser);await browser.close();console.log('PASS: r322 mobile MAG glow/edge softening is active only on mobile.');})().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Upload mobile optical proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-mobile-core-r322
          path: ${{ runner.temp }}/r322-optics/mobile-r322.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish mobile optics status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='r322 mobile MAG soft glow and soft edge passed'; else state=failure; description='r322 mobile MAG optical validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile core optics' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
