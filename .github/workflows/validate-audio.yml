name: Validate FormatX visible Web Audio control
run-name: Validate FormatX MUTE / UNMUTE r192 from ${{ github.sha }}

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-audio-engine-r191.js'
      - 'docs/scifi-ui/scripts/formatx-audio-toggle-r191.js'
      - 'docs/scifi-ui/styles/formatx-audio-toggle-r191.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - '.github/scripts/validate-audio.cjs'
      - '.github/workflows/validate-audio.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-audio-engine-r191.js'
      - 'docs/scifi-ui/scripts/formatx-audio-toggle-r191.js'
      - 'docs/scifi-ui/styles/formatx-audio-toggle-r191.css'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - '.github/scripts/validate-audio.cjs'
      - '.github/workflows/validate-audio.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-visible-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visible-audio-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate r192 audio architecture and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-audio-engine-r191.js
          node --check docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check .github/scripts/validate-audio.cjs
          grep -Fq "mute-unmute-r191" docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          grep -Fq "formatx-audio-engine-r191.js?v=20260817-r191" docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          grep -Fq "UNMUTE" docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          grep -Fq "MUTE" docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          grep -Fq "aria-pressed" docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          grep -Fq "fxAudioAutoplay = 'disabled'" docs/scifi-ui/scripts/formatx-audio-engine-r191.js
          grep -Fq "fxAudioGestureGate = 'required'" docs/scifi-ui/scripts/formatx-audio-engine-r191.js
          grep -Fq "new Context({ latencyHint: 'interactive' })" docs/scifi-ui/scripts/formatx-audio-engine-r191.js
          grep -Fq "min-height: 44px" docs/scifi-ui/styles/formatx-audio-toggle-r191.css
          grep -Fq "focus-visible" docs/scifi-ui/styles/formatx-audio-toggle-r191.css
          grep -Fq "formatx-audio-toggle-r191.js?v=20260817-r192-lazy-engine" docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          ! grep -Eq "\.style\.|style\.setProperty|setAttribute\(['\"]style" docs/scifi-ui/scripts/formatx-audio-engine-r191.js docs/scifi-ui/scripts/formatx-audio-toggle-r191.js
          ! grep -Eq "new Audio|\.play\(\)" docs/scifi-ui/scripts/formatx-audio-engine-r191.js docs/scifi-ui/scripts/formatx-audio-toggle-r191.js

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-audio" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-audio/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start static website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-audio-http.log" 2>&1 &
          for attempt in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-audio-http.log"
          exit 1

      - name: Verify desktop and mobile MUTE / UNMUTE control
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-audio/node_modules
        run: node .github/scripts/validate-audio.cjs

      - name: Publish visible audio status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state='success'; description='Visible MUTE/UNMUTE and gesture-gated CSP-safe Web Audio passed'
          else
            state='failure'; description='Visible Web Audio control validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX visible Web Audio r192' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
