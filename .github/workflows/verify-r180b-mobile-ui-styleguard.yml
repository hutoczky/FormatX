name: Verify r180c mobile UI source flow

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-flow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify r180c source-owned mobile UI at 390px
        run: |
          cat > verify-r180c.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');

          async function readState(page){
            return page.evaluate(()=>{
              const q=s=>document.querySelector(s),box=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2,cy:r.y+r.height/2,b:r.bottom}};
              const mag=q('.fx-reference-mag-button'),lang=q('.fx-language-toggle'),menu=q('.fx-reference-menu-button'),brand=q('.topbar .brand'),rail=q('#hero .fx-reference-rail'),ask=q('#hero .fx-reference-ask'),askLabel=q('#hero .fx-reference-ask span'),pause=q('#hero .fx-reference-pause'),proof=q('#hero .fx-reference-proof'),p=q('#hero .fx-reference-proof p'),live=q('#hero .fx-reference-liveos'),space=q('#hero .hero-space'),flow=q('script[data-fx-flow-first-r75]');
              if(![mag,lang,menu,brand,rail,ask,askLabel,pause,proof,p,live,space,flow].every(Boolean))throw new Error('r180c mobile nodes missing');
              const cs=e=>getComputedStyle(e),pseudo=getComputedStyle(space,'::after');
              return{
                flowSrc:flow.src,flowState:document.documentElement.dataset.fxFlowFirstR75||'',composition:document.documentElement.dataset.fxReferenceComposition||'',
                mag:box(mag),lang:box(lang),menu:box(menu),brand:box(brand),ask:box(ask),askLabel:box(askLabel),pause:box(pause),proof:box(proof),p:box(p),live:box(live),
                magTop:mag.style.getPropertyValue('top'),langTop:lang.style.getPropertyValue('top'),menuTop:menu.style.getPropertyValue('top'),brandTop:brand.style.getPropertyValue('top'),railTop:rail.style.getPropertyValue('top'),railGap:rail.style.getPropertyValue('gap'),
                liveTop:live.style.getPropertyValue('top'),liveBottom:live.style.getPropertyValue('bottom'),liveRight:live.style.getPropertyValue('right'),pPaddingRight:cs(p).paddingRight,
                magFont:cs(mag).fontSize,langFont:cs(lang).fontSize,askFont:cs(askLabel).fontSize,orbitOpacity:Number(cs(q('#hero .fx-r168-orbit')||space).opacity),seam:pseudo.backgroundImage,
                magText:mag.textContent.trim(),langText:lang.textContent.trim(),askText:askLabel.textContent.trim(),paused:document.documentElement.dataset.fxReferenceMotionPaused,renderMs:Number(document.documentElement.dataset.fxCoreRenderMs||Infinity)
              };
            });
          }

          function verify(s,label){
            assert.ok(s.flowSrc.includes('formatx-flow-first-r75.js?v=20260816-mobile-ui-r180c'),`${label}: stale flow ${s.flowSrc}`);
            assert.equal(s.composition,'award-reference-overlay-r139');
            assert.equal(s.magText,'MAG');assert.equal(s.langText,'HU');assert.equal(s.askText,'KÉRDEZZ');
            assert.equal(s.magTop,'14px');assert.equal(s.langTop,'14px');assert.equal(s.menuTop,'8px');assert.equal(s.brandTop,'17px');assert.equal(s.railTop,'18px');assert.equal(s.railGap,'24px');
            assert.equal(s.liveTop,'auto');assert.equal(s.liveBottom,'18px');assert.equal(s.liveRight,'16px');
            assert.ok(Math.abs(s.mag.cy-s.lang.cy)<=.6,`${label}: MAG/HU centers ${s.mag.cy}/${s.lang.cy}`);
            assert.ok(Math.abs(s.lang.cy-s.menu.cy)<=.6,`${label}: HU/menu centers ${s.lang.cy}/${s.menu.cy}`);
            assert.ok(Math.abs(s.brand.cy-s.mag.cy)<=.6,`${label}: brand/control centers ${s.brand.cy}/${s.mag.cy}`);
            assert.equal(s.mag.h,40);assert.equal(s.lang.h,40);assert.equal(s.menu.h,52);
            assert.equal(s.magFont,'10px');assert.equal(s.langFont,'10px');assert.equal(s.askFont,'10px');
            assert.ok(s.pause.y-s.ask.b>=23,`${label}: ASK/pause gap ${s.pause.y-s.ask.b}`);
            assert.ok(s.askLabel.b<=s.pause.y-8,`${label}: ASK label collision ${s.askLabel.b}/${s.pause.y}`);
            assert.equal(s.pPaddingRight,'0px');assert.ok(s.p.w>=s.proof.w-40,`${label}: proof copy width ${s.p.w}/${s.proof.w}`);
            assert.ok(s.live.y>=s.p.b+10,`${label}: Live OS overlaps copy ${s.live.y}/${s.p.b}`);
            assert.ok(s.seam.includes('linear-gradient'));assert.ok(s.orbitOpacity<=.11);
            assert.equal(s.paused,'false');assert.ok(s.renderMs<16.67,`${label}: render ${s.renderMs}`);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'});
            const page=await context.newPage();page.setDefaultTimeout(120000);
            await page.goto('https://formatxsuite.com/?verify_r180c='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.querySelector('script[data-fx-flow-first-r75]')?.src.includes('mobile-ui-r180c'),null,{timeout:90000});
            await page.waitForTimeout(4300);
            const before=await readState(page);verify(before,'steady');

            /* Force flow to execute again through its real resize listener. */
            await page.setViewportSize({width:391,height:846});await page.waitForTimeout(160);
            await page.setViewportSize({width:390,height:844});await page.waitForTimeout(220);
            const after=await readState(page);verify(after,'post-resize');

            console.log('R180C MOBILE',JSON.stringify({before,after},null,2));
            await page.screenshot({path:'r180c-mobile.png',fullPage:false,animations:'allow',timeout:120000});
            await browser.close();assert.ok(fs.statSync('r180c-mobile.png').size>10000);
            console.log('PASS: r180c source flow owns stable mobile header/actions/proof geometry after delayed startup and resize.');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-r180c.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r180c-mobile-${{ github.run_id }}
          path: r180c-mobile.png
          if-no-files-found: warn
          retention-days: 14
