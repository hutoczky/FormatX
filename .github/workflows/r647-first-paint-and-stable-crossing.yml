name: R647 first-paint network and stable desktop crossing

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r647-first-paint-and-stable-crossing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply R647 source fixes
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r647.py
          python3 -m py_compile /tmp/r647.py
          python3 /tmp/r647.py
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git diff --check
          test "$(grep -o 'data-fx-r637-href=' docs/scifi-ui/index.html | wc -l)" -ge 6
          grep -Fq 'organism-ui-close-refresh-r647' docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/index.html docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git commit -m "R647 defer noncritical CSS network and refresh stable loop boundary"
          git push origin HEAD:fix/r533-p0-intro-lcp
