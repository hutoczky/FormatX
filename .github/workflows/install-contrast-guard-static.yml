name: Install static contrast guard

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/install-contrast-guard-static.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Wire the contrast guard into the first HTML response
        shell: python
        run: |
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace(
              './styles/site-art-direction.css?v=20260726-art-direction-1',
              './styles/site-art-direction.css?v=20260726-art-direction-2',
          )
          marker = '  <link rel="stylesheet" href="./styles/site-art-direction.css?v=20260726-art-direction-2">\n'
          contrast = '  <link rel="stylesheet" href="./styles/site-contrast-guard.css?v=20260726-contrast-guard-1">\n'
          if contrast not in text:
              if marker not in text:
                  raise SystemExit('Static CSS marker not found')
              text = text.replace(marker, marker + contrast, 1)
          text = text.replace(
              './scripts/site-art-direction.js?v=20260726-art-direction-1',
              './scripts/site-art-direction.js?v=20260726-art-direction-2',
          )
          index.write_text(text, encoding='utf-8')

          worker = Path('billing-worker/src/production-with-license.js')
          text = worker.read_text(encoding='utf-8')
          text = text.replace(
              "const SITE_ART_VERSION = '20260726-art-direction-1';",
              "const SITE_ART_VERSION = '20260726-art-direction-2';",
          )
          worker.write_text(text, encoding='utf-8')

      - name: Validate the static and production chains
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/site-art-direction.js
          node --check billing-worker/src/production-with-license.js
          grep -F 'site-art-direction.css?v=20260726-art-direction-2' docs/scifi-ui/index.html
          grep -F 'site-contrast-guard.css?v=20260726-contrast-guard-1' docs/scifi-ui/index.html
          grep -F 'site-art-direction.js?v=20260726-art-direction-2' docs/scifi-ui/index.html
          grep -F "SITE_ART_VERSION = '20260726-art-direction-2'" billing-worker/src/production-with-license.js
          grep -F 'site-contrast-guard.css' billing-worker/src/production-with-license.js

      - name: Commit the static first-frame fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html billing-worker/src/production-with-license.js
          git commit -m 'Load the contrast guard before the first visible page frame'
          git push origin HEAD:master
