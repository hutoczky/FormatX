name: FormatX one-shot 100 hardening

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/formatx-100-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              write(path, text.replace(old, new))

          # Eliminate the two nested CSS requests that caused late mobile hero geometry.
          recovery_path = 'docs/scifi-ui/styles/formatx-mobile-recovery.css'
          recovery = read(recovery_path)
          imports = "@import url('./formatx-desktop-unified.css');\n@import url('./formatx-mobile-hero-flow.css');\n\n"
          if imports not in recovery:
              raise SystemExit('mobile recovery import prelude changed unexpectedly')
          desktop = read('docs/scifi-ui/styles/formatx-desktop-unified.css').rstrip()
          mobile_flow = read('docs/scifi-ui/styles/formatx-mobile-hero-flow.css').rstrip()
          recovery = recovery.replace(imports, '/* Inlined critical composition: no nested CSS request on first paint. */\n' + desktop + '\n\n' + mobile_flow + '\n\n', 1)
          recovery += '''\n\n/* FormatX mobile quality hardening r7 */
          @media (max-width: 900px), (pointer: coarse) {
            .site-footer nav { gap: 8px 10px !important; }
            .site-footer nav a {
              display: inline-flex !important;
              align-items: center !important;
              justify-content: center !important;
              min-height: 44px !important;
              padding: 10px 9px !important;
              box-sizing: border-box !important;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .fx-intro-overlay {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
            }
            [data-reveal] {
              opacity: 1 !important;
              visibility: visible !important;
              transform: none !important;
              filter: none !important;
              animation: none !important;
              transition: none !important;
            }
          }
          '''
          write(recovery_path, recovery)
          replace('docs/scifi-ui/index.html',
                  './styles/formatx-mobile-recovery.css?v=20260729-mobile-recovery-1',
                  './styles/formatx-mobile-recovery.css?v=20260812-mobile-stability-r7')

          # Preserve strict CSP: no inline style attributes from Thought Genome.
          genome = 'docs/scifi-ui/scripts/synaptic-thought-genome.js'
          replace(genome, "    path.style.setProperty('--fx-genome-path-length', String(Math.max(1, pathPoints.length * 150)));\n", '')
          replace(genome, "      group.style.setProperty('--fx-genome-hue', String(point.hue));\n", '')
          replace(genome,
                  "      orbit.classList.add('fx-thought-genome-orbit');\n",
                  "      orbit.classList.add('fx-thought-genome-orbit');\n      orbit.setAttribute('stroke', `hsl(${point.hue} 84% 67% / .34)`);\n")
          replace(genome,
                  "      star.classList.add('fx-thought-genome-star');\n",
                  "      star.classList.add('fx-thought-genome-star');\n      star.setAttribute('fill', `hsl(${point.hue} 88% 72%)`);\n")
          replace(genome,
                  './styles/synaptic-thought-genome.css?v=20260731-thought-genome-1',
                  './styles/synaptic-thought-genome.css?v=20260812-csp-safe-r2')
          genome_css = 'docs/scifi-ui/styles/synaptic-thought-genome.css'
          replace(genome_css, '  fill: hsl(var(--fx-genome-hue) 88% 72%);\n', '')
          replace(genome_css, '  stroke: hsl(var(--fx-genome-hue) 84% 67% / .34);\n', '')

          # Canonical live Lighthouse targets.
          for cfg in ('lighthouserc.live.json', 'lighthouserc.live.mobile.json'):
              write(cfg, read(cfg).replace('https://www.formatxsuite.com/', 'https://formatxsuite.com/'))

          # Cache-bust Worker-injected public content CSS.
          base = 'billing-worker/src/production-content-base.js'
          replace(base,
                  '/scifi-ui/styles/formatx-content-standard.css?v=20260731-content-2',
                  '/scifi-ui/styles/formatx-content-standard.css?v=20260812-quality-r1')
          PY

      - name: Validate product hardening
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/synaptic-thought-genome.js
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node .github/scripts/validate-award-readiness.cjs
          ! grep -q "@import url('./formatx-mobile-hero-flow.css')" docs/scifi-ui/styles/formatx-mobile-recovery.css
          ! grep -q "style.setProperty('--fx-genome" docs/scifi-ui/scripts/synaptic-thought-genome.js

      - name: Commit product hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-mobile-recovery.css docs/scifi-ui/index.html docs/scifi-ui/scripts/synaptic-thought-genome.js docs/scifi-ui/styles/synaptic-thought-genome.css lighthouserc.live.json lighthouserc.live.mobile.json billing-worker/src/production-content-base.js
          git commit -m 'fix: harden mobile first paint and CSP'
          git push origin HEAD:master
