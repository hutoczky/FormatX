name: Validate P0 production browser matrix

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-p0-production-browser
  cancel-in-progress: true

jobs:
  p0-browser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDITED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      FORMATX_TEST_URL: https://formatxsuite.com/
    steps:
      - name: Checkout audited production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AUDITED_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate P0 browser test syntax
        run: node --check .github/scripts/validate-p0-production-browser.cjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-p0-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-p0-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run strict production browser matrix
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-p0-browser/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-p0-production-browser.cjs 2>&1 | tee p0-production-browser.txt

      - name: Upload P0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-production-browser-${{ env.AUDITED_SHA }}
          path: p0-production-browser.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish P0 browser status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='P0 responsive, console, no-JS, reduced-motion and WebGL-fallback gate passed'; else state=failure; description='P0 production browser matrix failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" -f state="$state" -f context='FormatX P0 production browser gate' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
