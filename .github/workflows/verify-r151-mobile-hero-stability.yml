name: Verify r156 mobile proof-first stability
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-r151-mobile-hero-stability.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-mobile:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify production r156 proof-first flow
        run: |
          cat > verify-r156.cjs <<'EOF'
          const {chromium}=require('playwright');const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'}),page=await context.newPage();
            await page.goto('https://formatxsuite.com/?verify_r156='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxMobileHeroStabilityR151==='r156-mobile-proof-first-stability'&&document.documentElement.dataset.fxMobileDownloadPlacementR151==='heading-proof-download',{timeout:60000});
            await page.waitForTimeout(800);
            const result=await page.evaluate(()=>{
              const visible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.05&&r.width>2&&r.height>2};
              const rect=e=>{const r=e.getBoundingClientRect();return{top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height,order:Number(getComputedStyle(e).order)}};
              const root=document.documentElement,space=document.querySelector('#hero .hero-space'),heading=document.querySelector('#hero .fx-reference-heading'),proof=document.querySelector('#hero .fx-reference-proof'),dock=document.querySelector('#hero .fx-mobile-download-r151'),core=document.querySelector('#hero .fx-core-mobile-v55-canvas,#hero .fx-core-r112-canvas'),detail=document.querySelector('#hero .fx-core-detail-r122'),primary=dock?.querySelector('[data-release-download="multiplatform"]'),android=dock?.querySelector('a[href="/download/android"]');
              const forbidden=[...document.querySelectorAll('#hero .hero-space img,#hero .hero-space picture,#hero .hero-space iframe,#hero .hero-space object,#hero .hero-space embed')].filter(visible);
              const white=[...space.querySelectorAll('*')].filter(e=>{if(!visible(e))return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e).backgroundColor.match(/[\d.]+/g)?.map(Number)||[];return r.width*r.height>1600&&c.length>=3&&c[0]>225&&c[1]>225&&c[2]>225&&(c[3]??1)>.25});
              return{version:root.dataset.fxMobileHeroStabilityR151,placement:root.dataset.fxMobileDownloadPlacementR151,luma:root.dataset.fxCoreDesktopLumaKeyR157,heading:visible(heading)?rect(heading):null,proof:visible(proof)?rect(proof):null,dock:visible(dock)?rect(dock):null,core:visible(core)?rect(core):null,detail:visible(detail)?rect(detail):null,forbidden:forbidden.length,white:white.length,primary:primary instanceof HTMLAnchorElement?primary.href:'',android:android instanceof HTMLAnchorElement?android.href:'',paused:root.dataset.fxReferenceMotionPaused,motion:root.dataset.fxCoreMotionR144||'',heartbeat:root.dataset.fxLiveHeartbeatR155||''};
            });
            console.log('R156 MOBILE',JSON.stringify(result,null,2));
            assert.equal(result.version,'r156-mobile-proof-first-stability');assert.equal(result.placement,'heading-proof-download');assert.equal(result.luma,'mobile-bypass');
            assert.ok(result.core&&result.core.width>300&&result.detail&&result.detail.width>300);assert.equal(result.forbidden,0);assert.equal(result.white,0);
            assert.ok(result.heading&&result.proof&&result.dock);assert.equal(result.heading.order,2);assert.equal(result.proof.order,3);assert.equal(result.dock.order,4);
            assert.ok(result.heading.bottom<=result.proof.top+3,'Public Proof is not directly after heading');assert.ok(result.proof.bottom<=result.dock.top+3,'Download is not after Public Proof');
            assert.ok(result.primary);assert.ok(result.android.endsWith('/download/android'));assert.equal(result.paused,'false');assert.ok(result.motion.includes('breathing-pointer-touch-gyro'));assert.equal(result.heartbeat,'js-reactive-heartbeat-r155');
            await page.screenshot({path:'r156-mobile-proof-first.png',fullPage:false,animations:'allow'});await browser.close();console.log('PASS: r156 mobile flow is MAG -> heading -> Public Proof -> Download with interaction preserved.');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node verify-r156.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r156-mobile-proof-first-${{ github.run_id }}
          path: r156-mobile-proof-first.png
          if-no-files-found: warn
          retention-days: 14
