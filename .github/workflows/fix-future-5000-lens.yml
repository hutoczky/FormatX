name: Fix Year 5000 lens selector

on:
  push:
    branches: [master]
    paths:
      - "docs/scifi-ui/FIX_FX5K_LENS.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Limit lens handlers to real buttons
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/scifi-ui/scripts/future-5000.js")
          text = path.read_text(encoding="utf-8")
          old = "document.querySelectorAll('[data-fx5k-lens]')"
          new = "document.querySelectorAll('.fx5k-lens-switch [data-fx5k-lens]')"
          count = text.count(old)
          assert count == 2, count
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Remove one-shot files
        run: |
          rm -f docs/scifi-ui/FIX_FX5K_LENS.txt
          rm -f .github/workflows/fix-future-5000-lens.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Year 5000 lens button event scope"
          git push origin HEAD:master
