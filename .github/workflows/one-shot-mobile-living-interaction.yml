name: One-shot publish mobile living interaction

on:
  push:
    paths:
      - '.github/workflows/one-shot-mobile-living-interaction.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish fresh mobile living interaction loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/scifi-ui/index.html')
          s = p.read_text()
          old = 'formatx-core-real3d-v20.js?v=20260812-mobile-reference-r9-r15'
          new = 'formatx-core-real3d-v20.js?v=20260812-mobile-living-r16'
          if old not in s and new not in s:
              raise SystemExit('Expected production core loader reference not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/one-shot-mobile-living-interaction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git commit -m '[deploy-production] feat(core): publish animated interactive mobile MAG'
          git push
