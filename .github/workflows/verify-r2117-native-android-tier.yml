name: R2117 real Android original MAG geometry capability

on:
  push:
    branches:
      - feature/r2104-cinematic-machined-mag-intro
    paths:
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-motion-runtime-loader-r239.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-r2117-mag-android-tier.cjs'
      - '.github/workflows/verify-r2117-native-android-tier.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2117-native-android-tier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-android-native-mag:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real source and JS syntax
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check .github/scripts/validate-r2117-mag-android-tier.cjs
      - name: Install Chromium with actual WebGL GPU emulation
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native-mag" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/native-mag/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start exact repository site
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs >/tmp/r2117-server.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/r2117-server.log
          exit 1
      - name: Verify full S24-class native optics, constrained phones and one canvas
        env:
          NODE_PATH: ${{ runner.temp }}/native-mag/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-r2117-mag-android-tier.cjs
      - name: Preserve authentic mobile browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2117-android-native-mag-tiers
          path: artifacts/r2117-high-core-mag/
          if-no-files-found: warn
          retention-days: 21
