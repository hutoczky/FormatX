name: Audit FormatX Interaction Genome WebGL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate WebGL renderer and lazy loading
        run: |
          node --check docs/scifi-ui/scripts/interaction-genome-webgl.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          node --check docs/scifi-ui/scripts/interaction-genome.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq "getContext('webgl2'" docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq 'drawElementsInstanced' docs/scifi-ui/scripts/interaction-genome-webgl.js
          grep -Fq 'requestGenomeWebgl' docs/scifi-ui/scripts/igloo-parity.js
          ! grep -Fq 'git push origin HEAD:master' .github/workflows/apply-interaction-genome-webgl.yml

      - name: Report
        run: echo 'Interaction Genome WebGL audit passed; no repository files were modified.'
