name: Native Android import cleanup

on:
  push:
    branches: [feature/native-android-formatx]
    paths:
      - "android-mobile/AUTOFIX_IMPORT.txt"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/native-android-formatx
          fetch-depth: 0

      - name: Remove literal escape before import
        shell: bash
        run: |
          set -euo pipefail
          FILE="android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-mobile/app/src/main/java/hu/formatx/mobile/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\\nimport android.annotation.SuppressLint;', 'import android.annotation.SuppressLint;')
          path.write_text(text, encoding='utf-8')
          PY
          head -n 8 "$FILE"
          grep -F '@SuppressLint("UnspecifiedRegisterReceiverFlag")' "$FILE"
          ! grep -Fq '\\nimport android.annotation.SuppressLint;' "$FILE"
          rm -f android-mobile/AUTOFIX_IMPORT.txt .github/workflows/native-android-import-fix.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix native Android SuppressLint import"
          git push origin HEAD:feature/native-android-formatx
