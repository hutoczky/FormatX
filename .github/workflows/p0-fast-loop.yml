name: P0 fast source loop

on:
  push:
    branches: [master]
    paths:
      - 'docs/styles.css'
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/styles/**'
      - 'docs/scifi-ui/scripts/**'
      - 'billing-worker/src/production-content-entry*.js'
      - 'billing-worker/src/production-content-base.js'
      - 'billing-worker/src/production-feedback-entry.js'
      - '.github/scripts/**'
      - '.github/workflows/p0-fast-loop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/styles.css'
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/styles/**'
      - 'docs/scifi-ui/scripts/**'
      - 'billing-worker/src/production-content-entry*.js'
      - 'billing-worker/src/production-content-base.js'
      - 'billing-worker/src/production-feedback-entry.js'
      - '.github/scripts/**'
      - '.github/workflows/p0-fast-loop.yml'
  workflow_dispatch:

concurrency:
  group: formatx-p0-fast-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser validation runtime
        run: npm install --no-save --no-package-lock playwright@1.62.0 playwright-core@1.62.0
      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
      - name: Validate living-core source contract
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r651.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r657.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r660.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r661.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r662.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r663.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r664.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r665.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r666.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r667.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r668.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r670.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r671.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r672.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r673.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r674.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r675.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r680.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r681.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r700.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r701.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r720.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r721.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r800.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r820.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r900.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r950.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r952.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r960.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r961.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r963.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r970.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r980.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r982.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r990.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1000.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1020.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1040.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1060.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1090.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1110.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1130.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1140.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1200.js
          node --check docs/scifi-ui/scripts/formatx-mag-reference-film-r649.js
          node --check docs/scifi-ui/scripts/formatx-cinematic-journey-r536.js
          node --check .github/scripts/validate-r533-r536-handoff.cjs
          node --check .github/scripts/capture-mag-intro-r656.cjs
          node --check docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js
          node --check docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          node --check docs/scifi-ui/scripts/formatx-core-direct-interaction.js
          node --check docs/scifi-ui/scripts/formatx-core-gyro-r144.js
          node .github/scripts/validate-living-core-r425-source.cjs
          node .github/scripts/validate-real3d-core.cjs
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-mag-pause-owner-r485.cjs
          node .github/scripts/validate-wda-100-r198.cjs
      - name: Start exact source site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/p0-fast-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/p0-fast-http.log"
          exit 1
      - name: Capture current MAG intro reference keyframes early
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_INTRO_KEYFRAME_DIR: artifacts/r656-intro-keyframes
        run: node .github/scripts/capture-mag-intro-r656.cjs
      - name: Upload current intro keyframes early
        uses: actions/upload-artifact@v4
        with:
          name: mag-intro-keyframes-${{ github.sha }}
          path: artifacts/r656-intro-keyframes/
          if-no-files-found: error
          retention-days: 14
      - name: Run retained semantic source proof
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_FAST_EVIDENCE_DIR: artifacts/p0-fast-loop
        run: node .github/scripts/p0-fast-loop.cjs --semantic
      - name: Run retained CLS source proof
        env:
          FORMATX_FAST_EVIDENCE_DIR: artifacts/p0-fast-loop
        run: node .github/scripts/p0-fast-loop.cjs --cls
      - name: Run retained responsive overflow proof
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_FAST_EVIDENCE_DIR: artifacts/p0-fast-loop
        run: node .github/scripts/p0-fast-loop.cjs --overflow
      - name: Run R530 living-core browser matrix
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_SEMANTIC_EVIDENCE_DIR: artifacts/r522-semantic-mag
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-r522-semantic-mag.cjs
      - name: Run current hero visual contract
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_VISUAL_DIR: artifacts/content-visuals
        run: node .github/scripts/validate-content-visuals.cjs
      - name: Run R533 to R536 cinematic handoff browser proof
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
          FORMATX_INTRO_EVIDENCE_DIR: artifacts/r533-r536-handoff
        run: node .github/scripts/validate-r533-r536-handoff.cjs
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-fast-loop-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/p0-fast-loop/
            artifacts/r522-semantic-mag/
            artifacts/content-visuals/
            artifacts/r533-r536-handoff/
            artifacts/r656-intro-keyframes/
          if-no-files-found: warn
          retention-days: 30
