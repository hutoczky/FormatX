name: P0 R520 initial hero guard A/B
run-name: Prove initial hero guard cold-paint ownership
on:
  push:
    branches: [p0-r520-hero-guard-ab-76b79fe]
    paths: ['.github/workflows/p0-r520-hero-guard-ab.yml']
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_SHA: 76b79fe75eebc9b0ce3998a8111eb8dbf539efb9
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.BASE_SHA }}', fetch-depth: 1}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Start exact R516 source with system Chrome
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          npm ci --prefix billing-worker --prefer-offline
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true; fs.writeFileSync('billing-worker/wrangler.ab.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.ab.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r520-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r520-worker.log" || true; exit 1
      - name: Write controlled probe
        shell: bash
        run: |
          mkdir -p artifacts/r520-hero-guard
          cat > probe.cjs <<'NODE'
          'use strict';
          const fs=require('node:fs'),{chromium}=require('playwright');
          const label=process.argv[2],count=Number(process.argv[3]||3);
          async function one(i){
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors','--disable-background-networking']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'}),page=await context.newPage(),cdp=await context.newCDPSession(page);
            await cdp.send('Network.enable');
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:40,downloadThroughput:1310720,uploadThroughput:1310720,connectionType:'wifi'});
            await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
            await page.addInitScript(()=>{window.__p={lt:[],lcp:[],ls:[]};for(const [type,key] of [['longtask','lt'],['largest-contentful-paint','lcp'],['layout-shift','ls']])try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__p[key].push(type==='longtask'?{t:e.startTime,d:e.duration}:type==='layout-shift'?{t:e.startTime,v:e.hadRecentInput?0:e.value}:{t:e.startTime,size:e.size,tag:e.element?.tagName||'',cls:e.element?.className||''});}).observe({type,buffered:true});}catch{}});
            await page.goto(`https://formatxsuite.com:8787/?r520=${label}-${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(5000);
            const out=await page.evaluate(()=>{const p=window.__p,n=performance.getEntriesByType('navigation')[0],pa=performance.getEntriesByType('paint'),r=document.querySelector('#hero .hero-lead')?.getBoundingClientRect(),l=p.lcp.at(-1);return{fcp:pa.find(x=>x.name==='first-contentful-paint')?.startTime??null,lcp:l?.t??null,lcpElement:l??null,tbt:p.lt.reduce((s,e)=>s+Math.max(0,e.d-50),0),cls:p.ls.reduce((s,e)=>s+e.v,0),ttfb:n?.responseStart??null,dcl:n?.domContentLoadedEventStart??null,load:n?.loadEventEnd??null,longtasks:p.lt,guard:document.documentElement.dataset.fxInitialHeroGuard||'',scrollY,hero:r?{x:r.x,y:r.y,width:r.width,height:r.height}:null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};}); await browser.close(); return out;
          }
          (async()=>{const rows=[];for(let i=1;i<=count;i++)rows.push(await one(i));fs.writeFileSync(`artifacts/r520-hero-guard/${label}.json`,JSON.stringify(rows,null,2));console.log(label.toUpperCase(),JSON.stringify(rows));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Baseline x3
        run: node probe.cjs baseline 3
      - name: Apply diagnostic-only hero guard isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'); s=p.read_text()
          old="    ensureStyle();\n    guaranteeInitialHero();\n    repairReleasePanel();"
          new="    ensureStyle();\n    root.dataset.fxInitialHeroGuard = 'diagnostic-static-start';\n    repairReleasePanel();"
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
          sleep 2
      - name: Treatment x3
        run: node probe.cjs treatment 3
      - name: Compare without false PASS
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),b=require('./artifacts/r520-hero-guard/baseline.json'),t=require('./artifacts/r520-hero-guard/treatment.json');
          const med=a=>[...a].sort((x,y)=>x-y)[Math.floor(a.length/2)],s=x=>({medianFcp:med(x.map(r=>r.fcp)),maxFcp:Math.max(...x.map(r=>r.fcp)),medianLcp:med(x.map(r=>r.lcp)),maxLcp:Math.max(...x.map(r=>r.lcp)),medianTbt:med(x.map(r=>r.tbt)),maxTbt:Math.max(...x.map(r=>r.tbt)),maxCls:Math.max(...x.map(r=>r.cls)),medianTtfb:med(x.map(r=>r.ttfb)),maxOverflow:Math.max(...x.map(r=>r.overflow))});
          const bs=s(b),ts=s(t),out={baseSha:process.env.BASE_SHA,baseline:bs,treatment:ts,deltaMedianFcp:ts.medianFcp-bs.medianFcp,deltaMedianLcp:ts.medianLcp-bs.medianLcp,deltaMedianTbt:ts.medianTbt-bs.medianTbt}; console.log('AB_SUMMARY',JSON.stringify(out,null,2)); fs.writeFileSync('artifacts/r520-hero-guard/summary.json',JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r520-initial-hero-guard-ab, path: artifacts/r520-hero-guard/, retention-days: 30}
