name: Validate native real3D core
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-v69.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-reference-r98.js'
      - 'docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js'
      - 'docs/scifi-ui/styles/formatx-mobile-reference-layout-v1.css'
      - 'docs/scifi-ui/styles/formatx-responsive-text-guard-r72.css'
      - 'docs/scifi-ui/styles/formatx-core-mobile-v55.css'
      - 'docs/scifi-ui/scripts/formatx-reference-core-v26.js'
      - 'billing-worker/src/production-entry.js'
      - '.github/scripts/validate-real3d-core-v20.cjs'
      - '.github/scripts/validate-real3d-core-v21-release.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/scripts/validate-reference-core-v26.cjs'
      - '.github/workflows/validate-real3d-core-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  validate-real3d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate responsive cinematic v69 source
        run: node .github/scripts/validate-real3d-core-v21-release.cjs
      - name: Validate v69 desktop/mobile startup and layout contract
        run: node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Validate production and preview renderer authority
        run: node .github/scripts/validate-reference-core-v26.cjs
      - name: Validate core integration contract
        run: node .github/scripts/validate-real3d-core-v20.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-v69.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r98.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node --check docs/scifi-ui/scripts/formatx-reference-core-v26.js
          node --check billing-worker/src/production-entry.js
      - name: Publish real3D status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Responsive cinematic r98 source/layout/animation/touch gates passed'; else state=failure; description='FormatX production crystal validation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX production crystal' -f description="$description" -f target_url="$TARGET_URL"
