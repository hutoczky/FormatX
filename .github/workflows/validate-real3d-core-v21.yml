name: Validate native real3D core
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/scripts/formatx-core-v51.js'
      - 'docs/scifi-ui/styles/formatx-core-v51.css'
      - 'docs/scifi-ui/scripts/formatx-reference-core-v26.js'
      - 'docs/scifi-ui/scripts/formatx-webgpu-core-v29.js'
      - 'docs/scifi-ui/scripts/formatx-orbital-core-v28.js'
      - 'docs/scifi-ui/scripts/formatx-cinematic-core-v27.js'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-premium-finish.js'
      - '.github/scripts/validate-real3d-core-v20.cjs'
      - '.github/scripts/validate-real3d-core-v21-release.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/scripts/validate-reference-core-v26.cjs'
      - '.github/workflows/validate-real3d-core-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  validate-real3d:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate v51 reference crystal production MAG
        run: node .github/scripts/validate-real3d-core-v21-release.cjs
      - name: Validate v51 mobile-safe startup contract
        run: node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Validate production and preview renderer authority
        run: node .github/scripts/validate-reference-core-v26.cjs
      - name: Validate core integration contract
        run: node .github/scripts/validate-real3d-core-v20.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-v51.js
          node --check docs/scifi-ui/scripts/formatx-reference-core-v26.js
          node --check docs/scifi-ui/scripts/formatx-webgpu-core-v29.js
          node --check docs/scifi-ui/scripts/formatx-orbital-core-v28.js
          node --check docs/scifi-ui/scripts/formatx-cinematic-core-v27.js
          node --check billing-worker/src/production-entry.js
      - name: Publish real3D status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Reference crystal v51 passed single-context, mobile framing and syntax gates'
          else
            state=failure
            description='Reference crystal v51 validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX reference crystal v51' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
