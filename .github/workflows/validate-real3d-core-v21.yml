name: Validate native real3D core
on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-core-real3d-v20.js'
      - 'docs/scifi-ui/styles/formatx-core-real3d-v20.css'
      - 'docs/scifi-ui/scripts/formatx-reference-core-v26.js'
      - 'docs/scifi-ui/styles/formatx-reference-core-v26.css'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-premium-finish.js'
      - 'docs/scifi-ui/data/public-platform-contract.json'
      - '.github/scripts/validate-real3d-core-v21-release.cjs'
      - '.github/scripts/validate-real3d-mobile-startup-v22.cjs'
      - '.github/scripts/validate-reference-core-v26.cjs'
      - '.github/workflows/validate-real3d-core-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  validate-real3d:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy v24 renderer safety contract
        run: node .github/scripts/validate-real3d-core-v21-release.cjs
      - name: Validate mobile-safe startup fallback
        run: node .github/scripts/validate-real3d-mobile-startup-v22.cjs
      - name: Validate reference crystal v26 source contract
        run: node .github/scripts/validate-reference-core-v26.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-reference-core-v26.js
          node --check billing-worker/src/production-entry.js
      - name: Publish real3D status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Native WebGL2 reference crystal v26 and fallback safety contracts passed'
          else
            state=failure
            description='Native real3D reference core validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX real3D reference v26' \
            -f description="$description" \
            -f target_url="$TARGET_URL"