name: R2144 real post-intro MAG occlusion audit

on:
  push:
    branches:
      - feature/r2104-cinematic-machined-mag-intro
    paths:
      - '.github/scripts/diagnose-r2144-hero-mag-visibility.cjs'
      - '.github/workflows/diagnose-r2144-hero-mag-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visually-unoccluded-canonical-mag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of real post-intro occlusion probe
        run: node --check .github/scripts/diagnose-r2144-hero-mag-visibility.cjs
      - name: Install browser and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/native" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/native/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve source precisely
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs >/tmp/r2144-http.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/r2144-http.log
          exit 1
      - name: Capture real full viewport and actual canvas before/after scroll
        env:
          NODE_PATH: ${{ runner.temp }}/native/node_modules
        run: node .github/scripts/diagnose-r2144-hero-mag-visibility.cjs
      - name: Preserve screenshot and exact ancestor stacking traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2144-real-post-intro-mag-occlusion
          path: artifacts/r2144-hero-mag-visibility/
          retention-days: 21
          if-no-files-found: warn
