name: One-shot bump mobile core loader r9
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-bump-mobile-core-loader-r9.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump production core loader cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/scifi-ui/index.html')
          s = p.read_text()
          old = './scripts/formatx-core-real3d-v20.js?v=20260811-interactive-cinematic-glass-r14'
          new = './scripts/formatx-core-real3d-v20.js?v=20260812-mobile-reference-r9-r15'
          if old not in s:
              raise SystemExit('expected core loader cache key not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git commit -m '[deploy-production] fix(core): publish mobile reference r9 cache bust'
          git push origin HEAD:master
