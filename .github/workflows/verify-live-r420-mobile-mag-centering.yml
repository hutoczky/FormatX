name: Verify live r420 mobile MAG centering

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-r420-mobile-mag-centering.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live-mobile-mag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-r420" && cd "$RUNNER_TEMP/live-r420"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify production MAG centering on phone viewports
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live-r420"
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const base = 'https://formatxsuite.com/scifi-ui/?lang=hu&immersive=1&verify=r420-live';

          async function snapshot(page) {
            return page.evaluate(() => {
              const host = document.querySelector('#hero .hero-space');
              const stage = document.querySelector('#hero .fx-crystal-organism-r326-stage');
              const canvas = document.querySelector('#hero .fx-crystal-organism-r326-canvas');
              if (!host || !stage || !canvas) return null;
              const hr = host.getBoundingClientRect();
              const sr = stage.getBoundingClientRect();
              const cr = canvas.getBoundingClientRect();
              const cs = getComputedStyle(canvas);
              const center = r => (r.left + r.right) / 2;
              const visibleWidth = Math.max(0, Math.min(cr.right, innerWidth) - Math.max(cr.left, 0));
              return {
                viewport: innerWidth,
                host: { left: hr.left, right: hr.right, width: hr.width, center: center(hr) },
                stage: { left: sr.left, right: sr.right, width: sr.width, center: center(sr), renderer: stage.dataset.renderer || '' },
                canvas: { left: cr.left, right: cr.right, width: cr.width, center: center(cr), filter: cs.filter, scale: cs.scale },
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                visibleRatio: visibleWidth / Math.max(1, cr.width),
                r326: document.documentElement.dataset.fxCrystalOrganismR326 || '',
                ownership: document.documentElement.dataset.fxCrystalRendererOwnershipR420 || '',
                r267Loaded: Boolean(document.querySelector('script[data-fx-core-true-volume-r267], .fx-core-r267-volume-stage'))
              };
            });
          }

          function verify(state, name) {
            assert(state, name + ': live r326 MAG DOM is missing');
            assert(state.r326 === 'ready', name + ': r326 not ready ' + JSON.stringify(state));
            assert(state.stage.renderer === 'crystal-organism-r326', name + ': wrong physical renderer ' + JSON.stringify(state));
            assert(state.ownership === 'r326-exclusive-primary', name + ': exclusive r326 ownership missing ' + JSON.stringify(state));
            assert(state.r267Loaded === false, name + ': r267 must not replace r326 ' + JSON.stringify(state));
            assert(state.overflow <= 2, name + ': horizontal overflow ' + JSON.stringify(state));
            assert(Math.abs(state.stage.center - state.host.center) <= 2, name + ': stage off center ' + JSON.stringify(state));
            assert(Math.abs(state.canvas.center - state.host.center) <= 2, name + ': canvas off center ' + JSON.stringify(state));
            assert(state.stage.left >= -1 && state.stage.right <= state.viewport + 1, name + ': stage leaves viewport ' + JSON.stringify(state));
            assert(state.visibleRatio >= .98, name + ': canvas clipped horizontally ' + JSON.stringify(state));
            assert(state.canvas.filter.includes('blur('), name + ': softened perimeter filter missing ' + JSON.stringify(state));
          }

          async function run(browser, name, viewport) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'hu-HU', colorScheme: 'dark' });
            const page = await context.newPage();
            await page.goto(base + '&vw=' + viewport.width + '&ts=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => document.documentElement.dataset.fxCrystalOrganismR326 === 'ready' && document.querySelector('.fx-crystal-organism-r326-canvas'), null, { timeout: 60000 });
            await page.waitForTimeout(1500);
            verify(await snapshot(page), name + '-initial');

            const host = await page.locator('#hero .hero-space').boundingBox();
            assert(host, name + ': live hero-space missing');
            const y = Math.min(viewport.height - 80, Math.max(120, host.y + host.height * .46));
            await page.touchscreen.tap(Math.max(12, viewport.width * .08), y);
            await page.waitForTimeout(250);
            verify(await snapshot(page), name + '-left-touch');
            await page.touchscreen.tap(Math.min(viewport.width - 12, viewport.width * .92), y);
            await page.waitForTimeout(250);
            const finalState = await snapshot(page);
            verify(finalState, name + '-right-touch');
            console.log('LIVE PASS', name, JSON.stringify(finalState));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--enable-unsafe-swiftshader'] });
            await run(browser, 'live-390x844', { width: 390, height: 844 });
            await run(browser, 'live-430x932', { width: 430, height: 932 });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Publish live r420 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live 390/430 mobile MAG centering and r326 ownership passed'
          else
            state=failure
            description='Live r420 mobile MAG verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX live r420 mobile MAG' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
