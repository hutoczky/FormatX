name: R2127 real Three cinema on high-end Android

on:
  push:
    branches:
      - feature/r2104-cinematic-machined-mag-intro
    paths:
      - '.github/scripts/validate-r2127-actual-android-three-first.cjs'
      - '.github/workflows/verify-r2127-actual-android-three.yml'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/scripts/formatx-mag-genesis-three-r1280.js'
      - 'docs/scifi-ui/scripts/formatx-mag-reference-film-r649.js'
      - 'docs/scifi-ui/index.html'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2127-three-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source structure
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1280.js
          node --check .github/scripts/validate-r2127-actual-android-three-first.cjs
      - name: Install actual Chromium and SwiftShader
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/r2127" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/r2127/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run exact repository website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs >/tmp/r2127-site.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/r2127-site.log
          exit 1
      - name: Assert real renderer choice instead of loader-intent telemetry
        env:
          NODE_PATH: ${{ runner.temp }}/r2127/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-r2127-actual-android-three-first.cjs
      - name: Preserve both real browser framebuffer screenshots and init diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2127-android-real-three-vs-low-power-fallback
          path: artifacts/r2127-android-three-first/
          retention-days: 21
          if-no-files-found: warn
