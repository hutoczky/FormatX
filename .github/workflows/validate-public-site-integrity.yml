name: Validate public site integrity

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'billing-worker/src/**'
      - '.github/scripts/validate-public-site-integrity.cjs'
      - '.github/scripts/validate-release-truth-runtime.cjs'
      - '.github/scripts/validate-experimental-lab-indexing.cjs'
      - '.github/scripts/validate-public-pages-browser.cjs'
      - '.github/scripts/validate-legal-language-browser.cjs'
      - '.github/scripts/validate-real3d-core.cjs'
      - '.github/scripts/validate-award-narrative-r175.cjs'
      - '.github/workflows/validate-public-site-integrity.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'billing-worker/src/**'
      - '.github/scripts/validate-public-site-integrity.cjs'
      - '.github/scripts/validate-release-truth-runtime.cjs'
      - '.github/scripts/validate-experimental-lab-indexing.cjs'
      - '.github/scripts/validate-public-pages-browser.cjs'
      - '.github/scripts/validate-legal-language-browser.cjs'
      - '.github/scripts/validate-real3d-core.cjs'
      - '.github/scripts/validate-award-narrative-r175.cjs'
      - '.github/workflows/validate-public-site-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full public surface
        run: node .github/scripts/validate-public-site-integrity.cjs
      - name: Validate canonical release runtime truth
        run: node .github/scripts/validate-release-truth-runtime.cjs
      - name: Validate experimental lab indexing boundaries
        run: node .github/scripts/validate-experimental-lab-indexing.cjs
      - name: Validate native WebGL3D core
        run: node .github/scripts/validate-real3d-core.cjs
      - name: Validate award narrative and animation scheduler
        run: node .github/scripts/validate-award-narrative-r175.cjs
      - name: Validate feedback and moderation
        run: node .github/scripts/validate-feedback-moderation.cjs
      - name: Validate requested site features
        run: node .github/scripts/validate-user-requested-site-features.cjs
      - name: Validate browser test syntax
        run: |
          node --check .github/scripts/validate-public-pages-browser.cjs
          node --check .github/scripts/validate-legal-language-browser.cjs
          node --check docs/scifi-ui/scripts/legal-page-i18n.js
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/formatx-public-browser" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-public-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start static public site
        run: |
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-public-http.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/verification.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-public-http.log"
          exit 1
      - name: Validate public pages in desktop and mobile Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-public-browser/node_modules
          FORMATX_PUBLIC_ORIGIN: http://127.0.0.1:4178
        run: node .github/scripts/validate-public-pages-browser.cjs
      - name: Validate real HU EN legal and support content
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-public-browser/node_modules
          FORMATX_PUBLIC_ORIGIN: http://127.0.0.1:4178
        run: node .github/scripts/validate-legal-language-browser.cjs
      - name: Publish public-site integrity status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Release truth, award narrative, WebGL3D and desktop/mobile Chromium passed'
          else
            state='failure'
            description='FormatX public-site integrity validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX public site integrity' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
