name: R640 P0 owner fixes

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r640-p0-owner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Patch P0 owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/scifi-ui/scripts/formatx-mag-context-policy-r561.js')
          s=p.read_text(encoding='utf-8')
          pairs=[('const WORKER_INIT_AT_MS=mobile?2200:620;','const WORKER_INIT_AT_MS=mobile?2200:2050;'),('const DESKTOP_INIT_FALLBACK_MS=1750;','const DESKTOP_INIT_FALLBACK_MS=2600;'),('paint-checkpoint-floor-620-no-intro-gate','navigation-checkpoint-2050-no-intro-gate'),('observed-first-paint-or-1750-fallback','observed-first-paint-or-2600-fallback'),('await-first-paint-opportunity-floor-620','await-first-paint-opportunity-floor-2050'),('await-observed-first-paint-or-1750','await-observed-first-paint-or-2600'),('init-armed-floor-620','init-armed-floor-2050'),('transport-armed-floor-620','transport-armed-floor-2050'),('paint-observer-unavailable-fallback-1750','paint-observer-unavailable-fallback-2600'),('desktop-paint-api-unavailable-fallback-1750','desktop-paint-api-unavailable-fallback-2600'),('paint-api-unavailable-fallback-1750','paint-api-unavailable-fallback-2600')]
          for a,b in pairs:s=s.replace(a,b)
          s=s.replace('FormatX R598 — paint-safe OffscreenCanvas MAG transport owner.','FormatX R640 — deadline-safe OffscreenCanvas MAG transport owner.',1)
          if 'const WORKER_INIT_AT_MS=mobile?2200:2050;' not in s or 'const DESKTOP_INIT_FALLBACK_MS=2600;' not in s:raise SystemExit('context patch failed')
          p.write_text(s,encoding='utf-8')
          p=Path('billing-worker/src/production-content-entry.js')
          s=p.read_text(encoding='utf-8')
          paths=['/scifi-ui/styles/formatx-critical-core-r227.css','/scifi-ui/styles/formatx-continuous-scroll.css','/scifi-ui/styles/formatx-seamless-loop.css','/scifi-ui/styles/platform-status.css','/scifi-ui/styles/formatx-copy-polish.css','/scifi-ui/styles/formatx-feedback.css','/scifi-ui/styles/single-language-toggle.css','/scifi-ui/styles/formatx-content-standard.css']
          block='const DEFERRED_STYLE_PATHS = new Set([\n'+''.join("  '"+x+"',\n" for x in paths)+']);'
          s,n=re.subn(r'const DEFERRED_STYLE_PATHS = new Set\(\[.*?\n\]\);',block,s,count=1,flags=re.S)
          if n!=1:raise SystemExit('deferred set patch failed')
          s=s.replace("const STARTUP_REVISION = '20260907-r639-secondary-css-network-after-first-paint';","const STARTUP_REVISION = '20260907-r640-critical-css-network-after-first-paint';",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check docs/scifi-ui/scripts/formatx-mag-context-policy-r561.js
          node --check billing-worker/src/production-content-entry.js
          git diff --check
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          git add docs/scifi-ui/scripts/formatx-mag-context-policy-r561.js billing-worker/src/production-content-entry.js
          git commit -m "R640 decontend intro deadline and narrow CSS staging"
          git push origin HEAD:fix/r533-p0-intro-lcp
