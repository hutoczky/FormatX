name: R640 P0 owner fixes

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r640-p0-owner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply source fixes
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r640.py
          python3 /tmp/r640.py
          node --check docs/scifi-ui/scripts/formatx-mag-context-policy-r561.js
          node --check billing-worker/src/production-content-entry.js
          git diff --check
      - name: Commit source fixes
        run: |
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          git add docs/scifi-ui/scripts/formatx-mag-context-policy-r561.js billing-worker/src/production-content-entry.js
          git commit -m "R640 decontend intro deadline and narrow CSS staging"
          git push origin HEAD:fix/r533-p0-intro-lcp
