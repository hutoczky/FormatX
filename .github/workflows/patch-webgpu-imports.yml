name: Patch WebGPU module imports

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGPU branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/webgpu-tsl-evolution
          fetch-depth: 0

      - name: Use the stage import map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/scifi-ui/scripts/ExperienceWebGPU.js')
          source = path.read_text(encoding='utf-8')
          pairs = [
              ("import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js';", "import * as THREE from 'three/webgpu';"),
              ("} from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js';", "} from 'three/tsl';"),
          ]
          original = source
          for old, new in pairs:
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'Missing WebGPU import marker: {old}')
          if source != original:
              path.write_text(source, encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'FormatX WebGPU Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/ExperienceWebGPU.js
          git commit -m 'Resolve WebGPU and TSL through the stage import map'
          git push origin HEAD:agent/webgpu-tsl-evolution
