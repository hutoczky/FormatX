name: Diagnose r176 live layout
on:
  push:
    branches: [master]
    paths: ['.github/workflows/diagnose-r176-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose production r176 layout
        run: |
          cat > diagnose.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:1440,height:900},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference'}),page=await context.newPage();
            await page.addInitScript(()=>{
              window.__fxShiftEntries=[];
              const label=n=>{if(!n||n.nodeType!==1)return String(n?.nodeName||'');const id=n.id?`#${n.id}`:'';const cls=String(n.className||'').trim().split(/\s+/).filter(Boolean).slice(0,4).map(x=>'.'+x).join('');return `${n.tagName.toLowerCase()}${id}${cls}`};
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__fxShiftEntries.push({value:e.value,time:e.startTime,sources:(e.sources||[]).map(s=>({node:label(s.node),previous:s.previousRect,current:s.currentRect}))});}).observe({type:'layout-shift',buffered:true});}catch(_){}
            });
            await page.goto('https://formatxsuite.com/?diag_r176='+Date.now(),{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>document.documentElement.dataset.fxAwardNarrativeR175==='ready',{timeout:60000});
            await page.waitForTimeout(1600);
            async function snap(label){
              const x=await page.evaluate(()=>{
                const root=document.documentElement;
                const pick=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{tag:e.tagName,id:e.id,cls:String(e.className||'').slice(0,180),rect:{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom},display:s.display,visibility:s.visibility,opacity:s.opacity,position:s.position,overflowX:s.overflowX,transform:s.transform,story:e.dataset.fxStoryState||''}};
                const overflowing=[...document.querySelectorAll('body *')].map(pick).filter(x=>x&&x.rect.w>1&&(x.rect.x<-.5||x.rect.right>innerWidth+.5)).sort((a,b)=>(b.rect.right-innerWidth)-(a.rect.right-innerWidth)).slice(0,30);
                const caps=document.querySelector('#capabilities'),exp=document.querySelector('#experience');
                const cards=[...document.querySelectorAll('#capabilities .card')].slice(0,8).map(pick);
                return{innerWidth,scrollWidth:root.scrollWidth,scrollX,scrollY,active:root.dataset.fxActiveOrganR175||'',chapter:root.dataset.fxActiveChapterR175||'',experience:pick(exp),capabilities:pick(caps),capHeading:pick(caps?.querySelector('.section-heading')),capsGrid:pick(caps?.querySelector('.cards')),cards,overflowing,shifts:window.__fxShiftEntries,cls:window.__fxShiftEntries.reduce((a,e)=>a+e.value,0)};
              });
              console.log(`\n=== ${label} ===\n`,JSON.stringify(x,null,2));return x;
            }
            await snap('settled-top');
            await page.locator('#experience').evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await page.waitForTimeout(650);await snap('experience-center');
            await page.locator('#capabilities').evaluate(e=>e.scrollIntoView({block:'center',behavior:'instant'}));await page.waitForTimeout(900);await snap('capabilities-center');
            await page.screenshot({path:'r176-diagnostic.png',fullPage:false,animations:'disabled',timeout:120000});
            await context.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r176-layout-diagnostic-${{ github.run_id }}
          path: r176-diagnostic.png
          if-no-files-found: warn
          retention-days: 7
