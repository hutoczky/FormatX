name: One-shot r208 cache and first-paint owner

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-shot-r208-cache-owner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply r208 cache and ownership patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected token in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          prod = Path('billing-worker/src/production-content-entry.js')
          text = prod.read_text(encoding='utf-8')
          replacements = {
              'formatx-mobile-reference-layout-v1.js?v=20260818-r207-canonical-flow': 'formatx-mobile-reference-layout-v1.js?v=20260818-r208-first-paint-owner',
              'formatx-mobile-layout-r207.css?v=20260818-r207-normal-flow': 'formatx-mobile-layout-r207.css?v=20260818-r208-flicker-free',
              'formatx-mobile-layout-r207.js?v=20260818-r207-normal-flow': 'formatx-mobile-layout-r207.js?v=20260818-r208-flicker-free',
              "const STARTUP_REVISION = '20260818-r207-layout-owner';": "const STARTUP_REVISION = '20260818-r208-flicker-free-owner';",
              'fx_startup_r207=1': 'fx_startup_r208=1',
              "X-FormatX-Client-Revision', 'r207-layout-owner": "X-FormatX-Client-Revision', 'r208-flicker-free-owner",
              "X-FormatX-Recovery', 'r207-grid-owned-controls": "X-FormatX-Recovery', 'r208-static-cascade",
              'r207-one-shot-cleared': 'r208-one-shot-cleared',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing production token: {old}')
              text = text.replace(old, new)
          prod.write_text(text, encoding='utf-8')

          core = Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js')
          text = core.read_text(encoding='utf-8')
          old = "const FLOW_SCRIPT = '/scifi-ui/scripts/formatx-flow-first-r75.js?v=20260816-mobile-ui-r180c';"
          new = "const FLOW_SCRIPT = '/scifi-ui/scripts/formatx-flow-first-r75.js?v=20260818-r208-delegated-flow';"
          if old not in text:
              raise SystemExit('missing legacy flow URL')
          core.write_text(text.replace(old, new), encoding='utf-8')

          layout = Path('docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js')
          text = layout.read_text(encoding='utf-8')
          old = """function ensureControlZone(hero,rail){
           if(!mobileViewport())return;
           let zone=hero.querySelector('.fx-reference-controls-r204');if(!zone){zone=document.createElement('div');zone.className='fx-reference-controls-r204';zone.setAttribute('aria-label',root.lang==='en'?'Hero controls':'Hero vezérlők');hero.appendChild(zone)}
           const sound=document.querySelector('.fx-three-sound');if(sound instanceof HTMLElement&&sound.parentElement!==zone)zone.appendChild(sound);
           if(rail instanceof HTMLElement&&rail.parentElement!==zone)zone.appendChild(rail);
           root.dataset.fxMobileProofControls='r204-ready';
          }"""
          new = """function ensureControlZone(hero,rail){
           if(!mobileViewport())return;
           const grid=hero.querySelector(':scope > .hero-grid');
           const canonical=document.querySelector('link[data-fx-mobile-layout-r207]') instanceof HTMLLinkElement;
           const owner=canonical&&grid instanceof HTMLElement?grid:hero;
           let zone=hero.querySelector('.fx-reference-controls-r204');if(!zone){zone=document.createElement('div');zone.className='fx-reference-controls-r204';zone.setAttribute('aria-label',root.lang==='en'?'Hero controls':'Hero vezérlők');owner.appendChild(zone)}else if(zone.parentElement!==owner)owner.appendChild(zone);
           const sound=document.querySelector('.fx-three-sound');if(sound instanceof HTMLElement&&sound.parentElement!==zone)zone.appendChild(sound);
           if(rail instanceof HTMLElement&&rail.parentElement!==zone)zone.appendChild(rail);
           root.dataset.fxMobileProofControls=canonical?'r208-grid-owned':'r204-ready';
          }"""
          if old not in text:
              raise SystemExit('missing ensureControlZone block')
          layout.write_text(text.replace(old, new), encoding='utf-8')

          validator = Path('.github/scripts/validate-wda-100-r198.cjs')
          text = validator.read_text(encoding='utf-8')
          replacements = {
              'formatx-mobile-reference-layout-v1\\.js\\?v=20260818-r207-canonical-flow': 'formatx-mobile-reference-layout-v1\\.js\\?v=20260818-r208-first-paint-owner',
              'formatx-mobile-layout-r207\\.css\\?v=20260818-r207-normal-flow': 'formatx-mobile-layout-r207\\.css\\?v=20260818-r208-flicker-free',
              'formatx-mobile-layout-r207\\.js\\?v=20260818-r207-normal-flow': 'formatx-mobile-layout-r207\\.js\\?v=20260818-r208-flicker-free',
              "X-FormatX-Client-Revision', 'r207-layout-owner": "X-FormatX-Client-Revision', 'r208-flicker-free-owner",
              'fx_startup_r207=1': 'fx_startup_r208=1',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing WDA validator token: {old}')
              text = text.replace(old, new)
          validator.write_text(text, encoding='utf-8')
          PY

      - name: Validate r208 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-mobile-layout-r207.js
          node --check docs/scifi-ui/scripts/formatx-flow-first-r75.js
          node --check docs/scifi-ui/scripts/formatx-mobile-ui-finalizer-r180.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node .github/scripts/validate-wda-100-r198.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs

      - name: Commit final r208 production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git rm .github/workflows/one-shot-r208-cache-owner.yml
          git add billing-worker/src/production-content-entry.js \
                  docs/scifi-ui/scripts/formatx-core-real3d-v20.js \
                  docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js \
                  .github/scripts/validate-wda-100-r198.cjs
          git commit -m '[deploy-production] fix(mobile): activate final r208 flicker-free startup'
          git push origin HEAD:master
