name: Apply FormatX 110 finish

on:
  push:
    branches:
      - agent/finish-formatx-110
    paths:
      - '.github/scripts/apply-formatx-110-finish.py'
      - '.github/workflows/apply-formatx-110-finish.yml'

permissions:
  contents: write

concurrency:
  group: formatx-110-finish
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out finish branch
        uses: actions/checkout@v4
        with:
          ref: agent/finish-formatx-110
          fetch-depth: 0

      - name: Apply reliability and language-control fixes
        run: python3 .github/scripts/apply-formatx-110-finish.py

      - name: Validate JavaScript and permanent regression gate
        run: |
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/single-language-toggle.js
          node .github/scripts/validate-formatx-110.cjs
          node .github/scripts/production-preflight.cjs
          node .github/scripts/validate-user-requested-site-features.cjs

      - name: Remove one-shot automation
        run: |
          rm .github/scripts/apply-formatx-110-finish.py
          rm .github/workflows/apply-formatx-110-finish.yml

      - name: Commit validated finish
        run: |
          git config user.name "FormatX Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prevent module-load stalls and harden language control"
          git push origin HEAD:agent/finish-formatx-110
