name: P0 R519 CSS batch vs sequential

on:
  push:
    branches: [p0-r517-owner-76b79fe]
    paths: ['.github/workflows/p0-r519-css-batch-vs-sequential.yml']

permissions:
  contents: read

env:
  CANDIDATE_REF: p0-r518-apex-buildtmp
  CANDIDATE_SHA: 0c983b25cbabecbdd73c8df760638c0c7554663b

jobs:
  batch-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Prepare exact R518 diagnostic loader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/scifi-ui/scripts/formatx-deferred-css-r487.js')
          s=p.read_text()
          s=s.replace("  let fallback = 0;", "  let fallback = 0;\n  const diagMode = new URLSearchParams(location.search).get('diag_css_mode') === 'sequential' ? 'sequential' : 'batch';\n  root.dataset.fxDiagCssMode = diagMode;", 1)
          old="""    const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));
    for (const link of links) {
      if (!(link instanceof HTMLLinkElement)) continue;
      const targetMedia = link.dataset.fxR487Media || 'all';
      if (link.media !== targetMedia) link.media = targetMedia;
      link.removeAttribute('fetchpriority');
    }

    root.dataset.fxDeferredCssR487 = 'ready';
    root.dataset.fxDeferredCssCountR487 = String(links.length);
    dispatchEvent(new CustomEvent('formatx:deferredcssready', {
      detail: { count: links.length, scheduler: 'post-first-paint-r487' }
    }));"""
          new="""    const links = Array.from(document.querySelectorAll('link[data-fx-r487-deferred-style]'));
    const applyLink = link => {
      if (!(link instanceof HTMLLinkElement)) return;
      const targetMedia = link.dataset.fxR487Media || 'all';
      if (link.media !== targetMedia) link.media = targetMedia;
      link.removeAttribute('fetchpriority');
    };
    const finish = () => {
      root.dataset.fxDeferredCssR487 = 'ready';
      root.dataset.fxDeferredCssCountR487 = String(links.length);
      root.dataset.fxDiagCssApplied = String(links.filter(link => link instanceof HTMLLinkElement && link.media !== 'print').length);
      dispatchEvent(new CustomEvent('formatx:deferredcssready', {
        detail: { count: links.length, scheduler: diagMode === 'sequential' ? 'diag-one-style-per-frame' : 'post-first-paint-r487' }
      }));
    };
    if (diagMode === 'sequential') {
      let index = 0;
      const step = () => {
        if (index >= links.length) { finish(); return; }
        applyLink(links[index++]);
        requestAnimationFrame(step);
      };
      step();
      return;
    }
    for (const link of links) applyLink(link);
    finish();"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          node --check docs/scifi-ui/scripts/formatx-deferred-css-r487.js
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.cssab.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          (cd billing-worker && nohup npx wrangler dev --config wrangler.cssab.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/cssab.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/cssab.log" || true
          exit 1
      - name: Measure batch first then sequential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cssab
          ORDER='batch,sequential' OUT='artifacts/cssab/batch-first.json' node <<'NODE'
          'use strict';
          const fs=require('node:fs'); const {chromium}=require('playwright');
          const order=process.env.ORDER.split(',');
          async function one(mode,round){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'}); const p=await c.newPage();
            await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.paint.push({n:e.name,t:e.startTime}))).observe({type:'paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.lcp.push(e.startTime))).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)window.__m.shift.push(e.value)})).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.long.push(e.duration))).observe({type:'longtask',buffered:true})}catch{}});
            const cdp=await c.newCDPSession(p); await cdp.send('Performance.enable');
            const r=await p.goto(`https://formatxsuite.com:8787/?diag_css_mode=${mode}&cssab=${mode}-${round}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(3500);
            const x=await p.evaluate(()=>({search:location.search,diagMode:document.documentElement.dataset.fxDiagCssMode||'',ready:document.documentElement.dataset.fxDeferredCssR487||'',declaredCount:Number(document.documentElement.dataset.fxDeferredCssCountR487||0),appliedCount:Number(document.documentElement.dataset.fxDiagCssApplied||0),fcp:window.__m.paint.find(e=>e.n==='first-contentful-paint')?.t??0,lcp:window.__m.lcp.at(-1)??0,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),longtasks:window.__m.long,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            const pm=(await cdp.send('Performance.getMetrics')).metrics.reduce((o,m)=>(o[m.name]=m.value,o),{});
            await c.close(); await b.close(); return {mode,round,status:r?.status()||0,...x,layoutMs:(pm.LayoutDuration||0)*1000,recalcMs:(pm.RecalcStyleDuration||0)*1000,taskMs:(pm.TaskDuration||0)*1000,scriptMs:(pm.ScriptDuration||0)*1000};
          }
          (async()=>{const rows=[];for(let round=1;round<=4;round++){for(const mode of order)rows.push(await one(mode,round));}console.log('CSS_AB_BATCH_FIRST',JSON.stringify(rows,null,2));fs.writeFileSync(process.env.OUT,JSON.stringify(rows,null,2));for(const r of rows){if(r.status!==200||r.diagMode!==r.mode||r.ready!=='ready'||r.declaredCount<8||r.appliedCount!==r.declaredCount||r.overflow>2)throw new Error('diagnostic contract failed '+JSON.stringify(r));}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r519-cssab-batch-first
          path: artifacts/cssab/
          retention-days: 30

