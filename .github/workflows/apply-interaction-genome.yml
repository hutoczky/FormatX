name: Audit FormatX Interaction Genome

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate lazy Interaction Genome architecture
        run: |
          node --check docs/scifi-ui/scripts/interaction-genome.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl.js
          node --check docs/scifi-ui/scripts/interaction-genome-webgl-adapter.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq '.fx-genome-launcher' docs/scifi-ui/scripts/igloo-parity.js
          grep -Fq 'requestGenomeWebgl' docs/scifi-ui/scripts/igloo-parity.js
          ! grep -Fq 'interaction-genome-webgl-adapter.js' <(sed -n '/const queue =/,/];/p' docs/scifi-ui/scripts/igloo-parity.js)
          ! grep -Fq 'git push origin HEAD:master' .github/workflows/apply-interaction-genome.yml

      - name: Report
        run: echo 'Interaction Genome audit passed; no repository files were modified.'
