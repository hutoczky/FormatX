name: Apply FormatX Interaction Genome

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/interaction-genome.js'
      - 'docs/scifi-ui/styles/interaction-genome.css'
      - '.github/workflows/apply-interaction-genome.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ github.token }}

      - name: Bind Interaction Genome to main runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/scifi-ui/scripts/igloo-parity.js')
          source = path.read_text(encoding='utf-8')
          genome = "    './scripts/interaction-genome.js?v=20260728-genome-1'"
          if genome not in source:
              old = "    './scripts/formatx-infinite-loop-controller-v2.js?v=20260728-loop-v2'\n  ];"
              new = "    './scripts/formatx-infinite-loop-controller-v2.js?v=20260728-loop-v2',\n" + genome + "\n  ];"
              if old not in source:
                  raise SystemExit('Runtime queue anchor missing')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check docs/scifi-ui/scripts/interaction-genome.js
          grep -Fq 'interaction-genome.js?v=20260728-genome-1' docs/scifi-ui/scripts/igloo-parity.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Interaction Genome already integrated.'
            exit 0
          fi
          git config user.name 'FormatX Genome Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/scripts/igloo-parity.js
          git commit -m 'Integrate reversible Interaction Genome runtime'
          git push origin HEAD:master
