name: One-shot npm audit comparison

on:
  push:
    branches:
      - maintenance/npm-audit-20260731
    paths:
      - '.github/workflows/one-shot-audit-comparison.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-audit-comparison
  cancel-in-progress: false

jobs:
  compare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out maintenance candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out master baseline
        uses: actions/checkout@v4
        with:
          ref: master
          path: baseline
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit master baseline
        working-directory: baseline/billing-worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > ../../audit-before.json || true

      - name: Audit and validate maintenance candidate
        working-directory: billing-worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > ../audit-after.json || true
          npm test
          npx wrangler deploy --dry-run --outdir ../.wrangler-audit-comparison

      - name: Build compact audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));

          function compact(report) {
            const vulnerabilities = report.vulnerabilities || {};
            return {
              counts: report.metadata?.vulnerabilities || {},
              advisories: Object.entries(vulnerabilities).map(([name, item]) => ({
                name,
                severity: item.severity || null,
                direct: Boolean(item.isDirect),
                range: item.range || null,
                fix_available: item.fixAvailable ?? null,
                via: Array.isArray(item.via)
                  ? item.via.map(value => typeof value === 'string' ? value : {
                      source: value.source || null,
                      name: value.name || null,
                      severity: value.severity || null,
                      title: value.title || null,
                      range: value.range || null,
                    })
                  : [],
              })).sort((a, b) => a.name.localeCompare(b.name)),
            };
          }

          const evidence = {
            schema_version: 1,
            generated_at: new Date().toISOString(),
            baseline: compact(before),
            candidate: compact(after),
          };

          fs.writeFileSync(
            'artifacts/npm-audit-comparison.json',
            JSON.stringify(evidence, null, 2) + '\n'
          );

          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Remove one-shot workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-audit-comparison.yml
          git config user.name 'FormatX maintenance automation'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/npm-audit-comparison.json
          git commit -m 'Record npm audit comparison evidence'
          git push origin HEAD:maintenance/npm-audit-20260731
