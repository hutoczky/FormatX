name: One-shot npm audit comparison

on:
  push:
    branches:
      - maintenance/npm-audit-20260731
    paths:
      - '.github/workflows/one-shot-audit-comparison.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-audit-comparison
  cancel-in-progress: false

jobs:
  compare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out maintenance candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out master baseline
        uses: actions/checkout@v4
        with:
          ref: master
          path: baseline
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect audit, test and dry-build evidence
        shell: bash
        run: |
          set -u
          mkdir -p artifacts

          baseline_ci=0
          baseline_audit=0
          candidate_ci=0
          candidate_audit=0
          candidate_test=0
          candidate_dry_build=0

          (cd baseline/billing-worker && npm ci) || baseline_ci=$?
          if [[ $baseline_ci -eq 0 ]]; then
            (cd baseline/billing-worker && npm audit --json > ../../audit-before.json) || baseline_audit=$?
          fi

          (cd billing-worker && npm ci) || candidate_ci=$?
          if [[ $candidate_ci -eq 0 ]]; then
            (cd billing-worker && npm audit --json > ../audit-after.json) || candidate_audit=$?
            (cd billing-worker && npm test) || candidate_test=$?
            (cd billing-worker && npx wrangler deploy --dry-run --outdir ../.wrangler-audit-comparison) || candidate_dry_build=$?
          fi

          BASELINE_CI=$baseline_ci \
          BASELINE_AUDIT=$baseline_audit \
          CANDIDATE_CI=$candidate_ci \
          CANDIDATE_AUDIT=$candidate_audit \
          CANDIDATE_TEST=$candidate_test \
          CANDIDATE_DRY_BUILD=$candidate_dry_build \
          node - <<'NODE'
          const fs = require('node:fs');

          function readJson(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return {};
            }
          }

          function compact(report) {
            const vulnerabilities = report.vulnerabilities || {};
            return {
              counts: report.metadata?.vulnerabilities || {},
              advisories: Object.entries(vulnerabilities).map(([name, item]) => ({
                name,
                severity: item.severity || null,
                direct: Boolean(item.isDirect),
                range: item.range || null,
                fix_available: item.fixAvailable ?? null,
                via: Array.isArray(item.via)
                  ? item.via.map(value => typeof value === 'string' ? value : {
                      source: value.source || null,
                      name: value.name || null,
                      severity: value.severity || null,
                      title: value.title || null,
                      range: value.range || null,
                    })
                  : [],
              })).sort((a, b) => a.name.localeCompare(b.name)),
            };
          }

          const evidence = {
            schema_version: 1,
            generated_at: new Date().toISOString(),
            execution: {
              baseline_npm_ci_exit: Number(process.env.BASELINE_CI),
              baseline_npm_audit_exit: Number(process.env.BASELINE_AUDIT),
              candidate_npm_ci_exit: Number(process.env.CANDIDATE_CI),
              candidate_npm_audit_exit: Number(process.env.CANDIDATE_AUDIT),
              candidate_test_exit: Number(process.env.CANDIDATE_TEST),
              candidate_dry_build_exit: Number(process.env.CANDIDATE_DRY_BUILD),
            },
            baseline: compact(readJson('audit-before.json')),
            candidate: compact(readJson('audit-after.json')),
          };

          fs.writeFileSync(
            'artifacts/npm-audit-comparison.json',
            JSON.stringify(evidence, null, 2) + '\n'
          );
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Remove one-shot workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-audit-comparison.yml
          git config user.name 'FormatX maintenance automation'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/npm-audit-comparison.json
          git commit -m 'Record npm audit comparison evidence'
          git push origin HEAD:maintenance/npm-audit-20260731
