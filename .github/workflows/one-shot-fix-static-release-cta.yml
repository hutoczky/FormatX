name: One-shot fix static release CTA

on:
  push:
    branches:
      - maintenance/npm-audit-20260731
    paths:
      - '.github/workflows/one-shot-fix-static-release-cta.yml'

permissions:
  contents: write

concurrency:
  group: formatx-one-shot-fix-static-release-cta
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale static release CTA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/index.html')
          text = path.read_text(encoding='utf-8')
          old = '''<a id="hero-download" class="button button-solid magnetic" href="https://github.com/hutoczky/FormatX-Updates/releases/download/v92/FormatX-Suite-Pro-V92.zip"><span data-hu="Teljes verzió letöltése" data-en="Download full version">Teljes verzió letöltése</span><i>↗</i></a>'''
          new = '''<a id="hero-download" class="button button-solid magnetic" href="./downloads/" data-release-download="windows"><span data-release-download-label data-hu="Windows nyilvános béta letöltése" data-en="Download Windows public beta">Windows nyilvános béta letöltése</span><i>↗</i></a>'''

          if old not in text:
              raise SystemExit('Expected stale hero CTA was not found')

          updated = text.replace(old, new, 1)
          if 'FormatX-Suite-Pro-V92.zip' in updated or '/releases/download/v92/' in updated:
              raise SystemExit('Stale V92 release URL remains in index.html')

          path.write_text(updated, encoding='utf-8')
          PY

          grep -Fq 'Windows nyilvános béta letöltése' docs/scifi-ui/index.html
          grep -Fq 'data-release-download="windows"' docs/scifi-ui/index.html
          ! grep -Fq 'FormatX-Suite-Pro-V92.zip' docs/scifi-ui/index.html

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fix-static-release-cta.yml
          git config user.name 'FormatX maintenance automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git commit -m 'Replace stale static release CTA with beta fallback'
          git push origin HEAD:maintenance/npm-audit-20260731
