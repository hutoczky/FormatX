name: Validate FormatX continuous laptop loop
run-name: Validate laptop wheel loop from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js'
      - 'docs/scifi-ui/styles/formatx-infinite-loop-v2.css'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/igloo-parity.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js'
      - 'docs/scifi-ui/styles/formatx-infinite-loop-v2.css'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-laptop-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate controller source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js
          node --check docs/scifi-ui/scripts/igloo-parity.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          grep -Fq 'authoritative-wheel-v2' docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js
          grep -Fq 'formatx-infinite-loop-controller-v2.js?v=20260728-loop-v2' docs/scifi-ui/scripts/igloo-parity.js
          ! grep -Fq 'formatx-infinite-loop-fix.js?v=20260727-loop-1' docs/scifi-ui/scripts/igloo-parity.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-laptop-loop" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-laptop-loop/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-laptop-loop-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-laptop-loop-http.log"
          exit 1

      - name: Verify real laptop wheel and touchpad continuity
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-laptop-loop/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-laptop-continuous-loop.cjs 2>&1 | tee laptop-continuous-loop-report.txt

      - name: Upload laptop loop report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-laptop-continuous-loop-report
          path: laptop-continuous-loop-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish laptop loop status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='1366x768 and 1536x864 continuous wheel loops passed'
          else
            state='failure'
            description='Continuous laptop wheel loop validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX continuous laptop loop' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
