name: Validate FormatX seamless continuous scrolling
run-name: Validate seamless scrolling from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/styles/formatx-seamless-loop.css'
      - 'docs/scifi-ui/data/public-platform-contract.json'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/styles/formatx-seamless-loop.css'
      - 'docs/scifi-ui/data/public-platform-contract.json'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-seamless-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate seamless scroll source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          python3 -m json.tool docs/scifi-ui/data/public-platform-contract.json >/dev/null
          grep -Fq "const VERSION = 'seamless-v6'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "root.dataset.fxAutomaticLoop = 'enabled'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "root.dataset.fxInfiniteCloneMode = 'visual-bridge'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "clonedContent: false" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "clonedHeroOnly: true" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "sectionSnapDisabled: true" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "jumpFree: true" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq '"automatic_scroll_loop": true' docs/scifi-ui/data/public-platform-contract.json
          grep -Fq '"hero_visual_bridge": true' docs/scifi-ui/data/public-platform-contract.json
          grep -Fq '"automatic_page_position_changes": true' docs/scifi-ui/data/public-platform-contract.json
          grep -Fq '"section_scroll_snap": false' docs/scifi-ui/data/public-platform-contract.json
          grep -Fq "scroll-snap-type: none !important" docs/scifi-ui/styles/formatx-seamless-loop.css
          grep -Fq "scroll-snap-align: none !important" docs/scifi-ui/styles/formatx-seamless-loop.css
          grep -Fq "cloneNode(true)" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "window.scrollTo(" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "preventDefault" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "addEventListener('wheel'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "addEventListener('touchmove'" docs/scifi-ui/scripts/formatx-infinite-scroll.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-seamless-scroll" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-seamless-scroll/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-seamless-scroll-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-seamless-scroll-http.log"
          exit 1

      - name: Verify mobile, laptop and Full HD seamless scrolling
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-seamless-scroll/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-laptop-continuous-loop.cjs 2>&1 | tee seamless-scroll-report.txt

      - name: Upload seamless scroll report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-seamless-scroll-report
          path: seamless-scroll-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish seamless scroll status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Seamless cyclic scrolling passed on mobile, HD and Full HD'
          else
            state='failure'
            description='Seamless cyclic scrolling validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX seamless continuous scrolling' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
