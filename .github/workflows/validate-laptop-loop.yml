name: Validate FormatX platform scroll policy
run-name: Validate platform scroll policy from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - 'docs/scifi-ui/styles/formatx-seamless-loop.css'
      - 'docs/scifi-ui/styles/formatx-continuous-scroll.css'
      - 'docs/scifi-ui/styles/formatx-mobile-production-r5.css'
      - 'docs/scifi-ui/styles/formatx-mobile-seamless-loop.css'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - 'docs/scifi-ui/styles/formatx-seamless-loop.css'
      - 'docs/scifi-ui/styles/formatx-continuous-scroll.css'
      - 'docs/scifi-ui/styles/formatx-mobile-production-r5.css'
      - 'docs/scifi-ui/styles/formatx-mobile-seamless-loop.css'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-platform-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          grep -Fq "platform-scroll-v2" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "native-momentum-loop-v1" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "fxAutomaticLoop = mobile ? 'pending-mobile' : 'desktop-only'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "formatx-infinite-scroll-desktop-v7.js" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "formatx-mobile-seamless-loop.css" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "scrollTo(" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "scrollIntoView(" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "cloneNode(" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "preventDefault" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "const VERSION = 'seamless-v7'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "cloneNode(true)" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "window.scrollTo(" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "mobileTransfer: 'scrollend-or-idle'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          ! grep -Fq "addEventListener('wheel'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          ! grep -Fq "addEventListener('touchmove'" docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          grep -Fq "scroll-snap-type: none !important" docs/scifi-ui/styles/formatx-continuous-scroll.css
          grep -Fq "mobile-seamless-r5" docs/scifi-ui/styles/formatx-continuous-scroll.css
          grep -Fq "min-height: calc(100svh + max(320px, 24svh))" docs/scifi-ui/styles/formatx-mobile-seamless-loop.css

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-platform-scroll" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-platform-scroll/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-platform-scroll-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-platform-scroll-http.log"
          exit 1

      - name: Verify mobile and desktop seamless scrolling
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-platform-scroll/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-laptop-continuous-loop.cjs 2>&1 | tee platform-scroll-report.txt

      - name: Upload scroll report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-platform-scroll-report
          path: platform-scroll-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish platform scroll status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Mobile + desktop seamless scroll passed'
          else
            state='failure'
            description='Platform scroll validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX platform scroll policy' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
