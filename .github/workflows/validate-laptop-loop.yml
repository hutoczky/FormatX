name: Validate FormatX jump-free scrolling
run-name: Validate native scrolling from ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js'
      - 'docs/scifi-ui/data/public-platform-contract.json'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js'
      - 'docs/scifi-ui/data/public-platform-contract.json'
      - '.github/scripts/validate-laptop-continuous-loop.cjs'
      - '.github/workflows/validate-laptop-loop.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-native-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate native scroll source
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll.js
          node --check docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js
          node --check .github/scripts/validate-laptop-continuous-loop.cjs
          python3 -m json.tool docs/scifi-ui/data/public-platform-contract.json >/dev/null
          grep -Fq "native-v5" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "automaticLoop: false" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq "jumpFree: true" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          grep -Fq '"automatic_scroll_loop": false' docs/scifi-ui/data/public-platform-contract.json
          grep -Fq '"forced_scroll_transfer": false' docs/scifi-ui/data/public-platform-contract.json
          ! grep -Fq "scrollTo(" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "preventDefault" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "performLoop" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "addEventListener('wheel'" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "addEventListener('touch" docs/scifi-ui/scripts/formatx-infinite-scroll.js
          ! grep -Fq "scrollTo(" docs/scifi-ui/scripts/formatx-infinite-loop-controller-v2.js

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/formatx-native-scroll" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-native-scroll/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/formatx-native-scroll-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/formatx-native-scroll-http.log"
          exit 1

      - name: Verify mobile, laptop and Full HD scrolling
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-native-scroll/node_modules
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/validate-laptop-continuous-loop.cjs 2>&1 | tee native-scroll-report.txt

      - name: Upload native scroll report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatx-native-scroll-report
          path: native-scroll-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish native scroll status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Native jump-free scrolling passed on mobile, HD and Full HD'
          else
            state='failure'
            description='Native scrolling validation failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX jump-free scrolling' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
