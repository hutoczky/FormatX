name: R646 live collapsed boundary overrides stale desktop capture

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r646-live-boundary-overrides-stale-capture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply live collapsed boundary repair
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r646.py
          python3 -m py_compile /tmp/r646.py
          python3 /tmp/r646.py
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git diff --check
          grep -Fq 'fxDesktopLoopBoundaryR646' docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          git commit -m "R646 allow live collapsed boundary to replace stale capture"
          git push origin HEAD:fix/r533-p0-intro-lcp
