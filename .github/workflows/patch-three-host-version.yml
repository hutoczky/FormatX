name: Align initial Three.js stage URL

on:
  push:
    branches:
      - agent/fix-live-loop-controller
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-live-loop-controller
          fetch-depth: 0

      - name: Replace the stale initial stage version
        shell: bash
        run: |
          set -euo pipefail
          file='docs/scifi-ui/scripts/formatx-three-host.js'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/scifi-ui/scripts/formatx-three-host.js')
          source = path.read_text(encoding='utf-8')
          old = "frame.src = './three-stage.html?v=20260727-three-1';"
          new = "frame.src = './three-stage.html?v=20260727-three-6';"
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('Expected Three.js stage source line is missing')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          if git diff --quiet -- "$file"; then
            echo 'Host already uses the canonical stage version.'
            exit 0
          fi

          git config user.name 'FormatX Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$file"
          git commit -m 'Start the Three.js stage at the canonical version'
          git push origin HEAD:agent/fix-live-loop-controller
