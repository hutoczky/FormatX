name: R642 P0 contract-window release and gate fixes

on:
  push:
    branches:
      - fix/r533-p0-intro-lcp
    paths:
      - .github/workflows/r642-p0-window-and-gates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/r533-p0-intro-lcp
          fetch-depth: 0
      - name: Apply R642 source fixes
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/r642.py
          python3 /tmp/r642.py
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/formatx-control-owner-r268.js
          node --check .github/scripts/validate-public-evidence-gaps.cjs
          git diff --check
      - name: Commit source fixes
        run: |
          git config user.name "Games Tech"
          git config user.email "hutoczky@users.noreply.github.com"
          git add docs/scifi-ui/scripts/formatx-event-horizon.js .github/scripts/validate-public-evidence-gaps.cjs docs/scifi-ui/scripts/formatx-control-owner-r268.js
          git commit -m "R642 release intro inside contract window and fix static gates"
          git push origin HEAD:fix/r533-p0-intro-lcp
