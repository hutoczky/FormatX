name: Validate MAG cinematic archive WebGL and eight-source scroll

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - '.github/scripts/validate-r2051-deferred-loop-css.cjs'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
      - 'docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
      - 'docs/scifi-ui/styles/formatx-mag-mobile-optics-r480.css'
      - 'docs/scifi-ui/styles/formatx-core-real3d-v20.css'
      - 'docs/scifi-ui/styles/formatx-mag-birth-live-r533.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-mag-debanding-r2035.cjs'
      - '.github/scripts/validate-cinematic-archive-r1987.cjs'
      - '.github/scripts/validate-archive-atomic-chapter-r2110.cjs'
      - '.github/scripts/validate-native-stage-reservation-r2113.cjs'
      - '.github/scripts/validate-hero-footprint-r2117.cjs'
      - '.github/scripts/validate-native-framing-r2114.cjs'
      - '.github/scripts/validate-habitat-presentation-r2126.cjs'
      - '.github/scripts/validate-habitat-frame-owner-r2132.cjs'
      - '.github/scripts/validate-native-intro-field-r2127.cjs'
      - '.github/scripts/validate-mag-buffer-resize-r2128.cjs'
      - '.github/scripts/validate-native-intro-state-r2129.cjs'
      - '.github/scripts/validate-native-reduced-input-r2130.cjs'
      - '.github/scripts/validate-native-header-clearance-r2131.cjs'
      - '.github/scripts/validate-native-shader-payload-r2133.cjs'
      - '.github/scripts/validate-native-optical-parallax-r2134.cjs'
      - '.github/scripts/validate-native-intro-camera-r2135.cjs'
      - '.github/scripts/validate-native-gpu-budget-r2136.cjs'
      - 'docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - 'docs/scifi-ui/scripts/formatx-deferred-reduced-style-r232.js'
      - 'docs/scifi-ui/styles/formatx-category-positioning.css'
      - 'docs/scifi-ui/styles/formatx-critical-core-r227.css'
      - 'docs/scifi-ui/styles/formatx-critical-reduced-full-r298.css'
      - 'docs/scifi-ui/scripts/formatx-menu-owner-r1956.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/styles/formatx-menu-owner-r1956.css'
      - 'docs/scifi-ui/styles/formatx-ai-core-ident-r1951.css'
      - 'docs/scifi-ui/scripts/formatx-living-habitat-r1530.js'
      - '.github/workflows/validate-cinematic-archive-r1987.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - '.github/scripts/validate-r2051-deferred-loop-css.cjs'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
      - 'docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
      - 'docs/scifi-ui/styles/formatx-mag-mobile-optics-r480.css'
      - 'docs/scifi-ui/styles/formatx-core-real3d-v20.css'
      - 'docs/scifi-ui/styles/formatx-mag-birth-live-r533.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-mag-debanding-r2035.cjs'
      - '.github/scripts/validate-cinematic-archive-r1987.cjs'
      - '.github/scripts/validate-archive-atomic-chapter-r2110.cjs'
      - '.github/scripts/validate-native-stage-reservation-r2113.cjs'
      - '.github/scripts/validate-hero-footprint-r2117.cjs'
      - '.github/scripts/validate-native-framing-r2114.cjs'
      - '.github/scripts/validate-habitat-presentation-r2126.cjs'
      - '.github/scripts/validate-habitat-frame-owner-r2132.cjs'
      - '.github/scripts/validate-native-intro-field-r2127.cjs'
      - '.github/scripts/validate-mag-buffer-resize-r2128.cjs'
      - '.github/scripts/validate-native-intro-state-r2129.cjs'
      - '.github/scripts/validate-native-reduced-input-r2130.cjs'
      - '.github/scripts/validate-native-header-clearance-r2131.cjs'
      - '.github/scripts/validate-native-shader-payload-r2133.cjs'
      - '.github/scripts/validate-native-optical-parallax-r2134.cjs'
      - '.github/scripts/validate-native-intro-camera-r2135.cjs'
      - '.github/scripts/validate-native-gpu-budget-r2136.cjs'
      - 'docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/styles/formatx-mobile-first-paint-r358.css'
      - 'docs/scifi-ui/scripts/formatx-deferred-reduced-style-r232.js'
      - 'docs/scifi-ui/styles/formatx-category-positioning.css'
      - 'docs/scifi-ui/styles/formatx-critical-core-r227.css'
      - 'docs/scifi-ui/styles/formatx-critical-reduced-full-r298.css'
      - 'docs/scifi-ui/scripts/formatx-menu-owner-r1956.js'
      - 'docs/scifi-ui/scripts/formatx-control-owner-r268.js'
      - 'docs/scifi-ui/styles/formatx-menu-owner-r1956.css'
      - 'docs/scifi-ui/styles/formatx-ai-core-ident-r1951.css'
      - 'docs/scifi-ui/scripts/formatx-living-habitat-r1530.js'
      - '.github/workflows/validate-cinematic-archive-r1987.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatx-native-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check billing-worker/src/production-entry.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node .github/scripts/validate-r2051-deferred-loop-css.cjs
          node --check docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check .github/scripts/validate-cinematic-archive-r1987.cjs
          node --check .github/scripts/validate-archive-atomic-chapter-r2110.cjs
          node --check .github/scripts/validate-native-stage-reservation-r2113.cjs
          node --check .github/scripts/validate-hero-footprint-r2117.cjs
          node --check .github/scripts/validate-native-framing-r2114.cjs
          node --check .github/scripts/validate-habitat-presentation-r2126.cjs
          node --check .github/scripts/validate-habitat-frame-owner-r2132.cjs
          node --check .github/scripts/validate-native-intro-field-r2127.cjs
          node --check .github/scripts/validate-mag-buffer-resize-r2128.cjs
          node --check .github/scripts/validate-native-intro-state-r2129.cjs
          node --check .github/scripts/validate-native-reduced-input-r2130.cjs
          node --check .github/scripts/validate-native-header-clearance-r2131.cjs
          node --check .github/scripts/validate-native-shader-payload-r2133.cjs
          node --check .github/scripts/validate-native-optical-parallax-r2134.cjs
          node --check .github/scripts/validate-native-intro-camera-r2135.cjs
          node --check .github/scripts/validate-native-gpu-budget-r2136.cjs
          node --check docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js
          node --check docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          node --check .github/scripts/validate-mag-debanding-r2035.cjs
          node .github/scripts/validate-mag-debanding-r2035.cjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/formatx-archive" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-archive/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve source website
        run: |
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/archive-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/archive-server.log"
          exit 1
      - name: Test actual native intro camera and original reduced shortcut
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/validate-native-intro-camera-r2135.cjs
      - name: Test completed native GPU measurements and unavailable-timer fallback
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/validate-native-gpu-budget-r2136.cjs
      - name: Test actual native shader payload and preserved live program
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/validate-native-shader-payload-r2133.cjs
      - name: Test body-attached native optical parallax with genuine keyboard turns
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: node .github/scripts/validate-native-optical-parallax-r2134.cjs
      - name: Test actual WebGL1 optical parallax when WebGL2 is unavailable
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          FORMATX_OPTICAL_WEBGL1: '1'
        run: node .github/scripts/validate-native-optical-parallax-r2134.cjs
      - name: Test atomic native chapter handoff on desktop and phone
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-archive-atomic-chapter-r2110.cjs
      - name: Test desktop, phone, reversibility, accessibility fallback
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-cinematic-archive-r1987.cjs
      - name: Test real first-visit native stage stability and layout shifts
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-native-stage-reservation-r2113.cjs
      - name: Test cold mobile hero footprint, responsive growth and exact restoration
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-hero-footprint-r2117.cjs
      - name: Test real native intro framing and MAG identity placement
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-native-framing-r2114.cjs
      - name: Test actual single-frame habitat startup without an orphan paint
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-habitat-frame-owner-r2132.cjs
      - name: Test CSS-hidden habitat allocation and actual late stylesheet recovery
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-habitat-presentation-r2126.cjs
      - name: Test actual first native intro filter and continuous studio field
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-native-intro-field-r2127.cjs
      - name: Test actual desktop buffer pairing and unchanged mobile allocation
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-mag-buffer-resize-r2128.cjs
      - name: Test genuine intro state, sharp native identity and real reduced-motion menu input
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-native-intro-state-r2129.cjs
      - name: Test real keyboard and MAG input after the original reduced stylesheet loads
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-native-reduced-input-r2130.cjs
      - name: Test actual wordmark clearance and genuine bilingual header input
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/validate-native-header-clearance-r2131.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-archive-visual-proof
          path: |
            .archive-artifacts/
            artifacts/r2117-hero-footprint/
          if-no-files-found: ignore
          include-hidden-files: true
