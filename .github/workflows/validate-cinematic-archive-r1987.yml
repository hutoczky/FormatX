name: Validate MAG cinematic archive WebGL and eight-source scroll

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - '.github/scripts/validate-r2051-deferred-loop-css.cjs'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
      - 'docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
      - 'docs/scifi-ui/styles/formatx-mag-mobile-optics-r480.css'
      - 'docs/scifi-ui/styles/formatx-core-real3d-v20.css'
      - 'docs/scifi-ui/styles/formatx-mag-birth-live-r533.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-mag-debanding-r2035.cjs'
      - '.github/scripts/validate-cinematic-archive-r1987.cjs'
      - '.github/scripts/validate-archive-atomic-chapter-r2110.cjs'
      - '.github/workflows/validate-cinematic-archive-r1987.yml'
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'billing-worker/src/production-entry.js'
      - 'docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js'
      - '.github/scripts/validate-r2051-deferred-loop-css.cjs'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js'
      - 'docs/scifi-ui/styles/formatx-cinematic-archive-r1987.css'
      - 'docs/scifi-ui/styles/formatx-mag-mobile-optics-r480.css'
      - 'docs/scifi-ui/styles/formatx-core-real3d-v20.css'
      - 'docs/scifi-ui/styles/formatx-mag-birth-live-r533.css'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - '.github/scripts/validate-mag-debanding-r2035.cjs'
      - '.github/scripts/validate-cinematic-archive-r1987.cjs'
      - '.github/scripts/validate-archive-atomic-chapter-r2110.cjs'
      - '.github/workflows/validate-cinematic-archive-r1987.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatx-native-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check billing-worker/src/production-entry.js
          node --check docs/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js
          node .github/scripts/validate-r2051-deferred-loop-css.cjs
          node --check docs/scifi-ui/scripts/formatx-cinematic-archive-r1987.js
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check .github/scripts/validate-cinematic-archive-r1987.cjs
          node --check .github/scripts/validate-archive-atomic-chapter-r2110.cjs
          node --check .github/scripts/validate-mag-debanding-r2035.cjs
          node .github/scripts/validate-mag-debanding-r2035.cjs
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/formatx-archive" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/formatx-archive/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve source website
        run: |
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/archive-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/archive-server.log"
          exit 1
      - name: Test atomic native chapter handoff on desktop and phone
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-archive-atomic-chapter-r2110.cjs
      - name: Test desktop, phone, reversibility, accessibility fallback
        env:
          NODE_PATH: ${{ runner.temp }}/formatx-archive/node_modules
        run: node .github/scripts/validate-cinematic-archive-r1987.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-archive-visual-proof
          path: .archive-artifacts/
          if-no-files-found: ignore
