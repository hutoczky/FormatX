name: R2110 actual premium Three film on Android

on:
  push:
    branches:
      - feature/r2107-master-sculpted-mag-optics
    paths:
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/scripts/formatx-mag-genesis-three-r1280.js'
      - 'docs/scifi-ui/index.html'
      - '.github/scripts/validate-r2110-actual-three-phone.cjs'
      - '.github/workflows/verify-r2110-actual-three-phone.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2110-real-three-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-4core-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual JS owner and evidence script syntax
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1280.js
          node --check .github/scripts/validate-r2110-actual-three-phone.cjs
      - name: Install real Chromium and complete software WebGL support
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/r2110" --no-audit --no-fund playwright@1.62.0
          "$RUNNER_TEMP/r2110/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve identical public-source production site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4178 --directory docs > "$RUNNER_TEMP/r2110-http.log" 2>&1 &
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/scifi-ui/index.html >/dev/null; then exit 0; fi
            sleep .25
          done
          cat "$RUNNER_TEMP/r2110-http.log"
          exit 1
      - name: Prove actual photographed Three.js movie on Android and desktop
        env:
          NODE_PATH: ${{ runner.temp }}/r2110/node_modules
          FORMATX_TEST_URL: http://127.0.0.1:4178/scifi-ui/index.html
        run: node .github/scripts/validate-r2110-actual-three-phone.cjs
      - name: Preserve exact genuine 3D framebuffer photographs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r2110-genuine-android-three-cinematic-shots
          path: artifacts/r2110-actual-three-phone/
          retention-days: 21
          if-no-files-found: warn
