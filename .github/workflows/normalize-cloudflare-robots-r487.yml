name: Normalize Cloudflare robots policy R487

on:
  workflow_run:
    workflows: ['Prepare or deploy FormatX production']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/normalize-cloudflare-robots-r487.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-cloudflare-robots-r487
  cancel-in-progress: true

jobs:
  normalize-robots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
      url: https://formatxsuite.com/
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Disable managed robots prepend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FORMATX_CLOUDFLARE_ROBOTS_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.FORMATX_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_WORKERS_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning title=Cloudflare credential missing::Set FORMATX_CLOUDFLARE_ROBOTS_TOKEN in the production GitHub environment (zone-scoped Zone Read and Bot Management Read/Write)."
            echo "No authenticated mutation attempted. Public verification still runs."
            exit 0
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_json="$(curl -fsS --retry 2 "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=formatxsuite.com&status=active&per_page=1')"
          zone_id="$(python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("result") or []; print(r[0].get("id","") if r else "")' <<<"$zone_json")"
          test -n "$zone_id"

          before="$(curl -fsS --retry 2 "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
          python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("success") is True, p; print("Current Cloudflare robots management:", (p.get("result") or {}).get("is_robots_txt_managed"))' <<<"$before"

          update="$(curl -fsS --retry 2 -X PUT "${auth[@]}" \
            --data '{"is_robots_txt_managed":false,"bot_preference_sync_enabled":false,"cf_robots_variant":"off"}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management")"
          python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("success") is True, p; r=p.get("result") or {}; assert r.get("is_robots_txt_managed") is False, r; assert ("bot_preference_sync_enabled" not in r or r.get("bot_preference_sync_enabled") is False), r; assert ("cf_robots_variant" not in r or r.get("cf_robots_variant") == "off"), r; print("PASS: Cloudflare managed robots prepend disabled.")' <<<"$update"

      - name: Verify canonical live robots.txt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          canonical() {
            local body="$1"
            ! grep -Eiq '^[[:space:]]*content-signal[[:space:]]*:' <<<"$body" &&
              grep -Eiq '^[[:space:]]*user-agent:[[:space:]]*\*[[:space:]]*$' <<<"$body" &&
              grep -Eiq '^[[:space:]]*disallow:[[:space:]]*/api/[[:space:]]*$' <<<"$body" &&
              grep -Eiq '^[[:space:]]*disallow:[[:space:]]*/scifi-ui/payment/[[:space:]]*$' <<<"$body" &&
              grep -Eiq '^[[:space:]]*sitemap:[[:space:]]*https://formatxsuite\.com/sitemap\.xml[[:space:]]*$' <<<"$body"
          }
          for attempt in $(seq 1 12); do
            ok=1
            for host in formatxsuite.com www.formatxsuite.com; do
              if body="$(curl -fsSL --proto '=https' --proto-redir '=https' --max-redirs 4 --max-time 15 -H 'Cache-Control: no-cache' "https://$host/robots.txt?r2341=$GITHUB_RUN_ID-$attempt")" && canonical "$body"; then
                echo "PASS: $host canonical robots.txt"
              else
                echo "FAIL: $host still serves an unexpected robots policy or is unavailable."
                ok=0
              fi
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo '::error title=Cloudflare robots policy unresolved::Both domains must serve canonical robots.txt without Content-Signal. Check Bot Preference Sync and the zone-scoped credential.'
          exit 1

      - name: Publish robots policy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Canonical Worker robots.txt is the only live robots policy'
          else
            state=failure
            description='Cloudflare managed robots policy normalization failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" \
            -f context='FormatX canonical robots policy' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
