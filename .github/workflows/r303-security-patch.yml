name: One-shot r303 production CSP patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r303-security-patch.yml'

permissions:
  contents: write

jobs:
  patch-production-csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production CSP and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          target = Path('billing-worker/src/production-with-license.js')
          text = target.read_text(encoding='utf-8')
          replacements = [
              (
                  '  "script-src \'self\'",\n',
                  '  "script-src \'self\' https://static.cloudflareinsights.com",\n',
              ),
              (
                  '  "style-src \'self\'",\n',
                  '  "style-src \'self\' \'sha256-7rBs0DG3JKiyRfhDmfxpOZ+oAz3c/ADQoufKFW6Kd68=\'",\n',
              ),
              (
                  '  "connect-src \'self\'",\n',
                  '  "connect-src \'self\' https://cloudflareinsights.com https://static.cloudflareinsights.com",\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected CSP token not found: {old!r}')
              text = text.replace(old, new, 1)
          target.write_text(text, encoding='utf-8')
          Path('.github/workflows/r303-security-patch.yml').unlink()
          PY

          git config user.name 'FormatX security patch bot'
          git config user.email 'actions@users.noreply.github.com'
          git add billing-worker/src/production-with-license.js .github/workflows/r303-security-patch.yml
          git diff --cached --check
          git commit -m 'Allow verified production CSP resources without weakening policy'
          git push origin HEAD:master
