name: Diagnose live mobile DCL r315
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diagnose-live-mobile-dcl-r314.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  isolate-mobile-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fx-dcl" && cd "$RUNNER_TEMP/fx-dcl"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Isolate exact mobile DCL blocker
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fx-dcl"
          node <<'NODE'
          const { chromium } = require('playwright');
          const origin = 'https://formatxsuite.com';
          const candidates = [
            'formatx-deferred-reduced-style-r232.js',
            'formatx-event-horizon.js',
            'formatx-apex.js',
            'living-architecture.js',
            'formatx-category-positioning.js',
            'formatx-content-runtime-loader-r241.js',
            'formatx-motion-runtime-loader-r239.js',
            'formatx-reference-production-r244.js',
            'formatx-infinite-scroll.js',
            'single-language-toggle.js',
            'formatx-license-links.js',
            'platform-status.js',
            'formatx-copy-polish.js',
            'release-metadata.js',
            'formatx-public-shell.js',
            'formatx-content-standard.js',
            'formatx-seo.js',
            'formatx-content-finalizer.js',
            'formatx-platform-surface-finalizer.js',
            'formatx-organism-trust.js',
            'formatx-organism-semantic-state.js',
            'formatx-feedback.js',
            'formatx-mobile-reference-layout-v1.js',
            'formatx-flow-first-r75.js',
            'formatx-mobile-layout-r207.js',
            'formatx-canonical-recovery.js',
            'formatx-infinite-scroll-desktop-v7.js',
            'beacon.min.js'
          ];

          async function run(browser, label, blocked = []) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              locale: 'hu-HU'
            });
            const page = await context.newPage();
            const failures = [];
            page.on('pageerror', error => failures.push('pageerror:' + error.message));
            page.on('requestfailed', request => {
              const url = request.url();
              if (!url.includes('cloudflareinsights')) failures.push(`${request.resourceType()}:${url}:${request.failure()?.errorText || ''}`);
            });
            if (blocked.length) {
              await page.route('**/*', route => {
                const url = route.request().url();
                if (route.request().resourceType() === 'script' && blocked.some(name => url.includes(name))) {
                  return route.abort('blockedbyclient');
                }
                return route.continue();
              });
            }
            const started = Date.now();
            let ok = false;
            let error = '';
            try {
              await page.goto(`${origin}/?dcl_r315=${encodeURIComponent(label)}-${Date.now()}`, {
                waitUntil: 'domcontentloaded',
                timeout: 6000
              });
              ok = true;
            } catch (e) {
              error = String(e.message || e).split('\n')[0];
            }
            const elapsed = Date.now() - started;
            let state = {};
            if (ok) {
              state = await page.evaluate(() => ({
                readyState: document.readyState,
                intro: document.documentElement.dataset.fxIntro || '',
                motion: document.documentElement.dataset.fxMotionRuntimeR239 || '',
                reference: document.documentElement.dataset.fxReferenceProductionR244 || '',
                mobileLayout: document.documentElement.dataset.fxMobileReferenceLayout || '',
                core: document.documentElement.dataset.fxCoreMobileR99 || ''
              })).catch(() => ({}));
            }
            console.log('DCL_R315_CASE', JSON.stringify({ label, blocked, ok, elapsed, error, state, failures: failures.slice(0, 4) }));
            await context.close();
            return { label, blocked, ok, elapsed };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']
            });
            try {
              const results = [];
              results.push(await run(browser, 'baseline'));
              for (const candidate of candidates) {
                results.push(await run(browser, 'block-' + candidate, [candidate]));
              }
              const suspects = results.filter(result => result.ok && result.blocked.length === 1).map(result => result.blocked[0]);
              console.log('DCL_R315_SUSPECTS', JSON.stringify(suspects));
              console.log('DCL_R315_SUMMARY', JSON.stringify(results));
              if (!suspects.length) {
                const first = candidates.slice(0, Math.ceil(candidates.length / 2));
                const second = candidates.slice(first.length);
                const groupA = await run(browser, 'block-first-half', first);
                const groupB = await run(browser, 'block-second-half', second);
                console.log('DCL_R315_GROUPS', JSON.stringify([groupA, groupB]));
                if (!groupA.ok && !groupB.ok) throw new Error('No single blocker and neither half resolves DCL; multiple-script interaction remains');
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Publish DCL diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Exact mobile DCL blocker isolation completed'; else state=failure; description='Exact mobile DCL blocker isolation failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='FormatX mobile DCL diagnostic r315' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
