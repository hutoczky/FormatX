name: Validate R520 first-paint tail candidate desktop + mobile x5
run-name: R520 first-paint request fanout candidate for ${{ github.sha }}

on:
  push:
    branches: [p0-r517-mobile-critical]
    paths:
      - '.github/workflows/validate-r520-first-paint-tail-candidate.yml'

permissions:
  contents: write

concurrency:
  group: r520-first-paint-tail-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT_BRANCH: p0-r520-first-paint-tail-candidate
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json

      - name: Generate exact-order first-paint tail bundle and Worker wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r520-first-paint-tail
          python3 <<'PY'
          from pathlib import Path
          root=Path('docs/scifi-ui/styles')
          first=(root/'formatx-first-paint-r206.css').read_text(encoding='utf-8')
          mobile=(root/'formatx-mobile-first-paint-r358.css').read_text(encoding='utf-8')
          frame=(root/'formatx-first-frame-stability-r283.css').read_text(encoding='utf-8')
          p0=(root/'formatx-p0-first-paint-r490.css').read_text(encoding='utf-8')
          assert '@charset' not in frame.lower() and '@import' not in frame.lower(), 'r283 cannot be safely nested under original link media'
          desktop_media='(prefers-reduced-motion: no-preference) and (min-width: 901px) and (pointer: fine)'
          bundle=(
            '/* FormatX R520 candidate — exact contiguous first-paint tail cascade. */\n'
            '/* BEGIN formatx-first-paint-r206.css */\n'+first+'\n/* END formatx-first-paint-r206.css */\n'
            '/* BEGIN formatx-mobile-first-paint-r358.css */\n'+mobile+'\n/* END formatx-mobile-first-paint-r358.css */\n'
            f'@media {desktop_media} {{\n/* BEGIN formatx-first-frame-stability-r283.css under original link media */\n'+frame+'\n/* END formatx-first-frame-stability-r283.css */\n}\n'
            '/* BEGIN formatx-p0-first-paint-r490.css */\n'+p0+'\n/* END formatx-p0-first-paint-r490.css */\n'
          )
          (root/'formatx-first-paint-tail-r520.css').write_text(bundle,encoding='utf-8')
          PY
          cat > billing-worker/src/production-content-entry-r520.js <<'JS'
          import r517Production from './production-content-entry-r517.js';

          const PUBLIC_HOSTS = new Set(['formatxsuite.com', 'www.formatxsuite.com']);
          const TAIL_PATH = '/scifi-ui/styles/formatx-first-paint-tail-r520.css';
          const TAIL_SOURCES = new Set([
            '/scifi-ui/styles/formatx-first-paint-r206.css',
            '/scifi-ui/styles/formatx-mobile-first-paint-r358.css',
            '/scifi-ui/styles/formatx-first-frame-stability-r283.css',
            '/scifi-ui/styles/formatx-p0-first-paint-r490.css',
          ]);
          function stylesheetPath(tag) {
            const m=tag.match(/\bhref=(["'])(.*?)\1/i); if(!m) return '';
            try { return new URL(m[2], 'https://formatxsuite.com/scifi-ui/').pathname; } catch { return ''; }
          }
          function consolidateTail(html) {
            let inserted=false;
            return String(html||'').replace(/<link\b[^>]*\brel=["']stylesheet["'][^>]*>/gi,tag=>{
              const pathname=stylesheetPath(tag); if(!TAIL_SOURCES.has(pathname)) return tag;
              if(inserted) return '';
              inserted=true;
              return `<link rel="stylesheet" fetchpriority="high" data-fx-first-paint-tail-r520="true" data-fx-first-paint-r206="true" data-fx-mobile-first-paint-r358="true" data-fx-first-frame-stability-r500="true" data-fx-p0-first-paint-r503="true" href="${TAIL_PATH}?v=20260904-r520-first-paint-tail">`;
            });
          }
          export default {
            async fetch(request, env, ctx) {
              const response=await r517Production.fetch(request,env,ctx);
              const url=new URL(request.url);
              if(!['GET','HEAD'].includes(request.method)||!PUBLIC_HOSTS.has(url.hostname)) return response;
              const headers=new Headers(response.headers); headers.set('X-FormatX-First-Paint-Tail','r520-exact-cascade');
              if(request.method==='HEAD'){headers.delete('Content-Length');return new Response(null,{status:response.status,statusText:response.statusText,headers});}
              if(!(headers.get('Content-Type')||'').includes('text/html')) return new Response(response.body,{status:response.status,statusText:response.statusText,headers});
              const html=consolidateTail(await response.text());
              headers.delete('Content-Length'); headers.delete('Content-Encoding'); headers.delete('ETag'); headers.set('Cache-Control','no-store, max-age=0');
              return new Response(html,{status:response.status,statusText:response.statusText,headers});
            }
          };
          JS
          python3 <<'PY'
          from pathlib import Path
          p=Path('billing-worker/wrangler.jsonc'); s=p.read_text(encoding='utf-8')
          old='"main": "src/production-content-entry-r517.js"'
          assert old in s, 'R517 main not active on candidate branch'
          p.write_text(s.replace(old,'"main": "src/production-content-entry-r520.js"',1),encoding='utf-8')
          PY
          node --input-type=module --check < billing-worker/src/production-content-entry-r520.js
          test -s docs/scifi-ui/styles/formatx-first-paint-tail-r520.css
          git diff --check
          git diff -- billing-worker/src/production-content-entry-r520.js billing-worker/wrangler.jsonc docs/scifi-ui/styles/formatx-first-paint-tail-r520.css > artifacts/r520-first-paint-tail/source.diff

      - name: Install local Worker and Lighthouse tools
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix billing-worker --no-audit --prefer-offline
          npm install --no-save --no-package-lock lighthouse@13.4.1 playwright-core@1.62.0 >/dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Build local-only candidate config
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');const source=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete source.ai;delete source.routes;source.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r520-candidate.json',JSON.stringify(source,null,2)+'\n');
          NODE

      - name: Start exact candidate Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts
          cd billing-worker
          nohup npx wrangler dev --config wrangler.r520-candidate.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r520-wrangler.log" 2>&1 &
          cd ..
          for attempt in $(seq 1 60); do if curl -kfsS --max-time 5 -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1; then exit 0; fi; sleep 1; done
          cat "$RUNNER_TEMP/r520-wrangler.log"; exit 1

      - name: Real Chromium desktop and mobile geometry/CLS smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' | tee artifacts/r520-first-paint-tail/browser-smoke.txt
          const assert=require('node:assert/strict');const {chromium}=require('playwright-core');
          async function one(browser,name,viewport,mobile){const c=await browser.newContext({viewport,isMobile:mobile,hasTouch:mobile,deviceScaleFactor:mobile?2:1,locale:'hu-HU',reducedMotion:'no-preference',ignoreHTTPSErrors:true});const p=await c.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error'&&!/favicon|WebGL|WebGPU|GPU/i.test(m.text()))errors.push(m.text())});await p.addInitScript(()=>{window.__r520cls={total:0,entries:[]};try{new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput){window.__r520cls.total+=e.value;window.__r520cls.entries.push({value:e.value,startTime:e.startTime,sources:(e.sources||[]).map(s=>({node:s.node?.className||s.node?.id||s.node?.tagName||'',previousRect:s.previousRect,currentRect:s.currentRect}))})}}).observe({type:'layout-shift',buffered:true})}catch{}});const r=await p.goto('https://formatxsuite.com:8787/',{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r.status(),200);await p.waitForTimeout(2500);const s=await p.evaluate(()=>{const names=['formatx-first-paint-r206.css','formatx-mobile-first-paint-r358.css','formatx-first-frame-stability-r283.css','formatx-p0-first-paint-r490.css'];const links=[...document.querySelectorAll('link[rel="stylesheet"]')];const tail=links.filter(l=>l.href.includes('formatx-first-paint-tail-r520.css'));const old=links.filter(l=>names.some(n=>l.href.includes(n)));const hero=document.querySelector('#hero .fx-category-definition');const hs=hero?getComputedStyle(hero):null;return{tailCount:tail.length,oldCount:old.length,mobileSeed:document.documentElement.dataset.fxMobileFirstPaintR358||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,heroVisible:Boolean(hero&&hs&&hs.display!=='none'&&hs.visibility!=='hidden'&&Number(hs.opacity)>.2&&hero.getBoundingClientRect().height>40),cls:window.__r520cls};});console.log(name,JSON.stringify(s,null,2));assert.equal(s.tailCount,1);assert.equal(s.oldCount,0);assert.ok(s.overflow<=2);assert.equal(s.heroVisible,true);assert.ok(s.cls.total<0.05,`${name} CLS ${s.cls.total}`);if(mobile)assert.ok(['ready','loading'].includes(s.mobileSeed),`mobile seed ${s.mobileSeed}`);assert.equal(errors.length,0,errors.join(' | '));await c.close();}
          (async()=>{const b=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--headless=new','--no-sandbox','--ignore-certificate-errors','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist']});await one(b,'mobile',{width:390,height:844},true);await one(b,'desktop',{width:1350,height:940},false);await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Five consecutive desktop and mobile Lighthouse 13 runs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/r520-first-paint-tail/desktop artifacts/r520-first-paint-tail/mobile
          for i in 1 2 3 4 5; do
            npx lighthouse@13.4.1 'https://formatxsuite.com:8787/' --preset=desktop --output=json --output-path="artifacts/r520-first-paint-tail/desktop/run-$i.json" --chrome-path="$CHROME_PATH" --chrome-flags='--headless=new --no-sandbox --ignore-certificate-errors --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --quiet
          done
          for i in 1 2 3 4 5; do
            npx lighthouse@13.4.1 'https://formatxsuite.com:8787/' --output=json --output-path="artifacts/r520-first-paint-tail/mobile/run-$i.json" --chrome-path="$CHROME_PATH" --chrome-flags='--headless=new --no-sandbox --ignore-certificate-errors --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --quiet
          done

      - name: Validate targeted performance contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE' | tee artifacts/r520-first-paint-tail/summary.txt
          const fs=require('node:fs');let failed=false;const report={};for(const lane of ['desktop','mobile']){report[lane]=[];for(let i=1;i<=5;i++){const l=JSON.parse(fs.readFileSync(`artifacts/r520-first-paint-tail/${lane}/run-${i}.json`,'utf8'));const r={run:i,performance:Math.round(l.categories.performance.score*100),accessibility:Math.round(l.categories.accessibility.score*100),bestPractices:Math.round(l.categories['best-practices'].score*100),seo:Math.round(l.categories.seo.score*100),FCP:l.audits['first-contentful-paint'].numericValue,LCP:l.audits['largest-contentful-paint'].numericValue,SI:l.audits['speed-index'].numericValue,TBT:l.audits['total-blocking-time'].numericValue,CLS:l.audits['cumulative-layout-shift'].numericValue,TTFB:l.audits['server-response-time'].numericValue};report[lane].push(r);if(r.performance!==100||r.LCP>=2000||r.CLS>=0.05||r.TBT>150||r.TTFB>500)failed=true;}}console.log(JSON.stringify(report,null,2));fs.writeFileSync('artifacts/r520-first-paint-tail/report.json',JSON.stringify({report,failed},null,2));if(failed)process.exit(1);
          NODE

      - name: Commit proven R520 candidate branch
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Games Tech'
          git config user.email 'hutoczky@users.noreply.github.com'
          git add billing-worker/src/production-content-entry-r520.js billing-worker/wrangler.jsonc docs/scifi-ui/styles/formatx-first-paint-tail-r520.css
          git commit -m 'Consolidate exact first-paint tail request fanout'
          git push origin HEAD:"refs/heads/$OUT_BRANCH"

      - name: Show Worker log
        if: always()
        run: cat "$RUNNER_TEMP/r520-wrangler.log" || true
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r520-first-paint-tail-${{ github.sha }}
          path: artifacts/r520-first-paint-tail/
          if-no-files-found: warn
          retention-days: 30
