name: Verify r181 desktop crystal apex
on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-r181-desktop-apex.yml']
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apex-live:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.62.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify live r181 apex on desktop and mobile bypass
        run: |
          cat > verify-r181.cjs <<'JS'
          const {chromium}=require('playwright');const assert=require('node:assert/strict'),fs=require('node:fs');const origin='https://formatxsuite.com';
          async function desktop(browser){
            const c=await browser.newContext({viewport:{width:1600,height:1000},deviceScaleFactor:1,locale:'hu-HU',reducedMotion:'no-preference'}),p=await c.newPage();p.setDefaultTimeout(60000);
            await p.goto(`${origin}/?verify=r181-desktop-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>document.documentElement.dataset.fxDesktopApexR181==='ready'&&document.documentElement.dataset.fxDesktopApexVersionR181==='r181-desktop-crystal-apex'&&document.documentElement.dataset.fxCoreReferenceTextureR130==='ready'&&document.querySelector('#hero .fx-core-detail-r122'),null,{timeout:60000});
            await p.waitForTimeout(500);
            const a=await p.evaluate(()=>{const r=document.documentElement,hero=document.getElementById('hero'),space=hero.querySelector('.hero-space'),copy=hero.querySelector('.hero-copy'),detail=hero.querySelector('.fx-core-detail-r122'),native=hero.querySelector('.fx-core-mobile-v55-canvas,.fx-core-r112-canvas'),map=hero.querySelector('.fx-organism-map'),launch=hero.querySelector('.fx-immersive-launch'),meta=hero.querySelector('.fx-r181-apex-meta'),rect=e=>{const x=e.getBoundingClientRect();return{x:x.x,y:x.y,w:x.width,h:x.height}},style=e=>getComputedStyle(e);return{ready:r.dataset.fxDesktopApexR181,version:r.dataset.fxDesktopApexVersionR181,composition:r.dataset.fxReferenceComposition,energy:Number(r.dataset.fxDesktopApexEnergyR181||0),pointer:r.dataset.fxDesktopApexPointerR181||'',hero:rect(hero),space:rect(space),copy:rect(copy),detail:rect(detail),detailOpacity:Number(style(detail).opacity),detailFilter:style(detail).filter,nativeOpacity:Number(style(native).opacity),mapDisplay:style(map).display,launchDisplay:style(launch).display,meta:!!meta,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,renderMs:Number(r.dataset.fxCoreRenderMs||Infinity)}});
            assert.equal(a.ready,'ready');assert.equal(a.version,'r181-desktop-crystal-apex');assert.equal(a.composition,'desktop-cinematic-mag-r181');assert.ok(a.hero.h>=700);assert.ok(a.space.w>=1500);assert.ok(a.detail.w>=600&&a.detail.h>=600,`crystal too small ${JSON.stringify(a.detail)}`);assert.ok(a.detail.x>a.copy.x+a.copy.w*.55,'crystal does not own the visual right/center field');assert.ok(a.nativeOpacity>=.15,'native WebGL layer is not visually present');assert.equal(a.mapDisplay,'none');assert.equal(a.launchDisplay,'none');assert.equal(a.meta,true);assert.ok(a.overflow<=2,`desktop overflow ${a.overflow}`);assert.ok(a.renderMs<16.67);
            const box=await p.locator('#hero .hero-space').boundingBox();if(box){await p.mouse.move(box.x+box.width*.72,box.y+box.height*.36);await p.mouse.down();await p.waitForTimeout(80);await p.mouse.up();await p.waitForTimeout(220)}
            const b=await p.evaluate(()=>({energy:Number(document.documentElement.dataset.fxDesktopApexEnergyR181||0),pointer:document.documentElement.dataset.fxDesktopApexPointerR181||'',interaction:document.documentElement.dataset.fxDesktopApexInteractionR181||''}));assert.ok(b.energy>a.energy||b.pointer!==a.pointer);assert.ok(['energized','idle-living'].includes(b.interaction));
            await p.screenshot({path:'/tmp/r181-desktop.png',fullPage:false,animations:'disabled',timeout:120000});await c.close();
          }
          async function mobile(browser){
            const c=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',reducedMotion:'no-preference'}),p=await c.newPage();p.setDefaultTimeout(60000);
            await p.goto(`${origin}/?verify=r181-mobile-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>document.documentElement.dataset.fxDesktopApexR181==='mobile-bypass'&&document.documentElement.dataset.fxMobileReferenceLayout==='ready-v1'&&document.documentElement.dataset.fxCoreReferenceTextureR130==='ready',null,{timeout:60000});await p.waitForTimeout(300);
            const s=await p.evaluate(()=>{const r=document.documentElement,d=document.querySelector('#hero .fx-core-detail-r122')?.getBoundingClientRect();return{apex:r.dataset.fxDesktopApexR181,layout:r.dataset.fxMobileReferenceLayout,detail:[d?.width||0,d?.height||0],overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,motion:r.dataset.fxCoreMotionR144||'',heartbeat:r.dataset.fxLiveHeartbeatR155||''}});assert.equal(s.apex,'mobile-bypass');assert.equal(s.layout,'ready-v1');assert.ok(s.detail[0]>=360);assert.ok(s.overflow<=2);assert.ok(s.motion.includes('breathing-pointer-touch-gyro'));assert.ok(s.heartbeat.includes('heartbeat'));
            await p.screenshot({path:'/tmp/r181-mobile.png',fullPage:false,animations:'disabled',timeout:120000});await c.close();
          }
          (async()=>{const b=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});try{await desktop(b);await mobile(b)}finally{await b.close()}for(const f of ['/tmp/r181-desktop.png','/tmp/r181-mobile.png'])assert.ok(fs.statSync(f).size>10000,f);console.log('PASS: r181 desktop crystal apex is dominant/interactable and mobile reference composition is unchanged.')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify-r181.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r181-desktop-apex-${{ github.run_id }}
          path: |
            /tmp/r181-desktop.png
            /tmp/r181-mobile.png
          if-no-files-found: warn
          retention-days: 14
