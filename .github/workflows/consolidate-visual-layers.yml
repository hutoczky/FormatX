name: Finalize FormatX visual consolidation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/consolidate-visual-layers.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Bump adaptive visual cache versions
        shell: python
        run: |
          from pathlib import Path

          index = Path('docs/scifi-ui/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('site-ambient-background.css?v=20260726-quantum-aurora-1', 'site-ambient-background.css?v=20260726-quantum-aurora-2')
          text = text.replace('site-quantum-aurora.css?v=20260726-quantum-aurora-1', 'site-quantum-aurora.css?v=20260726-quantum-aurora-2')
          text = text.replace('site-ambient-background.js?v=20260726-quantum-aurora-1', 'site-ambient-background.js?v=20260726-quantum-aurora-2')
          index.write_text(text, encoding='utf-8')

          worker = Path('billing-worker/src/production-with-license.js')
          text = worker.read_text(encoding='utf-8')
          text = text.replace("SITE_AMBIENT_VERSION = '20260726-quantum-aurora-1'", "SITE_AMBIENT_VERSION = '20260726-quantum-aurora-2'")
          worker.write_text(text, encoding='utf-8')

      - name: Validate final consolidated and adaptive system
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/scifi-ui/scripts/formatx-event-horizon.js
          node --check docs/scifi-ui/scripts/site-ambient-background.js
          node --check docs/scifi-ui/scripts/site-art-direction.js
          node --check billing-worker/src/production-with-license.js
          grep -F 'dataset.performance' docs/scifi-ui/scripts/site-ambient-background.js
          grep -F 'balancedMode' docs/scifi-ui/scripts/site-ambient-background.js
          grep -F 'data-performance="balanced"' docs/scifi-ui/styles/site-ambient-background.css
          grep -F 'data-performance="balanced"' docs/scifi-ui/styles/site-quantum-aurora.css
          grep -F 'site-ambient-background.css?v=20260726-quantum-aurora-2' docs/scifi-ui/index.html
          grep -F 'site-quantum-aurora.css?v=20260726-quantum-aurora-2' docs/scifi-ui/index.html
          grep -F 'site-ambient-background.js?v=20260726-quantum-aurora-2' docs/scifi-ui/index.html
          grep -F "SITE_AMBIENT_VERSION = '20260726-quantum-aurora-2'" billing-worker/src/production-with-license.js
          ! grep -Fq 'fx-intro-page-reveal' docs/scifi-ui/styles/formatx-event-horizon.css
          ! grep -Fq 'site-foreground-guard' docs/scifi-ui/index.html
          ! grep -Fq 'site-foreground-guard' docs/scifi-ui/scripts/site-art-direction.js
          test ! -e docs/scifi-ui/styles/site-foreground-guard.css

      - name: Commit final system and remove this installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/consolidate-visual-layers.yml
          git add docs/scifi-ui/index.html billing-worker/src/production-with-license.js
          git commit -m 'Finalize adaptive and conflict-free FormatX visual system'
          git push origin HEAD:master
