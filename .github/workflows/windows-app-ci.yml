name: FormatX Windows App CI

on:
  push:
    branches: [master]
    paths:
      - 'App.xaml'
      - 'App.xaml.cs'
      - 'MainWindow.xaml'
      - 'MainWindow.xaml.cs'
      - 'SignatureMagController.cs'
      - 'Controls/**'
      - 'Models/**'
      - 'Services/**'
      - 'Assets/**'
      - 'FormatX.csproj'
      - 'FormatX.sln'
      - 'tests/**'
      - '.github/workflows/windows-app-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'App.xaml'
      - 'App.xaml.cs'
      - 'MainWindow.xaml'
      - 'MainWindow.xaml.cs'
      - 'SignatureMagController.cs'
      - 'Controls/**'
      - 'Models/**'
      - 'Services/**'
      - 'Assets/**'
      - 'FormatX.csproj'
      - 'FormatX.sln'
      - 'tests/**'
      - '.github/workflows/windows-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: formatx-windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore update tests
        run: dotnet restore tests/FormatX.Update.Tests/FormatX.Update.Tests.csproj

      - name: Run update and MAG state tests
        run: dotnet test tests/FormatX.Update.Tests/FormatX.Update.Tests.csproj --configuration Release --no-restore

      - name: Restore Windows application
        run: dotnet restore FormatX.csproj -p:Platform=x64

      - name: Build Windows application
        run: dotnet build FormatX.csproj --configuration Release -p:Platform=x64 --no-restore

      - name: Publish Windows app status
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='WinUI app build and MAG/update tests passed'
          else
            state='failure'
            description='WinUI app build or MAG/update tests failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX Windows app build' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
