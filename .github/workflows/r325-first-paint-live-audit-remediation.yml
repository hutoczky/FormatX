name: One-shot mobile MAG optics r381

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/r325-first-paint-live-audit-remediation.yml'

permissions:
  contents: write

jobs:
  patch-mobile-mag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply targeted mobile shader softening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          shader = Path('docs/scifi-ui/scripts/formatx-crystal-organism-r326.js')
          text = shader.read_text(encoding='utf-8')
          replacements = [
              ("    innerHeartBase: '.105',", "    innerHeartBase: '.072',"),
              ("    innerHeartBreath: '.18',", "    innerHeartBreath: '.105',"),
              ("    innerHeartAlpha: '.09',", "    innerHeartAlpha: '.055',"),
              ("    innerAlphaMax: '.46',", "    innerAlphaMax: '.34',"),
              ("    rimBase: '.058',", "    rimBase: '.032',"),
              ("    rimEnergy: '.038',", "    rimEnergy: '.018',"),
              ("    rimAlpha: '.018',", "    rimAlpha: '.010',"),
              ("    outerHeartBase: '.026',", "    outerHeartBase: '.018',"),
              ("    outerHeartEnergy: '.034',", "    outerHeartEnergy: '.016',"),
              ("    facetStrength: '.13',", "    facetStrength: '.095',"),
              ("    sideStrength: '.16',", "    sideStrength: '.105',"),
              ("    outerAlphaBase: '.46',", "    outerAlphaBase: '.42',"),
              ("    outerAlphaKey: '.13',", "    outerAlphaKey: '.09',"),
              ("    outerAlphaMin: '.39',", "    outerAlphaMin: '.35',"),
              ("    outerAlphaMax: '.76'", "    outerAlphaMax: '.66'"),
              (
                  "      gl.blendFunc(gl.SRC_ALPHA,gl.ONE);\n      gl.uniform1f(uniforms.uLayer,1);",
                  "      gl.blendFunc(gl.SRC_ALPHA,mobile?gl.ONE_MINUS_SRC_ALPHA:gl.ONE);\n      gl.uniform1f(uniforms.uLayer,1);"
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          shader.write_text(text, encoding='utf-8')

          loaders = [
              Path('docs/scifi-ui/scripts/formatx-core-real3d-v20.js'),
              Path('docs/scifi-ui/scripts/formatx-core-mobile-v55.js'),
          ]
          for path in loaders:
              data = path.read_text(encoding='utf-8')
              old = 'formatx-crystal-organism-r326.js?v=20260828-r326-real-geometry'
              new = 'formatx-crystal-organism-r326.js?v=20260828-r381-mobile-soft-optics'
              if old not in data:
                  raise SystemExit(f'Missing crystal cache key in {path}')
              data = data.replace(old, new)
              if path.name == 'formatx-core-real3d-v20.js':
                  css_old = 'formatx-pure-3d-r285.css?v=20260821-r285-pure-webgl'
                  css_new = 'formatx-pure-3d-r285.css?v=20260828-r380-mobile-soft-optics'
                  if css_old in data:
                      data = data.replace(css_old, css_new)
              path.write_text(data, encoding='utf-8')

          Path('.github/workflows/apply-r381-mobile-mag-optics.yml').unlink(missing_ok=True)
          Path('.github/workflows/r325-first-paint-live-audit-remediation.yml').unlink(missing_ok=True)
          PY

          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-core-real3d-v20.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          git diff --check

      - name: Commit shader correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Tune mobile MAG shader for softer crystal optics'
          git push origin HEAD:master
