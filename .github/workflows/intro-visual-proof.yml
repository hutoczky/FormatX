name: FormatX R1724 Crystal Guardian visual proof
# R1490 visual proof: realistic DNA / solid organism / coherent obsidian crystal + full-page chamber

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/index.html'
      - 'docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js'
      - 'docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/styles/formatx-unified-background-r616.css'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
      - 'docs/scifi-ui/styles/formatx-mag-mobile-optics-r480.css'
      - 'docs/scifi-ui/scripts/three-r185.module.js'
      - '.github/scripts/capture-mag-intro-r656.cjs'
      - '.github/workflows/intro-visual-proof.yml'
  workflow_dispatch:

concurrency:
  group: formatx-mag-intro-visual-proof
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  intro-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual proof runtime
        run: npm install --no-save --no-package-lock playwright@1.62.0 playwright-core@1.62.0
      - name: Resolve Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Validate intro source
        run: |
          node --check docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          node --check .github/scripts/capture-mag-intro-r656.cjs
          grep -Fq "this.qualityScale=this.lowPowerProfile?.74:(this.mobileProfile?1.00:.96)" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "(this.mobileProfile?2.15:1.72)*this.qualityScale" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "production-r1722-no-softening" docs/scifi-ui/styles/formatx-core-life-r455.css
          grep -Fq "blur(0)" docs/scifi-ui/styles/formatx-core-life-r455.css
          ! grep -Fq "blur(.30px)" docs/scifi-ui/styles/formatx-core-life-r455.css
          grep -Fq "fxMagBirthVisualR1723='zero-robotic-shell-one-cortical-living-organism'" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "fxMagBirthContinuityR1723='organic-cells-tendrils-persist-through-10s-handoff'" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "if(t>3.00)this.updateCells(t,time)" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "this.mechanicalGroup.visible=false" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "fxIntroR1723='same-canonical-organism-birth-to-site-handoff'" docs/scifi-ui/scripts/formatx-mag-birth-live-r533.js
          grep -Fq "fxMagBirthGuardianR1724='faceted-pearl-cyan-crystal-organic-guardian'" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "fxMagBirthCoreR1724='biocrystal-cartilage-cyan-energy-warm-rim'" docs/scifi-ui/scripts/formatx-mag-genesis-three-r1360.js
          grep -Fq "fxNativeMagGuardianR1724='asymmetric-crystal-organic-feline-dragon-biocrystal-silhouette'" docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          grep -Fq "fxNativeMagFacetR1724='polished-crystal-planes-preserved-with-hybrid-normals'" docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          grep -Fq "revision:'r1724-formatx-crystal-guardian-birth'" docs/scifi-ui/scripts/formatx-mag-reference-film-r649.js
      - name: Start source site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4181 --directory docs > "$RUNNER_TEMP/intro-proof-http.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4181/scifi-ui/index.html >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/intro-proof-http.log"
          exit 1
      - name: Capture reference keyframes
        env:
          FORMATX_TEST_URL: http://127.0.0.1:4181/scifi-ui/index.html
          FORMATX_INTRO_KEYFRAME_DIR: artifacts/r1490-intro-keyframes
        run: node .github/scripts/capture-mag-intro-r656.cjs
      - name: Upload intro proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mag-intro-r1490-proof
          path: artifacts/r1490-intro-keyframes/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish intro visual proof status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='R1724 Crystal Guardian / HiDPI visual proof failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='R1724 Crystal Guardian / HiDPI mobile proof passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX R1724 Crystal Guardian proof' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
