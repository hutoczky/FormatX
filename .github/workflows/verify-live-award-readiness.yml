name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live SEO, hierarchy, proof, native Apex and scroll contract
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          AWARD_CSS="$RUNNER_TEMP/formatx-award-readiness.css"
          SEO_JS="$RUNNER_TEMP/formatx-seo.js"
          PARITY_JS="$RUNNER_TEMP/igloo-parity.js"
          APEX_JS="$RUNNER_TEMP/formatx-apex-native.js"
          FALLBACK_JS="$RUNNER_TEMP/formatx-three-host-safe.js"

          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
              "https://www.formatxsuite.com/?award_audit=${GITHUB_RUN_ID}-${attempt}" -o "$HOME_HTML"; then
              if grep -Fq 'data-fx-award-positioning="v2"' "$HOME_HTML" \
                && grep -Fq 'data-fx-hero-trustline' "$HOME_HTML" \
                && grep -Fq 'FormatX Suite Pro | Technikusi operációs réteg' "$HOME_HTML" \
                && grep -Fq '5 napos próbalicenc' "$HOME_HTML" \
                && grep -Fq 'Bazzite/Linux elsődleges' "$HOME_HTML" \
                && grep -Fq 'data-fx-award-proof' "$HOME_HTML" \
                && grep -Fq 'id="formatx-structured-data"' "$HOME_HTML" \
                && grep -Fq '"offers":{"@type":"Offer"' "$HOME_HTML" \
                && grep -Fq '"price":"7900"' "$HOME_HTML" \
                && grep -Fq 'formatx-award-readiness.css?v=20260808-award-readiness-2' "$HOME_HTML" \
                && grep -Fq 'formatx-infinite-scroll.js?v=20260808-seamless-v7-bootstrap-1' "$HOME_HTML"; then
                break
              fi
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Live homepage did not expose the complete award-tier + seamless-scroll contract.' >&2
              sed -n '1,200p' "$HOME_HTML" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            'https://www.formatxsuite.com/scifi-ui/styles/formatx-award-readiness.css?v=20260808-award-readiness-2' \
            -o "$AWARD_CSS"
          grep -Fq ':focus-visible' "$AWARD_CSS"
          grep -Fq 'min-block-size: 44px' "$AWARD_CSS"
          grep -Fq 'prefers-reduced-motion: reduce' "$AWARD_CSS"
          grep -Fq 'scroll-margin-top:' "$AWARD_CSS"
          grep -Fq '.fx-hero-trustline' "$AWARD_CSS"
          grep -Fq 'animation-timeline: view()' "$AWARD_CSS"
          grep -Fq 'text-wrap: pretty' "$AWARD_CSS"

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            'https://www.formatxsuite.com/scifi-ui/scripts/formatx-seo.js?v=award-v2-live' \
            -o "$SEO_JS"
          grep -Fq 'ready-v7' "$SEO_JS"
          grep -Fq 'canonicalizeSoftwareSchema' "$SEO_JS"
          grep -Fq "fxCanonicalSoftwareSchema='jsonld-only'" "$SEO_JS"

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            'https://www.formatxsuite.com/scifi-ui/scripts/igloo-parity.js?v=native-apex-live' \
            -o "$PARITY_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            'https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-native.js?v=native-apex-live' \
            -o "$APEX_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' \
            'https://www.formatxsuite.com/scifi-ui/scripts/formatx-three-host-safe.js?v=native-apex-live' \
            -o "$FALLBACK_JS"

          grep -Fq 'safe-ready-v28' "$PARITY_JS"
          grep -Fq 'formatx-apex-native.js?v=20260808-native-apex-1' "$PARITY_JS"
          grep -Fq 'formatx-three-host-safe.js?v=20260808-native-apex-fallback-1' "$PARITY_JS"
          grep -Fq 'prefers-reduced-motion: reduce' "$PARITY_JS"
          python3 - "$PARITY_JS" "$APEX_JS" "$FALLBACK_JS" <<'PY'
          import pathlib
          import sys

          parity = pathlib.Path(sys.argv[1]).read_text()
          apex = pathlib.Path(sys.argv[2]).read_text()
          fallback = pathlib.Path(sys.argv[3]).read_text()

          assert parity.index('formatx-apex-native.js') < parity.index('formatx-three-host-safe.js')
          for token in [
              "getContext('webgl2'",
              '#define MAX_STEPS',
              'float fbm(',
              'vec2 core(',
              'vec2 nerves(',
              'vec2 organs(',
              'vec2 commerce(',
              'vec2 skeleton(',
              'vec2 beacon(',
              'createFooterField',
              'createSoundscape',
              "fxScrollOwnership='seamless-v7'",
              "fxSectionSnap='disabled'",
              "fxInputInterception='none'",
          ]:
              assert token in apex, token
          assert 'scrollTo(' not in apex
          assert "addEventListener('wheel'" not in apex
          assert "addEventListener('touchmove'" not in apex
          assert "addEventListener('touchstart'" not in apex
          assert 'http://' not in apex and 'https://' not in apex
          assert "root.dataset.fxNativeApex === 'ready'" in fallback
          assert "root.dataset.fxThreeHost = 'native-apex'" in fallback
          assert 'fxThreeFallback' in fallback
          PY

          ! grep -Fqi 'Multiplatform nyilvános béta' "$HOME_HTML"
          ! grep -Fqi 'multiplatform public beta' "$HOME_HTML"

      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = 'success' ]; then
            state='success'
            description='Live award-tier + native Apex Igloo-floor + seamless-v7 verified'
          else
            state='failure'
            description='Live award-tier / native Apex contract verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live award readiness' \
            -f description="$description" \
            -f target_url="$TARGET_URL"
