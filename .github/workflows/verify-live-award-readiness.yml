name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate current award/source contracts
        run: |
          set -euo pipefail
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-v67.js
          node --check docs/scifi-ui/scripts/formatx-core-direct-interaction.js
      - name: Verify live reference-locked v67 MAG and scrolling
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'; TMP="$RUNNER_TEMP/formatx-award-current"; mkdir -p "$TMP"
          fetch(){ curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$ORIGIN$1" -o "$2"; }
          contains(){ grep -Fq "$2" "$3" || { echo "FAIL $1: missing $2"; exit 1; }; }
          fetch "/?award_current=${GITHUB_RUN_ID}" "$TMP/home.html"
          fetch "/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_RUN_ID}" "$TMP/bootstrap.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-v55.js?v=${GITHUB_RUN_ID}" "$TMP/mobile-wrapper.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-reference-v67.js?v=${GITHUB_RUN_ID}" "$TMP/mobile-v67.js"
          fetch "/scifi-ui/scripts/formatx-core-direct-interaction.js?v=${GITHUB_RUN_ID}" "$TMP/interaction.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll.js?v=${GITHUB_RUN_ID}" "$TMP/scroll.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js?v=${GITHUB_RUN_ID}" "$TMP/scroll-v7.js"
          fetch "/scifi-ui/data/scroll-policy.json?v=${GITHUB_RUN_ID}" "$TMP/policy.json"
          contains homepage 'FormatX Suite Pro' "$TMP/home.html"
          contains bootstrap 'single-webgl2-mobile-reference-locked-v67' "$TMP/bootstrap.js"
          contains wrapper 'formatx-core-mobile-reference-v67.js' "$TMP/mobile-wrapper.js"
          contains renderer 'reference-locked-native-webgl2-v67' "$TMP/mobile-v67.js"
          contains geometry 'reference-locked-organic-deep-concave-four-point-v67' "$TMP/mobile-v67.js"
          contains material 'multishell-translucent-fresnel-crystal-glass-v67' "$TMP/mobile-v67.js"
          contains reactor 'small-white-cyan-reactor-six-orbitals-v67' "$TMP/mobile-v67.js"
          contains fidelity 'native-webgl2-only-no-raster-no-svg-v67' "$TMP/mobile-v67.js"
          contains performance 'single-context-adaptive-60-plus-fps' "$TMP/mobile-v67.js"
          contains animation 'continuous-native-webgl2-living-motion-v67' "$TMP/mobile-v67.js"
          contains visual-interaction 'direct-touch-drag-burst-parallax-v67' "$TMP/mobile-v67.js"
          test "$(grep -Fo "getContext('webgl2'" "$TMP/mobile-v67.js" | wc -l)" -eq 1
          ! grep -Eq 'new[[:space:]]+Image|drawImage|createImageBitmap|THREE\\b|three\\.js' "$TMP/mobile-v67.js"
          contains seamless-runtime "const VERSION = 'seamless-v7'" "$TMP/scroll-v7.js"
          ! grep -Fq 'preventDefault' "$TMP/scroll.js"
          python3 - "$TMP/policy.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'));c=p.get('policy',{});m=p.get('mobile',{});d=p.get('desktop',{})
          checks={'input_capture':c.get('input_capture') is False,'section_scroll_snap':c.get('section_scroll_snap') is False,'native_wheel_touch':c.get('native_wheel_touch') is True,'mobile_controller':m.get('controller')=='seamless-v7','mobile_loop':m.get('automatic_loop') is True,'mobile_bridge':m.get('visual_bridge') is True,'mobile_no_content_clone':m.get('cloned_content') is False,'mobile_native_momentum':m.get('native_momentum_preserved') is True,'desktop_controller':d.get('controller')=='seamless-v7'}
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('FAIL current scroll policy: '+', '.join(failed))
          PY
      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Award/source + reference-locked native mobile v67 passed'; else state=failure; description='Award, production MAG or scrolling failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live award readiness' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
