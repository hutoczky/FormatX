name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live SEO, hierarchy, glass-dominant MAG, native Apex and scroll contract
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          AWARD_CSS="$RUNNER_TEMP/formatx-award-readiness.css"
          REFERENCE_BOOTSTRAP="$RUNNER_TEMP/formatx-reference-core-v26.js"
          CORE_BOOTSTRAP="$RUNNER_TEMP/formatx-core-real3d-v20.js"
          REFERENCE_MAG="$RUNNER_TEMP/formatx-reference-lock-v30.js"
          REFERENCE_CSS="$RUNNER_TEMP/formatx-reference-lock-v30.css"
          PARITY_JS="$RUNNER_TEMP/igloo-parity.js"
          APEX_JS="$RUNNER_TEMP/formatx-apex-native.js"
          FALLBACK_JS="$RUNNER_TEMP/formatx-three-host-safe.js"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/?award_audit=${GITHUB_RUN_ID}-${attempt}" -o "$HOME_HTML" \
              && grep -Fq 'data-fx-award-positioning="v2"' "$HOME_HTML" \
              && grep -Fq 'data-fx-hero-trustline' "$HOME_HTML" \
              && grep -Fq 'FormatX Suite Pro | Technikusi operációs réteg' "$HOME_HTML" \
              && grep -Fq '5 napos próbalicenc' "$HOME_HTML" \
              && grep -Fq 'Bazzite/Linux elsődleges' "$HOME_HTML" \
              && grep -Fq 'data-fx-award-proof' "$HOME_HTML" \
              && grep -Fq 'id="formatx-structured-data"' "$HOME_HTML" \
              && grep -Fq 'formatx-infinite-scroll.js?v=20260808-seamless-v7-bootstrap-1' "$HOME_HTML" \
              && grep -Fq 'formatx-core-real3d-v20.js?v=20260809-real3d-v24-volumetric-crystal-r3-moving-core-r11' "$HOME_HTML"; then break; fi
            if [ "$attempt" -eq 18 ]; then echo 'Live homepage did not expose the complete award/reference contract.' >&2; exit 1; fi
            sleep 5
          done
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/styles/formatx-award-readiness.css?v=award-live' -o "$AWARD_CSS"
          grep -Fq ':focus-visible' "$AWARD_CSS"
          grep -Fq 'min-block-size: 44px' "$AWARD_CSS"
          grep -Fq 'prefers-reduced-motion: reduce' "$AWARD_CSS"
          grep -Fq 'scroll-margin-top:' "$AWARD_CSS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-reference-core-v26.js?v=live-v30-authority' -o "$REFERENCE_BOOTSTRAP"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-real3d-v20.js?v=live-v30-bootstrap' -o "$CORE_BOOTSTRAP"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-reference-lock-v30.js?v=live-v30-mag-r4' -o "$REFERENCE_MAG"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/styles/formatx-reference-lock-v30.css?v=live-v30-mag-r4' -o "$REFERENCE_CSS"
          grep -Fq "const WEBGPU_PREVIEW = params.get('webgpu') === '1'" "$REFERENCE_BOOTSTRAP"
          grep -Fq "root.dataset.fxReferenceCore = 'production-v30-reference-lock-authority'" "$REFERENCE_BOOTSTRAP"
          grep -Fq "root.dataset.fxGpuPreference = 'webgl2-v30-uploaded-reference-production'" "$REFERENCE_BOOTSTRAP"
          grep -Fq "BOOTSTRAP='reference-lock-v30'" "$CORE_BOOTSTRAP"
          grep -Eq 'formatx-reference-lock-v30.js\?v=20260810-uploaded-reference-lock-[0-9]+' "$CORE_BOOTSTRAP"
          grep -Eq 'formatx-reference-lock-v30.css\?v=20260810-uploaded-reference-lock-[0-9]+' "$CORE_BOOTSTRAP"
          grep -Fq "const VERSION='v30-reference-lock'" "$REFERENCE_MAG"
          grep -Fq "fxCoreReferenceRevision='uploaded-reference-20260810'" "$REFERENCE_MAG"
          grep -Fq "fxCoreReferenceSurface='glass-dominant-sparse-veins-r4'" "$REFERENCE_MAG"
          grep -Fq 'for(const k of[2,4,6,8,10,R])' "$REFERENCE_MAG"
          grep -Fq 'Math.floor(A/12)' "$REFERENCE_MAG"
          grep -Fq 'mesh(shell,mul(B,sc(.998,.998,.998)),1,.30' "$REFERENCE_MAG"
          ! grep -Eq 'drawImage[[:space:]]*\(|new[[:space:]]+Image[[:space:]]*\(' "$REFERENCE_MAG"
          grep -Fq -- '--fx-core-x:50%' "$REFERENCE_CSS"
          grep -Fq 'perspective(560px) rotateX(63deg)' "$REFERENCE_CSS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/igloo-parity.js?v=native-apex-live' -o "$PARITY_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-native.js?v=native-apex-live' -o "$APEX_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-three-host-safe.js?v=native-apex-live' -o "$FALLBACK_JS"
          grep -Fq 'safe-ready-v28' "$PARITY_JS"
          grep -Fq "getContext('webgl2'" "$APEX_JS"
          grep -Fq "fxScrollOwnership='seamless-v7'" "$APEX_JS"
          grep -Fq "fxInputInterception='none'" "$APEX_JS"
          ! grep -Fq 'scrollTo(' "$APEX_JS"
          ! grep -Fq "addEventListener('wheel'" "$APEX_JS"
          grep -Fq "root.dataset.fxNativeApex === 'ready'" "$FALLBACK_JS"
          ! grep -Fqi 'Multiplatform nyilvános béta' "$HOME_HTML"
          ! grep -Fqi 'multiplatform public beta' "$HOME_HTML"
      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live award-tier + glass-dominant reference MAG r4 + native Apex verified'; else state=failure; description='Live award-tier / glass-dominant MAG / native Apex verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live award readiness' -f description="$description" -f target_url="$TARGET_URL"
