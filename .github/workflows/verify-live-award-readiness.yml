name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate current award/source contracts
        run: |
          set -euo pipefail
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node --check docs/scifi-ui/scripts/formatx-core-reference-v53.js
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-core-direct-interaction.js

      - name: Verify live current MAG, interaction and seamless-v7 scroll policy
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'
          TMP="$RUNNER_TEMP/formatx-award-current"
          mkdir -p "$TMP"

          fetch() {
            local path="$1" out="$2"
            echo "FETCH $path"
            curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$ORIGIN$path" -o "$out"
          }
          contains() {
            local label="$1" needle="$2" file="$3"
            echo "CHECK $label"
            grep -Fq "$needle" "$file" || { echo "FAIL $label: missing $needle"; exit 1; }
          }

          fetch "/?award_current=${GITHUB_RUN_ID}" "$TMP/home.html"
          fetch "/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_RUN_ID}" "$TMP/core-bootstrap.js"
          fetch "/scifi-ui/scripts/formatx-core-reference-v53.js?v=${GITHUB_RUN_ID}" "$TMP/core-v53.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-v55.js?v=${GITHUB_RUN_ID}" "$TMP/core-v55.js"
          fetch "/scifi-ui/scripts/formatx-core-direct-interaction.js?v=${GITHUB_RUN_ID}" "$TMP/direct-interaction.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll.js?v=${GITHUB_RUN_ID}" "$TMP/scroll.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js?v=${GITHUB_RUN_ID}" "$TMP/scroll-v7.js"
          fetch "/scifi-ui/data/scroll-policy.json?v=${GITHUB_RUN_ID}" "$TMP/scroll-policy.json"

          contains 'homepage' 'FormatX Suite Pro' "$TMP/home.html"
          contains 'MAG bootstrap reference' 'formatx-core-real3d-v20.js' "$TMP/home.html"
          contains 'v53 bootstrap' 'reference-crystal-core-v53' "$TMP/core-bootstrap.js"
          contains 'desktop v53 renderer' 'single-webgl2-reference-crystal-v53' "$TMP/core-v53.js"
          contains 'mobile v55 renderer' 'single-webgl2-mobile-cinematic-crystal-v55' "$TMP/core-v55.js"
          contains 'desktop direct interaction r5' 'direct-desktop-pointer-energy-r5-living-system' "$TMP/direct-interaction.js"
          contains 'mobile direct interaction r4' 'direct-pointer-touch-drag-r4-living-system' "$TMP/direct-interaction.js"
          contains 'mobile seamless bootstrap' 'mobile-seamless-loading-v1' "$TMP/scroll.js"
          contains 'seamless runtime v7' "const VERSION = 'seamless-v7'" "$TMP/scroll-v7.js"
          ! grep -Fq 'preventDefault' "$TMP/scroll.js"
          ! grep -Fq 'scrollTo(' "$TMP/scroll.js"
          ! grep -Fq 'scrollIntoView(' "$TMP/scroll.js"
          ! grep -Fq 'cloneNode(' "$TMP/scroll.js"

          python3 - "$TMP/scroll-policy.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          common=p.get('policy',{})
          m=p.get('mobile',{})
          d=p.get('desktop',{})
          checks={
            'input_capture': common.get('input_capture') is False,
            'section_scroll_snap': common.get('section_scroll_snap') is False,
            'native_wheel_touch': common.get('native_wheel_touch') is True,
            'mobile_controller': m.get('controller') == 'seamless-v7',
            'mobile_loop': m.get('automatic_loop') is True,
            'mobile_bridge': m.get('visual_bridge') is True,
            'mobile_no_content_clone': m.get('cloned_content') is False,
            'mobile_hero_clone_only': m.get('cloned_hero_only') is True,
            'mobile_boundary_handoff': m.get('boundary_handoff_only') is True,
            'mobile_native_momentum': m.get('native_momentum_preserved') is True,
            'mobile_infinite': m.get('finite_document') is False,
            'desktop_controller': d.get('controller') == 'seamless-v7',
            'desktop_loop': d.get('automatic_loop') is True,
            'desktop_bridge': d.get('visual_bridge') is True,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('FAIL current scroll policy: '+', '.join(failed))
          print('PASS: current shared seamless-v7 mobile/desktop policy is live.')
          PY

      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Award/source, v53-v55 MAG interaction and seamless-v7 policy passed'; else state=failure; description='Award, MAG interaction or seamless-v7 policy failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live award readiness' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
