name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
permissions:
  contents: read
  statuses: write
jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate current award/source contracts
        run: |
          set -euo pipefail
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node .github/scripts/validate-real3d-core.cjs
          node .github/scripts/validate-reference-core-v26.cjs
          node --check docs/scifi-ui/scripts/formatx-core-mobile-reference-r99.js
          node --check docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          test -s docs/scifi-ui/styles/formatx-award-material-r99.css
          grep -Fq 'single-webgl-luminous-crystal-r99' docs/scifi-ui/styles/formatx-award-material-r99.css
          ! grep -Fq 'repeating-conic-gradient' docs/scifi-ui/styles/formatx-award-material-r99.css
      - name: Verify live r120 prismatic crystalline MAG, optical atmosphere, layout and scrolling
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'; TMP="$RUNNER_TEMP/formatx-award-current"; mkdir -p "$TMP"
          fetch(){ curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$ORIGIN$1" -o "$2"; }
          contains(){ grep -Fq "$2" "$3" || { echo "FAIL $1: missing $2"; exit 1; }; }
          fetch "/?award_current=${GITHUB_RUN_ID}" "$TMP/home.html"
          fetch "/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_RUN_ID}" "$TMP/bootstrap.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-v55.js?v=${GITHUB_RUN_ID}" "$TMP/mobile-wrapper.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-reference-r99.js?v=${GITHUB_RUN_ID}" "$TMP/mobile-r99.js"
          fetch "/scifi-ui/scripts/formatx-core-touch-pulse-r99.js?v=${GITHUB_RUN_ID}" "$TMP/touch-r99.js"
          fetch "/scifi-ui/styles/formatx-award-material-r99.css?v=${GITHUB_RUN_ID}" "$TMP/material-r99.css"
          fetch "/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js?v=${GITHUB_RUN_ID}" "$TMP/layout.js"
          fetch "/scifi-ui/styles/formatx-mobile-reference-layout-v1.css?v=${GITHUB_RUN_ID}" "$TMP/layout.css"
          fetch "/scifi-ui/styles/formatx-award-material-r91.css?v=${GITHUB_RUN_ID}" "$TMP/material.css"
          fetch "/scifi-ui/styles/formatx-responsive-text-guard-r72.css?v=${GITHUB_RUN_ID}" "$TMP/text-guard.css"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll.js?v=${GITHUB_RUN_ID}" "$TMP/scroll.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js?v=${GITHUB_RUN_ID}" "$TMP/scroll-v7.js"
          fetch "/scifi-ui/data/scroll-policy.json?v=${GITHUB_RUN_ID}" "$TMP/policy.json"
          contains homepage 'FormatX Suite Pro' "$TMP/home.html"
          contains asset-base '<base href="/scifi-ui/">' "$TMP/home.html"
          contains bootstrap 'responsive-cinematic-reference-v69-r99-luminous-interactive' "$TMP/bootstrap.js"
          contains bootstrap-renderer 'single-webgl-luminous-crystal-r99' "$TMP/bootstrap.js"
          contains optical-loader 'formatx-award-material-r99.css?v=20260814-cinematic-atmosphere-r99' "$TMP/bootstrap.js"
          contains touch-loader 'formatx-core-touch-pulse-r99.js?v=20260814-wake-safe-r99' "$TMP/bootstrap.js"
          contains wrapper 'formatx-core-mobile-reference-r99.js?v=20260814-luminous-cinematic-r99' "$TMP/mobile-wrapper.js"
          contains renderer-version 'reference-luminous-crystal-webgl-r99-prismatic-r120' "$TMP/mobile-r99.js"
          contains renderer 'single-webgl-luminous-crystal-r99' "$TMP/mobile-r99.js"
          contains geometry 'reference-deep-concave-four-point-size-lock-r99' "$TMP/mobile-r99.js"
          contains material 'luminous-faceted-iceglass-caustic-r99' "$TMP/mobile-r99.js"
          contains interaction 'touch-pointer-breathing-spectral-refraction-r99' "$TMP/mobile-r99.js"
          contains interaction-event 'formatx:coreinteraction' "$TMP/mobile-r99.js"
          contains pointer-move 'pointermove' "$TMP/mobile-r99.js"
          contains pointer-down 'pointerdown' "$TMP/mobile-r99.js"
          contains touch-start 'touchstart' "$TMP/mobile-r99.js"
          contains touch-move 'touchmove' "$TMP/mobile-r99.js"
          contains touch-end 'touchend' "$TMP/mobile-r99.js"
          contains touch-wake 'formatx:referencepause' "$TMP/touch-r99.js"
          contains touch-pulse 'FormatXCoreMobileV69?.pulse' "$TMP/touch-r99.js"
          contains webgl2 "getContext('webgl2'" "$TMP/mobile-r99.js"
          contains webgl-fallback "getContext('webgl'" "$TMP/mobile-r99.js"
          contains draw 'TRIANGLE_STRIP' "$TMP/mobile-r99.js"
          contains visible-frame-gate 'visible-native-3d-r99' "$TMP/mobile-r99.js"
          contains pixel-budget '720000' "$TMP/mobile-r99.js"
          contains crystal-fracture 'frac' "$TMP/mobile-r99.js"
          contains crystal-caustics 'caustic' "$TMP/mobile-r99.js"
          contains reactor-rings 'rings' "$TMP/mobile-r99.js"
          contains r120-material-lock 'prismatic-organic-glass' "$TMP/mobile-r99.js"
          ! grep -Eq 'new[[:space:]]+Image|drawImage|createImageBitmap|THREE\\.|three\\.js|babylon|playcanvas|model-viewer' "$TMP/mobile-r99.js"
          contains optical-scope 'single-webgl-luminous-crystal-r99' "$TMP/material-r99.css"
          contains optical-highlight 'brightness(1.09)' "$TMP/material-r99.css"
          contains optical-saturation 'saturate(1.72)' "$TMP/material-r99.css"
          contains optical-violet 'drop-shadow(0 0 38px rgba(158,58,255,.22))' "$TMP/material-r99.css"
          ! grep -Fq 'repeating-conic-gradient' "$TMP/material-r99.css"
          contains proof 'PUBLIC PROOF LAYER' "$TMP/layout.js"
          contains ask 'KÉRDEZZ' "$TMP/layout.js"
          contains mobile-unpaused 'let paused=mobileViewport()?false:' "$TMP/layout.js"
          contains proof-style '.fx-reference-proof' "$TMP/layout.css"
          contains crystal-style 'fx-core-rayglass-r91-stage' "$TMP/material.css"
          contains hero-wrap 'max-width: 620px !important' "$TMP/text-guard.css"
          contains normal-wrap 'white-space: normal !important' "$TMP/text-guard.css"
          contains proof-reserve 'padding-right: clamp(88px, 24vw, 104px) !important' "$TMP/text-guard.css"
          contains seamless-runtime "const VERSION = 'seamless-v7'" "$TMP/scroll-v7.js"
          ! grep -Fq 'preventDefault' "$TMP/scroll.js"
          python3 - "$TMP/policy.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'));c=p.get('policy',{});m=p.get('mobile',{});d=p.get('desktop',{})
          checks={'input_capture':c.get('input_capture') is False,'section_scroll_snap':c.get('section_scroll_snap') is False,'native_wheel_touch':c.get('native_wheel_touch') is True,'mobile_controller':m.get('controller')=='seamless-v7','mobile_loop':m.get('automatic_loop') is True,'mobile_bridge':m.get('visual_bridge') is True,'mobile_no_content_clone':m.get('cloned_content') is False,'mobile_native_momentum':m.get('native_momentum_preserved') is True,'desktop_controller':d.get('controller')=='seamless-v7'}
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('FAIL current scroll policy: '+', '.join(failed))
          PY
      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Award/source + live r120 prismatic crystal, touch bridge and optical atmosphere passed'; else state=failure; description='Award, production r120 MAG, touch bridge, optical atmosphere or scrolling failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live award readiness' -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
