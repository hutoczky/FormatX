name: Verify FormatX live award readiness
run-name: Live award-readiness audit for current r267/r268/r418 production

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-award-readiness.yml'
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-award-readiness:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate current award/source contracts
        run: |
          set -euo pipefail
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-real3d-mobile-startup-v22.cjs
          node .github/scripts/validate-real3d-core-v20.cjs
          node .github/scripts/validate-real3d-core.cjs
          node .github/scripts/validate-reference-core-v26.cjs
          node --check docs/scifi-ui/scripts/formatx-core-mobile-v55.js
          node --check docs/scifi-ui/scripts/formatx-crystal-portal-r318.js
          node --check docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          node --check docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          node --check docs/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js
          test -s docs/scifi-ui/styles/formatx-core-true-volume-r267.css
          test -s docs/scifi-ui/styles/formatx-mobile-header-final-r418.css
          grep -Fq 'formatx-core-true-volume-r267.css?v=20260829-r268-softened-mobile-optics' docs/scifi-ui/scripts/formatx-crystal-portal-r318.js
          grep -Fq "renderer:'closed-volume-r267'" docs/scifi-ui/scripts/formatx-crystal-portal-r318.js
          grep -Fq "VERSION='r267-closed-volume-crystal'" docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -Fq 'closed-front-back-sidewalls' docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -Fq 'physical-z-depth-r267' docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -Fq 'gl.enable(gl.DEPTH_TEST)' docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -Fq 'gl.depthFunc(gl.LEQUAL)' docs/scifi-ui/scripts/formatx-core-true-volume-r267.js
          grep -Fq 'r268-mobile-optics-softened-bloom-and-rim' docs/scifi-ui/styles/formatx-core-true-volume-r267.css
          grep -Fq 'brightness(.94) contrast(.87) saturate(.96) blur(.26px)' docs/scifi-ui/styles/formatx-core-true-volume-r267.css
          grep -Fq 'brightness(.92) contrast(.85) saturate(.95) blur(.32px)' docs/scifi-ui/styles/formatx-core-true-volume-r267.css
          grep -Fq 'production-r418-final-mobile-header-owner' docs/scifi-ui/styles/formatx-mobile-header-final-r418.css
          grep -Fq 'production-r418-final-mobile-header-owner-non-occluding' docs/scifi-ui/styles/formatx-mobile-header-final-r418.css
          grep -Fq "const VERSION='touch-pulse-r417-ui-safe'" docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -Fq 'formatx:coreinteraction' docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -Fq 'drag-inertia-webgl-ui-guard-r417' docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          grep -Fq 'fxCoreTouchUiGuardR417' docs/scifi-ui/scripts/formatx-core-touch-pulse-r99.js
          ! grep -Eq 'new[[:space:]]+Image|drawImage|createImageBitmap|THREE\.|three\.js|babylon|playcanvas|model-viewer' docs/scifi-ui/scripts/formatx-core-true-volume-r267.js

      - name: Verify live r267 WebGL volume, r268 optics, r418 header, r417 touch and scrolling
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'
          TMP="$RUNNER_TEMP/formatx-award-current"
          mkdir -p "$TMP"
          fetch(){ curl -fsSL --retry 3 --retry-delay 1 -H 'Cache-Control: no-cache' "$ORIGIN$1" -o "$2"; }
          contains(){ grep -Fq "$2" "$3" || { echo "FAIL $1: missing $2"; exit 1; }; }

          fetch "/?award_current=${GITHUB_RUN_ID}" "$TMP/home.html"
          fetch "/scifi-ui/scripts/formatx-core-real3d-v20.js?v=${GITHUB_RUN_ID}" "$TMP/bootstrap.js"
          fetch "/scifi-ui/scripts/formatx-core-mobile-v55.js?v=${GITHUB_RUN_ID}" "$TMP/mobile-wrapper.js"
          fetch "/scifi-ui/scripts/formatx-crystal-portal-r318.js?v=${GITHUB_RUN_ID}" "$TMP/portal.js"
          fetch "/scifi-ui/scripts/formatx-core-true-volume-r267.js?v=${GITHUB_RUN_ID}" "$TMP/volume.js"
          fetch "/scifi-ui/styles/formatx-core-true-volume-r267.css?v=${GITHUB_RUN_ID}" "$TMP/volume.css"
          fetch "/scifi-ui/styles/formatx-mobile-header-final-r418.css?v=${GITHUB_RUN_ID}" "$TMP/header.css"
          fetch "/scifi-ui/scripts/formatx-core-touch-pulse-r99.js?v=${GITHUB_RUN_ID}" "$TMP/touch.js"
          fetch "/scifi-ui/scripts/formatx-mobile-reference-layout-v1.js?v=${GITHUB_RUN_ID}" "$TMP/layout.js"
          fetch "/scifi-ui/scripts/formatx-infinite-scroll-desktop-v7.js?v=${GITHUB_RUN_ID}" "$TMP/scroll-v7.js"
          fetch "/scifi-ui/data/scroll-policy.json?v=${GITHUB_RUN_ID}" "$TMP/policy.json"

          contains homepage 'FormatX Suite Pro' "$TMP/home.html"
          contains asset-base '<base href="/scifi-ui/">' "$TMP/home.html"
          contains bootstrap 'native-mechanical-orb-r250-no-2d-mag-layers' "$TMP/bootstrap.js"
          contains bootstrap-wrapper 'formatx-core-mobile-v55.js?v=20260828-r382-balanced-soft-optics' "$TMP/bootstrap.js"
          contains bootstrap-cleanup 'cleanupLegacy2d' "$TMP/bootstrap.js"

          contains wrapper-primary 'formatx-crystal-organism-r326.js?v=20260828-r416-site-coupled-soft-optics' "$TMP/mobile-wrapper.js"
          contains wrapper-optics-revision 'r418-restrained-soft-mag-attached-header' "$TMP/mobile-wrapper.js"
          contains wrapper-header 'formatx-mobile-header-final-r418.css?v=20260828-r418-final-owner' "$TMP/mobile-wrapper.js"
          contains wrapper-selection 'new-crystal-organism-r326-primary' "$TMP/mobile-wrapper.js"
          contains wrapper-composition 'new-organism-no-legacy-visual-fallback' "$TMP/mobile-wrapper.js"

          contains portal-style 'formatx-core-true-volume-r267.css?v=20260829-r268-softened-mobile-optics' "$TMP/portal.js"
          contains portal-renderer "renderer:'closed-volume-r267'" "$TMP/portal.js"
          contains portal-request "fxCrystalRendererRequest='closed-volume-r267'" "$TMP/portal.js"

          contains volume-version "VERSION='r267-closed-volume-crystal'" "$TMP/volume.js"
          contains volume-geometry 'closed-front-back-sidewalls' "$TMP/volume.js"
          contains volume-depth 'physical-z-depth-r267' "$TMP/volume.js"
          contains volume-depth-test 'gl.enable(gl.DEPTH_TEST)' "$TMP/volume.js"
          contains volume-depth-func 'gl.depthFunc(gl.LEQUAL)' "$TMP/volume.js"
          contains volume-triangles 'gl.drawArrays(gl.TRIANGLES,0,mesh.count)' "$TMP/volume.js"
          contains volume-scheduler 'event-driven-no-idle-raf' "$TMP/volume.js"
          ! grep -Eq 'new[[:space:]]+Image|drawImage|createImageBitmap|THREE\.|three\.js|babylon|playcanvas|model-viewer' "$TMP/volume.js"

          contains optics-version 'r268-mobile-optics-softened-bloom-and-rim' "$TMP/volume.css"
          contains optics-mobile 'brightness(.94) contrast(.87) saturate(.96) blur(.26px)' "$TMP/volume.css"
          contains optics-narrow 'brightness(.92) contrast(.85) saturate(.95) blur(.32px)' "$TMP/volume.css"
          contains optics-narrow-query '@media (max-width: 430px)' "$TMP/volume.css"

          contains header-owner 'production-r418-final-mobile-header-owner' "$TMP/header.css"
          contains header-nonoccluding 'production-r418-final-mobile-header-owner-non-occluding' "$TMP/header.css"
          ! grep -Eq '\.topbar[[:space:]]*\{[^}]*position:sticky!important' "$TMP/header.css"

          contains touch-version "const VERSION='touch-pulse-r417-ui-safe'" "$TMP/touch.js"
          contains touch-core-event 'formatx:coreinteraction' "$TMP/touch.js"
          contains touch-physics 'drag-inertia-webgl-ui-guard-r417' "$TMP/touch.js"
          contains touch-ui-guard 'fxCoreTouchUiGuardR417' "$TMP/touch.js"
          contains proof 'PUBLIC PROOF LAYER' "$TMP/layout.js"
          contains ask 'KÉRDEZZ' "$TMP/layout.js"
          contains seamless-runtime "const VERSION = 'seamless-v7'" "$TMP/scroll-v7.js"

          python3 - "$TMP/policy.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          c=p.get('policy',{});m=p.get('mobile',{});d=p.get('desktop',{})
          checks={
            'input_capture':c.get('input_capture') is False,
            'section_scroll_snap':c.get('section_scroll_snap') is False,
            'native_wheel_touch':c.get('native_wheel_touch') is True,
            'mobile_controller':m.get('controller')=='seamless-v7',
            'mobile_loop':m.get('automatic_loop') is True,
            'mobile_bridge':m.get('visual_bridge') is True,
            'mobile_no_content_clone':m.get('cloned_content') is False,
            'mobile_native_momentum':m.get('native_momentum_preserved') is True,
            'desktop_controller':d.get('controller')=='seamless-v7'
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('FAIL current scroll policy: '+', '.join(failed))
          PY

      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Award/source + live r267 volume, r268 optics, r418 header, r417 touch and scrolling passed'
          else
            state=failure
            description='Award, live r267/r268 MAG, header, touch or scrolling failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context='FormatX live award readiness' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
