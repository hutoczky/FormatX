name: Verify live R454 award readiness
run-name: R454 live award audit for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  push:
    branches: [master]
    paths:
      - 'docs/scifi-ui/**'
      - 'billing-worker/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/scripts/validate-living-core-r425-source.cjs'
      - '.github/workflows/verify-live-award-readiness.yml'
  workflow_run:
    workflows: ['Prepare or deploy FormatX production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: r454-live-award-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  live-award:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '[deploy-production]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDITED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ORIGIN: https://formatxsuite.com
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDITED_SHA }}

      - name: Validate R454 source contracts
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-living-core-r425-source.cjs
          node .github/scripts/validate-real3d-core.cjs
          node --check docs/scifi-ui/scripts/formatx-crystal-organism-r326.js
          node --check docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js
          node --check docs/scifi-ui/scripts/formatx-native-mag-touch-r434.js
          node --check docs/scifi-ui/scripts/formatx-mobile-render-governor-r426.js

      - name: Wait for R454 production and verify one native MAG owner
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/?audit=$stamp" -o "$tmp/home.html" || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/scripts/formatx-crystal-organism-r326.js?audit=$stamp" -o "$tmp/core.js" || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/scripts/formatx-current-mag-loader-r422.js?audit=$stamp" -o "$tmp/loader.js" || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/styles/formatx-core-shapeshifter-r337.css?audit=$stamp" -o "$tmp/optics.css" || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/styles/formatx-current-mag-r422.css?audit=$stamp" -o "$tmp/layout.css" || true
            if grep -Fq 'living-luminous-electric-crystal-r454' "$tmp/core.js" \
              && grep -Fq 'intermittent-native-electric-filament-every-five-to-six-seconds' "$tmp/core.js" \
              && grep -Fq 'direct-r326-r454-style-first-visible-electric-idle-zero' "$tmp/loader.js" \
              && grep -Fq 'production-r454-single-native-webgl-optics-owner-visible-no-overlay' "$tmp/optics.css" \
              && grep -Fq 'production-r454-direct-r326-layout-a11y-touch-no-painted-mag-layer' "$tmp/layout.css"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1
          grep -Fq 'uSurfacePulse' "$tmp/core.js"
          grep -Fq 'surfaceFilament' "$tmp/core.js"
          grep -Fq 'brightness(1.52)' "$tmp/optics.css"
          grep -Fq 'contrast(1.16)' "$tmp/optics.css"
          grep -Fq 'saturate(1.58)' "$tmp/optics.css"
          ! grep -Fq 'blur(' "$tmp/optics.css"
          ! grep -Fq 'formatx-mag-surface-sheen-r439.js' "$tmp/home.html"
          ! grep -Fq 'formatx-mag-surface-sheen-r439.js' "$tmp/loader.js"
          ! grep -Eq 'formatx-(crystal-portal-r318|quantum-particles-r335|core-mechanical-orb-r250)' "$tmp/home.html"

      - name: Publish live award status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          state=failure
          description='R454 live award audit failed'
          if [[ "$RESULT" == success ]]; then
            state=success
            description='R454 native MAG, visibility and energy contracts passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$AUDITED_SHA" \
            -f state="$state" \
            -f context='FormatX R454 live award readiness' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
