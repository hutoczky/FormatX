name: Verify FormatX live award readiness
run-name: Live award-readiness audit for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-award-readiness:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live SEO, hierarchy, v51 reference crystal, native Apex and scroll contract
        shell: bash
        run: |
          set -euo pipefail
          HOME_HTML="$RUNNER_TEMP/formatx-home.html"
          AWARD_CSS="$RUNNER_TEMP/formatx-award-readiness.css"
          REFERENCE_BOOTSTRAP="$RUNNER_TEMP/formatx-reference-core-v26.js"
          CORE_BOOTSTRAP="$RUNNER_TEMP/formatx-core-real3d-v20.js"
          CORE_RUNTIME="$RUNNER_TEMP/formatx-core-v51.js"
          CORE_CSS="$RUNNER_TEMP/formatx-core-v51.css"
          PARITY_JS="$RUNNER_TEMP/igloo-parity.js"
          APEX_JS="$RUNNER_TEMP/formatx-apex-native.js"
          FALLBACK_JS="$RUNNER_TEMP/formatx-three-host-safe.js"

          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://www.formatxsuite.com/?award_audit=${GITHUB_RUN_ID}-${attempt}" -o "$HOME_HTML" \
              && grep -Fq 'data-fx-award-positioning="v2"' "$HOME_HTML" \
              && grep -Fq 'data-fx-hero-trustline' "$HOME_HTML" \
              && grep -Fq 'FormatX Suite Pro | Technikusi operációs réteg' "$HOME_HTML" \
              && grep -Fq '5 napos próbalicenc' "$HOME_HTML" \
              && grep -Fq 'Bazzite/Linux elsődleges' "$HOME_HTML" \
              && grep -Fq 'data-fx-award-proof' "$HOME_HTML" \
              && grep -Fq 'id="formatx-structured-data"' "$HOME_HTML" \
              && grep -Fq 'formatx-core-real3d-v20.js' "$HOME_HTML"; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then echo 'Live homepage did not expose the complete award/core contract.' >&2; exit 1; fi
            sleep 5
          done

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/styles/formatx-award-readiness.css?v=award-live-v51' -o "$AWARD_CSS"
          grep -Fq ':focus-visible' "$AWARD_CSS"
          grep -Fq 'min-block-size: 44px' "$AWARD_CSS"
          grep -Fq 'prefers-reduced-motion: reduce' "$AWARD_CSS"

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-reference-core-v26.js?v=live-v51-authority' -o "$REFERENCE_BOOTSTRAP"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-real3d-v20.js?v=live-v51-bootstrap' -o "$CORE_BOOTSTRAP"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-core-v51.js?v=live-v51-runtime' -o "$CORE_RUNTIME"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/styles/formatx-core-v51.css?v=live-v51-style' -o "$CORE_CSS"

          grep -Fq "const WEBGPU_PREVIEW = params.get('webgpu') === '1'" "$REFERENCE_BOOTSTRAP"
          grep -Fq "root.dataset.fxReferenceCore = 'production-v51-reference-crystal-authority'" "$REFERENCE_BOOTSTRAP"
          grep -Fq "const BOOTSTRAP = 'reference-crystal-core-v51'" "$CORE_BOOTSTRAP"
          grep -Fq 'formatx-core-v51.js?v=20260810-reference-crystal-v51-1' "$CORE_BOOTSTRAP"
          grep -Fq "const VERSION = 'v51-reference-crystal-core'" "$CORE_RUNTIME"
          grep -Fq 'sharp-four-tip-concave-crystal-v51' "$CORE_RUNTIME"
          grep -Fq 'layered-faceted-refractive-glass-v51' "$CORE_RUNTIME"
          grep -Fq 'moving-white-nucleus-concentric-spectral-rings-v51' "$CORE_RUNTIME"
          grep -Fq 'single-context-adaptive-60-plus-fps' "$CORE_RUNTIME"
          grep -Fq 'function crystal(' "$CORE_RUNTIME"
          grep -Fq 'function starRadius(' "$CORE_RUNTIME"
          ! grep -Eq 'drawImage[[:space:]]*\(|new[[:space:]]+Image[[:space:]]*\(' "$CORE_RUNTIME"
          grep -Fq -- '--fx-core-x: 50%' "$CORE_CSS"
          ! grep -Fq 'clip-path: polygon' "$CORE_CSS"

          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/igloo-parity.js?v=native-apex-live' -o "$PARITY_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-apex-native.js?v=native-apex-live' -o "$APEX_JS"
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' 'https://www.formatxsuite.com/scifi-ui/scripts/formatx-three-host-safe.js?v=native-apex-live' -o "$FALLBACK_JS"
          grep -Fq 'safe-ready-v28' "$PARITY_JS"
          grep -Fq "fxScrollOwnership='seamless-v7'" "$APEX_JS"
          grep -Fq "fxInputInterception='none'" "$APEX_JS"
          ! grep -Fq 'scrollTo(' "$APEX_JS"
          grep -Fq "root.dataset.fxNativeApex === 'ready'" "$FALLBACK_JS"

      - name: Publish live award-readiness status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live award-tier + reference crystal v51 + native Apex verified'; else state=failure; description='Live award-tier / v51 core / native Apex verification failed'; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context='FormatX live award readiness' -f description="$description" -f target_url="$TARGET_URL"
