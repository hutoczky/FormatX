name: One-shot publish r165 hero-space atmosphere bridge
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-shot-r165-space-atmosphere-bridge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Add continuous atmosphere below mobile MAG carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          css=Path('docs/scifi-ui/styles/formatx-seamless-living-r158.css')
          s=css.read_text()
          marker='/* r165: continue the MAG atmosphere below hero-space; no hard carrier edge. */'
          rule='''\n\n@media (max-width:900px),(pointer:coarse){\n  /* r165: continue the MAG atmosphere below hero-space; no hard carrier edge. */\n  html[data-fx-mobile-reference-layout="ready-v1"] body.living-architecture #hero .hero-space::after{\n    content:""!important;\n    display:block!important;\n    position:absolute!important;\n    left:0!important;\n    right:0!important;\n    top:100%!important;\n    height:72px!important;\n    z-index:0!important;\n    pointer-events:none!important;\n    background:linear-gradient(180deg,#010610 0%,#010817 20%,#020a1b 44%,#030c1d 70%,#040d1e 100%)!important;\n    border:0!important;\n    box-shadow:none!important;\n    opacity:1!important;\n  }\n}\n'''
          if marker not in s:s+=rule
          css.write_text(s)

          heartbeat=Path('docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js')
          h=heartbeat.read_text()
          h,n=re.subn(
              r"const SEAMLESS='/scifi-ui/styles/formatx-seamless-living-r158\.css\?v=[^']+';",
              "const SEAMLESS='/scifi-ui/styles/formatx-seamless-living-r158.css?v=20260815-r165-space-atmosphere-bridge';",
              h,count=1
          )
          if n!=1 and '20260815-r165-space-atmosphere-bridge' not in h:raise SystemExit('heartbeat seamless loader token not found')
          heartbeat.write_text(h)

          index=Path('docs/scifi-ui/index.html')
          i=index.read_text()
          i,n=re.subn(
              r'(formatx-live-heartbeat-r155\.js\?v=20260815-r158-lubdub-seamless&rev=)[^"\']+',
              r'\g<1>20260815-r165-space-atmosphere-bridge',i,count=1
          )
          if n!=1:raise SystemExit('heartbeat script cache URL not found')
          index.write_text(i)
          PY

          node --check docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js
          node .github/scripts/validate-real3d-core.cjs
          grep -F 'r165: continue the MAG atmosphere below hero-space' docs/scifi-ui/styles/formatx-seamless-living-r158.css >/dev/null
          grep -F 'formatx-seamless-living-r158.css?v=20260815-r165-space-atmosphere-bridge' docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js >/dev/null
          grep -F 'rev=20260815-r165-space-atmosphere-bridge' docs/scifi-ui/index.html >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scifi-ui/styles/formatx-seamless-living-r158.css docs/scifi-ui/scripts/formatx-live-heartbeat-r155.js docs/scifi-ui/index.html
          if git diff --cached --quiet; then echo 'r165 already current'; exit 0; fi
          git commit -m '[deploy-production] fix(mag): publish r165 hero-space atmosphere bridge'
          git push origin HEAD:master
