name: Verify r148 spectacular MAG
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-r148-spectacular-mag.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r148" && cd "$RUNNER_TEMP/r148"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Verify live r148b reactor, interaction and hidden legacy copy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r148"
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({viewport:{width:412,height:760},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU'});
            await context.addInitScript(()=>{
              class MockDeviceOrientationEvent extends Event{
                constructor(type,init={}){super(type);this.alpha=Number(init.alpha||0);this.beta=Number(init.beta||0);this.gamma=Number(init.gamma||0);this.absolute=Boolean(init.absolute);}
              }
              try{Object.defineProperty(window,'DeviceOrientationEvent',{value:MockDeviceOrientationEvent,configurable:true});}catch(_){ }
            });
            const page=await context.newPage();
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto(`https://formatxsuite.com/?verify_r148b=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>{
              const d=document.documentElement.dataset;
              return String(d.fxLiveMotionR147||'').includes('r148')&&
                     d.fxLiveMotionLayerR147==='mounted-r148'&&
                     d.fxLiveMotionVisualR148==='reactor-prism-shock-orbits'&&
                     d.fxLiveLegacyCopyR148==='visually-removed'&&
                     d.fxLiveSafeLaneR147==='active-r148';
            },null,{timeout:45000});
            await page.waitForTimeout(650);

            const frameA=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            await page.waitForTimeout(850);
            const frameB=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            assert.ok(frameA.length>10&&frameB.length>10,'r148 frame telemetry missing');
            assert.notEqual(frameA,frameB,'idle reactor animation is not changing');

            const state=await page.evaluate(()=>{
              const root=document.documentElement,hero=document.getElementById('hero');
              const q=s=>{const e=document.querySelector(s),r=e?.getBoundingClientRect(),c=e?getComputedStyle(e):null;return e&&r&&c?{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),display:c.display,visibility:c.visibility,opacity:c.opacity,filter:c.filter,clip:c.clip,clipPath:c.clipPath}:null};
              const detail=q('#hero .fx-core-detail-r122'),heading=q('#hero .fx-reference-heading'),copy=q('#hero .hero-copy');
              const layers={
                glow:document.querySelectorAll('#hero .fx-core-live-r147-glow').length,
                flare:document.querySelectorAll('#hero .fx-core-live-r147-flare').length,
                beam:document.querySelectorAll('#hero .fx-core-live-r147-beam').length,
                prism:document.querySelectorAll('#hero .fx-core-live-r147-prism').length,
                shock:document.querySelectorAll('#hero .fx-core-live-r147-shock').length,
                orbits:document.querySelectorAll('#hero .fx-core-live-r147-orbit,#hero .fx-core-live-r147-orbit-b,#hero .fx-core-live-r147-orbit-c').length,
                sparks:document.querySelectorAll('#hero .fx-core-live-r147-spark').length
              };
              const native=document.querySelector('.fx-core-mobile-v55-canvas'),gl=native?.getContext('webgl2')||native?.getContext('webgl');
              return{
                version:root.dataset.fxLiveMotionR147,
                visual:root.dataset.fxLiveMotionVisualR148,
                layer:root.dataset.fxLiveMotionLayerR147,
                legacy:root.dataset.fxLiveLegacyCopyR148,
                safe:root.dataset.fxLiveSafeLaneR147,
                gap:parseFloat(root.dataset.fxLiveSafeGapR147||'0'),
                frame:root.dataset.fxLiveMotionFrameR147,
                detail,heading,copy,layers,
                heroOverflow:getComputedStyle(hero).overflow,
                glError:gl?.getError()
              };
            });
            console.log('R148B LIVE STATE',JSON.stringify(state));
            assert.ok(String(state.version).includes('r148'));
            assert.equal(state.visual,'reactor-prism-shock-orbits');
            assert.equal(state.layer,'mounted-r148');
            assert.equal(state.legacy,'visually-removed');
            assert.equal(state.safe,'active-r148');
            assert.ok(state.gap>=82,`safe gap too small: ${state.gap}`);
            assert.ok(state.copy&&state.copy.w<=1.1&&state.copy.h<=1.1,JSON.stringify(state.copy));
            assert.equal(state.copy.opacity,'0','legacy hero copy is not fully transparent');
            assert.ok(String(state.copy.clipPath).includes('inset'),'legacy hero copy is not clipped');
            assert.ok(state.detail&&state.heading&&state.heading.y-(state.detail.y+state.detail.h)>=82,JSON.stringify({detail:state.detail,heading:state.heading}));
            assert.notEqual(state.detail.filter,'none','r148 crystal luminance filter is not active');
            assert.ok(state.detail.filter.includes('brightness')||state.detail.filter.includes('drop-shadow'),state.detail.filter);
            assert.deepEqual(state.layers,{glow:1,flare:1,beam:1,prism:1,shock:1,orbits:3,sparks:6});
            assert.equal(state.heroOverflow,'visible');
            assert.equal(state.glError,0);

            const beforeTouch=await page.evaluate(()=>document.documentElement.dataset.fxLiveMotionFrameR147||'');
            await page.touchscreen.tap(156,330);await page.waitForTimeout(320);
            const touch=await page.evaluate(()=>({frame:document.documentElement.dataset.fxLiveMotionFrameR147||'',interaction:document.documentElement.dataset.fxLiveMotionInteractionR147||'',vector:document.documentElement.dataset.fxLiveMotionVectorR147||''}));
            assert.equal(touch.interaction,'active-r148');
            assert.notEqual(touch.frame,beforeTouch,'touch did not affect live reactor frame');
            assert.ok(touch.vector.length>8);

            await page.waitForTimeout(850);
            await page.evaluate(async()=>{
              const fire=(beta,gamma)=>window.dispatchEvent(new DeviceOrientationEvent('deviceorientation',{beta,gamma,alpha:0,absolute:false}));
              for(let i=0;i<9;i++){fire(45,0);await new Promise(r=>setTimeout(r,24));}
              for(let i=0;i<18;i++){fire(58,15);await new Promise(r=>setTimeout(r,28));}
            });
            await page.waitForTimeout(900);
            const gyro=await page.evaluate(()=>({state:document.documentElement.dataset.fxCoreGyroState,input:document.documentElement.dataset.fxCoreGyroInput,frame:document.documentElement.dataset.fxLiveMotionFrameR147}));
            console.log('R148B GYRO',JSON.stringify(gyro));
            assert.equal(gyro.state,'active');
            assert.ok(typeof gyro.input==='string'&&gyro.input!=='0.000,0.000');
            assert.ok(String(gyro.frame).endsWith('gyro'),`r148 optical layer did not select gyro source: ${gyro.frame}`);

            const cdp=await context.newCDPSession(page);
            const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            fs.writeFileSync('formatx-r148b-live-mobile.png',Buffer.from(shot.data,'base64'));
            assert.ok(fs.statSync('formatx-r148b-live-mobile.png').size>12000);
            assert.deepEqual(pageErrors,[],`page errors: ${pageErrors.join(' | ')}`);
            await browser.close();
            console.log('PASS: r148b live reactor is animated, single-layer, touch/gyro reactive, luminance-enhanced and legacy hero text is invisible behind the MAG.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload r148b live capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatx-r148b-live-mobile-${{ github.run_id }}
          path: ${{ runner.temp }}/r148/formatx-r148b-live-mobile.png
          retention-days: 14
