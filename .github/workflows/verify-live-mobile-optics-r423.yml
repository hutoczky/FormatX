name: Verify live r424 mobile MAG optics

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-live-mobile-optics-r423.yml'
      - 'docs/scifi-ui/scripts/formatx-core-mobile-v55.js'
      - 'docs/scifi-ui/scripts/formatx-current-mag-loader-r422.js'
      - 'docs/scifi-ui/scripts/formatx-crystal-organism-r326.js'
      - 'docs/scifi-ui/styles/formatx-current-mag-r422.css'
      - 'docs/scifi-ui/styles/formatx-core-shapeshifter-r337.css'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-r424-optics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify live r326 wrapper and r424 sharp native phone optics
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://formatxsuite.com'
          TMP="$RUNNER_TEMP/r424-live"
          mkdir -p "$TMP"
          ok=0
          for attempt in $(seq 1 45); do
            suffix="audit=${GITHUB_RUN_ID}_${attempt}"
            echo "r424 sharp live verification ${attempt}/45"
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/scripts/formatx-core-mobile-v55.js?${suffix}" -o "$TMP/wrapper.js" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/scripts/formatx-current-mag-loader-r422.js?${suffix}" -o "$TMP/current-loader.js" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/scripts/formatx-crystal-organism-r326.js?${suffix}" -o "$TMP/renderer.js" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/styles/formatx-current-mag-r422.css?${suffix}" -o "$TMP/current.css" \
              && curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$ORIGIN/scifi-ui/styles/formatx-core-shapeshifter-r337.css?${suffix}" -o "$TMP/sharp.css"; then
              if grep -Fq 'r424-sharp-organic-core' "$TMP/wrapper.js" \
                && grep -Fq 'retired-r424-native-shader-optics' "$TMP/wrapper.js" \
                && ! grep -Fq 'formatx-mobile-optics-r423.css' "$TMP/wrapper.js" \
                && grep -Fq 'direct-r326-r424-sharp-native' "$TMP/current-loader.js" \
                && grep -Fq 'fxCoreOpticsR424' "$TMP/renderer.js" \
                && grep -Fq 'brightness(1.12)' "$TMP/current.css" \
                && grep -Fq 'contrast(1.22)' "$TMP/current.css" \
                && grep -Fq 'scale:1 !important' "$TMP/current.css" \
                && ! grep -Fq 'blur(' "$TMP/current.css" \
                && grep -Fq 'r424 sharp optics' "$TMP/sharp.css" \
                && grep -Fq 'brightness(1.12)' "$TMP/sharp.css" \
                && ! grep -Fq 'blur(' "$TMP/sharp.css"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'PASS: live production serves r326 with r424 sharp native phone optics.'

      - name: Publish live r424 optics status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='Live r326 MAG serves sharp native r424 phone optics'
          else
            state=failure
            description='Live r424 phone optics verification failed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='FormatX live r424 mobile optics' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
