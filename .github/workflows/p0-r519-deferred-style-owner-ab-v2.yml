name: P0 R519 exact candidate proof

on:
  push:
    branches:
      - p0-r517-owner-76b79fe
    paths:
      - .github/workflows/p0-r519-deferred-style-owner-ab-v2.yml

permissions:
  contents: read

env:
  CANDIDATE_REF: p0-r519-apex-price
  CANDIDATE_SHA: 9272f47f4167485f26906172fe626aef13909f55

jobs:
  source-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Verify source and exact product diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "0c983b25cbabecbdd73c8df760638c0c7554663b"
          test -z "$(git status --porcelain)"
          node --check docs/scifi-ui/scripts/formatx-apex.js
          test "$(git diff --name-only HEAD^ HEAD)" = "docs/scifi-ui/scripts/formatx-apex.js"
          grep -q "if (persist || shellLanguage !== language) updatePrice();" docs/scifi-ui/scripts/formatx-apex.js
          test "$(grep -c '^    updatePrice();$' docs/scifi-ui/scripts/formatx-apex.js || true)" = "0"
      - name: Start exact R519
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));
          delete c.ai; delete c.routes; c.workers_dev=true;
          fs.writeFileSync('billing-worker/wrangler.r519.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts >/dev/null
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r519.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r519-source-worker.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/r519-source-worker.log" || true
          exit 1
      - name: Prove HUF EUR and EN pricing interactions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            const response=await page.goto('https://formatxsuite.com:8787/?r519_pricing=1',{waitUntil:'domcontentloaded',timeout:60000});
            assert(response?.status()===200,'homepage status');
            await page.waitForFunction(()=>document.documentElement.dataset.fxApex==='controller-performance-v2',null,{timeout:15000});
            const initial=await page.evaluate(()=>({
              lang:document.documentElement.lang,
              price:document.getElementById('preview-main-price')?.textContent||'',
              checkout:document.getElementById('preview-checkout-link')?.getAttribute('href')||''
            }));
            assert(initial.lang==='hu','default language '+JSON.stringify(initial));
            assert(/15\D*900/.test(initial.price),'static HUF price '+JSON.stringify(initial));
            assert(initial.checkout.includes('currency=HUF'),'default HUF checkout '+JSON.stringify(initial));

            const trigger=page.locator('[data-organism-open="pricing"]');
            await trigger.scrollIntoViewIfNeeded();
            await trigger.click();
            await page.waitForFunction(()=>{
              const root=document.getElementById('fx-organism-console');
              const panel=document.querySelector('[data-organism-panel="pricing"]');
              return root && !root.hidden && panel && !panel.hidden;
            },null,{timeout:15000});
            await page.locator('[data-organism-panel="pricing"] [data-currency="EUR"]').click();
            await page.waitForFunction(()=>document.getElementById('preview-main-price')?.textContent.includes('44'));
            let state=await page.evaluate(()=>({price:document.getElementById('preview-main-price')?.textContent||'',checkout:document.getElementById('preview-checkout-link')?.getAttribute('href')||''}));
            assert(state.checkout.includes('currency=EUR'),'EUR checkout '+JSON.stringify(state));

            const langToggle=page.locator('[data-language-toggle="true"]');
            await langToggle.click();
            await page.waitForFunction(()=>document.documentElement.lang==='en');
            state=await page.evaluate(()=>({lang:document.documentElement.lang,price:document.getElementById('preview-main-price')?.textContent||'',checkout:document.getElementById('preview-checkout-link')?.getAttribute('href')||''}));
            assert(state.lang==='en','EN toggle '+JSON.stringify(state));
            assert(state.price.includes('44'),'EN price '+JSON.stringify(state));
            assert(state.checkout.includes('currency=EUR')&&state.checkout.includes('lang=en'),'EN checkout '+JSON.stringify(state));
            assert(errors.length===0,'browser errors '+errors.join(' | '));
            console.log('R519_PRICING_PASS',JSON.stringify({initial,state}));
            await context.close(); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

  desktop-x5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Start exact R519
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r519.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts >/dev/null
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r519.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r519-desktop-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r519-desktop-worker.log" || true; exit 1
      - name: Measure five fresh desktop Chrome processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r519-desktop
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),{chromium}=require('playwright');
          async function one(i){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900},locale:'hu-HU',colorScheme:'dark'}),p=await c.newPage();
            await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.paint.push({n:e.name,t:e.startTime}))).observe({type:'paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.lcp.push(e.startTime))).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)window.__m.shift.push(e.value)})).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.long.push(e.duration))).observe({type:'longtask',buffered:true})}catch{}});
            const r=await p.goto(`https://formatxsuite.com:8787/?r519_desktop=${i}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(3200);
            const x=await p.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(e=>e.n==='first-contentful-paint')?.t??0,lcp:window.__m.lcp.at(-1)??0,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),longtasks:window.__m.long,ttfb:n?.responseStart??0,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||''}});
            await c.close(); await b.close(); return{run:i,status:r?.status()||0,...x};
          }
          (async()=>{const rows=[];for(let i=1;i<=5;i++)rows.push(await one(i));console.log('R519_DESKTOP_X5',JSON.stringify(rows,null,2));fs.writeFileSync('artifacts/r519-desktop/results.json',JSON.stringify(rows,null,2));const fail=rows.filter(r=>r.status!==200||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.apex!=='controller-performance-v2');if(fail.length)throw new Error('R519 desktop target failures '+JSON.stringify(fail));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r519-desktop-x5
          path: artifacts/r519-desktop/
          retention-days: 30

  mobile-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing-worker/package-lock.json
      - name: Start exact R519
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          npm ci --prefix billing-worker
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('node:fs'),c=JSON.parse(fs.readFileSync('billing-worker/wrangler.jsonc','utf8'));delete c.ai;delete c.routes;c.workers_dev=true;fs.writeFileSync('billing-worker/wrangler.r519.json',JSON.stringify(c,null,2)+'\n');
          NODE
          echo '127.0.0.1 formatxsuite.com www.formatxsuite.com' | sudo tee -a /etc/hosts >/dev/null
          (cd billing-worker && nohup npx wrangler dev --config wrangler.r519.json --ip 127.0.0.1 --port 8787 --local-protocol https > "$RUNNER_TEMP/r519-mobile-worker.log" 2>&1 &)
          for i in $(seq 1 60); do curl -kfsS -H 'Host: formatxsuite.com' https://127.0.0.1:8787/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/r519-mobile-worker.log" || true; exit 1
      - name: Measure mobile matrix independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/r519-mobile
          node <<'NODE'
          'use strict';
          const fs=require('node:fs'),{chromium}=require('playwright');
          const sizes=[[320,568],[360,800],[375,812],[390,844],[412,915],[844,390]];
          async function one(w,h){
            const b=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-certificate-errors']});
            const c=await b.newContext({ignoreHTTPSErrors:true,viewport:{width:w,height:h},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'hu-HU',colorScheme:'dark'}),p=await c.newPage();
            await p.addInitScript(()=>{window.__m={paint:[],lcp:[],shift:[],long:[]};try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.paint.push({n:e.name,t:e.startTime}))).observe({type:'paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.lcp.push(e.startTime))).observe({type:'largest-contentful-paint',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>{if(!e.hadRecentInput)window.__m.shift.push(e.value)})).observe({type:'layout-shift',buffered:true})}catch{}try{new PerformanceObserver(l=>l.getEntries().forEach(e=>window.__m.long.push(e.duration))).observe({type:'longtask',buffered:true})}catch{}});
            const r=await p.goto(`https://formatxsuite.com:8787/?r519_mobile=${w}x${h}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3200);
            const x=await p.evaluate(()=>{const n=performance.getEntriesByType('navigation')[0];return{fcp:window.__m.paint.find(e=>e.n==='first-contentful-paint')?.t??0,lcp:window.__m.lcp.at(-1)??0,cls:window.__m.shift.reduce((a,b)=>a+b,0),tbt:window.__m.long.reduce((a,d)=>a+Math.max(0,d-50),0),ttfb:n?.responseStart??0,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,apex:document.documentElement.dataset.fxApex||'',mobileMarker:document.documentElement.dataset.fxApexMobileR294||''}});
            await c.close();await b.close();return{viewport:`${w}x${h}`,status:r?.status()||0,...x};
          }
          (async()=>{const rows=[];for(const [w,h] of sizes)rows.push(await one(w,h));console.log('R519_MOBILE_MATRIX',JSON.stringify(rows,null,2));fs.writeFileSync('artifacts/r519-mobile/results.json',JSON.stringify(rows,null,2));const fail=rows.filter(r=>r.status!==200||r.lcp>=2000||r.cls>=.05||r.tbt>150||r.ttfb>500||r.overflow>2||r.apex!=='controller-performance-v2'||r.mobileMarker!=='ready-after-defer-chain');if(fail.length)throw new Error('R519 mobile target failures '+JSON.stringify(fail));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r519-mobile-matrix
          path: artifacts/r519-mobile/
          retention-days: 30
