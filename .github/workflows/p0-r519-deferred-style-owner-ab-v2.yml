name: P0 R519 CSS scheduler proof

on:
  push:
    branches:
      - p0-r517-owner-76b79fe
    paths:
      - .github/workflows/p0-r519-deferred-style-owner-ab-v2.yml

permissions:
  contents: read

jobs:
  scheduler-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mode:
          - batch
          - sequential
        replica:
          - 1
          - 2
          - 3

    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v5
        with:
          ref: p0-r517-owner-76b79fe
          path: diag
          fetch-depth: 1

      - name: Checkout exact R518 candidate
        uses: actions/checkout@v5
        with:
          ref: p0-r518-apex-buildtmp
          path: candidate
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/billing-worker/package-lock.json

      - name: Verify exact candidate and run scheduler proof
        shell: bash
        working-directory: candidate
        env:
          CSS_MODE: ${{ matrix.mode }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0c983b25cbabecbdd73c8df760638c0c7554663b"
          test -z "$(git status --porcelain)"
          bash ../diag/diagnostics/p0-r519-css-scheduler-ab.sh

      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r519-css-${{ matrix.mode }}-r${{ matrix.replica }}
          path: candidate/artifacts/r519-css-scheduler/
          retention-days: 30
