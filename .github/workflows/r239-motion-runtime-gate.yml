name: r239 reduced-motion runtime gate

on:
  workflow_run:
    workflows: ["Prepare or deploy FormatX production"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: formatx-r239-motion-runtime-gate
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Move pure visual runtimes behind the reduced-motion gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/scifi-ui/index.html')
          html = path.read_text(encoding='utf-8')

          if 'id="fx-motion-runtime-r239"' in html:
              print('r239 motion runtime gate already present')
              raise SystemExit(0)

          start_marker = '  <script defer data-fx-core-real3d="true" src="./scripts/formatx-core-real3d-v20.js'
          end_marker = '  <script defer data-fx-desktop-apex-r181-loader="true" src="./scripts/formatx-desktop-apex-loader-r224.js?v=20260819-r224"></script>'

          start = html.find(start_marker)
          if start < 0:
              raise SystemExit('r239 start marker not found')
          end_start = html.find(end_marker, start)
          if end_start < 0:
              raise SystemExit('r239 end marker not found')
          end = end_start + len(end_marker)

          block = html[start:end]
          expected = [
              'formatx-core-real3d-v20.js',
              'formatx-live-heartbeat-r155.js',
              'formatx-signature-system-r185.js',
              'formatx-seamless-enforcer-r159.js',
              'formatx-living-energy-r168.js',
              'formatx-award-narrative-r175.js',
              'formatx-soty-continuity-r179.js',
              'formatx-desktop-apex-loader-r224.js',
          ]
          for name in expected:
              if name not in block:
                  raise SystemExit(f'missing visual runtime in gate block: {name}')

          indented = '\n'.join('    ' + line.lstrip() for line in block.splitlines())
          replacement = (
              '  <template id="fx-motion-runtime-r239" data-fx-motion-runtime-r239="true">\n'
              + indented
              + '\n  </template>\n'
              + '  <script defer data-fx-motion-runtime-loader-r239="true" src="./scripts/formatx-motion-runtime-loader-r239.js?v=20260819-r239"></script>'
          )

          html = html[:start] + replacement + html[end:]
          path.write_text(html, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          if final.count('id="fx-motion-runtime-r239"') != 1:
              raise SystemExit('r239 template count invalid')
          if final.count('data-fx-motion-runtime-loader-r239="true"') != 1:
              raise SystemExit('r239 loader count invalid')
          for name in expected:
              if name not in final:
                  raise SystemExit(f'r239 compatibility token lost: {name}')
          print('PASS: r239 motion-only runtimes are gated behind prefers-reduced-motion.')
          PY

          if git diff --quiet -- docs/scifi-ui/index.html; then
            echo 'No r239 commit required.'
            exit 0
          fi

          git config user.name 'FormatX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/scifi-ui/index.html
          git commit -m 'r239 skip pure visual runtimes in reduced-motion mode'
          git push
