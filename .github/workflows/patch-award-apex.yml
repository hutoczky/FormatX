name: Align award sitemap checks with apex canonical

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-award-apex.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate award sitemap checks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/validate-award-readiness.cjs')
          s=p.read_text(encoding='utf-8')
          old='https://www.formatxsuite.com/'
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale award sitemap URLs, found {count}')
          p.write_text(s.replace(old,'https://formatxsuite.com/'),encoding='utf-8')
          PY
          node --check .github/scripts/validate-award-readiness.cjs
          node .github/scripts/validate-award-readiness.cjs
          node .github/scripts/production-preflight.cjs >/tmp/preflight.json
          grep -Fq '"ready": true' /tmp/preflight.json
      - name: Commit award alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FormatX CI hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/scripts/validate-award-readiness.cjs
          git commit -m 'ci: align award sitemap checks with apex canonical'
          git push origin HEAD:master
